  `"모의고사 일단 풀고 오답한 것, 화학문제를 꾸준히 풀기 시작한 것, 조금씩 시간맞춰 푸는 것이 익숙해진 것, 자투리 시간에 밀리지 않고 풀수 있겠다는 생각이 든것" — Hcsg (26학년도 원광(약) 합격생)`,
  `"이번 주도 기출올인원을 풀며, 2000제 일부와 1500제 목차 복습도 진행했다. 저번 주에 화학 공부에 기복이 있어서 공부하는 시간대를 오전으로 조정했는데 더 집중해서 공부할 수 있었다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
  `"기출문제를 단원별로 풀면서 문제풀이 능력을 길렀음. 문제풀이 -> 해설 강의 -> 내용 정리 순으로 정리하면서 실력을키웠음" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"1) APS를 생각하면서 푸는 게 목표였는데 이번 실력점검 모의고사에서 허둥지둥하는 거 없이 차근차근 풀이함. 2) 핵심이론 외 문제를 풀면서 보충으로 설명해주시는 부분을 따로 정리함." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"기출올인원을 시작함. 새로운 문제를 풀며 접근 방법 떠올리는 연습을 했음. 2000제 코드1,2 문제 복습함." — 레고링 (26학년도 계명(제약) 합격생)`,
  `"기출올인원 문제를 풀면서 효율적으로 공부하기 위해 무조건 맞출 수 있을 것 같은 문제들은 강의를 수강하지 않았다. 불필요한 강의 수강 시간을 줄였다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
  `"이번주는 진도를 많이 나갔다. 다음주면 아마 2000제(1단원, 점군, 분광학 제외)를 다 풀것 같다. 표시했던 문제들을 우선적으로 보고, 문제들을 전체적으로 여러 번 풀 예정이다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"코드번호 1 2 3 복습 하면서 2000제 완강하였고, 다음주부터 기출올인원으로 넘어가겠습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"이번주는 다시 앞으로 돌아와 10단원부터 코드3을 수강하였다. 강의를 듣기 전에 코드1,2 문제들을 다시 풀어 주었다. 타임어택 모의고사에 대비해서 연습 모의고사도 풀어 주었다. 새로운 문제들을 풀어보면서 자주 하는 실수와 떠오르지 않는 AP를 모아두는 실수노트도 만들어 주었다. 이렇게 모아보니 확실히 어느 부분에 취약한지 한눈에 볼 수 있었다. 모의고사 보기 전에 한번 훑고 보니 이번주 모의고사도 비교적 수월하게 풀 수 있었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"이번주엔 화학 인강도 목표치만큼 들었다. 2주 전에 열심히 복습해서 이론은 훑지 않고 작년에 공부했던 타임어택으로 감을 좀 익혔는데, 막상 오늘 시험 봐보니 26/30인데 2개는 빠르게 쓰느라 계수 빼먹고 지수 숫자 헷갈려서 틀리고 1개는 기억이 흐려졌고 1개는 아예 접근을 못한 문제였다. 오늘 시험으로 속도 때문에 생기는 실수를 보완하고 나머지 2개의 개념을 바로잡아야겠다고 느꼈다. 저번부터 산염기에서 자꾸 틀리는거 같다." — 약대가쟝 (26학년도 단국(약) 합격생)`,
  `"2000제를 완강했다. 10월부터 기출문제를 풀고 싶어서 욕심을 좀 냈는데, 다행히 복습까지 잘 마무리할 수 있었다. 모의고사를 풀면서 속도가 많이 단축된 것을 느꼈고, 자주 틀리는 유형들을 정리해서 시험 전에 보고 들어가니 실수 없이 잘 치룰 수 있었다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"이상기체 열역학 파트와 전기화학 파트 문제풀이가 잘 되지 않아 일주일 중 초반에 불안감이 컸는데, 도망가지 않고 앉아서 해설강의를 들어가며 문제풀이를 하다 보니, 별거 아니라는 생각이 들면서 자신감이 붙게 되었다. / 앞단원의 기억이 흐려지고 있다고 느껴 선생님이 가이드해주신 대로 앞단원 풀이도 부담이 가지 않는 선에서 해보려고 하였다. / 토요일에 추가 연습 모의고사를 일단 풀어는 봤다." — 시계탑기린친구 (26학년도 강원(수) 합격생)`,
  `"시험에서 전기화학 문제를 만나면 살짝 애매하게 곤란한 느낌이 있었는데 1500제로 완벽히 내실을 다지고 문제를 풀어 익히니 생각보다 빠르고 쉽게 문제를 맞출 수 있어서 오히려 저의 강점 단원이 되었습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
  `"처음 공부할때 너무 어렵다고 생각했던 전기화학을 잘 정리한 것 같다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`
  ],
  유기:[
  `"몰랐던 내용을 처음으로 질문을 드려 해결했다. 시간을 너무 많이 쓴 점을 보완할 점이지만, 궁금한 점을 질문드려 해결했다는 점을 칭찬한다." — 단퓨프 (26학년도 목포(약) 합격생)`,
  `"지금까지 배웠던 걸 복습하니 좀 더 수월하게 공부할 수 있었고 풀었던 예제나 테스트를 다시 풀면서 놓친 부분이 없는지 점검했다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"꾸준히 조금씩 공부한 점. (학교 유기2도 공부하느라 "반드시" 공부할수밖에 없다.)" — Hcsg (26학년도 원광(약) 합격생)`,
  `"유기를 매일 공부했고, 저번 주 조금 아쉬웠던 유기2 단원 반응들 복습까지 병행했다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
  `"1) 꾸준히 2시간씩 공부함. 2) 단원별 문제풀이를 하면서 이론을 복습하고 부족한 부분을 채움." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"2시간을 나누어 초반은 아직 끝내지 못한 ch.24 아민 기본서를 풀었고, 두 번째는 밀린 산염기 파트 VF 복습을 했다. 산염기 갈피를 정말 못잡았었는데 한바퀴 돌리고 다시 VF 1-1,2회차를 다시 풀어보니 훨씬 정돈된 느낌이 들고 정답률도 많이 올라갔다. 앞으로 실전VF 진도 맞춰 개념 복습 뿐만 아니라 VF 문제를 다시 풀어볼 것이다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"∙ 처음부터 기본서 읽고 헷갈리는 내용은 강의 듣고 필기해놓은 걸로 보충해줌. 넘어갔던 단원별 예제를 다 풀어주고 다시 보고싶은 문제들은 모아서 정리해둠. 이해와 문제풀이가 다 잘되는 것 같아 다음주도 같은 방식으로 할 예정임" — 레고링 (26학년도 계명(제약) 합격생)`,
  `"VF 유기 진도에 맞춰 복습하고 7~9월 VF문제를 같이 풀어주었다. 그당시에는 뒤에서 배우는 내용들이라 해설을 봐도 이해가 안되어 남겨둔 내용들이 많았는데, 이제는 해설을 읽으면 이해가 되어서 오답하기에 한껏 수월하다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"기본서와 예제를 중심으로 차근차근 공부했다. 자주 헷갈리는 부분들을 노트에 정리하며 완전히 내 것으로 만들고자 애썼다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"저번주와 마찬가지로 스미스 예제, TEST 복습하면서 강의를 들었습니다. 유기 2 부분도 틈틈이 보면서 암기하고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"VF 유기 커리 처음 시작할 때 스미스로만 공부해서 1~4단원은 강의를 안들었다. 이번에 처음부터 복습하면서 스미스로만 공부해서 놓쳤던 부분을 약사랑 유기화학 강의로 채워주었다. 7월 VF 유기 문제를 다시 풀어보니 그 당시 틀렸던 문제들이 잘 풀렸다. 그리고 유기화학 단원에 퍼져있는 산염기 부분을 한번에 모아서 정리해주었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"7~9월 VF 문제들과 연습문제들을 다시 풀어보면서 알카인 단원까지 복습을 해줬다. 1회독을 하고 복습을 하니 이전에는 잘 와닿지 않던 개념들이 문제풀이에 더 잘 적용되는 것이 느껴졌다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"이제 한바퀴를 돌아서 새로운 내용이 없어서 정리한 내용을 기반으로 빠르게 공부를 할 수 있었습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
  `"첫 회독할때 산과 염기가 너무 헷갈리고 복잡하다고 생각했는데, 문제를 더 많이 풀어보면서 공부하니까 좀 더 잘 알게 되었다는 느낌이 들어서 뿌듯하다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`,
  `"다음주 범위까지의 예제 문제와 테스트 문제를 모두 정리하고 요약본 완성까지 마쳤다. 특히 fischer 투영도가 이해가 너무도 안갔었는데 이를 오랜시간을 투자해서 이해하는데 성공했다." — Akdow (26학년도 단국(약) 합격생)`,
  `"학교 유기화학2 시험범위 공부를 꾸준히 하며 유기화학을 놓지 않은 점" — Hcsg (26학년도 원광(약) 합격생)`,
  `"물성과 산도 파트 문제 복습을 하며 피드백대로 왜 틀렸는지 오답할 때 적어두고 실수 같은 부분은 실수 노트에도 정리했다. 또, 의식적으로 이건 이래서 산도가 크지라고 생각하며 추가로 기출문제도 풀었는데, 평소보다 소요시간은 더 걸렸어도 더 효율적으로 개념을 정리할 수 있었던 것 같다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
  `"부족했다고 생각했던 단원의 이론을 복습하고 VF 문제도 다시 풀었음. 한 번 더 틀린 문제는 따로 정리함." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"본격적으로 앞으로 돌아가 빠르게 복습하기 시작했다. VF 유기 문제들 다시 풀어보고 복습했다. 추가적으로 진도에 맞춰 최진규쌤 단원별 30문제도 풀어보았다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"이번 주도 별 탈 없이 유기화학은 매일 계획한 분량만큼 학습을 했다. 기본적인 내용들도 여러 번 보다보니 자연스레 암기가 되는게 확실히 보인다. 지금 진행중인 스미스 회독이 다음주 쯤에는 끝날 것 같은데, 그러면 예제 말고도 단원별 문제도 더 풀어봐야겠다." — 쿠리만쥰 (26학년도 5관왕 | 단국(약)·계명(제약)·삼육(약)·강원(약)·우석(약) 합격생)`,
  `"기본서 읽고 단원별 예제 문제를 전부 풀어줌. 매일 2시간 이상 유기화학 공부에 시간을 투자하고 있음." — 레고링 (26학년도 계명(제약) 합격생)`,
  `"헷갈리는 물성들을 조금씩 정리하고 있다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
  `"복습하면서 7~9월 VF문제를 같이 풀어주었다. 옛날에 어려워서 남겨뒀던 문제들까지 해결되니 한껏 수월하다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"기본서와 예제를 중심으로 차근차근 공부했다. 자주 헷갈리는 부분들을 노트에 정리하며 완전히 내 것으로 만들고자 애썼다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"매일 TEST, 스미스 예제 복습하면서 핸드폰 메모장에 반응 이름과 핵심 내용을 한문장으로 정리하고 있고 외우고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"앞쪽 유기화학 개념 파트 복습을 끝내고, 반응 파트는 사전 상담 때 가이드 해주신 것을 따라 최진규T의 매핑 강의를 수강하며 VF 문제를 복습해주었다. 산재되어 있던 반응들을 한번에 모아서 보니 눈에 잘 들어오고, 그 전에 잘 외워지지 않았던 반응들도 이번 기회에 모두 암기해주었다. 다음주부터는 최진규T의 기출 강의도 수강할 예정이다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"개념 2회독을 하고 문제를 더 풀어보면서 모호했던 개념들이 문제에 잘 적용되는 것이 느껴졌다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"약점이었던 파트를 다시 한번 돌아보며 보완했습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
  `"스미스 교재의 문제를 다시 풀며 복습하고 있는데 틀리는 문제 수가 훨씬 적어졌다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`,
  `"맵핑 강의를 이번주부터 듣기 시작했다. 확실히 정리하는 데 크게 도움이 되는 느낌이라 다음주부터 일주일에 3강씩 들으려 한다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"다시 한 번 정리본을 만들면서 1회독을 하고 정리본을 보며 다시 세부암기로 2회독 그리고 마지막으로 전에 봤던 테스트를 풀어보면서 3회독을 하며 많이 익숙해진 것 같다. 세부적이거나 추가적인 사안들만 잘 정리하면 크게 문제될 것 없을 것 같다." — Akdow (26학년도 단국(약) 합격생)`,
  `"루틴대로 꾸준히 2시간, 하루 20문제 이상 문풀을 했다. 또, 명명법과 반응도 자주 조금씩 보며 휘발되지 않도록 노력했다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
  `"1) 실전문제풀이 범위의 개념 복습 및 단원별 문제 풀이를 완료함. 2) 아침에 고정적인 시간을 정해두고 하는 과목이라서 단원별 문제풀이에 지장이 없었음." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"진규쌤과 VF 7,8월 분량을 복습하면서 이상하게 잘 안풀리고 틀리는 단원이 있었다. 원래대로는 ch.13 라디칼까지 복습하는게 목표였지만, 일단 진도나가길 멈추었다. 에폭사이드와 에터 제법과 반응을 다시 기본서부터 살펴보니 내가 제법과 고리열림 반응에 대해 완전히 오개념을 가진 것이 파악됐다. 일주일 진도를 채우지는 못했지만 그래도 놓쳤던 부분을 다시 채워넣어 다행이었다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"∙ 매일 두시간 이상 유기 기본서를 복습하고 덜 풀었던 단원별 문제를 다 풀어나가고 있음. 매커니즘 복습도 해주며 잊어버리지 않도록 해주고 있음." — 레고링 (26학년도 계명(제약) 합격생)`,
  `"알데하이드 케톤, 카보닐 알파 치환, 카보닐 축합 반응이 꽤 많이 숙지되어가고 있다. 맵핑으로 정리해 둔 자료를 이동하는 시간에 머리 속으로 떠올려보며 말로 연습하였다. 아침에 반응 백지복습을 통해 약점 파트를 확인할 수 있었다. 주간문제를 풀 때 실수를 하지 않았다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
  `"7월에 유기화학을 공부하면서 벽을 많이 느꼇던 Sn2, Sn1, E2, E1이 많이 수월해진것같아서 좋다. 그렇다고 여전히 쉽다고는 생각은 안들지만 예전보다는 한껏 수월해진것 같다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"기본서와 예제를 중심으로 차근차근 공부했다. 자주 헷갈리는 부분들을 노트에 정리하며 완전히 내 것으로 만들고자 애썼다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"저번주와 마찬가지로 매일 TEST, 스미스 예제 복습하면서 핸드폰 메모장에 정리한 내용 암기하는 식으로 공부하고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"매일 오전 2시간 반정도 유기 학습을 해주었다. 가장 좋아하는 과목으로 하루를 시작하니 전체 공부 집중력이 높아지고 하루 리듬이 안정적으로 유지되었다. 매핑 강의를 통해 반응물과 시약이 주어졌을 때 생성물을 예측하고, 반응물과 생성물이 주어졌을 때 필요한 시약을 도출하는 연습을 반복하면서 유기 반응에 더 익숙해졌다. 그리고 최진규T 기출 문제를 통해 문제 접근 방식과 전략에 대해 추가적으로 공부할 수 있었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"다른 과목을 공부하느라 입체화학은 복습을 못하고 시험을 봐서 그 부분에서 좀 틀렸는데 바로 다시 복습해서 이해했다. 나머지 단원들은 2번째로 보니 더 빠르게 볼 수 있어서 효능감을 느꼈다." — 약대가쟝 (26학년도 단국(약) 합격생)`,
  `"알코올 에터까지 복습하고 반응 지도를 그렸다. 1회독 때는 각 단원을 분절화 해서 외우기 바빴는데, 2회독부터 원리에 입각해서 여러 단원의 개념을 연결해가며 공부하니 훨씬 잘 외워지고 문제에도 잘 적용이 됐다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"유기화학도 공부 속도를 조금 내어보았다. 휘발되는 내용이 많지만 그래도 자주 보려고 노력했다. 반응을 계속 그리며 익숙하게 해보려했다." — 단퓨프 (26학년도 목포(약) 합격생)`,
  `"출제 빈도가 높은 유형의 문제들에 대해서 나올 수 있는 경우의 수를 최대한 모았습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
  `"입체화학이제일 헷갈리고 어려웠던 것들 중 하나였는데, 열심히 공부했고, 못보진 않았다고 생각이 드는 점수를 받아서 기쁘다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`,
  `"이번주 유기화학 공부는 여태 공부한 주들 중에서 가장 맘에 들었다. 처음 공부할 땐, 머릿속에 정리가 안되어서 어려움을 겪었는데 머릿속에 정리가 잘 안되어도 일단 모든 내용을 쭉 훑고 나서 강의도 듣고 복습하고, 문제를 풀고 또 다른 단원을 나가며 비슷한 부분이 있으면 떠올리고, 이러니 어느순간 머릿속에 쌓이는 것을 느낄 수 있었다. 특히, 문제를 풀며 정리가 많이 되었다. 앞으로도 처음엔 좀 어렵고 이해가 안된 것 같아도 여러번 그리고 복습하며 반복해봐야겠다. 또한 조급한 마음을 내려놓으니 더 공부가 잘 되었다." — 단퓨프 (26학년도 목포(약) 합격생)`,
  `"이번 주에 테스트 범위에 맞춰서 맵핑 강의를 수강한 뒤 기본서를 같이 복습했다. 유기화학도 원노트를 활용해서 자주 틀리는 부분이나 암기 사항을 정리하고 있다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"정리본 만들기와 암기 그리고 VF 테스트를 풀어보면서3번의 반복으로 암기 및 이해를 하려고 했다. 전에 공부했을 때는 정말 대충했구나라는게 느껴질 정도로 몰랐던 부분이 많이 발견되었는데 이제는 좀 이해했다라는 생각이 들었다." — Akdow (26학년도 단국(약) 합격생)`,
  `"학교 유기화학2 시험범위 공부를 꾸준히 하며 비전파인더 유기화학 문제를 꾸준히 푼 점" — Hcsg (26학년도 원광(약) 합격생)`,
  `"유기 역시 실수 노트와 약점 노트를 분리해서 작성해서 효율을 높였다. 또, 저번 주 입체화학 복습이 필요한 것 같아서, 하루에 5문제 정도로 나눠서 입체화학을 복습했다. 반응 단원에서도 기초가 되는 중요한 단원이라 주기적으로 약점 노트를 볼 예정이다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
  `"1) 매일 고정적인 시간에 유기 공부를 진행함. 2) 개념 복습 후 단원별 문제 풀이 그리고 다시 약사랑유기화학 강의안을 보면서 부족한 개념 보충하는 방식의 사이클로 공부함." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"오답노트와 실수노트를 유기에도 적용해보았다. 모르는 내용들을 주제별로 모아 한군데에 모아두니, 어디가 약점인지, 문제풀 때 무엇을 해야 실수를 줄이는지 더 명확해졌다. 그리고 반응들을 복습하며 출력한 맵핑 종이에 하나하나 그려보았더니, 누적복습 시에도 한눈에 보이고 복습 속도도 빨라 좋다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"∙ 같은 방법으로 유기화학을 복습중이다. 매일 2시간 이상 투자하고 있고 공부할수록 자신감이 쌓이는 공부를 하고 있는 것 같다." — 레고링 (26학년도 계명(제약) 합격생)`,
  `"아민까지 다시 한 번 정리를 하였고, 문제들을 통해 복습을 하였다. 유기2 명명법이 헷갈려서 명명법만 따로 정리를 했다. 유기1도 VF문제들을 통해 복습하였다. 이제 전체적인 복습까지 완료를 하였으니 앞으로는 유기화학을 2시간 동안 밀도있게 공부를 할 예정이다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
  `"전에 알코올과 에터도 너무 힘들어서 벌벌 떨었던 기억이 나는데, 지금 복습하면서 왜 그리 힘들어 했을까 싶기도 하다. 이렇게 쭉 복습해나가면 될것같다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"기본서와 예제를 중심으로 차근차근 공부했다. 자주 헷갈리는 부분들을 노트에 정리하며 완전히 내 것으로 만들고자 애썼다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"빠지는 날 없이 매일 유기화학 공부를 하고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"루틴대로 오전에 2시간 반정도 유기 학습을 해주었다. 알켄, 알카인, 유기금속 시약 반응을 매핑 강의를 통해 생성물과 시약을 예측하는 연습을 하며 반응 흐름을 정리해주었다. 이전 풀었던 문제들도 다시 풀어보며 반복적으로 실수하는 문제나 헷갈리는 문제를 약점노트를 작성했다. 이틀에 한번씩 공부하기 전에 약점 노트를 복습하는 시간을 따로 가졌고, 자주 봐서 익숙해진 덕분에 오래 걸리지는 않아서 30분정도 시간을 써서 복습했다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"1. 교재 복습 및 암기 2. 7~8월 VF문제 3. 10~12월 VF 문제 순으로 공부를 하고 있다. 개념이 공고히 잡혀가는 게 느껴진다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"오개념이 몇가지 있었는데 약사랑 유튜브 강의를 들으며 바로잡을 수 있었습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
  `"알켄과 알카인, 산화환원파트를 공부했다. 전에는 스미스 내용을 읽는데 시간이 많이 걸렸는데 이제는 일단 빠르게 대강의 내용을 잡고 선생님의 강의를 보고 슬라이드를 보며 다시 내용을 구조화했다. 그리고 다음날 전에 배운 내용을 보면 더 내용이 간략하게 느껴졌다. 이제는 금요일마다 푸는 문제의 진도를 따라가진 못하지만, 그래도 배운 부분까지는 거의 다 맞춰서 좋았다." — 단퓨프 (26학년도 목포(약) 합격생)`,
  `"테스트 공부는 기본서를 중심으로 하는 것이 좋을 것 같아서 평일에는 기본서를 복습하고 시간이 남거나 주말에는 맵핑을 수강하는 걸로 계획을 변경했다. 오늘 테스트를 볼 때 유기에서 막힘은 없었다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"이전과 마찬가지로 3단계를 거쳐 암기하는데 성공했고 특히 정리본을 만들면서 전날 정리했던 내용을 15분정도 복습하는 시간을 가져 까먹지 않게 익숙화했다. 그에 따라 유기화학이 많이 친숙해졌다." — Akdow (26학년도 단국(약) 합격생)`,
  `"학교 유기화학2 공부를 꾸준히 하며 비전파인더 유기화학 문제를 꾸준히 풀고 오답한 점, 그리고 어느 정도 모르겠는 것은 없는 점." — Hcsg (26학년도 원광(약) 합격생)`,
  `"유기도 매일 꾸준히 진도에 맞춰 해당 단원들을 예제를 풀며 공부했다. 아직 실수도 계속 나오고 있기에 밥 먹는 시간을 이용해서 실수 노트를 의식적으로 보면서 교정하려고 노력했다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
  `"1) 매일 2시간 이상 유기화학을 공부함. 2) 금요일과 오늘 실전문제풀이를 통해 내가 취약한 부분을 알아냄. 많이 틀려서 내 자신이 실망스러웠지만 지금 틀린 게 다행이라는 생각으로 화학처럼 원노트를 작성함." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"축합반응까지 개념 복습도 잘 했고 9월 VF 문제들도 복습하며 점검도 잘 한 것 같다. 11월모의 시험 끝나고 바로 복습하여 부족한 내용들을 메꾸었다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"∙ 이제 루틴이 된 '기본서 읽고 문제풀이' 패턴을 잘 지켰음. ∙ 맵핑 강의를 통해 앞부분 내용도 복습함." — 레고링 (26학년도 계명(제약) 합격생)`,
  `"전범위 모의고사를 풀때 전략적으로 유기화학을 먼저 풀어 주었다. 한문제가 기억이 안나는 참사가 나긴 했는데 어찌저찌 잘 풀어내긴 했다.." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"기본서와 예제를 중심으로 차근차근 공부했다. 자주 헷갈리는 부분들을 노트에 정리하며 완전히 내 것으로 만들고자 애썼다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"알코올 부분 유튜브, 기본서 보면서 보완하였습니다. 예제, 연습문제를 풀 때 빠르고 정확하게 풀 수 있도록 노력하고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"7-8월에 풀었던 문제들과 현재 풀고 있는 실전 문제들 중 틀린 문제를 약점노트에 정리하였다. 이전에 놓쳤던 개념과 반응들을 다시 점검할 수 있었다. 매핑 강의를 통해 반응을 복습해주고, 약사랑 유기화학 강의 들으면서 정리했던 내용도 함께 복습하며 명명법, 물성, 메커니즘을 다시 익혀주었다. 유기 2 들어가면서 그 당시 머리에 잘 안들어왔던 반응들도 이번에 확실하게 암기해주었다. 덕분에 이번 모의고사에서 유기화학 문제는 모두 맞췄다. 앞으로도 감을 잃지 않기 위해 지금 루틴 유지하면서 복습을 꾸준히 해줘야 겠다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"양이 많았지만 했던거라 회독이 빨라졌다." — 약대가쟝 (26학년도 단국(약) 합격생)`,
  `"10월 제공 문제들을 복습하면서 유기1 단원들에선 어느정도 자신감이 붙었다. 까먹지 않도록 그려둔 반응 지도를 바탕으로 누적 복습해줘야겠다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"빠른 시간에 집중해서 복습을 전체적으로 한 것 같아서 만족합니다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
  `"유기도 매일 2시간 이상을 공부했다. 유기2반응만 적어놨던 노트가 있어서 일단 반응들을 상기시키고, 차례로 메커니즘까지 그리며 복습했다. 꾸준히 공부하다 보니 감이 조금씩 올라오는 것 같아서 계속 복습하며 감을 유지하고자 한다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
  `"이번주는 유기화학 공부가 고비였다. 문제를 푸는데 뒤죽박죽 섞여 이대로는 안되겠다는 생각이 들어 RX파트부터 쭉 반응만 마인드 맵앱에 정리했다. 카테고리와 중요 내용만 작성하고 ppt내용을 활용해 그림을 붙여넣는 형식으로 진행해 생각보다 오랜 시간이 걸리진 않았다. 이걸 작성하고 나니 밥 먹을 때 빠르게 보는 등 빠르게 반응의 중요 부분을 훑을 수 있어 잘했다는생각이 든다." — 단퓨프 (26학년도 목포(약) 합격생)`,
  `"이번주도 테스트 범위를 기본서로 복습하며 공부했다. 벤젠 반응 부분은 자신 있어서 여유롭게 공부했다. 테스트에서 좀 오답이 많았지만 약점 단원이 뭔지 명확해서 오히려 좋았다. 주말에 케톤 알데하이드 맵핑을 들어서 보충했다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"유기는 매일 전날 분량을 15분에서 30분정도 복습하고 시작하니 내용이 더 친숙하게 다가왔다. 3단계 다만 반응과 암기해야할 것들이 적지 않다보니 다음주 2회독 범위가 마무리 되면 매일 10월 범위 기준으로 3일에 2회차씩 복습 분량을 잡고 복습 및 암기할 예정이다." — Akdow (26학년도 단국(약) 합격생)`,
  `"이제까지 유기화학 시험범위에 맞춰 쪽지시험을 잘 준비했고, 그 범위안에서 모르는 것은 거의 없는 것을 확인하였다." — Hcsg (26학년도 원광(약) 합격생)`,
  `"1) 공부시간: 매일 2~2.5시간 정도로 공부했다. 2) 학습루틴: 기본서 요약 부분으로 복습 → 문제풀이 → 부족 이론 재복습으로 공부했다." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"한바퀴 돌리며 맵핑을 완성해 놓았더니, VF 시험 전 한눈에 보며 복습할 수 있어 좋았다. 매주 시험전 시간을 투자해 빠르게 반응들을 복습하고 시험에 임해야겠다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"∙ '기본서 공부-예제 풀이-부족한 부분 강의 내용으로 보충-단원별 문풀' 순으로 진행하며 매일 유기 공부를 꾸준히 했음. 반응을 보며 전제척으로 비슷하다는 느낌을 받았고 부족한 유기2 파트도 다시 공부하면 충분히 보완이 될 것 같음." — 레고링 (26학년도 계명(제약) 합격생)`,
  `"유기화학은 학습을 하면할수록 견고하게 되어가고 있는 것 같아서 뿌듯하다. 기본적인 내용들은 대부분 숙지가 되어 있는 것 같아 기본서를 통해 특이한 반응 시약들을 추가적으로 외워볼 생각입니다! (이번 시험에 나온 CBS시약과 같은 것들)" — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
  `"기본서와 예제를 중심으로 차근차근 공부했다. 자주 헷갈리는 부분들을 노트에 정리하며 완전히 내 것으로 만들고자 애썼다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"TEST, 스미스 복습하면서 개인적으로 부족하다고 느끼는 단원 스미스 연습문제 풀면서 보완하고 있습니다. 이번주는 방향족, 카보닐 단원 위주로 복습하였습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"이번주는 매핑 강의를 마무리하며 전체 유기 반응에 대해 복습을 해주었다. 생성물을 예측하는 것보다는 반응에 필요한 시약 조건을 특히 헷갈려해서 반응의 시약을 채우는 연습에 중점을 두었다. 덕분에 이번 모의고사도 유기화학 문제를 모두 정확히 풀어낼 수 있었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"유기1까지 반응지도를 만들어서 매일 한 단원씩 복습해주었다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"내용이 너무 헷갈리고 복잡하고 외울것이 많아서 정리하고 열심히 외웠다. 매커니즘도 열심히 그렸다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`,
  `"9월에 정리해놨던 유기2 노트를 바탕으로 유기2 위주로 매일 공부하며 복습했다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
  `"이번주에 맵핑을 완강하고 기본서도 테스트 범위를 복습했다. 9월 테스트를 다시 풀 때는 막힘이 없었다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"매일 전날 정리한 것을 30분정도 복습하면서 시작하는것은 잘 잡혔다. 이제는 계속 반복 암기 , 복기를 하며 익숙화할 예정이다." — Akdow (26학년도 단국(약) 합격생)`,
  `"유기화학을 마지막 단원까지 큰 문제 없이 잘 버티며 공부하였다.(유기화학 2 성적도(A+) 잘 받았다.)" — Hcsg (26학년도 원광(약) 합격생)`,
  `"꾸준히 2시간~2시간 30분 공부함. 유기 2 범위를 2회독하면서 이해도를 높임." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"유기2부터 거꾸로 돌아가 전체 단원 복습을 시작하였다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"∙ 매일 2시간씩 유기화학 공부를 했음. 기본서 이론을 읽고 예제 문제를 푸는 루틴을 지켰음." — 레고링 (26학년도 계명(제약) 합격생)`,
  `"전체 범위 내용을 꾸준하게 학습하였다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
  `"아민까지 복습을 해준 후, 다시 앞단원 복습을 시작했다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"자주 헷갈리는 부분들을 노트에 정리하며 완전히 내 것으로 만들고자 애썼다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"이번주도 복습, 스미스 문제 풀이 하면서 아민 부분이 부족한것 같아 따로 공부하였습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"아직 반응의 숙련도가 부족한 유기2부터 최진규 기출문제 풀이를 시작하였다. 매핑 복습도 병행하면서 생성물, 반응 시약 예측하는 연습도 꾸준히 해주었다. 헷갈리는 반응은 단순 암기보다는 기본서에서 메커니즘을 찾아서 다시 그려보며 원리를 이해하면서 암기했다. 이렇게 하니 훨씬 잘 이해됐다. 7~9월에 1회독 할 때 생성물만 외우고 넘어갔던 것을 이번에는 메커니즘까지 암기하며 보충해주었다. 또한 VF 문제를 복습하며 계속 헷갈리는 문제를 약점노트에 정리해서 암기하려고 노력했다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"유기 2까지 2회독 복습을 끝마쳤다. 확실히 1회독보다 진도도 빨리 나가고 문제풀 때도 덜 헷갈린다." — 약대가쟝 (26학년도 단국(약) 합격생)`,
  `"유기 정말 힘들었지만 매일 2시간씩 공부량을 유지해서 전범위 2회독을 마쳤고, 맵핑지까지 완성했다. 이제 전범위 복습을 꽤 빠르게 할 수 있게 되었다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"방향족 파트는 어렵고 양이 많고 외울 것도 많다고 느껴 사실 이번주에 공부하기 전에 조금은 막막했었는데 한 주동안 잘 공부했다고 생각한다. 매커니즘을 쓰며 익숙하게 하고 원리를 생각하다보니 내용이 방대하게 느껴지지 않았던 것 같다. 시간이 많이 없어 유기화학 강의를 듣고 윤곽을 잡고 스미스 책을 빠르게 읽으며 예제를 풀고 마인드맵으로 바로 골격을 잡고 넘어가니 원래의 나의 공부 속도보다 빠르면서 깊이감 있게 공부할 수 있었다. 또한 연결되는 전에 배운 단원의 내용이 있지만, 헷갈리는 경우 바로 빠르게 마인드맵에서 주변 내용을 공부하고 넘어갈 수 있어서 좋았다." — 단퓨프 (26학년도 목포(약) 합격생)`,
  `"카복실산 유도체와 아민의 반응은 늘 헷갈렸기 때문에 열심히 공부해서 어느정도 자신감이 생겼습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
  `"유기 2까지 2회독을 마쳤다. 2회독 초반에는 좀 더 꼼꼼히 보고싶어서 모든 문제를 다 풀고 이해 안가는건 계속 붙잡고 있었는데, 편입의 공부법과 내신의 공부법이 다르다고 말씀해주셔서 좀 더 가벼운 마음으로 여러 번 반복해야겠다고 마음먹고 굵직한것부터 보고 또 보려고 노력했다. 다음번에 볼때는 더 많이 잘 알게 될 수 있을 것 같다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`,
  `"주어진 시간안에 최대한 진도를 나가기 위해 집중해서 공부했다. 시간이 없는 관계로 마인드맵은 방향족까지만 작성하고 알데히드 파트부터는 선생님께서 나눠주신 맵핑에다가 기억해야할 것을 메모하고 보았다. 확실히 내용이 한 눈에 들어와 정말 도움이 되었다. 알데히드와 케톤 파트는 계속 비슷한 메커니즘이 반복되는 느낌이었는데 하루가 지나면 금세 잊어버리곤 해서 계속 그리며 익숙하게 하도록 노력했다." — 단퓨프 (26학년도 목포(약) 합격생)`,
  `"이번 주는 그동안의 오답정리도 다시 보고 유기2 앞쪽 반응들은 백지에 그려가며 문제 풀 때 바로 생각날 수 있도록 복습했다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
  `"맵핑과 10월 테스트들을 복습하면서 이번주 볼 전범위를 대비했다. 조금씩은 유기화학에 감이 잡히고 있는 것 같다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"2일에 걸쳐 10월 유기 테스트 범위 1회차씩 암기 + 7월 테스트 문제 풀이+ 10월 테스트 문제 풀이를 하고있다. 유기는 앞으로 새로운 것을 하기보다는 해왔던 것을 계속 이런식으로 복습을 해서 체화하는데 집중할 것이다.항상 시작 15분정도는 전날 암기한 범위의 복습으로 시작한다.또 이번주와 다음주에 볼 전범위 테스트의 복기는 2회독정도 한 후 다시 한번 풀면서 정리하려고 한다." — Akdow (26학년도 단국(약) 합격생)`,
  `"1) 꾸준히 2시간~2시간 30분 공부함. 2) 구조화 암기법을 이용하여 전체적인 개념과 반응을 암기함. 바로 결과로 나와서 뿌듯했음." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"유기2부터 유기1까지 전범위 복습을 끝냈다. 잘 이해가 되지 않아 넘어갔던 부분들이 있었는데, 복습을 하며 놓쳤던 특정 개념이 들어오면서 비로소 이해되었다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"∙ 기본서의 남겨뒀던 유기2 부분까지 문제를 다 풀었음. ∙ 부족하다고 생각했던 유기2 파트를 복습을 통해 많이 익숙해졌다는 느낌을 받았음." — 레고링 (26학년도 계명(제약) 합격생)`,
  `"전체 범위 내용을 꾸준하게 학습하였다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
  `"알켄과 알카인 공부하면서 자신감이 많이 생겼다. 예전에는 시약에 따른 조건과 결과만 달달 외웠다면 이제는 손으로 직접 그릴수 있을만큼 많이 성장한것 같다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"아민까지 다시 한 번 전범위를 공부했다. 1회독 때는 테스트 일정에 쫓겨 유기2 후반부는 거의 이해하지 못한 채 넘어갔기 때문에 이제야 제대로 1회독을 마친 셈이다. 이제 시험 전까지 최대한 여러 번 볼 수 있도록 회독 속도를 높여야겠다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"매일 test복습, 스미스 예제 풀고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"기출문제 풀이를 하면서 반응 원리나 메커니즘을 외우지 않고 넘어갔던 부분들을 채워나갔다. 그리고 전날 약점 노트에 정리한 내용은 다음날 복습하면서 복습 - 문풀 - 강의 루틴으로 학습하니 더욱 효율이 올라갔다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"반응지를 외우고 VF 문제들을 계속 회독하면서 숙련도를 높이기 위해 노력했다. 전범위를 알고 회독하니 같은 문제라도 받아들이는 정보의 깊이가 점점 깊어지는 게 체감돼서 신기했다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"전반적인 복습을 통해서 유기화학의 감을 올렸고 동시에 익숙해 졌다고는 하지만 비교적 최근 공부를 시작했던 카복시산과 아민의 반응에 대해서는 복습을 더해주었습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
  `"아민 파트 위주로 공부하고, 유기1까지 전범위를 복습했다. 반응들은 자주 보면서 휘발되지 않도록 노력했다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
  `"내용 요약본을 전체적으로 보며 바로 떠오르지 않는 반응은 직접 표시해두고 회독했다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"전범위 복습을 마쳤고 vf파이널 테스트 2회분을 제외한 나머지 테스트들에 있는 문제들도 어느정도 체화에 성공했다. 복습을 온전히 마쳤으니 다음주는 final 2회차 분량을 다시 풀어보고 추가할 내용은 추가하며 계속 복습만 할 예정이다." — Akdow (26학년도 단국(약) 합격생)`,
  `"1) 꾸준히 2시간~2시간 30분 공부함. 2) 전체적으로 개념과 반응을 암기함. 3) 기본서 복습과 함께 기본서 예제도 다시 풀고 있음." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"지난 주 약간 감을 잃어버렸던 알코올/에터와 알켄 파트를 다시 VF 문제들을 풀어보며 감을 잡았다. 어느 정도 큰 틀이 완성된 듯하여 다음주도 이번주처럼 계속 VF로 복습하고 맵핑으로 전체 유기1,2 그림 잊지 않게 복습하고 이런 식으로 공부해야겠다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"∙ 7,8월의 유기화학 테스트 문제들을 전부 풀었음. 전범위 문제를 다 풀어주니 내용을 빠르게 복습할 수 있었음." — 레고링 (26학년도 계명(제약) 합격생)`,
  `"전체 범위 내용을 꾸준하게 학습하였다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
  `"VF 문제와 약사랑 유기화학 자료를 바탕으로 차근차근 공부했다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"매일 test복습, 스미스 예제 풀고 있고, 제공받은 요약 파일 보면서 암기하고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"이번주도 기출문제 풀이를 하면서 반응 원리나 메커니즘을 외우지 않고 넘어갔던 부분들을 채워나갔다. 전날 내용 복습 - 문풀 - 강의 - 약점 노트 정리 루틴을 유지하면서 학습해나갔다. 그 결과 이번 모의고사에서 문제 풀 때 정답에 확신을 가지고 다 맞출 수 있었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"11월 전범위 test 전까지 2회독을 마쳤고, VF 제공 써머리 자료를 참고해서 맵핑지를 다듬었다. 계속 반복하니 어느정도 응용력이 생긴 것 같고, 이번 모의고사에서도 유기화학을 다 맞을 수 있었다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"기본서에 단원별 문제들을 다시 풀면서 헷갈리는 부분이 나오면 개념으로 돌아가 복습한 뒤 유기 요약본에 표시하거나 기록해두는 식으로 공부하고 있다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"매주 토요일마다 맵핑으로 전단원 복습을 하고 있는데, 주기적으로 반복해서 보니 익숙하고 문제풀 때 반응속도도 더 빨라지는 듯하다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"저번주와 마찬가지로 매일 test복습, 스미스 문제 풀고 있고, 제공받은 요약 파일로 암기하고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"이번주도 기출문제 풀이를 하면서 반응 원리나 메커니즘을 외우지 않고 넘어갔던 부분들을 채워나갔다. 전날 내용 복습 - 문풀 - 강의 - 약점 노트 정리 루틴을 유지하면서 학습해나갔다. 반응 매핑 연습도 꾸준히 하면서 전체 반응에 대한 감을 잃지 않으려고 하였다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"카보닐 파트는 매커니즘을 많이 써보며 익숙하게 했다. 강의 영상을 보고, 해당 부분을 스미스로 공부하고, 이것을 반복한 것 같다. 카보닐 파트가 첨엔 어렵고 정리가 잘 안된다고 생각이 들어 다시 빠르게 한 번 보고 문제를 푸니 익숙해진 것 같다. 뒤에선 원리가 반복되고 있다고 느꼈다." — 단퓨프 (26학년도 목포(약) 합격생)`,
  `"반응 문제들을 계속 틀려서, 맵핑으로 매일 익숙해질 때까지 복습했다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
  `"저번주와 똑같은 방식으로 공부하고 있다. 기본서에 단원별 문제들을 다시 풀면서 헷갈리는 부분이 나오면 개념으로 돌아가 복습한 뒤 유기 요약본에 표시하거나 기록해둔다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"VF 문제들을 다시 풀며 놓쳤던 개념들을 다시 외우고 채워넣고를 반복하고 있다. 그리고 절대 잊어서는 안될 개념은 개념노트에 따로 정리해 시험 직전까지 볼 수 있도록 정리했다. 개념이 흔들리는 곳은 유튜브로 돌아가 일부 보충하기도 했다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"∙ 풀었던 문제를 다시 풀며 헷갈리는 내용을 정리하고 부족하다고 느끼는 부분은 기본서와 강의를 보며 채웠음. 전범위를 골고루 복습해줌." — 레고링 (26학년도 계명(제약) 합격생)`,
  `"카보닐 축합까지 복습을 완료했다. 진짜 많이 성장했다고 체감하는 요즘이다. 시약조건에 따른 결과만 단순 암기로 억지로 꾸역꾸역 문제를 풀던 예전과는 달리, 손으로 물흐르듯 메커니즘을 그리고 문제를 풀고 있다고 느낀다. 다음주에는 아민까지 끝내고 다시 복습을 진행하겠다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"VF 문제, 기본서 예제들 중 헷갈리는 문제들만 모아서 노트를 만들어 복습했다. 추가로 윤관식T 써머리 겸 기출풀이 인강이 30강 정도로 꽤나 컴팩트해보여서 저번주와 이번주에 절반 정도 들었는데, 기출로만 구성된 100문제 중 8~90문제 가량이 술술 풀려서 굉장히 놀랍고 뿌듯했다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"저번주와 마찬가지로 test복습 제공받은 요약 파일로 암기하고 있고, 유튜브 보면서 핵심 반응들 복습하고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"유기2까지 복습하면서 전범위에 대한 개념이 어느정도 공고히 잡힌 것 같다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"이번주 유기화학공부가 부진했습니다. 그러나 하루 30분이라도 이론을 반바퀴씩 돌려서 잊은 부분은 없습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
  `"크게 어렵게 나오지 않는다면, 큰 얼개 위주로 다회독해서 내용들을 당연하게 만드는게 유리할 것 같아서 계속해서 VF문제를 풀면서 약사랑유기화학 자료를 보고있다. 어려워하던 단원들도 하다보니 암기가 되는 것 같다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`,
  `"매일 매일 조금씩이라도 공부하려고 노력함." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"앞단원은 이미 아는 내용들이라 할애를 많이 안했는데, 앞으론 유기 공부시간을 매일 가져야겠다고 생각됨." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"책을 늦게 구해서 기본서를 읽지는 않았지만 피트 때 사용했던 교재와 정리본을 이용해 진도를 맞춤." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"귀찮더라도 손으로 직접 매커니즘을 써보면서 공부하고 있음. 눈으로 보기만 하는것보다 더 학습 효과가 뛰어난 것 같음." — 쿠리만쥰 (26학년도 5관왕 | 단국(약)·계명(제약)·삼육(약)·강원(약)·우석(약) 합격생)`,
  `"기본서를 중심으로 매일매일 차근차근 예제를 풀다 보니 이해가 잘 되어서 좋았다. 유기화학을 공부하며 보람을 느낀 것은 처음이라 의미가 있었다. 아직 본격적인 반응은 시작하지 않아 여전히 가장 걱정되는 과목이지만, 차근차근 꾸준히 해나가면 정복할 수 있지 않을까 하는 기대감이 생겼다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"이번 주는 유기화학에 크게 신경을 쓰지 못했습니다. 권민 교재를 쭉 읽고 기본서를 읽으려 했는데 다음 주부터는 기본서와 병행해서 읽어야겠습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"잘한게 하나도 없다. 매일 조금씩이라도 유기화학 공부하기로 다짐했으면서 이번주 시험범위만 겨우 봤다. 생물과 일반화학, 그리고 토익(1~2일)에 너무 시간을 뺏긴 나머지 신경쓰지 못했다. 돌아오는 주에는 최소한 VF 다음 시험범위 복습과 내가 나가고 있는 진도의 한두 챕터는 끝내야겠다." — 약대가쟝 (26학년도 단국(약) 합격생)`,
  `"매일 1시간반씩 스미스 6판으로 독학을 시작했다." — Akdow (26학년도 단국(약) 합격생)`,
  `"매일매일 정해둔 분량을 지키며 공부함. 저번 주를 보완하고자 좀 더 기본서의 설명들을 꼼꼼하게 읽으면서 예제를 풀고 공부함." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"매일 꾸준히 유기화학 공부를 했다. 처음 유기화학 공부를 시작할 때 두려움과는 달리, 아직 초반이라 그런걸 수도 있지만 유기가 나름 재밌어 지기 시작한 듯 하다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"계획대로 이론 공부하고 문제를 풀었음. 진도를 맞추기 위해 노력하였음." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"일주일 간 컨디션이 안 좋은 날이 많다보니, 자연스럽게 유기화학을 가장 공부를 안 하게 되었다.  앞으로는 컨디션 관리를 잘 하여서 매일 기본서 예제 위주로 유기화학을 제대로 공부해야 한다.  유기화학을 틀리는 순간 합격이 멀어진다는 것을 잊지 말자." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
  `"기본서를 중심으로 매일매일 차근차근 공부했다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"권민 교재와 병행하여 스미스 기본서 공부를 시작했습니다. 스미스는 예제 문제만 풀면서 공부하고 있고 권민 교재로 빠르게 기억을 되살리고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"매일 1시간반씩 빠짐없이 스미스 6판으로 독학을 했으며 예제 문제에 이어 뒤에 단원 마무리 문제까지 추가로 풀었다." — Akdow (26학년도 단국(약) 합격생)`,
  `"VF 제공 문제를 풀면서 실수 할 수 있는 포인트들을 잘 생각하면서 차분하게 문제풀이를 진행함. 2회차 제공문제 해설을 함께 공부하면서 까먹었던 내용, 풀이하면서 기억이 왜곡된 이상한 풀이법을 정확한 개념으로 바로잡음" — 푸파 (26학년도 순천(약) 합격생)`,
  `"이번 주 유기화학 범위가 좀 많다는 것을 확인하고 유기화학에 저번 주보다 많은 시간을 투자했다. 매일 정해둔 분량의 문제를 풀고 인강 계획도 지켰으며, 전날 배운 내용을 매일 복습하면서 공부 계획을 잘 지켰다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"매일 꾸준히 유기공부를 할려고 노력했고, 실제로 그렇게 했다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"매일 1시간 유기화학 공부를 그대로 실천하였고, VF 제공 문제 리뷰 마무리까지 완료했다." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"-기본서와 약사랑 유기화학 슬라이드와 강의를 복습하다 보니 잊었던 내용들을 다시 알 수 있었다. 이렇게 꾸준히 복습하면서 빈틈을 메꿔가야겠다." — 쿠리만쥰 (26학년도 5관왕 | 단국(약)·계명(제약)·삼육(약)·강원(약)·우석(약) 합격생)`,
  `"기본서와 예제를 중심으로 매일매일 차근차근 공부했다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"스미스 책 학습을 하면서 선생님께서 말씀해주신 유튜브를 참고하였습니다. 확실히 설명을 들으니 좀 더 효율적으로 공부할 수 있었습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"1) VF 문제를 풀며 몰라던 지점, 미흡했던 지점 보완하는 시간을 가졌다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"이번 단원을 공부할 때는 예제를 골라서 풀지 않고 정말 하나도 빠짐없이 다 풀었다. 기본서에 있는 내용들도 예제 푸는대만 집중하지 않고 의식적으로 보려 노력했다. 이번에도 매일 정해진 양을 인강을 들으며 공부했다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"매일 꾸준히 1시간 씩 공부했고 구조에 대한 단원을 공부한만큼 여러 번 직접 그려보면서 공부했다." — Akdow (26학년도 단국(약) 합격생)`,
  `"매일 적어도 하루 한시간 유기 공부를 하였다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"기본서와 VF 등 여러 문제들을 접하고 나니, 오답을 하며 기존에 헤맸던 지점들도 앞으로 어떻게 풀어야 하는지 체계가 잡혔다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"매일 1시간씩 아침 공부로 유기화학을 시작하니 매일 유기화학 공부를 할 수 있었다." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"원래 실천하지 못했던 '매일 유기 공부하기'를 해냄. Ppt 공부와 기본서 복습을 꼼꼼히 하고 기본서 연습문제와 금요일 테스트를 통해 확인하는 과정을 거쳤음. 아는 내용이라고 대충하지 않고 중요개념을 체크하며 했음." — 레고링 (26학년도 계명(제약) 합격생)`,
  `"매일 꾸준히 90분 내외로 공부하기 위해 노력하였고, 기본서를 최대한 이해하려고 노력하였다. 기본서가 설명이 잘 되어 있어서 학습하기에 좋았고, 반응 파트를 들어갔으니 반응 노트를 정리했다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
  `"기본서와 예제를 중심으로 매일매일 차근차근 공부했다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"저번주와 마찬가지로 유튜브를 참고하며 계획한만큼 학습을 하였고, 말씀해주신대로 예제와 쉬운 문제들 위주로 공부하였습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"스미스 읽고 예제 풀기 -> VF 전범위 테스트 -> 놓쳤던 부분 스미스로 돌아가서 다시 보기 순으로 학습했다. 확실히 개념을 잘 정리할 수 있었다. 이번 문제에서 쐐기 구조식, 뉴먼 투영식, 피셔 투영식 간 변환이 빠르게 안되어 관련 내용을 추가로 찾아보고 정리했다. 또한 다음에 이런 문제가 나왔을 때 당황하지 않도록 전범위 문제에서 관련 문제를 선별해 반복해서 다시 그려보는 연습을 하였다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"저녁시간마다 꾸준히 기본서 회독을 했다. 그래도 잘 안외워지는 부분은 있었지만 원서를 읽으니 개념 정립이 더 잘된다." — 약대가쟝 (26학년도 단국(약) 합격생)`,
  `"혼자 급하게 진도를 나가다 보니, 풀케어 테스트도, 진도도 제대로 소화하지 못하고 있다는 생각이 들어, 입체화학부터 강의와 교재를 바탕으로 다시 공부했다. 또한, 이전까지 풀었던 문제들을 다시 풀어보면서 앞에 빠르게 들었던 부분들을 다시 복습했고, 테스트에서 오랜만에 괜찮은 점수를 받았다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"입체화학부분을 잘 알고 있다고 생각했는데, 거울상 이성질체랑 좌우반전된 분자의 차이를 구분하지 못하고 있었던 것을 알았다. 모르는걸 채워넣게 되었다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`,
  `"이번에도 예제를 빠짐없이 다 풀었다. 주말에는 지금까지 공부한 내용들 중 기본서에는 포함되지 않은 예외 사항이나 암기표를 모아서 적고 다시 복습했다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"지난번에 햇갈렸던 입체화학 부분을 복습해 주었다. 월요일날 유기화학공부를 못했기에 금요일날 평소보다 더 많이 해 주었다. 유기공부를 할때 귀찮지만 손으로 구조를 그리면서 공부할려고 노력했다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"매일 아침에 고정적으로 유기 공부를 하고 있음. 지난 주에 예제를 제때 풀지 못했는데, 이번 주엔 개념 공부를 하면서 바로 예제를 풀었음." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"반응에서 제일 중요하지만 제일 약한 파트가 친핵성 치환 반응인 만큼 평상시보다 유기화학에 더 많은 시간 투자를 했음." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"계획대로 '약사랑유기화학 강의 복습-스미스 기본서 읽기-예제 문제풀이-금요일테스트' 순으로 진행함. 이렇게 하니 기억에 더 잘 남는 게 느껴졌고, '매일 1시간 이상 유기화학 공부하기'가 습관화 되었다. 점점 공부할수록 자신감이 생김." — 레고링 (26학년도 계명(제약) 합격생)`,
  `"유기화학을 공부하다 보니 피트 때 했던 기억들이 새록새록 떠오르며 반응 단원을 복습할 때 스피드가 붙었다. 이에 지난주에 계획했던 단원보다 한 단원 더 진도를 나갈 수 있었다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
  `"이번 주 분량이 유독 많게 느껴져 지레 겁을 먹었는데, 계획한대로 나누어 차근차근 공부하니 크게 어렵지 않게 소화할 수 있었다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"이번주는 매일 최소 1시간 이상씩 유기화학 공부를 하였습니다. 권민 교재를 보면서 예전 감각이 어느정도 돌아오고 있는것 같습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"이번주는 매일 2시간씩 공부를 하였다. 친핵제 치환, 제거 반응을 공부하며 산염기 파트와 입체 화학 파트에 대한 복습이 필요하다고 느껴 누적 복습을 하였다. 유기화학은 진도를 나갈수록 앞 부분에 대한 학습 기반이 특히 중요하다고 생각한다. 이번주처럼 앞으로 누적 복습을 통해 앞부분을 잊지 않도록 꾸준히 학습할 계획이다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"유기 공부 시간을 아침으로 옮겨서 1주일 간 유기:생명:화학의 비율을 3:4:4로 맞추었다. 테스트 결과가 많이 아쉬웠는데, 치환 제거 반응에 대한 이해도가 부족했다기보다는 산-염기 기초가 부족했다는 생각이 들어 산염기를 복습했고, 다시 풀어보니 잘 풀렸다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"스미스 교재와 강의를 밀리지 않고 잘 공부한 것 같다. 문제 푸는 것도 한번에 몰아서 하면 너무 많은 것 같아서 조금씩 단원들을 섞어가면서 풀어나가고 있다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`,
  `"모든 예제를 매일 일정한 범위에 맞춰서 다 풀었고, 이전 단원과 연관되는 것 같은 부분은 다시 돌아가서 복습해가며 공부했다. 예외사항이나 스미스에 없는 내용은 계속해서 따로 기록하고 있다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"매일 아침 꾸준히 유기 공부를 이어갔고, 약사랑 유기화학 강의를 수강하면서 스미스 유기화학만으로는 부족했던 개념적인 부분을 보완할 수 있었다." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"본격적인 반응 단원들에 들어가면서, 인강을 듣고 내가 작년에 정리해둔 개념과 통합해 복습했음. 중요한 핵심 위주로 빠르게 복습 후 바로 연습문제들을 풀었는데 실력 기르기에 좋은 전략인 듯하다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"저번주에 정한 루틴대로 내용을 공부하고 예제 풀이를 실천함. 매일 2시간 이상 유기 공부에 시간을 투자했음" — 레고링 (26학년도 계명(제약) 합격생)`,
  `"이번에 알코올과 에터를 들어가기 전에 Sn2, Sn1, E2, E1을 여러 번 익히고 들어가줬다. 덕분에 메커니즘을 이해하는데 있어 문제가 없었다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"기본서 예제를 중심으로 차근차근 학습했다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"다음주면 권민 교재 1회독을 마칠것 같습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"기존 루틴에서 약사랑 유기화학 강의를 추가해 보충하니 산재되어 있던 지식이 연결되며 체계가 잡혔다. 동시에 자연스럽게 암기가 되어 유기반응 파트에 점점 자신감이 붙어 갔다. 알코올,에터 파트는 앞단원 할로젠화 알킬에서 배웠던 반응을 그대로 활용하는 거라 앞단원 복습도 철저히 하였다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"아침 3시간 유기공부를 고정으로 해두었고, 이번주도 잘 지켰다. 매일 공부 시작 전에 약사랑 강의에서 발췌한 필수적인 pKa 값들과 친핵체 및 강염기의 종류를 외우고 시작했다. 유기에 자신감이 점점 붙고 있다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"유기화학 강의를 듣다가 앞단원과 연계가 굉장히 큰 단원임을 느껴서 복습을 하는데 시간을 계속 투자하고 있다. 하루 십분정도 각 단원에서 한두문제씩이라도 풀어보려고 하고 있다. 산염기 단원을 다시 보면서, 결국 손으로 그려보면서 뭐가 더 안정한지 파악하는 연습을 많이 해보는게 중요하겠다는 생각이 들었다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`,
  `"모든 예제를 다 풀었고, 이전 단원과 연관되는 것 같은 부분들은 계속 복습하며 문제를 풀었다. 유기화학은 문제를 푸는 게 재밌어서 매일 공부하는 데에는 문제가 없었다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"이번주는 내용을 정리하고 2일정도 체화를 한 후 문제를 풀었다. 맞춘 개수는 크게 차이가 없더라도 풀고 나서 이게 맞나라는 생각이 들었던 여태까지와 다르게 풀었을 때 확실히 이 반응이 일어날거라는 생각을 가지고 풀어서 만족스러운 공부였던 거 같고 처음보는 반응들이 나왔어서 추가로 정리하면 될 거 같다." — Akdow (26학년도 단국(약) 합격생)`,
  `"알켄과 알카인 부분은 여러 차례 보았지만, 기본서 학습과 예제 풀이, 그리고 약사랑 유기화학 강의를 통해 다시 개념을 다졌다. 잘 알고 있다고 생각했던 단원이었지만, VF 단원별 문제 풀이를 통해 여전히 탄소 양이온 자리 옮김 반응의 적용을 제대로 하지 못한다는 것을 알게 되었다." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"알켄, 알카인까지 기본서 연습문제까지 잘 풀었음" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"약사랑 유기화학 + 스미스 기본서 예제 및 단원별 추가문제 + VF 유기화학 단원별 문제 학습 습관이 이제 잘 잡힌 것 같다. 이번 주 부터 매일 두시간 씩 유기화학 공부에 시간을 투자하니 날마다 유기화학 내용과 문제풀이에 익숙해지는 듯 하다. 일주일동안 약사랑 유기화학에 새로 올라오는 단원의 강의 공부 + 전단원 누적복습 을 개별적으로 진행중인데" — 쿠리만쥰 (26학년도 5관왕 | 단국(약)·계명(제약)·삼육(약)·강원(약)·우석(약) 합격생)`,
  `"∙강의-기본서-예제-금요일 테스트순서로 진행함. ∙무작정 외우기보다는 매커니즘을 그리며 이해하는 공부를 했음. 확실히 기억에 오래남는 것을 느낌." — 레고링 (26학년도 계명(제약) 합격생)`,
  `"매일 꾸준히 유기화학 공부를 했다. 특히 유기1에 해당하는 내용들의 물리적 성질을 전체적으로 정리하였다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
  `"저번주에 정리 못한 알코올과 에터를 포함하여 알켄과 알카인까지 정리를 해 주었음. 그 결과 확실히 덜 햇갈리고 내용들이 유기적으로 연결되기 시작함. 정리를 하면서, 뒷단원에서 공부한 내용을 가져와 앞에 같이 정리를 해 주었음." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"기본서 예제를 중심으로 차근차근 학습했다. 약사랑 인강으로 지난 내용을 빠르게 복습했다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"저번주 피드백처럼 책상에 앉으면 유기부터 1시간씩 공부하였습니다. 권민 교재 1회독을 마쳤고 기본서도 계획한 만큼 공부하였습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"저번주와 마찬가지로 스미스와 약사랑 유기화학 강의를 병행해서 공부하였다. 누적 복습을 통해 앞서 배운 단원과 이번 주 학습 내용을 연결하여 이해도가 올라갔다. 또한 VF 문제 풀이 과정에서 부족함을 느낀 산화,환원 반응을 스미스 12장과 강의로 보충해주었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"저번주에도 느낀 전공서마다의 차이를 어떻게 극복할까 생각하다가 작년에 김홍영 인강으로 공부했던 교재가 있어서 전공서에서 못 봤던 부분만 발췌해서 따로 공부했다. 거기에 유튜브 강의까지 보니 이번 시험에서도 가오존분해나 린들러촉매, KMnO4 등 전공서를 커버할 수 있었다." — 약대가쟝 (26학년도 단국(약) 합격생)`,
  `"매일 유기 공부 시간을 지켰고, 앞의 내용들을 까먹지 않게 틈틈히 복습해주었다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"계속 앞단원에서 부족한게 보여서 교재도 다시 읽고, 못풀고 지나온 문제도 다시 풀어나가고 있다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`,
  `"모든 예제를 다 풀었고, 주말에는 이전에 풀었던 테스트와 기본서를 병행해서 9단원까지 간단하게라도 복습하는 시간을 가졌다. 테스트를 다 맞아본 것은 2달을 통틀어 처음이라 기뻤다. 더 열심히 해야겠다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"따로 정리 노트를 만들고 익숙해질 때까지 메커니즘을 그려보고 결과를 외워 반응물을 보고 어떤 생성물이 나오는지 익숙화했다." — Akdow (26학년도 단국(약) 합격생)`,
  `"진도가 살짝 밀려 허겁지겁 끝낸 감이 있지만 그래도 방향족 반응 들어가기 전 시간을 투자해 라디칼과 컨쥬게이션 부분을 메꾸었다. 특히 방향족 화합물 퓨란, 피리미딘, 피리딘 애들에 대한 전반적인 이해가 잘 안되었는데, 올해들어 기본서와 인강을 병행하며 이들의 구조, 염기성, pKa값, 방향족성 등에 대해 제대로 이해했다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"∙굳어진 루틴대로 공부하며 내용을 학습함. 진행할수록 이해가 잘되는 느낌을 받음. ∙ 매일 유기 공부를 하며 불안감과 부담이 줄어듦" — 레고링 (26학년도 계명(제약) 합격생)`,
  `"매일 꾸준히 유기화학 공부를 했다. 피트에서 다루지 않는 비교적 새로운 부분인 유기2 내용들을 맵핑 형태로 정리했다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
  `"유기화학을 공부하면서 중요하다고 느낀점은 시약조건들이 중구난방인것들이 많기 때문에 기질과 시약조건들에 따른 결과물들을 먼저 머릿속에 큰 뼈대를 만들어 암기한 다음, 디테일을 채우는게 중요하다는 생각이 들었다. 그래서 일단 1회독을 하면서는 사소한 디테일에 신경쓰기보다는 개념의 이해 & 시약조건같은 굵직한 것들을 먼저 암기해 놓은 다음, 2회독하면서 디테일을 살리는 공부를 하는것으로 방향을 잡았다. 그래서인지 공부 효율이 많이 올라갔다는 느낌을 받았다(물론 아직 많이 부족하다)." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"기본서를 읽으면서 집중력을 높이기 위해 화학 개념 체크리스트처럼 유기 개념 체크 리스트도 만들었음(각 개념마다 가장 중요한 포인트 작성). 금요일 테스트 전 월~목의 누적 복습이 훨씬 더 수월해졌음." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"처음으로 주간 테스트가 잘 풀리는 느낌을 받았다. 전반적으로 감이 올듯 말듯 한 느낌이 드는데, 복습의 효과가 조금씩 나타나고 있는 것 같다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"매일 최소 1시간씩 기본서를 보면서 유기화학 test를 다시 풀어보며 복습했습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"공부 시간을 확보하기 위해 매일 가장 먼저 2시간~2시간30분정도 집중해서 공부했다. 앞단원 반응 정리한 것 빠르게 훑어 보기 -> 약사랑 유기화학 강의 -> 스미스 읽기 및 예제 -> 반응 한 장으로 정리하기’ 싸이클로 진행했다. 뒤로 갈수록 반응이 복잡해지고 양도 많아져서 강의로 먼저 이해하고, 스미스 읽고 문제를 풀면서 메커니즘을 손으로 그리면서 학습하니 더 빠르게 습득할 수 있었다. 이 과정 덕분에 VF 문제 풀이가 훨씬 수월해졌다. 앞단원들도 놓치지 않고 복습을 병행하니 작년에 유기 공부를 할 때 느꼈던 답답함 없이 훨씬 높은 이해도로 학습할 수 있었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"알켄 알카인이 양이 많고 어렵게 느껴져서 메커니즘을 하나하나 그려보며 복습을 해줬다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"진도를 열심히 나가려고 노력했다. 시간도 많이 늘렸다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`,
  `"전에는 조금 후순위로 밀렸었는데, 매일 꾸준히 의식적으로 2시간 이상씩 공부하려고 노력하니 유기화학 문제 풀고 메커니즘 그려보는 전체 공부 시간이 확실히 늘었다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
  `"매일 2시간 이상 공부했고 전날 공부한 내용을 복습하는 시간을 매일 가졌다. 이전 단원에 대한 언급이 나오거나 잘 기억나지 않는 것 같으면 바로바로 복습했다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"9월 개강 전 1주일간 방학동안 제대로 공부를 하지 않았던 유기화학을 미리 약사랑 유기화학 1강부터 21강까지 시청하고 모르는 내용은 스미스 기본서 읽으며 공부하고, 이를 기반으로 매주 쪽지시험 진도에 맞춰 공부한 점.(유기화학 과목을 공부할 수 있는 준비는 다 완료하였음)" — Hcsg (26학년도 원광(약) 합격생)`,
  `"9월이 되면서 매일 유기화학 공부 2시간을 지켜냈음. 기본서, 예제 풀이, 개념 체크리스트 정리 후 VF 단원별 테스트를 진행했고, 기본서로는 부족한 부분은 약사랑 유기화학으로 보완하면서 이번 주 유기화학 공부를 잘 마무리할 수 있었음." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"양도 많고 외울 게 많아보였던 단원이어서 조금 벅찰 것 같았지만, 또 의외로 다시 기억이 새록새록 나면서 재미가 붙는 단원이다. 이번주 할당량을 모두 채웠고 VF 9회차 피드백도 마쳤다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"강의를 듣고 ppt 내용도 함께 정리함. 금요일 시험 진도에 맞춰 내용을 공부하고 헷갈리던 내용의 이해와 암기를 실천함" — 레고링 (26학년도 계명(제약) 합격생)`,
  `"유기2 반응들이 휘발성이 커서 맵핑형태로 정리를 하고 있다. 자투리시간에 맵핑자료를 꾸준히 보고 있다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
  `"내용 정리하는데 시간이 좀 걸려서 미리 앞당겨서 공부를 더 했다. 이번주는 알데하이드와 케톤까지 공부를 해 주었다. 다음주에는 카복실산 유도체까지 해볼려고 한다. 유기화학의 여러 고비를 넘은것 같아서 그나마 행복하다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"기본서 중심으로 차근차근 공부했다. 매커니즘을 손으로 그려가며 익혔다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"기본서와 유튜브를 병행하면서 진도를 나가고 있습니다. 또한 귄민 교재로 반응들을 암기하고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"유기화학은 이제 공부 방법이 제대로 자리 잡았다. 저번주와 마찬가지로 매일 가장 먼저 공부해서 2시간 정도 학습 시간을 확보했고, ‘앞내용 복습 -> 강의 -> 스미스 -> 노트 정리’ 사이클도 그대로 이어 나갔다. 이렇게 하니 문제 풀 때 반응들이 바로바로 떠올라서 문제가 잘 풀려 기분이 좋았다. 그리고 강의를 통해 방향족 반응을 이번에 완전히 이해해서 더욱 즐거운 공부가 되었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"이번 EAS 반응은 공부도 잘됐고 잘풀려서 좋았다. 딱히 헷갈리는 개념도 없고 여기까지가 쉬운단원인가 생각된다." — 약대가쟝 (26학년도 단국(약) 합격생)`,
  `"방향족 화합물이 이전 단원들보다는 쉽게 느껴졌고, 메커니즘을 그리면서 공부하는 요령이 생긴 것 같다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"기본서의 내용을 생각하며 예제의 문제를 풀었다. 처음에는 기본서 내용이 눈에 잘 안들어왔는데 집에 있는 윤관식 선생님 기초책을 빠르게 훑고 읽으니 속도가 빨라지고 구조가 눈에 들어왔다." — 단퓨프 (26학년도 목포(약) 합격생)`,
  `"peet 이외의 범위를 처음으로 test를 보았기 때문에 약사랑 유기화학을 통해 이론 학습을 하였다. 작년 경성, 계명 시험과 작년에 수강한 인강을 고려해보았을 때, 선생님께서 유기는 기본서 예제문항만 풀 수 있으면 되는 수준이라고 이야기 해주신 게 어떤 의미인지 더 깨닫게 되었고, 약사랑 유기화학 강의가 최적화되어 있다는 것을 느꼈다. 강의 시간이 짧기 때문에 피트 범위도 꾸준히 보면서 불필요한 학습을 하지 않아야겠다." — 푸파 (26학년도 순천(약) 합격생)`,
  `"매일 2시간 이상 공부했고 전날 공부한 내용을 복습하는 시간을 매일 가졌다. 메커니즘을 최대한 그려서 이해하려고 노력했고 주말에 16-18단원에서 배운 반응들을 전체적으로 간단히 정리하며 복습했다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"매일 꾸준히 2시간 이상씩 공부하는 습관이 잡혔다. 목표 단원을 우선적으로 공부하고 저번 주 공부 단원도 맵핑 등으로 복습하는 루틴을 이어나가야겠다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
  `"매주 쪽지시험 진도에 맞춰 밀리지 않고 공부한 점. (PPT, 스미스 기본서를 먼저 보고 모르는 부분을 약사랑 유기화학 강의를 보며 보완하는 공부가 나에게 잘 맞는다는 것을 확인했다)" — Hcsg (26학년도 원광(약) 합격생)`,
  `"1) 매일 유기화학 공부 2시간을 잘 지켜냄. 2) 기본서 이론 + 예제 공부 후 약사랑 유기화학 강의를 통해 마무리함. 3) 유기1 중 취약단원이라고 생각했던 알코올과 에터 단원 복습도 완료함." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"알데히드, 케톤 유기2 부분이 유기1에 비해 덜 숙련되어 있어서 그런지는 몰라도 양이 많았다. 하지만 기본서와 인강, 간략 요약본까지 잘 챙겼다. 특히, 그동안 메커니즘을 등하시했었는데 그때문에 생각보다 잘 문제풀이가 원활하지 못했다. 이를 반복하지 않기 위해 직접 손으로 써봤는데 외우지 않더라도 한번 써보는 것이 단원 이해에 큰 영향을 미치는 것같다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"매일 두시간씩 꾸준히 유기화학 공부를 했더니 일요일인 오늘 부로 편입 유기화학 시험에 나올만한 단원들(탄수화물 단원 전까지) 스미스 기본서 진도를 다 나갔다. 마지막에 suzuki, heck반응 등등이 있는 단원들은 7월 학습플랜 상담때 말씀하셨던 것 처럼 반응의 시약과 이름 정도 위주만 적당히 학습하고 넘어갔다. 이젠 복습만 남았으니 누적복습을 꾸준히 해야겠다." — 쿠리만쥰 (26학년도 5관왕 | 단국(약)·계명(제약)·삼육(약)·강원(약)·우석(약) 합격생)`,
  `"금요일 시험 전까지 강의를 듣고 ppt 내용 정리하는 루틴 진행함. 헷갈리는 것들을 정리하고 암기하는 시간을 가짐." — 레고링 (26학년도 계명(제약) 합격생)`,
  `"유기2 내용을 빠르게 한 번 학습하고자 해서,카보닐 축합까지 맵핑 형태로 정리를 하며 학습을 이어나갔다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
  `"카보닐 알파치환까지 공부를 하고 정리까지 했다. 다음주에 유기화학 1회독과 아민까지 정리를 끝내야 겠다. 정리 끝나면 매일 꾸준히 보면서 익숙해질 예정이다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"기본서와 예제를 중심으로 차근차근 공부했다. 매커니즘을 손으로 그려가며 익혔다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"기본서를 25장(고리형 협동반응)까지 1회독을 끝냈고 TEST복습과 유튜브도 병행하며 공부하였습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"저번주와 마찬가지로 매일 가장 먼저 최소 2시간씩 학습하고, ‘앞내용 복습 -> 강의 -> 스미스 -> 노트 정리’ 사이클도 그대로 이어 나갔다. 강의에 나온 모든 반응들의 메커니즘을 여러번 그려가면서 학습하고, 최종 한장으로 정리해 여러 반응을 한번에 보려고 하였다. 그리고 유튜브 강의에서 관련된 앞 단원과 연결시켜주셨는데 그부분도 다시 복습해주었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"시험범위 페이지 안내엔 없었지만 카보닐 반응 기초부분까지 회독하느라 시간이 더 오래걸렸다. 하지만 확실히 이해를 해서 이번 시험에서도 1개밖에 안틀렸다. 이렇게만 계속 이어지면 유기화학은 걱정없을것 같다. 방대한 기본서를 이제 4단원정도 남겨놓으니 얼마 안되어 보이는 착각을 하곤 한다. 하지만 이건 그만큼 내가 유기화학을 잘 카테고리화 했다는걸로 생각한다. 마무리로 유튜브 강의까지 보니 더 이해가 잘되고 암기까지 할 수 있어 좋다." — 약대가쟝 (26학년도 단국(약) 합격생)`,
  `"매일 2시간씩 정해진 분량의 공부를 했다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"유기 공부를 제일 아침으로 변경하여 매일 2시간 30분 공부를 지켰다. 매일 꾸준히 하다보니 목표했던 2단원을 끝냈다. 또한 전에 피트할 때는 뭔 내용인지 이해 안가는데 진도 나가가기 급급해 그냥 외우기만 했던 내용이었는데 이제는 머릿속에서 어떤 상황인지 떠올리며 예제를 풀고 있다. 공부하다가 모르는 부분은 일단 ai의 도움을 받아 해결했다. 앞으로 그랬는데도 이해가 안가는 문제가 있으면 약사랑 유기화학 카페에 질문을 하려한다." — 단퓨프 (26학년도 목포(약) 합격생)`,
  `"공부할 때는 몰랐는데 시험을 쳐보니 카보닐,아민 파트가 좀 부족한 거 같아서 약사랑 유기화학 강의를 듣고 복습했다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
  `"계속 실력이 부족하다고 느껴서 하루에 3시간씩 투자해서 공부했다. 복습을 매일 조금씩이라도 전날 내용을 하려고 노력했다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`,
  `"매일 2시간 이상 공부했고 전날 공부한 내용을 복습하는 시간을 매일 가졌다. 그전까지는 주말에 반응들을 간단하게 총정리했는데 이번에는 테스트를 보기 전에 정리 해봤다. 테스트를 볼 때 저번주처럼 정리가 안된다는 느낌이 덜 들어서 좋았다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"매주 쪽지시험 진도에 맞춰 밀리지 않고 공부한 점." — Hcsg (26학년도 원광(약) 합격생)`,
  `"이번 주도 2시간씩 매일 루틴처럼 공부했다. 루틴이 잡혀가니 유기화학 공부하는 시간이 제일 좋을 정도로 밀도 있게 공부할 수 있었다. 또한, 공부하면서 실수했던 부분들을 간단히 적어놓은 노트를 보고 문제를 풀었는데 덕분에 반응은 실수 없이 잘 풀 수 있었다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
  `"시간이 없어서 약사랑 유기화학 수강 계획만 지킬 수 있었음. 약사랑 유기화학 자료로 내용 구조화+ 복습으로 최대한의 공부 효율을 냄." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"비록 유기1을 이번주도… 못 봤지만 급한대로 알데히드/케톤부터 유도체까지 유기2 부분 전체 복습하였다. 유기1보다 유기2를 더 안 외웠기 때문에 일단 급한 불부터 잘 껐다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"∙ 강의 듣고 기본서 내용을 학습함. 유기 공부에 2시간 이상 충분히 시간을 투자하고 개념도 복습함" — 레고링 (26학년도 계명(제약) 합격생)`,
  `"유기2 부분까지 전체 1회 학습을 완료하였다. 유기2 앞부분 내용들도 조금씩 정리해나가고있다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
  `"아민까지 공부를 다 하고 아민까지 정리도 끝냈다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"기본서와 예제를 중심으로 차근차근 공부했다. 매커니즘을 손으로 그려가며 익혔다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"스미스 예제, TEST 복습하면서 강의를 들었습니다. 학습 시간을 매일 2시간씩 지켰습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"매주 하던 방식대로 오전에 먼저 2시간 30분씩 학습하고, ‘앞내용 복습 -> 강의 -> 스미스 -> 노트 정리’ 사이클도 그대로 이어 나갔다. 유기 학습 시간을 단축하기 위해 반응의 생성물, 반응물, 시약만 핵심으로 한 장 요약해주었다. 그동안은 매커니즘까지 정리하느라고 오래 걸려서 이번엔 메커니즘은 손으로 여러 번 반복해서 빠르게 그려서 익히고, 정성 들여 요약하는 것은 핵심 반응만 해주니 시간을 줄일 수 있었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"스미스 교재를 읽으면서 예제를 풀고 약사랑 강의를 듣는 루틴으로 꾸준하게 공부했다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"매일 아침 2시간 반동안 유기를 공부하였다. 전에 peet를 준비할 때는 분명 그냥 뭔지 모르고 외웠던 내용인데 기본서를 읽으며 공부하니 확 시야가 넓어지는 느낌을 받았다. 유기도 마찬가지로 그날 공부한 내용을 a4에 정리하였다. 그리고 그것을 공부 시작 전에 훑어았더니 빠르게 앞 내용을 복기할 수 있어 좋았다. 유기도 화학처럼 체계적으로 순서를 지키며 풀려고 노력했다. 아직 쉬운 내용들이지만 그래도 스스로 의식하고 실천하려 한 것은 잘한 점 같다." — 단퓨프 (26학년도 목포(약) 합격생)`,
  `"피트 범위 밖의 내용들은 생각보다 제가 많이 부족하다는 걸 느껴서 약사랑 유기화학 강의를 들으면서 기본서와 함께 공부하고 반응을 따로 정리해서 짬짬이 복습했습니다. 반응물과 반응 조건만 봐도 생성물을 알 수 있도록 포커스를 맞추고 공부했습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
  `"유기가 너무 부족했어서 흐름을 다시 제대로 잡으려고 시간을 많이 투자했다. 앞부분의 흐름을 다시 제대로 보면서 익히려고 노력하다보니 뒷단원의 흐름도 계속 비슷하다는 생각이 들었다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`,
  `"이번 주 유독 생소한 내용과 많은 범위에 버거웠지만 해야 하는 공부량을 모두 해냈고 최대한 메커니즘과 원리를 이해하고 문제를 풀려고 노력했다. 패드에 지금까지 공부한 단원들을 모두 간단하게 정리해둬서 다음주부터 할 복습에 유용하게 활용할 수 있을 것 같다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"유기를 매일 최소 2시간으로 공부했고, 추가로 자투리 시간에 명명법이나 산도 비교 등도 포스트잇으로 적고 자주 봤다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
  `"꾸준히 2시간씩 공부함. 또한 이론 공부 - 기본서 예제 풀이 - 약사랑 유기화학 수강 사이클을 통해 학습함." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"∙ 유기2 내용들을 정리하고 예제 문제를 풀었음. ∙ 강의 완강하고 매커니즘 그리기 연습을 했음." — 레고링 (26학년도 계명(제약) 합격생)`,
  `"전체 범위 내용을 꾸준하게 학습하고 있다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
  `"정리해둔 반응들 위주로 여러 번 봐줬다. VF문제들과 함께 전체적으로 복습해야 겠다" — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"기본서와 예제를 중심으로 차근차근 공부했다. 매커니즘을 손으로 그려가며 익혔다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"스미스 예제, TEST 복습하면서 강의를 들었고, 명명법 부분 전체적으로 공부하였습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"VF 커리큘럼을 무리없이 소화해서 이번주에 유기 1회독을 마쳤다! 매일 2시간씩 학습하고 ‘앞내용 복습 -> 강의 -> 스미스 -> 노트 정리’ 사이클을 계속 이어온 덕분에 유기가 가장 자신 있는 과목이 되었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"드디어 아민단원까지 1회독이 끝났다. 작년에 유기2 특히 알돌, 아민단원을 부실하게 공부해서 오래걸리기도 했고 이해가 느렸지만 이번 시험에서 2등을 한거 보니 다른 분들도 어려웠나보다. 한바퀴를 돌리고 나니 작년에 헷갈려 했던 Sn, E 반응과 카보닐, 아민 단원이 쉽게 느껴진다. 왜 피트준비생 출신들이 유기를 효자과목이라고 하는지 알거같다. 지금 시점에서 필요한건 반응, 시약 단권화 정리와 빠른 회독을 통한 개념 굳히기라고 생각한다." — 약대가쟝 (26학년도 단국(약) 합격생)`,
  `"이번주 유기는 크게 잘 한 점이 없다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"생각보다 새롭게 보는 반응들이 많아서 정리하고 공부하는 데에 평소보다 더 많은 시간을 할애했고 덕분에 반응의 메커니즘과 포인트들을 체득할 수 있었습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
  `"한번 제대로 봤다는게 뿌듯하다. 정리하고 외우는게 문제긴 하지만 일단 뭔가 했다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`
  ],
  생활관리:[
  `"선생님께 궁금한 점들을 질문해 혼자 고민하던 부분이 사라졌다. 내가 공부하는 방식에 대해 자신감이 생기니 집중이 더 잘 되었다. 목,금,토의 공부가 흔들렸었는데 오늘 다시 루틴을 되찾았다. 루틴을 되찾고 집중해서 공부하니 오히려 마음이 편해졌다. 루틴이 망가졌어도 조금이라도 공부하려 노력했다." — 단퓨프 (26학년도 목포(약) 합격생) [1w2]`,
  `"오후에 집중이 너무 안되서 시간 날린 것 같다는 현타가 와도 원래 루틴대로 저녁공부까지 했다. / 플래너에 할일 하나를 완수하고 나서 간단하게 공부한 키워드나 아직 더 공부해야 할 키워드를 적고 지나갔다." — 시계탑기린친구 (26학년도 강원(수) 합격생) [4w3]`,
  `"6시 기상을 평일동안 거의 지켰고, 이번주부터 새로운 환경에서 공부하고 있다. 운동도 주 2회는 반드시 해주고 있다. 영양제도 계속 챙겨먹으며 감기나 컨디션 난조를 조심하고 있다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생) [9w8]`,
  `"스톱워치로 시간을 재며 생물 해설지를 탁구 치듯이 급하게 읽으며 모르는것만 표시해두었다가 나중에 찾으며 공부하니 다소 긴장하며 공부를 하게 되고, 너무 몰아서 공부하지 않고 매일 꾸준히 조금씩 나누니 늘어지지 않고 부담없이 생물60문제를 공부할수 있게 되었다. 또한 2000제의 30문제를 매일 스톱워치로 40분 이내에 풀려 노력하며 문제풀이 및 오답을 진행하니 기대했던 것만큼 빠르지 않고 의외로 시간이 꽤 걸리긴 하지만 그래도 밀리지 않고 꾸준히 할 수 있게 되었다." — Hcsg (26학년도 원광(약) 합격생) [5w6]`,
  `"컨디션이 안 좋은 한 주였지만, 공부 루틴 흐름이 깨지는 건 싫어서 할당된 과목 공부 시간을 줄이더라도 매일 세 과목 공부와 전체적인 흐름은 가져가려고 노력했다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생) [1w9]`,
  `"최소한의 공부량 지킴. 산책으로 스트레스 관리함." — 이번엔내차례 (26학년도 삼육(약) 합격생) [9w8]`,
  `"이번 긴 휴일동안 7~8월보다 더 철저하게 공부에 몰입해보려고 했다. 휴일 시작부터 3일간 목표치 이상의 공부량과 시간을 확보해 좋았다. 디스크때문에 운동을 미룰 순 없기에 헬스장도 꾸준히 갔다. 다음주도 최고로 몰입과 집중할 수 있도록 하자" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생) [1w9]`,
  `"∙ 충분한 수면시간 지키고 운동 시간을 줄여 컨디션을 회복하고 공부시간을 더 확보했음. 성취감 있는 공부를 했다." — 레고링 (26학년도 계명(제약) 합격생) [9w1]`,
  `"금요일부터 슬 연휴의 분위기가 느껴지고 나도 모르게 마음이 풀어졌지만, 그래도 최대한 평소의 루틴을 지키고자 노력했다." — 초록콩 (26학년도 순천(약) 합격생) [9w1]`,
  `"큰 이슈 없이 꾸준함을 유지하고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생) [6w5]`,
  `"마음이 불안한 와중에 생활패턴은 꼭 지켰다. 아팠던 월요일 빼고는 8시반~9시 사이에 일어났고, 9시 반에는 독서실에 앉아서 공부를 시작했다. 저녁에 12시에 돌아와 2시 전에는 잠자리에 드는 습관을 유지했다. 매일 밤 '오늘 만족한 학습’도 적으면서 공부에 대한 긍정적인 감정을 의식적으로 끌어올리려고 노력했다. 마음이 흔들려도 루틴만큼은 흐트러지지 않도록 끝까지 버텼다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생) [4w3]`,
  `"운동과 공부를 루틴대로 꾸준하게 했다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생) [9w8]`,
  `"사건 사고가 많은 주였지만 본분을 잊지 않고 할일을 했습니다." — 후회없이살자 (26학년도 강원(약) 합격생) [5w6]`,
  `"몸이 너무 피곤해서 매일 자는 시간을 조금 늘렸다. 공부 시간 사이사이 몸도 풀고 하늘도 보면서 쉬는 시간도 열심히 가졌다. 일주일에 두번씩 운동도 열심히 다녔다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생) [9w1]`,
  `"추석연휴 때 휴식했던 것 치고는 빠르게 다시 루틴으로 돌아온 것 같다. 가족여행을 잠깐 다녀왔는데 충분히 휴식이 된 기분이었고, 저번주에 비해 훨씬 화학 공부가 잘 되는 기분이 들었다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생) [9w8]`,
  `"추석 연휴임에도 크게 다를 것 없이 큰 틀에서의 생활 규칙을 잘 지켰다." — Akdow (26학년도 단국(약) 합격생) [5w6]`,
  `"밀리지 않고 꾸준히 일반화학 2000제를 다 끝낼 수 있겠다는 자신감을 얻게 되었다. 또한 2000제의 문제를 푸는데 필요한 배경지식이 결코 얕지 않고 중요하다는 사실을 오늘 깨달았다." — Hcsg (26학년도 원광(약) 합격생) [5w6]`,
  `"연휴 기간에 평소보다 잠도 더 자고 휴식시간도 조금 더 길게 가지며 의식적으로 충전하려고 노력했다. 결국 평소보다 공부시간이나 양은 조금 적었지만 매일 최소한의 공부 시간은 지키며 루틴은 놓지 않으려고 노력했다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생) [1w9]`,
  `"1) 학교 다니면서 공부하는 것보다 공부할 수 있는 시간이 많아서 공부 루틴을 지켜나갈 수 있었음. 2) 수면 시간, 패턴 깨지지 않음." — 이번엔내차례 (26학년도 삼육(약) 합격생) [9w8]`,
  `"추석동안 하루 정도만 살짝 느슨하게 공부하고 최선을 다했다. 화학에 몰두하느라 연휴가 어떻게 지나갔는지도 모르겠다. 시험결과에 개의치 않고 남은 기간동안 최선을 다해보자" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생) [1w9]`,
  `"추석 연휴였지만 목요일 제외하곤 평소처럼 공부 루틴을 지켰다. 5w6 특성상 규칙적인 루틴이 지켜질 때 보람을 느끼고 앞으로도 더 열심히 할 수 있는 원동력을 얻으므로, 다음 주도 꾸준히 매일 할 일을 해나가야겠다." — 쿠리만쥰 (26학년도 5관왕 | 단국(약)·계명(제약)·삼육(약)·강원(약)·우석(약) 합격생) [5w6]`,
  `"∙ 추석에 잘 먹고 잘 쉬며 피로 회복했고 커피를 보리차로 대체했다. ∙ 고민이었던 화학 학습방향에 대해 선생님과 상담을 해서 불안감을 해소할 수 있었음." — 레고링 (26학년도 계명(제약) 합격생) [9w1]`,
  `"토요일, 일요일, 월요일에 친척들을 만났지만, 최소한의 공부 시간 확보를 위해 하루에 3시간 정도는 무조건 공부를 하였다. 이제 집으로 다시 돌아왔기 때문에 다시 계획했던 대로 공부를 이어나갈 예정이다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생) [8w7]`,
  `"이번주는 운동을 3번 갔다. 추석이라 시간이 많이 뺏기긴 했지만 간간히 공부할려고 노력했다. 저번주에 못쉰만큼 푹 쉬었다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생) [5w6]`,
  `"가족모임 등에 참석하다보니 공부 시간이 많이 부족했다. 그래도 일정이 있는 날을 아예 쉬어버리지 않고, 남는 시간에는 최대한 원래 루틴대로 공부하고자 노력했다. 계획한 진도를 소화하기에는 모자른 시간이었지만 연휴동안 공부 감각을 잃지는 않은 것 같아 그나마 다행이다." — 초록콩 (26학년도 순천(약) 합격생) [9w1]`,
  `"연휴동안에도 변화없이 꾸준히 공부하였습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생) [6w5]`,
  `"한 주의 초반에는 루틴이 무너졌지만 바로 잡기 위해 해결 방안을 모색했다. 가장 개선해야 할 점은 독서실 도착 시간을 일정하게 하는 것이었다. 그전까지는 강제성이 없어도 스스로 잘 해왔지만, 시간이 지나면서 마음이 조금 풀여저서 ‘좀만 더 쉬자’하고 타협해 버렸다. 그래서 친구에게 부탁해 정해진 시간에 독서실 도착 인증하기를 하기로 했다. 사실 이 인증을 하지 않는다고 해서 큰 문제가 생기는 것은 아니지만, 누군가에게 확인을 받는다고 생각하니 스스로에게 ‘약속을 지켜야 한다’는 긴장감이 생겼다. 덕분에 익숙해진 환경에서 다시금 적당한 긴장감을 느껴 집중할 수 있게 되었다. 그리고 수면의 질도 높여 깨어있는 동안의 집중력을 올리기 위해 자기 전에 핸드폰 보지 않기를 실천하였다. 평소에 자기 전에 가만히 누워있으면 잡생각이 많아져 쉽게 잠들지 못해서 핸드폰을 놓지 못했었다. 그 대신 생물 리뷰 녹음본을 틀어놓고 복습한 내용을 되새기며 잠드는 것을 시도했다. 잡생각이 안나니 마음이 한결 편해져서 잠도 잘들고 자면서도 공부한다는 느낌에 좋았다. 효과가 생각보다 너무 좋아서 진작에 했어야 했는데 하는 생각이 들었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생) [4w3]`,
  `"연휴여서 이래저래 마음이 떴지만, 잘 잡고 매일 공부를 해나갔다. 독서실을 바꾸니 집중도가 더 올라간 것이 좋았다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생) [9w8]`,
  `"오랜만에 가족들 그리고 친구들과 시간을 보내며 삶의 감사함과 행복을 느끼며 에너지를 충전한 것 같습니다." — 후회없이살자 (26학년도 강원(약) 합격생) [5w6]`,
  `"너무 불안해서 어떻게 해야될지 선생님께 상담을 요청했다. 그냥 받아들이고 노력해야됨을 알게되어서 마음은 편하다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생) [9w1]`,
  `"취침 시간 빼고는 대략적인 규칙적인 생활루틴을 유지하고 있다.(7:30 기상,애니어그램 읽고 한줄 쓰기, 감사 한줄 ,오전오후 공부, 저녁식사 후 인터벌 러닝 후 저녁 공부) 안되면 어떡하지라는 생각이 들 때 의식적으로 어떻게 하면 더 잘할 수 있을지로 생각을 전환하였다." — 시계탑기린친구 (26학년도 강원(수) 합격생) [4w3]`,
  `"평일 루틴은 완벽했다. 저번주에 쉰 만큼 더 열심히 해야한다고 생각하며 계속 했다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생) [9w8]`,
  `"정신적으로 많이 지친 한주였어서 힘들때마다 푹쉬면서 체력 및 멘탈 관리를 했다." — Akdow (26학년도 단국(약) 합격생) [5w6]`,
  `"하루하루 해야할 것들에 최대한 집중하며 공부했던 것 같다. 컨디션도 의식해서 조절했다. 저녁에 몸이 피곤하면 아쉽지만 조금 일찍 마무리하고 다음 날 채우는 식으로 조절했다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생) [1w9]`,
  `"다시 운동을 시작하면서 공부에 더 집중이 잘 됨." — 이번엔내차례 (26학년도 삼육(약) 합격생) [9w8]`,
  `"그래도 하루 평균 순공부시간이 제일 길고 집중 잘되었던 한 주였다. 다음주도 이번 주처럼 자기 전까지도 공부를 놓치 않는 치열한 한주를 살아보자" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생) [1w9]`,
  `"∙ 시험기간이라 학교 도서관에 사람이 많아져서 다른 층으로 옮겨 새로운 환경에서 공부함. 자리를 바꿔주니 리프레쉬가 되고 스트레스가 덜했음." — 레고링 (26학년도 계명(제약) 합격생) [9w1]`,
  `"명절 연휴 이후에 공부 루틴을 완벽하게 회복하였다. 월~목요일에는 아침에 눈을 뜨자마자 독서실을 가기 전에 30분 동안 전 날 배운 내용을 복습하는 시간을 가졌다. 예전에는 눈을 뜨자마자 휴대폰을 확인하는 습관이 있었는데, 안 좋은 습관을 고쳐나가고 있다. 공부하는 시간 동안 컨디션을 좋게 유지할 수 있는 방법에 대해 많이 고민해봤고, 오전 10시~11시 쯤에 카페인 섭취를 하는 것이 가장 능률 향상에 좋았고, 이를 계속 적용해나가고 있다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생) [8w7]`,
  `"이번주도 운동을 3번 갔다. 매일 밤 12시 일찍 잠에 들어 7시간 수면을 유지했다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생) [5w6]`,
  `"시간이 얼마 남지 않은만큼 절실하게 열심히 공부했던 한 주 였다. 목표한 만큼의 진도를 소화하지는 못했지만, 전반적인 집중력과 학습효율은 나쁘지 않았다." — 초록콩 (26학년도 순천(약) 합격생) [9w1]`,
  `"이번주도 큰 문제 없이 루틴 지키면서 공부하였습니다. 실전 감각 올리는 시기라서 집중이 더 잘 되는 느낌입니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생) [6w5]`,
  `"이번주에는 드디어 원래 계획했던 루틴을 지키며 한 주를 보냈다. 하루를 유기 - 점심 - 생물 - 저녁(운동) - 화학 사이클로 안정적으로 유지하며 공부 리듬이 잡혔다. 수아랑 독서실 도착 인증하고, 열품타로 공부시간 공유한 것이 큰 도움이 되었다. 서로의 공부 시간을 실시간으로 확인하다 보니 자극을 받으며 집중력을 유지할 수 있었고, 잡생각이 들 때마다 열품타 시간을 채워야 한다는 생각으로 다시 집중할 수 있었다. 운동 루틴도 조금 수정했다. 원래 근력+유산소를 해주었는데 웨이트를 하다보니 쉽게 피로해지고 회복하는데 오래 걸리는 문제가 있었다. 아쉽지만 시험 전까지는 체력 유지 목적으로 인터벌 런닝을 하기로 했다. 확실히 피로는 덜 느끼면서 운동할 때 느끼던 희열은 느낄 수 있어서 공부에 방해가 되지 않았다. 그리고 저번주에 효과를 봤던 ‘자기 전 리뷰 녹음 복습’도 꾸준히 이어갔다. 녹음을 들으면 어느새 잠이 들어 있는데, 심리적으로도 안정되고 공부했던 것이 무의식적으로 정리되는 느낌이었다. 앞으로 수면 루틴으로 정착할 것이다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생) [4w3]`,
  `"이번주는 진짜 게으름 피우지 않고 무념무상으로 공부를 해서 그런지 평소의 2배 가까이를 해버렸다. 특히 생물은 인체생리학에 흥미가 있어서 너무 재밌는 공부였다. 벌써 3권의 끝이라 4권만 복습하면 갈피가 잡힐거 같다. 제발 시험장에서 다 생각이 날수 있길 바란다. 환절기라 기력이 좀 떨어지는거 같아 한약을 꾸준히 챙겨먹으니 플라시보 효과를 느낀다. 다음주부턴 더 추워지니 건강관리에 신경써야겠다." — 약대가쟝 (26학년도 단국(약) 합격생) [5w6]`,
  `"혜지언니와 도착 인증과 열품타로 공부 시간을 공유하였더니 공부 시간이 안정적으로 유지가 되었다. 아침에 일어나서 독서실 갈 떄도 시간이 엄청 단축되었다. 언니와의 약속을 지키려는데 좋은 동기가 된 것 같다. 이번주는 스스로 느끼기에 집중도가 높았던 것 같다. 또한 과목별 공부 시간도 균형있게 유지하려 노력했다." — 단퓨프 (26학년도 목포(약) 합격생) [1w2]`,
  `"불안감과 상실감 등을 느낀 주였지만 오히려 그런 부정적인 감정들을 이용해서 공부에 집중할 수 있었습니다." — 후회없이살자 (26학년도 강원(약) 합격생) [5w6]`,
  `"적절한 수면시간과 루틴으로 최대한 피로 없이 꾸준한 한 주를 보낸 것 같다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생) [9w1]`,
  `"월요일 하루를 써서 논문의 2/3를 완성했다. 논문이 어느정도 윤관이 잡히니 초조했던 마음이 좀 가라앉아 나머지 남은 날들에 집중해 공부할 수 있었다. 이번주는 집중해서 공부함을 스스로 느꼈다. 아직 논문을 완성 못한 것은 아쉽지만 앞으로 하루 정도 쓰면 완성할 수 있을 것 같다. 내일 중으로 완성하는 것이 목표다 혜지언니와의 인증과 열품타가 큰 도움이 되었다. 또한 과목에 할당된 시간을 거의 지키며 공부했다." — 단퓨프 (26학년도 목포(약) 합격생) [1w2]`,
  `"규칙적인 생활을 유지하였다. 취침시간을 당기려고 노력하여 12시 반으로 당겼다." — 시계탑기린친구 (26학년도 강원(수) 합격생) [4w3]`,
  `"포기하지 않고 해 나가야 한다고 다짐하며 매일 공부를 했다. 무엇이 부족한지에 대해 계속 질문하고 생각했다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생) [9w8]`,
  `"저번주보다 30분 일찍 취침을해서 체력적으로 많이 회복했다." — Akdow (26학년도 단국(약) 합격생) [5w6]`,
  `"중간고사 공부를 최선을 다해 부족하지 않게 하면서 비전파인더에서 매주 주는 모든 시험들은 밀리지 않고 다 봤다. 다행이다. 밀리지 않으니 계획에 큰 지장은 없다." — Hcsg (26학년도 원광(약) 합격생) [5w6]`,
  `"최근 한 달간 컨디션이 가장 좋은 주였다. 확실히 몸 상태가 좋으니 집중력도 좋아졌다고 느꼈기에, 이번 주 루틴대로 쭉 이어갈 생각이다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생) [1w9]`,
  `"일정한 수면 시간 유지 + 주 2회 운동으로 생활 패턴이 돌아옴." — 이번엔내차례 (26학년도 삼육(약) 합격생) [9w8]`,
  `"10월 내내 잘 달려왔고 셋째주도 아쉬움 없이 공부했다. 성적이 썩 맘에 들지 않을 때도 많지만 너무 상심하지 말고 지금처럼 계속 지치지 말고 즐겁게 공부하려 노력하자" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생) [1w9]`,
  `"∙ 매일 같은 시간에 도서관에 가서 공부한 것. 미리 커피를 마시거나 스트레칭을 해서 오후시간에 늘어지지 않고 집중도를 높여 생활했음." — 레고링 (26학년도 계명(제약) 합격생) [9w1]`,
  `"평일에 13시간 가까이 공부를 하였다. 유기화학이 거의 완성이 되고 있는 것 같아 기쁘다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생) [8w7]`,
  `"이번주도 운동을 3번 갔다. 매일 밤 12시 일찍 잠에 들어 7시간 수면을 유지했다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생) [5w6]`,
  `"짧게 짧게 휴식 하면서 페이스 유지하면서 잘 보낸 것 같습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생) [6w5]`,
  `"일정이 있던 주말을 제외하고 기상, 취침, 식사 시간을 고정적으로 유지하며 규칙적인 생활을 해주었다. 독서실 도착 인증을 한 이후로 학습 효율이 많이 올라 갔다. 잡생각 거의 없이 매일 10시간 이상 몰입하여 공부할 수 있었다. 메일 작더라도 성취감을 느끼다 보니 하루하루 더 활력 있어지고 삶의 질도 매우 올라갔다. 또한 저번주부터 변경한 운동 루틴이 오히려 공부하는데 도움이 되는 것 같다. 웨이트할 때는 몸이 무거워졌었는데, 인터벌 러닝으로 바꾼 후에는 다음 날 몸이 훨씬 가볍고 컨디션도 좋았다. 컨디션 좋지 않은 날에는 빠른 걸음으로 대체해 운동 강도를 유연하게 조절했다. 여기에 ‘자기 전 리뷰 녹음 복습’도 꾸준히 이어 나가며 수면 안정에도 신경 쓰며 학습 컨디션이 전반적으로 매우 올라갔다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생) [4w3]`,
  `"날씨가 좋아져서 다시 야외 런닝을 했더니 한 주 동안 컨디션이 좋았다. 큰 무리 없이 안정감 있는 한 주를 보냈던 것 같다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생) [9w8]`,
  `"불안해지고 예민해지기 시작하는 시점이라는 것을 스스로 느끼게 되어 의식적으로 더 여유롭고 친절하게 가족들과 친구들 그리고 저 자신을 대했습니다." — 후회없이살자 (26학년도 강원(약) 합격생) [5w6]`,
  `"규칙적인 생활을 유지하였다. 이번주에 생물 공부에 대한 고민을 하다가 자칫 부정적인 쪽으로 빠질수도 있었는데 그때마다 글로 고민을 기록해두면서 멘탈을 잡고 버틸 수 있었다! 기특하다!! 자기 전 명상도 꾸준히 해주었다." — 시계탑기린친구 (26학년도 강원(수) 합격생) [4w3]`,
  `"정신적으로 평온했고, 더 이상 성적이 안나온다거나 그런걸로 불안하거나 기분이 영향받지는 않는다. 새로운 영양제를 먹기 시작했는데 잘 맞는 것 같다. 평일에는 기계적으로 공부를 한다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생) [9w8]`,
  `"화학 문제를 40문제씩 하루에 매일 푸는 것을 무리 없이 완료했다. 일단 이렇게 하면 큰 무리 없이 12월 되기 전까지 화학 2000제 문제풀이를 대부분 완료할 수 있다." — Hcsg (26학년도 원광(약) 합격생) [5w6]`,
  `"루틴을 잘 지켰다. 컨디션이 전반적으로 좋았지만 생각하지 못한 곳들에서 구멍도 발견하고 이상하게 부족한 부분이 많이 보였던 한 주였다. 그렇지만 동시에 지금 채워갈 수 있어서 감사하다는 생각이 더 컸고, 더 좋은 방향과 행동으로 한 주를 마무리할 수 있었다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생) [1w9]`,
  `"규칙적인 생활패턴(수면 등)과 운동으로 공부 체력이 더 늘어난 것을 느낌." — 이번엔내차례 (26학년도 삼육(약) 합격생) [9w8]`,
  `"∙ 저번주에 선생님과 상담 후 다시 방향을 잡고 더 편안하고 긍정적인 마인드로 공부할 수 있었음. ∙ 앞으로 공부시간 확보를 위해 수영을 그만두기로 해서 이번주는 빠지지 않고 꾸준히 운동을 함." — 레고링 (26학년도 계명(제약) 합격생) [9w1]`,
  `"조금씩 지치기도 하였지만, 최소 공부 시간인 10시간을 매일 채울 수 있었다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생) [8w7]`,
  `"이번주에는 저번주에 들었던 불안한 마음이 많이 없어진듯 하다.. "올해 과연 합격할수 있을까"란 생각이 많이 들었는데 보장은 못하겠지만 끝까지 포기하지 않고 하면 합격할수있지 않을까… 같은 긍정적인 생각도 든다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생) [5w6]`,
  `"코감기가 심해 좋은 컨디션은 아니었지만 공부에는 영향이 가지 않게끔 잘 버텨냈다." — 초록콩 (26학년도 순천(약) 합격생) [9w1]`,
  `"아침 일찍일어나 자정에 들어오는게 당연해져 전혀 힘들지 않다. 매주 시험보는 성적도 어느정도 만족스럽게 나와 불안감도 많이 줄고 이번주에 있는 예비군일정을 부정적으로 바라볼게 아니라 복습과 휴식의 시간으로 여기려고 생각하니 기다려지기 시작했다." — 약대가쟝 (26학년도 단국(약) 합격생) [5w6]`,
  `"특별히 잘 한 점은 없지만, 매일 루틴하게 생활했다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생) [9w8]`,
  `"선생님의 조언대로 잠들고 일어나는 시간을 고정시키기 위해 노력했습니다. 일어나는 시간은 일정하게 맞출 수 있었으나 잠드는 시간은 조절 하기 힘들어서 아직 조절 중이지만 이번달 안으로는 정착할 수 있기를 기대합니다." — 후회없이살자 (26학년도 강원(약) 합격생) [5w6]`,
  `"전과목을 매일 균형있게 공부하려고 노력했고, 컨디션 관리도 잘 한 것 같다. 시험볼 때 목표한 것과 비슷하게 볼 수 있었던 것 같다. 아직 어떤게 오래 걸리고 어떤게 금방 풀릴 주제인지 보는 능력은 좀 부족한것 같아서 더 연습을 해야겠다. 원래 계속 말리던 계산문제들을 최대한 침착하게 한번에 풀려고 다짐하고 봐서, 실수한 것 하나 빼고는 다 맞은 것 같다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생) [9w1]`,
  `"규칙적으로 하던 대로 공부했다. 약간의 감정 기복이나 안좋은 생각이 올라올 때마다 글로 적어두고, 감사일기도 쓰니 잘하고 있는 것들이나 감사한 것들이 생각났다. 그러면 또 괜찮아져서 다시 집중할 수 있었다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생) [1w9]`,
  `"규칙적인 생활 유지+ 저녁에 더 집중하기 위해 저녁식사 후 운동 가는 것을 소홀히 하지 않음." — 시계탑기린친구 (26학년도 강원(수) 합격생) [4w3]`,
  `"그냥 평온했다. 계속 부족한걸 보충하는 데 바빴다. 영양제도 계속 챙겨먹고 공부가 끝나면 가벼운 운동을 했다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생) [9w8]`,
  `"이번주는 컨디션 관리를 잘해서 하루정도를 제외하고는 목표로 했던 학습시간을 채웠다." — Akdow (26학년도 단국(약) 합격생) [5w6]`,
  `"홍쌤의 조언대로 이번주 목표인 200문제 문제풀이 및 오답을 무리 없이 완료했다. 일단 이렇게 하면 큰 무리 없이 12월 되기 전까지 화학 2000제 문제풀이를 대부분 완료할 수 있다." — Hcsg (26학년도 원광(약) 합격생) [5w6]`,
  `"이번 주에는 과목 간의 밸런스가 잘 맞았고, 전체적인 공부 시간도 이전보다 조금 늘었다. 또한 기상 시각과 취침 시각이 일정했고, 수면 시간도 충분히 확보하여 컨디션이 안정적이었다." — 이번엔내차례 (26학년도 삼육(약) 합격생) [9w8]`,
  `"매일 일정히, 충분한 공부 시간 확보한 한 주였다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생) [1w9]`,
  `"∙ 운동을 안하는 대신 공부 시간을 그만큼 더 확보했음. ∙ 평소 오후시간에 집중력이 떨어졌었는데 이번 주는 몰입도 있게 공부했음." — 레고링 (26학년도 계명(제약) 합격생) [9w1]`,
  `"학습 장소를 집 + 스터디카페로 옮겼습니다. 아침에 일어나자마자 책상에 앉아서 화학 공부를 하고 나가는 루틴을 추가했는데, 시간을 낭비하지 않는 느낌이 들어서 이대로 이어나가면 될 것 같다고 생각하였습니다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생) [8w7]`,
  `"일찍자고 일찍 일어났다. 시험이 다가옴에따라 운동가는 횟수를 2회로 줄였다. 불안한 마음이 많이 사라져서 좋다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생) [5w6]`,
  `"이번주도 공부에 매진하면서 보냈습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생) [6w5]`,
  `"이번주는 몸상태가 매우 좋지 않았지만 그래도 마지막까지 버텨냈습니다." — 후회없이살자 (26학년도 강원(약) 합격생) [5w6]`,
  `"기복 없이 한 주 내내 꾸준히 더 열심히 공부하려 노력했다. 여러 환경 변화와 시험이 다가오면서 부족한 부분들이 크게 느껴져서 답답했는데 감사일기로 마음을 잡고 카페인도 오전이나 이른 오후에만 마시는 것으로 조절하니까 하는 공부에 집중할 수 있었다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생) [1w9]`,
  `"주 3회 고강도 운동을 해주었다. 기상시간만큼은 철저히 지켰다!" — 시계탑기린친구 (26학년도 강원(수) 합격생) [4w3]`,
  `"몸살기운으로 하루 푹쉬었더니 컨디션이 완전히 회복되어 다른 날은 예정대로 공부를 진행할 수 있었다." — Akdow (26학년도 단국(약) 합격생) [5w6]`,
  `"홍쌤의 조언대로 이번주 목표인 200문제 문제풀이 및 오답을 무리 없이 완료했다. 일단 이렇게 하면 큰 무리 없이 12월 되기 전까지 화학 2000제 문제풀이를 대부분 완료할 수 있다. 또한 큰 문제 없이 유기화학 전범위 1회독을 완료했다. 유기화학2 기말고사 대비와 함께 오답과 문제풀이만 더 해주면 큰 걱정은 없을 것 같다." — Hcsg (26학년도 원광(약) 합격생) [5w6]`,
  `"저번 주처럼 과목 간의 밸런스가 잘 맞았고, 늘어난 공부 시간도 그대로 유지하고 있음.수면 시간이나 기상/취침 시간도 일정하고 주말 운동 루틴도 회복해서 컨디션이 매우 좋았음." — 이번엔내차례 (26학년도 삼육(약) 합격생) [9w8]`,
  `"11월 중반을 넘어서면서 한계를 느낄 만큼 공부를 하고 있다. 공부에만 몰두할 수 있었던 한 주였다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생) [1w9]`,
  `"∙ 건강 관리도 잘 하고 아픈 곳 없이 매일 차분하게 루틴을 지켰음. ∙ 점심, 저녁에 밥먹는 시간을 활용해서 생물 복습을 꾸준히 진행함." — 레고링 (26학년도 계명(제약) 합격생) [9w1]`,
  `"지난주와 동일하게 루틴을 잘 이어나가고 있습니다!" — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생) [8w7]`,
  `"일찍자고 일찍 일어났다. 운동 2번 갔다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생) [5w6]`,
  `"뒤늦게 자소서를 쓰느라 공부시간이 조금 줄었지만 그래도 매일 10시간 이상은 유지했다. 적당히 평범하고 치열한 한 주를 보냈다." — 초록콩 (26학년도 순천(약) 합격생) [9w1]`,
  `"말씀해주신대로 자기 전에 하루 리마인드하면서 마무리하는 느낌으로 보냈습니다. 아침에 30분 정도 일찍 일어나고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생) [6w5]`,
  `"지난주부터 날 괴롭혔던 두통이 어느정도 잡혀서 공부에 집중할 수 있었다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생) [9w8]`,
  `"이번주 공부는 만족스러웠다. 주어진 하루의 공부에 최선을 다하려 노력했고 그것을 실천했던 것 같다. 시험은 점점 다가오는데 오히려 9월 10월보다 뭔가 마음이 좀 편안해진게 이상하긴하지만, 오히려 그러니 더 집중이 잘되는 것 같다. 저번주 선생님께서 남겨주신 말씀처럼 이때까지 이만큼은 해야하는데 이건 다하고 시험을 보게 되어야하는데 이런 생각을 내려놓은게 도움이 된 것 같다. 취침과 기상시간도 전에 비해 많이 안정화되었다." — 단퓨프 (26학년도 목포(약) 합격생) [1w2]`,
  `"약점 하나를 채우면 계속해서 새로운 내용과 약점들이 나오고 점수는 예상보다 낮고 절망스럽기도 했지만 그런 감정을 오히려 호승심으로 치환해서 멘탈을 관리하고있습니다." — 후회없이살자 (26학년도 강원(약) 합격생) [5w6]`,
  `"멘탈도 흔들리고 체력도 부족하지만 일단 끝날때까지 최선을 다해서 열심히 산 기억을 남기려고 노력했다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생) [9w1]`,
  `"이번주도 저번주처럼 하루 10시간 이상 공부시간을 확보하고 주어진 시간을 최대로 활용했다. 항상 마스크를 착용하고 다니고 손도 자주 씻으며 건강관리에도 유의하려 신경썼다. 가족이 독감에 걸린 상태라 옮지 않게 더더욱 신경써야할 것 같다. 열심히 공부를 하다가도 불안감을 느낄 때는 약간의 보상을 주는 방식을 활용해봤다. 달달한 핫초코를 먹으며 기분전환을 하며 다시 공부를 한다던가 앞에 나가서 붕어빵을 사와 잠깐 먹는다던가 이렇게 소소하게 자신을 챙겨주며 다시 집중해 공부를 지속해봤다." — 단퓨프 (26학년도 목포(약) 합격생) [1w2]`,
  `"해야 할 것들이 많으니 루틴대로 하루하루를 집중하며 정말 열심히 보냈던 것 같다. 집중이 잠깐 안될 때면 스탠딩 책상에서 공부하는 식으로 변화를 주니 더 밀도 있게 공부할 수 있었다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생) [1w9]`,
  `"멘탈관리는 어느정도 성공한 것 같다. 불안에 삼켜지고 그러지는 않는다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생) [9w8]`,
  `"요즘 집중력이 많이 떨어져서 1시간반 공부 10분 휴식을 통해 집중력이 높은 상태에서만 공부하려고 한다." — Akdow (26학년도 단국(약) 합격생) [5w6]`,
  `"주 3회 고강도 운동과 기상시간을 철저히 지켰다." — 시계탑기린친구 (26학년도 강원(수) 합격생) [4w3]`,
  `"홍쌤이 조언해주신대로 이번주 목표인 200문제 문제풀이 및 오답을 무리 없이 완료했다. 일단 이렇게 하면 큰 무리 없이 다음 주까지 화학 2000제 문제풀이를 대부분 완료할 수 있다. 또한 큰 문제 없이 유기화학 전범위 1회독을 완료했다. 유기화학2 기말고사 대비와 함께 오답과 문제풀이만 더 해주면 큰 걱정은 없을 것 같다." — Hcsg (26학년도 원광(약) 합격생) [5w6]`,
  `"1) 최근에 20분~30분 정도 수면시간을 늘렸는데 컨디션이 매우 좋음. 수면 패턴이나 시간에 방해되는 요소 없이 충분히 숙면함. 2) 주말에는 30분 고강도 운동을 함. 3) 공부하기 싫다가도 내가 원래 공부하던 장소로 가면 자연스레 공부를 하게 됨. 루틴이 잘 잡혀서 공부하는 것이 어렵지 않았음." — 이번엔내차례 (26학년도 삼육(약) 합격생) [9w8]`,
  `"감기로 몸이 좋지 않아도 타협하지 않고 최대한 공부하려 노력했다. 바로 병원을 가서 약을 타왔기에 빨리 나을 수 있었다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생) [1w9]`,
  `"∙ 건강 관리를 잘 했고 매일 꾸준히 공부했음. 전반적으로 큰 무리 없이 루틴대로 생활을 함." — 레고링 (26학년도 계명(제약) 합격생) [9w1]`,
  `"지난주와 동일하게 루틴을 잘 이어나가고 있습니다!" — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생) [8w7]`,

  `"마음은 심란해도 꾸준히 루틴 지키면서 생활하고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생) [6w5]`,
  `"이번주도 루틴을 지키며 규칙적인 생활을 유지하려고 노력했다. 열품타로 공부 시간 인증도 여전히 잘 진행하고 있고 덕분에 공부시간도 조금씩 늘려갔다. 계획대로 공부 분량을 못채우거나 모의고사에서 당황하거나 할 때 그 감정에 빠져 있기보다는 바로 개선 방향을 떠올리는 것으로 마인드 세팅을 바꾸면서 감정 조절면에서도 많이 성숙해진 것을 느꼈다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생) [4w3]`,
  `"루틴대로 일정하게 공부했고, 영양제 잘 챙겨먹으면서 컨디션 관리를 잘 했던 것 같다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생) [9w8]`,

  `"전반적으로 흔들리지 않고 꾸준히 루틴 지키며 공부했다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생) [1w9]`,
  `"전반적으로 기상 시간과 취침 시간을 꽤 잘 유지한 것 같다." — Akdow (26학년도 단국(약) 합격생) [5w6]`,

  `"1) 주말에 30분 인터벌 운동을 함. 2) 하루이틀 집중력이 떨어져도 루틴을 지켜나가면서 최소 공부 시간을 채우고 일주일 목표도 지킬 수 있었음." — 이번엔내차례 (26학년도 삼육(약) 합격생) [9w8]`,
