    `"빈 종이에 내용을 정리하면서 암기와 정리를 보완하고 있다. o/x 초반 단원에서는 감을 못잡고 공부를 한 느낌이라 기초가 부족하단 느낌이 들어 주말부터 다시 처음 단원부터 복습을 시작했다. 초반에는 통합이론 교재에 적응하는 것이 정말 버거웠는데 결국 1달동안 1회독을 했다는 게 뿌듯했다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"끝까지 볼 암기 노트를 완성시켰고 다음주부터 매일 조금씩 보면서 암기하고 처음 보는 개념이 나올 때마다 추가할 예정이다. 암기한 내용이지만 뭔가 명확하게 생각이 안 나는 개념이 나올때마다 다시 암기노트를 보면서 익숙화시켰다." — Akdow (26학년도 단국(약) 합격생)`,
    `"1) MD 23학년도까지만 계획했으나, 생각보다 잘 풀리고 진도가 잘 나가 25학년도까지 풀었다. 이제 9월인 만큼, PEET 문제들도 건드려보고, VF 문제들, 사설문제들도 들여다보면서 개념을 계속 다지면 되겠다. 2) 이번주 전화통화 스터디는 생화학+광합성 지옥주였다. 2주동안 빠르게 2번 돌리고 있는데, 덕분에 VF 12회차나 MD 생화학 문제들을 수월하게 풀 수 있었다. 빠르게 돌려보며 생화학 파트 부담이 줄고있다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"∙ 써머리 OX를 다 풀었고 해설 강의를 완강함. ∙ 테스트 진도에 맞게 개념 복습을 병행했음" — 레고링 (26학년도 계명(제약) 합격생)`,
    `"8월달부터 계획한 약점 단원들을 하나씩 정리해나가고있다. 복습을 할 때 아웃풋을 하는 것이 중요하다고 생각해서 단원별 주요 주제를 써두고 해당 주제에 해당하는 내용을 타이핑해가면서 복습해줬다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
    `"꿀벌책 1회독을 완료했음. 식생분진 OX 문제를 풀 때 만족스럽게 마무리하지 못한 단원들이 있었지만, 이번에는 목차와 굵은 글씨, 그림을 중심으로 학습해야 한다는 점을 다시 상기하며 공부했음. 기본서 학습 후 퀴즐렛을 활용하여 기본 내용과 심화 내용을 구분할 수 있었고, 심화 내용에 대한 추가 학습도 진행할 수 있었음." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"목표치를 채우지 못해서 아쉽지만 라이프 1회독을 거의 마무리하였습니다. 저번주와 마찬가지로 박선우 교재와 캠벨 학습을 하였습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"이번 주에는 완벽히 정리하려는 부담을 내려놓고 라이프 교재의 굵은 글씨 개념을 중심으로 학습하였다. 전날 공부했던 내용 빠르게 훑기 -> 라이프 & 써머리 병행 학습 -> 박선우 교재 -> 써머리 OX 순으로 누적 복습도 함께 진행하였다. 하루 4~5시간동안 시간 제한을 두고 집중해서 공부하니 오히려 효율성이 높아졌다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"타이핑으로 공부를 전환한 후로 암기가 잘 되고 있다. 한 주 동안 7월 ox 문제들을 복습해서 보았고, 아직 상세한 개념들이 머리에 선명하게 암기가 된 것은 아니지만, 전범위 문제를 풀 수 있을 정도로 기본기가 쌓인 것 같다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"전범위 시험을 위해서 여태까지 모아놨던 오답 파일을 최대한 효율적으로 공부했다. 식생분진을 최대한 가볍게, 두꺼운 글씨 위주로 훑어봤다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`
    ],
    화학:[
    `"2000제 코드 1,2가 거의 마무리 되었는데 헷갈리거나 반드시 기억해야 할 것들을 정리한 노트를 꾸준히 정리하고 아침에 문제를 풀기 전 전날 배웠던 걸 복습하는 루틴을 만들었다. 원래 문제 틀리는 것에 크게 일희일비하는 성격이었는데 점점 약점을 파악할 수 있게 되었다 식으로 긍정적으로 바라보게 되는 것 같다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"기출올인원을 9월 2주차에 시작하기 전 2000제 2회독을 시작했고 원래 계획했던 11단원을 넘어 12단원까지 마쳤다. 2회독을 하는 도중 기존에 틀렸거나 다시 볼 필요가 있다고 느껴져 체크를 해놨던 문제들을 대부분 별다른 위화감 없이 쉽게 풀어냈으며 추가로 암기해줘야 될 사항들을 정리한 부분들도 암기가 잘 된 것을 확인할 수 있었다." — Akdow (26학년도 단국(약) 합격생)`,
    `"1) 1500제 복습 시험을 보았는데 지체없이 빠르게 풀어나갔다. 한달이라는 시간동안 최선을 다해 풀었는데 테스트를 보고 나니, 그래도 기초가 쌓였음을 느꼈다. 이제 선생님 말씀대로 남은 9월 이후부터는 2000제, 기출, 그외 여러 다양한 문제들을 풀어나가며 실력을 쌓자. 2) 2000제는 반응속도를 시작으로 본격적인 문제풀이에 들어갔다. 1500제 없이 문제만 풀었을 때에 비하면 틀리는 문제 수가 감소한 편이다. 문제들이 1500제 개념들과 연계되며 어떻게 풀어야 하는지 체계가 세워지니 자신감이 좀 붙는다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"2000제를 풀며 부족함을 느낀 열화학 단원을 1500제 예제를 풀며 보충함" — 레고링 (26학년도 계명(제약) 합격생)`,
    `"9월초까지는 생물을 중점적으로 학습을 하려고 계획을 했고, 화학은 상대적으로 개념이 약한 파트인 고체파트 지엽적인 내용들을 정리해줬다. 또한 문제풀이 감각이 떨어지면 안 되기 때문에, 3일 간격으로 경희대 기출문제를 풀어줬고, 2000제에서 계산 단원 문제들을 하루에 10문제씩 복습하였다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
    `"1500제 랜덤 테스트를 잘 마무리하고 바로 적중 2000제로 넘어갔음. 핵심이론 1500제 리뷰도 함께 하면서 모의고사 대비를 위해 각 단원별로 목차순에 따라 간단한 개념 체크 리스트를 만들었음. 틈날 때마다 잊은 개념이나 공식이 없는지 확인했음. 기본 단계를 확실하게 다진 후 적중 2000제로 넘어오니 문제 푸는 것이 재미있고 수월해졌음." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"어지간하면 박인규 선생님 풀이대로 풀게되는 것 같다. 아예 노베이스에서부터 박인규T 강의로 시작한 덕인지 나만의 이상한 방법으로 풀게 되는 일은 적은 것 같아 다행이다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"저번주 피드백대로 코드 번호 1,2 도 복습을 하면서 진도를 나갔습니다. 산염기 단원은 자신이 없던 단원 중 하나였는데 몇몇 특이한 문제를 제외하고는 일관성 있게 풀 수 있게 된것 같습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"저번주에 이어 단원별 암기 노트를 작성하며 이론 복습을 병행했다.특히 문제 풀이 과정에서 AP를 한 줄로 간략히 정리한 뒤 문제를 푸는 방식을 적용하니 사고 과정을 더 잘 체화할 수 있었다. 틀린 문제는 체크 해두고 다음날 본격 학습 전에 빠르게 풀어주면서 누적 복습도 진행하였다. 그리고 암기노트도 함께 보면서 단순 암기 사항은 잊어 버리지 않도록 반복 학습해 주었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"코드1,2 문제들을 복습하면서 틀린 문제들에 어떤 실수를 했는지 유형화하여 분석해보았고, 자주 놓치는 부분이 뭔지 명확하게 파악할 수 있었다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"인규쌤의 풀이랑 똑같이 풀기 위해 강의 보기전에 AP만 먼저 세워보고 한문제씩 강의를 보고 있는데 아직까지는 틀리는 문제 없이 다 맞고 있다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`
    ],
    유기:[
    `"모든 예제를 다 풀었고, 주말에는 이전에 풀었던 테스트와 기본서를 병행해서 9단원까지 간단하게라도 복습하는 시간을 가졌다. 테스트를 다 맞아본 것은 2달을 통틀어 처음이라 기뻤다. 더 열심히 해야겠다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"따로 정리 노트를 만들고 익숙해질 때까지 메커니즘을 그려보고 결과를 외워 반응물을 보고 어떤 생성물이 나오는지 익숙화했다." — Akdow (26학년도 단국(약) 합격생)`,
    `"진도가 살짝 밀려 허겁지겁 끝낸 감이 있지만 그래도 방향족 반응 들어가기 전 시간을 투자해 라디칼과 컨쥬게이션 부분을 메꾸었다. 특히 방향족 화합물 퓨란, 피리미딘, 피리딘 애들에 대한 전반적인 이해가 잘 안되었는데, 올해들어 기본서와 인강을 병행하며 이들의 구조, 염기성, pKa값, 방향족성 등에 대해 제대로 이해했다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"∙굳어진 루틴대로 공부하며 내용을 학습함. 진행할수록 이해가 잘되는 느낌을 받음. ∙ 매일 유기 공부를 하며 불안감과 부담이 줄어듦" — 레고링 (26학년도 계명(제약) 합격생)`,
    `"매일 꾸준히 유기화학 공부를 했다. 피트에서 다루지 않는 비교적 새로운 부분인 유기2 내용들을 맵핑 형태로 정리했다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
    `"유기화학을 공부하면서 중요하다고 느낀점은 시약조건들이 중구난방인것들이 많기 때문에 기질과 시약조건들에 따른 결과물들을 먼저 머릿속에 큰 뼈대를 만들어 암기한 다음, 디테일을 채우는게 중요하다는 생각이 들었다. 그래서 일단 1회독을 하면서는 사소한 디테일에 신경쓰기보다는 개념의 이해 & 시약조건같은 굵직한 것들을 먼저 암기해 놓은 다음, 2회독하면서 디테일을 살리는 공부를 하는것으로 방향을 잡았다. 그래서인지 공부 효율이 많이 올라갔다는 느낌을 받았다(물론 아직 많이 부족하다)." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"기본서를 읽으면서 집중력을 높이기 위해 화학 개념 체크리스트처럼 유기 개념 체크 리스트도 만들었음(각 개념마다 가장 중요한 포인트 작성). 금요일 테스트 전 월~목의 누적 복습이 훨씬 더 수월해졌음." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"처음으로 주간 테스트가 잘 풀리는 느낌을 받았다. 전반적으로 감이 올듯 말듯 한 느낌이 드는데, 복습의 효과가 조금씩 나타나고 있는 것 같다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"매일 최소 1시간씩 기본서를 보면서 유기화학 test를 다시 풀어보며 복습했습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"공부 시간을 확보하기 위해 매일 가장 먼저 2시간~2시간30분정도 집중해서 공부했다. 앞단원 반응 정리한 것 빠르게 훑어 보기 -> 약사랑 유기화학 강의 -> 스미스 읽기 및 예제 -> 반응 한 장으로 정리하기’ 싸이클로 진행했다. 뒤로 갈수록 반응이 복잡해지고 양도 많아져서 강의로 먼저 이해하고, 스미스 읽고 문제를 풀면서 메커니즘을 손으로 그리면서 학습하니 더 빠르게 습득할 수 있었다. 이 과정 덕분에 VF 문제 풀이가 훨씬 수월해졌다. 앞단원들도 놓치지 않고 복습을 병행하니 작년에 유기 공부를 할 때 느꼈던 답답함 없이 훨씬 높은 이해도로 학습할 수 있었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"알켄 알카인이 양이 많고 어렵게 느껴져서 메커니즘을 하나하나 그려보며 복습을 해줬다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"진도를 열심히 나가려고 노력했다. 시간도 많이 늘렸다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`
    ],
    생활관리:[
    `"기상과 애니어그램 읽기 루틴을 모두 지켰고 매일 집 밖으로 나가서 공부했다. 일요일에도 오전에는 밖에서 공부를 한 뒤 오후에 쉬면서 하고 싶은 일을 했는데 좀 더 좋은 휴식을 취한 것 같다. 전반적으로 몸 컨디션은 좋았다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생) [9w8]`,
    `"규칙적인 취침과 규칙적인 기상을 지켰고 3끼를 모두 챙겨먹으며 꾸준한 운동을 했다." — Akdow (26학년도 단국(약) 합격생) [5w6]`,
    `"두 달을 되돌아보니 하루도 빼놓지 않고 공부를 했다. 가끔 더위와 반복되는 공부에 지친 날도 있었지만, 타협하지 않고 하루하루 성실히 버텼더니 이뤄낸 성과이다. 공부량 뿐만 아니라 모든 과목에서 큰 성장을 이뤄낸 두달이어서 정말 수고했다고 스스로를 칭찬하고자 한다. 남은 기간 더 열심히 해서 최고의 결과로 보답받았음 좋겠다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생) [1w9]`,
    `"∙애니어그램 9번 공부방법을 읽으며 '갈등 회피'를 하지 않기 위해 노력하며 공부 시간을 채웠음." — 레고링 (26학년도 계명(제약) 합격생) [9w1]`,
    `"운동을 주 3회 진행하였다. 평소에 밥을 먹자마자 자리에 앉아있다보니 소화가 잘 되지 않는 느낌을 받았는데, 운동을 주 3회 진행하니 예전보다는 덜한 것 같다. 점점 루틴을 지키는 것이 익숙해지고 있다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생) [8w7]`,
    `"이번주에도 운동을 3회 갔다. 운동가는게 영 즐거운 일은 아니지만 그래도 하고나서 생기는 뿌듯함이 있다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생) [5w6]`,
    `"매일 에니어그램 9번 유형 글을 읽고 공부를 시작했음. 추가적으로 쉬는 시간에 운동 간식(스쿼트 15회)을 활용하여 집중력을 높였음." — 이번엔내차례 (26학년도 삼육(약) 합격생) [9w8]`,
    `"큰 이슈는 없었고 집에서 핸드폰 보는 시간도 의식적으로 줄이려고 노력하였습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생) [6w5]`,
    `"애니어그램 학습법을 다시 정독하며 ‘감정에 휘둘려 시간과 에너지를 낭비하면 중요한 현실을 놓치게 된다’는 말을 계속 떠올렸다. 그래서 감정에 따라 움직이기보다 그냥 먼저 행동하는 습관을 의식적으로 연습했다. 지금 기분은 며칠 뒤면 사라지지만 내가 내린 선택의 결과는 오래 남는다는 생각으로 공부에 집중하려고 했다. 생활 루틴도 현실적으로 바꿔봤다. 아침잠이 많아서 8시에 일어나려다 실패하고 괜히 스트레스 받는 것보다 그냥 내가 매일 자연스럽게 일어나는 시간인 9시로 기상 시간을 맞췄다. 대신 식사는 하루 세 끼에서 두 끼로 줄였다. 원래도 두 끼만 먹어왔던 터라 몸도 가볍고 집중하기에 오히려 더 좋았다. 아침에 일어나 씻고 준비한 다음 이른 아점을 먹고 5시간 공부. 그다음 이른 점저를 먹고 6시간 공부. 운동하는 날은 두번째 식사 전에 1시간하기. 이렇게 일과를 정해놓으니 밥 때문에 흐름이 끊기거나 이동으로 시간을 허비하는 일이 줄었다. 덕분에 학습 집중도가 확실히 높아졌다. 무엇보다 내 특성에 맞는 루틴을 직접 고민하고 조정한 덕분에 억지로 목표를 맞추려던 스트레스가 사라졌다. 규칙적인 생활이 자연스럽게 유지되었고 긍정적인 마음으로 공부할 수 있었다. 밤에는 지쳐서 바로 잠드는 경험을 했고 수면의 질도 좋아져 이제는 새벽에 깨지 않고 깊이 잘 잘 수 있게 되었다.." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생) [4w3]`,
    `"저녁 먹고 운동하는 시간에 타이머를 잘 돌려 독서실에 일찍 들어갔다. 지난 한 주 동안 날 괴롭혔던 우울감과 소화 불량이 괜찮아져서 공부에 더 집중할 수 있었다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생) [9w8]`
    ]
  },
  "9-1":{
    생물:[
    `"앞 단원 파트와 생리학 파트, 중앙대 기출을 풀며 전범위 복습을 진행했다. 전범위 기출문제를 풀면서 특히 약한 단원 위주로 기본서를 다시 봤던 것 같다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
    `"계획했던 양보다 더 많이 정리하고 복습했다. 퀴즐렛 테스트를 매일 풀기 시작했다. 중앙대 기출 중 틀렸거나 헷갈렸던 선지는 밑에 한 줄 정도 요약을 하거나 그림을 그려서 정리하면서 공부했다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"박선우 써머리를 꼼꼼히 복습하며 외우는 것을 기반으로 하여 화요일 금요일 제공되는 VF제공 문제풀이를 진행 후 모르는문제는 캠벨과 박선우 통합이론을 참고한 것. 직전에 켐벨과 써머리로 꼼꼼히 암기했던 부분이 문제화되는 것을 보고 이론 기반 문풀 공부법이 맞다는 생각이 듬." — Hcsg (26학년도 원광(약) 합격생)`,
    `"드디어 이론 강의를 완강했음. 강의 복습과 함께 OX 문제를 풀면서 강의를 통해 배운 내용을 더 효율적으로 공부할 수 있었음. 모의고사가 예정되어 있어서 MD 개념 문제를 풀면서 목표했던 취약 단원 공부도 완료했음." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"올해 MD까지 다 풀었고(해설은 못 구했지만.) PEET도 11학년도 기출부터 건들 수 있었다. 그리고 스터디와 주중 전화복습 스터디도 잊어버린 단원들 복습에 큰 도움이 되고 있다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"∙ 저번주에 강의 완강 후 통합이론과 기본서를 통해 복습하는 시간을 가짐. 목차도 함께 암기하며 미뤘던 내용들을 공부함. 몰랐던 것을 공부해서 알게 되니 성취감이 쌓이고 자신감이 생기는 것이 느껴짐" — 레고링 (26학년도 계명(제약) 합격생)`,
    `"전 범위 문제를 풀면서 약점을 알아갈 수 있었다. 반대되는 개념에 대해서는 항상 민감하게 반응해야겠다고 생각하였다. 오늘 모의고사를 응시하면서도 아는 문제들을 너무 많이 틀려서 바로 다시 한 번 풀어봤는데, 반대되는 개념에서(ex) 산화,환원 / 활성형,불황성형) 항상 실수가 발생하였다. 앞으로는 문제를 풀 때 이 부분에 대해서 정확히 읽고 판단해야겠다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
    `"동물생리학 공부하면서 암기량이 많다고 느꼈다. 암기량이 많은 부분(특히 신경계와 내분비)은 반복적으로 봐 주었다. 그래도 나중에 시간지나면 까먹을듯 싶어 통합이론 서머리를 활용해 볼까 생각이 든다. 남은 시간에는 캠벨책을 읽어 주었다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"분류, 진화 단원 양이 너무 많아서 다 끝내지 못할 뻔 했으나, 생물에 비교적 많은 시간을 투자한 끝에 결국 기본서를 다 읽었다. 마침내 식생분진 포함 첫 1회독이 끝나서 뿌듯하다. 진화 단원에서 하디 바인베르크 평형 문제가 너무 어려워 그 부분만 인강을 찾아 들었더니 이해가 잘 되었다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"라이프 1회독을 마쳤고 문제 풀이 위주로 공부하였습니다. 7월 ox 퀴즈를 복습할때 말씀해주신대로 해당부분 기본서와 통합이론을 다시 읽으면서 하고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"중앙대 문제를 바탕으로 해당 부분 캠벨에서 찾아 복습해 주었다. 특히 헷갈렸던 단원은 7,8월 OX문제도 다시 풀어보며 부족한 부분을 채워나갔다. 추가로 필기어플의 카드 학습을 활용하여 단순 암기인데 안외워지는 것들을 정리해서 반복해서 봐주었다. 영단어 외우듯이 문제-답을 반복해서 봐주니 머릿속에 잘 들어왔다. 그리고 풀었던 문제는 온전히 기억할 수 있도록 매일 생물 학습 전에 그 전에 봤던 문제들을 빠르게 복습하는 시간을 가졌다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"식생분진까지 모두 완강을 끝냈다. 비교적 최근에 들은 4권 내용은 기억이 잘 나는 편이라 다행이다." — 약대가쟝 (26학년도 단국(약) 합격생)`,
    `"한 주 동안 VF OX 문제, 중앙대 재배치, 캠벨 순으로 복습을 해줬다. 7월 ox 문제도 누적으로 복습하면서 전범위에 대한 감을 잃지 않도록 노력했다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"배치고사와 중앙대 기출을 풀면서 느낀 건 내가 알고 있다고 생각했지만 제대로 알고 있지 않은 개념들이 많다는 것이었다. 그래서 기출 기반으로 기본서를 볼 때 용어들을 쓱 넘어가는게 아니라 그게 뭔 개념인지 느끼면서 가려고 노력했다. 전에는 그냥 생물은 너무 양이 많고 외울 것이 많다고만 느꼈는데 캠벨의 그림을 보고 어떤 일이 일어나고 있는지 상상해보았다. 예를 들어 세포에 관한 내용이 나오면 진짜 세포의 모양을 떠올리고 거기서 이런 일이 일어나는구나 이렇게 생각하면서 기본서를 읽으니 더 잘 와닿고 암기도 오래가는 것 같았다." — 단퓨프 (26학년도 목포(약) 합격생)`,
    `"박선우 summary OX를풀며 부족한 지식을 파악하며 이론을 공부하니 더 효율적이었던 것 같다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
    `"가장 못하는 부분들 위주로 보려고 노력했다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`
    ],
    화학:[
    `"1500제와 2000제 복습을 병행하여 기본적인 문제들 위주로 3단원 다시 풀어보고 약간 지엽적인 문제들도 병행했다. 코드 1,2의 기본적인 문제들은 자신감이 생겼고, 위 문제들 풀이 방식을 기본 베이스로 기출올인원의 조금 난이도 있는 문제들도 APS 적용해서 나아가 봐야겠다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
    `"이번 주부터 코드 3을 풀기 시작했다. 문제를 풀기 전 코드 1,2 때 문제들과 노트를 복습하고 실수를 줄이기 위해 의식적으로 생각하면서 풀고 있다. 계획했던 양보다 더 많이 풀었다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"박인규 선생님의 사고방식을 흡수하기 위하여 일단 매 강의를 시청하기 전 해당 범위의 문제풀이를 진행하고 문제가 틀렸건 맞았건 상관없이 처음부터 끝까지 2배속으로 유튜브 강의를 시청하고 오답 진행을 하고 있는 점" — Hcsg (26학년도 원광(약) 합격생)`,
    `"공부시간이 부족해서 진도에 대한 걱정은 있었으나, 지금은 정확한 풀이 연습이 필요한 시기라는 것을 되새기고 APS를 지켜가면서 풀이함. 이번 주에도 일반화학 체크리스트를 통해 방향성을 확인하면서 내가 하는 공부에 확신이 들었음." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"1) 산염기 문제를 풀어도 왜 찝찝하고 몇 문제씩 틀릴까 고민이 많았는데 2000제를 다시 풀며 산염기 세기 비교와 수용액 산성도 비교라는 큰 주제를 통째로 놓쳤음을 찾아냈다. 인강으로 관련 부분을 차근차근 다시 들으며 메꾸었다. 2) 2000제를 다시 풀어보면서, 쉬운 문제들도 개념이 새롭게 구조화되고 이해가 깊어지는 느낌을 받는다. 아무 생각 없이 들었던 인강이었는데, 1500제 기본기에 유기 내용들까지 하나로 이어져 한층 더 깊은 개념 이해가 이뤄진 듯하다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"2000제 코드 1,2번 문제들을 단원별로 다시 풀며 자신없던 파트를 보완함. 헷갈리는 부분을 1500제 복습을 하며 보충해서 불안감을 해소함" — 레고링 (26학년도 계명(제약) 합격생)`,
    `"꾸준하게 계산문제 풀이 루틴을 이어나갔다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
    `"오랜만에 문제를 풀었다. 문제를 풀면서 감이 많이 죽었다는 생각이 들었고, 물론 문제 좀 풀면 바로 돌아오겠지만, 꾸준히 문제푸는게 중요하다는 생각이 들었다. 유기화학이 어느정도 진도가 끝나면 유기화학이랑 일반화학 공부량을 맞춰 나갈 생각이다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"간만에 평형, 반응속도 단원으로 돌아왔는데 비록 기억이 가물가물해서 곤란했지만.. 무작정 손부터 대기보다는 APS를 떠올리며 한 번에 풀고자 노력했다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"말씀해주신대로 헷갈렸던 상식 문제들을 노트에 따로 간단하게 적어놓고 화학 공부 시작 전에 가볍게 읽었습니다. 저번주와 마찬가지로 코드번호 1 2 복습하면서 진도는 꾸준히 나가고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"저번 주에 이어 단원별 암기 노트를 작성하며 이론 복습을 병행했다. 2주 정도 이렇게 하니 이 방법이 나한테 잘 맞는 것 같다. 매일 화학 공부하기 전에 그동안에 정리한 암기노트를 빠르게 복습하고 공부해 주었더니 앞의 내용도 공부하면서 지금 나가고 있는 진도도 함께 공부해주어 앞 내용을 잊어버린다는 불안감이 덜했다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"11강 반응속도 문풀 중인데 단원 들어가기 전 1500제로 대충 개념을 훑고 가니 더 잘 풀려서 좋다." — 약대가쟝 (26학년도 단국(약) 합격생)`,
    `"코드1,2 강의를 먼저 수강하고 복습을 하니, 일관된 방법으로 문제를 풀 수 있었다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"화학에 대한 약간의 두려움이 있었다. 그럼에도 두려워하지 않고 박인규 선생님께서 말씀하시는대로만 잘 따라가보자 계속 다짐했다. 문제를 풀 때 먼저 무작정 글씨를 쓰는 것이 아니라 먼저 단서를 찾고 연결하고 그 다음에 들어가는 것을 반복했다. 아직은 쉬운 내용들이지만 그래도 선생님이 말씀하신대로 같은 사고로 반복해서 풀다보니 조금 자신감이 생겼다. 선생님께서 강조하신 다른 부분은 바로 목차를 기억하고 내용을 떠올릴 수 있어야한다는 점이었다. 그래서 매 강의가 끝나고 혼자 복습이 끝나면 15분정도 할애해서 앱으로 그 날 수업 내용의 목차를 정리한 마인드맵을 만들었는데 효과가 괜찮은 것 같다. 먼저 그 날 배운 내용이기에 복습도 되면서 화학은 이론 부분이 많지 않기에 시간도 적게 걸리고 가장 좋은 건 그 다음 날 수업하기 전에 빠르게 훑어보고 들어가면 그 전에 배운 내용들이 빠르게 떠올라 좋았던 것 같다." — 단퓨프 (26학년도 목포(약) 합격생)`,
    `"목표한 양만큼은 못했지만, 이번주 나의 최대치를 해낸 것 같아서 만족스럽다. 개념형 문제(ex. 르샤틀리에 원리, 활성화 E, 촉매)를 풀면서 직관적으로 바로바로 자신있게 답을 고르지 못한 선지를 표시해두고 해당 개념을 직관적으로 이해하기 위해 시간을 썼다. 이전에는 단순 암기를 해서 자신있게 개념을 꺼내지 못했던 게 많았는데 이번에 문제풀이 후 생각하는 과정을 통해 직관적으로 반응할 수 있는 개념이 많아진 것 같다!" — 시계탑기린친구 (26학년도 강원(수) 합격생)`,
    `"원래는 본능적으로 생각없이 문제풀이에 돌입했는데 풀기전 방향과 풀이를 생각하고 푸는 연습중이다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
    `"계속 풀이가 같은지 점검하며 문제풀이하려고 노력했다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`
    ],
    유기:[
    `"전에는 조금 후순위로 밀렸었는데, 매일 꾸준히 의식적으로 2시간 이상씩 공부하려고 노력하니 유기화학 문제 풀고 메커니즘 그려보는 전체 공부 시간이 확실히 늘었다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
    `"매일 2시간 이상 공부했고 전날 공부한 내용을 복습하는 시간을 매일 가졌다. 이전 단원에 대한 언급이 나오거나 잘 기억나지 않는 것 같으면 바로바로 복습했다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"9월 개강 전 1주일간 방학동안 제대로 공부를 하지 않았던 유기화학을 미리 약사랑 유기화학 1강부터 21강까지 시청하고 모르는 내용은 스미스 기본서 읽으며 공부하고, 이를 기반으로 매주 쪽지시험 진도에 맞춰 공부한 점.(유기화학 과목을 공부할 수 있는 준비는 다 완료하였음)" — Hcsg (26학년도 원광(약) 합격생)`,
    `"9월이 되면서 매일 유기화학 공부 2시간을 지켜냈음. 기본서, 예제 풀이, 개념 체크리스트 정리 후 VF 단원별 테스트를 진행했고, 기본서로는 부족한 부분은 약사랑 유기화학으로 보완하면서 이번 주 유기화학 공부를 잘 마무리할 수 있었음." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"양도 많고 외울 게 많아보였던 단원이어서 조금 벅찰 것 같았지만, 또 의외로 다시 기억이 새록새록 나면서 재미가 붙는 단원이다. 이번주 할당량을 모두 채웠고 VF 9회차 피드백도 마쳤다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"강의를 듣고 ppt 내용도 함께 정리함. 금요일 시험 진도에 맞춰 내용을 공부하고 헷갈리던 내용의 이해와 암기를 실천함" — 레고링 (26학년도 계명(제약) 합격생)`,
    `"유기2 반응들이 휘발성이 커서 맵핑형태로 정리를 하고 있다. 자투리시간에 맵핑자료를 꾸준히 보고 있다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
    `"내용 정리하는데 시간이 좀 걸려서 미리 앞당겨서 공부를 더 했다. 이번주는 알데하이드와 케톤까지 공부를 해 주었다. 다음주에는 카복실산 유도체까지 해볼려고 한다. 유기화학의 여러 고비를 넘은것 같아서 그나마 행복하다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"기본서 중심으로 차근차근 공부했다. 매커니즘을 손으로 그려가며 익혔다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"기본서와 유튜브를 병행하면서 진도를 나가고 있습니다. 또한 귄민 교재로 반응들을 암기하고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"유기화학은 이제 공부 방법이 제대로 자리 잡았다. 저번주와 마찬가지로 매일 가장 먼저 공부해서 2시간 정도 학습 시간을 확보했고, ‘앞내용 복습 -> 강의 -> 스미스 -> 노트 정리’ 사이클도 그대로 이어 나갔다. 이렇게 하니 문제 풀 때 반응들이 바로바로 떠올라서 문제가 잘 풀려 기분이 좋았다. 그리고 강의를 통해 방향족 반응을 이번에 완전히 이해해서 더욱 즐거운 공부가 되었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"이번 EAS 반응은 공부도 잘됐고 잘풀려서 좋았다. 딱히 헷갈리는 개념도 없고 여기까지가 쉬운단원인가 생각된다." — 약대가쟝 (26학년도 단국(약) 합격생)`,
    `"방향족 화합물이 이전 단원들보다는 쉽게 느껴졌고, 메커니즘을 그리면서 공부하는 요령이 생긴 것 같다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"기본서의 내용을 생각하며 예제의 문제를 풀었다. 처음에는 기본서 내용이 눈에 잘 안들어왔는데 집에 있는 윤관식 선생님 기초책을 빠르게 훑고 읽으니 속도가 빨라지고 구조가 눈에 들어왔다." — 단퓨프 (26학년도 목포(약) 합격생)`
    ],
    생활관리:[
    `"집에 와서도 자기 전에 침대에서 공부하는 습관이 있었는데, 공부하는 곳과 휴식하는 곳을 분리하니 충분히 휴식해 컨디션이 좋은 상태로 공부할 수 있었다. 다만, 의도치 못한 상황으로 평소보다 잠을 채우지 못한 날들이 있었는데, 수면이 망가졌다는 생각을 내려놓고 다음 날 조금은 피곤했지만 루틴대로 보내니 회복할 수 있었다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생) [1w9]`,
    `"일상 루틴은 계속 지켰다. 그날 아무리 기분이나 컨디션이 나빠도 9시간 이상은 공부했다. 하루를 날리는 일은 없어진 것 같다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생) [9w8]`,
    `"자투리 시간을 최대한 활용하여 공부하려 한 점. 개강 초기 시간이 빌 때 공부시간을 최대한 확보한 점." — Hcsg (26학년도 원광(약) 합격생) [5w6]`,
    `"운동시간을 아침으로 옮기니 운동 가는 것을 미루지 않고 하루를 더 뿌듯하게 보낼 수 있어서 좋았음. 앞으로도 아침 운동으로 하루를 시작할 생각임. 9월이 시작되면서 학교를 가게 되어 생활 패턴이 조금 무너지긴 했지만, 그동안 해오던 공부 습관이 있어서 계획의 절반 이상 정도는 지킬 수 있었음." — 이번엔내차례 (26학년도 삼육(약) 합격생) [9w8]`,
    `"공부하는게 습관이 되어 반복적인 일주일이었다. 무난히 이번주도 잘 헤처나갔다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생) [1w9]`,
    `"∙ 매일 같은 시간 기상하여 일찍 도서관으로 감. ∙ 미뤘던 내용들을 암기하며 몰랐던 것을 알게 되는 진짜 공부를 한 것 같아 성취감을 느낀 한 주였음" — 레고링 (26학년도 계명(제약) 합격생) [9w1]`,
    `"루틴을 잘 지켜나갔다. 휴대폰 보는 시간을 최소화하였다. 이번주는 주말에도 공부를 진행하였다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생) [8w7]`,
    `"공부 시작할때는 "과연 내가 이 많은걸 할 수 있을까?"란 생각이 들면서 부정적인 생각이 많이 들었지만, 꾸역꾸역 하다보니 어느새 진도를 거의 끝나가는 나 자신을 보고있으니 자신감이 생긴다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생) [5w6]`,
    `"기상/취침 시간과 목표 공부 시간을 잘 지켰다. 운동을 거의 하지 못한 것 빼고 전반적으로 무난한 한 주를 보냈다." — 초록콩 (26학년도 순천(약) 합격생) [9w1]`,
    `"낮은 생물 점수 때문에 조금씩 불안감이 올라오는데 그때마다 '지금 틀렸으니 시험때는 안틀릴 수 있겠다'라고 마인드 컨트롤을 하고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생) [6w5]`,
    `"이번주는 모든 과목의 공부법이 어느 정도 자리 잡아서인지 큰 걱정 없이 공부가 되어서 기계적 학습을 할 수 있었다. 그리고 저번주에 바꾼 루틴 덕분에 크게 스트레스 받는 것이 없어 감정 조절이 제일 잘 된 한 주였다. 앞으로의 본고사까지도 이번주처럼 마음을 비우고 공부에 몰입할 수 있으면 좋을 것 같다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생) [4w3]`,
    `"사실 이제는 꾸준히 도서관에 가서 공부하고 루틴을 지킨게 당연해져서 잘했다는 생각이 들진 않는다. 그냥 날씨 더워도 집에서 안풀어지고 행동한걸 스스로 칭찬해본다." — 약대가쟝 (26학년도 단국(약) 합격생) [5w6]`,
    `"타이머로 공부시간을 1시간씩 끊었더니 집중이 더 잘 되고 효율도 좋았다. 이번주는 또 자소서 작성 기간이었는데, 운동 횟수를 주3회로 줄여서 자소서 설문에 쓴 시간을 보강할 수 있었다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생) [9w8]`,
    `"전에 비해 순 공부 시간이 늘어났다. 아침에 일어나는 것을 매우 힘들어했는데 목표가 생기고 그 날 공부해야할 내용들을 떠올리니 금방 일어나게 되었다. 전에는 몇 시간 공부하고 몇 분 쉬어야하는거지 이런 고민을 했는데 지금은 그런 고민이 필요없어졌다. 그냥 아침 공부시간, 점심 공부 시간, 저녁 공부시간에 집중해서 해당 공부를 하니 시간이 금방 간다. 또한 잠깐 쉬더라도 핸드폰은 사물함에 놓고 보지 않고 스트레칭을 하거나 밖에 잠깐 나가는 식으로 쉬었다. 매일 공부시작 전에 애니어그램 공부법을 읽으며 시작했다. 그러다보니 전에 비해서 나의 지난날들의 후회가 줄어들고 그 날 하루 공부에 집중하게 되었다. 시간은 더 다가왔는데 마음은 전보다 더 편해진게 신기하다. 칭찬일기도 매일 공부 일과가 끝나고 쓰고 있는데 계속 쓰다보니 나 자신이 애뜻해지고 아껴주고 싶다는 생각이 들었다. 너무 자책하며 못난 점만 보기보단 좋은 점들도 봐주고 스스로 할 수 있다. 응원하니 더 힘이 나는 것 같다." — 단퓨프 (26학년도 목포(약) 합격생) [1w2]`,
    `"이번주 공부가 대체로 만족스럽다! /저번주부터 본가에 와서 공부 중인데, 혼자 학교 근처에서 공부할 때보다 방해요인이 없어 공부만 하기 좋다. 시험 전까지 있을 예정이다! / 주 4회 운동으로 스트레스를 풀어주니 시험 스트레스를 날릴 수 있었고, 쓸데 없는 부정적인 생각을 몰아내고 다시 앉아서 긍정적으로 공부할 수 있었던 것 같다! / 아침 공부 시작 전 애니어그램 학습법을 읽고 오늘 실천할 것 하나씩을 적고 시작하는 것이 가끔 드는 뛰쳐나가고 싶은 마음(?)을 달래주었다! 이제 하나의 루틴으로 자리잡은 것 같다." — 시계탑기린친구 (26학년도 강원(수) 합격생) [4w3]`,
    `"스트레스와 불안으로 수면이나 생활에 힘든 순간이 있었으나 이겨내고 루틴을 거의 지켜냈다." — 후회없이살자 (26학년도 강원(약) 합격생) [5w6]`
    ]
  },
  "9-2":{
    생물:[
    `"한 학교의 기출을 회차별로 연이어 풀다 보니 중대교수님들이 중요하게 생각하는 단원, 포인트, 유형들이 조금씩 보이고 그에 해당하는 이론을 학습하다보니 자연스럽게 맞추는 갯수도 늘어 기분이 좋다. 앞으로는 다른 학교의 기출도 풀것이기에 학교별로 공통점, 차이점을 비교하면서 공통적으로 나오는 이론에 대해서는 더 확고히 이론학습을 해나야겠다." — 푸파 (26학년도 순천(약) 합격생)`,
    `"중앙대 기출에서 헷갈리거나 틀린 문제는 밑에 한줄 요약을 하고 이번주부터 캠벨에서 해당 내용을 아예 새로운 색깔로 표시해두면서 복습했다. 평일동안 매일 퀴즐렛을 풀고 헷갈리거나 틀렸던 문제는 표시해서 주말에 복습했다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"이번 주도 세포생물학 파트와 생리학 파트, 중앙대 기출을 풀며 전범위 복습을 진행했다. 약했던 생리학 발생, 면역 단원부터 전범위를 골고루 공부할 수 있었다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
    `"박선우 써머리 1권 내용을 암송하며 마무리한 것" — Hcsg (26학년도 원광(약) 합격생)`,
    `"1) 목표한 단원 이론 복습을 완료함. 2) 이론 복습을 하면서 7,8월 VF OX 문제와 퀴즐렛을 다시 풀고 오답 원인을 분석함. 단순 실수보다는 세부사항 개념 부족인 경우가 많았음. 이번에 또 틀린 문제들은 따로 정리함." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"VF 과제도 충실히 풀고 피드백 했으며, 피트도 무난한 속도로 풀었다. 다음주가 9월 셋째주인 만큼 지금 하고있는 VF와 PEET 이외에 N제를 조금 더 얹어 문제풀이 시간을 가져보고자 한다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"이번 주도 무탈하게 VF에서 제공하는 문제들을 base로 해서 이론을 꾸준히 복습했다. 중앙대 해당 문제들 이론을 복습하는 것 피트 기출은 이미 한번 다 풀었었어서 MD 기출을 예전 년도부터 지식형 위주로 푸는 중이다. 여러 질 좋은 문제들을 많이 풀어보며 이론을 견고하게 쌓아가야겠다. 그리고 한 번 전범위 이론을 빠르게 훑는게 필요할 것 같아 토요일부터 박선우 써머리를 읽기 시작했다. 다시 전범위 학습을 하니 부족한 부분도 발견할 수 있었고, 여러 번 공부했던 내용들은 장기기억으로 잘 끌고간 게 느껴져서 다음주 평일까지 한번 4권까지 다 훑어야겠다. +VF 핵심 기본기 OX도 해설지를 통해 전 회차를 한번 다시 공부했다. 가끔씩 이렇게 기본기 OX 내용도 다시 보면서 장기기억 잃지 않게끔 해야겠다." — 쿠리만쥰 (26학년도 5관왕 | 단국(약)·계명(제약)·삼육(약)·강원(약)·우석(약) 합격생)`,
    `"∙ 통합이론을 단원별로 복습하며 내용을 익힘. 문제풀이도 병행하며 루틴대로 진행함" — 레고링 (26학년도 계명(제약) 합격생)`,
    `"약점단원들 위주로 복습을 끝냈다. 약점단원들에 대해 MDP문제들을 잘 마무리하였다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
    `"이번주 진도를 밀리지 않고 나갔다. 다음주까지 진도를 빡세게 나가서 동물생리학까지 들어야 겠다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"중앙대 기출, VF OX, 전국 모의고사 등 지금까지 풀었던 문제들을 단원별로 분류하여 오답노트 기반의 단권화를 시작했다. 틀린 문제에 대한 해설과 기본서 등을 참고하여 써머리에 첨가하다보니 자연스럽게 반복 학습이 되어 좋았다. 긴가민가했던 지식을 바로잡고 구멍을 채워나가는 과정이 재미있었다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"저번주와 마찬가지로 박선우 OX, 8월 OX퀴즈 복습하면서 해당 부분 기본서, 박선우 교재 읽는 방식으로 공부하고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"지난 일요일에 있던 오픈 모의고사를 분석해보니 유전학, 분자생물학, 식생분진 파트가 부족함을 알게 되었다. 그래서 이번주에 7,8월 VF OX를 다시 한번 풀어주며 개념 보충을 하였다. 또한 문제별로 질문과 답을 기본서에 돌아가서 표시해주며 교수님들의 출제 포인트를 파악하려고 하였다. 4회 정도 풀어보니 어느 부분에서 자주 출제하는지 약간은 보이기 시작했다. 이 개념들 위주로 보충해나가면 될 것 같다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"인강진도를 끝마치고 복습에 들어갔는데, 머릿속에 지도를 만들고자해서 박선우 써머리의 카테고리 지도에 기억하기 위한 키워드나 연결고리를 필기하며 암기했다. 무작정 회독하고 암기하는 것보다 지도를 이용하니 확실히 머리속에 더 잘남는거 같다." — 약대가쟝 (26학년도 단국(약) 합격생)`,
    `"VF Ox 전범위 복습을 해줬다. 이 과정에서 중앙대 재배치 성적이 올라서 자신감이 붙었다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"이제는 조금 공부방식이 루틴화 되었다. 캠벨로 먼저 찾고 형광펜 치고 머릿속에 어떤 목차 부분인지, 어느 부분인지 잘 모르겠거나 아니면 설명이 필요할 때 노용관 선생님의 2.0교재를 참고하였다. 캠벨 베이스 책이여서 흐름이 비슷해 좋았다. 그런데도 이해 안가는게 있으면 꿀벌책을 참고하려 한다. 그렇게 공부한 후에 o,x를 공부하면 내가 그냥 넘어갔던 내용이나 중요한지 몰랐던 내용도 알게 되어 개념이 확장되는 느낌이 받았다. 매번 기출을 풀 때마다 나오는 파트가 반복된다고 느끼는데 느리지만 조금씩 해상도를 높이고 있는 것 같았다. 또한 공부는 하지만 내용이 정리가 안되는 것 같아 고민이었는데 VF답안지에 내가 공부한 내용이나 ox에서 다뤘던 내용들을 타이핑으로 정리해 놓으니 빠르게 공부한 내용을 훑어볼 수 있어서 좋았다." — 단퓨프 (26학년도 목포(약) 합격생)`,
    `"조급한 마음이 들어 건너뛰고 싶었지만 참고 복습을 한점" — 후회없이살자 (26학년도 강원(약) 합격생)`,
    `"계속 모의고사를 보면서 이런식으로 시험이 나오는구나~ 하는 것을 많이 알아가고 있다. 발생학, 면역, 생식이 어렵고 복잡하다고 생각했는데 학교마다 다르겠지만 이정도 난도로 나오기도 하는구나 라는걸 많이 느끼며 놓친 부분들을 챙기려고 많이 노력하고 있다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`
    ],
    화학:[
    `"평일에는 매일 한 단원씩 풀고 노트는 계속 보충하면서 다음날 아침에 복습했다. 맞은 문제들도 인강에서 모두 확인하면서 맞게 풀었는지 점검했다. 이번 테스트에서는 8월 테스트때보다 훨씬 덜 긴장하고 푼 것 같다. 정답률이나 푸는 시간이 7월보다 훨씬 나아진게 보여서 기뻤다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"기출올인원의 전기화학, 용액 단원을 풀며 그 단원에서 특히 약한 상황들도 공부할 수 있었다. 문제 풀 때 의식적으로 상황 APS생각하면서 풀이하려고 노력했던 것도 적응된 것 같다. 또한, 모의고사 보기 전 열역학 실수노트를 읽어보고 시험 봤는데 덕분인지 해당 단원 문제를 실수 없이 연습대로 풀 수 있었다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
    `"박인규 선생님의 사고방식을 흡수하기 위하여 일단 매 강의를 시청하기 전 해당 범위의 문제풀이를 진행하고 문제가 틀렸건 맞았건 상관없이 처음부터 끝까지 2배속으로 유튜브 강의를 시청하고 오답 진행을 하고 있는 점" — Hcsg (26학년도 원광(약) 합격생)`,
    `"1) 계획을 잘 지킴. 2) 강의를 들으면서 박인규 선생님의 사고과정을 따라가려고 노력함. 항상 일관된 풀이와 사고과정을 배우는 것이기에 더 빠르게 복습할 수 있었음. 2) 이번 모의고사처럼 긴장되는 상황에서도 APS로 먼저 문제의 구조 및 단서를 확인하고 풀었음." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"1) 밀리지 않고 18강 배위화학까지 다 풀었다. 암기를 소홀히 했던 이성질체 부분과 입체구조 부분과 오비탈 플롯을 바짝 신경써서 외웠다. 2) 퀴즐렛을 통해 2000제 잘 못풀었던 15~18단원 문제들만 캡처 선별해 다시 풀어보았다. 못 푼 문제들만 선별해 다시 풀어보는 시간을 가지니 약점을 메꿀 수 있었다. 매주마다 아리까리한 문제, 시간 오래걸린 문제, 틀린 문제만 모아 퀴즐렛으로 꼭 주별 복습을 해야겠다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"이번 주에는 문제가 쉽든 어렵든 문제를 풀 때 정답의 근거를 확실히 찾고 선지 옆에 표시를 해서 정답의 확신을 갖고 풀어나가는 연습을 했다. 일요일에 진행된 타임어택 모의고사를 풀 때에도 분명 잘 풀었는데 괜히 실수한 부분은 없었을까 틀리진 않았을까 다시 보게되는 습관이 다시 나와서 생각보다 시험보는데 오래 걸렸긴 했다. 그래도 부족한 부분을 인지하고 있으니 연습해서 보완해나가면 되겠다는 생각이라 걱정이 없다." — 쿠리만쥰 (26학년도 5관왕 | 단국(약)·계명(제약)·삼육(약)·강원(약)·우석(약) 합격생)`,
    `"2000제 문제를 단원별+전체범위를 병행하여 매일 학습함. 단원별로 공부하니 불안한 것이 많이 해소되어 기본기가 다시 쌓이는 느낌이 들었음." — 레고링 (26학년도 계명(제약) 합격생)`,
    `"매일 계산문제를 꾸준히 풀었고, 지엽적인 내용들도 조금씩 정리해나가고 있다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
    `"화학평형 단원이 잘 기억나지 않아 1500제와 병행해서 차근차근 학습했다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"코드 번호 3 완강하였고 나머지 코드 번호를 듣고 있습니다. 코드 번호 1 2 도 복습하면서 기본 풀이법을 계속 숙지하고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"저번주와 마찬가지로 강의 수강과 단원별 암기 노트 만들기를 하였다. 이 방법이 확실히 나에게 잘 맞는 것 같다. 물질 변화 파트로 들어가니 조금 어려워져 1500제 먼저 복습해주고 2000제를 공부해주었다. 기본 개념 복습하고 문제를 푸니 더 잘 풀려서 좋았다. 모의고사에 대비해서 2000제 진도와 병행해서 1500제 개념 복습을 해주었다. 그리고 문제 풀면서 차분하게 문제 조건 놓치지 않고 실수하지 않도록 평소에 연습하였다. 그 덕분에 그동안은 알던 문제라도 다시 보면 틀리는 경우가 많았는데 이번 모의고사에서는 AP를 계속 떠올리면서 차분하게 푸니 2000제에서 본 문제들을 다 맞췄다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"일요일에 있는 시험을 대비해서 한 단원에 국한된 인강보다는 1500제 개념 전범위를 회독하고 2000제에서 약하다 싶은 단원의 문제들을 풀어봤다. 그렇게 했더니 오늘 시험에서 2개정도 틀렸고 시간도 엄청 남았다. 하지만 틀린 2개는 mol수를 압력으로 실수로 안바꿔서 틀린거고 99.9%를 0.001로 잘못 바꿔서 틀린거라 개념적인 구멍은 없는것 같다. 다 맞을 수도 있었어서 진짜 아쉽지만 그냥 삼키고 생각하지 말아야겠다." — 약대가쟝 (26학년도 단국(약) 합격생)`,
    `"코드4 수강 전에 코드1, 2에서 오답이었거나 고난이도였던 문제 80제를 뽑아서 다시 풀어봤다. 이 때문에 진도가 하루 밀리긴 했지만, 코드1, 2 전범위 문제를 빠르게 한 번 더 복습할 수 있어서 꼭 필요했던 것 같다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"박인규 선생님의 말씀처럼 문제를 풀며 이론을 익히는데 집중하였다. 나는 원래 너무 꼼꼼한 경향이 있어 이론에 집중하고 힘빠지고 그랬었는데 이제는 화학뿐만 아니라 유기 생물도 문제를 풀어보는게 개념을 정리하는데 정말 도움이 된다는 것을 느꼈다. 그날 이론은 그날 마인드 맵으로 정리하고 하루 공부 시작 전에 목차를 훑고 들어가면 빠르게 복습 가능해서 좋다 계속 aps를 실천하려고 노력했다. 무작정 펜을 가져가는게 아니라 이 단서들을 어떻게 조합할지 생각하고 문제를 풀었다. 사실 지금은 그 생각을 하는데 조금 시간이 걸리긴 한다. 그래도 풀다보면 점점 익숙해져서 그 시간이 줄어드는 것 같다." — 단퓨프 (26학년도 목포(약) 합격생)`,
    `"애니어그램 학습법처럼 화학공부 시작 전에 화학 공부 체크리스트를 읽고 오늘 화학공부에서 집중할 항목을 다이어리에 적고 화학공부를 시작했다. / 반복 횟수가 늘어남에 따라 이전에 신경 쓰지 못한 점(ex. 근사 기준, 답의 형태...)에 대해서도 생각해볼 여유가 생겼고, 이전엔 어렵게 느껴졌던 내용들도 이해할 수 있게 된 것 같다./ 전체 내용 구조를 중요시하며 헷갈리는 개념이 생기면 그에 해당하는 1500제 예제를 풀어보려 하였다./ 등수는 낮지만 이번 모의고사 결과가 매우 만족스럽다! 그동안 내가 올바른 방향으로 열심히 공부한 것 같아서 뿌듯했다. 마킹실수(1)랑 계산 실수 한 거(1) 빼면 사실상 내가 2000제 공부한 부분까지는 다 맞았어서 뿌듯했다!" — 시계탑기린친구 (26학년도 강원(수) 합격생)`,
    `"풀이방향을 생각하고 푸는 것이 조금씩 익숙해져 가는 듯 함 큰 도움이 됨." — 후회없이살자 (26학년도 강원(약) 합격생)`,
    `"문제를 꽤 많이 풀다보니 조금씩 자신이 붙기 시작했다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`
    ],
    유기:[
    `"peet 이외의 범위를 처음으로 test를 보았기 때문에 약사랑 유기화학을 통해 이론 학습을 하였다. 작년 경성, 계명 시험과 작년에 수강한 인강을 고려해보았을 때, 선생님께서 유기는 기본서 예제문항만 풀 수 있으면 되는 수준이라고 이야기 해주신 게 어떤 의미인지 더 깨닫게 되었고, 약사랑 유기화학 강의가 최적화되어 있다는 것을 느꼈다. 강의 시간이 짧기 때문에 피트 범위도 꾸준히 보면서 불필요한 학습을 하지 않아야겠다." — 푸파 (26학년도 순천(약) 합격생)`,
    `"매일 2시간 이상 공부했고 전날 공부한 내용을 복습하는 시간을 매일 가졌다. 메커니즘을 최대한 그려서 이해하려고 노력했고 주말에 16-18단원에서 배운 반응들을 전체적으로 간단히 정리하며 복습했다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"매일 꾸준히 2시간 이상씩 공부하는 습관이 잡혔다. 목표 단원을 우선적으로 공부하고 저번 주 공부 단원도 맵핑 등으로 복습하는 루틴을 이어나가야겠다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
    `"매주 쪽지시험 진도에 맞춰 밀리지 않고 공부한 점. (PPT, 스미스 기본서를 먼저 보고 모르는 부분을 약사랑 유기화학 강의를 보며 보완하는 공부가 나에게 잘 맞는다는 것을 확인했다)" — Hcsg (26학년도 원광(약) 합격생)`,
    `"1) 매일 유기화학 공부 2시간을 잘 지켜냄. 2) 기본서 이론 + 예제 공부 후 약사랑 유기화학 강의를 통해 마무리함. 3) 유기1 중 취약단원이라고 생각했던 알코올과 에터 단원 복습도 완료함." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"알데히드, 케톤 유기2 부분이 유기1에 비해 덜 숙련되어 있어서 그런지는 몰라도 양이 많았다. 하지만 기본서와 인강, 간략 요약본까지 잘 챙겼다. 특히, 그동안 메커니즘을 등하시했었는데 그때문에 생각보다 잘 문제풀이가 원활하지 못했다. 이를 반복하지 않기 위해 직접 손으로 써봤는데 외우지 않더라도 한번 써보는 것이 단원 이해에 큰 영향을 미치는 것같다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"매일 두시간씩 꾸준히 유기화학 공부를 했더니 일요일인 오늘 부로 편입 유기화학 시험에 나올만한 단원들(탄수화물 단원 전까지) 스미스 기본서 진도를 다 나갔다. 마지막에 suzuki, heck반응 등등이 있는 단원들은 7월 학습플랜 상담때 말씀하셨던 것 처럼 반응의 시약과 이름 정도 위주만 적당히 학습하고 넘어갔다. 이젠 복습만 남았으니 누적복습을 꾸준히 해야겠다." — 쿠리만쥰 (26학년도 5관왕 | 단국(약)·계명(제약)·삼육(약)·강원(약)·우석(약) 합격생)`,
    `"금요일 시험 전까지 강의를 듣고 ppt 내용 정리하는 루틴 진행함. 헷갈리는 것들을 정리하고 암기하는 시간을 가짐." — 레고링 (26학년도 계명(제약) 합격생)`,
    `"유기2 내용을 빠르게 한 번 학습하고자 해서,카보닐 축합까지 맵핑 형태로 정리를 하며 학습을 이어나갔다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
    `"카보닐 알파치환까지 공부를 하고 정리까지 했다. 다음주에 유기화학 1회독과 아민까지 정리를 끝내야 겠다. 정리 끝나면 매일 꾸준히 보면서 익숙해질 예정이다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"기본서와 예제를 중심으로 차근차근 공부했다. 매커니즘을 손으로 그려가며 익혔다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"기본서를 25장(고리형 협동반응)까지 1회독을 끝냈고 TEST복습과 유튜브도 병행하며 공부하였습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"저번주와 마찬가지로 매일 가장 먼저 최소 2시간씩 학습하고, ‘앞내용 복습 -> 강의 -> 스미스 -> 노트 정리’ 사이클도 그대로 이어 나갔다. 강의에 나온 모든 반응들의 메커니즘을 여러번 그려가면서 학습하고, 최종 한장으로 정리해 여러 반응을 한번에 보려고 하였다. 그리고 유튜브 강의에서 관련된 앞 단원과 연결시켜주셨는데 그부분도 다시 복습해주었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"시험범위 페이지 안내엔 없었지만 카보닐 반응 기초부분까지 회독하느라 시간이 더 오래걸렸다. 하지만 확실히 이해를 해서 이번 시험에서도 1개밖에 안틀렸다. 이렇게만 계속 이어지면 유기화학은 걱정없을것 같다. 방대한 기본서를 이제 4단원정도 남겨놓으니 얼마 안되어 보이는 착각을 하곤 한다. 하지만 이건 그만큼 내가 유기화학을 잘 카테고리화 했다는걸로 생각한다. 마무리로 유튜브 강의까지 보니 더 이해가 잘되고 암기까지 할 수 있어 좋다." — 약대가쟝 (26학년도 단국(약) 합격생)`,
    `"매일 2시간씩 정해진 분량의 공부를 했다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"유기 공부를 제일 아침으로 변경하여 매일 2시간 30분 공부를 지켰다. 매일 꾸준히 하다보니 목표했던 2단원을 끝냈다. 또한 전에 피트할 때는 뭔 내용인지 이해 안가는데 진도 나가가기 급급해 그냥 외우기만 했던 내용이었는데 이제는 머릿속에서 어떤 상황인지 떠올리며 예제를 풀고 있다. 공부하다가 모르는 부분은 일단 ai의 도움을 받아 해결했다. 앞으로 그랬는데도 이해가 안가는 문제가 있으면 약사랑 유기화학 카페에 질문을 하려한다." — 단퓨프 (26학년도 목포(약) 합격생)`,
    `"공부할 때는 몰랐는데 시험을 쳐보니 카보닐,아민 파트가 좀 부족한 거 같아서 약사랑 유기화학 강의를 듣고 복습했다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
    `"계속 실력이 부족하다고 느껴서 하루에 3시간씩 투자해서 공부했다. 복습을 매일 조금씩이라도 전날 내용을 하려고 노력했다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`
    ],
    생활관리:[
    `"그닥 없는 것 같다. 평일 아침 루틴이나 애니어그램 읽기 같은 걸 지키는 건 이제 무리가 없기 때문에 잘했다고 적기 그렇다.." — 승민 (26학년도 단국(약)·연세(생화학) 합격생) [9w8]`,
    `"이번 주는 몸 컨디션이 좋은 한 주는 아니어서 운동을 제대로 하지 못했지만, 산책이나 5층까지 스터디 카페 계단 오르기 등으로 약간의 생활 운동을 가져가려고 노력했다. 또한, 하루하루 해야 할 일들에 집중하며 긍정적인 생각 위주로 하루를 마무리하려 노력했다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생) [1w9]`,
    `"자투리 시간을 최대한 활용하여 공부하려 한 점. 토익 980점(드디어)을 확보한 점" — Hcsg (26학년도 원광(약) 합격생) [5w6]`,
    `"가족 결혼식이 있어 하루를 통째로 날렸음에도, 쉬는날로 삼고 아예 맘편히 쉬니 오히려 다음날 흐트러지지 않고 다시 공부에 매진할 수 있었다. 어쩔 수 없이 공부 못하는 날이 온다면 조급해 하기 보다는 차라리 하루 푹 쉬고 다음날 다시 열심히 하는 태도를 갖도록 하자!" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생) [1w9]`,
    `"이번 주는 컨디션도 괜찮고 멘탈도 괜찮았고, 별 일 없이 하루하루 보냈다. 별일 없이 꾸준히 공부하면서 시간 흐르는게 제일 좋은 것 같다. 매일 할 일 해나가면서 본고사날까지 지치지 않고 해내보자." — 쿠리만쥰 (26학년도 5관왕 | 단국(약)·계명(제약)·삼육(약)·강원(약)·우석(약) 합격생) [5w6]`,
    `"∙ 잘 안되는 날도 9번 학습법을 읽으며 마인드컨트롤을 하고 계획한 공부 시간을 채웠음 ∙ 집중력이 떨어지는 것 같아 새로운 자리로 옮겨 공부하니 훨씬 좋았음" — 레고링 (26학년도 계명(제약) 합격생) [9w1]`,
    `"이제 생활적인 측면은 거의 완벽하게 적응이 되었다. 휴대폰을 보는 시간도 많이 줄어서 생활 관리 측면에서는 만족도가 높다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생) [8w7]`,
    `"순공 시간을 10시간 30분~11시간 정도로 늘렸다. 3월에는 10시간을 채우기가 꽤나 힘들었던 것 같은데, 지금은 전혀 그렇지 않아서 신기하다. 또 긴장감과 경각심 덕분인지 공부가 마냥 지루하지 않아서 좋다. 상위권 학생들과의 격차가 좁혀지지 않는 것 같아 불안한 마음은 있지만, 적어도 격차가 더 벌어지고 있지는 않다는 사실에 자신감을 얻으며 꾸준히 정진해야겠다." — 초록콩 (26학년도 순천(약) 합격생) [9w1]`,
    `"이번주는 큰 이슈없이 안정적으로 보냈습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생) [6w5]`,
    `"공부시간을 늘려야겠다고 생각해서 오전 공부를 다시 추가해서 유기 학습을 배치해 주었다. 루틴이 잡힌 상태에서 조금 조정하니 금방 적응 할 수 있었다. 이렇게 하니 나머지 과목 학습 시간도 더 확보할 수 있었다. 또한 운동도 다시 시작했는데 확실히 개운하게 공부에 집중 할 수 있었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생) [4w3]`,
    `"생물 인강이 끝나 도서관에서 인강보다는 개인공부에 집중할수 있는 시간이 많아져 도움이 되었다. 인강은 너무 수동적인 공부라 잔상말고는 남는게 없었는데, 혼자 생각하는 공부를 하니 하루하루가 더 뿌듯하고 뭔가 쌓이는 느낌이 이제서야 든다. 그리고 9월부터는 운동을 주 2~3회로 줄이고 나머지 날엔 지금까지 도서관이 22시에 닫아 애매했던 시간을 보충하기 위해 스터디카페를 시간제로 끊어 다니기 시작했다. 자정까지하고 씻고 바로 자니 죄책감도 덜하고 알차게 시간을 보낸거 같아 좋다." — 약대가쟝 (26학년도 단국(약) 합격생) [5w6]`,
    `"자소서 작성이 좀 길어졌는데, 운동 시간을 줄여서 공부 시간을 지킬 수 있었다. 그리고 애니어그램 공부법과 명언들을 읽으면서 초심을 다졌다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생) [9w8]`,
    `"1.사물함에 핸드폰을 넣고 공부했다 2.공부하다가 딴 생각을 한다는 것을 알게 되었다. 그럴 때마다 의식적으로 다시 집중하려 노력했다. 심호흡을 한 번 크게 쉬고 한다던지 잠시 스트레칭을 한다던지 하면서 다시 집중하려 노력했다. 3. 일년 동안 미룬 치과 치료를 했다. 당시에 선생님께서 금니로 해야한다고 하셔서 금니가 생기는 게 싫어서 계속 미뤘다. 그리고 그렇게 방치하는 스스로를 한심하다고 생각을 했다. 사실 지금 시간 빼는게 얼마나 리스크가 큰 일인지는 알았지만 계속 마음에 걸려 차리리 끝내버리자 싶어 최대한 빨리 예약해 치료를 받게 되었다. 나는 이게 나에게 안 좋은 영향을 줄 것을 알면서도 회피하는 경향이 있는데 그걸 마주하고 해결한 점을 칭찬하고 싶다. 이제 맘에 걸리는 것이 사라졌으니 공부에 더 집중하자. 4. 일정이 끝난 후에 바로 스카로 돌아와 조금이라도 공부하려 노력했다. 5. 안 좋고 슬픈 감정이 올라왔을 때 명상을 하며 그 감정을 넘기고 다시 집중했다." — 단퓨프 (26학년도 목포(약) 합격생) [1w2]`,
    `"주 6회 운동을 갔다. 4회는 24분 고강도 인터벌을 하였고, 2회는 가벼운 걷기나 코어, 근력 운동을 해주었다. 이번주 생활관리가 저번주보다 만족스럽다!" — 시계탑기린친구 (26학년도 강원(수) 합격생) [4w3]`,
    `"매일 같은 시간에 일어나서 같은 시간에 밥을 먹고 공부하는것을 잘 했다. 아침에 좀 피곤하긴 해도 좋은것같다. 매일 집에서 운동을 했다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생) [9w1]`
    ]
  },
  "9-3":{
    생물:[
    `"기출에서 틀렸던 부분이나 헷갈렸던 부분은 계속 표시하고 적어두며 복습하고 있다. 암기가 잘 안되는 내용(생식계, 식물 호르몬)은 타이핑하면서 정리하고 수시로 보려고 했다. 퀴즐렛은 계속해서 매일 풀려고 했다. 이번주부터 7월 ox도 복습하기 시작했다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"학업과 생물을 병행하는 방법을 찾아낸 것. 비어있는 주말에 집중적으로 이번주 풀케어반 모의고사 60문제(모든 문제)의 해설을 일일이 뜯어보며 자세한 부분은 켐벨을 찾으며 공부한 것." — Hcsg (26학년도 원광(약) 합격생)`,
    `"중앙대 기출을 풀며 문제 범위 위주로 기본서를 그림 위주로 복습하며 전범위를 복습할 수 있었다. 예상치 못한 부분에서 틀려서 몰랐던 오개념도 발견하여 채울 수 있었고, 추가 복습했던 파트는 성취도가 좋았다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
    `"1) 내용 구조화 + 가리면서 설명하는 방법을 통해 이론을 복습함. 2) VF 기출 문제와 MD 문제를 통해 부족한 단원을 파악하고 다시 복습함. 3) 자투리 시간을 활용하여 틈틈히 퀴즐렛으로 VF 기본기 OX 문제를 복습함." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"1) VF 및 피드백까지 잘 마무리함. 2) 심플을 풀며 시험 운용에 대한 감을 슬슬익히기 시작하고 있다. 시간 재고 타임어택으로 푸는데 생물은 그래도 화학에 비하면 괜찮을 듯하다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"∙ 단원별로 통합이론을 읽고 워크북 ox로 확인하는 과정을 빠르게 진행함. 부족한 부분을 발견하고 채우는 과정을 반복했음" — 레고링 (26학년도 계명(제약) 합격생)`,
    `"다시 세포생물학부터 문제를 풀고 있다. 분자생물학 파트가 약하다고 생각을 해서 분자생물학 내용은 다시 한 번 학습을 하였다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
    `"면역학 파트가 생각보다 오래 걸려서 진도가 늘어졌지만 그래도 다음주 초에동물 생리학이 끝날듯 싶다. 아마 10월 초면 진도는 다 나갈듯 하다. 이제 진도에 여유가 생겼으니 강의듣는거에 급급하지 말고 앞에거 복습을 시작해줘야 겠다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"핵심 개념과 오답 위주로 단권화 노트를 만들고 있다. 그냥 공부하는 것보다는 시간이 오래걸리지만 나중에 분명 도움이 될 것 같다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"박선우 교재 회독을 마쳤고 퀴즈, 박선우 서머리 OX 복습하면서 계속 반복학습하고 있습니다. 선생님 조언 덕분에 식생분진에 대한 부담감도 줄어들었습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"VF 중앙대 모의고사에 추가적으로 경희대 21~25학년도 기출 문제를 풀었다. 문제에 나온 개념을 써머리에 표시하고 써머리에 없는 내용은 기본서에서 찾아 보충해서 정리해주었다. 문제 풀이가 쌓여갈수록 빈출 포인트가 더 잘 보여서 모든 개념을 완벽히 하지 못했다는 불안감을 완전히 내려놓을 수 있었다. 문제를 풀면서 개념을 공부해 나간다는 것이 어떤 방식의 공부인지 이제 알 것 같다. 문제를 통해 개념을 확실히 익히고, 문제를 풀면서 개념을 아웃풋해내는 방식을 터득해 가는 과정이라고 생각한다. 경희대 문제를 풀다보니 기본서 내용만으로는 해결되지 않는 문제들이 있었다. 앞으로 MDP 문제들을 풀어주며 보충해 나가야겠다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"재배치 모의고사에 나온 개념들을 단권화해둔 노트와 교재를 활용해서 복습했고, 7,8월 ox와 중대 기출에서 영어 용어를 모아둔 단어장을 만들어서 틈틈히 보고 있다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"1주차, 2주차는 모두 생물에 불안한 마음이 컸었다. 뭔가 공부를 하고 내용이 휘발이 되는 것을 불안해하는 것 같았다. 그래서 내가 덜 불안해하는 방법이 뭐가 있을까 생각을 했다. 여태까지는 패드로 공부를 하고 알게된 내용을 타이핑으로 정리했었다. 그런데 나는 아이패드로 내용을 복습하는 것보다 종이에 원하는 내용을 바로바로 넘겨보며 볼 수 있는 것을 선호한다는 점을 떠올렸다. 대학 공부때도 항상 pdf를 프린트해서 공부했었다. 그래서 이번주부터는 기출을 단면 프린트해서 문제에 대한 해설을 적고, VF해설, 캠벨, 노용관썜책, 꿀벌책을 보며 공부하고 이해한 내용을 옆에 빈 페이지에 정리하였다. 또한 o,x문제도 모두 프린트해 같이 필요한 부분은 필기하며 공부하였다. 그리고 공부 시작 전이나 자기 전에 그것을 보았더니 조금 자신감이 붙었다. 아직 모르는 부분이 더 많겠지만 할 수 있겠다는 생각이 들었다. 원래는 회차 순서대로 빠르게 나가려노력했지만 이도저도 안되고 있다는 생각이 들어 일단 전체 부분 중에 헷갈렸던 부분이나 몰랐던 내용을 답지로 빠르게 확인하고(이땐 캠벨을 찾진 않았습니다), 5회차를 중심으로 1번부터 해당 내용을 차분히 이해하였다(이때부터 캠벨, 노용관쌤책, 꿀벌을 공부했습니다). 그리고 ox를 풀고, 1~4회차 해당 파트 문제를 다시 복습하고 넘어갔다. 그래서 이번주는 세포생물학과 면역계부분의 내용을 깊게 공부하였고, 다음주는 분자생물학부분을 깊게 보려고 한다. 그리고 또 잘한 점은 문제를 풀면서 헷갈리는 부분이나 몰랐던 개념 또는 알았지만 내가 까먹은 내용을 바로 표시한 것이었다." — 단퓨프 (26학년도 목포(약) 합격생)`,
    `"전체 단원들의 내용을 빨리 빨리 돌아보려다 보니 오히려 빈틈이 많아진 것 같다는 생각이 들었습니다. 그러다 보니 애매하게 알고있는 내용들이 생겼고 답은 맞추더라도 정확하게 알고 맞추지 못했습니다. 시험을 계속 치다보니 중요한 기출 포인트나 나의 약점이라 생각하는 챕터들이 생겼고 그래서 그것들부터 하나씩 꼼꼼하게 공부하며 채워가는 중입니다. 이번 미니시험에서 적어도 공부한 단원에서는 애매하게 맞추지 않고 정확하게 알고 맞출 수 있어서 자신감이 조금 생겼습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
    `"깨진독에 물붓는것처럼 계속해서 까먹고 채워넣기를 반복하고 있다. 특히 너무 생소한 식물과 면역 내용은 계속해서 까먹는 중이다. 금요일 모의고사에서도 식물과 면역 내용만을 틀리는 것을 보고 내 약점단원임을 더 잘 알게 되었다. 더 열심히 해서 약점을 보완하고 더 큰 독으로 만들어야겠다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`
    ],
    화학:[
    `"매일 한 단원씩 풀고 노트는 계속 보충하면서 다음날 아침에 복습했다. 맞은 문제들도 인강에서 모두 확인하면서 맞게 풀었는지 점검했다. 코드2때보다 전기화학에 대한 이해도가 좀 높아진게 느껴져 정확도나 속도가 개선되었다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"기출올인원을 풀며, 2000제 일부와 1500제 목차 복습도 진행했다. 단원별로 부족했던 부분도 문제를 풀며 조금씩 보완했다. APS 생각하며 문제 푸는 습관은 유지하되 상식 파트 등의 정리가 필요한 것 같아서 암기 노트도 만들었다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
    `"1) 내가 생각하는 최소한의 공부량과 공부 시간을 채움. 2) 화학 공부 체크리스트로 공부 방향성을 다시 점검함. 3) 핵심 써머리 부분에 강의 중 언급하시는 상식, 부가적인 내용을 정리하면서 공부함. 또한 복습할 때도 APS를 항상 지키면서 문제를 풂." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"1) 점군, 분광학까지 2000제 마침 2) 기출올인원 단원별 연습도 중요하지만 모의고사 연습도 중요한 것같아 22, 23학년도 경희대 기출올인원을 시작했다. 3) 인규쌤 말대로 모의고사 연습하되, 단원별 문제 복습도 소홀히 하지 않아야 한다. 그래서 2000제 16,17단원 틀린, 주요문제 다시 복습함!" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"2000제를 단원별로 풀고 연습 모의고사도 병행하며 단원별, 전범위 모두 학습함. 2000제 문제들은 편안하게 풀리는 느낌이 들었음. 다음주부터는 기출올인원을 시작하자." — 레고링 (26학년도 계명(제약) 합격생)`,
    `"화학강의를 들으며 계산 근사하는 법을 많이 배운것같다. 근사를 시원시원하게 하는게 나와 많이 차이났던것 같다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"저번주와 마찬가지로 코드번호 1 2 3복습하면서 나머지 코드번호 진도나갔습니다. 다음주에 완강하고 기출올인원으로 넘어갈 수 있도록 하겠습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"저번 주와 마찬가지로 1500제 복습하고 2000제 강의 수강을 한 후 암기 노트를 만들었다. 원리를 이해하고 AP를 떠올리며 문제를 푸니 화학 열역학, 전기화학, 배위화합물 파트가 더 이상 어렵지 않고, 오히려 앞부분보다 쉽게 느껴졌다. 아직 코드 1, 2 문제를 풀고 있어서 비교적 쉬울 수 있지만, 이 기본기를 바탕으로 코드3 넘어가는 문제들도 나중에 어렵지 않게 풀 수 있을 거라 생각한다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"2000제 강의를 들으면서 전공 심화 내용과 지엽적인 내용을 구분해서 정리해두었고, 코드3 복습을 병행하면서 외워야 할 것들을 외우면서 진도를 나가고 있다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"이번주에 가장 잘한 점은 하루 30분 복습을 매일 실천했다는 점이다. 저번주 모의고사를 보면서 정말 익숙해져서 기계적으로 나올 수 있도록 연습해야하는구나를 느꼈다. 확실히 그냥 공부하면서 문제를 풀 때랑 느껴지는 압박감이 달랐던 것 같다. 그래서 1500제 문제들을 3장부터 하루 30분씩 복습했다. 복습을 하니 확실히 전보다 불안감이 덜해졌다. 그리고 복습을 할 때도 계속 aps를 생각하며 체계적으로 풀려 노력했다. 아직은 빨리 풀지는 못하지만 그래도 이것이 반복되면 문제를 보고 바로 단서를 파악하고 박인규 선생님말씀처럼 기본기 조합으로 응용 문제를 풀 수 있을 것이다. 다음으로 잘한 점은 원래는 마인드맵으로 복습을 진행했는데 생각보다 가시성이 안좋고 한눈에 잘 안들어오는 것 같아 6장부터 학습을 하고 해당 이론과 문제 풀며 주의할 내용을 a4에 정리를 하였다. 직접 쓴 글씨로 보고 내가 이해한 내용에 맞춰 쓴 정리본이라 더 머리에 잘 들어왔다." — 단퓨프 (26학년도 목포(약) 합격생)`,
    `"적당한 계획량을 저번주에 잘 세워 불필요한 스트레스 없이 편안하게 공부할 수 있었다." — 시계탑기린친구 (26학년도 강원(수) 합격생)`,
    `"화학의 기본 내용을 다 알고 있다고 생각했지만 편입 화학에서는 아직 모르는 내용이 있다는것을 알게됐습니다. 그래서 애매하거나 모르고 있던 개념들이 생긴 파트부터 1500제로 다시 공부하며 기본 상식과 개념을 채웠습니다. 어렵게 풀던 문제도 더 쉽게 푸는 방법이 있었고 모르고 있던 내용도 새롭게 배울 수 있었습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
    `"목표한 강의를 다 들을 수 있었다. 1,2번 문제를 열심히 풀면서 평형도 어느정도 자신이 생기는 것 같다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`
    ],
    유기:[
    `"매일 2시간 이상 공부했고 전날 공부한 내용을 복습하는 시간을 매일 가졌다. 그전까지는 주말에 반응들을 간단하게 총정리했는데 이번에는 테스트를 보기 전에 정리 해봤다. 테스트를 볼 때 저번주처럼 정리가 안된다는 느낌이 덜 들어서 좋았다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"매주 쪽지시험 진도에 맞춰 밀리지 않고 공부한 점." — Hcsg (26학년도 원광(약) 합격생)`,
    `"이번 주도 2시간씩 매일 루틴처럼 공부했다. 루틴이 잡혀가니 유기화학 공부하는 시간이 제일 좋을 정도로 밀도 있게 공부할 수 있었다. 또한, 공부하면서 실수했던 부분들을 간단히 적어놓은 노트를 보고 문제를 풀었는데 덕분에 반응은 실수 없이 잘 풀 수 있었다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
    `"시간이 없어서 약사랑 유기화학 수강 계획만 지킬 수 있었음. 약사랑 유기화학 자료로 내용 구조화+ 복습으로 최대한의 공부 효율을 냄." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"비록 유기1을 이번주도… 못 봤지만 급한대로 알데히드/케톤부터 유도체까지 유기2 부분 전체 복습하였다. 유기1보다 유기2를 더 안 외웠기 때문에 일단 급한 불부터 잘 껐다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"∙ 강의 듣고 기본서 내용을 학습함. 유기 공부에 2시간 이상 충분히 시간을 투자하고 개념도 복습함" — 레고링 (26학년도 계명(제약) 합격생)`,
    `"유기2 부분까지 전체 1회 학습을 완료하였다. 유기2 앞부분 내용들도 조금씩 정리해나가고있다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
    `"아민까지 공부를 다 하고 아민까지 정리도 끝냈다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"기본서와 예제를 중심으로 차근차근 공부했다. 매커니즘을 손으로 그려가며 익혔다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"스미스 예제, TEST 복습하면서 강의를 들었습니다. 학습 시간을 매일 2시간씩 지켰습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"매주 하던 방식대로 오전에 먼저 2시간 30분씩 학습하고, ‘앞내용 복습 -> 강의 -> 스미스 -> 노트 정리’ 사이클도 그대로 이어 나갔다. 유기 학습 시간을 단축하기 위해 반응의 생성물, 반응물, 시약만 핵심으로 한 장 요약해주었다. 그동안은 매커니즘까지 정리하느라고 오래 걸려서 이번엔 메커니즘은 손으로 여러 번 반복해서 빠르게 그려서 익히고, 정성 들여 요약하는 것은 핵심 반응만 해주니 시간을 줄일 수 있었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"스미스 교재를 읽으면서 예제를 풀고 약사랑 강의를 듣는 루틴으로 꾸준하게 공부했다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"매일 아침 2시간 반동안 유기를 공부하였다. 전에 peet를 준비할 때는 분명 그냥 뭔지 모르고 외웠던 내용인데 기본서를 읽으며 공부하니 확 시야가 넓어지는 느낌을 받았다. 유기도 마찬가지로 그날 공부한 내용을 a4에 정리하였다. 그리고 그것을 공부 시작 전에 훑어았더니 빠르게 앞 내용을 복기할 수 있어 좋았다. 유기도 화학처럼 체계적으로 순서를 지키며 풀려고 노력했다. 아직 쉬운 내용들이지만 그래도 스스로 의식하고 실천하려 한 것은 잘한 점 같다." — 단퓨프 (26학년도 목포(약) 합격생)`,
    `"피트 범위 밖의 내용들은 생각보다 제가 많이 부족하다는 걸 느껴서 약사랑 유기화학 강의를 들으면서 기본서와 함께 공부하고 반응을 따로 정리해서 짬짬이 복습했습니다. 반응물과 반응 조건만 봐도 생성물을 알 수 있도록 포커스를 맞추고 공부했습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
    `"유기가 너무 부족했어서 흐름을 다시 제대로 잡으려고 시간을 많이 투자했다. 앞부분의 흐름을 다시 제대로 보면서 익히려고 노력하다보니 뒷단원의 흐름도 계속 비슷하다는 생각이 들었다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`
    ],
    생활관리:[
    `"이번 주 전체적으로 컨디션이 나빴지만 평일 루틴을 어기지 않았다. 주말에 쉬면서 가족들과 일정을 같이 보냈는데 리프레쉬되면서 이번주에 대한 부정적인 생각들이 나아지고 더 동기부여가 되었다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생) [9w8]`,
    `"학교 공부를 병행해야 하는데 다행히 방법을 찾았다. 문제별로 각개격파가 가능한, 박인규 선생님의 적중 2000제를 월요일부터 금요일까지는 하루평균 30문제씩 40분동안 풀고 오답까지 하고(이렇게 해야 간신히 적중 2000제를 끝낼수 있을것 같다.) 그리고 유기화학을 하루 1시간 별도로 투자해서 공부하며, 주말에는 그 주에 있는 시험보는 것(토익,VF 모의고사)과 매주 VF 모의고사 푼거 60문제 전부 해설 뜯어보며 켐벨 발췌독을 하기로 했다.(시간을 은근 많이 잡아먹어서 다른과목을 못하게 될수 있어서, 수요일에 일반생물학실험2, 수요일과 금요일에는 생화학1, 화요일과 목요일에는 유기화학2, 금요일에는 유기화학실험을 수강중이라 이렇게 하기로 했다.)" — Hcsg (26학년도 원광(약) 합격생) [5w6]`,
    `"이번 주는 저번 주보다는 몸 컨디션이 더 좋아져서 운동도 루틴대로 했고, 집중도도 지난주보다 나아졌던 한 주였다. 전체적으로 긍정적인 마음으로 한 주를 비슷하게 하루하루 열심히 보냈던 것 같다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생) [1w9]`,
    `"VF 문제 풀이 일정과 공부 습관 덕분에 진도가 많이 늦춰지지 않은 듯함. 다음 주는 더 힘내보자." — 이번엔내차례 (26학년도 삼육(약) 합격생) [9w8]`,
    `"멘탈 한번 무너져도 그래도 다시 마음 잡고 긍정적으로 생각하려 노력했다. 노력과 연습으로 충분히 극복할 수 있다는 (근거 없는?) 믿음이 있고, 어느 순간 하다보면 점수 올랐을 때의 쾌감도 있지 않을까 긍정적으로 생각했다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생) [1w9]`,
    `"∙ 매일 전과목을 고르게 복습하며 루틴을 지켰다. ∙ 벽을 보는 자리로 옮기고 난 뒤로 주변 신경이 덜 쓰이고 집중이 더 잘됐다." — 레고링 (26학년도 계명(제약) 합격생) [9w1]`,
    `"이제 생활적인 측면은 거의 완벽하게 적응이 되었다. 휴대폰을 보는 시간도 많이 줄어서 생활 관리 측면에서는 만족도가 높다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생) [8w7]`,
    `"이번주 운동 3번 갔다. 일찍 일어나서 일찍 학원에 갔다" — 고냥이 (26학년도 경희(치)·경성(약) 합격생) [5w6]`,
    `"순공시간을 일정하게 유지하며 계획한 공부량을 잘 소화했다. 고강도 운동은 하지 못했지만 자전거타기, 식사 후 산책 등 최소한의 활동량은 확보하고자 노력했다." — 초록콩 (26학년도 순천(약) 합격생) [9w1]`,
    `"일주일이 너무 빠르게 느껴질만큼 루틴적으로 잘 보내고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생) [6w5]`,
    `"다음 주 오빠가 유학 가기 전에 몇 년 만에 가족이 다 같이 2박 3일로 캠핑을 다녀왔다. 중간중간 최대한 공부 시간을 만들어 보려 했지만 생각처럼 쉽지 않았다. 그래도 공부 흐름을 완전히 끊어버리면 다시 끌어올리기 힘들 것 같아 ‘유기만이라도 꼭 하자’라고 정했고, 캠핑 중에도 3시간 정도는 공부할 수 있었다. 가족들이 이해해준 덕분에 각자 자유 시간을 보내는 동안 공부에 집중할 수 있었다. 공부 이외의 것에 시선을 오래 두면 의욕이 쉽게 떨어지고, 그 감정을 다시 되살리는 데 시간이 많이 걸린다는 점을 이미 알고 있었기에 생각해낸 방법이었다. 덕분에 캠핑 이후에도 이전의 학습 페이스를 빠르게 회복할 수 있었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생) [4w3]`,
    `"운동을 다시 시작해서 운동과 공부의 밸런스를 잘 맞춰두었다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생) [9w8]`,
    `"월~토 아침에 규칙적으로 7:30에 일어나서 독서실에 가서 규칙적으로 공부하고 저녁식사 후 30분 유산소 운동 후 다시 공부하는 규칙적인 생활을 하였다. 감사한 점을 수시로 기록하며 공부를 최선을 다해서 꾸준히 하는 것 같아서 개인적으로는 대견하다고 생각한다." — 시계탑기린친구 (26학년도 강원(수) 합격생) [4w3]`,
    `"원래는 한 과목을 쭉 공부했었으나 이번 주부터는 공부할때 유기화학 2시간, 생물 3시간, 화학 3시간을 번갈아가면서 먼저 채우고 난 후 남는 시간에 부족한 과목을 공부했습니다. 효율도 좋았지만 무엇보다 뭔가가 부족했다는 불안감이 덜해서 좋았던 거 같습니다. 또 다른 학생들보다 내가 부족할 수 있음을 인정하는 한편 기본기나 다른 수행능력에 있어서는 제 자신을 믿고 노력하기로 마음 먹으니 불안함이 줄어들었습니다. 시험을 칠때는 지문을 분해해서 꼼꼼이 읽는 습관을 들이려고 노력하다보니 틀리는 갯수도 줄어든 것 같습니다." — 후회없이살자 (26학년도 강원(약) 합격생) [5w6]`,
    `"평일과 토요일까지 할 수 있는 최선을 다해 규칙적으로 열심히 살았다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생) [9w1]`
    ]
  },
  "9-4":{
    생물:[
    `"7월 o/x들을 마저 모두 복습하면서 기본기에서 놓친 부분이 있는 지 점검했다. 중앙대 기출을 풀 때 확실히 전에 틀렸던 부분은 틀리지 않는 모습이 보여서 다행이라는 생각이 들었다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"시험 환경에서 잘 적용할 수 있게 문제 풀며 의식적으로 아는 개념을 정확히 떠올리려고 노력했다. 또한, 중앙대 문제를 풀며 그림 위주로 기본서 전범위를 복습할 수 있었다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
    `"한 주 동안 자투리 시간을 이용하며 헷갈리는 부분 암기를 많이했고 OX문제를 풀면서 개념 확인도 계속했다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"1) VF OX 문제와 MD 문제 풀이를 통해 부족한 이론 단원을 파악하고 이를 공부함. 2) 기출 문제에서 틀렸거나 헷갈린 선지를 OX문제로 바꾸어 퀴즐렛 플래시 카드로 복습함. 자투리 시간을 활용하는 좋은 방법인 것 같음." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"∙ 헷갈리던 생리학 파트 내용들을 많이 정리하고 암기함. ∙ 9월 동안 통합이론 1회독 함. ∙ 복습 진도에 맞춰 단원별 피트기출 풀며 계획했던 문제풀이를 실천했다." — 레고링 (26학년도 계명(제약) 합격생)`,
    `"세포호흡 단원까지 mdp문제를 풀었고, 관련된 내용 정리를 하였다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
    `"복습을 하면서 앞에 내용과 연계해서 공부하려 노력했다. 공부하면서 앞내용과 연결되는 부분들은 앞으로 되돌아가 복습해줄려고 노력했고, 단원들이 통합적으로 이해되는 느낌을 받았다. 물론 이렇게하면 시간이 좀 오래 걸리지만 궁극적으로는 이게 맞는것같다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"중앙대 오답노트를 밀리지 않고 잘 마쳤다. 추가로 단권화 노트를 만들면서 자주 헷갈리는 개념들을 약점 노트에 따로 모아두고 있다. 기본서, 이동윤T, 박선우T 등 지금까지 공부한 여러 출처의 지식들이 이제야 비로소 머릿속에서 정돈되고 있는 것 같다. 9월에 시작한 생물 단권화 및 복습은 아직까지 밀리지 않고 계획대로 되고 있어서 (적절한 일정인지는 모르겠으나..) 11월 초에는 1차적인 정리가 끝날 것 같다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"저번주와 마찬가지로 지금까지 풀었던 퀴즈, 기출 복습하면서 박선우 서머리 OX도 함께 공부하였습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"MD 문제를 가장 예전 기출부터 풀려고 한 회차를 풀고 개념 정리를 하였다. 그런데 VF 중앙대 모의고사를 풀다가 매번 헷갈리는 단원에서 틀리는 것 같아 약한 단원을 먼저 풀기로 방식을 바꾸었다. 취약 단원에 대한 문제를 모아서 한꺼번에 풀어주면 그 단원에 대한 이해도가 한층 상승할거라고 생각했다. 이번주는 진화, 분류 파트를 MD 문제로 보충하였다. 사실 분자생물학까지 하려고 했지만 시간 문제상 하지 못했고 다음주에 보충할 에정이다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"2권복습은 다 끝났고 1권에서 자신있는 부분만 남았다. 3,4권도 남긴 했지만 분자생물학처럼 실험, 에세이 방법들 외우는게 적어 흐름위주로 여유있게 공부하려고 한다. 확실히 2권이 가장 헷갈렸는데 복습하고 나니 완벽하게는 아니지만 기억이 새록새록 난다. 이제 그 개념을 문제에 접목시켜 풀이법을 익혀야겠다. 그리고 만들어놓은 지도필기를 틈날때마다 읽어야겠다." — 약대가쟝 (26학년도 단국(약) 합격생)`,
    `"모의고사에서 맞은 문제까지 복기를 꼼꼼하게 했고, MDEET 지식형 문제를 목포량보다 많이 풀었다. Quizlet과 OX에서 봤었던 개념들이 꽤 보여서 이전에 공부했던 내용들과 연결하며 공부할 수 있었다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"약점단원을 공부하고 단권화로 채워나갈 때 처음에는 중요하거나 어려운 포인트를 빈칸으로기입하고 두번째 볼 때채워가면서 익히는 방법으로 더 기억에 오래 남는 암기를 할 수 있었습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
    `"시간이 날때마다 틈틈이 퀴즐렛 이용해서 복습했음" — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`
    ],
    화학:[
    `"점군과 분광학까지 모두 풀면서 2000제 코드3을 모두 풀었다. 처음 배우는 것들이라 걱정했지만 생각보다 괜찮았다. 지엽적 내용이나 헷갈리는 내용을 모은 노트도 계속 채워나가고 있으며 모의고사를 보기 전에는 항상 그 노트를 볼 만큼 많이 채워졌다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"모의고사 일단 풀고 오답한 것, 화학문제를 꾸준히 풀기 시작한 것, 조금씩 시간맞춰 푸는 것이 익숙해진 것, 자투리 시간에 밀리지 않고 풀수 있겠다는 생각이 든것" — Hcsg (26학년도 원광(약) 합격생)`,
    `"이번 주도 기출올인원을 풀며, 2000제 일부와 1500제 목차 복습도 진행했다. 저번 주에 화학 공부에 기복이 있어서 공부하는 시간대를 오전으로 조정했는데 더 집중해서 공부할 수 있었다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
    `"기출문제를 단원별로 풀면서 문제풀이 능력을 길렀음. 문제풀이 -> 해설 강의 -> 내용 정리 순으로 정리하면서 실력을키웠음" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"1) APS를 생각하면서 푸는 게 목표였는데 이번 실력점검 모의고사에서 허둥지둥하는 거 없이 차근차근 풀이함. 2) 핵심이론 외 문제를 풀면서 보충으로 설명해주시는 부분을 따로 정리함." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"기출올인원을 시작함. 새로운 문제를 풀며 접근 방법 떠올리는 연습을 했음. 2000제 코드1,2 문제 복습함." — 레고링 (26학년도 계명(제약) 합격생)`,
    `"기출올인원 문제를 풀면서 효율적으로 공부하기 위해 무조건 맞출 수 있을 것 같은 문제들은 강의를 수강하지 않았다. 불필요한 강의 수강 시간을 줄였다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
    `"이번주는 진도를 많이 나갔다. 다음주면 아마 2000제(1단원, 점군, 분광학 제외)를 다 풀것 같다. 표시했던 문제들을 우선적으로 보고, 문제들을 전체적으로 여러 번 풀 예정이다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"코드번호 1 2 3 복습 하면서 2000제 완강하였고, 다음주부터 기출올인원으로 넘어가겠습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"이번주는 다시 앞으로 돌아와 10단원부터 코드3을 수강하였다. 강의를 듣기 전에 코드1,2 문제들을 다시 풀어 주었다. 타임어택 모의고사에 대비해서 연습 모의고사도 풀어 주었다. 새로운 문제들을 풀어보면서 자주 하는 실수와 떠오르지 않는 AP를 모아두는 실수노트도 만들어 주었다. 이렇게 모아보니 확실히 어느 부분에 취약한지 한눈에 볼 수 있었다. 모의고사 보기 전에 한번 훑고 보니 이번주 모의고사도 비교적 수월하게 풀 수 있었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"이번주엔 화학 인강도 목표치만큼 들었다. 2주 전에 열심히 복습해서 이론은 훑지 않고 작년에 공부했던 타임어택으로 감을 좀 익혔는데, 막상 오늘 시험 봐보니 26/30인데 2개는 빠르게 쓰느라 계수 빼먹고 지수 숫자 헷갈려서 틀리고 1개는 기억이 흐려졌고 1개는 아예 접근을 못한 문제였다. 오늘 시험으로 속도 때문에 생기는 실수를 보완하고 나머지 2개의 개념을 바로잡아야겠다고 느꼈다. 저번부터 산염기에서 자꾸 틀리는거 같다." — 약대가쟝 (26학년도 단국(약) 합격생)`,
    `"2000제를 완강했다. 10월부터 기출문제를 풀고 싶어서 욕심을 좀 냈는데, 다행히 복습까지 잘 마무리할 수 있었다. 모의고사를 풀면서 속도가 많이 단축된 것을 느꼈고, 자주 틀리는 유형들을 정리해서 시험 전에 보고 들어가니 실수 없이 잘 치룰 수 있었다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"이상기체 열역학 파트와 전기화학 파트 문제풀이가 잘 되지 않아 일주일 중 초반에 불안감이 컸는데, 도망가지 않고 앉아서 해설강의를 들어가며 문제풀이를 하다 보니, 별거 아니라는 생각이 들면서 자신감이 붙게 되었다. / 앞단원의 기억이 흐려지고 있다고 느껴 선생님이 가이드해주신 대로 앞단원 풀이도 부담이 가지 않는 선에서 해보려고 하였다. / 토요일에 추가 연습 모의고사를 일단 풀어는 봤다." — 시계탑기린친구 (26학년도 강원(수) 합격생)`,
    `"시험에서 전기화학 문제를 만나면 살짝 애매하게 곤란한 느낌이 있었는데 1500제로 완벽히 내실을 다지고 문제를 풀어 익히니 생각보다 빠르고 쉽게 문제를 맞출 수 있어서 오히려 저의 강점 단원이 되었습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
    `"처음 공부할때 너무 어렵다고 생각했던 전기화학을 잘 정리한 것 같다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`
    ],
    유기:[
    `"이번 주 유독 생소한 내용과 많은 범위에 버거웠지만 해야 하는 공부량을 모두 해냈고 최대한 메커니즘과 원리를 이해하고 문제를 풀려고 노력했다. 패드에 지금까지 공부한 단원들을 모두 간단하게 정리해둬서 다음주부터 할 복습에 유용하게 활용할 수 있을 것 같다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"유기를 매일 최소 2시간으로 공부했고, 추가로 자투리 시간에 명명법이나 산도 비교 등도 포스트잇으로 적고 자주 봤다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
    `"꾸준히 2시간씩 공부함. 또한 이론 공부 - 기본서 예제 풀이 - 약사랑 유기화학 수강 사이클을 통해 학습함." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"∙ 유기2 내용들을 정리하고 예제 문제를 풀었음. ∙ 강의 완강하고 매커니즘 그리기 연습을 했음." — 레고링 (26학년도 계명(제약) 합격생)`,
    `"전체 범위 내용을 꾸준하게 학습하고 있다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
    `"정리해둔 반응들 위주로 여러 번 봐줬다. VF문제들과 함께 전체적으로 복습해야 겠다" — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"기본서와 예제를 중심으로 차근차근 공부했다. 매커니즘을 손으로 그려가며 익혔다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"스미스 예제, TEST 복습하면서 강의를 들었고, 명명법 부분 전체적으로 공부하였습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"VF 커리큘럼을 무리없이 소화해서 이번주에 유기 1회독을 마쳤다! 매일 2시간씩 학습하고 ‘앞내용 복습 -> 강의 -> 스미스 -> 노트 정리’ 사이클을 계속 이어온 덕분에 유기가 가장 자신 있는 과목이 되었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"드디어 아민단원까지 1회독이 끝났다. 작년에 유기2 특히 알돌, 아민단원을 부실하게 공부해서 오래걸리기도 했고 이해가 느렸지만 이번 시험에서 2등을 한거 보니 다른 분들도 어려웠나보다. 한바퀴를 돌리고 나니 작년에 헷갈려 했던 Sn, E 반응과 카보닐, 아민 단원이 쉽게 느껴진다. 왜 피트준비생 출신들이 유기를 효자과목이라고 하는지 알거같다. 지금 시점에서 필요한건 반응, 시약 단권화 정리와 빠른 회독을 통한 개념 굳히기라고 생각한다." — 약대가쟝 (26학년도 단국(약) 합격생)`,
    `"이번주 유기는 크게 잘 한 점이 없다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"생각보다 새롭게 보는 반응들이 많아서 정리하고 공부하는 데에 평소보다 더 많은 시간을 할애했고 덕분에 반응의 메커니즘과 포인트들을 체득할 수 있었습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
    `"한번 제대로 봤다는게 뿌듯하다. 정리하고 외우는게 문제긴 하지만 일단 뭔가 했다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`
    ],
    생활관리:[
    `"6시 기상을 실천하려고 노력했고, 공부 시간과 운동 시간이 안정적으로 확보되는 걸 느껴서 나에게 잘 맞는다는 것을 확인했다. 다음주에 좀 더 안정적으로 유지하면 루틴화할 수 있을 것 같다. 지금 다니는 스터디카페에 점점 익숙해져서 편해지려는 것 같아 내일부터 새로운 장소에서 공부할 예정이다. 이번 9월이 유독 만족스럽지 못한 달인 것 같아 괴로웠는데 7월에 계획한 큼직한 진도는 모두 완료한 걸 보니 그렇게 나쁘지는 않았나 싶다" — 승민 (26학년도 단국(약)·연세(생화학) 합격생) [9w8]`,
    `"이번주는 2가지의 실험과목 모두 보고서 작성을 요구하였다. 유기화학실험 프리레포트와 결과레포트를 작성하니 하루가 완전히 삭제되어 있었다.거기에다가 생물 결과레포트까지... 그나마 다행인건 생물 결과레포트가 다루는 범위가 심장과 순환계쪽이라 켐벨을 열심히 봤다는 것과 그럼에도 목표에 100% 도달한 건 아니지만 일반화학 문제를 120여문제 풀긴했다(9/28 모의고사 제외하고) 이제 화학은 조금씩이라도 계속 풀수 있겠다는 생각이 들었다." — Hcsg (26학년도 원광(약) 합격생) [5w6]`,
    `"비슷한 한 주를 루틴처럼 보냈다. 잠깐 주변 환경이 일시적으로 변화가 있었는데, 영향받지 않고 해야 할 일에 집중했다. 위 변화로 인해 특히 휴식과 공부의 양적, 질적 시간을 균형 있게 챙기려고 했던 한 주였다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생) [1w9]`,
    `"매일 꾸준히 생활습관을 지키고 공부하였다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생) [1w9]`,
    `"1) 병원을 다니면서 원래 루틴은 조금 무너졌지만 전체적인 공부 계획은 지킴. 2) 고강도 운동을 하지 못하게 되면서 산책을 주로 했음. 스트레스를 조금이나마 푸는 데에 도움이 됨." — 이번엔내차례 (26학년도 삼육(약) 합격생) [9w8]`,
    `"∙ 이번 주는 문제를 풀며 내용 숙지가 잘 되고 있다는 느낌을 받아서 성취감이 들었음. ∙ 몸이 아팠을 때 빠르게 조치를 취해 컨디션을 회복 함." — 레고링 (26학년도 계명(제약) 합격생) [9w1]`,
    `"자기 전에 당일 학습한 내용을 떠올리는 연습을 하고 있다. 확실히 이 방법을 쓰니 도움이 잘 되는 것 같다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생) [8w7]`,
    `"이번주 운동 3번 갔다. 학원에 지각하지 않고 일찍 갔다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생) [5w6]`,
    `"스트레스 해소용 취미를 찾다가, 한 때 즐겨 썼던 캘리그라피 펜을 꺼내들었다. 지칠 때 잠깐씩 힘이 되는 문구들을 써보았더니 좋았다. 무엇보다 시간, 돈, 노력이 굉장히 적게 들어 마음이 편했다." — 초록콩 (26학년도 순천(약) 합격생) [9w1]`,
    `"각 과목 공부 시간을 쪼개서 공부하도록 노력했습니다. 큰 이슈는 없었습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생) [6w5]`,
    `"이번주는 감정 이슈로 운동을 빡세게 해주었다. 저번주에 모든 과목에서 어느정도 성적이 나오는 것 같아 안일해졌다고 느꼈는데 이번주는 문제가 잘 풀리지 않자 불안감이 커졌다. 그래서 불안을 가라앉히기 위해 오히려 저번 주보다 더 강한 강도로 운동을 하며 마음을 다잡으려 했다. 또한 일상의 루틴이 감정을 안정적으로 유지하는데 얼마나 중요한지 다시금 깨달은 한주였다. 조금 무기력해져도 지난 3개월동안 공부하면서 차근차근 쌓아온 루틴을 그대로 따라가다 보니 어느새 스스로 안정을 찾을 수 있었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생) [4w3]`,
    `"운동을 주 2회로 줄이고 나머지는 자정까지 스터디 카페에 가는 습관을 들였더니 공부량과 집중력이 확실히 늘어난 느낌이다. 이젠 기력도 중요해서 한약도 먹고 자주 못가는 운동도 집에서 씻기 전에 스쿼트나 푸쉬업이라도 챙기고 있다. 자세 교정 밴드를 사서 옷안에 착용하고 의식적으로 고개를 들고 허리를 피려고 노력 중이다. 저번주의 통증은 한의원에서 치료받고 좀 나아졌다." — 약대가쟝 (26학년도 단국(약) 합격생) [5w6]`,
    `"이번주는 문풀 비중을 대폭 늘려서 꽤 밀도가 높은 공부를 했다. 그래서인지 금요일에 쳐져서 위기가 왔었는데, 친구가 다니는 독서실로 학습 공간을 하루 동안 바꿔보니 리프레시도 되고 집중도 더 잘 되었다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생) [9w8]`,
    `"매일매일 꾸준히 규칙적으로 공부하였다. 9월 한달 동안 평균적으로 8h30m~10h 미만 정도로 월~토 공부했다. / 이번주 화학 공부할 때 문제풀이가 잘 안되서 집중도가 떨어지는 것 같아서 오후에 화학 공부를 할 때에는 카페로 옮겨서 공부를 해보기도 했다. 집중이 잘 안될 때 억지로 공부하여 쉬운내용만 공부하기보다, 차라리 시간을 좀 써서 명상을 하거나 장소를 옮겨 나에게 필요한 공부를 하려고 노력하였다. / 취침시간도 저번주보다는 당기긴 했다!" — 시계탑기린친구 (26학년도 강원(수) 합격생) [4w3]`,

const WINNER_POOL_ALL={
  생물:[
  `"저번주부터 적용한 공부 방식이 잘 맞는다. 선생님과의 상담을 통해 공부 방향에 대한 점검을 하여 지금 공부하는 방식에 대한 확신이 생기자 생물에 대한 걱정이 줄고 공부하는 내용에 집중할 수 있게 되었다. 조급한 마음을 내려놓으니 오히려 집중이 잘되는 것 같다. 단원별로 중앙대 기출과 적중 문제를 정리하고 있다. 저번달에 리뷰한 문제도 있고 그렇지 못한 문제도 있지만 계속 눈에 보이니 전체 내용을 보아도 중요한 부분이 보이고 익숙해지니 더 잘 외워지는 것 같아 애니어그램 내용을 직접 느껴 뿌듯했다." — 단퓨프 (26학년도 목포(약) 합격생)`,
  `"8월 o/x를 하루에 한 회차씩 복습했고, 퀴즐렛도 매일 테스트를 풀어서 점검했다. 실수같아 보이는 것들도 답을 고른 사고 회로를 모두 되짚으며 복습했더니 결국 이론적으로 미숙함이 있어서 틀린 부분들이 있다는 걸 발견할 수 있었다. 이번주부터 MDP를 풀기 시작했다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"홍쌤의 조언을 받아들여 기존 계획대로 주말동안 공부를 하되 매일 조금씩(60문제를 평일(5일간) 6문제, 주말에 15문제씩 나눠 공부하는 식으로) 생물공부를 나눠서 진행한 것. 이제 꾸준히 공부할수 있다." — Hcsg (26학년도 원광(약) 합격생)`,
  `"복습하고 있는 단원들의 MDP 문제들도 선별해 같이 보면서 문제와 병행한 해당 단원들 복습을 더 꼼꼼히 할 수 있었고, 선지를 잘못 보는 실수 교정을 위해 의식적으로 해당 개념들을 떠올리며 문제 푸는 연습도 병행했다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
  `"1) 문제풀이가 없는 날 MD문제를 풀고 부족한 단원(발생, 장기기억 등)을 공부함. 2) 기본기 OX 문제를 통해 생화학, 분자생물학 부분을 가볍게 복습함." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"휘발성이 강한 식생분진을 다시 복습해보았다. 그리고 오랜만에 ch.7 생화학 파트도 다시 복습해서 알찼다. 23 피트는 못 풀게 되었지만 그래도 틈나는 대로 22 피트까지 전부 풀었다. 다음주부터는 단원별로 조금씩 MDP 문제 전부를 중요 문제 위주로 다시 복습하자. 선생님 말씀대로 유전이나 진화 파트도 잊지말고 다시 풀어보기" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"∙ 공부해도 자꾸 잊어버리는 내용이 많은 것이 문제라 생각해 복습주기를 짤게 가져갔음. ∙ 매일 몰랐던 내용을 한 군데에 정리해놓고 자주 보기를 실천 중임" — 레고링 (26학년도 계명(제약) 합격생)`,
  `"발생과 생식단원을 공부하면서 앞뒤내용을 계속 연관지어 공부할려고 노력했다. 확실히 머리에 남는게 많았고, 발생생식내에서도 연관되는 부분을 짝지어 볼려고 노력했다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"자주 헷갈리는 내용들을 모아 보기 편하게 정리해두었다. 앞선 기본기OX, 메디컬OX, 중앙대 기출 등에서 어려웠던 문제들도 따로 적어두었다가 시간을 쪼개어 틈틈히 살펴보고 있다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"기출, 퀴즈 복습하면서 400제도 푼 다음날 바로바로 복습해주고 있습니다. 반복적으로 나오는 부분들은 확실하게 외워진 것 같습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"가장 약점인 원핵생물 분자생물학, 순환계, 배설계 파트를 복습하고 MD 문제를 풀어주었다. 항상 잘 안외워지는 파트라 그동안 회피하고 있었는데 강원대 기출을 풀면서 이제는 꼭 봐야 겠다고 생각이 들어 이번 기회에 제대로 공부하고 암기했다. 암기할 때 목차를 떠올리며 내가 외우고 있는 부분이 어디인지 의식하고 외우니까 생각보다 잘 외워졌다. 그리고 더이상 까먹지 않기 위해 누적 복습도 해주었다. 컴팩트있게 약한 단원을 봐주니 어느정도 자신감이 생긴 것 같다. 다음주에 생리학 부분 이어서 복습하려 했는데 금요일 VF 문제가 생리학 파트여서 반가웠다. 다음주에 생리학 나머지 부분 복습하면서 생리학 심화 문제도 암기할 것이다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"문제 풀이를 하면서 배설계와 먼역계 파트가 약점단원임을 파악했고, 한 주 동안 배설계와 면역계를 집중적으로 암기해줬다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"짬을 내서 MDP 시험도 풀기 시작했습니다. 시험이 나올 수 있는 소스들은 미리미리 다 접해보는 것이 좋을테니 앞으로도 짬을 내서 다양한 지식을 접해야겠습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
  `"약한 부분 기본서 다시 읽으며 기본기 챙기려고 노력했음" — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`,
  `"계속 공부하던 루틴을 최대한 유지하면서 문제를 풀고 복습했다. Mdp 문제를 푸는게 아직 익숙치 않아서 오래 걸리지만 약점 단원을 복습하고 점검하는 데 도움이 된다는 게 체감되기 시작했다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"엠디트 문제를 매일 1시간 반 풀이+ 30분 정리로 목표로 했던 범위까지 마쳤다. 정리를 할 때 단순히 엠디트에서 필요한 개념뿐만 아니라 그와 관련된 개념도 같이 적으면서 정리하느라 시간은 조금 더 걸렸지만 관련 개념을 계속해서 눈에 익숙화시켰다. 또, 중앙대 25년도까지의 풀이 및 정리를 마치고 다음주부터 경희대 기출을 풀 예정이다. 엠디트 정리본 양이 생각보다 많아져서 다음주부터는 엠디트 풀이 및 정리 시간은 유지하면서 엠디트 복습 시간 1시간+ 지금까지 풀었던 문제들 복습 1시간으로 변경할 예정이다." — Akdow (26학년도 단국(약) 합격생)`,
  `"학교시험범위 공부(생화학1,일반생물학실험2)를 하면서 수요일까지는 비전파인더 생물 오답 공부를 꾸준히 한 점." — Hcsg (26학년도 원광(약) 합격생)`,
  `"분자생물학+생리학을 복습하며 mdp 선별 문제도 같이 풀이했다. 분생 실험이 많아서 조금 힘겨웠지만, 엠디피 기준으로 빈출되었던 중요한 실험 위주로 복습하며 이해 & 암기했다. 추가로 경희대 기출을 풀고 오답하며 아직 부족한 파트를 찾고, 알고 있는 개념들 적용시켜서 푸는 연습도 했다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
  `"1) 지난 주 보완점 중 이론서 70% 암기 후 넘어가기 방법으로 생리학 복습을 마무리함. 2) MD 문제 풀이 후 틀린 문제 단원과 까먹은 이론을 다시 봄. 3) 시간 날 때 퀴즐렛으로 VF OX 문제, 중앙대 기출 오답 문제를 복습함." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"생화학 뒷부분과 광합성도 오랜만에 복습 완료했다. 본격적으로 심플리시티를 풀어봤는데 정말 구석구석 문제들이 출제되어 그때그때 개념서로 돌아가 복습하였다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"저번 주에 실시됐던 적중 400제의 생리학 Test에서 느꼈던 것인데, 생리학, 특히 순환계와 배설계쪽은 난이도있는 문제가 나온다면 철저히 이해가 되어있지 않으면 시간이 부족한 본고사에서 빠르게 풀기 어렵겠다는 생각이 들었다. 그리고 저번 주 부터 문제들을 풀어오면서 순환계, 배설계 파트에 약하다는 것을 알게 되어서 이번 주에는 해당 단원들을 박선우T 교재로 여러 기전들을 확실히 이해하며 암기하는 방식으로 공부했다. 다음주에도 약점이 드러나는 단원이 있다면 그렇게 공부해보고, 화요일과 금요일의 Test를 통해 학습의 효과를 확인해봐야겠다." — 쿠리만쥰 (26학년도 5관왕 | 단국(약)·계명(제약)·삼육(약)·강원(약)·우석(약) 합격생)`,
  `"∙ 통합이론 개념 공부와 써머리 OX 문제풀이를 병행했음. MDP 지식형 문제도 같이 풀었음" — 레고링 (26학년도 계명(제약) 합격생)`,
  `"세포분열, 유전학 헷갈리는 개념들을 모두 단권화하였다. 단권화 한 내용을 남는 시간에 지속적으로 봤다" — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
  `"문제 위주로 복습하며 착실히 단권화를 해나가고 있다. 숭숭 뚫려있었던 구멍들이 차츰차츰 메꿔지는 것이 느껴졌다. 특히 앞서 이해하지 못하고 넘어갔던 내용들이 다시보니 이걸 왜 이해 못했지 싶을 정도로 수월하게 받아들여질 때 기분이 좋았다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"풀었던 문제 계속 반복해서 보고 있고 7, 8월 퀴즈 내용은 대부분 암기가 된것 같습니다. 연휴동안 예전에 받았던 경희대, 단국대 기출도 간단하게 공부하였습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"저번주에 이어서 그 다음으로 약한 단원인 배설계, 호흡계, 면역계를 복습하였다. 이번에는 전체적인 흐름 속에서 세부 내용을 암기하는 방식에 초점을 두고 공부하였다. 전체 맥락은 이해하고 있지만 디테일하게 묻는 문제에서 기억이 잘 안나는 부분을 보완하기 위함이었다. 개념 복습 후에 MD 문제와 그동안 풀었던 VF 문제들을 다시 풀면서 세부 내용을 잘 암기하였는지 점검해주었다. 저번주에 복습했던 내용도 까먹지 않게 틈틈이 복습해주었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"매일 1시간씩 복습 시간을 가졌으며, 중앙대 기출을 모두 풀고 적중 N제 50제를 다시 풀어보았다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"편입문제에서 중요한 부분부터 먼저 공부하고 지엽적인 부분도 차례로 채워가며 공부했습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
  `"8월 ox와 기출n제, 중앙대 기출 모두 정해둔 계획을 지키며 복습했다. 써머리에 틀렸거나 헷갈리거나 몰랐던 부분은 샤프로 적어두고 있다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"목표로 했던 엠디트와 경희대 기출 문제를 마쳤고 양이 많아 정리만하고 미뤄뒀던 기출N제 1차 복습을 마쳤다. 원래 알던 내용에서 살짝 어색한 내용이라 아직은 조금 더 자주봐야 익숙해질 것 같다." — Akdow (26학년도 단국(약) 합격생)`,
  `"조금 약했던 분생 파트 마지막 단원까지 mdp 문제를 선별해서 풀어주며 심화 복습을 했다. 줄글로 읽으니 계속 내용이 휘발되어서 간단한 도식, 그림으로 암기 후 mdp 문제 풀며 위 암기를 적용하는 연습도 병행했다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
  `"1) 시간이 부족해서 잠깐 시간 나면 퀴즐렛으로 개념 복습함. 2) 전체적인 흐름을 남에게 설명하듯이 말하면서 복습함." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"생물은 무난하게 잘 하고 있다. 문제를 풀며 잊어버린 부분들에 대해 관련 개념들을 다다시 떠올려보고, 조금이라도 흐릿한 부분이 있으면 찾아서 직접 그려보고 써보고 있다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"∙ 생리학 파트 내용들을 복습하며 써머리 OX, mdp 문제를 풀었음. 자신없던 발생학 파트는 다시 워크북 OX 문제를 풀며 통합이론 개념을 복습함." — 레고링 (26학년도 계명(제약) 합격생)`,
  `"인체생리학 단원을 하나씩 정리해나가고 있다. 인체생리학 단원을 메인으로 정리하였지만, 상대적으로 약한 파트인 분자생물학과 분류학도 정리해 둔 자료를 반복적으로 학습해나갔다. 생물 공부 시간을 늘렸지만, 화학 문제도 적지 않게 풀었다!" — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
  `"드디어 통합이론을 완강했다. 이제는 문제를 풀면서 부족한 부분을 통합이론을 통해 채워주는 식으로 공부계획을 잡았다. 그리고 통합이론을 복습할때도 모든 단원을 동등하게 비중을 잡기보단 내가 까먹었거나 중요한 단원들만 집중적으로 볼려고 계획했다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"단권화 노트를 정리하면서 꼼꼼히 복습하고 있다. 계획한대로 10월에 한 바퀴를 마무리지을 수 있을 것 같다. 아직은 구멍이 많아 꼼꼼히 보고 있지만 11월부터는 회독 속도를 대폭 올려서 빠르게 여러 번 볼 수 있도록 해야겠다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"중앙대 기출, 400제 위주로 복습하였습니다. 또한 서머리에 복습한 내용 간단하게 필기하면서 정리하고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"저번주에 이어서 생리학 나머지 단원 중 면역 뒷부분, 소화, 뉴런, 신경, 내분비 파트를 복습했다. 목차를 중심으로 전체적인 흐름을 파악한 후에 세부 사항을 암기하는 방식으로 공부했다. 개념 복습 후 MD문제와 그동안 풀었던 문제들을 다시 풀면서 점검해주었다. 저번주에 공부한 단원은 자기 전에 리뷰 녹음을 들으면서 놓친 부분이 없도록 보완했다. 생리학은 원래 좋아하지 않는 분야였지만 이번에 그래도 끝까지 붙잡고 했더니 이제는 자신감이 생겼다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"발생학을 끝내고 나니 너무 익숙한 내용들이 많이 나와 진도가 확 나가졌다. 계획했던 것보다 한참을 더 나가서 이번주 효율은 되게 좋았다. 금요일에 본 시험에서도 25문제 중 2개밖에 틀려서 놀랐다. 생리학 비슷한 문제를 작년에 많이 풀어봐서 그런것도 같다. 다음주도 이번주와 같은 효율이 나오길 바란다." — 약대가쟝 (26학년도 단국(약) 합격생)`,
  `"MDEET와 경희대 기출을 풀고 관련 개념을 꼼꼼하게 복습했다. 이 외에는 잘 한 점이 없다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"몰입감 있는 공부를 진행했다. 캠벨을 빠르게 읽으며 흐름을 파악하고 기출 문제를 보고 o,x로 내용을 보강했다. 또한 자세히는 아니지만 화요일과 금요일에 푼 문제를 해설을 보며 몰랐던 부분을 공부해보았다. 그렇게 공부해놨던 내용을 다시 보게 되니 더 많은게 보이게 되었다. 또한 스스로 설명하며 공부를 진행했더니 내가 어디 부분을 잘 알지 못했고 부족한지를 알 수 있어 그 부분을 다시 보고 채우는 형식으로 진행하였다." — 단퓨프 (26학년도 목포(약) 합격생)`,
  `"문제로 마주치기 가장 무서웠지만 자주 보이는 유형들에 대한 정복" — 후회없이살자 (26학년도 강원(약) 합격생)`,
  `"게속해서 지난 시험들을 복습하다보니 시험 결과도 나쁘지는 않은 것 같아서 다행이라고 생각했다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`,
  `"공부하는데 속도가 붙었다. 선생님이 말씀해주신대로 심화내용은 깊게 보지 않고 문제와 정답 위주로 공부하고, 기출 문제를 중심으로 공부를 하니 이번주 회차 문제도 리뷰하고 원래 나가던 생리학 진도도 나갈 수 있었다. 또한 MD문제도 하루에 5문제 정도씩 풀어주었다. 일단 오래되고, 추론형이 아닌 문제부터 골라서 풀고 있다. 박선우 선생님의 MD책을 보고 있는데 MD문제 자체가 그림도 잘 나오고 해설에 개념 정리가 잘 되어있어서 다시 개념 정리하기에도 좋았다." — 단퓨프 (26학년도 목포(약) 합격생)`,
  `"이번주에 중앙대 기출 복습을 마무리하고 mdp 기출을 2012년도까지 풀었다. 생리학 실력이 10월 초 보다는 많이 나아진 것 같아서 방심하지 말고 더 자주 복습하고 반복해야겠다고 생각했다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"1주일동안 7월 OX, 8월 OX, 9월 중앙대 재배치 및 따로 풀었던 중앙대와 경희대 22~25년 기출문제 복습을 마쳤다. 매일 꾸준히 2시간 씩의 복습을 해서 익숙화 시켰으며 특히 추가로 문제를 풀면서 잘못알았던 개념을 수정한 사안과 자세히는 알지 못했던 개념들을 추가하는 과정을 거칠 수 있었다. 다음주부터는 기출 N제의 복습과 암기를 중점적으로 할 예정이다." — Akdow (26학년도 단국(약) 합격생)`,
  `"기말고사 공부를 하면서 비전파인더 생물 시험을 꾸준히 본 점." — Hcsg (26학년도 원광(약) 합격생)`,
  `"제공 문제들과 생리학 단원 5개를 빠르게 복습했다. 생리학은 도식화해서 셀프 티칭 방식으로 복습하니 효율이 더 좋았고, 엠디피 문제를 풀며 추가된 개념은 써머리에 단권화했다.또, 지난주 복습했던 분자생물학을 적중 문제로 해당 개념들을 한 번 더 복습할 수 있었다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
  `"1) 정해진 단원을 꼼꼼히 보기 보다 2회독을 목표로 보면서 전체적인 흐름과 핵심 암기를 우선으로 함. 2) 캠벨도 해당 범위의 개념을 다시 읽음. 그림, 키워드 위주로 복습함." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"그동안 MDP와 VF 문제들, N제를 풀며 해당 단원에 필기한 내용들이 하나로 뭉쳐지면서 내가 어디가 약점인지, 무엇을 반복적으로 놓쳐 왔는지가 보여 좋다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"∙ 기출, 예상 문제를 풀고 써머리에 단권화를 시작했음. 문제를 풀고 이론 복습을 해주며 진도를 나갔음" — 레고링 (26학년도 계명(제약) 합격생)`,
  `"인체생리학 단원을 복습하면서 단권화를 진행하였다. 단권화를 하는 과정에서 기본서를 읽다보니, 논리적으로 내용을 다시 한 번 볼 수 있었다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
  `"생물 복습을 할때, 문제 풀이를 기반으로 복습을 진행했다. 하면서 느낀 점은, 모든 부분을 동일한 중요도로 보는것이 아니라 많이 나오는 부분을 반복적으로 보게 되어 더욱 기억에 남아 좋았고, 특히 VF생리학문제가 도움이 많이 된것 같다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"계획한 일정과 범위에 맞게 오답노트 기반의 복습을 진행하고 있다. 이번주까지 해서 대략적인 단권화를 마무리하고, 다음주부터는 전범위 회독을 속도감 있게 진행할 수 있을 것 같다. MDEET(2012학년도) 지식형 위주로 한 회차를 풀었는데, 관련 이론들을 복습하며 공부하다 보니 한 회차 만으로도 꽤 많은 개념들을 재차 상기할 수 있어 유익했다. (왜인지 2012학년도가 가장 오래된 시험인줄로 착각.. 이번주에 2005학년도부터 다시 풀 예정)" — 초록콩 (26학년도 순천(약) 합격생)`,
  `"지난주와 마찬가지로 복습하면서 서머리에 정리하고 있습니다. 또한 MD기출도 바로바로 교재 찾아보면서 빠르게 풀어보고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"이번주에 생리학 마무리하려 했지만, VF 출제 범위에 맞춰 분자생물학 파트를 우선 복습했다. 그리고 감각계, 효과기 파트도 복습하며 기존에 풀었던 문제들도 다시 한번 점검하듯이 풀어줬다. 이번에 단권화 방식을 변경했다. 기존에는 문제를 풀며 추가할 개념을 써머리 책에 모아놓는 방식이었는데, 이렇게 하니까 개념이 많아져서 핵심을 파악하기 어려웠고, 무엇을 알고 모르는지 구분이 모호했다. 이를 개선하기 위해 화학 약점 노트로 사용하는 원노트를 활용해서 헷갈리는 개념만 단어 중심으로 정리했다. 또한 매일 전날 학습한 내용을 복습해주었는데 확실히 나만의 언어로 정리하니 빠르게 복습할 수 있었고, 모르는 포인트를 색깔로 표시해두어 한 단원을 다시 보는 시간이 크게 단축되었다. 이를 통해 본고사용으로 활용가능한 컴팩트한 단권화 자료가 만들 수 있었다. 이번주는 본래 좋아했던 분자생물학 파트를 하니 효율이 높았고, 유전학을 제외한 박선우 2권 전체를 복습할 수 있었다. 전공 심화 문제도 술술 풀려서 공부가 잘 되었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"MDEET 지식형, 자료해석형 문제들과 적중N제 문제들을 위주로 공부했다. 심화 문제들을 위주로 공부하다보니 기본기에 개념 공백이 생긴 것이 느껴져 중앙대 문제들을 다시 풀어보면서 이론을 보강했다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"생물도 부족하지만 화학 실력이 많이 부족한 것 같아서 이번주는 화학에 좀 더 많은 시간을 썼습니다. 그럼에도 지난 복습과 추가적인 공부를 어느정도 할 수 있었습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
  `"헷갈려하던 분자생물학과 식물 위주로 복습했다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`,
  `"적중 문제를 적당히 잘 리뷰하고, 정리한 점이 맘에 든다. 전에는 생물 문제를 풀고 리뷰를 하려해도 내용이 많게 느껴지고, 머리속에 정리되지 않는 느낌이었는데 점차 공부한 내용이 쌓이니 내가 몰랐던 개념을 추가하고, 조금씩 쌓이고 있다는 느낌이 들었다. 아직 많이 부족하지만, 그래도 오늘 모의고사를 풀 때, 이번주 적중 문제에 나온 문제 틀렸던 문제와 비슷한 문제를 맞출 수 있어서 좋았다. 진도도 나가고, md문제도 풀고, 박선우 쌤 써머리 O,X도 풀었다. md문제는 진도를 나가며 박선우쌤 써머리 책 내용에 나오는 문제들만 먼저 풀고 있다. 생물을 공부할 때 몰입감있게 공부하고 있다는 생각이 든다." — 단퓨프 (26학년도 목포(약) 합격생)`,
  `"지금까지 풀었던 기출 n제를 모두 복습하는 시간을 가졌다. 그때 정리했던 부분들은 다 기억하는 듯 했다. 이번주에 유독 암기가 어렵다고 느껴지는 세포호흡 부분은 약점노트에 정리했다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"목표로 했던 기출 N제 6회까지의 복습을 완료했고 기존에는 정리하는데 시간이 너무 오래걸렸는데 타이핑 정리로 바꾸면서 손의 피로도 덜하고 정리 시간도 빠르게 단축했다." — Akdow (26학년도 단국(약) 합격생)`,
  `"비전파인더 생물 시험을 꾸준히 보고 오답하고 있는 점." — Hcsg (26학년도 원광(약) 합격생)`,
  `"발생학을 포함한 생리학과 식생분진 단원 일부를 복습하고 엠디피 문제를 풀며 정리했다. 추가로 기출문제나 적중 문제를 풀며 문제 베이스로 전범위를 복습하려고 노력했다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
  `"피드백 받은대로 하루 피트5문제 풀이 후 해당 문제의 개념을 보충함. 또한 다른 분의 피드백 내용을 보고 심리적 부담이 덜 해서 계획을 잘 지킬 수 있었음" — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"N제 문제들을 풀며 스트레스 받았는데 과감히 버리고 MDP 문제들 다시 보기로 결단을 내렸다. 남은 기간 박선우 책 N회독하고 MDP+VF 복습으로 생물은 충분할 듯하다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"∙ 문제 풀며 부족한 개념들을 통합 이론 책을 다시 보며 복습하고 있음. ∙ 제공해주시는 문제를 통해 전범위 복습을 하고 mdp 문제를 풀며 단원별 공부도 병행함." — 레고링 (26학년도 계명(제약) 합격생)`,
  `"인체생리학 단권화를 마무리하였다. 세포생물학 파트를 다시 한 번 복습해줬다. 이번주에는 모의고사 대비를 위해 전체적인 내용을 보기 위해 노력하였다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
  `"문제풀이에 기반한 복습을 진행했다. 효과 너무 좋은것같다. 예전에 진도 나간다고 제대로 오답하지 못했던 부분들까지 오답을 하며 복습을 해주니 시간이 오래 걸리긴 했다만 성능은 확실한것같다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"MDEET 2회분(2005예비, 2005)을 지식형 위주로 풀어보았다. 관련 이론들을 복습할 수 있어서 유익했다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"이제는 공부할 때 전체적인 내용을 떠올리는것 보단 핵심 개념, 결론 위주로 암기하는것이 필요하다고 느꼈고 복습할때도 최대한 간소화해서 바로바로 떠올릴 수 있도록 암기하고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"이번주 최대 성과는 발생 파트를 나름 마스터 했다는 것이다. 잘 외워지지 않던 부분을 중심으로 약점 노트를 작성하며 정리한 것이 큰 도움이 되었다. 타이핑하면서 복습하니 집중력이 높아지고, 손의 움직임 덕분에 오히려 졸음이 사라져 학습 효율이 크게 올라갔다. 그리고 복잡한 일련의 과정을 행 단위로 구분해 정리하니 흐름이 한눈에 들어오고 암기 속도도 빨라졌다. 또한 지금까지 풀었던 역대 기출 문제들 중 헷갈리는 개념을 약점노트에 정리하고 암기했다. 10월달 동안 생리학에 집중하느라 전범위에 문제 풀이에 대한 감을 살짝 잃은 것 같아 역대 회차를 분석하면서 다시 감을 찾아 갔다. 이렇게 약점 노트를 활용하면서 실력이 점점 향상하고 있는 것을 체감했다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"면역학 부분이 외우기 까다로웠지만 그 뒤는 수월해서 인체생리학 전체를 마무리 지었다. 식생분진은 일단 예비군 갔다와서 빠르게 봐야겠다. 예비군 동안에 필기해놓은 2권 분자생물학 전체를 보고오는게 목표다." — 약대가쟝 (26학년도 단국(약) 합격생)`,
  `"MDEET와 적중N제 문제풀이를 계획대로 나갔고, OX 복습도 다시 시작했다. 이번주부터 한 장 복습지를 만들어서 하루 동안 잘 안 외워졌던 개념을 적고 자기 전과 다음 날 아침에 말하면서 외우는 루틴을 추가했다. 말하면서 외우니 확실히 잘 외워지는 것 같다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"전체적으로 잊혀지지 않게 복습을 해가며 공부하고 있지만 화학에 집중하다보니 생물이 상대적으로 휘발된 것을 느껴 더 휘발되면 다시 공부하는데 시간이 더 걸릴 듯 해서 잠시 멈춰두고 지난 복습들을 다시했습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
  `"정리가 안되던 발생과 순환기를 열심히 공부하고 정리했다. 약점노트를 생물에도 이용하니 복습하기도 편해서 만족스럽다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`,
  `"물질대사, 식생분진까지 추가해서 심화 복습했고, 엠디피 생리학, 기출, 적중 문제들을 풀면서 틀린 단원들의 이론을 보충했다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
  `"문제를 풀며 해당 부분을 다시 보게 되니 전체 단원에 대한 윤곽이 잡히고, 중요한 부분이 무엇인지 습득하게 되는 것 같다. 다시 돌아가보면 대략적인 내용을 알고 암기한 부분은 많이 잊었다는 것을 느꼈다. 다시 볼 떄는 꼭 암기해야하는 부분을 다시 눈에 담고 표시해두었다." — 단퓨프 (26학년도 목포(약) 합격생)`,
  `"기출 n제에서 몰랐거나 헷갈린 부분을 짚고 복습하며 mdp랑 써머리도 풀다보니 시간이 금방 지나간다. 이번주는 공부하면서 연관된 주제가 떠오르면 돌아가서 같이 복습해보려고 노력했다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"중앙대 재배치 모의고사 및 중앙대, 경희대 22~25년도 복습을 마쳤다. 다음주부터는 7,8월 ox를 하루에 일정회차를 추가 복습할 예정이며 엠디트 마무리 후 추가 문제풀이로 심플 객관식을 풀 예정이다." — Akdow (26학년도 단국(약) 합격생)`,
  `"비전파인더 생물 시험을 꾸준히 보고 오답하고 있는 점." — Hcsg (26학년도 원광(약) 합격생)`,
  `"1) 월~목까지피트 7문제 풀이 후, 관련 단원의 복습을 완료했다. 2) 전체 계획의 큰 틀을 점검하고, VF 문제 복습과 기본서 복습을 병행했다. 3) 이번 모의고사는 나의 약점이 대부분 드러난 시험이었다. 오답 풀이 + 문제의 원인과 해결 방안을 체계적으로 정리했다." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"그동안 책을 읽고 친구와 질문 답변하는 형식으로 공부했는데, 더 완벽하게 외우고 싶어 백지상태에서 직접 그려보았다. 이 방식이 훨씬 디테일한 암기를 요구하는 것 같아 좋다. MD 문제도 오랜만에 다시 푸니 더 정확하게 풀어낼 수 있었다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"∙ 이론 내용을 공부하고 말로 설명하면서 복습하는 방법을 시도해 봄. 내용 복습이 빠르게 되고 아는 것과 헷갈리는 내용이 명확하게 구분 되었음. 내용이 이해가 되고 외워진다는 것을 느낄 수 있었고 모의고사에서도 이번주에 이렇게 공부한 내용의 문제는 자신있게 풀 수 있었음. 다음 주에도 같은 방식으로 학습하며 확인해 보려 함." — 레고링 (26학년도 계명(제약) 합격생)`,
  `"전 범위 위주로 학습을 꾸준히 하였다. 생화학 관련 대사 파트들을 내가 알아보기 쉽게 노트에 정리했는데, 정리하는 과정에서 이렇게 나오면 시험에 대처할 수 있을까?를 생각하면서 조금 더 능동적으로 학습을 해나간게 뿌듯하다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
  `"저번모고에서 틀렸던, 제일 싫어하는 식물파트 복습을 제대로 해주었다. 그덕에 예전엔 진짜 싫었는데 자신감이 많이 생겼다. MDP문제 풀어주기 시작했다. 이번 모의고사에서 정답률 70퍼 이상되는 문제는 안틀려서 다행이다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"MDEET 1회분(2006)을 풀고 관련 이론을 복습했다. 생태, 분류까지 해서 써머리 단권화를 마쳤다. 앞으로 푸는 문제들의 오답들로 계속 채워나갈 예정이다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"매일 복습, md 기출 풀때 5문제씩 시간을 재면서 시험보는 느낌으로 풀어보고 있습니다. 서머리ox 회독하였고 다시 처음부터 복습하겠습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"분자생물학 부분 MD 문제를 풀며 개념 점검을 하고, 헷갈리는 부분은 약점 노트에 정리하였다. 추가로 7,8월 VF 문제도 복습하며 기본기를 다시 점검해주었다. 잘 가지 않던 생명공학과 실험 기법 파트도 정리하면서 확실히 암기하였다. 저번주에 이어 약점 노트에 타이핑하면서 정리해주니 상대적으로 하기 싫었던 부분도 이번에는 제대로 숙지할 수 있었다. 약점 노트가 점점 채워지면서 이전에 정리한 내용이 희미해지는 느낌이 들어, 일주일에 하루는 약점 노트를 전체 복습하는 시간을 가졌다. 예전에는 하루에 전범위를 보는 것은 상상도 못했는데 약점 노트에 취약 파트만 모아서 정리한 것을 봐주니 가능했다. 이제는 전범위에 대해 어느정도 전반적인 내용이 자리 잡고 있다고 느껴지고, 제대로 공부를 시작한 6월에 비해 엄청난 성장을 했다고 생각한다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"적중 N제와 MDEET를 계획까지 풀었고, 7,8월 OX 문제들을 복습하면서 기본기를 계속 챙겨줬다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"C그룹 대학 편입 시험을 위한 준비가 부족하다는 생각으로 마음이 불안했기에 어느정도 보충을 할 수 있었습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
  `"복습을 하루에 한단원씩 딱딱 하고싶은데 기본기 외의 것들도 챙기려다보니 시간이 좀 걸리지만 11월, 10월, 9월차 시험 복습과 내용정리를 열심히 했다. MDP 문제도 시작해서 조금씩 하고 있다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`,
  `"식생분진(식물, 진화)등 단원별 복습을 포함해서 문제를 풀며 전범위를 볼 수 있었다. 또, 문제를 풀며 왜 맞고 틀렸는지 이론을 상기시키며 근거를 생각해서 고르려고 했다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
  `"약점노트 정리와 오답 단권화, 기출 n제 복습은 계속 하고 있다. 지금까지 본 시험들로 어떤 부분이 부족하고 무엇은 확실히 암기해야 할 지는 감이 잡히고 있다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"기출N제 10회차까지와 전범위 모의고사 2회차 분량의 복습을 마쳤고 처음 보는 내용이 다수 있어 암기를 하는 동시에 패드에 다시 한번 적어보고 다음날은 적어둔 것을 30분에서 1시간정도 복습하는 것을 시작으로 생명공부를 했다. 이렇게 하니 기출N제의 내용이 많이 익숙해진 것 같다." — Akdow (26학년도 단국(약) 합격생)`,
  `"비전파인더 생물 시험을 꾸준히 보고 오답하고 있는 점." — Hcsg (26학년도 원광(약) 합격생)`,
  `"1) 매일 PEET 10문제씩 풀이 후 틀린 문제의 이론을 캠벨로 복습함. 부족한 이론은 핵심생물학으로 보충함." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"하루 한 단원씩 누적 복습을 하고 있고 작년에 어설프게 외웠던 약물들까지 추가해 공부했다. 양이 많아 버겁지만 여기가 마지노선이다 생각하고 열심히 외우고 있다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"∙ 공부한 것을 말로 설명하는 방식을 적용해서 복습을 진행함. 헷갈리던 내용이 많이 정리가 되었고 복습을 빠르게 할 수 있었음. ∙ 풀었던 문제와 기출을 다시 보며 써머리 책에 단권화를 하였음." — 레고링 (26학년도 계명(제약) 합격생)`,
  `"식생분진 암기가 귀찮았지만, 전체적으로 다시 한 번 암기를 진행하였다. 식생분진은 문제가 어렵게 나오는 단원은 아니기 때문에, 알면 맞춘다는 생각으로 공부를 하였고, 이렇게 생각을 하고 공부를 하니 좀 더 많이 동기부여가 되었다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
  `"2010 MD까지 풀었다. 확실히 추론문제 제끼니까 빨리 빨리 푸는것 같아서 속도가 난다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"MDEET 2회분(2007, 2008)을 풀고 관련 이론을 복습했다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"시간이 부족한만큼 최소한 풀어본 문제는 틀리지 말자는 생각으로 ox퀴즈, 중앙대 기출, 400제 완전히 암기하겠다는 느낌으로 복습하고 있습니다. 특히 정답률 높은데 틀린 문제들은 집중적으로 복습하고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"이번주는 식물, 분류 파트를 복습하며 약점 노트에 취약파트를 정리했다. 교재 순서를 그대로 따라가기보다 평소 헷갈렸던 부분, 자주 출제되는 부분을 우선적으로 다뤄 양을 늘려났다. 취약 파트를 먼저 공부하니까 잘 몰랐던 부분을 먼저 채웠다는 생각에 성취감이 올라갔다. VF 문제 리뷰와 병행하느라 일부 덜 중요한 부분은 못했지만 핵심 개념은 전반적으로 다 복습했다. 그리고 식물 호르몬 기능처럼 잘 기억나지 않는 개념은 ‘지배하려면 성장해야 해(지베렐린)’처럼 한 문장 암기법으로 단순화해 반복적으로 떠올렸다. 이렇게해도 안외워지는 부분은 MD문제 풀이 통해서 적용해가면서 암기해주려고 하였다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"복습하는 것보다 오답정리를 하면서 관련이론들을 더 암기할 수 있어서 좋았다. 그동안 오답이 밀려있어 이제서야 하게 됐는데 정확히 암기하진 못해도 문제에서 어떤걸 의도하고 묻고있는지 알수 있을정도는 된다." — 약대가쟝 (26학년도 단국(약) 합격생)`,
  `"MDEET 26학년도까지 다 풀었고, 매일 1시간씩 전 날에 했던 공부를 복습하면서 암기했다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"효과기 공부를 끝내고 다시 세포생물학 부분부터 공부를 하니 확실히 처음 내용을 볼 때 보다 눈에 들어오는 내용이 많았다. 시야가 확 넓어진 느낌이다. 또한 기출 문제를 풀며 지속적으로 나왔던 부분이 보이니 어디가 중요한 파트인지 자연스럽게 알게 되는 것 같아 좋았다. 아직 많은 문제들을 틀리지만, 이제는 확신을 가지고 풀 수 있는 문제들이 늘어났다. 특히, 최근 몇 주내에 공부한 부분이 나왔을 때 더 그런 것 같다. 아마도 자리잡은 공부법으로 안정감있게 공부한 것과 내용이 휘발되지 않은 영향이 큰 것이라 생각한다. 차분히 주어진 시간에 그날 배우는 내용에 집중하니 더 공부가 잘되는 것을 느꼈다." — 단퓨프 (26학년도 목포(약) 합격생)`,
  `"지난번 시험에서 생리학 파트에서 기본적인 내용들을 틀렸기 때문에 이번주는 생리학 파트를 열심히 보완했습니다. 주로 시험에 많이 나오지만 어려웠던 부분들을 철저히 대비했습니다. 동시에 박선우 선생님 OX 문제도 함께 풀며 세세한 개념을 놓치지 않으려 노력했습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
  `"MDP 문제를 하루에 열개~ 정도 풀고 모르는건 강의도 들으며 공부했다. 약한 단원들을 다시 공부하기 좋은 것 같다. VF 9~10월 문제도 다시 빠르게 보면서 기본기에 집중하려고 노력했다. 하루~이틀마다 잘 모르는 걸 정리해둔 박선우 써머리 한권씩을 최대한 빠르게 읽으면서 익숙하게 만들려고 노력했다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`,
  `"이번주 주어진 문제들을 리뷰하고 진도도 나갔다. 주어진 시간에 집중해 공부를 하였다. 문제를 리뷰하다보니 계속 비슷한 부분을 다른 방식으로 묻는 것 같았고, 확실히 그냥 이론을 읽을 때보다 문제를 풀고 그 부분을 보니 더 각인되는 효과가 있었던 것 같다." — 단퓨프 (26학년도 목포(약) 합격생)`,
  `"전체적으로 전범위를 공부했다. 기출이나 적중문제를 풀면서 생각이 잘 안 나거나 약점인 것 같은 단원들을 계속 보며 채우려고 했다. 특히 생화학이 전공 수준도 양이 많아서 추가로 잘 안 외워지는 것들은 자주 보며 복습했다. 간단히 계속 틀리는 개념들도 정리해서 매일은 아니더라도 자주 보려고 노력했다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
  `"이번주에 2026 mdp까지 모두 풀었다. 이번주에 푸는 내내 mdp를 처음 풀 때보다는 훨씬 정답률이 좋고 속도도 빨라졌다는 느낌을 받았다. 다음주부터 기출 n제 복습을 좀 더 속도를 내서 한바퀴를 다시 돌릴 예정이다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"목표로 했던 기출N제 14회까지의 복습을 마쳤다. 복습을 하면서 문득 12월부터는 아직도 어색한 개념이나 암기가 잘 안된 부분을 매일 계속 보는게 나을 것 같다는 생각이 들어 기출N제+중앙대재배치 및 22~25, 경희대22~25, 7,8월OX, 타임어택 모의고사, 그리고 기존에 단권화해놨던 정리본을 모두 복습하면서 계속 볼 내용들만 다시 정리하여 재단권화한 후 12월부터는 매일 2시간씩 단권 복습 후 + 알파로 다른 것을 할 예정이다. 현재 기출N제, 중앙대 재배치 및 22~25, 경희 22~25의 단권화까지 완료된 상태이다." — Akdow (26학년도 단국(약) 합격생)`,
  `"비전파인더 생물 시험을 꾸준히 보고 오답하고 있는 점." — Hcsg (26학년도 원광(약) 합격생)`,
  `"1) 매일 PEET 10문제씩 풀이하고 추가적으로 중앙대 기출 15문제를 풀어 기본기를 다짐. 2) 피드백 받은 대로 캠벨은 굵은 글씨 위주 & 그림 복습, 꿀벌책은 이론 보충용으로 공부함. 항상 생물에 자신감이 없었는데 기본기를 채우면서 점점 자신감이 생김." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"이번 모의고사 때 OMR 검토와 옳은/옳지 않은 확인 시간을 가졌다. 다음주에도 검토 시간을 가져보겠음. 생물은 하루에 한 단원씩 복습을 진행하고 있다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"∙미뤄왔던 식물, 생태, 진화 파트를 복습했음. 하고 나니 불안했던 마음이 사라졌음. ∙ 매일 전범위 문제를 풀고 단원별로 말로 설명하며 내용을 꺼내보는 방법을 이용해서 복습을 진행함." — 레고링 (26학년도 계명(제약) 합격생)`,
  `"분류학 암기를 다시 한 번 진행했다. 식생분진은 PEET때보다 출제되는 비중이 낮긴 하지만, 난이도가 있게 출제되지 않으니 암기하면 풀 수 있다는 생각으로 공부를 이어나갔다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
  `"기출N적중 문제Base로 복습을 진행했고, 그 덕에 심화된 지식과 기본기를 동시에 잡은것 같다. 옛날에는 생물문제를 풀때 알면 맞추고 모르면 틀린다는 인식이 강했던지라, 당황스러운 문제가 나오면 그냥 틀리는 경우가 많았는데, 지금은 그런 문제를 만나도 출제의도를 먼저 파악해보고, 내가 알고있는게 뭔지 곰곰히 되집어본후 잘 조합해서 풀어낼려고 노력해서 옛날보다 정답률이 많이 올라온듯 하다. 특히 기출문제에서 정답률이 많이 올라온게 느껴진다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"MDEET 2회분(2008, 2009)을 풀고 관련 이론을 복습했다. 적중400제, 전범위 모의고사 등에서 틀린/어려웠던 문제들을 단권화 노트에 정리하며 다시 보고있다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"저번주와 마찬가지로 복습하면서 서머리에 정리한 내용 암기하고 있습니다. Md기출도 풀어보면서 정리하고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"이번 주는 문제를 중심으로 개념을 복습하는 데 집중했다. MD, 기출N적중, 모의고사 문제들에서 나온 개념들을 약점 노트에 보충해서 단권화 해주었다. 특히 광합성, 유전학, 인간 생식계 발생 등 이전에 정리하지 않았던 내용을 이번 주 문제 풀이를 통해 추가로 정리할 수 있었다. 또 생리학 파트를 점점 잊어버리는 것 같아 기출N적중 2,4회 생리학 문제를 복습하면서 관련 개념도 확장해서 공부해주었다. 그리고 그동안 약점노트를 작성하면서 빈출 포인트를 색깔로 표시해 두었는데 문제를 많이 풀수록 중요 포인트를 더욱 잘 파악할 수 있었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"적중N제 복습을 위주로 공부했고, 매일 1시간씩 복습을 하면서 까먹지 않도록 노력했다. 주말에는 1주일 동안 공부한 내용을 정리해서 누적 복습해줬다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"박선우선생님 OX 문제를 지금 다시 풀어보니 포인트 복습도 되고 좋았습니다. 또한 지난 시험들을 복습하며 놓치는 기본 내용은 없는지 보완했습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
  `"전범위 위주로 문제 풀면서 이론을 채우려고 노력했다. 계속 복습하면서 부족한 부분을 우선적으로 채우려고 했다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
  `"기출 n제들을 처음부터 전체적으로 다시 풀고 복습하며 헷갈렸거나 틀린 부분은 페이지에 표시해뒀다. 다음주부터는 그 부분만 다시 보며 더 빠르게 복습할 수 있을 것 같다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"기출 n제 16회와 타임어택 5회 모의고사의 내용을 제외하고는 진행했던 단권화를 마쳤고 각 내용에 번호를 매겨서 이제부터는 매일 새로운것을 추가하면서 복습만 할 예정이다." — Akdow (26학년도 단국(약) 합격생)`,
  `"비전파인더 생물 시험을 꾸준히 보고 오답하고 있는 점." — Hcsg (26학년도 원광(약) 합격생)`,
  `"1) PEET 기출문제 풀이를 거의 마무리함. 남은 시간동안 MD 문제로 잘 마무리해줄 예정임. 2) 문제풀이하면서 문제의 정답이나 오답 근거를 한 줄로 정리하여 개념을 보충함." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"매일 한 단원씩 빠르게 복습을 함과 동시에 끝까지 안 외워지는 부분은 빨간색 펜으로 따로 필기 정리를 했다. 다시 책을 펼쳐볼 필요 없이 생물 공부 전 훑어보는 것만으로도 약점이 보완되는 것 같아 좋았다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"∙ 말로 설명하며 내용을 정리하는 방식을 계속 유지하며 복습했음. ∙ 점심 저녁 식사 시간을 이용해 생물 내용을 복기함. ∙ 매일 문제 풀이를 병행하며 외운 내용을 확인함." — 레고링 (26학년도 계명(제약) 합격생)`,
  `"분류학 암기를 다시 한 번 진행했다. 식생분진은 PEET때보다 출제되는 비중이 낮긴 하지만, 난이도가 있게 출제되지 않으니 암기하면 풀 수 있다는 생각으로 공부를 이어나갔다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
  `"문제BASE로 기본기를 쌓아 주었다. 여전히 틀리는건 많지만 시험장가기전까지 빈틈을 자꾸 매운다운 마인드로 공부중이다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"MDEET 2회분(2011, 2013)을 풀고 관련 이론을 복습했다. 적중400제, 전범위 모의고사 등에서 어려웠던 문제들을 단권화 노트에 정리하며 다시 보고있다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"지난주와 마찬가지로 복습, md기출 풀어보기 병행하고 있습니다. 문제 풀 때 정확하게 읽고 키워드에 표시해가면서 풀고있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"이번주는 식물, 진화, 상태 파트 복습을 하였다. 식물 파트는 그동안 문제를 통해서 많이 봐서 익숙했지만, 생태 파트는 오랜만에 다시 봐서 까먹은게 많다는게 느껴졌다. 그래서 캠벨을 키워드 중심으로 다시 읽으며 약점 노트에 단권화해주었다. 그리고 9월에 안풀었던 중앙대 기출도 풀며 출제 포인트로 나오는 부분을 중심으로 복습해주었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"적중N제를 15회차까지 모두 복기했고, 약점 단원인 오페론과 생화학 파트를 복습했다. 12월부터 전범위 무한 회독 할 수 있도록 7월 자료부터 정리한 단권화 노트를 완성했다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"기출 n제를 모두 복습했고, mdp는 하루에 2회차씩 풀었던 걸 복습하고 관련 내용에서 헷갈리는게 나오면 복습하는 식으로 공부했다. 써머리도 연필로 써둔 내용 중 확실히 기억하는 건 지우고, 여전히 헷갈리거나 중요한 건 볼펜으로 옮겨적는 등 정리작업에 들어갔다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"3권 인체생리학 파트 복습할 때, 끝까지 안외워지는 부분들만 발췌해 빨간펜으로 따로 정리했다. 매 단원 회독 전 정리한 부분을 모아 누적 복습을 했는데 약점이 되는 부분을 빠르게 복습할 수 있어 좋았다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"문장, 단어 정확히 읽고 표시하면서 복습하고 있고, md문제도 풀고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"이번주는 세포생물학, 생화학 복습을 하였다. VF OX, 중앙대 기출, 기출N적중 400제, 박선우 OX, MDP 등 그동안 풀었던 모든 문제를 복습하며 기본기도 재점검하고 필요한 내용은 약점 노트에 추가적으로 단권화해주었다. 그당시 틀렸던 문제를 다시 푸니 잘 풀리는 문제들이 많아서 실력이 올랐다는 것이 느껴졌다. 그래도 여전히 틀리는 문제도 있어서 아직까지도 헷갈리는 개념들은 따로 표시해두고 반복해주었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"캠벨을 읽고 써머리에 부족한 부분을 정리하고 가능하면 꿀벌책도 빠르게 읽으며 분자생물학 파트를 나갔다. 해당 파트 vf문제들도 풀고 써머리 o,x도 풀어 다각도에서 해당 내용을 보며 자연스레 중요한 부분을 익히게 되었다. 9월에 분자생물학을 공부할 땐 눈에 들어오지 않던 부분과 캠벨을 읽을 때 어렵다고 생각했던 부분이 이해가 되고 흐름을 캐치하며 내용이 조금은 압축되어진것처럼 느껴졌다" — 단퓨프 (26학년도 목포(약) 합격생)`,
  `"전범위 위주로 문제 풀면서 이론을 채우려고 노력했다. 풀었던 문제들을 최대한 복습하면서 부족한 부분을 우선적으로 채우려고 했다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
  `"써머리 전권 복습을 목표로 잡고 매일 반권씩 보며 캠벨 그림 부분도 회독하면서 복습을 이어갔다. 캠벨을 다시 읽으니 확실히 기본기를 다시 다지고 있다는 느낌이 들어 다음주도 이어갈 예정이다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"일주일동안 인체생리학을 MDP 그래프들, VF 문제들, 약물들과 함께 전부 복습했고 정리노트를 주기적으로 복습했다. MDP 유전문제들도 5문제씩 다시 풀어보았다. 다음주부터는 속도를 내어 빠르게 전체 복습을 할 수 있겠다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"∙ 문제 풀이와 개념 공부를 계속 병행해 주고 있음. 셀프 티칭을 하며 매일 말로 설명하는 방식으로 단원별 복습을 했고 전범위 문제를 풀고 헷갈리는 내용을 보충해줌." — 레고링 (26학년도 계명(제약) 합격생)`,
  `"MDP 풀던것들을 멈추고, 지금까지 문제 푼것들을 다시 풀면서 이론을 다시 보고 있다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"회독 속도가 올라서 이제 일주일에 1회독까지는 무난히 가능해졌다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"저번주와 같이 문제 복습하였고, 서머리 1회독 하면서 이론복습도 하고 있습니다. 회독 기간 단축해서 여러 번 회독하도록 하겠습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"12월부터 지금까지 했던 모든 문제들과 개념들을 복습하는 중이다. 새로운 문제에 대한 욕심을 내려놓고 공부했던 부분을 안 까먹는 방향으로 공부하니 생명이 마냥 어렵고 지엽적으로 다가오진 않는 것 같다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"일단 배운 내용부터 확실히 해두는 것이 효율적이란 것을 알기에 마음은 급하지만 이론 복습을 공고히했습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
  `"평소에 헷갈려하고 어려워하던 단원들의 개념들 위주로 여러 번 봤다. 어려운게 아니라 익숙하지 않은 것이었다고 생각한다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`,
  `"ox퀴즈 범위를 따라가면서 매일 아침 2시간씩 내용을 복기하고 누적 복습을 했다." — Akdow (26학년도 단국(약) 합격생)`,
  `"o, X 퀴즈 일정에 맞춰 기본기를 쌓기 위해 매일매일 새워둔 분량을 지키며 공부함" — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"강의를 들으며 1학기에 생물전공을 듣고 왔다 보니 이해가 잘 되고, 딱히 막히는게 없다고 생각이 듦. 복습 & 워크북 밀리지 않고 함" — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"강의 듣는 시간을 줄이고 자습 시간을 늘렸다는 점이 좋았다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"이준 선생님 강의를 듣고 복습하였으며 정해주신 진도대로 캠벨 책을 읽으며 기본적인 내용을 학습하였음." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"학습계획에 따라 핵심 기본기 OX 진도에 맞춰서 기본서 및 박선우 이론서 복습을 철저히 함." — 쿠리만쥰 (26학년도 5관왕 | 단국(약)·계명(제약)·삼육(약)·강원(약)·우석(약) 합격생)`,
  `"이전에 공부를 했을 때는 글을 읽는 과정에서 눈으로만 읽었던 것 같다. 이번에는 그동안의 습관을 바꿔서 질 좋은 공부를 하기 위해 노력하였고, 한 문장 한 문장 최선을 다해 인과관계를 생각하며 학습을 진행하였다. 이런 식으로 공부하니, 한 번 보더라도 이해가 훨씬 잘 되었고, 머리에 많이 남는 느낌을 받았다.  OX 진도에 맞춰 핵심 내용 위주로 공부하였다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
  `"기본서를 다시 읽다보니, 처음 공부할 때에는 삽입된 그림을 살피는 일에 너무 소홀했었다는 사실을 깨달을 수 있었다. 이번에는 삽입된 그림들을 꼼꼼히 살피면서 정독했더니 보다 깊은 이해에 도움이 되었던 것 같다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"기본서를 읽을 때 굵은 글씨 위주로 읽으려 했고, 박선우 교재 복습도 시작하였습니다. ox퀴즈 리뷰도 병행하였습니다. 기본서, 박선우 교재, ox퀴즈를 병행해서 학습하니 여러 번 반복 학습하는 효과가 있는 것 같아서 좋았습니다 ." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"강의 수강 전 캠벨을 읽으며 흐름을 파악함" — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"계획한 만큼 강의를 듣고, 월수금 OX 문제 풀기 전 기본서를 읽으면서 기본적인 내용에 충실하게 공부할 수 있었다." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"아직은 진도를 빼야 해서 강의시청 위주로 공부했지만 그때그때 잊기 전에 복습을 해서 그나마 많은 내용을 잊지 않고 기억하고 있다. 강의 내용이 “알던 내용 대부분 + 처음 듣는 내용 조금 + 대충 알았지만 다시 제대로 이해하는 부분”으로 이루어져 있어서 버겁진 않다." — 약대가쟝 (26학년도 단국(약) 합격생)`,
  `"ox퀴즈 범위를 따라가면서 틀린 개념의 부분을 켐벨 책으로 다시 한 번 확인하면서 내용을 복기하고 퀴즈 풀이 전 누적 복습을 했다. 맞은 문제들도 정확하게 알아서 푼 문제를 제외하고 감으로 풀었던 문제들 역시 다시 한 번 책을 찾아보며 정리했다. 헷갈리는 용어들이 많이 나와 그러한 용어들만 정리해 둔 요약본을 하나 만들었다." — Akdow (26학년도 단국(약) 합격생)`,
  `"지금까지 본 O/X 퀴즈에서 틀렸거나 약간이라도 헷갈렸던 개념이나 문제들을 ox나 빈칸 채우기 식으로 퀴즈 노트를 따로 제작하여 자주 복습함. 계획해둔 분량을 지키면서 복습함." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"통합이론 강의를 들으며 복습과 워크북을 꾸준히 풀어주었다. 틈틈이 생물 기본서를 읽어주면서 기본기를 잡으려고 노력했다" — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"OX 문제 진도 범위에 따라 기본서+강의 내용 복습에 집중했다. 매일 셀프 피드백과 OX 문제로 내가 약한 파트를 파악하고 이를 더 보완할 수 있었던 보람찬 한 주였다." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"OX 진도에 맞게 캠벨 책을 읽으면서 복습을 한 것이 좋았다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"이준 선생님 강의를 계획대로 들었고 복습도 하였음. 캠벨 책을 저번주보다 더 꼼꼼하게 읽었고 OX 문제를 풀 때 헷갈리는게 줄어듬." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"-저번 주와 마찬가지로 핵심 기본기 OX 진도에 맞춰서 기본서 및 박선우 이론서 복습을 뒤처지지 않고 해냈다.  -이전에 OX 테스트를 볼 때 문제에서 묻는 지식은 알고 있지만 선지를 자의적으로 깊게 or 왜곡해서 해석해 틀리는 경우가 종종 있었다. 그런 실수를 반복하지 않기 위해 최대한 합리적이고 상식적인 답안을 고르도록 연습했더니 조금씩 오답 수가 줄었다." — 쿠리만쥰 (26학년도 5관왕 | 단국(약)·계명(제약)·삼육(약)·강원(약)·우석(약) 합격생)`,
