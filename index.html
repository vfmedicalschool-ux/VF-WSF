<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',-apple-system,sans-serif;background:#f5f5f7;color:#1d1d1f;min-height:100vh;font-size:14px}
input,select,textarea,button{font-family:inherit;font-size:13px}
input,select,textarea{width:100%;border:1px solid rgba(0,0,0,.14);border-radius:9px;padding:8px 11px;background:#fff;color:#1d1d1f;outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:#0071e3;box-shadow:0 0 0 3px rgba(0,113,227,.1)}
textarea{resize:vertical;line-height:1.6;min-height:54px}
button{cursor:pointer;border:none;border-radius:9px;font-weight:500;transition:all .15s}
.nav{background:rgba(255,255,255,.85);backdrop-filter:blur(20px);border-bottom:1px solid rgba(0,0,0,.1);position:sticky;top:0;z-index:100}
.nav-inner{max-width:720px;margin:0 auto;display:flex;align-items:center;padding:0 16px}
.nav-tab{padding:14px 20px;background:none;border:none;border-bottom:2px solid transparent;color:#86868b;font-size:13px;font-weight:500;cursor:pointer;margin-bottom:-1px}
.nav-tab.active{color:#1d1d1f;border-bottom-color:#1d1d1f;font-weight:700}
.nav-badge{margin-left:auto;font-size:11px;color:#aeaeb2;padding:0 8px}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.card{background:#fff;border-radius:16px;padding:18px 20px;margin-bottom:12px;border:1px solid rgba(0,0,0,.08);box-shadow:0 1px 4px rgba(0,0,0,.06)}
.card-head{font-size:13px;font-weight:600;color:#1d1d1f;margin-bottom:13px}
.lbl{display:block;font-size:11px;color:#86868b;margin-bottom:5px;font-weight:500}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
.subj{background:#f5f5f7;border-radius:11px;padding:13px 15px;margin-bottom:10px}
.subj-title{font-size:13px;font-weight:600;color:#1d1d1f;margin-bottom:11px}
.btn-primary{background:#1d1d1f;color:#fff;padding:13px 24px;font-size:14px;font-weight:600;width:100%;border-radius:12px;margin-bottom:20px}
.btn-primary:hover{background:#3a3a3c}
.btn-primary:disabled{background:#aeaeb2;cursor:not-allowed}
.btn-blue{background:#0071e3;color:#fff;padding:9px 18px;font-size:12px;font-weight:600;border-radius:9px}
.btn-blue:hover{background:#0077ed}
.btn-blue:disabled{background:#aeaeb2;cursor:not-allowed}
.btn-ghost{background:transparent;border:1px solid rgba(0,0,0,.15);color:#1d1d1f;padding:9px 16px;font-size:12px;border-radius:9px}
.btn-ghost:hover{background:#f5f5f7}
.btn-sm{padding:6px 12px;font-size:11px;border-radius:7px}
.tag{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:500}
.tag-gray{background:#f0f0f2;color:#6e6e73}
.tag-blue{background:#e8f0fb;color:#0059b3}
.tag-orange{background:#fff5e0;color:#c45400}
.tag-green{background:#e8f9ed;color:#1a7a3a}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px}
.dot-on{background:#34c759}.dot-off{background:#ff3b30}
.err{background:#fff5f5;border:1px solid #fecaca;border-radius:9px;padding:9px 13px;font-size:12px;color:#c0392b;margin-bottom:10px}
.list-item{border:1px solid rgba(0,0,0,.09);border-radius:12px;padding:13px 16px;margin-bottom:8px;background:#fff;display:flex;justify-content:space-between;align-items:flex-start;cursor:pointer;transition:box-shadow .12s}
.list-item:hover{box-shadow:0 2px 8px rgba(0,0,0,.1)}
.list-item.has-fb{border-color:rgba(52,199,89,.3);background:#f9fff9}
.prev-box{background:#fffdf7;border:1px solid rgba(200,150,0,.25);border-radius:13px;padding:15px 17px;margin-bottom:12px}
.prev-row{padding:8px 0;border-bottom:1px solid rgba(200,150,0,.15)}
.prev-row:last-child{border-bottom:none}
.fb-box{background:#fafafa;border:1px solid rgba(0,0,0,.08);border-radius:13px;padding:16px;font-size:13px;line-height:1.9;white-space:pre-wrap;margin-bottom:12px;color:#1d1d1f}
.roster-item{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;background:#f5f5f7;border-radius:8px;margin-bottom:5px;font-size:13px}
.roster-del{background:none;border:none;color:#aeaeb2;font-size:16px;cursor:pointer;padding:0 3px;line-height:1}
.roster-del:hover{color:#ff3b30}
.done-wrap{display:flex;align-items:center;justify-content:center;padding:60px 20px}
.done-card{background:#fff;border-radius:20px;padding:44px 36px;max-width:360px;width:100%;text-align:center;border:1px solid rgba(0,0,0,.08);box-shadow:0 4px 20px rgba(0,0,0,.08)}
.nw-table{width:100%;border-collapse:collapse;font-size:12px}
.nw-table th,.nw-table td{padding:5px 6px;text-align:center}
.nw-table thead tr{background:#f0f0f2}
.nw-table thead th{font-weight:600;color:#3a3a3c;font-size:11px}
.nw-table tbody tr{border-top:1px solid #f0f0f2}
.nw-table .row-lbl{text-align:left;font-size:11px;color:#6e6e73;font-weight:500;white-space:nowrap}
.nw-table input,.nw-table textarea{font-size:12px;border-radius:7px;padding:5px 7px}
.apikey-box{border:1px solid #d0e2f9;border-radius:13px;padding:14px 17px;background:#f0f6ff;margin-bottom:12px}
.detail-sub{border-left:3px solid #e0e0e0;padding-left:12px;margin-bottom:12px}
.detail-sub.bio{border-color:#34c759}.detail-sub.chem{border-color:#0071e3}.detail-sub.org{border-color:#a28bfa}.detail-sub.life{border-color:#ff9f0a}
.prompt-box{background:#f8f8f8;border:1px solid rgba(0,0,0,.08);border-radius:11px;padding:13px;font-size:11px;line-height:1.75;white-space:pre-wrap;max-height:220px;overflow-y:auto;margin-bottom:11px;color:#555}
.loading-wrap{display:flex;align-items:center;justify-content:center;height:60vh;flex-direction:column;gap:14px;color:#86868b;font-size:14px}
.spinner{width:36px;height:36px;border:3px solid #e0e0e0;border-top-color:#0071e3;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── 갤러리 ── */
.gal-bar{background:#fff;border-bottom:1px solid #e5e5e5;padding:10px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:sticky;top:54px;z-index:90}
.gal-sel{padding:7px 10px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:13px;font-weight:500;color:#1d1d1f;background:#fff;cursor:pointer;outline:none}
.gal-sel:focus{border-color:#0f3460}
.gal-div{width:1px;height:22px;background:#e5e5e5;margin:0 2px}
.gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;padding:16px;max-width:1400px;margin:0 auto}
.gal-empty{text-align:center;padding:70px 20px;color:#86868b;grid-column:1/-1}
.gal-card{background:#fff;border-radius:14px;border:1px solid rgba(0,0,0,.08);box-shadow:0 2px 10px rgba(0,0,0,.06);overflow:hidden}
.gal-card:hover{box-shadow:0 4px 18px rgba(0,0,0,.11)}
.gal-card-head{padding:12px 14px 10px;border-bottom:1px solid #f2f2f2;display:flex;align-items:flex-start;gap:10px}
.gal-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;flex-shrink:0}
.gal-name{font-size:14px;font-weight:800;color:#1d1d1f}
.gal-meta{font-size:11px;color:#86868b;margin-top:1px}
.gal-week-badge{margin-left:auto;font-size:11px;font-weight:700;color:#0f3460;background:#e8f0fe;padding:3px 8px;border-radius:20px;white-space:nowrap}
.gal-tabs{display:flex;border-bottom:1px solid #f2f2f2}
.gal-tab{flex:1;padding:9px;font-size:12px;font-weight:700;color:#86868b;background:none;border:none;border-bottom:2px solid transparent;cursor:pointer}
.gal-tab-active{color:#0f3460;border-bottom-color:#0f3460;background:#f8faff}
.gal-tab:hover:not(.gal-tab-active){background:#f5f5f7}
.gal-card-body{padding:12px 14px;max-height:380px;overflow-y:auto;font-size:12px}
.gal-card-body::-webkit-scrollbar{width:4px}
.gal-card-body::-webkit-scrollbar-thumb{background:#e0e0e0;border-radius:4px}
.gal-subj-block{margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid #f5f5f5}
.gal-subj-block:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.gal-subj-head{font-size:12px;font-weight:800;color:#1d1d1f;margin-bottom:7px}
.gal-field{display:flex;gap:6px;margin-bottom:5px;line-height:1.5}
.gal-flabel{font-size:10px;font-weight:700;color:#86868b;white-space:nowrap;min-width:36px;padding-top:1px}
.gal-fval{color:#3c3c43;flex:1;white-space:pre-wrap;word-break:break-word}
.gal-nw-block{background:#f8faff;border-radius:9px;padding:10px 11px;margin-top:6px}
.gal-nw-title{font-size:11px;font-weight:800;color:#0f3460;margin-bottom:6px}
.gal-nw-row{font-size:11px;color:#3c3c43;margin-bottom:4px;white-space:pre-wrap;word-break:break-word}
.gal-fb-text{font-size:12px;color:#3c3c43;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.gal-fb-at{font-size:11px;color:#86868b;margin-top:8px;text-align:right}
@media(max-width:600px){.gal-grid{grid-template-columns:1fr;padding:10px}}
</style>

// 개인정보(실명·GPA·토익·지원전략)이므로 소스에 넣지 않습니다.
// 강사 계정으로 로그인했을 때만 Firestore(config/profiles)에서 불러옵니다.
let STUDENT_PROFILE={};
async function loadProfiles(){
  try{
    const d=await fsdb.collection('config').doc('profiles').get();
    STUDENT_PROFILE = d.exists ? (d.data().data||{}) : {};
  }catch(e){ STUDENT_PROFILE={}; console.warn('프로필 로드 실패(권한 없음이면 정상):',e.code||e.message); }
}
async function uploadProfiles(obj){
  await fsdb.collection('config').doc('profiles').set({data:obj,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
  STUDENT_PROFILE=obj;
}

    `"저번주부터 적용한 공부 방식이 잘 맞는다. 선생님과의 상담을 통해 공부 방향에 대한 점검을 하여 지금 공부하는 방식에 대한 확신이 생기자 생물에 대한 걱정이 줄고 공부하는 내용에 집중할 수 있게 되었다. 조급한 마음을 내려놓으니 오히려 집중이 잘되는 것 같다. 단원별로 중앙대 기출과 적중 문제를 정리하고 있다. 저번달에 리뷰한 문제도 있고 그렇지 못한 문제도 있지만 계속 눈에 보이니 전체 내용을 보아도 중요한 부분이 보이고 익숙해지니 더 잘 외워지는 것 같아 애니어그램 내용을 직접 느껴 뿌듯했다." — 단퓨프 (26학년도 목포(약) 합격생)`,
    `"8월 o/x를 하루에 한 회차씩 복습했고, 퀴즐렛도 매일 테스트를 풀어서 점검했다. 실수같아 보이는 것들도 답을 고른 사고 회로를 모두 되짚으며 복습했더니 결국 이론적으로 미숙함이 있어서 틀린 부분들이 있다는 걸 발견할 수 있었다. 이번주부터 MDP를 풀기 시작했다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"홍쌤의 조언을 받아들여 기존 계획대로 주말동안 공부를 하되 매일 조금씩(60문제를 평일(5일간) 6문제, 주말에 15문제씩 나눠 공부하는 식으로) 생물공부를 나눠서 진행한 것. 이제 꾸준히 공부할수 있다." — Hcsg (26학년도 원광(약) 합격생)`,
    `"복습하고 있는 단원들의 MDP 문제들도 선별해 같이 보면서 문제와 병행한 해당 단원들 복습을 더 꼼꼼히 할 수 있었고, 선지를 잘못 보는 실수 교정을 위해 의식적으로 해당 개념들을 떠올리며 문제 푸는 연습도 병행했다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
    `"1) 문제풀이가 없는 날 MD문제를 풀고 부족한 단원(발생, 장기기억 등)을 공부함. 2) 기본기 OX 문제를 통해 생화학, 분자생물학 부분을 가볍게 복습함." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"휘발성이 강한 식생분진을 다시 복습해보았다. 그리고 오랜만에 ch.7 생화학 파트도 다시 복습해서 알찼다. 23 피트는 못 풀게 되었지만 그래도 틈나는 대로 22 피트까지 전부 풀었다. 다음주부터는 단원별로 조금씩 MDP 문제 전부를 중요 문제 위주로 다시 복습하자. 선생님 말씀대로 유전이나 진화 파트도 잊지말고 다시 풀어보기" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"∙ 공부해도 자꾸 잊어버리는 내용이 많은 것이 문제라 생각해 복습주기를 짤게 가져갔음. ∙ 매일 몰랐던 내용을 한 군데에 정리해놓고 자주 보기를 실천 중임" — 레고링 (26학년도 계명(제약) 합격생)`,
    `"발생과 생식단원을 공부하면서 앞뒤내용을 계속 연관지어 공부할려고 노력했다. 확실히 머리에 남는게 많았고, 발생생식내에서도 연관되는 부분을 짝지어 볼려고 노력했다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"자주 헷갈리는 내용들을 모아 보기 편하게 정리해두었다. 앞선 기본기OX, 메디컬OX, 중앙대 기출 등에서 어려웠던 문제들도 따로 적어두었다가 시간을 쪼개어 틈틈히 살펴보고 있다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"기출, 퀴즈 복습하면서 400제도 푼 다음날 바로바로 복습해주고 있습니다. 반복적으로 나오는 부분들은 확실하게 외워진 것 같습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"가장 약점인 원핵생물 분자생물학, 순환계, 배설계 파트를 복습하고 MD 문제를 풀어주었다. 항상 잘 안외워지는 파트라 그동안 회피하고 있었는데 강원대 기출을 풀면서 이제는 꼭 봐야 겠다고 생각이 들어 이번 기회에 제대로 공부하고 암기했다. 암기할 때 목차를 떠올리며 내가 외우고 있는 부분이 어디인지 의식하고 외우니까 생각보다 잘 외워졌다. 그리고 더이상 까먹지 않기 위해 누적 복습도 해주었다. 컴팩트있게 약한 단원을 봐주니 어느정도 자신감이 생긴 것 같다. 다음주에 생리학 부분 이어서 복습하려 했는데 금요일 VF 문제가 생리학 파트여서 반가웠다. 다음주에 생리학 나머지 부분 복습하면서 생리학 심화 문제도 암기할 것이다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"문제 풀이를 하면서 배설계와 먼역계 파트가 약점단원임을 파악했고, 한 주 동안 배설계와 면역계를 집중적으로 암기해줬다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"짬을 내서 MDP 시험도 풀기 시작했습니다. 시험이 나올 수 있는 소스들은 미리미리 다 접해보는 것이 좋을테니 앞으로도 짬을 내서 다양한 지식을 접해야겠습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
    `"약한 부분 기본서 다시 읽으며 기본기 챙기려고 노력했음" — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`
    ],
    화학:[
    `"화학을 공부하는데 조금 속도를 내며 하는 법을 적용해보고 있다. 전에는 이론을 보고 멈추고 화면 내용을 필기했는데 사실 중요한 것은 이론을 직접 문제에 적용하는 것임을 되새기며 선생님의 문제 풀이까지 보고 선생님의 필기를 교재에 적고, 따라서 문제를 푸니 시간이 단축되었다. 또한 복습할 때도 이론보다는 문제를 풀며 이론을 떠올리니 복습시간이 단축되었다. 항상 ap를 생각하고, 체계적으로 푸는 것을 적용하며 문제를 풀고 있다." — 단퓨프 (26학년도 목포(약) 합격생)`,
    `"드디어 18장 배위화합물 공부를 마쳤다. 쌩으로 외우는 단원이라고 생각해서 정말 하기 싫었는데, 이번 회독에서 생각보다 외울 게 별로 없다는 것을 느꼈다." — 시계탑기린친구 (26학년도 강원(수) 합격생)`,
    `"이번 주에는 2000제에서 지금까지 푼 문제를 모두 복습하는 시간을 가졌다. 헷갈렸던 부분들은 더 집중적으로 풀고 복습하면서 내가 어느 부분에서 실수를 자주 하는지도 파악하려고 노력했다. 기출 올인원도 풀기 시작했다. 문제를 확실히 파악하면서 어떻게 풀지 의식적으로 생각하며 풀려고 노력해야겠다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"밀리지 않고 7일 연속 적중 2000제 문제풀이 및 오답까지 진행한 것. 이대로면 앞으로 50일동안 하루 30문제씩 풀면 2000제는 완전히 끝난다." — Hcsg (26학년도 원광(약) 합격생)`,
    `"기출올인원과 적중, 1500제 복습을 병행하며 단원별 문제풀이를 했고, 만들었던 암기, 실수 노트를 같이 회독하며 복습했다. 또, 전범위 연습 모의고사를 따로 풀며 연습도 적용했다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
    `"1) 화학 공부 시작할 때 코드 1,2 문제를 랜덤으로 25문제 ~30문제씩 복습함." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"이번주는 기출올인원 산/염기 관련 파트 정복주여서 관련 단원들을 전부 풀었다. 실전 문제 모음집이다 보니 확실히 복잡하고 어려워 시간이 오래 걸렸다. 하지만 힘들어도 포기하지 않고 다 풀어내서 뿌듯하다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"기출 문제를 풀며 처음 보는 문제를 풀고 풀이 방법을 익혔음" — 레고링 (26학년도 계명(제약) 합격생)`,
    `"화학 연습용 모의고사를 풀면서 시간이 부족하다는것이 어떤 느낌인줄 알았다. 그래서 왜 전략단원을 만들어 놓으라 했는지 알것같다. 전략단원을 어느정도 미리 만들어 놓긴 했는데, 부족하다는 느낌이 들어 전략단원을 좀더 늘려나가는 공부를 해야겠다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"연습용 모의고사를 풀며 시험장에서의 일반화학 풀이 전략을 세워보았다. APS를 떠올린 후 한 번에 정확히 풀고자 노력했다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"이번주는 2000제 복습에 중점을 두었습니다. 중간중간 까먹었던 부분을 보완할 수 있었습니다. 또한 모의고사를 풀어보면서 시험 감각을 끌어올리는 연습을 하였습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"저번주에 맘대로 문제를 푼 것을 반성하며 올바른 학습법 체크리스트를 통해 점검해주었다. 쉬운 문제를 소홀히 하고, 문제를 보자마자 무작정 뛰어들려고 한게 가장 큰 문제점이었다. 그래서 코드3 진도 나가면서 코드 1,2 문제 전체를 풀어주며 나의 말로 AP을 풀어서 써서 체계적으로 풀려고 하였다. 어려운 문제들은 쉬운 문제들의 조합이라는 것이 눈에 보이며 쉬운 문제들을 더 숙달할 수 있게 반복해서 풀어 주었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"박인규 선생님께서 11월까진 2000제 복습 비중을 더 크게 잡는 것이 좋다고 조언해주셔서 2000제 전문항 복습 -> 올인원 수강 루틴으로 공부했다. 2000제에서 지엽적이라 생각했던 개념들이 올인원의 추가 문제들로 다뤄져서 더 수월하게 암기할 수 있었다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"최대한 목표한 만큼 푸는 것을 위해 노력했습니다. 또한 정답을 맞췄어도 좀 더 효율적인 방법을 강의를 보며 고안하고. 느리게 푼 문제는 왜 느렸는지 고민해서 더 빠르게 푸는 방법을 연구했습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
    `"다음주까지 2000제 3번으로 시작하는 문제를 제대로 푸는 것을 목표로 했는데 어찌저찌 해낼 수 있을 것 같다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`
    ],
    유기:[
    `"몰랐던 내용을 처음으로 질문을 드려 해결했다. 시간을 너무 많이 쓴 점을 보완할 점이지만, 궁금한 점을 질문드려 해결했다는 점을 칭찬한다." — 단퓨프 (26학년도 목포(약) 합격생)`,
    `"지금까지 배웠던 걸 복습하니 좀 더 수월하게 공부할 수 있었고 풀었던 예제나 테스트를 다시 풀면서 놓친 부분이 없는지 점검했다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"꾸준히 조금씩 공부한 점. (학교 유기2도 공부하느라 "반드시" 공부할수밖에 없다.)" — Hcsg (26학년도 원광(약) 합격생)`,
    `"유기를 매일 공부했고, 저번 주 조금 아쉬웠던 유기2 단원 반응들 복습까지 병행했다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
    `"1) 꾸준히 2시간씩 공부함. 2) 단원별 문제풀이를 하면서 이론을 복습하고 부족한 부분을 채움." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"2시간을 나누어 초반은 아직 끝내지 못한 ch.24 아민 기본서를 풀었고, 두 번째는 밀린 산염기 파트 VF 복습을 했다. 산염기 갈피를 정말 못잡았었는데 한바퀴 돌리고 다시 VF 1-1,2회차를 다시 풀어보니 훨씬 정돈된 느낌이 들고 정답률도 많이 올라갔다. 앞으로 실전VF 진도 맞춰 개념 복습 뿐만 아니라 VF 문제를 다시 풀어볼 것이다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"∙ 처음부터 기본서 읽고 헷갈리는 내용은 강의 듣고 필기해놓은 걸로 보충해줌. 넘어갔던 단원별 예제를 다 풀어주고 다시 보고싶은 문제들은 모아서 정리해둠. 이해와 문제풀이가 다 잘되는 것 같아 다음주도 같은 방식으로 할 예정임" — 레고링 (26학년도 계명(제약) 합격생)`,
    `"VF 유기 진도에 맞춰 복습하고 7~9월 VF문제를 같이 풀어주었다. 그당시에는 뒤에서 배우는 내용들이라 해설을 봐도 이해가 안되어 남겨둔 내용들이 많았는데, 이제는 해설을 읽으면 이해가 되어서 오답하기에 한껏 수월하다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"기본서와 예제를 중심으로 차근차근 공부했다. 자주 헷갈리는 부분들을 노트에 정리하며 완전히 내 것으로 만들고자 애썼다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"저번주와 마찬가지로 스미스 예제, TEST 복습하면서 강의를 들었습니다. 유기 2 부분도 틈틈이 보면서 암기하고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"VF 유기 커리 처음 시작할 때 스미스로만 공부해서 1~4단원은 강의를 안들었다. 이번에 처음부터 복습하면서 스미스로만 공부해서 놓쳤던 부분을 약사랑 유기화학 강의로 채워주었다. 7월 VF 유기 문제를 다시 풀어보니 그 당시 틀렸던 문제들이 잘 풀렸다. 그리고 유기화학 단원에 퍼져있는 산염기 부분을 한번에 모아서 정리해주었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"7~9월 VF 문제들과 연습문제들을 다시 풀어보면서 알카인 단원까지 복습을 해줬다. 1회독을 하고 복습을 하니 이전에는 잘 와닿지 않던 개념들이 문제풀이에 더 잘 적용되는 것이 느껴졌다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"이제 한바퀴를 돌아서 새로운 내용이 없어서 정리한 내용을 기반으로 빠르게 공부를 할 수 있었습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
    `"첫 회독할때 산과 염기가 너무 헷갈리고 복잡하다고 생각했는데, 문제를 더 많이 풀어보면서 공부하니까 좀 더 잘 알게 되었다는 느낌이 들어서 뿌듯하다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`
    ],
    생활관리:[
    `"선생님께 궁금한 점들을 질문해 혼자 고민하던 부분이 사라졌다. 내가 공부하는 방식에 대해 자신감이 생기니 집중이 더 잘 되었다. 목,금,토의 공부가 흔들렸었는데 오늘 다시 루틴을 되찾았다. 루틴을 되찾고 집중해서 공부하니 오히려 마음이 편해졌다. 루틴이 망가졌어도 조금이라도 공부하려 노력했다." — 단퓨프 (26학년도 목포(약) 합격생) [1w2]`,
    `"오후에 집중이 너무 안되서 시간 날린 것 같다는 현타가 와도 원래 루틴대로 저녁공부까지 했다. / 플래너에 할일 하나를 완수하고 나서 간단하게 공부한 키워드나 아직 더 공부해야 할 키워드를 적고 지나갔다." — 시계탑기린친구 (26학년도 강원(수) 합격생) [4w3]`,
    `"6시 기상을 평일동안 거의 지켰고, 이번주부터 새로운 환경에서 공부하고 있다. 운동도 주 2회는 반드시 해주고 있다. 영양제도 계속 챙겨먹으며 감기나 컨디션 난조를 조심하고 있다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생) [9w8]`,
    `"스톱워치로 시간을 재며 생물 해설지를 탁구 치듯이 급하게 읽으며 모르는것만 표시해두었다가 나중에 찾으며 공부하니 다소 긴장하며 공부를 하게 되고, 너무 몰아서 공부하지 않고 매일 꾸준히 조금씩 나누니 늘어지지 않고 부담없이 생물60문제를 공부할수 있게 되었다. 또한 2000제의 30문제를 매일 스톱워치로 40분 이내에 풀려 노력하며 문제풀이 및 오답을 진행하니 기대했던 것만큼 빠르지 않고 의외로 시간이 꽤 걸리긴 하지만 그래도 밀리지 않고 꾸준히 할 수 있게 되었다." — Hcsg (26학년도 원광(약) 합격생) [5w6]`,
    `"컨디션이 안 좋은 한 주였지만, 공부 루틴 흐름이 깨지는 건 싫어서 할당된 과목 공부 시간을 줄이더라도 매일 세 과목 공부와 전체적인 흐름은 가져가려고 노력했다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생) [1w9]`,
    `"최소한의 공부량 지킴. 산책으로 스트레스 관리함." — 이번엔내차례 (26학년도 삼육(약) 합격생) [9w8]`,
    `"이번 긴 휴일동안 7~8월보다 더 철저하게 공부에 몰입해보려고 했다. 휴일 시작부터 3일간 목표치 이상의 공부량과 시간을 확보해 좋았다. 디스크때문에 운동을 미룰 순 없기에 헬스장도 꾸준히 갔다. 다음주도 최고로 몰입과 집중할 수 있도록 하자" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생) [1w9]`,
    `"∙ 충분한 수면시간 지키고 운동 시간을 줄여 컨디션을 회복하고 공부시간을 더 확보했음. 성취감 있는 공부를 했다." — 레고링 (26학년도 계명(제약) 합격생) [9w1]`,
    `"금요일부터 슬 연휴의 분위기가 느껴지고 나도 모르게 마음이 풀어졌지만, 그래도 최대한 평소의 루틴을 지키고자 노력했다." — 초록콩 (26학년도 순천(약) 합격생) [9w1]`,
    `"큰 이슈 없이 꾸준함을 유지하고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생) [6w5]`,
    `"마음이 불안한 와중에 생활패턴은 꼭 지켰다. 아팠던 월요일 빼고는 8시반~9시 사이에 일어났고, 9시 반에는 독서실에 앉아서 공부를 시작했다. 저녁에 12시에 돌아와 2시 전에는 잠자리에 드는 습관을 유지했다. 매일 밤 '오늘 만족한 학습’도 적으면서 공부에 대한 긍정적인 감정을 의식적으로 끌어올리려고 노력했다. 마음이 흔들려도 루틴만큼은 흐트러지지 않도록 끝까지 버텼다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생) [4w3]`,
    `"운동과 공부를 루틴대로 꾸준하게 했다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생) [9w8]`,
    `"사건 사고가 많은 주였지만 본분을 잊지 않고 할일을 했습니다." — 후회없이살자 (26학년도 강원(약) 합격생) [5w6]`,
    `"몸이 너무 피곤해서 매일 자는 시간을 조금 늘렸다. 공부 시간 사이사이 몸도 풀고 하늘도 보면서 쉬는 시간도 열심히 가졌다. 일주일에 두번씩 운동도 열심히 다녔다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생) [9w1]`
    ]
  },
  "10-2":{
    생물:[
    `"계속 공부하던 루틴을 최대한 유지하면서 문제를 풀고 복습했다. Mdp 문제를 푸는게 아직 익숙치 않아서 오래 걸리지만 약점 단원을 복습하고 점검하는 데 도움이 된다는 게 체감되기 시작했다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"엠디트 문제를 매일 1시간 반 풀이+ 30분 정리로 목표로 했던 범위까지 마쳤다. 정리를 할 때 단순히 엠디트에서 필요한 개념뿐만 아니라 그와 관련된 개념도 같이 적으면서 정리하느라 시간은 조금 더 걸렸지만 관련 개념을 계속해서 눈에 익숙화시켰다. 또, 중앙대 25년도까지의 풀이 및 정리를 마치고 다음주부터 경희대 기출을 풀 예정이다. 엠디트 정리본 양이 생각보다 많아져서 다음주부터는 엠디트 풀이 및 정리 시간은 유지하면서 엠디트 복습 시간 1시간+ 지금까지 풀었던 문제들 복습 1시간으로 변경할 예정이다." — Akdow (26학년도 단국(약) 합격생)`,
    `"학교시험범위 공부(생화학1,일반생물학실험2)를 하면서 수요일까지는 비전파인더 생물 오답 공부를 꾸준히 한 점." — Hcsg (26학년도 원광(약) 합격생)`,
    `"분자생물학+생리학을 복습하며 mdp 선별 문제도 같이 풀이했다. 분생 실험이 많아서 조금 힘겨웠지만, 엠디피 기준으로 빈출되었던 중요한 실험 위주로 복습하며 이해 & 암기했다. 추가로 경희대 기출을 풀고 오답하며 아직 부족한 파트를 찾고, 알고 있는 개념들 적용시켜서 푸는 연습도 했다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
    `"1) 지난 주 보완점 중 이론서 70% 암기 후 넘어가기 방법으로 생리학 복습을 마무리함. 2) MD 문제 풀이 후 틀린 문제 단원과 까먹은 이론을 다시 봄. 3) 시간 날 때 퀴즐렛으로 VF OX 문제, 중앙대 기출 오답 문제를 복습함." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"생화학 뒷부분과 광합성도 오랜만에 복습 완료했다. 본격적으로 심플리시티를 풀어봤는데 정말 구석구석 문제들이 출제되어 그때그때 개념서로 돌아가 복습하였다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"저번 주에 실시됐던 적중 400제의 생리학 Test에서 느꼈던 것인데, 생리학, 특히 순환계와 배설계쪽은 난이도있는 문제가 나온다면 철저히 이해가 되어있지 않으면 시간이 부족한 본고사에서 빠르게 풀기 어렵겠다는 생각이 들었다. 그리고 저번 주 부터 문제들을 풀어오면서 순환계, 배설계 파트에 약하다는 것을 알게 되어서 이번 주에는 해당 단원들을 박선우T 교재로 여러 기전들을 확실히 이해하며 암기하는 방식으로 공부했다. 다음주에도 약점이 드러나는 단원이 있다면 그렇게 공부해보고, 화요일과 금요일의 Test를 통해 학습의 효과를 확인해봐야겠다." — 쿠리만쥰 (26학년도 5관왕 | 단국(약)·계명(제약)·삼육(약)·강원(약)·우석(약) 합격생)`,
    `"∙ 통합이론 개념 공부와 써머리 OX 문제풀이를 병행했음. MDP 지식형 문제도 같이 풀었음" — 레고링 (26학년도 계명(제약) 합격생)`,
    `"세포분열, 유전학 헷갈리는 개념들을 모두 단권화하였다. 단권화 한 내용을 남는 시간에 지속적으로 봤다" — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
    `"문제 위주로 복습하며 착실히 단권화를 해나가고 있다. 숭숭 뚫려있었던 구멍들이 차츰차츰 메꿔지는 것이 느껴졌다. 특히 앞서 이해하지 못하고 넘어갔던 내용들이 다시보니 이걸 왜 이해 못했지 싶을 정도로 수월하게 받아들여질 때 기분이 좋았다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"풀었던 문제 계속 반복해서 보고 있고 7, 8월 퀴즈 내용은 대부분 암기가 된것 같습니다. 연휴동안 예전에 받았던 경희대, 단국대 기출도 간단하게 공부하였습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"저번주에 이어서 그 다음으로 약한 단원인 배설계, 호흡계, 면역계를 복습하였다. 이번에는 전체적인 흐름 속에서 세부 내용을 암기하는 방식에 초점을 두고 공부하였다. 전체 맥락은 이해하고 있지만 디테일하게 묻는 문제에서 기억이 잘 안나는 부분을 보완하기 위함이었다. 개념 복습 후에 MD 문제와 그동안 풀었던 VF 문제들을 다시 풀면서 세부 내용을 잘 암기하였는지 점검해주었다. 저번주에 복습했던 내용도 까먹지 않게 틈틈이 복습해주었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"매일 1시간씩 복습 시간을 가졌으며, 중앙대 기출을 모두 풀고 적중 N제 50제를 다시 풀어보았다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"편입문제에서 중요한 부분부터 먼저 공부하고 지엽적인 부분도 차례로 채워가며 공부했습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`
    ],
    화학:[
    `"1. 코드 3번을 들어가면서부터는 10분씩 끊어가면서 최대한 빠르고 기계적으로 풀어보는 연습을 하기 시작했다. 코드 1,2 때는 해설강의를 많이 들으면서 올바른 풀이방향을 확립하기 위해 노력했다면, 코드 3을 풀 때는 많은 문제를 풀어보며 배운 풀이방법을 체화시키기 위해서 노력하고 있다. 2. 10분씩 풀면서 사고과정이 느리다고 생각하는 부분은 간단하게 기록해두면서 의식하려고 하였다." — 시계탑기린친구 (26학년도 강원(수) 합격생)`,
    `"선생님이 짚어주신 대학들 위주로 문제들을 골라서 풀었고, 연습 테스트를 병행하며 실수 노트를 만들기 시작했다. 여전히 부족하지만 연습 때 푼 2개의 테스트보다 오늘 푼 테스트에서 가장 높은 점수를 받았기 때문에 더 모의고사를 연습하며 연구할 필요성을 느꼈다.(경희대와 중앙대, 연세대 기출도 지금 다 푸는게 좋을까요?)" — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"매일 1시간의 복습을 통해 기출올인원 정리본을 다 복습할 수 있었고 목표로 했던 분량까지의 풀이를 마쳤다.처음보는 개념이 아니고 알고 있는 내용으로 풀 수 있는 문제는 이제 시간이 조금 걸리더라도 모두 풀어낼 수 있을 것 같다는 자신감이 생겼고 모의고사에서도 시간 부족함 없이 잘 풀 수 있었어서 만족스러운 화학 공부였다." — Akdow (26학년도 단국(약) 합격생)`,
    `"밀리지 않고 6일 연속 190문제의 적중 2000제 문제풀이 및 오답까지 진행한 것. 정확히 1360문제가 남은 상황에서 이대로면 앞으로 8주간 1주일 중 5일동안 하루 35문제씩 풀면 2000제는 완전히 끝난다." — Hcsg (26학년도 원광(약) 합격생)`,
    `"단원별로 기출올인원을 풀며 경희 기출(생물 풀며 같이 풀었다)도 추가해서 전범위 연습을 조금 늘렸다. 그래서 이번 주는 휴식으로 인해 평소보다 공부시간이 적었지만 감 잃지 않게 전범위 문제를 풀 수 있었다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
    `"1) 매일 화학 공부를 시작할 때 적중 2000제 코드 1,2를 랜덤으로 20문제~30문제씩 복습하면서 기본기를 다짐. 2) 적중 2000제 후반부를 수강하면서 배운 실전 문제풀이 팁을 이번 모의고사에서 적용하려고 노력함. (상식적인 접근으로 말도 안 되는 선지 지우기, AP 후 선지 간격을 보면서 본격적인 계산에 들어가도 되는지 등)" — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"1) 추석동안 산/염기부터 전기화학까지 다 풀었다. 일부러 제일 힘든 부분을 골라 풀었는데 실전 문제들인지라 양도 많고 난이도도 눈물나게 어려웠다. 그래도 지난주처럼 무조건 끝낸다는 각오로 마무리했고, 산/염기~침전평형 파트는 2000제도 다시 보았다. 2) 하루 3문제씩 기체 문제들을 풀었는데 부담도 안되고 좋았다. 기체 끝나면 이런 방식으로 전기화학 단원 복습을 조금씩 해보자" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"이번 주 일반화학 공부의 전반적인 목표는 문제를 최대한 빠르고 정확하게 푸는 연습을 하는 것이었다. 이틀에 한 번 꼴로 여러 재배치 모의고사들을 집중력이 조금 떨어진 늦은 저녁 시간대 혹은 집중력이 많이 남아있을 점심쯤에 모두 풀어보면서 다양한 컨디션에서도 일관되고 빠르고 정확하게 푸는 연습을 했다. 그 결과 오늘 봤던 일반화학 모의고사에서도 시간이 그렇게 부족하진 않았던 것 같다. @@질문: 이번주 부로 적중 2000제 4회독이 끝났습니다 선생님. 이번 회독을 하면서 느낀 점인데, 기출 올인원으로 어려운 문제도 푸는 동시에, 전범위로 빠르게 기본적인 문제들을 풀어주면서 기본기 감을 잃지 않는 것이 꽤 효과적인 것 같다고 느꼈습니다. 남은 10월에도 하루에 2시간 기출올인원(난이도 있는 문제) & 나머지 2시간 적중2000제(전범위를 단원 순서대로) 로 학습하는 방식을 유지해도 괜찮을까요?" — 쿠리만쥰 (26학년도 5관왕 | 단국(약)·계명(제약)·삼육(약)·강원(약)·우석(약) 합격생)`,
    `"기출 문제를 풀고 해설 강의를 듣는 루틴을 진행함. 2000제 복습도 진행했음." — 레고링 (26학년도 계명(제약) 합격생)`,
    `"틀린 문제 위주로 강의를 수강하여서 시간을 많이 절약하였다. 기본적인 문제들을 복습하기 위해 2000제 문제를 선별 중에 있다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
    `"이번 모의고사를 치면서 계획한대로 풀어봤다. 먼저 생각한 전략단원부터 풀어주고, 그 뒤에 애매한 단원들을 풀어주는 식으로 풀어서 나름 성공적이었다고 생각한다. 다만 틀리면 안되는 문제에서 틀리는게 좀 있어서 아쉬웠다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"연습용 모의고사를 풀며 시험장에서의 일반화학 풀이 전략을 세워보았다. APS를 떠올린 후 한 번에 정확히 풀고자 노력했다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"기출올인원 경희대, 단국대를 풀었습니다. 전범위 푸는 것에 익숙해지려고 노력하고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"쉬운 문제는 바로 풀이 과정이 떠오르도록 기본 문제 푸는 시간을 많이 가졌다. 한단원씩 코드1~3 거의 100문제 정도 한번에 집중 공략하니 풀이의 원리가 보이고 점점 자신감이 쌓여 간다. 타임어택 모의고사를 대비해 연습 모의고사를 풀며 실전에 해야할 행동을 정하려고 하였다. 총 2회를 풀었는데 처음에는 15개 맞았는데 두번째 회차에서는 21개를 맞았다. 이 두 회차의 차이는 ‘보자마자 풀이 과정 안떠오르면 일단 넘어가자, 중간에 막히면 붙잡지 말고 넘어가자’ 라는 행동강령이다. 자신 있는 쉬운 문제들은 빠르게 풀어서 맞추고 조금이라도 헷갈리는 문제들은 어차피 못맞춘다는 마인드로 풀었다. 이렇게 하니 뒷부분에 있는 쉬운 문제도 풀어서 촉박한 시간 안에 전보다 많은 문제를 풀 수 있었다. 이번 타임어택 모의고사에도 이 행동을 그대로 해서 21개를 맞출 수 있었다. 그리고 시험 보기전에 실수 노트를 읽으면서 자주 헷갈리는 부분을 점검하고 시험을 보았다. 이걸 보고 1문제는 더 맞을 수 있던 것 같다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"2000제로 복습하고 기출올인원으로 진도를 나가면서 암기하지 못했던 개념들을 외웠다. 모의고사에서 비전략단원과 복잡한 문제를 과감하게 버리는 연습을 했고, 시간 내에 푼 문제는 실수 없이 모두 맞췄다. 많이 틀리긴 했지만, 고질적인 실수들이 어느정도 잡혔다는 것이 성과였던 것 같다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"제게 강점이 있는 문제들을 더 빠르게 풀 수 있는 방법을 고안해서 완전한 필살기 문제로 만들도록 공부했습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
    `"상담 후 아직 부족할 수 밖에 없다는걸 인정하고 더 열심히 빠르게 할걸 해야겠다고 생각했다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`
    ],
    유기:[
    `"다음주 범위까지의 예제 문제와 테스트 문제를 모두 정리하고 요약본 완성까지 마쳤다. 특히 fischer 투영도가 이해가 너무도 안갔었는데 이를 오랜시간을 투자해서 이해하는데 성공했다." — Akdow (26학년도 단국(약) 합격생)`,
    `"학교 유기화학2 시험범위 공부를 꾸준히 하며 유기화학을 놓지 않은 점" — Hcsg (26학년도 원광(약) 합격생)`,
    `"물성과 산도 파트 문제 복습을 하며 피드백대로 왜 틀렸는지 오답할 때 적어두고 실수 같은 부분은 실수 노트에도 정리했다. 또, 의식적으로 이건 이래서 산도가 크지라고 생각하며 추가로 기출문제도 풀었는데, 평소보다 소요시간은 더 걸렸어도 더 효율적으로 개념을 정리할 수 있었던 것 같다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
    `"부족했다고 생각했던 단원의 이론을 복습하고 VF 문제도 다시 풀었음. 한 번 더 틀린 문제는 따로 정리함." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"본격적으로 앞으로 돌아가 빠르게 복습하기 시작했다. VF 유기 문제들 다시 풀어보고 복습했다. 추가적으로 진도에 맞춰 최진규쌤 단원별 30문제도 풀어보았다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"이번 주도 별 탈 없이 유기화학은 매일 계획한 분량만큼 학습을 했다. 기본적인 내용들도 여러 번 보다보니 자연스레 암기가 되는게 확실히 보인다. 지금 진행중인 스미스 회독이 다음주 쯤에는 끝날 것 같은데, 그러면 예제 말고도 단원별 문제도 더 풀어봐야겠다." — 쿠리만쥰 (26학년도 5관왕 | 단국(약)·계명(제약)·삼육(약)·강원(약)·우석(약) 합격생)`,
    `"기본서 읽고 단원별 예제 문제를 전부 풀어줌. 매일 2시간 이상 유기화학 공부에 시간을 투자하고 있음." — 레고링 (26학년도 계명(제약) 합격생)`,
    `"헷갈리는 물성들을 조금씩 정리하고 있다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
    `"복습하면서 7~9월 VF문제를 같이 풀어주었다. 옛날에 어려워서 남겨뒀던 문제들까지 해결되니 한껏 수월하다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"기본서와 예제를 중심으로 차근차근 공부했다. 자주 헷갈리는 부분들을 노트에 정리하며 완전히 내 것으로 만들고자 애썼다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"매일 TEST, 스미스 예제 복습하면서 핸드폰 메모장에 반응 이름과 핵심 내용을 한문장으로 정리하고 있고 외우고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"앞쪽 유기화학 개념 파트 복습을 끝내고, 반응 파트는 사전 상담 때 가이드 해주신 것을 따라 최진규T의 매핑 강의를 수강하며 VF 문제를 복습해주었다. 산재되어 있던 반응들을 한번에 모아서 보니 눈에 잘 들어오고, 그 전에 잘 외워지지 않았던 반응들도 이번 기회에 모두 암기해주었다. 다음주부터는 최진규T의 기출 강의도 수강할 예정이다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"개념 2회독을 하고 문제를 더 풀어보면서 모호했던 개념들이 문제에 잘 적용되는 것이 느껴졌다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"약점이었던 파트를 다시 한번 돌아보며 보완했습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
    `"스미스 교재의 문제를 다시 풀며 복습하고 있는데 틀리는 문제 수가 훨씬 적어졌다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`
    ],
    생활관리:[
    `"추석연휴 때 휴식했던 것 치고는 빠르게 다시 루틴으로 돌아온 것 같다. 가족여행을 잠깐 다녀왔는데 충분히 휴식이 된 기분이었고, 저번주에 비해 훨씬 화학 공부가 잘 되는 기분이 들었다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생) [9w8]`,
    `"추석 연휴임에도 크게 다를 것 없이 큰 틀에서의 생활 규칙을 잘 지켰다." — Akdow (26학년도 단국(약) 합격생) [5w6]`,
    `"밀리지 않고 꾸준히 일반화학 2000제를 다 끝낼 수 있겠다는 자신감을 얻게 되었다. 또한 2000제의 문제를 푸는데 필요한 배경지식이 결코 얕지 않고 중요하다는 사실을 오늘 깨달았다." — Hcsg (26학년도 원광(약) 합격생) [5w6]`,
    `"연휴 기간에 평소보다 잠도 더 자고 휴식시간도 조금 더 길게 가지며 의식적으로 충전하려고 노력했다. 결국 평소보다 공부시간이나 양은 조금 적었지만 매일 최소한의 공부 시간은 지키며 루틴은 놓지 않으려고 노력했다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생) [1w9]`,
    `"1) 학교 다니면서 공부하는 것보다 공부할 수 있는 시간이 많아서 공부 루틴을 지켜나갈 수 있었음. 2) 수면 시간, 패턴 깨지지 않음." — 이번엔내차례 (26학년도 삼육(약) 합격생) [9w8]`,
    `"추석동안 하루 정도만 살짝 느슨하게 공부하고 최선을 다했다. 화학에 몰두하느라 연휴가 어떻게 지나갔는지도 모르겠다. 시험결과에 개의치 않고 남은 기간동안 최선을 다해보자" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생) [1w9]`,
    `"추석 연휴였지만 목요일 제외하곤 평소처럼 공부 루틴을 지켰다. 5w6 특성상 규칙적인 루틴이 지켜질 때 보람을 느끼고 앞으로도 더 열심히 할 수 있는 원동력을 얻으므로, 다음 주도 꾸준히 매일 할 일을 해나가야겠다." — 쿠리만쥰 (26학년도 5관왕 | 단국(약)·계명(제약)·삼육(약)·강원(약)·우석(약) 합격생) [5w6]`,
    `"∙ 추석에 잘 먹고 잘 쉬며 피로 회복했고 커피를 보리차로 대체했다. ∙ 고민이었던 화학 학습방향에 대해 선생님과 상담을 해서 불안감을 해소할 수 있었음." — 레고링 (26학년도 계명(제약) 합격생) [9w1]`,
    `"토요일, 일요일, 월요일에 친척들을 만났지만, 최소한의 공부 시간 확보를 위해 하루에 3시간 정도는 무조건 공부를 하였다. 이제 집으로 다시 돌아왔기 때문에 다시 계획했던 대로 공부를 이어나갈 예정이다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생) [8w7]`,
    `"이번주는 운동을 3번 갔다. 추석이라 시간이 많이 뺏기긴 했지만 간간히 공부할려고 노력했다. 저번주에 못쉰만큼 푹 쉬었다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생) [5w6]`,
    `"가족모임 등에 참석하다보니 공부 시간이 많이 부족했다. 그래도 일정이 있는 날을 아예 쉬어버리지 않고, 남는 시간에는 최대한 원래 루틴대로 공부하고자 노력했다. 계획한 진도를 소화하기에는 모자른 시간이었지만 연휴동안 공부 감각을 잃지는 않은 것 같아 그나마 다행이다." — 초록콩 (26학년도 순천(약) 합격생) [9w1]`,
    `"연휴동안에도 변화없이 꾸준히 공부하였습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생) [6w5]`,
    `"한 주의 초반에는 루틴이 무너졌지만 바로 잡기 위해 해결 방안을 모색했다. 가장 개선해야 할 점은 독서실 도착 시간을 일정하게 하는 것이었다. 그전까지는 강제성이 없어도 스스로 잘 해왔지만, 시간이 지나면서 마음이 조금 풀여저서 ‘좀만 더 쉬자’하고 타협해 버렸다. 그래서 친구에게 부탁해 정해진 시간에 독서실 도착 인증하기를 하기로 했다. 사실 이 인증을 하지 않는다고 해서 큰 문제가 생기는 것은 아니지만, 누군가에게 확인을 받는다고 생각하니 스스로에게 ‘약속을 지켜야 한다’는 긴장감이 생겼다. 덕분에 익숙해진 환경에서 다시금 적당한 긴장감을 느껴 집중할 수 있게 되었다. 그리고 수면의 질도 높여 깨어있는 동안의 집중력을 올리기 위해 자기 전에 핸드폰 보지 않기를 실천하였다. 평소에 자기 전에 가만히 누워있으면 잡생각이 많아져 쉽게 잠들지 못해서 핸드폰을 놓지 못했었다. 그 대신 생물 리뷰 녹음본을 틀어놓고 복습한 내용을 되새기며 잠드는 것을 시도했다. 잡생각이 안나니 마음이 한결 편해져서 잠도 잘들고 자면서도 공부한다는 느낌에 좋았다. 효과가 생각보다 너무 좋아서 진작에 했어야 했는데 하는 생각이 들었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생) [4w3]`,
    `"연휴여서 이래저래 마음이 떴지만, 잘 잡고 매일 공부를 해나갔다. 독서실을 바꾸니 집중도가 더 올라간 것이 좋았다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생) [9w8]`,
    `"오랜만에 가족들 그리고 친구들과 시간을 보내며 삶의 감사함과 행복을 느끼며 에너지를 충전한 것 같습니다." — 후회없이살자 (26학년도 강원(약) 합격생) [5w6]`,
    `"너무 불안해서 어떻게 해야될지 선생님께 상담을 요청했다. 그냥 받아들이고 노력해야됨을 알게되어서 마음은 편하다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생) [9w1]`
    ]
  },
  "10-3":{
    생물:[
    `"8월 ox와 기출n제, 중앙대 기출 모두 정해둔 계획을 지키며 복습했다. 써머리에 틀렸거나 헷갈리거나 몰랐던 부분은 샤프로 적어두고 있다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"목표로 했던 엠디트와 경희대 기출 문제를 마쳤고 양이 많아 정리만하고 미뤄뒀던 기출N제 1차 복습을 마쳤다. 원래 알던 내용에서 살짝 어색한 내용이라 아직은 조금 더 자주봐야 익숙해질 것 같다." — Akdow (26학년도 단국(약) 합격생)`,
    `"조금 약했던 분생 파트 마지막 단원까지 mdp 문제를 선별해서 풀어주며 심화 복습을 했다. 줄글로 읽으니 계속 내용이 휘발되어서 간단한 도식, 그림으로 암기 후 mdp 문제 풀며 위 암기를 적용하는 연습도 병행했다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
    `"1) 시간이 부족해서 잠깐 시간 나면 퀴즐렛으로 개념 복습함. 2) 전체적인 흐름을 남에게 설명하듯이 말하면서 복습함." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"생물은 무난하게 잘 하고 있다. 문제를 풀며 잊어버린 부분들에 대해 관련 개념들을 다다시 떠올려보고, 조금이라도 흐릿한 부분이 있으면 찾아서 직접 그려보고 써보고 있다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"∙ 생리학 파트 내용들을 복습하며 써머리 OX, mdp 문제를 풀었음. 자신없던 발생학 파트는 다시 워크북 OX 문제를 풀며 통합이론 개념을 복습함." — 레고링 (26학년도 계명(제약) 합격생)`,
    `"인체생리학 단원을 하나씩 정리해나가고 있다. 인체생리학 단원을 메인으로 정리하였지만, 상대적으로 약한 파트인 분자생물학과 분류학도 정리해 둔 자료를 반복적으로 학습해나갔다. 생물 공부 시간을 늘렸지만, 화학 문제도 적지 않게 풀었다!" — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
    `"드디어 통합이론을 완강했다. 이제는 문제를 풀면서 부족한 부분을 통합이론을 통해 채워주는 식으로 공부계획을 잡았다. 그리고 통합이론을 복습할때도 모든 단원을 동등하게 비중을 잡기보단 내가 까먹었거나 중요한 단원들만 집중적으로 볼려고 계획했다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"단권화 노트를 정리하면서 꼼꼼히 복습하고 있다. 계획한대로 10월에 한 바퀴를 마무리지을 수 있을 것 같다. 아직은 구멍이 많아 꼼꼼히 보고 있지만 11월부터는 회독 속도를 대폭 올려서 빠르게 여러 번 볼 수 있도록 해야겠다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"중앙대 기출, 400제 위주로 복습하였습니다. 또한 서머리에 복습한 내용 간단하게 필기하면서 정리하고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"저번주에 이어서 생리학 나머지 단원 중 면역 뒷부분, 소화, 뉴런, 신경, 내분비 파트를 복습했다. 목차를 중심으로 전체적인 흐름을 파악한 후에 세부 사항을 암기하는 방식으로 공부했다. 개념 복습 후 MD문제와 그동안 풀었던 문제들을 다시 풀면서 점검해주었다. 저번주에 공부한 단원은 자기 전에 리뷰 녹음을 들으면서 놓친 부분이 없도록 보완했다. 생리학은 원래 좋아하지 않는 분야였지만 이번에 그래도 끝까지 붙잡고 했더니 이제는 자신감이 생겼다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"발생학을 끝내고 나니 너무 익숙한 내용들이 많이 나와 진도가 확 나가졌다. 계획했던 것보다 한참을 더 나가서 이번주 효율은 되게 좋았다. 금요일에 본 시험에서도 25문제 중 2개밖에 틀려서 놀랐다. 생리학 비슷한 문제를 작년에 많이 풀어봐서 그런것도 같다. 다음주도 이번주와 같은 효율이 나오길 바란다." — 약대가쟝 (26학년도 단국(약) 합격생)`,
    `"MDEET와 경희대 기출을 풀고 관련 개념을 꼼꼼하게 복습했다. 이 외에는 잘 한 점이 없다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"몰입감 있는 공부를 진행했다. 캠벨을 빠르게 읽으며 흐름을 파악하고 기출 문제를 보고 o,x로 내용을 보강했다. 또한 자세히는 아니지만 화요일과 금요일에 푼 문제를 해설을 보며 몰랐던 부분을 공부해보았다. 그렇게 공부해놨던 내용을 다시 보게 되니 더 많은게 보이게 되었다. 또한 스스로 설명하며 공부를 진행했더니 내가 어디 부분을 잘 알지 못했고 부족한지를 알 수 있어 그 부분을 다시 보고 채우는 형식으로 진행하였다." — 단퓨프 (26학년도 목포(약) 합격생)`,
    `"문제로 마주치기 가장 무서웠지만 자주 보이는 유형들에 대한 정복" — 후회없이살자 (26학년도 강원(약) 합격생)`,
    `"게속해서 지난 시험들을 복습하다보니 시험 결과도 나쁘지는 않은 것 같아서 다행이라고 생각했다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`
    ],
    화학:[
    `"* 10분씩 시간 재고 빠르게 풀고 표시해둔 문제만 빠르게 해설강의를 들으며 보충하였다." — 시계탑기린친구 (26학년도 강원(수) 합격생)`,
    `"기출 올인원을 풀기 전 2000제 기본 문제를 랜덤으로 20개 먼저 풀기 시작했다. 저번주 테스트에서 많이 틀린 단원은 시간을 재고 풀어보거나 그런 식으로 계속 보완해보려 했다. 오늘 원포인트 강의를 듣고 적용해서 연습 테스트를 풀어보고 앱을 깔아서 정리해보기 시작했다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"경성대와 계명대를 제외하고 지원 가능 대학까지의 풀이를 마쳤다. 매일 1시간씩 계속 정리본을 보고 있으며 다음주는 2일정도의 정리본 총 복습 후 수요일정도부터 경성대 계명대 내용을 시작할 예정이다." — Akdow (26학년도 단국(약) 합격생)`,
    `"암기, 실수 노트 보는 시간을 따로 정해서 보고, 문제를 풀 때 해당되는 것들은 바로바로 적용하려고 노력했다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
    `"1) 매일 30분씩 적중 2000제 코드 1,2 랜덤복습을 계속 진행 중임." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"기출올인원 기체 파트를 완결내었고, 이미 풀었던 ch.14~17 부분을 화학 공부 시작 2시간동안 반드시 복습하는 데에 사용하였다. 1회차 풀때에는 엄청 틀리고 갈피도 못 잡았는데, 틀린 문제들을 다시 풀어보니 어느정도 감도 생기고 AP가 세워진다. 일부러 양 많고 어려운 단원을 먼저 풀어냈더니 확실히 가면 갈수록 수월해지고 속도가 붙는다. 2주만에 제일 어려운 단원을 모두 풀고 복습까지 해내는 나를 셀프칭찬해주자" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"∙ 기출 문제를 풀고 강의 수강 후 부족한 파트는 2000제를 더 풀어주며 보충하는 공부를 함." — 레고링 (26학년도 계명(제약) 합격생)`,
    `"기출올인원을 교재 기준으로 풀고 있었는데, 전범위 내용을 푸는 것이 중요하다고 생각해서 충남, 단국, 동국 25학년도 복기문제 + 변형문제를 모두 풀었다. 이 과정에서 명명법을 총정리하였고, 시간이 날 때마다 명명법을 암기해줬다. 시간관리를 연습하기 위해 MD문제에서 일반화학 20문제를 40분으로 설정하고, 22~26학년도 문제를 풀었다. MD문제 특성상 계산이 많은 문제들도 있었는데, 이러한 문제들을 시험장에서 만났을 때를 대비하여서 시간 관리 연습을 하였다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
    `"화학에서 약점이라고 생각들던 전기화학이랑 이상기체, 그리고 미뤄놨던 1단원까지 모두 공부를 했다. 예전에는 모의고사에서 전기화학만 보면 쫄곤 했는데 이제는 자신감이 생겼다. 미뤄놨던 지엽정리도 시작했다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"분광학, 점군을 마지막으로 2000제 코드1,2,3까지 한 바퀴를 마쳤다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"중앙대, 원광대 기출을 풀었습니다. 지금까지는 2사이클 루틴으로 풀었고 원광대 기출은 민동준 선생님의 팁에 있던 3바퀴 시스템을 적용해보았습니다. 지금은 적어도 마지막 문제를 보지도 못하고 시간을 다 쓰는 경우는 없어졌습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"2000제 코드1~3까지 모두 수강하였고, 저번주와 마찬가지로 복습해주었다. 전에 대충 강의만 듣고 넘어갔던 이상기체 열화학을 다시 1500제와 2000제 강의를 듣고 보완해주었다. 그 당시에는 이해가 어려웠던 부분이었지만, 지금은 전범위를 어느 정도 이해한 상태라 훨씬 명확하게 받아들일 수 있었다. 2000제를 수강하면서 단원별로 헷갈리는 개념과 자주 실수하는 부분을 굿노트에 모아서 정리했었다. 그런데 잘 안들여다 보게 되고, 체계적으로 정리가 안되어 고민이었는데 실전 대비 노하우 특강을 통해 해결책을 찾았다. 딱 내가 하고 싶었던 정리 방법을 알려주셔서 바로 따라 만들었다. 다음 주부터 기출 올인원을 들으면서 약점 노트를 차곡차고 채워나가고 자투리 시간을 활용해서 반복 복슬할 계획이다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"10월 안에 2000제를 끝내겠다는 다짐을 하고 매일 꾸준히 강의를 들어 계획보다 많이 들었다. 산염기와 침전평형, 전기화학을 들으며 감탄을 금치 못했다. 이런 유연한 방식으로 문제를 접근했어야 했는데 이제서야 접한게 후회스럽다. 이제 배위화합물 ~ 분광학만 남아서 기출올인원도 최대한 많이 해야겠다." — 약대가쟝 (26학년도 단국(약) 합격생)`,
    `"2000제와 기출올인원을 병행하면서 틀리거나 헷갈린 문제는 그 이유를 문제 위에 분석하여 적어두었다. 1회독을 할 때는 문제를 잘못 읽거나 조건을 놓쳐서 틀리는 코드가 많았는데, 다회독을 하면서 현저히 줄어든 것이 보인다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"이번주는 저번주보다 속도감있게 진행했다. 혜지언니의 조언대로 진행한게 큰 도움이 되었다. 완강까지 몇 강이 안 남았다. 시간이 많이 지체된 것은 아쉽지만 그래도 열심히 노력한 걸 알기에 칭찬한다." — 단퓨프 (26학년도 목포(약) 합격생)`,
    `"문제를 풀면서 실수하게 되는 부분들을 다시 틀리지 않도록 실수 유형과 그 원인에 따라 정리해서 실수 노트를 만들었습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
    `"화학 2000제를 마지막 한 강 을 남기고 거의 끝을 냈다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`
    ],
    유기:[
    `"맵핑 강의를 이번주부터 듣기 시작했다. 확실히 정리하는 데 크게 도움이 되는 느낌이라 다음주부터 일주일에 3강씩 들으려 한다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"다시 한 번 정리본을 만들면서 1회독을 하고 정리본을 보며 다시 세부암기로 2회독 그리고 마지막으로 전에 봤던 테스트를 풀어보면서 3회독을 하며 많이 익숙해진 것 같다. 세부적이거나 추가적인 사안들만 잘 정리하면 크게 문제될 것 없을 것 같다." — Akdow (26학년도 단국(약) 합격생)`,
    `"루틴대로 꾸준히 2시간, 하루 20문제 이상 문풀을 했다. 또, 명명법과 반응도 자주 조금씩 보며 휘발되지 않도록 노력했다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
    `"1) 실전문제풀이 범위의 개념 복습 및 단원별 문제 풀이를 완료함. 2) 아침에 고정적인 시간을 정해두고 하는 과목이라서 단원별 문제풀이에 지장이 없었음." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"진규쌤과 VF 7,8월 분량을 복습하면서 이상하게 잘 안풀리고 틀리는 단원이 있었다. 원래대로는 ch.13 라디칼까지 복습하는게 목표였지만, 일단 진도나가길 멈추었다. 에폭사이드와 에터 제법과 반응을 다시 기본서부터 살펴보니 내가 제법과 고리열림 반응에 대해 완전히 오개념을 가진 것이 파악됐다. 일주일 진도를 채우지는 못했지만 그래도 놓쳤던 부분을 다시 채워넣어 다행이었다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"∙ 매일 두시간 이상 유기 기본서를 복습하고 덜 풀었던 단원별 문제를 다 풀어나가고 있음. 매커니즘 복습도 해주며 잊어버리지 않도록 해주고 있음." — 레고링 (26학년도 계명(제약) 합격생)`,
    `"알데하이드 케톤, 카보닐 알파 치환, 카보닐 축합 반응이 꽤 많이 숙지되어가고 있다. 맵핑으로 정리해 둔 자료를 이동하는 시간에 머리 속으로 떠올려보며 말로 연습하였다. 아침에 반응 백지복습을 통해 약점 파트를 확인할 수 있었다. 주간문제를 풀 때 실수를 하지 않았다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
    `"7월에 유기화학을 공부하면서 벽을 많이 느꼇던 Sn2, Sn1, E2, E1이 많이 수월해진것같아서 좋다. 그렇다고 여전히 쉽다고는 생각은 안들지만 예전보다는 한껏 수월해진것 같다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"기본서와 예제를 중심으로 차근차근 공부했다. 자주 헷갈리는 부분들을 노트에 정리하며 완전히 내 것으로 만들고자 애썼다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"저번주와 마찬가지로 매일 TEST, 스미스 예제 복습하면서 핸드폰 메모장에 정리한 내용 암기하는 식으로 공부하고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"매일 오전 2시간 반정도 유기 학습을 해주었다. 가장 좋아하는 과목으로 하루를 시작하니 전체 공부 집중력이 높아지고 하루 리듬이 안정적으로 유지되었다. 매핑 강의를 통해 반응물과 시약이 주어졌을 때 생성물을 예측하고, 반응물과 생성물이 주어졌을 때 필요한 시약을 도출하는 연습을 반복하면서 유기 반응에 더 익숙해졌다. 그리고 최진규T 기출 문제를 통해 문제 접근 방식과 전략에 대해 추가적으로 공부할 수 있었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"다른 과목을 공부하느라 입체화학은 복습을 못하고 시험을 봐서 그 부분에서 좀 틀렸는데 바로 다시 복습해서 이해했다. 나머지 단원들은 2번째로 보니 더 빠르게 볼 수 있어서 효능감을 느꼈다." — 약대가쟝 (26학년도 단국(약) 합격생)`,
    `"알코올 에터까지 복습하고 반응 지도를 그렸다. 1회독 때는 각 단원을 분절화 해서 외우기 바빴는데, 2회독부터 원리에 입각해서 여러 단원의 개념을 연결해가며 공부하니 훨씬 잘 외워지고 문제에도 잘 적용이 됐다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"유기화학도 공부 속도를 조금 내어보았다. 휘발되는 내용이 많지만 그래도 자주 보려고 노력했다. 반응을 계속 그리며 익숙하게 해보려했다." — 단퓨프 (26학년도 목포(약) 합격생)`,
    `"출제 빈도가 높은 유형의 문제들에 대해서 나올 수 있는 경우의 수를 최대한 모았습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
    `"입체화학이제일 헷갈리고 어려웠던 것들 중 하나였는데, 열심히 공부했고, 못보진 않았다고 생각이 드는 점수를 받아서 기쁘다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`
    ],
    생활관리:[
    `"취침 시간 빼고는 대략적인 규칙적인 생활루틴을 유지하고 있다.(7:30 기상,애니어그램 읽고 한줄 쓰기, 감사 한줄 ,오전오후 공부, 저녁식사 후 인터벌 러닝 후 저녁 공부) 안되면 어떡하지라는 생각이 들 때 의식적으로 어떻게 하면 더 잘할 수 있을지로 생각을 전환하였다." — 시계탑기린친구 (26학년도 강원(수) 합격생) [4w3]`,
    `"평일 루틴은 완벽했다. 저번주에 쉰 만큼 더 열심히 해야한다고 생각하며 계속 했다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생) [9w8]`,
    `"정신적으로 많이 지친 한주였어서 힘들때마다 푹쉬면서 체력 및 멘탈 관리를 했다." — Akdow (26학년도 단국(약) 합격생) [5w6]`,
    `"하루하루 해야할 것들에 최대한 집중하며 공부했던 것 같다. 컨디션도 의식해서 조절했다. 저녁에 몸이 피곤하면 아쉽지만 조금 일찍 마무리하고 다음 날 채우는 식으로 조절했다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생) [1w9]`,
    `"다시 운동을 시작하면서 공부에 더 집중이 잘 됨." — 이번엔내차례 (26학년도 삼육(약) 합격생) [9w8]`,
    `"그래도 하루 평균 순공부시간이 제일 길고 집중 잘되었던 한 주였다. 다음주도 이번 주처럼 자기 전까지도 공부를 놓치 않는 치열한 한주를 살아보자" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생) [1w9]`,
    `"∙ 시험기간이라 학교 도서관에 사람이 많아져서 다른 층으로 옮겨 새로운 환경에서 공부함. 자리를 바꿔주니 리프레쉬가 되고 스트레스가 덜했음." — 레고링 (26학년도 계명(제약) 합격생) [9w1]`,
    `"명절 연휴 이후에 공부 루틴을 완벽하게 회복하였다. 월~목요일에는 아침에 눈을 뜨자마자 독서실을 가기 전에 30분 동안 전 날 배운 내용을 복습하는 시간을 가졌다. 예전에는 눈을 뜨자마자 휴대폰을 확인하는 습관이 있었는데, 안 좋은 습관을 고쳐나가고 있다. 공부하는 시간 동안 컨디션을 좋게 유지할 수 있는 방법에 대해 많이 고민해봤고, 오전 10시~11시 쯤에 카페인 섭취를 하는 것이 가장 능률 향상에 좋았고, 이를 계속 적용해나가고 있다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생) [8w7]`,
    `"이번주도 운동을 3번 갔다. 매일 밤 12시 일찍 잠에 들어 7시간 수면을 유지했다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생) [5w6]`,
    `"시간이 얼마 남지 않은만큼 절실하게 열심히 공부했던 한 주 였다. 목표한 만큼의 진도를 소화하지는 못했지만, 전반적인 집중력과 학습효율은 나쁘지 않았다." — 초록콩 (26학년도 순천(약) 합격생) [9w1]`,
    `"이번주도 큰 문제 없이 루틴 지키면서 공부하였습니다. 실전 감각 올리는 시기라서 집중이 더 잘 되는 느낌입니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생) [6w5]`,
    `"이번주에는 드디어 원래 계획했던 루틴을 지키며 한 주를 보냈다. 하루를 유기 - 점심 - 생물 - 저녁(운동) - 화학 사이클로 안정적으로 유지하며 공부 리듬이 잡혔다. 수아랑 독서실 도착 인증하고, 열품타로 공부시간 공유한 것이 큰 도움이 되었다. 서로의 공부 시간을 실시간으로 확인하다 보니 자극을 받으며 집중력을 유지할 수 있었고, 잡생각이 들 때마다 열품타 시간을 채워야 한다는 생각으로 다시 집중할 수 있었다. 운동 루틴도 조금 수정했다. 원래 근력+유산소를 해주었는데 웨이트를 하다보니 쉽게 피로해지고 회복하는데 오래 걸리는 문제가 있었다. 아쉽지만 시험 전까지는 체력 유지 목적으로 인터벌 런닝을 하기로 했다. 확실히 피로는 덜 느끼면서 운동할 때 느끼던 희열은 느낄 수 있어서 공부에 방해가 되지 않았다. 그리고 저번주에 효과를 봤던 ‘자기 전 리뷰 녹음 복습’도 꾸준히 이어갔다. 녹음을 들으면 어느새 잠이 들어 있는데, 심리적으로도 안정되고 공부했던 것이 무의식적으로 정리되는 느낌이었다. 앞으로 수면 루틴으로 정착할 것이다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생) [4w3]`,
    `"이번주는 진짜 게으름 피우지 않고 무념무상으로 공부를 해서 그런지 평소의 2배 가까이를 해버렸다. 특히 생물은 인체생리학에 흥미가 있어서 너무 재밌는 공부였다. 벌써 3권의 끝이라 4권만 복습하면 갈피가 잡힐거 같다. 제발 시험장에서 다 생각이 날수 있길 바란다. 환절기라 기력이 좀 떨어지는거 같아 한약을 꾸준히 챙겨먹으니 플라시보 효과를 느낀다. 다음주부턴 더 추워지니 건강관리에 신경써야겠다." — 약대가쟝 (26학년도 단국(약) 합격생) [5w6]`,
    `"혜지언니와 도착 인증과 열품타로 공부 시간을 공유하였더니 공부 시간이 안정적으로 유지가 되었다. 아침에 일어나서 독서실 갈 떄도 시간이 엄청 단축되었다. 언니와의 약속을 지키려는데 좋은 동기가 된 것 같다. 이번주는 스스로 느끼기에 집중도가 높았던 것 같다. 또한 과목별 공부 시간도 균형있게 유지하려 노력했다." — 단퓨프 (26학년도 목포(약) 합격생) [1w2]`,
    `"불안감과 상실감 등을 느낀 주였지만 오히려 그런 부정적인 감정들을 이용해서 공부에 집중할 수 있었습니다." — 후회없이살자 (26학년도 강원(약) 합격생) [5w6]`,
    `"적절한 수면시간과 루틴으로 최대한 피로 없이 꾸준한 한 주를 보낸 것 같다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생) [9w1]`
    ]
  },
  "10-4":{
    생물:[
    `"공부하는데 속도가 붙었다. 선생님이 말씀해주신대로 심화내용은 깊게 보지 않고 문제와 정답 위주로 공부하고, 기출 문제를 중심으로 공부를 하니 이번주 회차 문제도 리뷰하고 원래 나가던 생리학 진도도 나갈 수 있었다. 또한 MD문제도 하루에 5문제 정도씩 풀어주었다. 일단 오래되고, 추론형이 아닌 문제부터 골라서 풀고 있다. 박선우 선생님의 MD책을 보고 있는데 MD문제 자체가 그림도 잘 나오고 해설에 개념 정리가 잘 되어있어서 다시 개념 정리하기에도 좋았다." — 단퓨프 (26학년도 목포(약) 합격생)`,
    `"이번주에 중앙대 기출 복습을 마무리하고 mdp 기출을 2012년도까지 풀었다. 생리학 실력이 10월 초 보다는 많이 나아진 것 같아서 방심하지 말고 더 자주 복습하고 반복해야겠다고 생각했다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"1주일동안 7월 OX, 8월 OX, 9월 중앙대 재배치 및 따로 풀었던 중앙대와 경희대 22~25년 기출문제 복습을 마쳤다. 매일 꾸준히 2시간 씩의 복습을 해서 익숙화 시켰으며 특히 추가로 문제를 풀면서 잘못알았던 개념을 수정한 사안과 자세히는 알지 못했던 개념들을 추가하는 과정을 거칠 수 있었다. 다음주부터는 기출 N제의 복습과 암기를 중점적으로 할 예정이다." — Akdow (26학년도 단국(약) 합격생)`,
    `"기말고사 공부를 하면서 비전파인더 생물 시험을 꾸준히 본 점." — Hcsg (26학년도 원광(약) 합격생)`,
    `"제공 문제들과 생리학 단원 5개를 빠르게 복습했다. 생리학은 도식화해서 셀프 티칭 방식으로 복습하니 효율이 더 좋았고, 엠디피 문제를 풀며 추가된 개념은 써머리에 단권화했다.또, 지난주 복습했던 분자생물학을 적중 문제로 해당 개념들을 한 번 더 복습할 수 있었다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
    `"1) 정해진 단원을 꼼꼼히 보기 보다 2회독을 목표로 보면서 전체적인 흐름과 핵심 암기를 우선으로 함. 2) 캠벨도 해당 범위의 개념을 다시 읽음. 그림, 키워드 위주로 복습함." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"그동안 MDP와 VF 문제들, N제를 풀며 해당 단원에 필기한 내용들이 하나로 뭉쳐지면서 내가 어디가 약점인지, 무엇을 반복적으로 놓쳐 왔는지가 보여 좋다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"∙ 기출, 예상 문제를 풀고 써머리에 단권화를 시작했음. 문제를 풀고 이론 복습을 해주며 진도를 나갔음" — 레고링 (26학년도 계명(제약) 합격생)`,
    `"인체생리학 단원을 복습하면서 단권화를 진행하였다. 단권화를 하는 과정에서 기본서를 읽다보니, 논리적으로 내용을 다시 한 번 볼 수 있었다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
    `"생물 복습을 할때, 문제 풀이를 기반으로 복습을 진행했다. 하면서 느낀 점은, 모든 부분을 동일한 중요도로 보는것이 아니라 많이 나오는 부분을 반복적으로 보게 되어 더욱 기억에 남아 좋았고, 특히 VF생리학문제가 도움이 많이 된것 같다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"계획한 일정과 범위에 맞게 오답노트 기반의 복습을 진행하고 있다. 이번주까지 해서 대략적인 단권화를 마무리하고, 다음주부터는 전범위 회독을 속도감 있게 진행할 수 있을 것 같다. MDEET(2012학년도) 지식형 위주로 한 회차를 풀었는데, 관련 이론들을 복습하며 공부하다 보니 한 회차 만으로도 꽤 많은 개념들을 재차 상기할 수 있어 유익했다. (왜인지 2012학년도가 가장 오래된 시험인줄로 착각.. 이번주에 2005학년도부터 다시 풀 예정)" — 초록콩 (26학년도 순천(약) 합격생)`,
    `"지난주와 마찬가지로 복습하면서 서머리에 정리하고 있습니다. 또한 MD기출도 바로바로 교재 찾아보면서 빠르게 풀어보고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"이번주에 생리학 마무리하려 했지만, VF 출제 범위에 맞춰 분자생물학 파트를 우선 복습했다. 그리고 감각계, 효과기 파트도 복습하며 기존에 풀었던 문제들도 다시 한번 점검하듯이 풀어줬다. 이번에 단권화 방식을 변경했다. 기존에는 문제를 풀며 추가할 개념을 써머리 책에 모아놓는 방식이었는데, 이렇게 하니까 개념이 많아져서 핵심을 파악하기 어려웠고, 무엇을 알고 모르는지 구분이 모호했다. 이를 개선하기 위해 화학 약점 노트로 사용하는 원노트를 활용해서 헷갈리는 개념만 단어 중심으로 정리했다. 또한 매일 전날 학습한 내용을 복습해주었는데 확실히 나만의 언어로 정리하니 빠르게 복습할 수 있었고, 모르는 포인트를 색깔로 표시해두어 한 단원을 다시 보는 시간이 크게 단축되었다. 이를 통해 본고사용으로 활용가능한 컴팩트한 단권화 자료가 만들 수 있었다. 이번주는 본래 좋아했던 분자생물학 파트를 하니 효율이 높았고, 유전학을 제외한 박선우 2권 전체를 복습할 수 있었다. 전공 심화 문제도 술술 풀려서 공부가 잘 되었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"MDEET 지식형, 자료해석형 문제들과 적중N제 문제들을 위주로 공부했다. 심화 문제들을 위주로 공부하다보니 기본기에 개념 공백이 생긴 것이 느껴져 중앙대 문제들을 다시 풀어보면서 이론을 보강했다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"생물도 부족하지만 화학 실력이 많이 부족한 것 같아서 이번주는 화학에 좀 더 많은 시간을 썼습니다. 그럼에도 지난 복습과 추가적인 공부를 어느정도 할 수 있었습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
    `"헷갈려하던 분자생물학과 식물 위주로 복습했다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`
    ],
    화학:[
    `"1500제를 끝냈다. 처음에 공부 방식을 헤맸던게 아쉬움이 남지만, 그래도 칭찬한다. 이번주는 속도감있게 진도를 나갔다. 전기화학과 배위화학을 어려운 단원이라 생각했었는데 이번에 공부할 때는 잘 따라간 것 같아 좋다." — 단퓨프 (26학년도 목포(약) 합격생)`,
    `"* 일요일에 본 모의고사 5문제 정도 오답할 게 남았지만 이정도면 계획을 대부분 달성하여 만족스럽다. * 원노트를 이용하여 약점노트를 만들기 시작하였다. 기존에 헷갈리던 내용을 써둔 노트가 있어 원노트의 경우에는 이미지, 문제 위주로 헷갈리는 개념을 메모해둘 생각이다." — 시계탑기린친구 (26학년도 강원(수) 합격생)`,
    `"전기화학 단원이 약점이라 생각해서 이번주 테스트 전에 16단원보다 먼저 풀었다. 이번주 내내 약점노트를 원노트에 계속 정리했다. 올인원의 문제당 시간을 재며 풀었고, 틀리거나 시간이 오래 걸린 문제는 해설강의를 듣고 더 쉬운 풀이 방법을 간단한 퀴즈 형식으로 쓰고 옆에 답이나 해설을 붙여두어 이동시간에도 간편하게 볼 수 있게 만들었다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"원래 이번주에 게획했던 경성대, 계명대를 나중에 하기로하고 기출올인원을 앞에서부터 모두 풀고 마지막에 경성대, 계명대를 보는것으로 계획을 수정했다. 충분히 시간이 남을 것 같아서 이런 결정을 했고 4시간 중 2시간 30분은 기출올인원 앞에서부터 정리하면서 풀기, 1시간은 2000제 앞에서부터 풀기, 30분은 전날 정리했던 것 복습으로 시간을 분배해서 학습중이다. 기출올이원을 앞에서부터 풀때 기존에 지원 대학 모의고사를 풀면서 풀려져있는 문제들은 문제를 보고 어떻게 풀어야 되겠다라는 방향성을 생각해보고 밑에 적어둔 풀이와 일치하면 그 이후의 계산과정을 훑듯이 보면서 넘어가고 있다." — Akdow (26학년도 단국(약) 합격생)`,
    `"처음 접하거나 하나도 모르겠는 문제는 없는 점. 실전 화학 모의고사에서 시간만 충분하다면(시간 단축만 잘 된다면) 지금 맞는 16~17개에서 기본적으로 5~6문제는 더 맞출수 있겠다는 자신감이 든 것." — Hcsg (26학년도 원광(약) 합격생)`,
    `"그동안 실수 노트와 약점 노트를 섞어서 작성해왔던 것 같아서, 특강을 듣고 실수와 약점을 분리해서 정리했다. 그러면서 자연스럽게 문제를 풀고 실수인지, 몰랐다면 어떤 부분이 아직 부족한지 더 의식하며 일반화학 공부를 진행할 수 있었다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
    `"1) 적중 2000제 완강함. 2) 피드백을 받고 랜덤 복습 범위를 코드 3로 넓힘. 3) 모의고사를 통해 3 사이클 연습 + 약점 노트를 작성함. 이후 각 학교별 전략 노트도 작성하면 좋을 것 같음." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"지난주 계획 세울 때 기출올인원을 일주일동안 다 풀 수 있을까 싶었지만, 반드시 끝낸다는 각오로 포기하지 않고 다 풀어냈다. 그리고 멘토님 코칭이 정말 도움되었다. 항상 전단원 시험을 볼 때마다 단원별 세부 내용들을 까먹어 불안했는데, 지금이라도 내가 틀린 문제, 스킬들, 자잘한 암기사항 등을 적어 틈나는 대로 전단원 복습하니, 무엇을 기억하고 주의해야 할지 체화되기 시작한다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"∙ 기출 문제를 풀고 부족하다고 생각하는 부분은 2000제 복습을 해주었음. 약점 노트 만들기를 시작해 매일 정리해주고 있음." — 레고링 (26학년도 계명(제약) 합격생)`,
    `"기출올인원 문제들을 통해 기본기가 흔들리지 않게 꾸준하게 복습하였다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
    `"기출문제를 풀면서 전범위를 골고루 풀어주다 보니 감을 잃지 않고 실력이 많이 오른듯한 느낌이 든다. 오늘 모의고사를 풀면서는 계획한 대로 시험이 시작했을때 나중에 풀 문제를 먼저 골라놓고 나머지 문제들을 20분안에 풀려고 해봤다. 근데 생각처럼 안된것 같긴 하다.." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"타임어택 모의고사에서 계획한 전략들을 실행해봤는데, 처음으로 모든 문제를 한 번씩 풀어볼만한 시간을 확보할 수 있었다. '배위화합물' 단원을 첫번째 전략 단원으로 설정했다. 비록 이번 모의고사에서는 해당 단원 문제가 아주 적어 의미가 없었지만 전략 단원의 수를 빠르게 늘릴 필요성을 느낄 수 있었다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"매일 한 회차씩 시간 재면서 기출 풀고 있고 전략을 적용시키려고 노력하고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"약점노트를 적극적으로 활용하며 문제 풀이 효율을 높였다. 기출올인원 커리를 시작해 중앙대25, 24학년도와 경희대25학년도 기출을 풀었다. 틀린 문제와 풀이 시간이 오래 걸렸던 문제는 약점노트에 문제와 해설과 함께 오답 포인트를 한 줄로 정리해두었다. 또한 2000제 숙련도가 아직 부족한 것 같아 화학 평형 관련 단원 먼저 헷갈렸던 문제를 선별해 약점 노트에 정리하는 것도 병행했다. 원노트의 접근성이 좋아서 이동 시간이나 짧은 휴식 시간에 틈틈이 복습할 수 있었다. 약점 노트를 잘 활용한 덕분인지 이번 모의고사에서 저번보다 2문제 더 맞춰서 선생님께서 가이드해주신 정답수보다 하나 더 맞을 수 있었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"원포인트 강의를 듣고 그동안 문제 위에 적어뒀던 실수코드들을 모아서 한 장으로 정리했다. 매일 이 노트를 읽고 화학공부를 시작하니 자잘한 실수들이 잡힌 게 느껴졌다. 또 이번 모의고사에서 시간이 많이 부족했는데, 3싸이클을 돌리면서 쉬운 문제부터 풀어나가니 맞출 수 있는 문제들은 다 맞췄던 것 같다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"각 챕터별로 가장 기본이되고 중요하다고 생각하는 문제와 시험 직전 풀어볼 활성화 문제들을 선별하고 정리했고 시험 전날 풀어보았습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
    `"2000제를 끝내고 충남대 강의를 들었다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`
    ],
    유기:[
    `"이번주 유기화학 공부는 여태 공부한 주들 중에서 가장 맘에 들었다. 처음 공부할 땐, 머릿속에 정리가 안되어서 어려움을 겪었는데 머릿속에 정리가 잘 안되어도 일단 모든 내용을 쭉 훑고 나서 강의도 듣고 복습하고, 문제를 풀고 또 다른 단원을 나가며 비슷한 부분이 있으면 떠올리고, 이러니 어느순간 머릿속에 쌓이는 것을 느낄 수 있었다. 특히, 문제를 풀며 정리가 많이 되었다. 앞으로도 처음엔 좀 어렵고 이해가 안된 것 같아도 여러번 그리고 복습하며 반복해봐야겠다. 또한 조급한 마음을 내려놓으니 더 공부가 잘 되었다." — 단퓨프 (26학년도 목포(약) 합격생)`,
    `"이번 주에 테스트 범위에 맞춰서 맵핑 강의를 수강한 뒤 기본서를 같이 복습했다. 유기화학도 원노트를 활용해서 자주 틀리는 부분이나 암기 사항을 정리하고 있다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"정리본 만들기와 암기 그리고 VF 테스트를 풀어보면서3번의 반복으로 암기 및 이해를 하려고 했다. 전에 공부했을 때는 정말 대충했구나라는게 느껴질 정도로 몰랐던 부분이 많이 발견되었는데 이제는 좀 이해했다라는 생각이 들었다." — Akdow (26학년도 단국(약) 합격생)`,
    `"학교 유기화학2 시험범위 공부를 꾸준히 하며 비전파인더 유기화학 문제를 꾸준히 푼 점" — Hcsg (26학년도 원광(약) 합격생)`,
    `"유기 역시 실수 노트와 약점 노트를 분리해서 작성해서 효율을 높였다. 또, 저번 주 입체화학 복습이 필요한 것 같아서, 하루에 5문제 정도로 나눠서 입체화학을 복습했다. 반응 단원에서도 기초가 되는 중요한 단원이라 주기적으로 약점 노트를 볼 예정이다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
    `"1) 매일 고정적인 시간에 유기 공부를 진행함. 2) 개념 복습 후 단원별 문제 풀이 그리고 다시 약사랑유기화학 강의안을 보면서 부족한 개념 보충하는 방식의 사이클로 공부함." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"오답노트와 실수노트를 유기에도 적용해보았다. 모르는 내용들을 주제별로 모아 한군데에 모아두니, 어디가 약점인지, 문제풀 때 무엇을 해야 실수를 줄이는지 더 명확해졌다. 그리고 반응들을 복습하며 출력한 맵핑 종이에 하나하나 그려보았더니, 누적복습 시에도 한눈에 보이고 복습 속도도 빨라 좋다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"∙ 같은 방법으로 유기화학을 복습중이다. 매일 2시간 이상 투자하고 있고 공부할수록 자신감이 쌓이는 공부를 하고 있는 것 같다." — 레고링 (26학년도 계명(제약) 합격생)`,
    `"아민까지 다시 한 번 정리를 하였고, 문제들을 통해 복습을 하였다. 유기2 명명법이 헷갈려서 명명법만 따로 정리를 했다. 유기1도 VF문제들을 통해 복습하였다. 이제 전체적인 복습까지 완료를 하였으니 앞으로는 유기화학을 2시간 동안 밀도있게 공부를 할 예정이다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
    `"전에 알코올과 에터도 너무 힘들어서 벌벌 떨었던 기억이 나는데, 지금 복습하면서 왜 그리 힘들어 했을까 싶기도 하다. 이렇게 쭉 복습해나가면 될것같다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"기본서와 예제를 중심으로 차근차근 공부했다. 자주 헷갈리는 부분들을 노트에 정리하며 완전히 내 것으로 만들고자 애썼다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"빠지는 날 없이 매일 유기화학 공부를 하고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"루틴대로 오전에 2시간 반정도 유기 학습을 해주었다. 알켄, 알카인, 유기금속 시약 반응을 매핑 강의를 통해 생성물과 시약을 예측하는 연습을 하며 반응 흐름을 정리해주었다. 이전 풀었던 문제들도 다시 풀어보며 반복적으로 실수하는 문제나 헷갈리는 문제를 약점노트를 작성했다. 이틀에 한번씩 공부하기 전에 약점 노트를 복습하는 시간을 따로 가졌고, 자주 봐서 익숙해진 덕분에 오래 걸리지는 않아서 30분정도 시간을 써서 복습했다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"1. 교재 복습 및 암기 2. 7~8월 VF문제 3. 10~12월 VF 문제 순으로 공부를 하고 있다. 개념이 공고히 잡혀가는 게 느껴진다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"오개념이 몇가지 있었는데 약사랑 유튜브 강의를 들으며 바로잡을 수 있었습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`
    ],
    생활관리:[
    `"월요일 하루를 써서 논문의 2/3를 완성했다. 논문이 어느정도 윤관이 잡히니 초조했던 마음이 좀 가라앉아 나머지 남은 날들에 집중해 공부할 수 있었다. 이번주는 집중해서 공부함을 스스로 느꼈다. 아직 논문을 완성 못한 것은 아쉽지만 앞으로 하루 정도 쓰면 완성할 수 있을 것 같다. 내일 중으로 완성하는 것이 목표다 혜지언니와의 인증과 열품타가 큰 도움이 되었다. 또한 과목에 할당된 시간을 거의 지키며 공부했다." — 단퓨프 (26학년도 목포(약) 합격생) [1w2]`,
    `"규칙적인 생활을 유지하였다. 취침시간을 당기려고 노력하여 12시 반으로 당겼다." — 시계탑기린친구 (26학년도 강원(수) 합격생) [4w3]`,
    `"포기하지 않고 해 나가야 한다고 다짐하며 매일 공부를 했다. 무엇이 부족한지에 대해 계속 질문하고 생각했다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생) [9w8]`,
    `"저번주보다 30분 일찍 취침을해서 체력적으로 많이 회복했다." — Akdow (26학년도 단국(약) 합격생) [5w6]`,
    `"중간고사 공부를 최선을 다해 부족하지 않게 하면서 비전파인더에서 매주 주는 모든 시험들은 밀리지 않고 다 봤다. 다행이다. 밀리지 않으니 계획에 큰 지장은 없다." — Hcsg (26학년도 원광(약) 합격생) [5w6]`,
    `"최근 한 달간 컨디션이 가장 좋은 주였다. 확실히 몸 상태가 좋으니 집중력도 좋아졌다고 느꼈기에, 이번 주 루틴대로 쭉 이어갈 생각이다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생) [1w9]`,
    `"일정한 수면 시간 유지 + 주 2회 운동으로 생활 패턴이 돌아옴." — 이번엔내차례 (26학년도 삼육(약) 합격생) [9w8]`,
    `"10월 내내 잘 달려왔고 셋째주도 아쉬움 없이 공부했다. 성적이 썩 맘에 들지 않을 때도 많지만 너무 상심하지 말고 지금처럼 계속 지치지 말고 즐겁게 공부하려 노력하자" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생) [1w9]`,
    `"∙ 매일 같은 시간에 도서관에 가서 공부한 것. 미리 커피를 마시거나 스트레칭을 해서 오후시간에 늘어지지 않고 집중도를 높여 생활했음." — 레고링 (26학년도 계명(제약) 합격생) [9w1]`,
    `"평일에 13시간 가까이 공부를 하였다. 유기화학이 거의 완성이 되고 있는 것 같아 기쁘다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생) [8w7]`,
    `"이번주도 운동을 3번 갔다. 매일 밤 12시 일찍 잠에 들어 7시간 수면을 유지했다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생) [5w6]`,
    `"짧게 짧게 휴식 하면서 페이스 유지하면서 잘 보낸 것 같습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생) [6w5]`,
    `"일정이 있던 주말을 제외하고 기상, 취침, 식사 시간을 고정적으로 유지하며 규칙적인 생활을 해주었다. 독서실 도착 인증을 한 이후로 학습 효율이 많이 올라 갔다. 잡생각 거의 없이 매일 10시간 이상 몰입하여 공부할 수 있었다. 메일 작더라도 성취감을 느끼다 보니 하루하루 더 활력 있어지고 삶의 질도 매우 올라갔다. 또한 저번주부터 변경한 운동 루틴이 오히려 공부하는데 도움이 되는 것 같다. 웨이트할 때는 몸이 무거워졌었는데, 인터벌 러닝으로 바꾼 후에는 다음 날 몸이 훨씬 가볍고 컨디션도 좋았다. 컨디션 좋지 않은 날에는 빠른 걸음으로 대체해 운동 강도를 유연하게 조절했다. 여기에 ‘자기 전 리뷰 녹음 복습’도 꾸준히 이어 나가며 수면 안정에도 신경 쓰며 학습 컨디션이 전반적으로 매우 올라갔다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생) [4w3]`,
    `"날씨가 좋아져서 다시 야외 런닝을 했더니 한 주 동안 컨디션이 좋았다. 큰 무리 없이 안정감 있는 한 주를 보냈던 것 같다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생) [9w8]`,
    `"불안해지고 예민해지기 시작하는 시점이라는 것을 스스로 느끼게 되어 의식적으로 더 여유롭고 친절하게 가족들과 친구들 그리고 저 자신을 대했습니다." — 후회없이살자 (26학년도 강원(약) 합격생) [5w6]`
    ]
  },
  "11-1":{
    생물:[
    `"적중 문제를 적당히 잘 리뷰하고, 정리한 점이 맘에 든다. 전에는 생물 문제를 풀고 리뷰를 하려해도 내용이 많게 느껴지고, 머리속에 정리되지 않는 느낌이었는데 점차 공부한 내용이 쌓이니 내가 몰랐던 개념을 추가하고, 조금씩 쌓이고 있다는 느낌이 들었다. 아직 많이 부족하지만, 그래도 오늘 모의고사를 풀 때, 이번주 적중 문제에 나온 문제 틀렸던 문제와 비슷한 문제를 맞출 수 있어서 좋았다. 진도도 나가고, md문제도 풀고, 박선우 쌤 써머리 O,X도 풀었다. md문제는 진도를 나가며 박선우쌤 써머리 책 내용에 나오는 문제들만 먼저 풀고 있다. 생물을 공부할 때 몰입감있게 공부하고 있다는 생각이 든다." — 단퓨프 (26학년도 목포(약) 합격생)`,
    `"지금까지 풀었던 기출 n제를 모두 복습하는 시간을 가졌다. 그때 정리했던 부분들은 다 기억하는 듯 했다. 이번주에 유독 암기가 어렵다고 느껴지는 세포호흡 부분은 약점노트에 정리했다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"목표로 했던 기출 N제 6회까지의 복습을 완료했고 기존에는 정리하는데 시간이 너무 오래걸렸는데 타이핑 정리로 바꾸면서 손의 피로도 덜하고 정리 시간도 빠르게 단축했다." — Akdow (26학년도 단국(약) 합격생)`,
    `"비전파인더 생물 시험을 꾸준히 보고 오답하고 있는 점." — Hcsg (26학년도 원광(약) 합격생)`,
    `"발생학을 포함한 생리학과 식생분진 단원 일부를 복습하고 엠디피 문제를 풀며 정리했다. 추가로 기출문제나 적중 문제를 풀며 문제 베이스로 전범위를 복습하려고 노력했다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
    `"피드백 받은대로 하루 피트5문제 풀이 후 해당 문제의 개념을 보충함. 또한 다른 분의 피드백 내용을 보고 심리적 부담이 덜 해서 계획을 잘 지킬 수 있었음" — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"N제 문제들을 풀며 스트레스 받았는데 과감히 버리고 MDP 문제들 다시 보기로 결단을 내렸다. 남은 기간 박선우 책 N회독하고 MDP+VF 복습으로 생물은 충분할 듯하다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"∙ 문제 풀며 부족한 개념들을 통합 이론 책을 다시 보며 복습하고 있음. ∙ 제공해주시는 문제를 통해 전범위 복습을 하고 mdp 문제를 풀며 단원별 공부도 병행함." — 레고링 (26학년도 계명(제약) 합격생)`,
    `"인체생리학 단권화를 마무리하였다. 세포생물학 파트를 다시 한 번 복습해줬다. 이번주에는 모의고사 대비를 위해 전체적인 내용을 보기 위해 노력하였다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
    `"문제풀이에 기반한 복습을 진행했다. 효과 너무 좋은것같다. 예전에 진도 나간다고 제대로 오답하지 못했던 부분들까지 오답을 하며 복습을 해주니 시간이 오래 걸리긴 했다만 성능은 확실한것같다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"MDEET 2회분(2005예비, 2005)을 지식형 위주로 풀어보았다. 관련 이론들을 복습할 수 있어서 유익했다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"이제는 공부할 때 전체적인 내용을 떠올리는것 보단 핵심 개념, 결론 위주로 암기하는것이 필요하다고 느꼈고 복습할때도 최대한 간소화해서 바로바로 떠올릴 수 있도록 암기하고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"이번주 최대 성과는 발생 파트를 나름 마스터 했다는 것이다. 잘 외워지지 않던 부분을 중심으로 약점 노트를 작성하며 정리한 것이 큰 도움이 되었다. 타이핑하면서 복습하니 집중력이 높아지고, 손의 움직임 덕분에 오히려 졸음이 사라져 학습 효율이 크게 올라갔다. 그리고 복잡한 일련의 과정을 행 단위로 구분해 정리하니 흐름이 한눈에 들어오고 암기 속도도 빨라졌다. 또한 지금까지 풀었던 역대 기출 문제들 중 헷갈리는 개념을 약점노트에 정리하고 암기했다. 10월달 동안 생리학에 집중하느라 전범위에 문제 풀이에 대한 감을 살짝 잃은 것 같아 역대 회차를 분석하면서 다시 감을 찾아 갔다. 이렇게 약점 노트를 활용하면서 실력이 점점 향상하고 있는 것을 체감했다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"면역학 부분이 외우기 까다로웠지만 그 뒤는 수월해서 인체생리학 전체를 마무리 지었다. 식생분진은 일단 예비군 갔다와서 빠르게 봐야겠다. 예비군 동안에 필기해놓은 2권 분자생물학 전체를 보고오는게 목표다." — 약대가쟝 (26학년도 단국(약) 합격생)`,
    `"MDEET와 적중N제 문제풀이를 계획대로 나갔고, OX 복습도 다시 시작했다. 이번주부터 한 장 복습지를 만들어서 하루 동안 잘 안 외워졌던 개념을 적고 자기 전과 다음 날 아침에 말하면서 외우는 루틴을 추가했다. 말하면서 외우니 확실히 잘 외워지는 것 같다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"전체적으로 잊혀지지 않게 복습을 해가며 공부하고 있지만 화학에 집중하다보니 생물이 상대적으로 휘발된 것을 느껴 더 휘발되면 다시 공부하는데 시간이 더 걸릴 듯 해서 잠시 멈춰두고 지난 복습들을 다시했습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
    `"정리가 안되던 발생과 순환기를 열심히 공부하고 정리했다. 약점노트를 생물에도 이용하니 복습하기도 편해서 만족스럽다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`
    ],
    화학:[
    `"2000제를 시작했는데 이번주 화학 공부는 마음에 들었다. 1500제에서 아쉬웠던 속도 부분을 보완했다. 그래서 코드1,2 파트를 속도감 있게 나가봤다. 문제를 풀며 헷갈렸던 부분이나 어려웠던 것은 별표를 치고 다음날 다시 한 번 풀며 공부를 시작했다. 아직 기본적인 문제들이지만, 그래도 다시 내용을 돌리니 푸는데 더 수월해지고, 해당 내용의 강의를 보기 전이나 보고 난 후에 다시 1500제의 목차를 보고 내용을 훓으니 뭔가 엄청 내용이 많게 느껴졌던 것이 압축되어 정리된다는 느낌을 받았다. 다시 한 번 회독의 중요성을 깨달은 순간이었다. 그리고 모의고사를 풀 때, 연습한대로 풀기, 3사이클로 풀기를 적용해봤는데 세사이클이 아닌 두사이클이 되었지만, 저번 시험들보다 더 나아진 모습을 볼 수 있었다. 시험 전에 적용할 점들을 생각하고 매주마다 시도해보자." — 단퓨프 (26학년도 목포(약) 합격생)`,
    `"* 이번주 모의고사 시작 전 목표를 세우고 시험 후에 피드백하였다. 얻어가는 것이 많은 유익한 모의고사였다. * 아직 한참 멀었지만 그래도 나름 화학 점수가 계속 오르고 있어서 뿌듯하다. * 전기화학이랑 열화학에서 안 외워지는 공식이 있어서 매일매일 화학 공부하기 전 15~20분 정도 공식을 직관적으로 외웠는지 암기하기 위해 손으로 써보는 것을 반복하여 암기하였다. 다음주에도 몇가지 안외워지는 공식을 골라내어 매일매일 조금씩 반복해야겠다." — 시계탑기린친구 (26학년도 강원(수) 합격생)`,
    `"이번주에 기출 올인원을 22단원과 경성, 계명을 제외하고 모두 풀었다. 약점노트를 계속 채우면서 이동시간에 계속 보는걸 습관들이려고 노력했다. 다음주부터는 2000제 코드 4,5와 경성과 계명을 풀면서 복습해야겠다.(22단원의 약대 전공학도 지금부터 공부하는게 좋을까요?)" — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"기존에 목표로 했던 13단원보다 더 나아가서 14단원까지 앞부분부터 채워나갔다. 매일 2시간 반 기출올인원 풀이, 1시간 2000제 풀이, 30분 기출올인원 정리본 복습을 통해 잊어버리지 않게 학습하고 있다." — Akdow (26학년도 단국(약) 합격생)`,
    `"일단 하루 평균 40문제씩 하는 것을 어느 정도는 완료한 점" — Hcsg (26학년도 원광(약) 합격생)`,
    `"전범위 문풀을 매일 진행했다. 덕분에 실전 연습을 충분히 할 수 있었고, 모의고사에서도 연습대로 풀 수 있었다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
    `"1) 피드백 받고 매일 하루 마무리할 때 점군과 분광학 부분을 15분동안 문제로 복습함. 이 또한 부담감이 덜해져서 계획을 잘 지킬 수 있었음. 2) 매일 50~60문제정도 코드 1~3까지의 문제를 랜덤으로 복습함. 3) 3사이클을 적용하여 문제를 풂. 계산이 좀 필요한 문제를 체크하고 2사이클~3사이클에서 풀이가 막힌 문제를 잘 풀어냄." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"기출올인원을 끝냈다. 그리고 지엽적인 19~21단원 개념까지 잘 정리해 외우려 노력하였다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"∙ 다시 기본기를 끌어올리기 위해 2000제를 풀며 부족한 부분을 찾아내어 정리함. ∙ 기출을 풀며 새로운 문제를 계속 접하면서 처음 보는 문제에 대한 두려움이 적어졌음." — 레고링 (26학년도 계명(제약) 합격생)`,
    `"모의고사를 대비하여서 정리해둔 지엽적인 내용들을 꾸준히 봤다. 기본기가 중요하기 때문에 기본적인 문제들도 꾸준하게 풀었다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
    `"모의고사를 풀기전에 전략을 세웠다. "페이지를 넘기며 나중에 풀 문제를 선별하고, 그렇게 유기화학페이지에 도달하면 유기먼저 끝낸 후, 나머지 문제를 20분안에 풀기." 괜찮게 된거같고, 생화유다 풀고나니 25분정도 남긴 했다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"중앙(2024), 경희(2024) 기출을 풀고 어려웠던 문제들은 약점 노트에 정리했다. 산염기 단원이 조금 헷갈려 2000제도 추가로 풀었지만 많이 풀지는 못했다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"지난주와 마찬가지로 시간재며 전략 적용해보고 있습니다. 기본적으로는 2사이클이 좀 더 맞는것 같고 시간이 남으면 3사이클로 풀고 있습니다. 열역학, 기체는 웬만하면 마지막에 푸는것이 효율이 좋은 것 같습니다. 또한 풀이법도 강의 내용대로 풀었는지 비교하고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"2000제에서 잘 풀리지 않았던 문제를 선별해 약점 노트에 정리해주었다. 이를 통해 취약한 부분의 문제들을 모아서 보니 헷갈리는 부분을 확실히 커버할 수 있었다. 조금 복잡한 추론 문제에 대해 두려움이 있었는데 이렇게 기본 문제들을 탄탄하게 해주니 추론 문제도 풀 수 있는 사고력이 생긴 것 같다. 25학년도 동국대 문제를 풀었을 때 다소 쉬운 난이도이긴 했지만, 앞부분에서 1문제 틀리고 뒷부분 추론은 다 맞아서 어느정도 실력이 성장하고 있음을 느꼈다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"시험보기 전날 강의를 듣기보단 전단원 1500제+2000제 필기내용위주로 복습을 했다. 헷갈린문제, 틀린문제 옆에 써놓은 개념정리를 보고 다시 감각이 살아나서 오늘 본 시험에서 30문항 중 1개 틀렸다. 본 시험 전에도 이런 시간을 보내면 좋을거 같다." — 약대가쟝 (26학년도 단국(약) 합격생)`,
    `"열화학 단원이 가장 어려웠는데, 기출올인원과 2000제를 연달아 풀면서 극복이 된 것 같다. 목표치 공부량을 채우지 못한 것은 아쉽지만, 약점단원에 대한 보강을 확실히 해낸 것 같다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"항상 시간이 오래 걸리는 유형의 문제들을 종류별로 많이 풀어보며 시간을 단축시켰고 그 와중에서도 시험칠 때 풀 순서를 정해뒀고 시험에서 적용해봤습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
    `"기출과 더불어 매일 하루 한시간반씩 2000제 전범위를 단원당 10~15문제씩 풀고있다. 한 단원씩 공부하면 계속 지난 단원을 까먹는것 같아서 실행해봤는데 꽤 기억에 잘 남는 것 같다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`
    ],
    유기:[
    `"알켄과 알카인, 산화환원파트를 공부했다. 전에는 스미스 내용을 읽는데 시간이 많이 걸렸는데 이제는 일단 빠르게 대강의 내용을 잡고 선생님의 강의를 보고 슬라이드를 보며 다시 내용을 구조화했다. 그리고 다음날 전에 배운 내용을 보면 더 내용이 간략하게 느껴졌다. 이제는 금요일마다 푸는 문제의 진도를 따라가진 못하지만, 그래도 배운 부분까지는 거의 다 맞춰서 좋았다." — 단퓨프 (26학년도 목포(약) 합격생)`,
    `"테스트 공부는 기본서를 중심으로 하는 것이 좋을 것 같아서 평일에는 기본서를 복습하고 시간이 남거나 주말에는 맵핑을 수강하는 걸로 계획을 변경했다. 오늘 테스트를 볼 때 유기에서 막힘은 없었다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"이전과 마찬가지로 3단계를 거쳐 암기하는데 성공했고 특히 정리본을 만들면서 전날 정리했던 내용을 15분정도 복습하는 시간을 가져 까먹지 않게 익숙화했다. 그에 따라 유기화학이 많이 친숙해졌다." — Akdow (26학년도 단국(약) 합격생)`,
    `"학교 유기화학2 공부를 꾸준히 하며 비전파인더 유기화학 문제를 꾸준히 풀고 오답한 점, 그리고 어느 정도 모르겠는 것은 없는 점." — Hcsg (26학년도 원광(약) 합격생)`,
    `"유기도 매일 꾸준히 진도에 맞춰 해당 단원들을 예제를 풀며 공부했다. 아직 실수도 계속 나오고 있기에 밥 먹는 시간을 이용해서 실수 노트를 의식적으로 보면서 교정하려고 노력했다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
    `"1) 매일 2시간 이상 유기화학을 공부함. 2) 금요일과 오늘 실전문제풀이를 통해 내가 취약한 부분을 알아냄. 많이 틀려서 내 자신이 실망스러웠지만 지금 틀린 게 다행이라는 생각으로 화학처럼 원노트를 작성함." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"축합반응까지 개념 복습도 잘 했고 9월 VF 문제들도 복습하며 점검도 잘 한 것 같다. 11월모의 시험 끝나고 바로 복습하여 부족한 내용들을 메꾸었다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"∙ 이제 루틴이 된 '기본서 읽고 문제풀이' 패턴을 잘 지켰음. ∙ 맵핑 강의를 통해 앞부분 내용도 복습함." — 레고링 (26학년도 계명(제약) 합격생)`,
    `"전범위 모의고사를 풀때 전략적으로 유기화학을 먼저 풀어 주었다. 한문제가 기억이 안나는 참사가 나긴 했는데 어찌저찌 잘 풀어내긴 했다.." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"기본서와 예제를 중심으로 차근차근 공부했다. 자주 헷갈리는 부분들을 노트에 정리하며 완전히 내 것으로 만들고자 애썼다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"알코올 부분 유튜브, 기본서 보면서 보완하였습니다. 예제, 연습문제를 풀 때 빠르고 정확하게 풀 수 있도록 노력하고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"7-8월에 풀었던 문제들과 현재 풀고 있는 실전 문제들 중 틀린 문제를 약점노트에 정리하였다. 이전에 놓쳤던 개념과 반응들을 다시 점검할 수 있었다. 매핑 강의를 통해 반응을 복습해주고, 약사랑 유기화학 강의 들으면서 정리했던 내용도 함께 복습하며 명명법, 물성, 메커니즘을 다시 익혀주었다. 유기 2 들어가면서 그 당시 머리에 잘 안들어왔던 반응들도 이번에 확실하게 암기해주었다. 덕분에 이번 모의고사에서 유기화학 문제는 모두 맞췄다. 앞으로도 감을 잃지 않기 위해 지금 루틴 유지하면서 복습을 꾸준히 해줘야 겠다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"양이 많았지만 했던거라 회독이 빨라졌다." — 약대가쟝 (26학년도 단국(약) 합격생)`,
    `"10월 제공 문제들을 복습하면서 유기1 단원들에선 어느정도 자신감이 붙었다. 까먹지 않도록 그려둔 반응 지도를 바탕으로 누적 복습해줘야겠다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"빠른 시간에 집중해서 복습을 전체적으로 한 것 같아서 만족합니다." — 후회없이살자 (26학년도 강원(약) 합격생)`
    ],
    생활관리:[
    `"규칙적인 생활을 유지하였다. 이번주에 생물 공부에 대한 고민을 하다가 자칫 부정적인 쪽으로 빠질수도 있었는데 그때마다 글로 고민을 기록해두면서 멘탈을 잡고 버틸 수 있었다! 기특하다!! 자기 전 명상도 꾸준히 해주었다." — 시계탑기린친구 (26학년도 강원(수) 합격생) [4w3]`,
    `"정신적으로 평온했고, 더 이상 성적이 안나온다거나 그런걸로 불안하거나 기분이 영향받지는 않는다. 새로운 영양제를 먹기 시작했는데 잘 맞는 것 같다. 평일에는 기계적으로 공부를 한다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생) [9w8]`,
    `"화학 문제를 40문제씩 하루에 매일 푸는 것을 무리 없이 완료했다. 일단 이렇게 하면 큰 무리 없이 12월 되기 전까지 화학 2000제 문제풀이를 대부분 완료할 수 있다." — Hcsg (26학년도 원광(약) 합격생) [5w6]`,
    `"루틴을 잘 지켰다. 컨디션이 전반적으로 좋았지만 생각하지 못한 곳들에서 구멍도 발견하고 이상하게 부족한 부분이 많이 보였던 한 주였다. 그렇지만 동시에 지금 채워갈 수 있어서 감사하다는 생각이 더 컸고, 더 좋은 방향과 행동으로 한 주를 마무리할 수 있었다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생) [1w9]`,
    `"규칙적인 생활패턴(수면 등)과 운동으로 공부 체력이 더 늘어난 것을 느낌." — 이번엔내차례 (26학년도 삼육(약) 합격생) [9w8]`,
    `"∙ 저번주에 선생님과 상담 후 다시 방향을 잡고 더 편안하고 긍정적인 마인드로 공부할 수 있었음. ∙ 앞으로 공부시간 확보를 위해 수영을 그만두기로 해서 이번주는 빠지지 않고 꾸준히 운동을 함." — 레고링 (26학년도 계명(제약) 합격생) [9w1]`,
    `"조금씩 지치기도 하였지만, 최소 공부 시간인 10시간을 매일 채울 수 있었다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생) [8w7]`,
    `"이번주에는 저번주에 들었던 불안한 마음이 많이 없어진듯 하다.. "올해 과연 합격할수 있을까"란 생각이 많이 들었는데 보장은 못하겠지만 끝까지 포기하지 않고 하면 합격할수있지 않을까… 같은 긍정적인 생각도 든다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생) [5w6]`,
    `"코감기가 심해 좋은 컨디션은 아니었지만 공부에는 영향이 가지 않게끔 잘 버텨냈다." — 초록콩 (26학년도 순천(약) 합격생) [9w1]`,
    `"아침 일찍일어나 자정에 들어오는게 당연해져 전혀 힘들지 않다. 매주 시험보는 성적도 어느정도 만족스럽게 나와 불안감도 많이 줄고 이번주에 있는 예비군일정을 부정적으로 바라볼게 아니라 복습과 휴식의 시간으로 여기려고 생각하니 기다려지기 시작했다." — 약대가쟝 (26학년도 단국(약) 합격생) [5w6]`,
    `"특별히 잘 한 점은 없지만, 매일 루틴하게 생활했다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생) [9w8]`,
    `"선생님의 조언대로 잠들고 일어나는 시간을 고정시키기 위해 노력했습니다. 일어나는 시간은 일정하게 맞출 수 있었으나 잠드는 시간은 조절 하기 힘들어서 아직 조절 중이지만 이번달 안으로는 정착할 수 있기를 기대합니다." — 후회없이살자 (26학년도 강원(약) 합격생) [5w6]`,
    `"전과목을 매일 균형있게 공부하려고 노력했고, 컨디션 관리도 잘 한 것 같다. 시험볼 때 목표한 것과 비슷하게 볼 수 있었던 것 같다. 아직 어떤게 오래 걸리고 어떤게 금방 풀릴 주제인지 보는 능력은 좀 부족한것 같아서 더 연습을 해야겠다. 원래 계속 말리던 계산문제들을 최대한 침착하게 한번에 풀려고 다짐하고 봐서, 실수한 것 하나 빼고는 다 맞은 것 같다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생) [9w1]`
    ]
  },
  "11-2":{
    생물:[
    `"물질대사, 식생분진까지 추가해서 심화 복습했고, 엠디피 생리학, 기출, 적중 문제들을 풀면서 틀린 단원들의 이론을 보충했다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
    `"문제를 풀며 해당 부분을 다시 보게 되니 전체 단원에 대한 윤곽이 잡히고, 중요한 부분이 무엇인지 습득하게 되는 것 같다. 다시 돌아가보면 대략적인 내용을 알고 암기한 부분은 많이 잊었다는 것을 느꼈다. 다시 볼 떄는 꼭 암기해야하는 부분을 다시 눈에 담고 표시해두었다." — 단퓨프 (26학년도 목포(약) 합격생)`,
    `"기출 n제에서 몰랐거나 헷갈린 부분을 짚고 복습하며 mdp랑 써머리도 풀다보니 시간이 금방 지나간다. 이번주는 공부하면서 연관된 주제가 떠오르면 돌아가서 같이 복습해보려고 노력했다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"중앙대 재배치 모의고사 및 중앙대, 경희대 22~25년도 복습을 마쳤다. 다음주부터는 7,8월 ox를 하루에 일정회차를 추가 복습할 예정이며 엠디트 마무리 후 추가 문제풀이로 심플 객관식을 풀 예정이다." — Akdow (26학년도 단국(약) 합격생)`,
    `"비전파인더 생물 시험을 꾸준히 보고 오답하고 있는 점." — Hcsg (26학년도 원광(약) 합격생)`,
    `"1) 월~목까지피트 7문제 풀이 후, 관련 단원의 복습을 완료했다. 2) 전체 계획의 큰 틀을 점검하고, VF 문제 복습과 기본서 복습을 병행했다. 3) 이번 모의고사는 나의 약점이 대부분 드러난 시험이었다. 오답 풀이 + 문제의 원인과 해결 방안을 체계적으로 정리했다." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"그동안 책을 읽고 친구와 질문 답변하는 형식으로 공부했는데, 더 완벽하게 외우고 싶어 백지상태에서 직접 그려보았다. 이 방식이 훨씬 디테일한 암기를 요구하는 것 같아 좋다. MD 문제도 오랜만에 다시 푸니 더 정확하게 풀어낼 수 있었다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"∙ 이론 내용을 공부하고 말로 설명하면서 복습하는 방법을 시도해 봄. 내용 복습이 빠르게 되고 아는 것과 헷갈리는 내용이 명확하게 구분 되었음. 내용이 이해가 되고 외워진다는 것을 느낄 수 있었고 모의고사에서도 이번주에 이렇게 공부한 내용의 문제는 자신있게 풀 수 있었음. 다음 주에도 같은 방식으로 학습하며 확인해 보려 함." — 레고링 (26학년도 계명(제약) 합격생)`,
    `"전 범위 위주로 학습을 꾸준히 하였다. 생화학 관련 대사 파트들을 내가 알아보기 쉽게 노트에 정리했는데, 정리하는 과정에서 이렇게 나오면 시험에 대처할 수 있을까?를 생각하면서 조금 더 능동적으로 학습을 해나간게 뿌듯하다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
    `"저번모고에서 틀렸던, 제일 싫어하는 식물파트 복습을 제대로 해주었다. 그덕에 예전엔 진짜 싫었는데 자신감이 많이 생겼다. MDP문제 풀어주기 시작했다. 이번 모의고사에서 정답률 70퍼 이상되는 문제는 안틀려서 다행이다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"MDEET 1회분(2006)을 풀고 관련 이론을 복습했다. 생태, 분류까지 해서 써머리 단권화를 마쳤다. 앞으로 푸는 문제들의 오답들로 계속 채워나갈 예정이다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"매일 복습, md 기출 풀때 5문제씩 시간을 재면서 시험보는 느낌으로 풀어보고 있습니다. 서머리ox 회독하였고 다시 처음부터 복습하겠습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"분자생물학 부분 MD 문제를 풀며 개념 점검을 하고, 헷갈리는 부분은 약점 노트에 정리하였다. 추가로 7,8월 VF 문제도 복습하며 기본기를 다시 점검해주었다. 잘 가지 않던 생명공학과 실험 기법 파트도 정리하면서 확실히 암기하였다. 저번주에 이어 약점 노트에 타이핑하면서 정리해주니 상대적으로 하기 싫었던 부분도 이번에는 제대로 숙지할 수 있었다. 약점 노트가 점점 채워지면서 이전에 정리한 내용이 희미해지는 느낌이 들어, 일주일에 하루는 약점 노트를 전체 복습하는 시간을 가졌다. 예전에는 하루에 전범위를 보는 것은 상상도 못했는데 약점 노트에 취약 파트만 모아서 정리한 것을 봐주니 가능했다. 이제는 전범위에 대해 어느정도 전반적인 내용이 자리 잡고 있다고 느껴지고, 제대로 공부를 시작한 6월에 비해 엄청난 성장을 했다고 생각한다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"적중 N제와 MDEET를 계획까지 풀었고, 7,8월 OX 문제들을 복습하면서 기본기를 계속 챙겨줬다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"C그룹 대학 편입 시험을 위한 준비가 부족하다는 생각으로 마음이 불안했기에 어느정도 보충을 할 수 있었습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
    `"복습을 하루에 한단원씩 딱딱 하고싶은데 기본기 외의 것들도 챙기려다보니 시간이 좀 걸리지만 11월, 10월, 9월차 시험 복습과 내용정리를 열심히 했다. MDP 문제도 시작해서 조금씩 하고 있다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`
    ],
    화학:[
    `"전범위 문풀을 주로 하면서 노트를 의식적으로 보는 시간을 가지고, 실수나 약점 노트에서 봤던 것들을 전범위 문풀 시 매번 적용하려고 연습했다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
    `"강의를 1.3배속 정도로 들으니 그냥 흘러가는 느낌이 줄어들고 집중해서 강의를 들을 수 있었다. 상전이와 총괄성 파트는 1500제에서 어려워했던 파트였는데 기본 문제를 계속 풀다보니 두려워했던 마음이 사라졌다. 모의고사를 보면 아직 응용 문제는 풀지 못하지만, 2000제 진도를 나간 기본 문제들은 맞출 수 있었다. 전에 모의고사를 보면 눈앞이 깜깜했는데 그래도 이제는 풀어볼 문제를 구분하고 도전해 풀 수 있다는 점이 발전한 부분 같다." — 단퓨프 (26학년도 목포(약) 합격생)`,
    `"항상 고민이었던 열화학 파트를 약점 보완해주었다. 공식 암기도 꾸준히 해주었다." — 시계탑기린친구 (26학년도 강원(수) 합격생)`,
    `"기출 올인원의 계명, 경성 문제들도 모두 풀면서 처음부터 18단원까지 다시 복습했다. 틀렸거나 푸는 데 오래 걸린 문제들, 중요하다고 표시된 문제들도 다시 풀면서 전체적으로 한바퀴를 복습했다. 동시에 해당 단원 약점노트도 복습했다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"목표로 했던 기출올인원 분광학까지의 문제풀이를 마쳤다. 다음주부터는 경성대, 계명대 전공화학 부분을 학습할 예정이며 2000제는 11월달안에 1회독을 한번 더 한다는 느낌으로 하루에 1시간씩 풀어볼 예정이다." — Akdow (26학년도 단국(약) 합격생)`,
    `"홍쌤의 조언대로 평일 월,화,수 하루 30여 문제씩 풀고 오답까지 했고[실험 때문에 정신없는 목요일과 금요일 제외] 나머지 110문제를 어제와 오늘 사이에 나눠서 다 풀었다. 평일에 조금씩 나눠서 하고 주말에 몰아서 하는 것이 확실히 평일 시간을 절약하여 압박을 덜 받아서 훨씬 나은 것 같다." — Hcsg (26학년도 원광(약) 합격생)`,
    `"1) 적중 2000제 복습: 코드1~3 중심으로 매일 40~70문제를 풀이했다. 점점 기계적인 풀이를 하는 느낌이 든다. 2) 기출올인원 학습: 2025 주력학교 기출을 공부했다. 기출로 전범위를 보고 싶어서 추가적으로 단원별 10문제씩 더 풀이했다. 10문제는 좀 많은 것 같아 주력 학교 3 + 단원별 5문제로 계획을 수정해야겠다." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"모의고사 연습과 2000제 문제를 균형있게 학습한 한 주였다. 25학년도 기출올인원 문제들을 풀 시간과 능력이 안되어 '많이 못 풀어도 괜찮을까' 약간의 걱정이 있었는데, 시험을 보니 전년도까지의 문제들만이라도 충분히 풀 실력이 되면 최근 기출문제도 무리없이 풀어낼 수 있음을 깨달았다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"∙ 기출을 풀고 강의를 들으며 부족한 부분을 채웠음. 2000제를 단원별로 다시 풀며 약점을 발견하면 강의를 통해 빠르게 보완했음." — 레고링 (26학년도 계명(제약) 합격생)`,
    `"기본기 문제를 아침에 일어나자마자 풀어줬고, 이제 기계적으로 문제가 풀린다. 또한 지엽적인 내용들도 꾸준하게 보고 있다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
    `"이번주는 화학공부를 적당히 했다. 확실히 꾸준히 문제를 풀면서 감을 잃지 않는것이 중요하다고 느꼇다. 이상기체 열역학 문제를 많이 풀어주면서 문제풀이가 자연스럽게 된것도 괜찮은것같다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"연세(2024), 고려(2024), 중앙(2025) 기출을 풀고 어려웠던 문제들은 약점 노트에 정리했다. 전기화학이 조금 어려워서 2000제와 1500제 문제로 보충했다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"화학 공부 시작할때 2000제 빠르게 훓어보는 식으로 복습하고 있습니다. 그리고 회차별로 시간 재면서 풀면서 전략 연습하고 있습니다. 단원별로 정리된 올인원 책으로 부족하다고 느끼는 단원 쭉 풀면서 보완하고 있습니다. 이번주는 유효숫자, 기체, 반응속도 단원 풀었습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"그동안 약점 노트에 정리한 문제들을 전체를 풀어주며 기본기도 놓지지 않으려 복습해주었다. 처음엔 헷갈리거나 틀렸던 문제들이 이번에는 훨씬 수월하게 풀리면서 실력이 실력이 많이 성장하고 있음을 느꼈다. 이번주의 성장 포인트는 전에 혼동했던 개념들을 이제는 더이상 헷갈리지 않게 되었다는 것이다. 전보다 화학 문제를 풀 때 자신감이 많이 생겼다. 모의고사 대비를 위해 타임어택 연습으로 한 달 전 풀었던 연습 모의고사를 다시 풀어본 결과, 당시에는 30문제 중 12문제를 맞았지만 이번에는 28문제를 맞추었다. 역대 모의고사 푼 것 중에 가장 높은 점수였다. 내가 공부하고 있는 방식이 잘 하고 있다는 것을 검증받은 것 같아 너무 좋았다. 그리고 이번 전과목 모의고사에서도 화학에서 2문제만 틀려 저번주보다 3문제 더 맞았다. 앞으로도 이 흐름이 이어질 수 있도록 루틴 무너지지 않게 유지해야 겠다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"모르거나 잘 안 풀리는 문제를 바로바로 넘기는 게 어느정도 몸에 익어서 시간내로 모든 문제를 다 볼 수 있었다. 2000제 회독을 계속 하다보니 AP가 몸에 잘 벤 것 같다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"화학에서도 마찬가지로 지엽적인 상식이 부족했던 것 같아서 원광대 기출 문제를 풀고 추가로 기본 감 유지를 위해서 중앙대 화학 시험 2회차를 풀었습니다 또한 2000제에서 어려웠거나 틀렸던 문제를 다시 풀어봤습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
    `"기출 문제풀이와 2000제를 열심히 했다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`
    ],
    유기:[
    `"유기도 매일 2시간 이상을 공부했다. 유기2반응만 적어놨던 노트가 있어서 일단 반응들을 상기시키고, 차례로 메커니즘까지 그리며 복습했다. 꾸준히 공부하다 보니 감이 조금씩 올라오는 것 같아서 계속 복습하며 감을 유지하고자 한다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
    `"이번주는 유기화학 공부가 고비였다. 문제를 푸는데 뒤죽박죽 섞여 이대로는 안되겠다는 생각이 들어 RX파트부터 쭉 반응만 마인드 맵앱에 정리했다. 카테고리와 중요 내용만 작성하고 ppt내용을 활용해 그림을 붙여넣는 형식으로 진행해 생각보다 오랜 시간이 걸리진 않았다. 이걸 작성하고 나니 밥 먹을 때 빠르게 보는 등 빠르게 반응의 중요 부분을 훑을 수 있어 잘했다는생각이 든다." — 단퓨프 (26학년도 목포(약) 합격생)`,
    `"이번주도 테스트 범위를 기본서로 복습하며 공부했다. 벤젠 반응 부분은 자신 있어서 여유롭게 공부했다. 테스트에서 좀 오답이 많았지만 약점 단원이 뭔지 명확해서 오히려 좋았다. 주말에 케톤 알데하이드 맵핑을 들어서 보충했다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"유기는 매일 전날 분량을 15분에서 30분정도 복습하고 시작하니 내용이 더 친숙하게 다가왔다. 3단계 다만 반응과 암기해야할 것들이 적지 않다보니 다음주 2회독 범위가 마무리 되면 매일 10월 범위 기준으로 3일에 2회차씩 복습 분량을 잡고 복습 및 암기할 예정이다." — Akdow (26학년도 단국(약) 합격생)`,
    `"이제까지 유기화학 시험범위에 맞춰 쪽지시험을 잘 준비했고, 그 범위안에서 모르는 것은 거의 없는 것을 확인하였다." — Hcsg (26학년도 원광(약) 합격생)`,
    `"1) 공부시간: 매일 2~2.5시간 정도로 공부했다. 2) 학습루틴: 기본서 요약 부분으로 복습 → 문제풀이 → 부족 이론 재복습으로 공부했다." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"한바퀴 돌리며 맵핑을 완성해 놓았더니, VF 시험 전 한눈에 보며 복습할 수 있어 좋았다. 매주 시험전 시간을 투자해 빠르게 반응들을 복습하고 시험에 임해야겠다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"∙ '기본서 공부-예제 풀이-부족한 부분 강의 내용으로 보충-단원별 문풀' 순으로 진행하며 매일 유기 공부를 꾸준히 했음. 반응을 보며 전제척으로 비슷하다는 느낌을 받았고 부족한 유기2 파트도 다시 공부하면 충분히 보완이 될 것 같음." — 레고링 (26학년도 계명(제약) 합격생)`,
    `"유기화학은 학습을 하면할수록 견고하게 되어가고 있는 것 같아서 뿌듯하다. 기본적인 내용들은 대부분 숙지가 되어 있는 것 같아 기본서를 통해 특이한 반응 시약들을 추가적으로 외워볼 생각입니다! (이번 시험에 나온 CBS시약과 같은 것들)" — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
    `"기본서와 예제를 중심으로 차근차근 공부했다. 자주 헷갈리는 부분들을 노트에 정리하며 완전히 내 것으로 만들고자 애썼다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"TEST, 스미스 복습하면서 개인적으로 부족하다고 느끼는 단원 스미스 연습문제 풀면서 보완하고 있습니다. 이번주는 방향족, 카보닐 단원 위주로 복습하였습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"이번주는 매핑 강의를 마무리하며 전체 유기 반응에 대해 복습을 해주었다. 생성물을 예측하는 것보다는 반응에 필요한 시약 조건을 특히 헷갈려해서 반응의 시약을 채우는 연습에 중점을 두었다. 덕분에 이번 모의고사도 유기화학 문제를 모두 정확히 풀어낼 수 있었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"유기1까지 반응지도를 만들어서 매일 한 단원씩 복습해주었다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"내용이 너무 헷갈리고 복잡하고 외울것이 많아서 정리하고 열심히 외웠다. 매커니즘도 열심히 그렸다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`
    ],
    생활관리:[
    `"규칙적으로 하던 대로 공부했다. 약간의 감정 기복이나 안좋은 생각이 올라올 때마다 글로 적어두고, 감사일기도 쓰니 잘하고 있는 것들이나 감사한 것들이 생각났다. 그러면 또 괜찮아져서 다시 집중할 수 있었다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생) [1w9]`,
    `"규칙적인 생활 유지+ 저녁에 더 집중하기 위해 저녁식사 후 운동 가는 것을 소홀히 하지 않음." — 시계탑기린친구 (26학년도 강원(수) 합격생) [4w3]`,
    `"그냥 평온했다. 계속 부족한걸 보충하는 데 바빴다. 영양제도 계속 챙겨먹고 공부가 끝나면 가벼운 운동을 했다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생) [9w8]`,
    `"이번주는 컨디션 관리를 잘해서 하루정도를 제외하고는 목표로 했던 학습시간을 채웠다." — Akdow (26학년도 단국(약) 합격생) [5w6]`,
    `"홍쌤의 조언대로 이번주 목표인 200문제 문제풀이 및 오답을 무리 없이 완료했다. 일단 이렇게 하면 큰 무리 없이 12월 되기 전까지 화학 2000제 문제풀이를 대부분 완료할 수 있다." — Hcsg (26학년도 원광(약) 합격생) [5w6]`,
    `"이번 주에는 과목 간의 밸런스가 잘 맞았고, 전체적인 공부 시간도 이전보다 조금 늘었다. 또한 기상 시각과 취침 시각이 일정했고, 수면 시간도 충분히 확보하여 컨디션이 안정적이었다." — 이번엔내차례 (26학년도 삼육(약) 합격생) [9w8]`,
    `"매일 일정히, 충분한 공부 시간 확보한 한 주였다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생) [1w9]`,
    `"∙ 운동을 안하는 대신 공부 시간을 그만큼 더 확보했음. ∙ 평소 오후시간에 집중력이 떨어졌었는데 이번 주는 몰입도 있게 공부했음." — 레고링 (26학년도 계명(제약) 합격생) [9w1]`,
    `"학습 장소를 집 + 스터디카페로 옮겼습니다. 아침에 일어나자마자 책상에 앉아서 화학 공부를 하고 나가는 루틴을 추가했는데, 시간을 낭비하지 않는 느낌이 들어서 이대로 이어나가면 될 것 같다고 생각하였습니다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생) [8w7]`,
    `"일찍자고 일찍 일어났다. 시험이 다가옴에따라 운동가는 횟수를 2회로 줄였다. 불안한 마음이 많이 사라져서 좋다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생) [5w6]`,
    `"이번주도 공부에 매진하면서 보냈습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생) [6w5]`,
    `"이번주는 몸상태가 매우 좋지 않았지만 그래도 마지막까지 버텨냈습니다." — 후회없이살자 (26학년도 강원(약) 합격생) [5w6]`
    ]
  },
  "11-3":{
    생물:[
    `"식생분진(식물, 진화)등 단원별 복습을 포함해서 문제를 풀며 전범위를 볼 수 있었다. 또, 문제를 풀며 왜 맞고 틀렸는지 이론을 상기시키며 근거를 생각해서 고르려고 했다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
    `"약점노트 정리와 오답 단권화, 기출 n제 복습은 계속 하고 있다. 지금까지 본 시험들로 어떤 부분이 부족하고 무엇은 확실히 암기해야 할 지는 감이 잡히고 있다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"기출N제 10회차까지와 전범위 모의고사 2회차 분량의 복습을 마쳤고 처음 보는 내용이 다수 있어 암기를 하는 동시에 패드에 다시 한번 적어보고 다음날은 적어둔 것을 30분에서 1시간정도 복습하는 것을 시작으로 생명공부를 했다. 이렇게 하니 기출N제의 내용이 많이 익숙해진 것 같다." — Akdow (26학년도 단국(약) 합격생)`,
    `"비전파인더 생물 시험을 꾸준히 보고 오답하고 있는 점." — Hcsg (26학년도 원광(약) 합격생)`,
    `"1) 매일 PEET 10문제씩 풀이 후 틀린 문제의 이론을 캠벨로 복습함. 부족한 이론은 핵심생물학으로 보충함." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"하루 한 단원씩 누적 복습을 하고 있고 작년에 어설프게 외웠던 약물들까지 추가해 공부했다. 양이 많아 버겁지만 여기가 마지노선이다 생각하고 열심히 외우고 있다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"∙ 공부한 것을 말로 설명하는 방식을 적용해서 복습을 진행함. 헷갈리던 내용이 많이 정리가 되었고 복습을 빠르게 할 수 있었음. ∙ 풀었던 문제와 기출을 다시 보며 써머리 책에 단권화를 하였음." — 레고링 (26학년도 계명(제약) 합격생)`,
    `"식생분진 암기가 귀찮았지만, 전체적으로 다시 한 번 암기를 진행하였다. 식생분진은 문제가 어렵게 나오는 단원은 아니기 때문에, 알면 맞춘다는 생각으로 공부를 하였고, 이렇게 생각을 하고 공부를 하니 좀 더 많이 동기부여가 되었다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
    `"2010 MD까지 풀었다. 확실히 추론문제 제끼니까 빨리 빨리 푸는것 같아서 속도가 난다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"MDEET 2회분(2007, 2008)을 풀고 관련 이론을 복습했다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"시간이 부족한만큼 최소한 풀어본 문제는 틀리지 말자는 생각으로 ox퀴즈, 중앙대 기출, 400제 완전히 암기하겠다는 느낌으로 복습하고 있습니다. 특히 정답률 높은데 틀린 문제들은 집중적으로 복습하고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"이번주는 식물, 분류 파트를 복습하며 약점 노트에 취약파트를 정리했다. 교재 순서를 그대로 따라가기보다 평소 헷갈렸던 부분, 자주 출제되는 부분을 우선적으로 다뤄 양을 늘려났다. 취약 파트를 먼저 공부하니까 잘 몰랐던 부분을 먼저 채웠다는 생각에 성취감이 올라갔다. VF 문제 리뷰와 병행하느라 일부 덜 중요한 부분은 못했지만 핵심 개념은 전반적으로 다 복습했다. 그리고 식물 호르몬 기능처럼 잘 기억나지 않는 개념은 ‘지배하려면 성장해야 해(지베렐린)’처럼 한 문장 암기법으로 단순화해 반복적으로 떠올렸다. 이렇게해도 안외워지는 부분은 MD문제 풀이 통해서 적용해가면서 암기해주려고 하였다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"복습하는 것보다 오답정리를 하면서 관련이론들을 더 암기할 수 있어서 좋았다. 그동안 오답이 밀려있어 이제서야 하게 됐는데 정확히 암기하진 못해도 문제에서 어떤걸 의도하고 묻고있는지 알수 있을정도는 된다." — 약대가쟝 (26학년도 단국(약) 합격생)`,
    `"MDEET 26학년도까지 다 풀었고, 매일 1시간씩 전 날에 했던 공부를 복습하면서 암기했다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"효과기 공부를 끝내고 다시 세포생물학 부분부터 공부를 하니 확실히 처음 내용을 볼 때 보다 눈에 들어오는 내용이 많았다. 시야가 확 넓어진 느낌이다. 또한 기출 문제를 풀며 지속적으로 나왔던 부분이 보이니 어디가 중요한 파트인지 자연스럽게 알게 되는 것 같아 좋았다. 아직 많은 문제들을 틀리지만, 이제는 확신을 가지고 풀 수 있는 문제들이 늘어났다. 특히, 최근 몇 주내에 공부한 부분이 나왔을 때 더 그런 것 같다. 아마도 자리잡은 공부법으로 안정감있게 공부한 것과 내용이 휘발되지 않은 영향이 큰 것이라 생각한다. 차분히 주어진 시간에 그날 배우는 내용에 집중하니 더 공부가 잘되는 것을 느꼈다." — 단퓨프 (26학년도 목포(약) 합격생)`,
    `"지난번 시험에서 생리학 파트에서 기본적인 내용들을 틀렸기 때문에 이번주는 생리학 파트를 열심히 보완했습니다. 주로 시험에 많이 나오지만 어려웠던 부분들을 철저히 대비했습니다. 동시에 박선우 선생님 OX 문제도 함께 풀며 세세한 개념을 놓치지 않으려 노력했습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
    `"MDP 문제를 하루에 열개~ 정도 풀고 모르는건 강의도 들으며 공부했다. 약한 단원들을 다시 공부하기 좋은 것 같다. VF 9~10월 문제도 다시 빠르게 보면서 기본기에 집중하려고 노력했다. 하루~이틀마다 잘 모르는 걸 정리해둔 박선우 써머리 한권씩을 최대한 빠르게 읽으면서 익숙하게 만들려고 노력했다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`
    ],
    화학:[
    `"전범위 문풀을 주로 하고 자주 틀리는 단원별 문제 풀이까지 감을 잃지 않도록 꾸준히 문제를 풀었다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
    `"이전에 풀었던 모의고사를 이용해서 다른 단원 감을 유지하였고, 기체파트랑 상전이 파트를 집중적으로 파면서 어디가 꼬여서 문제를 못 풀고 있는지 생각하면서 공부하였다." — 시계탑기린친구 (26학년도 강원(수) 합격생)`,
    `"이번주부터 22단원 전공화학을 공부하기 시작했다. 처음 듣는 내용이 많아서 먼저 강의를 들으며 필기하고 다음날 문제를 풀어보며 내용을 복습했다. 문제 푸는 감이 떨어질까봐 2000제 코드 4,5도 병행해서 풀었다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"목표로 했던 기출올인원 정리본 복습을 마쳤으나 생각보다 시간이 더 소요되어 24 경성대 계명대는 많이 하지 못했다. 이는 다음주에 끝낼 예정이며 매일 30분씩은 전날 새로운 개념을 암기하고 복습하며 진도를 나가고 있다. 또, 매일 1시간씩의 2000제 풀이로 앞의 내용을 잊어버리지 않게 하고 있으며 이는 다음주에 회독이 끝날 예정이다." — Akdow (26학년도 단국(약) 합격생)`,
    `"홍쌤의 조언대로 평일 월,화 하루 30여 문제씩 풀고 오답까지 했고[유기화학2 퀴즈와 실험 때문에 정신없었던 수~금요일 제외] 나머지 140문제를 어제와 오늘 사이에 나눠서 다 풀었다. 평일에 조금씩 나눠서 하고 주말에 몰아서 하는 것이 확실히 평일 시간을 절약하여 압박을 덜 받아서 훨씬 나은 것 같다. 덕분에 오늘 모의고사 풀 때도 화학부분만큼은 큰 부담없이 도전하며 풀 수 있었다." — Hcsg (26학년도 원광(약) 합격생)`,
    `"1)적중 2000제 코드1~3에 해당하는 문제를 매일 30문제씩 랜덤으로 풀이함. 2) 2025 주력학교 기출 3곳을 공부함. 이론이 부족한 곳은 써머리 + 핵심 1500제로 다시 돌아가 복습함." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"감이 떨어졌던 주기적 성질과 반응속도 부분을 보충하였다. 모의고사 연습도 주기적으로 해주었다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"∙ 기출과 2000제 문제 풀이를 병행함. 부족하다고 생각되는 단원의 2000제 문제를 다시 풀며 보완해줌." — 레고링 (26학년도 계명(제약) 합격생)`,
    `"분석화학 공부를 제대로 해보는 것이 처음이라 학습에 어려움을 겪었지만, 일단 암기를 먼저 하고 학습을 진행하다보니 나름 잘 정리를 하였다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
    `"매일 2~3시간씩은 꾸준히 공부했지만 양이 많고 내용도 어려워서 복습 진도가 밀렸다. 결국 카보닐 알파 치환~ 부터는 제대로 보지 못한 채 주간 테스트를 치렀다. 이번주에 끝까지 복습을 마치고 다시 전범위를 빠르게 회독할 수 있도록 연습해야겠다. 이번 주 전범위 모의고사에서 유기1 파트는 다 맞추자는 결심으로 유기부터 풀었는데 거의 다 틀렸다. 조금 아쉽지만 테스트에 나온 내용만큼은 확실히 복습해서 다시 틀리지 않도록 노력해야겠다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"2000제 복습하면서 올인원 진도 나가고 있습니다. 그리고 실수 노트 작성하면서 실수 줄이려 노력하고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"지난주 모의고사에서 틀렸던 기체 파트를 2000제를 활용해 다시 복습했고, 상식 관련 문제들도 따로 모아 정리했다. 공식 암기가 주가 되는 이상기체 열역학 단원을 계속 미루고 있었지만, 이번 주에 2000제 문제를 모두 풀며 전체적으로 점검했다. 시간이 부족했지만 기출올인원 단원별 문제에서 기본 문제도 함께 풀어주며 개념을 다졌다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"기본기 문제들은 이제 잘 맞춘다. 확실히 2000제를 꼼꼼히 푸니까 어떤걸 묻는지 눈에 보이고 인규샘방식으로 APS가 자동으로 짜진다. 단, 현재 공부방식은 기출올인원 진도보다 2000제 복습 중이라 진도가 잘 안나가긴 한다." — 약대가쟝 (26학년도 단국(약) 합격생)`,
    `"기출올인원 교재가 어느정도 마무리가 되어서 다음주부터 전공 공부를 시작하게 되었다. 단원별로 진도를 나가면서 7월부터 본 타임어택 시험지를 계속 풀어보면서 전범위 감을 유지했다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"화학 진도목표를 달성한게 정말 오랜만인 것 같다. 많이 느리지만, 그래도 한 주간 하루에 4시간이라는 주어진 시간동안 정말 열심히 공부했다. 아직 STEP 1,2여서 기본기 문제를 풀고 있지만, 기본기가 제일 중요하다는 마음으로 집중해서 강의를 듣고 열심히 문제를 풀었다. 확실히 1500제에서 문제를 풀고, 다시 반복하기도 하고, 기본 스타일의 문제가 계속 나오니 점점 자동화되는 것이 어떤 느낌인지 조금 느낄 수 있었다." — 단퓨프 (26학년도 목포(약) 합격생)`,
    `"기본적인 계산의 감을 유지하기 위해서 매일 2000제 50문제씩을 풀고 지난 모의고사를 다시 풀어보며 문제 분석과 풀이 속도를 한 층 끌어올렸습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
    `"기출도 중요하지만, 2000제를 더 완벽하게 보자마자 풀수있게끔 익숙하고 능숙하게 연습하는게 더 중요한 것 같아서 매일 무조건 한시간 반씩 전 범위 문제를 5~10개씩 풀어서 코드1~3 3회독을 하고있다. 어떻게 푸는거구나 하는 생각이 머리속에 문제를 보고 바로 드는 것들이 조금 생겨나는 것 같다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`
    ],
    유기:[
    `"9월에 정리해놨던 유기2 노트를 바탕으로 유기2 위주로 매일 공부하며 복습했다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
    `"이번주에 맵핑을 완강하고 기본서도 테스트 범위를 복습했다. 9월 테스트를 다시 풀 때는 막힘이 없었다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"매일 전날 정리한 것을 30분정도 복습하면서 시작하는것은 잘 잡혔다. 이제는 계속 반복 암기 , 복기를 하며 익숙화할 예정이다." — Akdow (26학년도 단국(약) 합격생)`,
    `"유기화학을 마지막 단원까지 큰 문제 없이 잘 버티며 공부하였다.(유기화학 2 성적도(A+) 잘 받았다.)" — Hcsg (26학년도 원광(약) 합격생)`,
    `"꾸준히 2시간~2시간 30분 공부함. 유기 2 범위를 2회독하면서 이해도를 높임." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"유기2부터 거꾸로 돌아가 전체 단원 복습을 시작하였다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"∙ 매일 2시간씩 유기화학 공부를 했음. 기본서 이론을 읽고 예제 문제를 푸는 루틴을 지켰음." — 레고링 (26학년도 계명(제약) 합격생)`,
    `"전체 범위 내용을 꾸준하게 학습하였다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
    `"아민까지 복습을 해준 후, 다시 앞단원 복습을 시작했다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"자주 헷갈리는 부분들을 노트에 정리하며 완전히 내 것으로 만들고자 애썼다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"이번주도 복습, 스미스 문제 풀이 하면서 아민 부분이 부족한것 같아 따로 공부하였습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"아직 반응의 숙련도가 부족한 유기2부터 최진규 기출문제 풀이를 시작하였다. 매핑 복습도 병행하면서 생성물, 반응 시약 예측하는 연습도 꾸준히 해주었다. 헷갈리는 반응은 단순 암기보다는 기본서에서 메커니즘을 찾아서 다시 그려보며 원리를 이해하면서 암기했다. 이렇게 하니 훨씬 잘 이해됐다. 7~9월에 1회독 할 때 생성물만 외우고 넘어갔던 것을 이번에는 메커니즘까지 암기하며 보충해주었다. 또한 VF 문제를 복습하며 계속 헷갈리는 문제를 약점노트에 정리해서 암기하려고 노력했다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"유기 2까지 2회독 복습을 끝마쳤다. 확실히 1회독보다 진도도 빨리 나가고 문제풀 때도 덜 헷갈린다." — 약대가쟝 (26학년도 단국(약) 합격생)`,
    `"유기 정말 힘들었지만 매일 2시간씩 공부량을 유지해서 전범위 2회독을 마쳤고, 맵핑지까지 완성했다. 이제 전범위 복습을 꽤 빠르게 할 수 있게 되었다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"방향족 파트는 어렵고 양이 많고 외울 것도 많다고 느껴 사실 이번주에 공부하기 전에 조금은 막막했었는데 한 주동안 잘 공부했다고 생각한다. 매커니즘을 쓰며 익숙하게 하고 원리를 생각하다보니 내용이 방대하게 느껴지지 않았던 것 같다. 시간이 많이 없어 유기화학 강의를 듣고 윤곽을 잡고 스미스 책을 빠르게 읽으며 예제를 풀고 마인드맵으로 바로 골격을 잡고 넘어가니 원래의 나의 공부 속도보다 빠르면서 깊이감 있게 공부할 수 있었다. 또한 연결되는 전에 배운 단원의 내용이 있지만, 헷갈리는 경우 바로 빠르게 마인드맵에서 주변 내용을 공부하고 넘어갈 수 있어서 좋았다." — 단퓨프 (26학년도 목포(약) 합격생)`,
    `"카복실산 유도체와 아민의 반응은 늘 헷갈렸기 때문에 열심히 공부해서 어느정도 자신감이 생겼습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
    `"유기 2까지 2회독을 마쳤다. 2회독 초반에는 좀 더 꼼꼼히 보고싶어서 모든 문제를 다 풀고 이해 안가는건 계속 붙잡고 있었는데, 편입의 공부법과 내신의 공부법이 다르다고 말씀해주셔서 좀 더 가벼운 마음으로 여러 번 반복해야겠다고 마음먹고 굵직한것부터 보고 또 보려고 노력했다. 다음번에 볼때는 더 많이 잘 알게 될 수 있을 것 같다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`
    ],
    생활관리:[
    `"기복 없이 한 주 내내 꾸준히 더 열심히 공부하려 노력했다. 여러 환경 변화와 시험이 다가오면서 부족한 부분들이 크게 느껴져서 답답했는데 감사일기로 마음을 잡고 카페인도 오전이나 이른 오후에만 마시는 것으로 조절하니까 하는 공부에 집중할 수 있었다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생) [1w9]`,
    `"주 3회 고강도 운동을 해주었다. 기상시간만큼은 철저히 지켰다!" — 시계탑기린친구 (26학년도 강원(수) 합격생) [4w3]`,
    `"몸살기운으로 하루 푹쉬었더니 컨디션이 완전히 회복되어 다른 날은 예정대로 공부를 진행할 수 있었다." — Akdow (26학년도 단국(약) 합격생) [5w6]`,
    `"홍쌤의 조언대로 이번주 목표인 200문제 문제풀이 및 오답을 무리 없이 완료했다. 일단 이렇게 하면 큰 무리 없이 12월 되기 전까지 화학 2000제 문제풀이를 대부분 완료할 수 있다. 또한 큰 문제 없이 유기화학 전범위 1회독을 완료했다. 유기화학2 기말고사 대비와 함께 오답과 문제풀이만 더 해주면 큰 걱정은 없을 것 같다." — Hcsg (26학년도 원광(약) 합격생) [5w6]`,
    `"저번 주처럼 과목 간의 밸런스가 잘 맞았고, 늘어난 공부 시간도 그대로 유지하고 있음.수면 시간이나 기상/취침 시간도 일정하고 주말 운동 루틴도 회복해서 컨디션이 매우 좋았음." — 이번엔내차례 (26학년도 삼육(약) 합격생) [9w8]`,
    `"11월 중반을 넘어서면서 한계를 느낄 만큼 공부를 하고 있다. 공부에만 몰두할 수 있었던 한 주였다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생) [1w9]`,
    `"∙ 건강 관리도 잘 하고 아픈 곳 없이 매일 차분하게 루틴을 지켰음. ∙ 점심, 저녁에 밥먹는 시간을 활용해서 생물 복습을 꾸준히 진행함." — 레고링 (26학년도 계명(제약) 합격생) [9w1]`,
    `"지난주와 동일하게 루틴을 잘 이어나가고 있습니다!" — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생) [8w7]`,
    `"일찍자고 일찍 일어났다. 운동 2번 갔다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생) [5w6]`,
    `"뒤늦게 자소서를 쓰느라 공부시간이 조금 줄었지만 그래도 매일 10시간 이상은 유지했다. 적당히 평범하고 치열한 한 주를 보냈다." — 초록콩 (26학년도 순천(약) 합격생) [9w1]`,
    `"말씀해주신대로 자기 전에 하루 리마인드하면서 마무리하는 느낌으로 보냈습니다. 아침에 30분 정도 일찍 일어나고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생) [6w5]`,
