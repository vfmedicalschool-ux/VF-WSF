  `"계획한 일정대로 규칙적인 생활을 유지했다." — 초록콩 (26학년도 순천(약) 합격생) [9w1]`,
  `"긍정적인 생각하면서 루틴 잘 지키고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생) [6w5]`,
  `"7월에 애니어그램 학습법을 읽으며 공부 방식에 적용하기 시작했을 대는 완벽보다는 완성하자는 말이 머리로는 이해되었지만 잘 와닿지는 않았었다. 5개월 동안 애니어그램 학습법을 실천하려고 노력해보니 이제 완벽주의를 추구하던 나에서 완성을 목표로 하는 나로 바뀐게 느껴졌다. 이번주도 완벽하게 계획했던 모든 것을 하진 못했지만 매일 밤에 하루에 대한 피드백을 하면서 내일은 계획을 지키기 위해 무엇을 해야 할지 고민하며 일주일을 완성시키고자 하였다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생) [4w3]`,
  `"이번주도 별 탈 없이 루틴대로 공부했다. 감정기복이 많이 나아졌다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생) [9w8]`,
  `"항상 막바지에 불안이 극심해져 오히려 회피하는게 심해지는데 이걸로 인해 이번주 공부시간이 줄어드는게 보여 선생님께 조언을 구했다. 다음주는 스터디카페에 있는 시간을 더 늘려 잡생각이 없어지도록 노력할 예정이다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생) [9w8]`,
  `"아픈 와중에도 기력이 좀 돌아오면 공부를 조금씩 하려고 노력했다. 그동안 열심히 해온 게 있어서 그런지 이틀 정도 쉬었음에도 크게 불안하지 않았다. 그래도 남은 두 달 컨디션 관리에 주의하자" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생) [1w9]`,
  `"평정심을 가지고 루틴 잘 지키면서 보내고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생) [6w5]`,
  `"시험이 다가올수록 ‘시간이 더 있었다면 더 잘할 수 있었을 텐데’라는 생각이 들었다. 그래도 후회하는데 시간을 쏟기 보다는 이런 생각이 들 때마다 지금 무엇을 할 수 있는지 계획을 세웠다. 오히려 이렇게 임박한 상황에서 더 집중력을 발휘해서 벼락치기를 잘하는 편이라 최대로 집중해서 공부했다. 그리고 오전 시험을 대비해서 취침, 기상시간을 앞당겨서 생활 리듬을 조절했다. 첫날은 7시에 일어나는 것이 쉽지 않았지만, 일찍 일어나서 오전 공부 시간을 늘리고 하루의 시작을 잘했다는 생각이 드니까 오히려 그 뒤 공부도 잘되었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생) [4w3]`,
  `"시험은 다가오는데 내 실력은 부족하고, 시간은 없고 마음은 너무 힘들었지만, 그래도 매일매일 앉아 그날의 공부를 하려 노력했다. 서류를 준비하고, 접수를 하느라 공부시간이 줄었지만, 바로 다시 돌아와 집중하려 노력했다. 몸이 조금 좋지 않았지만, 초기에 약도 잘 챙겨먹고 따뜻한 물도 마셨더니 괜찮아진 것 같다. 건강관리에 유의하고 있다." — 단퓨프 (26학년도 목포(약) 합격생) [1w2]`,
  `"저번주보다는 나은 주를 보냈다. 다음주부터는 저녁에 가벼운 달리기을 다시 하며 기분을 더 다잡도록 노력해야겠다. 선생님께서 보내주신 문구를 캡쳐해서 아침에 공부하기 전에 보고 있다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생) [9w8]`,
  `"*오전에 너무 많이 졸아서 아예 놓아버릴 뻔도 했지만 그럴 때일수록 고강도 운동을 해주고, 애니어그램을 다시 읽으며 완벽보다는 완성하자는 마음을 가지려고 스스로에게 상기시켰다. 덕분에 주춤하긴했어도 놓지 않고 다시 공부량을 회복했다. * 저번주에 선생님이 피드백 주신 것을 플래너에 써두고 그날 할일을 정할 때 다시 봐주면서 불안감에 공부를 회피하지 않으려고 의식적으로 노력하였다." — 시계탑기린친구 (26학년도 강원(수) 합격생) [4w3]`,
  `"공부를 마친 이후에도 매일 조금씩 시간을 더 내어 자소서를 완성하고 있다. 자투리 시간을 이용해 자소서도 조금씩 다듬어두었다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생) [1w9]`,
  `"∙ 건강 관리를 잘 하며 루틴대로 생활했음. 심적으로도 예전보다 안정적으로 살고 있는 것 같다." — 레고링 (26학년도 계명(제약) 합격생) [9w1]`,
  `"일찍자고 일찍 일어났다. 운동 1번 갔다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생) [5w6]`,
  `"원서 접수, 자소서 등 공부 외의 일들에 시간을 많이 소모했지만 하루 10시간 이상의 순공시간은 간신히 지켜냈다." — 초록콩 (26학년도 순천(약) 합격생) [9w1]`,
  `"원서접수로 정신 없었지만, 하루하루 공부량 채우면서 잘 해온 것 같다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생) [9w8]`,
  `"하루 20분 운동을 짧지만 고강도로 했습니다. 신기하게도 지난달보다 벤치프레스가 10kg늘어서 120kg 달성했습니다. 데드리프트도 20kg 늘어 170kg을 달성했습니다." — 후회없이살자 (26학년도 강원(약) 합격생) [5w6]`,
  `"최대한 마음을 편하게 먹고 자신감 가지려고 노력하고 있다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생) [9w1]`,
  `"12시반 취침 7시 반 기상은 매일 실천하고 있고 밥 먹는 시간에서 쓸데없는 시간 낭비를 하지 않고 있다." — Akdow (26학년도 단국(약) 합격생) [5w6]`,
  `"익숙한 환경에서 벗어나라는 선생님의 조언에 따라 좀 더 먼 동네의 관리형 독서실을 끊음. 매일 9번 애니어그램 공부법 글을 읽고 시작하려 노력함 평일 내내 7시 기상을 지킴" — 승민 (26학년도 단국(약)·연세(생화학) 합격생) [9w8]`,
  `"매일 칭찬일기 짧게 쓰는 중, 아침 매일 7시 기상," — 고냥이 (26학년도 경희(치)·경성(약) 합격생) [5w6]`,
  `"12시 30분 취침, 7시30분 기상을 잘 지켰다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생) [9w8]`,
  `"상담 내용을 최대한 지키려고 노력하였으며 공부양을 늘렸음." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생) [1w9]`,
  `"꾸준한 고강도 운동을 하니 공부할 때엔 집중력 있게 공부할 수 있는 체력도 길러졌다. 그리고 가끔 잡생각이 날 때에도 생각 리프레시를 통해 더 집중해서 공부할 수 있던 일주일이었다." — 쿠리만쥰 (26학년도 5관왕 | 단국(약)·계명(제약)·삼육(약)·강원(약)·우석(약) 합격생) [5w6]`,
  `"오전을 제외한 모든 시간에 계획대로 행동하기 위해서 꾸준히 노력하였다. 운동 시간에 노래를 듣기보다는 공부했던 내용들을 떠올려봤다. 이두 운동을 하면서 근육의 수축 운동을 중심으로 근방추와 건반사에 대해서 생각해 봤는데, 실제 근육의 움직임을 보면서 공부하니 더 도움이 된 거 같기도..?(ㅋㅋㅋ) 하다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생) [8w7]`,
  `"학습시간 10시간 채우기 실천하고 있습니다. 또한, 선생님께서 조언해주신 대로 중간중간 쉴 때 조용히 눈 감고 명상을 조금씩 하고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생) [6w5]`,
  `"매일 아침 애니어그램 공부법을 읽고 공부를 시작하며 감정에 매몰되지 않고 관찰하려 노력함 강의 제외 공부 시간 6시간을 채우려고 노력함" — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생) [4w3]`,
  `"애니어그램 학습법을 매일 공부 전에 읽는다. 내가 해야 되는 생각/ 하지 말아야 되는 생각을 읽으면서 공부를 시작하니 공부할 때 마음가짐이 잘 흐트러지지 않아 좋았다.  주 4회 고강도 운동을 실천하였다. 운동을 1회 더 늘려도 피로하다기 보다는 공부로 쌓인 스트레스가 풀린 느낌이었다." — 이번엔내차례 (26학년도 삼육(약) 합격생) [9w8]`,
  `"저번 주에는 약한 강도의 운동만 했지만 이번에 처음으로 런닝을 했다. 30분이 최대였지만 런닝은 난생 처음 해보기 때문에 엄청난 일이다. 너무 힘들지만 개운하기도 해서 시간을 점차 늘려야겠다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생) [9w8]`,
  `"애니어그램을 읽고 공부를 시작했다. 칭찬 일기를 적을때도 성과위주가 아닌 잘했다고 생각되는 것에 쓰기 시작했다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생) [5w6]`,
  `"수면시간, 운동 횟수와 강도 모두 잘 지켜내면서 공부했다. 피곤해서였는지 아니면 공부로 지쳐서인지 매일 눕자마자 잠 들었다. 운동을 하면 할수록 스트레스 해소에 효과적인 것을 느낀다. 스트레스가 풀리니 공부에 더욱 집중이 잘 되어서 좋았다." — 이번엔내차례 (26학년도 삼육(약) 합격생) [9w8]`,
  `"월요일에 계절학기가 끝나 본가로 내려와서 화요일부터 본격적인 생활 관리를 할 수 있었는데, 생각보다 일찍 생활 패턴이 잡혔다. 그리고 밥 먹거나 이동하는 시간에 퀴즐렛을 푸는 게 점점 습관으로 잡혀가고 있다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생) [9w8]`,
  `"이번주에도 진도를 밀리지 않았고 명상을 하면서 생각을 정리하는 시간을 가졌음.  공부 내용과 할 일에 익숙해지는 느낌을 받아서 꾸준히 노력하고자 함." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생) [1w9]`,
  `"공부 시작 전 애니어그램 공부법을 읽은 것이 매우 도움이 되었다. 지난 주말 친구들을 만나고 나도 모르게 다른 사람들과 나를 비교하며 묘한 불안함에 휩싸였었다. 과거의 나였다면 이런 상황에서 공부를 회피하고 포기했겠지만 ‘원하는 것을 갖지 못한 사람’이라는 이미지를 강화하려는 4번의 특성이 나온 것을 인식하고 그 감정에 휘둘리지 않으려고 했다. 덕분에 마음을 다 잡고 완벽하게 계획을 수행하진 못했더라도 할 수 있는 만큼 최선을 다해 공부할 수 있었다. 이렇게 감정에 휘둘리지 않고 해야 할 것을 해낸 자신이 너무 뿌듯했다. 그리고 이번주는 고강도 운동 주 3회 채웠다! 운동도 감정을 다스리는데 큰 도움이 되었다. 힘들게 몸을 몰아붙이니 잡생각이 사라지면서 현재에 집중할 수 있었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생) [4w3]`,
  `"화~목요일에 몸이 많이 안 좋았지만, 최소한의 공부는 진행하였다. 작성해주신 애니어그램 8번 분석 자료를 매일 기상 직후 읽었다. 이를 통해 의식적으로 더 계획적으로 공부를 하려고 노력하였다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생) [8w7]`,
  `"비가 많이 와서 정말 힘들었지만 그래도 운동을 가기 위해 노력했다. 비록 2번 뿐이어서 목표치에는 못미쳤지만, 평소보다 훨씬 한적하고 빈 헬스장에서 운동하니 괜한  뿌듯함이 느껴졌다." — 초록콩 (26학년도 순천(약) 합격생) [9w1]`,
  `"화학 때문에 불안했는데 차라리 확 공부해서 불안감을 낮추는 것도 나쁘지 않다는 생각을 하였습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생) [6w5]`,
  `"월-일 한번도 뺴놓지 않고 9시 30분 이전에 독서실에 착석함. 공부시간이 늘어났고 목표치를 모두 수행함. 화학 공부를 더 할 수 있지 않았을까라는 아쉬움은 남지만 목표설정을 어느정도해야 내가 성취" — 푸파 (26학년도 순천(약) 합격생) [7w8]`,
  `"잠을 일찍 잤다. 매일 아침 일찍 일어났고, 학원에 매일 늦지 않게 도착했다. 칭찬일기를 매일 적었다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생) [5w6]`,
  `"- 저번주 목표대로 점심시간에 유튜브를 보지 않고 멍때리거나, 암기할 것을 봐주었다.  - 이번주는 거의 항상 월-토 기상시간이 7:45로 늦게 일어나는 날 없이 거의 제때 집에서 나갔다.  - 애니어그램 학습법을1주차부터 계속 읽으며 공부하고 있고, 취침 전 명상과 아침 공부 전 감사일기, 적절한 운동과 산책을 통해 멘탈이 전보다 많이 좋아진 것이 느껴진다." — 시계탑기린친구 (26학년도 강원(수) 합격생) [4w3]`,
  `"수면 시간을 잘 지킨 것.  매일 애니어그램 유형 글 읽으면서 공부할 때 마음을 다 잡은 것.  매일 과목별 셀프 피드백과 생활 피드백을 한 것. 루틴대로 살다보니 습관처럼 공부하는 것이 익숙해졌다." — 이번엔내차례 (26학년도 삼육(약) 합격생) [9w8]`,
  `"주 4회 운동을 빠지지 않고 했으며, 체력이 좋아진 게 느껴진다. 또한, 공부 시작 전에 애니어그램 공부법을 읽어주었고, 핸드폰을 켜면 퀴즐렛부터 들어가는 것이 습관이 되었다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생) [9w8]`,
  `"더위를 정말 많이 타는 체질이라 이번 주의 무더위가 무서웠지만, 더위를 안 먹게끔 잘 관리를 해서 큰 문제 없이 한 주를 보낼 수 있었다." — 쿠리만쥰 (26학년도 5관왕 | 단국(약)·계명(제약)·삼육(약)·강원(약)·우석(약) 합격생) [5w6]`,
  `"3주차에 접어들며 각 과목에 대한 학습법과 루틴이 점차 자리를 잡아가고 있다. 하지만 머릿속으로는 잘 알면서도 행동으로 옮기지 못한 한 주였다. 지난주에 세웠던 ‘감정을 조절하며 규칙적으로 생활하자’는 결심이 뜻대로 지켜지지 않았다. 그러면서 하루는 스스로를 자책하며 안개 속에서 길을 잃은 듯 무기력함에 빠지기도 했다. 그래서 이날은 저녁에 공부를 일찍 마치고 자버렸다. 그런데 확실히 잠을 푹 자니까 다음날 다시 의욕이 생기고 공부에 집중 할 수 있었다. 날이 많이 더워지고 반복되는 일상에 지쳐 있었던 것 같다. 점점 페이스를 되찾고 있는 중이다. 다음주에는 체력 안배와 질 좋은 수면에 중점을 두고 계획을 세워야겠다. 무리 없이 지속할 수 있는 루틴을 찾아보자." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생) [4w3]`,
  `"풀케어를 시작한 이후로 생활 습관이 어느 정도 안정을 찾은 것 같습니다. 이 상태에서 조금씩 학습량을 늘릴 수 있도록 하겠습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생) [6w5]`,
  `"이번 주에는 컨디션이 좋지 않았고 일요일 토익도 있어서 공부에 집중하기 어려운 환경이었지만 매일매일 공부하였고 공부 시간도 어느정도 유지했음. 최선을 다했다는 점이 뿌듯함. 또한, 생활루틴을 지키면서 일주일을 보냈음." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생) [1w9]`,
  `"처음으로 월~토요일 모두 같은 시간에 독서실에 출석했다. 영양제도 매일 먹고 저번주처럼 체크리스트를 기록하다 보니 루틴에 확실히 익숙해진 것 같다. 독서실 공부 자리를 바꿔보면서 집중도를 높이기 위해 노력했다. 평일 중 한번 기분이 너무 안 좋았는데 그냥 저녁 공부를 1시간 덜하고 땀 흘리면서 운동을 했더니 훨씬 나아져서 좋았다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생) [9w8]`,
  `"3일은 고강도 무산소 운동을 하고 하루는 유산소 운동을 해서 체력 관리 및 멘탈 관리에 집중을 했고 취침 시간은 조금씩 달라지더라도 기상시간은 일정하게 유지하면서 공부 시작 시간은 계속 유지하려고 노력했다." — Akdow (26학년도 단국(약) 합격생) [5w6]`,
  `"한달 내내 12시에 자고 6시 반~7시 사이에 일어나는 규칙적인 생활습관을 유지하였다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생) [1w9]`,
  `"이번 주에는 운동을 소홀히 하지 않았다. 잠도 규칙적으로 매우 잘 잤다. 공부 습관이 생기니 컨디션이 안 좋은 날이 있어도 공부를 계속 이어 나갈 수 있었다." — 이번엔내차례 (26학년도 삼육(약) 합격생) [9w8]`,
  `"진도에 집착하지 않기로 하니 조급함이 사라지고 해야할 일을 차근차근 해냈다. 이번주는 전보다 긍정적인 마인드로 공부에 임했고 그래서 그런지 더 잘되는 것 같았음. 공부시간도 저번보다 더 확보할 수 있었다." — 레고링 (26학년도 계명(제약) 합격생) [9w1]`,
  `"정해진 루틴을 제대로 지켰다. (12시 취침 7시 기상) 공부를 시작하고 오전 시간에는 전 날 학습한 내용을 복습하는 시간으로 마련했는데, 이 과정에서 목차들을 떠올려보며 연습을 하니 더 도움이 된 것 같다. 이에 앞으로 오전 시간에는 최대한 복습하는 시간으로 루틴화시키면 좋을 것 같다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생) [8w7]`,
  `"주말부터 몸이 안좋다가 화요일에 크게 앓아 눕는 바람에 하루를 날려버렸지만, 컨디션이 좋지 않은 와중에도 월수목금 매일 아침 헬스장에 가고 밥도 잘 챙겨먹는 등 체력을 끌어올리고자 노력했더니 몸도 곧바로 회복하고 시간도 많이 허비하지 않을 수 있었다. 이번 주부터 쇼츠를 끊기로 결심했는데 100% 단절한 것 까지는 아니지만 거의 안봤다." — 초록콩 (26학년도 순천(약) 합격생) [9w1]`,
  `"날이 더워서 그런지 조금씩 더 일찍 일어나고 있고 그에 따라 학습 시간도 늘어나고 있습니다. 앞으로도 유지하도록 하겠습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생) [6w5]`,
  `"저번주보다 한 가지라도 더 잘해보자는 마음으로 ‘자기 전 핸드폰 보지 않기’를 실천했다. 7일 중 4일을 성공해 나름 의미 있는 변화를 만들었다고 생각한다. 다음 주에는 7일 모두 실천하는 것을 목표로 삼을 예정이다. 자기 전에는 그날 공부한 내용을 머릿속으로 떠올리며 마인드 맵을 그리듯 정리한 뒤 잠들었는데, 이렇게 하니 ‘자면서도 공부하고 있다’는 생각이 들어 불안감이 한결 줄어드는 효과도 있었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생) [4w3]`,
  `"- 킥보드로 이동을 하니 지금처럼 더운 여름에는 크게 불편함을 못 느끼고 있다. 식사도 균형잡히게 하고 영양제도 잘 챙겨먹어 생활적으로는 문제가 없는듯 하다. - 요즘 기본서 위주로 공부하다 보니 24시간 중에도 시간이 부족해서 22시를 꽉 채우고 운동까지 하고온다. 9월쯤에는 운동을 줄이고 밤늦게까지 하는 스터디카페를 끊어 저녁공부는 거기서 해야겠다. - 현재 하고있는 "종합병원 병리과 봉사활동"에서 이제는 다 친해지고 일도 익숙해져서 재밌다. 특히 생물 관련 내용을 가끔 접하고 일부러 알려주시기도 한다. 전공서에 나온 '파라핀 박편'이라는 업무가 주 업무인데 그 부분을 특히 떠올리며 하는 중이다. 그 외에도 염색, 고정, 폐기할 조직관찰 등 여러가지로 배울게 많아 계속 병리과에서 일하고싶다." — 약대가쟝 (26학년도 단국(약) 합격생) [5w6]`,
  `"1주일 동안 지치지 않고 잘 버텼다. 그리고 이번주로 금주 6개월차다. 전역하고 술을 너무 많이 마셔서 몸이 많이 망가졌었는데, 입시를 시작하고 생활 습관이 잘 잡히면서 살도 빠지고 체력도 많이 좋아졌다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생) [9w8]`,
  `"헬스장까지 너무 멀어서 그냥 줄넘기 하나 사서 운동하는걸로 대체했다. 시간을 아낄 수 있게 된 것 같다!" — 진강강민 (26학년도 순천(약)·연세(생공) 합격생) [9w1]`,
  `"월-금 모두 독서실 출석을 정시에 완료했고 매일 애니어그램 공부법을 읽었고, 주 3회 운동을 했다. 토요일 점심에 또 일정이 잡혔는데 이번에는 2주전 행동을 반복하지 않으려 일정이 끝나자 마자 바로 독서실로 갔다. 평일보다 상대적으로 공부시간이 부족하긴 했지만 2주전과는 다르게 행동했다는 점에서 잘했다고 생각한다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생) [9w8]`,
  `"수요일 너무 힘들어서 집에갈때 아 운동 가지말까 한참 고민했는데 지금 안가면 언제 가냐 싶어서 결국 갔다. 운동 시작한 저번주보다는 컨디션이 좋은 듯하다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생) [5w6]`,
  `"이제는 생활 루틴이 잡혀서 수면 시간도 충분하고, 운동도 열심히 함. 매일 아침 애니어그램 글을 읽으면서 마음을 다 잡을 수 있음. 이번 주에는 컨디션이 좋아서 집중력도 좋았음." — 이번엔내차례 (26학년도 삼육(약) 합격생) [9w8]`,
  `"8월이 되면서 여름에 공부를 하다보니 가끔 답답하고 짜증이 치솟을 때가 있는데, 그럴 때마다 도서관에서 나와 학교 구경, 사람 구경을 하며 마음을 다스렸다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생) [1w9]`,
  `"∙자기소개서 작성과 생물 통합이론을 끝냈고 앞으로의 문제풀이 계획을 세움 ∙긍정적인 마인드로 생활함 ∙수면시간을 조정해서 평소보다 맑은 정신으로 공부함" — 레고링 (26학년도 계명(제약) 합격생) [9w1]`,
  `"지난주와 비교하여 휴대폰을 보는 시간이 줄어들었다. 자기 전에 10분이나마 오늘 학습한 내용에서 중요했던 내용들을 떠올려보는 시간을 가지기 위해 노력하였다. 8월 생물 학습에 대하여 고민을 많이 하였는데, 잘 정리했고, 최선의 계획을 수립하였다. 이 계획을 잘 지켜나가보자. 루틴을 지키는 게 점점 재밌어진다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생) [8w7]`,
  `"체력, 집중력 등 전반적인 면에서 컨디션이 좋았다. 별다른 변수 없이 계획한 바를 잘 실천했다. 이렇게 무난한 한 주 한 주가 연말까지 꾸준히 이어졌으면 좋겠다." — 초록콩 (26학년도 순천(약) 합격생) [9w1]`,
  `"이번주는 저번주 피드백을 바탕으로 ‘생활 전체를 조율하며 학습 흐름을 완성해가는 주’를 목표로 삼았다. 먼저 과목별 학습 시간을 골고루 분배했다. 생물에 치우쳐 있던 학습 패턴을 바꿔서 생물:화학:유기를 4:4:2 비율로 조정하였다. 집중력이 가장 높은 아침에는 취약한 화학을 배치하고 유기, 생물 순으로 공부하며 효율이 높아졌다. 기상, 공부, 식사, 운동, 취침시간을 기록하며 루틴을 점검했다. 저번주 시도에 더해 전날보다 일찍 일어나기와 식사 시간 규칙적으로 지키기를 실천했다. 완벽하진 않았지만 하루를 완성해보고자 노력하였다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생) [4w3]`,
  `"주중에 조문을 다녀올 일이 있어서 하루를 비워야 했는데, 운동시간과 공부 시간을 잘 조율해서 목표치 공부량을 모두 끝낼 수 있었다. 조문 다녀오고는 공부가 잘 안 잡혔지만, 밖에서 런닝을 하면서 마음을 다잡고 빠르게 공부에 다시 집중할 수 있었다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생) [9w8]`,
  `"매일매일 애니어그램과 체크리스트를 읽고 실천하려고 노력했다. 어떻게 해야 시간을 가장 효율적으로쓸수 있을까 고민하고 실천했다. 공부 과목을 시간별로 나눴고, 매일 십분정도씩은 각 과목에서 배운 것 중 헷갈렸던 것을 복습하는데 썼다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생) [9w1]`,
  `"처음으로 평일에 운동을 3회 했다. 금요일에는 너무 하기 싫었지만 결국 했다. 기상, 출석, 애니어그램 읽기 루틴을 유지하는 데 어려움이 없었고 처음으로 공부 중 쉬는 시간을 규칙적으로 가지며 공부했는데 집중력이 더 나아진 것 같아 좋았다. 그래도 집중력이 떨어지는 것 같은 날에는 아예 다른 장소로 옮겨서 공부했다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생) [9w8]`,
  `"수면 시간을 규칙적으로 지키고 운동도 꾸준히 해왔다. 식사 역시 여러 가지를 시도해 본 끝에 식곤증이 거의 오지 않도록 음식의 종류와 양을 조절해 정착했으며, 덕분에 식사 후 집중력이 떨어지는 일도 없어졌다." — 이번엔내차례 (26학년도 삼육(약) 합격생) [9w8]`,
  `"학교 도서관이 공사를 하며 며칠간 집에서 주로 공부를 하였으나 효율이 떨어진 것을 느껴 바로 독서실로 갔다. 조금이라도 환경이 지루하거나 불편하면 다른 곳으로 가서 다시 공부를 이어나가는 것이 역시 좋다고 느꼈다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생) [1w9]`,
  `"∙꾸준히 운동을 해서 스트레스를 해소했고 체력이 더 늘어난 것 같음 ∙6시간30분-7시간 정도로 수면시간을 지키니 집중력에 확실히 도움이 되었음." — 레고링 (26학년도 계명(제약) 합격생) [9w1]`,
  `"루틴을 지키는 게 상당히 익숙해졌다. 공부를 하는 목적을 항상 생각하면서 공부했다. 광복절에 가족 일정이 있었기 때문에 이를 위해 평일에 더 타이트하게 학습을 진행해줬다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생) [8w7]`,
  `"이번주는 유달리 소화해야할 분량이 많게 느껴져 점심시간, 저녁시간까지 최대한 활용하여 공부했더니 순 공부시간은 역대급으로 많이 확보할 수 있었다. 유튜브 쇼츠를 거의 안봤다." — 초록콩 (26학년도 순천(약) 합격생) [9w1]`,
  `"공부 중간중간 쉬는 시간을 넣고 한동안 안했던 명상을 다시 하였습니다. 확실히 저번주보다 멍때리는 시간이 줄어든 것 같습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생) [6w5]`,
  `"시간표를 고정해 하루 세 끼를 제시간에 챙겨 먹고 운동도 실천했다. 밤에는 바로 잠들려고 노력한 덕분에 수면의 질이 좋아졌고, 공부 집중력도 높아졌다. 점심 식사 이후 집중력이 떨어지는 시간에는 카페로 이동해 4시간 정도 공부했다. ‘불특정 다수의 감시 효과’를 활용하니 졸음도 줄고 잡생각 없이 몰입할 수 있었다. 또한 기계적으로 학습하기 위해 하루 공부 계획을 더 세분화했다. 공부를 작은 단위로 쪼개니 성취감이 쌓여 하루의 지루함을 이겨낼 원동력이 되었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생) [4w3]`,
  `"지치지 않고 꾸준하게 공부했고, 밤에 핸드폰 이용 시간을 줄였다. 9월부터는 공부시간을 늘릴 계획이라 한 주간 2번 30분 일찍 독서실에 들어가 공부를 시작했다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생) [9w8]`,
  `"매일 아침 정해진 시간에 일어나려고 갖은 노력을 다 했다. 집 밖에 나가야 알람이 꺼지게 하려고 아파트 밖의 표지판을 찍어야 알람이 꺼지게 했더니 효과적이었다. 잠도 최대한 7시간 자려고 노력하다보니 이번주는 공부시간이 많이 늘었다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생) [9w1]`,
  `"이번 주는 불가피하게 몸 컨디션이 나빴는데 7월과는 다르게 평일 내내 루틴을 유지했다. 주말에 운동을 하면서 이제는 강도를 더 늘려도 되겠다는 생각이 들 정도로 처음 런닝을 했을 때보다 체력이 좋아진 게 느껴졌다. 저번 주보다 눕자마자 잠드는 날이 늘어났다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생) [9w8]`,
  `"저번주에 수정한 사항들은 잘 반영해서 공부를 규칙적으로 진행했고 운동도 꾸준하게 했다." — Akdow (26학년도 단국(약) 합격생) [5w6]`,
  `"공부시간, 수면시간, 운동 횟수와 강도, 시간 모두 잘 지키고 있다. 매일 애니어그램 글을 읽으면서 하루 공부를 시작한다." — 이번엔내차례 (26학년도 삼육(약) 합격생) [9w8]`,
  `"운동을 다시 나가며 정신도 맑아지고 허리 통증도 많이 줄었다. 시간 아까워하지 말고 이번주처럼 꾸준히 운동가자." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생) [1w9]`,
  `"저번 주 보다는 그래도 걱정과 고민이 줄어들긴 했다. 내가 지금 할 수 있는것에 집중하면서 하루하루를 잘 살아나가려고 노력했고, 앞으로도 그렇게 계속해야겠다." — 쿠리만쥰 (26학년도 5관왕 | 단국(약)·계명(제약)·삼육(약)·강원(약)·우석(약) 합격생) [5w6]`,
  `"∙평일 루틴을 깨지 않고 일찍 도서관에 감 ∙건강 관리를 잘 해서 좋은 컨디션으로 한 주를 생활 함" — 레고링 (26학년도 계명(제약) 합격생) [9w1]`,
  `"루틴을 잘 지켜나가고 있고, 아침에는 눈을 뜨자마자 세면을 하며 하루 일과를 시작하는 루틴을 추가하였다. 이렇게 하루를 시작하다보니, 아침에 침대에 누워있는 시간을 줄일 수 있었다. 저녁에 12시 전후로 취침하기 위해 11시 30분부터는 최대한 휴대폰을 안 보기 위해 노력하였다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생) [8w7]`,
  `"이번주에도 운동을 3회 감. 공부중에 조는 빈도가 많이 줄음." — 고냥이 (26학년도 경희(치)·경성(약) 합격생) [5w6]`,
  `"계획한 운동량과 공부시간을 잘 지켰다." — 초록콩 (26학년도 순천(약) 합격생) [9w1]`,
  `"저번주와 마찬가지로 큰 이슈는 없었지만 저녁 먹고 난 후에 졸리는 경우가 있습니다. 그때마다 복도로 나가서 스트레칭하면서 잘 이겨내고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생) [6w5]`,
  `"이번 주에는 감정에 휘둘리고 완벽주의적 성향 때문에 공부가 계획대로 이루어지지 않자 힘들었다. 포기하고 싶은 마음과 자책감으로 상황을 피하고 싶었다. 그래도 회피하지 않고 직면하며 선생님께 도움을 청했다. 이를 통해 혼자 감정에 매몰되지 않고 외부 시각을 빌려 상황을 객관적으로 바라볼 수 있었다. 앞으로의 학습을 유지할 수 있는 큰 힘이 되었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생) [4w3]`,
  `"날짜가 거의 8월이 끝나가고 9월이 다가오니 슬슬 불안감이 밀려와서 오랜만에 애니어그램 유형별 학습법을 읽곤 한다. 잡념이나 쓸데없는 걱정을 덜 해야 하지만 아예 안할수는 없는것 같다. 그럴수록 운동할때도 더 힘들게 해서 잡념을 떨친다. 토익도 이번주에 봤지만 시험 전날에 시험 1회 정도 보고 오답한게 다라서 시간을 많이 쓰지도 않았는데 본 시험에서 독해를 다 맞아서 아직 실력이 안죽었나 싶었다." — 약대가쟝 (26학년도 단국(약) 합격생) [5w6]`,
  `"입시 스트레스가 유난히 큰 한 주였어서 소화불량도 겪고 많이 힘들었지만, 반수할 때 쓴 플래너를 보면서 마음을 다 잡고 평소에 안 듣던 노래도 들으면서 어떻게든 공부를 해나갔다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생) [9w8]`,
  `"늦게 일어난 날에도 일어나서 포기하지 않고 그날의 시간을 잘 쓴 것! 매일 감사일기를 쓴 것." — 시계탑기린친구 (26학년도 강원(수) 합격생) [4w3]`,
  `"일주일에 세번 땀날정도로 운동도 다녀오고, 일찍 일어나는것도 대체로 잘 했다!" — 진강강민 (26학년도 순천(약)·연세(생공) 합격생) [9w1]`,
  `"기상과 애니어그램 읽기 루틴을 모두 지켰고 매일 집 밖으로 나가서 공부했다. 일요일에도 오전에는 밖에서 공부를 한 뒤 오후에 쉬면서 하고 싶은 일을 했는데 좀 더 좋은 휴식을 취한 것 같다. 전반적으로 몸 컨디션은 좋았다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생) [9w8]`,
  `"규칙적인 취침과 규칙적인 기상을 지켰고 3끼를 모두 챙겨먹으며 꾸준한 운동을 했다." — Akdow (26학년도 단국(약) 합격생) [5w6]`,
  `"두 달을 되돌아보니 하루도 빼놓지 않고 공부를 했다. 가끔 더위와 반복되는 공부에 지친 날도 있었지만, 타협하지 않고 하루하루 성실히 버텼더니 이뤄낸 성과이다. 공부량 뿐만 아니라 모든 과목에서 큰 성장을 이뤄낸 두달이어서 정말 수고했다고 스스로를 칭찬하고자 한다. 남은 기간 더 열심히 해서 최고의 결과로 보답받았음 좋겠다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생) [1w9]`,
  `"∙애니어그램 9번 공부방법을 읽으며 '갈등 회피'를 하지 않기 위해 노력하며 공부 시간을 채웠음." — 레고링 (26학년도 계명(제약) 합격생) [9w1]`,
  `"운동을 주 3회 진행하였다. 평소에 밥을 먹자마자 자리에 앉아있다보니 소화가 잘 되지 않는 느낌을 받았는데, 운동을 주 3회 진행하니 예전보다는 덜한 것 같다. 점점 루틴을 지키는 것이 익숙해지고 있다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생) [8w7]`,
  `"이번주에도 운동을 3회 갔다. 운동가는게 영 즐거운 일은 아니지만 그래도 하고나서 생기는 뿌듯함이 있다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생) [5w6]`,
  `"매일 에니어그램 9번 유형 글을 읽고 공부를 시작했음. 추가적으로 쉬는 시간에 운동 간식(스쿼트 15회)을 활용하여 집중력을 높였음." — 이번엔내차례 (26학년도 삼육(약) 합격생) [9w8]`,
  `"큰 이슈는 없었고 집에서 핸드폰 보는 시간도 의식적으로 줄이려고 노력하였습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생) [6w5]`,
  `"애니어그램 학습법을 다시 정독하며 ‘감정에 휘둘려 시간과 에너지를 낭비하면 중요한 현실을 놓치게 된다’는 말을 계속 떠올렸다. 그래서 감정에 따라 움직이기보다 그냥 먼저 행동하는 습관을 의식적으로 연습했다. 지금 기분은 며칠 뒤면 사라지지만 내가 내린 선택의 결과는 오래 남는다는 생각으로 공부에 집중하려고 했다. 생활 루틴도 현실적으로 바꿔봤다. 아침잠이 많아서 8시에 일어나려다 실패하고 괜히 스트레스 받는 것보다 그냥 내가 매일 자연스럽게 일어나는 시간인 9시로 기상 시간을 맞췄다. 대신 식사는 하루 세 끼에서 두 끼로 줄였다. 원래도 두 끼만 먹어왔던 터라 몸도 가볍고 집중하기에 오히려 더 좋았다. 아침에 일어나 씻고 준비한 다음 이른 아점을 먹고 5시간 공부. 그다음 이른 점저를 먹고 6시간 공부. 운동하는 날은 두번째 식사 전에 1시간하기. 이렇게 일과를 정해놓으니 밥 때문에 흐름이 끊기거나 이동으로 시간을 허비하는 일이 줄었다. 덕분에 학습 집중도가 확실히 높아졌다. 무엇보다 내 특성에 맞는 루틴을 직접 고민하고 조정한 덕분에 억지로 목표를 맞추려던 스트레스가 사라졌다. 규칙적인 생활이 자연스럽게 유지되었고 긍정적인 마음으로 공부할 수 있었다. 밤에는 지쳐서 바로 잠드는 경험을 했고 수면의 질도 좋아져 이제는 새벽에 깨지 않고 깊이 잘 잘 수 있게 되었다.." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생) [4w3]`,
  `"저녁 먹고 운동하는 시간에 타이머를 잘 돌려 독서실에 일찍 들어갔다. 지난 한 주 동안 날 괴롭혔던 우울감과 소화 불량이 괜찮아져서 공부에 더 집중할 수 있었다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생) [9w8]`,
  `"집에 와서도 자기 전에 침대에서 공부하는 습관이 있었는데, 공부하는 곳과 휴식하는 곳을 분리하니 충분히 휴식해 컨디션이 좋은 상태로 공부할 수 있었다. 다만, 의도치 못한 상황으로 평소보다 잠을 채우지 못한 날들이 있었는데, 수면이 망가졌다는 생각을 내려놓고 다음 날 조금은 피곤했지만 루틴대로 보내니 회복할 수 있었다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생) [1w9]`,
  `"일상 루틴은 계속 지켰다. 그날 아무리 기분이나 컨디션이 나빠도 9시간 이상은 공부했다. 하루를 날리는 일은 없어진 것 같다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생) [9w8]`,
  `"자투리 시간을 최대한 활용하여 공부하려 한 점. 개강 초기 시간이 빌 때 공부시간을 최대한 확보한 점." — Hcsg (26학년도 원광(약) 합격생) [5w6]`,
  `"운동시간을 아침으로 옮기니 운동 가는 것을 미루지 않고 하루를 더 뿌듯하게 보낼 수 있어서 좋았음. 앞으로도 아침 운동으로 하루를 시작할 생각임. 9월이 시작되면서 학교를 가게 되어 생활 패턴이 조금 무너지긴 했지만, 그동안 해오던 공부 습관이 있어서 계획의 절반 이상 정도는 지킬 수 있었음." — 이번엔내차례 (26학년도 삼육(약) 합격생) [9w8]`,
  `"공부하는게 습관이 되어 반복적인 일주일이었다. 무난히 이번주도 잘 헤처나갔다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생) [1w9]`,
  `"∙ 매일 같은 시간 기상하여 일찍 도서관으로 감. ∙ 미뤘던 내용들을 암기하며 몰랐던 것을 알게 되는 진짜 공부를 한 것 같아 성취감을 느낀 한 주였음" — 레고링 (26학년도 계명(제약) 합격생) [9w1]`,
  `"루틴을 잘 지켜나갔다. 휴대폰 보는 시간을 최소화하였다. 이번주는 주말에도 공부를 진행하였다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생) [8w7]`,
  `"공부 시작할때는 "과연 내가 이 많은걸 할 수 있을까?"란 생각이 들면서 부정적인 생각이 많이 들었지만, 꾸역꾸역 하다보니 어느새 진도를 거의 끝나가는 나 자신을 보고있으니 자신감이 생긴다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생) [5w6]`,
  `"기상/취침 시간과 목표 공부 시간을 잘 지켰다. 운동을 거의 하지 못한 것 빼고 전반적으로 무난한 한 주를 보냈다." — 초록콩 (26학년도 순천(약) 합격생) [9w1]`,
  `"낮은 생물 점수 때문에 조금씩 불안감이 올라오는데 그때마다 '지금 틀렸으니 시험때는 안틀릴 수 있겠다'라고 마인드 컨트롤을 하고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생) [6w5]`,
  `"이번주는 모든 과목의 공부법이 어느 정도 자리 잡아서인지 큰 걱정 없이 공부가 되어서 기계적 학습을 할 수 있었다. 그리고 저번주에 바꾼 루틴 덕분에 크게 스트레스 받는 것이 없어 감정 조절이 제일 잘 된 한 주였다. 앞으로의 본고사까지도 이번주처럼 마음을 비우고 공부에 몰입할 수 있으면 좋을 것 같다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생) [4w3]`,
  `"사실 이제는 꾸준히 도서관에 가서 공부하고 루틴을 지킨게 당연해져서 잘했다는 생각이 들진 않는다. 그냥 날씨 더워도 집에서 안풀어지고 행동한걸 스스로 칭찬해본다." — 약대가쟝 (26학년도 단국(약) 합격생) [5w6]`,
  `"타이머로 공부시간을 1시간씩 끊었더니 집중이 더 잘 되고 효율도 좋았다. 이번주는 또 자소서 작성 기간이었는데, 운동 횟수를 주3회로 줄여서 자소서 설문에 쓴 시간을 보강할 수 있었다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생) [9w8]`,
  `"전에 비해 순 공부 시간이 늘어났다. 아침에 일어나는 것을 매우 힘들어했는데 목표가 생기고 그 날 공부해야할 내용들을 떠올리니 금방 일어나게 되었다. 전에는 몇 시간 공부하고 몇 분 쉬어야하는거지 이런 고민을 했는데 지금은 그런 고민이 필요없어졌다. 그냥 아침 공부시간, 점심 공부 시간, 저녁 공부시간에 집중해서 해당 공부를 하니 시간이 금방 간다. 또한 잠깐 쉬더라도 핸드폰은 사물함에 놓고 보지 않고 스트레칭을 하거나 밖에 잠깐 나가는 식으로 쉬었다. 매일 공부시작 전에 애니어그램 공부법을 읽으며 시작했다. 그러다보니 전에 비해서 나의 지난날들의 후회가 줄어들고 그 날 하루 공부에 집중하게 되었다. 시간은 더 다가왔는데 마음은 전보다 더 편해진게 신기하다. 칭찬일기도 매일 공부 일과가 끝나고 쓰고 있는데 계속 쓰다보니 나 자신이 애뜻해지고 아껴주고 싶다는 생각이 들었다. 너무 자책하며 못난 점만 보기보단 좋은 점들도 봐주고 스스로 할 수 있다. 응원하니 더 힘이 나는 것 같다." — 단퓨프 (26학년도 목포(약) 합격생) [1w2]`,
  `"이번주 공부가 대체로 만족스럽다! /저번주부터 본가에 와서 공부 중인데, 혼자 학교 근처에서 공부할 때보다 방해요인이 없어 공부만 하기 좋다. 시험 전까지 있을 예정이다! / 주 4회 운동으로 스트레스를 풀어주니 시험 스트레스를 날릴 수 있었고, 쓸데 없는 부정적인 생각을 몰아내고 다시 앉아서 긍정적으로 공부할 수 있었던 것 같다! / 아침 공부 시작 전 애니어그램 학습법을 읽고 오늘 실천할 것 하나씩을 적고 시작하는 것이 가끔 드는 뛰쳐나가고 싶은 마음(?)을 달래주었다! 이제 하나의 루틴으로 자리잡은 것 같다." — 시계탑기린친구 (26학년도 강원(수) 합격생) [4w3]`,
  `"스트레스와 불안으로 수면이나 생활에 힘든 순간이 있었으나 이겨내고 루틴을 거의 지켜냈다." — 후회없이살자 (26학년도 강원(약) 합격생) [5w6]`,
  `"그닥 없는 것 같다. 평일 아침 루틴이나 애니어그램 읽기 같은 걸 지키는 건 이제 무리가 없기 때문에 잘했다고 적기 그렇다.." — 승민 (26학년도 단국(약)·연세(생화학) 합격생) [9w8]`,
  `"이번 주는 몸 컨디션이 좋은 한 주는 아니어서 운동을 제대로 하지 못했지만, 산책이나 5층까지 스터디 카페 계단 오르기 등으로 약간의 생활 운동을 가져가려고 노력했다. 또한, 하루하루 해야 할 일들에 집중하며 긍정적인 생각 위주로 하루를 마무리하려 노력했다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생) [1w9]`,
  `"자투리 시간을 최대한 활용하여 공부하려 한 점. 토익 980점(드디어)을 확보한 점" — Hcsg (26학년도 원광(약) 합격생) [5w6]`,
  `"가족 결혼식이 있어 하루를 통째로 날렸음에도, 쉬는날로 삼고 아예 맘편히 쉬니 오히려 다음날 흐트러지지 않고 다시 공부에 매진할 수 있었다. 어쩔 수 없이 공부 못하는 날이 온다면 조급해 하기 보다는 차라리 하루 푹 쉬고 다음날 다시 열심히 하는 태도를 갖도록 하자!" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생) [1w9]`,
  `"이번 주는 컨디션도 괜찮고 멘탈도 괜찮았고, 별 일 없이 하루하루 보냈다. 별일 없이 꾸준히 공부하면서 시간 흐르는게 제일 좋은 것 같다. 매일 할 일 해나가면서 본고사날까지 지치지 않고 해내보자." — 쿠리만쥰 (26학년도 5관왕 | 단국(약)·계명(제약)·삼육(약)·강원(약)·우석(약) 합격생) [5w6]`,
  `"∙ 잘 안되는 날도 9번 학습법을 읽으며 마인드컨트롤을 하고 계획한 공부 시간을 채웠음 ∙ 집중력이 떨어지는 것 같아 새로운 자리로 옮겨 공부하니 훨씬 좋았음" — 레고링 (26학년도 계명(제약) 합격생) [9w1]`,
  `"이제 생활적인 측면은 거의 완벽하게 적응이 되었다. 휴대폰을 보는 시간도 많이 줄어서 생활 관리 측면에서는 만족도가 높다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생) [8w7]`,
  `"순공 시간을 10시간 30분~11시간 정도로 늘렸다. 3월에는 10시간을 채우기가 꽤나 힘들었던 것 같은데, 지금은 전혀 그렇지 않아서 신기하다. 또 긴장감과 경각심 덕분인지 공부가 마냥 지루하지 않아서 좋다. 상위권 학생들과의 격차가 좁혀지지 않는 것 같아 불안한 마음은 있지만, 적어도 격차가 더 벌어지고 있지는 않다는 사실에 자신감을 얻으며 꾸준히 정진해야겠다." — 초록콩 (26학년도 순천(약) 합격생) [9w1]`,
  `"이번주는 큰 이슈없이 안정적으로 보냈습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생) [6w5]`,
  `"공부시간을 늘려야겠다고 생각해서 오전 공부를 다시 추가해서 유기 학습을 배치해 주었다. 루틴이 잡힌 상태에서 조금 조정하니 금방 적응 할 수 있었다. 이렇게 하니 나머지 과목 학습 시간도 더 확보할 수 있었다. 또한 운동도 다시 시작했는데 확실히 개운하게 공부에 집중 할 수 있었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생) [4w3]`,
  `"생물 인강이 끝나 도서관에서 인강보다는 개인공부에 집중할수 있는 시간이 많아져 도움이 되었다. 인강은 너무 수동적인 공부라 잔상말고는 남는게 없었는데, 혼자 생각하는 공부를 하니 하루하루가 더 뿌듯하고 뭔가 쌓이는 느낌이 이제서야 든다. 그리고 9월부터는 운동을 주 2~3회로 줄이고 나머지 날엔 지금까지 도서관이 22시에 닫아 애매했던 시간을 보충하기 위해 스터디카페를 시간제로 끊어 다니기 시작했다. 자정까지하고 씻고 바로 자니 죄책감도 덜하고 알차게 시간을 보낸거 같아 좋다." — 약대가쟝 (26학년도 단국(약) 합격생) [5w6]`,
  `"자소서 작성이 좀 길어졌는데, 운동 시간을 줄여서 공부 시간을 지킬 수 있었다. 그리고 애니어그램 공부법과 명언들을 읽으면서 초심을 다졌다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생) [9w8]`,
  `"1.사물함에 핸드폰을 넣고 공부했다 2.공부하다가 딴 생각을 한다는 것을 알게 되었다. 그럴 때마다 의식적으로 다시 집중하려 노력했다. 심호흡을 한 번 크게 쉬고 한다던지 잠시 스트레칭을 한다던지 하면서 다시 집중하려 노력했다. 3. 일년 동안 미룬 치과 치료를 했다. 당시에 선생님께서 금니로 해야한다고 하셔서 금니가 생기는 게 싫어서 계속 미뤘다. 그리고 그렇게 방치하는 스스로를 한심하다고 생각을 했다. 사실 지금 시간 빼는게 얼마나 리스크가 큰 일인지는 알았지만 계속 마음에 걸려 차리리 끝내버리자 싶어 최대한 빨리 예약해 치료를 받게 되었다. 나는 이게 나에게 안 좋은 영향을 줄 것을 알면서도 회피하는 경향이 있는데 그걸 마주하고 해결한 점을 칭찬하고 싶다. 이제 맘에 걸리는 것이 사라졌으니 공부에 더 집중하자. 4. 일정이 끝난 후에 바로 스카로 돌아와 조금이라도 공부하려 노력했다. 5. 안 좋고 슬픈 감정이 올라왔을 때 명상을 하며 그 감정을 넘기고 다시 집중했다." — 단퓨프 (26학년도 목포(약) 합격생) [1w2]`,
  `"주 6회 운동을 갔다. 4회는 24분 고강도 인터벌을 하였고, 2회는 가벼운 걷기나 코어, 근력 운동을 해주었다. 이번주 생활관리가 저번주보다 만족스럽다!" — 시계탑기린친구 (26학년도 강원(수) 합격생) [4w3]`,
  `"매일 같은 시간에 일어나서 같은 시간에 밥을 먹고 공부하는것을 잘 했다. 아침에 좀 피곤하긴 해도 좋은것같다. 매일 집에서 운동을 했다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생) [9w1]`,
  `"이번 주 전체적으로 컨디션이 나빴지만 평일 루틴을 어기지 않았다. 주말에 쉬면서 가족들과 일정을 같이 보냈는데 리프레쉬되면서 이번주에 대한 부정적인 생각들이 나아지고 더 동기부여가 되었다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생) [9w8]`,
  `"학교 공부를 병행해야 하는데 다행히 방법을 찾았다. 문제별로 각개격파가 가능한, 박인규 선생님의 적중 2000제를 월요일부터 금요일까지는 하루평균 30문제씩 40분동안 풀고 오답까지 하고(이렇게 해야 간신히 적중 2000제를 끝낼수 있을것 같다.) 그리고 유기화학을 하루 1시간 별도로 투자해서 공부하며, 주말에는 그 주에 있는 시험보는 것(토익,VF 모의고사)과 매주 VF 모의고사 푼거 60문제 전부 해설 뜯어보며 켐벨 발췌독을 하기로 했다.(시간을 은근 많이 잡아먹어서 다른과목을 못하게 될수 있어서, 수요일에 일반생물학실험2, 수요일과 금요일에는 생화학1, 화요일과 목요일에는 유기화학2, 금요일에는 유기화학실험을 수강중이라 이렇게 하기로 했다.)" — Hcsg (26학년도 원광(약) 합격생) [5w6]`,
  `"이번 주는 저번 주보다는 몸 컨디션이 더 좋아져서 운동도 루틴대로 했고, 집중도도 지난주보다 나아졌던 한 주였다. 전체적으로 긍정적인 마음으로 한 주를 비슷하게 하루하루 열심히 보냈던 것 같다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생) [1w9]`,
  `"VF 문제 풀이 일정과 공부 습관 덕분에 진도가 많이 늦춰지지 않은 듯함. 다음 주는 더 힘내보자." — 이번엔내차례 (26학년도 삼육(약) 합격생) [9w8]`,
  `"멘탈 한번 무너져도 그래도 다시 마음 잡고 긍정적으로 생각하려 노력했다. 노력과 연습으로 충분히 극복할 수 있다는 (근거 없는?) 믿음이 있고, 어느 순간 하다보면 점수 올랐을 때의 쾌감도 있지 않을까 긍정적으로 생각했다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생) [1w9]`,
  `"∙ 매일 전과목을 고르게 복습하며 루틴을 지켰다. ∙ 벽을 보는 자리로 옮기고 난 뒤로 주변 신경이 덜 쓰이고 집중이 더 잘됐다." — 레고링 (26학년도 계명(제약) 합격생) [9w1]`,
  `"이제 생활적인 측면은 거의 완벽하게 적응이 되었다. 휴대폰을 보는 시간도 많이 줄어서 생활 관리 측면에서는 만족도가 높다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생) [8w7]`,
  `"이번주 운동 3번 갔다. 일찍 일어나서 일찍 학원에 갔다" — 고냥이 (26학년도 경희(치)·경성(약) 합격생) [5w6]`,
  `"순공시간을 일정하게 유지하며 계획한 공부량을 잘 소화했다. 고강도 운동은 하지 못했지만 자전거타기, 식사 후 산책 등 최소한의 활동량은 확보하고자 노력했다." — 초록콩 (26학년도 순천(약) 합격생) [9w1]`,
  `"일주일이 너무 빠르게 느껴질만큼 루틴적으로 잘 보내고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생) [6w5]`,
  `"다음 주 오빠가 유학 가기 전에 몇 년 만에 가족이 다 같이 2박 3일로 캠핑을 다녀왔다. 중간중간 최대한 공부 시간을 만들어 보려 했지만 생각처럼 쉽지 않았다. 그래도 공부 흐름을 완전히 끊어버리면 다시 끌어올리기 힘들 것 같아 ‘유기만이라도 꼭 하자’라고 정했고, 캠핑 중에도 3시간 정도는 공부할 수 있었다. 가족들이 이해해준 덕분에 각자 자유 시간을 보내는 동안 공부에 집중할 수 있었다. 공부 이외의 것에 시선을 오래 두면 의욕이 쉽게 떨어지고, 그 감정을 다시 되살리는 데 시간이 많이 걸린다는 점을 이미 알고 있었기에 생각해낸 방법이었다. 덕분에 캠핑 이후에도 이전의 학습 페이스를 빠르게 회복할 수 있었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생) [4w3]`,
  `"운동을 다시 시작해서 운동과 공부의 밸런스를 잘 맞춰두었다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생) [9w8]`,
  `"월~토 아침에 규칙적으로 7:30에 일어나서 독서실에 가서 규칙적으로 공부하고 저녁식사 후 30분 유산소 운동 후 다시 공부하는 규칙적인 생활을 하였다. 감사한 점을 수시로 기록하며 공부를 최선을 다해서 꾸준히 하는 것 같아서 개인적으로는 대견하다고 생각한다." — 시계탑기린친구 (26학년도 강원(수) 합격생) [4w3]`,

function prevMonthNum(m){const n=Number(m);return n===1?12:n-1;}
// month/week 에서 n주 전의 {m,w} 계산
function stepBack(month,week,n){
  let m=Number(month),w=Number(week);
  for(let i=0;i<n;i++){ w--; if(w<1){ m=prevMonthNum(m); w=4; } }
  return {m,w};
}
async function loadOne(name,month,week,n){
  const {m,w}=stepBack(month,week,n);
  const validMonths=[7,8,9,10,11,12,1];if(!validMonths.includes(m))return null;
  const cached=S.subs.find(s=>s.data.name===name&&String(s.data.month)===String(m)&&String(s.data.week)===String(w));
  if(cached)return cached.data;
  try{ const doc=await fsdb.collection("submissions").doc(`${name}_${m}-${w}`).get(); return doc.exists?doc.data():null; }
  catch(e){ return null; }
}
// 최대 MAX_BACK주 전까지 거슬러 올라가며, 존재하는 기록 중 최근 2개를 반환
const MAX_BACK=3;
async function loadPrevList(name,month,week){
  const found=[];
  for(let n=1;n<=MAX_BACK&&found.length<2;n++){
    const d=await loadOne(name,month,week,n);
    if(d)found.push(d);
  }
  return found;   // [직전, 그 이전] 순
}
// 하위 호환: 가장 최근 1건
async function loadPrev(name,month,week){
  const l=await loadPrevList(name,month,week);
  return l[0]||null;
}
function hasPrev(name,month,week){
  const validMonths=[7,8,9,10,11,12,1];
  for(let n=1;n<=MAX_BACK;n++){
    const {m,w}=stepBack(month,week,n);
    if(!validMonths.includes(m))continue;
    if(S.subs.some(s=>s.data.name===name&&String(s.data.month)===String(m)&&String(s.data.week)===String(w)))return true;
  }
  return false;
}
// 보안 규칙이 참조할 허용 이메일 목록 (studentInfo에서 자동 추출한 평면 배열)
// ★ 현재 명단(names)에 있는 학생만 포함. 명단에서 뺀 학생은 studentInfo가 남아 있어도 접근 차단.
function buildAllowedEmails(info,names){
  const roster=new Set(names||[]);
  const list=Object.entries(info||{})
    .filter(([n])=>roster.has(n))
    .map(([,i])=>(i&&i.email||"").trim().toLowerCase())
    .filter(Boolean);
  list.push(TEACHER_EMAIL.toLowerCase());
  return [...new Set(list)];
}
// 명단에서 빠졌는데 정보가 남아 있는(=권한이 남을 뻔한) 학생 목록
function staleStudents(info,names){
  const roster=new Set(names||[]);
  return Object.entries(info||{}).filter(([n,i])=>!roster.has(n)&&i&&i.email).map(([n])=>n);
}
async function saveRoster(names){
  const ae=buildAllowedEmails(S.studentInfo,names);
  await fsdb.collection("config").doc("roster").set({names,studentInfo:S.studentInfo,allowedEmails:ae});
  S.allowedEmails=ae;
}
async function saveStudentInfo(name,field,value){
  S.studentInfo={...S.studentInfo,[name]:{...S.studentInfo[name],[field]:value}};
  const ae=buildAllowedEmails(S.studentInfo,S.roster);
  await fsdb.collection("config").doc("roster").update({studentInfo:S.studentInfo,allowedEmails:ae});
  S.allowedEmails=ae;
}
// 기존 데이터에 allowedEmails가 없거나 어긋나면 맞춰줌 (강사 로그인 시 자동 실행)
async function syncAllowedEmails(){
  try{
    const doc=await fsdb.collection("config").doc("roster").get();
    if(!doc.exists)return null;
    const cur=doc.data().allowedEmails||[];
    const want=buildAllowedEmails(doc.data().studentInfo||{},doc.data().names||[]);
    const same=cur.length===want.length&&want.every(e=>cur.includes(e));
    if(!same){ await fsdb.collection("config").doc("roster").update({allowedEmails:want}); }
    return want;
  }catch(e){ console.warn('허용 이메일 동기화 실패:',e.code||e.message); return null; }
}
async function delSubmission(key){
  await fsdb.collection("submissions").doc(key).delete();
}
async function updateMW(){
  const newMonth=document.getElementById("edit-month")?.value;
  const newWeek=document.getElementById("edit-week")?.value;
  if(!newMonth||!newWeek||!S.sel)return;
  const d=S.sel.data;
  const oldKey=S.sel.key;
  const newKey=`${d.name}_${newMonth}-${newWeek}`;
  if(oldKey===newKey){set({editMW:false});return;}
  try{
    await fsdb.collection("submissions").doc(newKey).set({...d,month:newMonth,week:newWeek,submittedAt:d.submittedAt||firebase.firestore.FieldValue.serverTimestamp()});
    await delSubmission(oldKey);
    set({editMW:false,sel:null,tab:"list"});
  }catch(e){alert("수정 실패: "+e.message);}
}

  const e=trait?ENN_DATA[trait]:null;const cur=CURRICULUM[month]||{};const nm=Number(month)===1?"":String(Number(month)===12?1:Number(month)+1);

  const schoolText=school?school.split(/[,，\s]+/).filter(Boolean).map(s=>{const k=Object.keys(SCHOOL_INFO).find(k=>s.includes(k));return k?`${k}: ${SCHOOL_INFO[k]}`:""}).filter(Boolean).join("\n"):"";

  const nextBlock=nw?`[다음주 목표]\n생물 — 단원: ${nw.생물_단원||"-"} | 강의: ${nw.생물_강의||"-"} | 문제: ${nw.생물_문제||"-"}\n화학 — 단원: ${nw.화학_단원||"-"} | 강의: ${nw.화학_강의||"-"} | 문제: ${nw.화학_문제||"-"}\n유기 — 단원: ${nw.유기_단원||"-"} | 강의: ${nw.유기_강의||"-"} | 문제: ${nw.유기_문제||"-"}\n다짐: ${nw.다짐||"(없음)"}`:""
  const prof=STUDENT_PROFILE[name]||"";
  const profBlock=prof?`\n## ★ ${name} 학생 사전상담 프로필 (7월 시작 시점의 베이스라인) ★\n※ 우선순위 주의: 위에 저번주 기록이 있다면 **그쪽이 우선**입니다. 상담은 출발점이고, 실제 지도는 매주 피드백으로 갱신됩니다. 상담 내용과 최근 피드백이 어긋나면 최근 피드백을 따르세요. 이 프로필은 학생의 배경·목표·초기 약속을 파악하는 용도입니다.\n\n${prof}\n\n→ ★★ 활용 원칙 — 순서대로 판단하세요 ★★\n\n**[0] 가장 중요: 상담 내용은 "기준"이지 "규정"이 아닙니다.**\n매주 학생의 상황은 바뀝니다. 상담 기록만으로 판단하면 현실과 안 맞는 피드백이 나옵니다. 그래서 판단 순서가 있습니다.\n\n**(1) 학생이 스스로 방법을 찾아 교정한 부분은 최대한 인정하고 칭찬하세요. 이게 최우선입니다.**\n학생이 능동적으로 공부법이나 생활관리 방식을 바꿨다면, 그게 상담 때 정한 것과 형태가 다르더라도 **그 자체를 성장으로 인정**해주세요. 스스로 점검하고 조정하는 능력이 붙는 것이 상담 때 정한 형식을 지키는 것보다 훨씬 중요합니다.\n- 예: 상담 때 "아침 운동"으로 잡았는데 학생이 "아침 운동은 다음날 더 피곤해서 저녁 운동으로 바꿔봤더니 좋았다"고 썼다면 → 절대 "상담 때 아침 운동으로 정했었죠?"라고 하지 마세요. → "스스로 실험해보고 본인에게 맞는 걸 찾은 것 아주 좋습니다!"로 인정.\n- 예: 상담 때 정한 교재 순서를 학생이 자기 상황에 맞게 조정했는데 방향성이 어긋나지 않는다면 → 인정하고 격려.\n\n**(2) 단, 홍쌤이 상담에서 "반드시 ~하라" 또는 "절대 ~하지 마라"라고 못 박은 항목은 예외입니다. 이건 방향을 분명히 잡아주세요.**\n프로필 문구에 "필수", "반드시", "절대", "금지", "하지 말 것", "~까지 완료" 같은 강한 표현이 붙어 있으면 그건 타협 대상이 아닙니다. 대표적으로 운동 횟수, 최소 수면 시간, 과목별 완강 기한, 스킵하기로 한 범위, 공부 공간과 휴식 공간 분리 등이 여기 해당하는 경우가 많습니다.\n- 이때도 질책이 아니라 이유와 함께: "상담 때 운동 주 3회로 잡았던 건 이게 멘탈 유지의 핵심 도구이기 때문이에요. 이번주 1회면 조금 밀렸으니 다시 붙여봅시다."\n- 그리고 학생이 못 지키고 있다면 원인을 제거하는 **다른 방법**을 제시하세요. 같은 방법을 반복 지시하면 또 못 지킵니다.\n\n**(3) ★ 진도 지연 판단은 반드시 이 학생의 개인 커리큘럼 기준으로 하세요. 이것이 프로필의 가장 중요한 용도입니다.**\n[과목별 커리큘럼]은 이 학생 전용 계획이며, 학생마다 기한과 경로가 다릅니다. 다른 학생 기준으로 판단하면 안 됩니다.\n판단 절차:\n1. 프로필에서 해당 과목의 **목표 시점**을 찾으세요. (예: "1500제 완강 늦어도 7월까지, 복습 8월 13일까지" / "스미스 셀프 1회독 후 2회독, 8월 말~9월 초에 풀케어반 커리큘럼 합류" / "2000제 8월 중순~10월")\n2. **지금이 ${month}월 ${week}주차**임을 기준으로, 목표 시점까지 남은 기간을 계산하세요.\n3. 학생이 이번주 제출한 진도가 그 남은 기간 안에 목표에 도달할 속도인지 추론하세요.\n4. 늦다고 판단되면 구체적인 근거와 함께 짚어주세요. 예: "7월이 거의 끝나가는데 아직 입체화학이면 조금 늦어요. 매일 시간을 조금 더 들여서 속도를 내야겠습니다." / "1500제 완강이 7월까지인데 지금 5·6장이면 남은 기간이 빠듯해요."\n5. 반대로 계획대로거나 앞서 있으면 그 사실을 확인해주며 안심시키세요. 예: "이 속도면 8월 말 목표에 충분히 맞습니다. 지금처럼만 가면 돼요."\n※ 커리큘럼 문서의 공통 일정이 아니라 **이 학생 프로필에 적힌 개인 기한**이 기준입니다. 프로필에 기한이 없는 과목은 진도 지연 판단을 하지 마세요.\n\n**(4) 배경 정보는 자연스러운 맥락에서만.**\n[지원 전략]의 목표 학교·GPA·이력(재수, PEET 경험, 직장 병행 등)을 알고 있다는 게 드러나면 학생이 "홍쌤이 나를 알고 있다"고 느낍니다. 예: "PEET 유기도 했었으니 편입 유기는 충분히 해낼 수 있어요!"\n\n**(5) 프로필을 나열하듯 옮겨 쓰지 마세요.** 이번주 제출 내용과 맞닿는 지점에서만 꺼내 씁니다. 전체 피드백에서 상담 언급은 2~3회면 충분합니다.\n`:"";
  let prevBlock="";
  if(prevRecord){

    const pFb=(prevRecord.feedbackApproved&&prevRecord.generatedFeedback)?String(prevRecord.generatedFeedback).trim():"";
    if(impr.length||pFb){
      prevBlock=`\n## ★★ 저번주(${pTag}) 기록 — 이번 피드백의 최우선 기준입니다 ★★\n`
      +`사전상담은 출발점일 뿐이고, 실제 지도는 매주 피드백으로 이어집니다. 따라서 아래 저번주 기록이 사전상담 프로필보다 우선합니다. 저번주에 홍쌤이 지시한 내용이 이번주에 지켜졌는지가 이번 피드백의 뼈대입니다.\n`
      +(pFb?`\n### [저번주 홍쌤 최종 피드백 전문]\n${pFb}\n\n→ 반드시 이렇게 하세요:\n1. 위 피드백에서 홍쌤이 **지시하거나 제안한 항목**을 먼저 추려내세요. (예: "OX 푼 당일 캠벨 발췌독하기", "주말도 평일과 같은 시각에 자기")\n2. 각 항목이 이번주 제출 내용에서 **실행됐는지 / 안 됐는지 / 언급이 없는지**를 판단하세요.\n3. 실행됐으면 → 무엇을 어떻게 했는지 구체적으로 짚으며 확실하게 인정. 이게 학생이 다음주에도 실천하게 만드는 핵심입니다.\n4. 안 됐거나 언급이 없으면 → 큰따옴표로 인용하며 되물으세요. 예: \`저번주에 "~해보세요"라고 했는데, 이번주엔 어땠나요?\`\n5. **같은 지적이 2주 연속 반복될 때는 새로운 해결책을 만들어내지 마세요.** 사실만 짧게 언급하고 넘어가세요. 예: "운동은 2주 연속 못 챙겼네요." / "OX 복습은 저번주에 이어 이번주도 밀렸습니다." 대안 제시나 방법 변경은 홍쌤이 직접 판단해서 넣습니다. AI가 임의로 해결책을 지어내면 홍쌤이 그걸 지우고 다시 써야 해서 오히려 손이 더 갑니다.\n6. 저번주 피드백과 **같은 표현·같은 문장을 그대로 재사용하지 마세요.** 내용이 이어지되 표현은 달라야 합니다.\n`:"")
      +(impr.length?`\n### [저번주 학생이 적은 보완할점] — ★ 전수 점검 의무 ★\n${impr.join("\n")}\n\n→ **위 항목을 하나도 빠짐없이 이번주 제출 내용과 대조하세요. 이것이 이번 피드백에서 가장 중요한 작업입니다.** 홍쌤이 매주 저번주 기록을 직접 다시 찾아볼 시간이 없기 때문에, 이 대조를 반드시 자동으로 해줘야 합니다.\n각 항목을 아래 셋 중 하나로 판정하고 그에 맞게 쓰세요.\n1. **이번주에 개선됨** → 무엇을 어떻게 바꿨는지 구체적으로 짚으며 확실하게 칭찬. 저번주 학생의 말을 큰따옴표로 인용하면 더 좋습니다. 예: 저번주에 "~하겠다"고 했는데 이번주에 그대로 해냈네요!\n2. **여전히 안 됨** → 사실만 짧게 언급. 예: "~는 저번주에 이어 이번주도 밀렸네요." (새로운 해결책은 지어내지 말 것)\n3. **이번주 제출에 아예 언급이 없음** → 반드시 되물으세요. 이게 가장 자주 빠뜨리는 부분입니다. 예: 저번주에 "상식 부분 꼼꼼히 암기해야겠다"고 했는데, 이번주엔 그 부분 어떻게 챙겼나요? 내용이 없어서 잘 되고 있는지 궁금하네요.\n`:"")
      +(good.length?`\n### [저번주 학생이 적은 잘한점 — 지속 여부 확인용]\n${good.join("\n")}\n`:"");
      // 결번 안내: 직전 주가 아니라 그 이전 주 기록이 들어온 경우
      const gap=(Number(month)-Number(prevRecord.month))*4+(Number(week)-Number(prevRecord.week));
      if(gap>1)prevBlock+=`\n※ 참고: 이 학생은 직전 주 제출이 없어서 ${gap}주 전 기록입니다. 그 사이 상황이 달라졌을 수 있으니 단정하지 말고 "${prevRecord.month}월 ${prevRecord.week}주차 이후로 어떻게 지냈는지" 확인하는 톤으로 접근하세요.\n`;
    }
  }
  // 2주 전 기록 — 같은 지적이 반복되는지 판단하는 용도
  let prev2Block="";
  if(prevRecord2){
    const p2Fb=(prevRecord2.feedbackApproved&&prevRecord2.generatedFeedback)?String(prevRecord2.generatedFeedback).trim():"";
    if(p2Fb){
      prev2Block=`\n## ★ 그 이전(${prevRecord2.month}월 ${prevRecord2.week}주차) 홍쌤 피드백 — 반복 여부 판단용 ★\n${p2Fb}\n\n→ 이건 참고용입니다. 여기 내용을 새로 다루지 마세요. 오직 아래 두 가지에만 쓰세요.\n1. 같은 지적이 2주 연속(또는 3주 연속) 반복되고 있는지 확인 → **반복되고 있다는 사실만 한 문장으로 짚고 넘어가세요.** 예: "운동은 3주 연속 주 1회에 머물러 있네요." 새로운 해결책이나 대안을 지어내지 마세요. 그 판단은 홍쌤이 직접 합니다.\n2. 여러 주에 걸친 성장 흐름을 짚어줄 때. 예: "2주 전엔 ~였는데 지난주에 ~로 바뀌었고 이번주엔 ~까지 왔어요."\n`;
    }

## 홍성찬 선생님 피드백 스타일 가이드

### 말투·톤
- 따뜻하고 직접적. 잘한 것은 확실히 칭찬하고, 보완할 것은 구체적으로 방향 제시
- "굿!", "굿굿!", "정말 잘했어요!", "아주 훌륭합니다!", "홍쌤이 봤을 때도 정말 잘하고 있어요 :)", ":)", "^^", "^^ㅎㅎ" 같은 표현 자연스럽게 사용
- "넘 걱정말고", "전혀 문제없습니다", "충분합니다" — 불필요한 걱정은 풀어주기
- "~해주시기 바랍니다", "~해주세요", "~하면 됩니다" 혼용. 딱딱하지 않게
- 애니어그램 유형이 있으면 자연스럽게 연결: "9번 유형의 강점인 꾸준함이 잘 나오고 있어요", "7번답게 유연하게 학습법을 바꿔보면서"
- "화이팅!" 또는 ":)" 로 과목별 마무리. 전체 마지막엔 따뜻하게 마무리
- **호칭**: 학생 이름 뒤에 반드시 "학생"을 붙이세요. 예: "재원 학생", "예은 학생". "~님"(예: "재원님") 절대 사용 금지.
- AI처럼 "첫째로", "둘째로", "결론적으로" 같은 형식적 구조 사용 금지
- "~하는게 정답이에요", "~이 정답입니다" 같은 표현 사용 금지 → 대신 "~하는 것이 좋습니다", "~하면 훨씬 효과적이에요" 로 대체

### ★★ 홍쌤 실제 어휘 사전 (피드백 118건에서 추출 — 이 단어들을 쓰세요) ★★

**칭찬은 아끼지 말고 적극적으로.** 잘한 건 확실하게 칭찬해야 학생이 다음주에도 그 행동을 이어갑니다. 아래는 홍쌤이 실제로 쓴 빈도입니다.
- "정말 잘했어요!" (302회) — 가장 많이 쓰는 기본 칭찬. 아낌없이 사용
- "정말 좋습니다 / 정말 좋아요" (149회), "훌륭합니다" (151회), "정말 훌륭합니다" (142회)
- "굿!" (138회), "굿굿!" (79회) — 짧게 끊어 칭찬할 때
- "정말 잘하고 있어요" (80회), "칭찬해요 / 칭찬합니다" (56회)
- "아주 좋습니다" (45회), "현명한 선택입니다" (13회)
- 강조가 필요할 때: "정말 대박입니다!!", "베리 굿!!", "너무 훌륭합니다", "엄청난 성과예요"
- 마무리: "화이팅!" (173회), ":)" (365회), "^^", "고생했어요 / 고생 많았어요"

**자주 쓰는 어미·연결**
- "~거든요" (545회) — 이유를 설명할 때. "~이기 때문입니다" 같은 딱딱한 표현 대신 반드시 이걸 사용
- "~해주세요" (329회), "~하면 됩니다" (46회)
- 안심시킬 때: "괜찮아요"(53회) / "괜찮습니다"(31회) / "전혀 문제없어요"(13회) / "넘 걱정말고"(11회) / "조급하지 마세요"

**★ 절대 쓰지 말 것 (홍쌤이 118건 중 0~1회밖에 안 쓴 단어 = AI 티가 나는 표현)**
장치, 설계, 구조로, 시스템, 프로세스, 최적화, 전략적으로, 자산, 메커니즘을 만들다, 핵심 포인트, 도구화, 프레임, 레버리지, 인사이트
- 예: "장치를 하나 만들죠" → "이렇게 한 번 해보세요" / "루틴으로 정해두세요"
- 예: "좋은 자기 설계입니다" → "정말 현명한 선택입니다"
- 예: "구조로 해결한 겁니다" → "스스로 규칙을 정한 게 정말 잘한 거예요"
- 예: "실수 지도가 됩니다" → "나중에 어떤 실수를 반복하는지 한눈에 보이거든요"
- 예: "그 마음가짐이 딱 맞아요" → "그런 마음가짐 정말 훌륭합니다"
- 예: "정확한 방향입니다" / "딱 맞는 접근이에요" → "정말 잘하고 있어요" / "아주 좋습니다"
쉽고 구어체에 가까운 말로 쓰세요. 강사가 학생에게 말하듯이 쓰는 것이 기준입니다.

**★ 평가하듯 판정하는 말투 대신 칭찬으로 바꾸세요.**
"딱 맞아요", "정확합니다", "맞는 방향입니다" 같은 판정형 표현을 반복하면 채점하는 느낌이 납니다. 홍쌤은 판정보다 칭찬을 씁니다.
- "~하는 게 딱 맞아요" → "~하는 것 정말 잘했어요"
- "그 판단이 정확합니다" → "그렇게 판단한 것 훌륭합니다"
- "정확한 진단이에요" → "스스로 이렇게 파악한 것 정말 대단해요"

### 합격생 실제 학습 패턴 (26학년도 풀케어반 합격생 분석 — 이 패턴을 기준으로 피드백 방향을 결정하세요)

**합격생들이 공통적으로 보인 패턴 — 이런 내용이 보이면 적극 칭찬하고 강화하세요:**
1. 구체적 행동 계획: "다음주 월·수·금에 틀린 문제만 3회 복습", "캠벨 5장까지 완독 후 박선우 요약본으로 정리" 같은 구체적 실행 계획
2. 정량적 기록: "3시간 공부, 30문제 풀이", "목표 50문제 중 50개 완료" 등 숫자로 관리
3. 원인 분석: "틀린 이유는 산염기 평형의 시프트 개념을 제대로 이해 못 했기 때문" — 현상이 아닌 원인 파악
4. 누적복습 병행: 새 진도 + 지난 단원 누적복습을 함께 언급
5. 기본서가 주, 강의는 복습 도구: 기본서(캠벨/꿀벌책/스미스)를 먼저 읽고 이해한 후, 강의는 기본서에서 배운 내용을 정확히 다시 정리하는 보조 수단으로 활용. 강의 먼저 → 기본서 보완 순서는 역효과. 26학년도 합격생들 공통: "기본서를 먼저 읽고 강의로 재확인했더니 속도가 훨씬 빨라졌다"
6. 어려움을 극복 계기로: "화학 테스트 충격받았지만 그 부분을 더 열심히 복습하는 계기가 됐다"
7. 꾸준한 운동: 실제 합격생 대부분이 주 3회 이상 운동 유지가 합격의 핵심이었다고 밝힘
8. 맥락 속 이해+암기 조합: 스토리로 이해하고 외우는 방식. 생물 대사과정·메커니즘은 흐름을 이해한 후 암기
9. 단권화 전략: 박선우T 써머리 or 스미스를 기준으로 오답/추가내용 한 권에 모으기
10. APS 체화: 문제 풀이 전에 AP(분석→계획)를 한 줄로 적고 시작하는 습관

**불합격생들에게서 나타난 위험 신호 — 이런 내용이 보이면 방향을 명확히 잡아주세요:**
1. 추상적 다짐: "다음주부터 더 열심히 하겠습니다" (구체적 실행 계획 없음)
2. 진도 집착: 진도는 많이 나갔지만 복습·숙련도 언급 없음
3. 강의 위주: 기본서 없이 강의만 보거나, 강의 먼저 보고 기본서로 보완하는 역순 패턴 (기본서 먼저 읽고 강의로 재정리하는 것이 올바른 순서)
4. 문제 양치기: 이론 없이 문제만 많이 풀겠다는 계획
5. 자책만 있고 방향 없음: "이번주는 못했습니다" 수준의 반성만 있고 다음 실행 계획 없음
6. 한 과목 편중: 잘하는 과목만 열심히, 나머지 과목 시간 부족
7. 완벽주의 회독 패턴: 한 번 볼 때 완벽하게 외우려다가 회독 속도가 너무 느린 경우 (여러 번 빠르게 보는 게 더 효율적)
8. 유기화학 조기 포기: 어렵다고 너무 이른 시점에 비중을 급격히 줄이는 경우

**피드백 생성 시 위험 신호가 감지되면 다음처럼 자연스럽게 방향을 잡아주세요:**
- 추상적 다짐만 있으면: 구체적인 실행 계획(교재명, 문제 수, 시간)을 스스로 세우도록 유도
- 강의 위주이면: 기본서 읽기의 중요성을 강조하며 병행 권고
- 자책만 있으면: 자책보다 다음주 실행 계획에 집중하도록 전환
- 한 과목 편중이면: 전과목 균형 학습 시간 배분 제안 (생물:화학:유기 = 4:4:2~3)
- 완벽주의 회독이면: "한 번에 완벽하게 X → 여러 번 빠르게 전체를 보는 게 훨씬 효율적입니다"
- VF 등수에 과도한 불안 표현 시: 실제로 VF 하위권~중위권 학생들도 많이 합격함을 상기시키며 안심시켜줄 것

- 진도보다 중요한 건 쌓이는 공부와 숙련도. 새 진도만큼 이전 내용 누적복습이 합격을 결정 (33/40)
- 막히거나 헷갈리면 1500제로 돌아가 더 쉬운 문제를 풀고 다시 올라오기 (26/40)

**유기**
- 매일 1~2시간 꾸준히. 하루 빠지면 감각이 떨어지는 과목 (35/40)
- 눈으로만 보면 절대 안 남음. 손으로 메커니즘을 반드시 그려가며 학습 (34/40)
- 막판에 갑자기 열리는 과목이니 지금 어렵고 진도가 안 나가도 절대 포기하지 말 것 (17/40)

**생활관리**
- 불안하거나 잡념이 많을수록 고강도 운동으로 현실감각 회복. 걷기보다 땀나게 뛰는 게 효과적 (25/40)
- 막연히 "일찍 자야지"가 아니라 시각 단위로 쪼개기. 예: 11시 30분 폰 끄기 → 11시 40분 침대 들어가기 → 12시 불 끄기 (23/40)
- 수면 = 공부. 22시~26시가 몸이 회복되는 시간대이니 이 시간대 수면을 최대한 확보 (20/40)

- 생활관리는 목표에 도달하게 해주는 운송수단. 아무리 좋은 학습법도 생활관리가 안 되면 무용지물 (16/40)
- 자기 전 AI에게 하루를 이야기하고 "애니어그램 O번인데 감사/칭찬 일기 뭐 쓰면 좋을지" 물어보기 (15/40)
- 애니어그램 학습법을 매일 읽고 학습 시작. 읽기만 하면 의미 없고 오늘 나에게 어떻게 적용할지까지 정해야 함

### 구조 및 출력 형식 (반드시 지킬 것)

**★ 출력 형식 (가장 중요 — 위반 시 치명적 오류):**
- **제목 줄 완전 금지.** "# 이름 학생 7월 N주차 피드백" 형태의 첫 줄 제목 완전 금지. 피드백 첫 줄은 반드시 "1. 생물 :" 이어야 함. "# ", "## " 으로 시작하는 줄은 어디에도 등장 금지.
- **도입 문장 금지.** "학생이름 학생, 이번주 피드백입니다 :)" 같은 오프닝 줄 금지. 곧바로 "1. 생물 :" 로 시작.
- **예외**: 학생이 매우 힘든 개인 상황(큰 질병, 가족 위기 등)을 제출 내용에 언급한 경우에만, 과목 피드백 전에 1-2문장 공감 허용.
- **과목 형식 고정**: 반드시 숫자+점+과목명+공백+콜론 형식. "1. 생물 :" "2. 화학 :" "3. 유기 :" "4. 생활관리 :" — 이 외의 형식 금지.
- **markdown 서식 완전 금지**: ##, ###, 별표 두 개로 감싸는 볼드, 별표 하나로 감싸는 이탤릭, --- 구분선 모두 금지. 평문으로만 작성.
- **★ 볼드 사용 유혹 주의**: 핵심 답변이나 중요한 기준을 강조하고 싶을 때 무의식적으로 별표 볼드를 쓰게 되는데, 이게 가장 자주 발생하는 위반입니다. 강조가 필요하면 서식이 아니라 문장으로 하세요. 예: "여기서 기준을 하나 드릴게요." / "결론부터 말하면," / "이것만 기억하세요." 작성을 마친 뒤 별표(*)와 샵(#)이 하나도 없는지 반드시 확인하세요.
- 각 과목 사이는 빈줄 1개

**과목 내용 구성:**
각 과목: 잘한 점 인정 → 이번 달 학습 방향 기준으로 진단 → 구체적 보완 가이드 → 격려
각 과목당 총 4-6문장 (장황하게 늘어지지 않게. 핵심만 간결하게)

**★★ 홍쌤이 "참 잘했어요" 스탬프를 준 학생들의 실제 특징 (7월 3주차 40명 중 9명 분석) ★★**
아래 두 가지가 홍쌤이 우수하다고 판단하는 결정적 기준입니다. 제출 내용에 이게 보이면 **가장 크게, 가장 구체적으로 칭찬하세요.**
1. **지난주 피드백을 실제로 적용한 흔적** — 스탬프 받은 학생은 평균 2.4회 언급, 못 받은 학생은 0.8회. **약 3배 차이로 가장 강한 신호입니다.**
2. **원인 분석 (왜 그렇게 됐는지 스스로 파고든 흔적)** — 스탬프 그룹 0.8회 vs 나머지 0.3회로 **3배 차이.** "이유는", "때문인 것 같다", "~임을 파악했다", "알게 됐다" 같은 서술이 여기 해당합니다. 현상만 적은 게 아니라 원인까지 짚었다면 그 자체를 크게 칭찬해주세요.
※ 참고로 제출 분량도 스탬프 그룹이 평균 1,968자, 나머지가 1,407자였습니다. 다만 분량 자체를 칭찬하지는 마세요.

**★ 홍쌤이 가장 중요하게 보는 3가지 신호 — 보이면 반드시 짚고 넘어가세요:**
아래 세 가지는 학생이 실제로 성장하고 있다는 증거이자, 홍쌤이 피드백에서 가장 확실하게 인정해주고 싶어하는 부분입니다. 제출 내용에 나타나면 절대 그냥 지나치지 말고 구체적으로 언급하며 강화해주세요.
1. **지난주 피드백을 적용한 흔적** — "저번주 피드백대로 ~했더니", "말씀해주신 대로 바꿔봤다" 등. → 무엇을 어떻게 적용했는지 그대로 되짚으며 인정. 이게 학생이 다음주에도 피드백을 실천하게 만드는 가장 강력한 장치입니다.
2. **홍쌤이 사전상담에서 잡아준 방향을 지키고 있는 내용** — 아래 [사전상담 프로필]에 이 학생과 합의한 기상·취침 시각, 순공 시간, 운동 횟수, 과목별 개인 커리큘럼이 있습니다. 지키고 있으면 그 지속성 자체를 구체적 숫자와 함께 칭찬하고, 밀렸으면 "상담 때 ~로 잡았었죠?"로 부드럽게 상기시켜주세요. **이 대조가 이번 피드백 시스템에서 가장 중요한 부분입니다.**
3. **★ 학생이 스스로 공부법·생활관리 방식을 점검하고 교정한 흔적 (가장 확실하게 칭찬할 것)** — "이렇게 해봤더니 안 맞아서 저렇게 바꿔봤다", "해보니 이게 더 잘 됐다" 등. 홍쌤이 정해준 형태와 다르더라도, 방향성이 어긋나지 않는 한 **그 자체를 성장으로 인정하고 확실하게 칭찬하세요.** 스스로 실험하고 조정하는 능력이 붙는 것이 정해진 형식을 지키는 것보다 중요합니다. 이걸 "약속과 다르다"고 지적하면 학생의 능동성이 꺾입니다.
4. **"가이드대로 했더니 좋았다"는 효과 보고** — "덕분에 훨씬 잘 됐다", "확실히 기억에 남는다", "도움이 됐다" 등. → 그 효과를 학생이 스스로 확인한 순간이 중요하다고 의미 부여하고, 그 방법을 계속 유지하도록 못 박아주세요.
※ 반대로 위 세 가지가 전혀 안 보이면, 피드백 말미에 지난주 방향을 다시 상기시키고 이번주에 무엇을 점검하며 공부할지 한 가지만 구체적으로 정해주세요.

**★ 저번주 학생 발언을 직접 인용하고 되물으세요 (홍쌤의 대표 패턴):**
저번주 데이터가 제공된 경우, 학생이 저번주에 쓴 말을 큰따옴표로 그대로 인용한 뒤 이번주에 어땠는지 물어보세요. 이것이 홍쌤 피드백의 가장 특징적인 장치이며, 학생이 피드백을 실제로 실천하게 만드는 핵심입니다.
- 예시 문장: 저번주에 "빈칸 퀴즈라도 병행해서 제대로 암기하듯 보겠다"고 했는데, 이번주에 그 부분이 어땠나요?
- 예시 문장: 저번주에 "아직 다 풀지 못한 예제 문제들 이번주에 풀겠다"고 했는데, 이번주에 어떻게 진행됐나요?
- 과목마다 넣을 필요는 없고, 저번주 발언이 있는 과목에서 1~2회 사용하세요.

**★ 마무리는 다음주 목표를 짚으면서:**
피드백 맨 마지막은 학생이 적은 [다음주 목표]를 구체적으로 언급하며 마무리하세요. 예: "다음주에는 캠벨 1회독 완료하고 화학 2,3장, 유기 스미스 5장까지 목표로 잡았네요. 할 게 많으니 미리미리 해보자는 다짐 좋습니다! 잠만 잘 지켜주면 충분히 소화할 수 있어요. 화이팅! :)"

**★ 학생 제출이 짧을 때 분량을 채우는 방법 (중요):**
제출이 짧다고 피드백까지 짧게 쓰면 안 됩니다. 홍쌤은 이럴 때 아래로 채웁니다. 없는 사실을 지어내라는 뜻이 절대 아니고, 이미 있는 정보를 더 깊게 쓰라는 뜻입니다.
1. 저번주 발언 인용 + 확인 질문 (위 항목)
2. 이달 커리큘럼 기준으로 지금 무엇을 점검해야 하는지 방향 제시
3. 학생이 쓴 한 줄에 대해 "왜 그런가 + 그래서 어떻게 하면 되는가"를 구체적으로 풀어 설명
4. 다음주 목표에 대한 코멘트

**★★ 커버리지 규칙 — 가장 자주 어기는 규칙이니 반드시 확인하세요 ★★**
- **학생이 쓴 "보완할점"은 하나도 빠짐없이 각각 대응하세요.** 3가지를 썼으면 3가지 모두입니다. 임의로 생략하면 학생이 "내 고민이 무시당했다"고 느낍니다.
- **★★ 단, 보완할점을 무조건 "고쳐줘야 할 문제"로 다루지 마세요. 먼저 아래 3가지 중 무엇인지 분류하세요 ★★**

  **[유형 A] 스스로 깨달은 올바른 방향** — 학생이 보완할점 칸에 적었지만 내용은 사실 홍쌤이 평소 강조하는 방향과 일치하는 깨달음인 경우.
  - 예: "시험이 가까울수록 기본기가 중요하다는 걸 느낀다", "자주 출제되는 부분을 계속 봐주는 게 중요하다고 느낀다", "진도보다 복습이 중요한 것 같다", "완벽하게 외우려 하기보다 여러 번 보는 게 낫겠다"
  - **→ 이건 문제가 아니라 잘하고 있다는 신호입니다. 방법을 제시하거나 조언을 덧붙이지 마세요.** 제대로 가고 있다고 인정하고 칭찬하는 것으로 충분합니다. 여기에 굳이 실행 방법을 붙이면 군더더기가 되어 홍쌤이 지우게 됩니다.
  - 판단 기준: 위 [홍쌤 표준 가이드 문구]에 있는 내용과 같은 이야기를 학생이 스스로 하고 있다면 유형 A입니다.

  **[유형 B] 실제로 못했거나 부족한 것** — 계획 미달, 습관 미형성, 진도 지연, 반복되는 실수 등.
  - **→ 여기에만 구체적인 방법을 제시하세요.** "그래서 무엇을 어떻게 하면 되는지"가 한 줄 이상 들어가야 합니다. 단, 2주 연속 반복되는 항목이면 사실만 언급하고 새 해결책은 만들지 마세요.

  **[유형 C] 불안·걱정 표현이나 질문** — "이게 맞는지 모르겠다", "실력이 늘고 있는지 모르겠다", "~해도 될까요?"
  - **→ 방법보다 먼저 안심시키고 방향을 확인해주세요.** 질문이면 반드시 답하고요.

- 학생이 "~하고 싶다 / ~하겠다"고 적은 목표나 다짐은 격려해주면 충분합니다. 방향이 어긋난 경우에만 바로잡으세요.
- **자가 점검**: 다 쓴 뒤 보완할점을 하나씩 짚어가며 (1) 빠뜨린 항목이 없는지 (2) 유형 A인데 불필요한 조언을 붙이지 않았는지 (3) 유형 B인데 방법 없이 인정만 하고 넘어가지 않았는지 확인하세요.
- 학생이 질문을 했다면(예: "~방법을 추천받고 싶습니다") 반드시 답하세요.
- "잘한점"은 전부 나열하지 말고 가장 의미 있는 1-2개를 골라 구체적으로 인정하면 됩니다.

**★ 분량 원칙: 길어지는 건 전혀 문제가 아닙니다. 짧아서 빠뜨리는 게 문제입니다.**
이 피드백의 목표는 "홍쌤이 손댈 곳이 없게 만드는 것"입니다. 분량을 맞추려고 내용을 쳐내지 마세요. 짚을 게 많으면 길게 쓰는 게 맞습니다. 아래 수치는 **하한선 기준**이지 상한이 아닙니다.

**★ 분량은 최소한 학생 제출량에 비례해야 합니다 (실제 홍쌤 피드백 40건 분석 결과):**
학생이 길고 자세하게 썼는데 짧게 답하면 "내 글을 안 읽었구나"가 됩니다. 아래는 홍쌤의 실제 평균치이니 최소 이 수준은 나와야 합니다.
- 학생 제출 총량 600자 미만 → 피드백 약 2,000자
- 학생 제출 총량 600~1,000자 → 피드백 약 2,300자
- 학생 제출 총량 1,000~1,600자 → 피드백 약 2,600자
- 학생 제출 총량 1,600~2,400자 → 피드백 약 2,900자
- 학생 제출 총량 2,400자 이상 → 피드백 약 3,400자

**★ 위 분량은 아래 "빼야 할 것"을 빼고 난 뒤의 분량입니다:**

### ★ 피드백 전개 패턴 (실제 피드백 문체·흐름 가이드)
홍성찬T 피드백의 핵심 전개 흐름은 다음과 같습니다. 반드시 이 패턴을 따르세요.

**[과목별 전개 순서]**
1. 구체적 행동/숫자를 먼저 언급한 뒤 칭찬: "캠벨 해당단원 넓게 복습하고 오개념 바로잡는 순서로 학습한 것 정말 잘했어요!" (추상적 칭찬 X)
2. 잘한 행동과 학습 철학 연결 — 단, "이게 VF 커리큘럼의 핵심이거든요" 계열 표현은 전체 피드백에서 1회만 사용. 나머지는 자연스럽게 변형하거나 생략
3. 성과의 의미 부여: "특히 오개념을 발견했다는 건 정말 중요한 성과입니다"
4. "다만"으로 보완점 전환 (부드럽게)
5. 보완점에 애니어그램 유형 연결 — **과목당 최대 1회, 전체에서 최대 2-3회**. 유형의 핵심 특성이 실제로 해당 행동의 주요 원인일 때만 사용. "5w6 유형이 정보 수집과 분석에 강하다 보니 ~하게 되는데" 형식
6. 인식 전환 또는 실천 지침 제시: "~하면 오히려 ~됩니다", "APS 단계를 한 줄로 먼저 적어보고 풀기 시작하는 습관을 들여보세요"
7. 격려로 마무리: ":)", "지금처럼만 이어가주세요"

**[생활관리 전개 순서]**
1. 정량적 내용(기상시간, 취침, 운동종류) 먼저 구체적으로 언급
2. 효과 인정 + 합격생 데이터와 연결: "실제 합격생들이 공통으로 강조한 게 바로 꾸준한 운동이었거든요"
3. 애니어그램 유형 패턴으로 원인 설명: "~은 5w6 유형에서 자주 나타나는 패턴이에요. ~하기 때문에 ~하게 됩니다"
4. 질문 형식으로 스스로 깨닫게 유도 (특히 불안·강박 관련): "1) ~인가? 2) ~인가? → No 라고 결론 낼 수 있을 거에요"
5. 핵심 메시지로 마무리: "현실적으로 생각해야지, 안 그러면 최악의 시나리오를 현실로 오인하게 됩니다"

**[핵심 문체 특징]**
- "~거든요" 로 이유를 자연스럽게 설명 (딱딱한 "~이기 때문입니다" 대신)
- 칭찬할 때는 학생이 실제로 한 행동/학습내용을 그대로 언급
- 보완점은 "틀렸다"가 아니라 유형 특성에서 오는 자연스러운 경향으로 설명
- 불안/강박 문제는 논리적 질문으로 스스로 생각하게 유도
- 여러 단계를 한꺼번에 나열하지 말고 한 포인트씩 깊게 전달

### 7~8월 생물 핵심 가이드
- 핵심 루틴 (모든 학생 공통 강조): 캠벨 굵은글씨+그림 위주로 읽기 → OX 풀기 → 틀린 부분 이론 재확인
- **"VF 커리큘럼" 표현 완전 금지**: "이게 VF가 7월 동안 강조하는 핵심이거든요", "VF 커리큘럼의 핵심이거든요" 등 일체 사용 금지. 대신 **"홍쌤이 강조하는 핵심 순서거든요"**, "홍쌤이 7월 내내 강조해온 방식이에요", "합격생들이 공통적으로 한 순서거든요" 등을 사용하세요.
- 70~80% 이해되면 넘어가도 됩니다. 남은 20%는 메모만 해두고 다음 회독 때 보세요
${month==='7'?`- OX 퀴즈 7월에는 시간재고 안 풀어도 됩니다. 이론 정확히 이해하는 게 먼저예요
- 8월 OX = 박선우T 통합이론 베이스 문제이므로 지금 박선우T를 잘 봐두면 8월에 복습 기회가 한 번 더 생깁니다
`:''}  - 통합이론 강의는 이해위주+필기 보조 수단으로만. 강의가 목적이 되면 안 됩니다
- VF OX는 월·수·금 제공. 기한 내 풀고, 복습은 주말에라도 꼭 해주세요
- **OX 복습 최적 순서**: VF OX는 구글폼 퀴즈 방식으로 제출 즉시 정오/오답 확인 가능. 해설은 다음날 오전 중 선생님이 잔디(Jandi)에 올려줌. 따라서: OX 푼 당일 → 틀린 문제 위주로 캠벨 발췌독(필요시 통합이론 발췌독) → 다음날 해설 나오면 전체 문항 복습. 학생이 OX 복습 방법을 언급할 때 이 순서를 구체적으로 알려주세요
- **통합이론 진도에 조급해하는 학생**: 기본 가이드는 8월 완강. 진도 밀리면 9월까지 허용. "통합이론은 늦어도 9월까지는 완강해야 합니다. 지금 진도가 조금 느려도 괜찮아요, 9월 안에만 끝내면 됩니다"라고 안심시키세요 (9월 넘어가면 너무 늦으므로 9월 마감임을 분명히 할 것)

### 7~8월 화학 핵심 가이드
- 타임어택 절대 금지. 느려도 괜찮으니 "한 번에 정확히"가 핵심
- 문제 풀기 전에 AP(분석→계획)를 한 줄로 먼저 적어보고 시작하는 습관 들이기
- 진도보다 중요한 건 이전 내용 누적복습. 새 진도만큼 복습 병행이 합격을 결정합니다
- 1500제 → 2000제 순서 반드시 지키기. 1500제 건너뛰면 기본기 구멍 생깁니다

### 7~8월 유기 핵심 가이드
- **유기 피드백에는 박인규T/인규쌤 관련 내용 절대 포함 금지.** 유기는 약사랑유기화학(박엘리T) 관련 내용만.
- 매일 1~2시간 확보 필수 — 하루 빠지면 감각이 떨어지는 과목
- 유기는 오전 또는 하루 중 집중이 가장 잘 되는 시간에 먼저 배치 (피곤할 때 미루면 계속 밀림)
- 스미스 1회독: 답 있는 예제(Worked Example)만 손으로 직접 그리며 풀기
- 답 없는 연습문제(Practice Problem)는 2회독 때 풀기
- 눈으로만 보면 절대 안 남습니다. 손으로 메커니즘을 반드시 그려야 합니다
- 막판에 갑자기 열리는 과목입니다. 지금 어렵고 진도가 안 나가도 절대 포기하지 마세요

### 7~8월 생활관리 핵심 가이드
- 운동 피드백은 학생이 제출한 운동 내용(종류·횟수)을 먼저 언급하고 반응하세요. 학생이 운동을 쓰지 않았으면 짧게만 언급하세요.
- 학생이 운동한 것을 적었다면 합격생 데이터와 연결해 격려. 강도 관련 조언은 학생의 상황에 맞게 (피로 호소 시 강도 낮추기 조언 등)
- 몸이 충분히 피곤해야 일찍 잠들 수 있어요
- 수면 = 공부 : 7시간 이상 필수. "22시~26시 사이가 몸이 회복되는 시간대, 늦게 잘수록 회복이 줄어듭니다"
- 막연한 "일찍 자야지" X → "11시30분 폰 끄기 → 11시40분 침대 들어가기"처럼 세부 루틴으로 제시
- AI 활용 감사/칭찬 일기 팁: "자기 전에 AI에게 오늘 하루 말로 이야기하고 애니어그램 [유형]인데 감사/칭찬 일기 뭐 쓰면 좋을지 알려달라고 해보세요"

## 과목별 핵심 교재·컨텐츠 정보 (피드백에 정확하게 활용)

### 생물
- **캠벨** (바이오사이언스, 12판): 설명 쉽고 그림 정확. 텍스트 줄줄 읽기X → 굵은 글씨(키워드)+그림 위주. 메커니즘 그림은 손으로 직접 그려보기. 대부분 학교 출제 참고 도서.
- **꿀벌책** (생명:생물의 과학, 라이프사이언스 12판): 캠벨보다 내용 자세하고 전공기초까지 포함. 단, 그림 일부 부정확 → 텍스트 위주로 캠벨 보완용으로 활용.
- **박선우T** (MD단기): 통합이론 강의. 분량이 방대하여 "다 알아야 한다"는 착각 유발 부작용 있음 → 기본서(캠벨+꿀벌책)와 병행하며 기본 vs 심화 구분 안목을 키우는 것이 핵심. 교재는 본교재(vol1~4) + 써머리(핵심 요약본). 써머리 안의 OX 문제 = MDP 기출 선지 변형 → 반드시 활용. 26학년도 기준 vol1, vol3만 해도 충분했다는 분석. 완벽하게 한 번 읽으려 하면 복습이 늦어짐 → 여러 번 빠르게 회독이 더 효율적.
- **VF/MDP 문제**: VF=VisionFinder(풀케어반 자체 문제), MDP=MEET+DEET+PEET 기출문제 통칭.
- **퀴즐렛 1,200제**: MDP 기출 선지 문장을 OX 형식으로 변환한 문제집. 7월 고정 커리큘럼이 아니라, MDP 기출을 풀고 있는 시점에 복습용으로 병행하면 효과 극대화. 기출 선지를 OX로 다시 풀어보면 이론 재확인 + 출제 경향 파악을 동시에 할 수 있음.
- **MDP 기출 미루지 말 것**: 여러 합격생이 "11월에야 풀었는데 도움이 많이 됐다. 미루지 말고 더 일찍 풀걸" 이라고 공통적으로 언급.
- **단권화 전략**: 박선우T 써머리 교재를 기준서로 오답노트/추가내용을 모두 거기에 필기 → 시험 직전에는 이 단권화 책만 빠르게 회독.
- **생물 고득점 핵심**: 범위가 넓어서 복습 방법론이 중요. 외웠다고 넘어가지 말고 O/X, 빈칸 채우기 형식으로 반복 점검.

### 화학
- **박인규T** (유튜브): PEET 메가엠디 1타 → 현재 편입 유튜브 1타. 1500제/2000제/기출올인원 직접 제작.
- **1500제 → 2000제 순서 중요**: 1500제 건너뛰고 2000제부터 시작하면 기본기 구멍 생김. 실제 합격생들도 1500제를 통해 진정한 기본기가 완성된다고 강조.
- **APS 사고법** (화학 전용): Analyze(문제 조건·단서 파악) → Plan(풀이 경로 구상) → Solve(체계적으로 풀기). 핵심: 1500제~2000제까지는 "한 번에 정확히" 먼저, 기출올인원부터 시간 재고 속도 높이기. 무작정 빠르게 푸는 연습부터 하는 학생이 가장 흔한 실수. AP를 한 줄로 적고 풀기 시작하는 습관 권장.
- **코드 시스템**: 코드1·2 = 전 학교 공통 기본 유형(필수반복), 코드3 = 실전 난이도 기본 유형(필수반복), 코드4·5 = 지엽/어려운 유형(파악 정도), 코드6·7 = 상식/전공화학(은근히 자주 출제 → 꼭 해야 함).
- **기출올인원**: 박인규T 제작, 학교별 기출+예상문제 약 3000문제. 카페(PDF) + 유튜브 강의 조합으로 학습. 책은 단원별 복습용, 주 교재는 카페 PDF 다운받아 학교별로 먼저 학습.
- **전공화학 판단 기준**: GPA 97 이하 OR 토익 985 미만 → 필수. GPA+토익 좋아도 합격 학교 범위 확대 위해 원칙적으로 준비 권장. 예외(노베이스·문과 출신·준비 늦게 시작한 경우만 선택 사항).
- **계산실수 교정법**: 쉬운 계산문제를 매일 20~30문제씩 풀어 감각 유지. 실수노트에 패턴 기록 후 시험 전 반드시 확인.
- **민동준T 노하우 특강** (화학 전용): 3사이클 전략 + 3노트 시스템 (위 별도 항목 참조). 노하우 특강 제공 시점은 매년 달라지니 특정 시점을 단정하지 말 것.

### 유기
- **스미스 유기화학** (7판): 이론 위에 예제 바로 풀기 → 손으로 메커니즘 직접 그리며 학습. 눈으로만 보면 안 됨. 실제 합격생들은 스미스를 2~3회독 하고 예제를 반복해서 풀었음.
  - **스미스 예제 구분 (중요)**: 스미스 교재에는 "답 있는 예제(Worked Example)"와 "답 없는 연습문제(Practice Problem)"가 별도로 존재함. 1회독=답 있는 예제만 풀기, 2회독=답 없는 연습문제(답 없이 직접 손으로 그려 풀기). "답 없이 직접 그리며 푼 것"은 2회독 사이클 가이드에서 답이 없는 연습문제를 직접 푸는 것을 의미함. 절대 "답 없이 그리며 풀기"를 1회독 방식으로 오인하지 말 것.
- **약사랑유기화학(박엘리T)** (유튜브): VF 풀케어반 공식 추천 강의. 풀케어반 유기화학 문제 컨텐츠도 여기서 제공받음. 내용이 컴팩트해서 배속으로 여러 번 보기에 최적.
- **유기화학 막판에 열린다**: 실제 합격생 여러 명이 "11월까지도 전혀 이해 안 됐는데 갑자기 어느 순간 구조와 메커니즘이 그려졌다"고 증언. 포기하지 않고 끝까지 붙잡고 가는 것이 핵심.
- **반응 단원별 정리**: 각 단원의 전체 반응을 한 페이지 흐름도로 정리해 두면 복습 효율 대폭 향상. 나중에는 1시간 만에 전 단원 복습 가능.
- **유기화학 공부 시간**: 매일 1~2시간. 하루 빠지면 감각이 떨어짐 → 꾸준히 유지가 핵심.

### 입시 철학 (핵심)
- 토익 먼저: 필기 준비 전에 토익 완성이 기본 전제. 병행 시 비효율. 실제로 토익이 발목잡아 초시 탈락한 사례 다수.
- 기출의 역할: "기출은 중요하지 않다"는 말은 절반만 맞음. 기출을 통해 출제 교수의 선호 단원·유형 파악 → 기본서 넓게 복습 도구로 활용.
- 기본기 우선: 전공심화·지엽보다 기본기와 핵심 단원 완성이 합격을 결정함. 고득점 = 기본 문제를 확실히 맞추는 것.
- VF 하위권도 합격 가능: 수준 자체가 높아서 VF 모의에서 하위권이어도 실제 시험에서 합격 가능. 26학년도 실제 합격생 중 VF 내내 하위권~중위권이었던 학생이 다수.
- 합격 전략: "다 맞겠다" X → "공부한 건 절대 틀리지 않겠다"로 접근. 모르는 문제는 당황하지 말고 최대한 추론.
- 전략적 포기: 개인 상황(스펙, 준비기간)에 따라 일부 단원·과목 포기 + 핵심에 집중 = 오히려 합격에 유리. 노베이스 문과 초시 합격 사례가 이를 증명.

### [2] 매년 커리큘럼이 바뀔 수 있습니다
- 위 커리큘럼은 현재 등록된 기준입니다. 교재명, 문제 수, 시기가 매년 조금씩 달라질 수 있어요
- 학생이 언급하는 교재·컨텐츠가 커리큘럼과 약간 다를 수 있으나, 방향성이 같으면 OK

### [3] 일반 주의사항
- **★★ 학생이 쓰지 않은 주제는 아예 다루지 마세요 (가장 많이 지워지는 유형) ★★** 학생이 제출 내용에서 언급하지 않았고 질문하지도 않은 주제에 대해서는, 아무리 유용한 정보라도 먼저 꺼내지 마세요. 예를 들어 학생이 "분류" 단원을 전혀 언급하지 않았는데 "분류는 가볍게 보고 넘어가도 됩니다"를 넣으면 홍쌤이 그 문단을 지워야 합니다. 커리큘럼 정보·공지사항·표준 가이드에 있는 내용이라도 마찬가지입니다. **피드백은 학생이 쓴 내용에 대한 응답이지, 정보 전달이 아닙니다.**
  - 유일한 예외: 이 학생의 개인 커리큘럼 기한 대비 진도가 늦어 방향을 잡아줘야 하는 경우, 그리고 저번주 피드백에서 지시한 항목의 이행 여부를 확인하는 경우.
- **학생이 제출한 내용에 없는 사실은 절대 언급하지 마세요.** 학생이 직접 쓰지 않은 구체적 행동(요일, 횟수, 내용)을 피드백에서 언급하거나 칭찬하면 신뢰를 잃습니다. 예: 학생이 "명상했다"고 쓰지 않았는데 "명상하신 것 잘했어요" → 절대 금지. 학생이 "오개념 발견"이라고 쓰지 않았는데 "오개념 발견한 건 정말 잘했어요" → 절대 금지. 오직 학생이 명시적으로 쓴 내용만 피드백하세요.
- **유기화학 피드백에서 박인규T/인규쌤 언급 금지.** 유기화학 담당은 약사랑유기화학(박엘리T)입니다. 유기 섹션에서 박인규T 체크리스트·APS·사고과정 체득 등 화학 관련 내용을 절대 넣지 마세요.
- **표현 반복 금지.** 이전 주 피드백에서 사용했던 동일한 문장·표현을 그대로 반복하지 마세요. 같은 의미라도 다른 단어와 문장 구조로 변형하여 AI 느낌을 줄이세요. 예: "이게 VF가 7월 동안 생물에서 계속 강조하는 핵심 루틴이거든요"를 매번 똑같이 쓰지 말고, **"홍쌤이 강조하는 핵심 순서거든요"**, "홍쌤이 7월 내내 강조해온 방식과 딱 맞아요" 등으로 변형하세요. "홍쌤이 강조하는" 표현을 우선적으로 사용하세요.
- **운동 피드백은 학생이 쓴 내용 기반으로만.** 학생이 운동을 언급하지 않았으면 운동 권장 코멘트를 길게 달지 마세요. 학생이 특정 운동(런닝, 헬스, 스쿼트 등)을 언급했을 때만 해당 내용으로 피드백하세요. "고강도 운동을 권장합니다"를 모든 학생에게 반복 적용하지 마세요.
- **애니어그램 사용 규칙 (횟수보다 "쓰는 방식"이 훨씬 중요).** 전체 피드백에서 2~3회 사용. 0회도 부자연스럽고, 4회 이상은 남발입니다.
  - **★ 핵심은 "형식"이 아니라 "근거"입니다.** 유형 설명 자체는 홍쌤도 자주 씁니다. 문제는 근거 없이 갖다 붙이는 것입니다.
    - **금지 (근거 없는 일반론)**: "1w2 유형이라 완벽주의가 스트레스로 이어질 수 있어요" / "7w8 유형의 특성과 관련이 있어요" — 학생이 쓴 구체적 행동과 연결되지 않은 채 유형만 언급하는 것.
    - **허용·권장 (학생이 쓴 행동 + 그 유형 특유의 내적 대사를 구체적으로 재현)**: 학생이 "주말엔 다음날 쉰다고 생각하니 더 늦게 잤다"고 썼다면 → "이게 7w6에서 정말 자주 나타나는 패턴이에요. '내일은 좀 쉬어도 되니까 오늘은 더 놀아도 돼'라는 생각이 자동으로 들거든요." 이렇게 **학생의 머릿속에서 실제로 일어났을 법한 문장을 그대로 짚어주는 것**이 홍쌤 스타일입니다.
    - 판단 기준: 그 문장에서 유형 번호를 지웠을 때 의미가 그대로면 = 억지 연결(삭제). 유형 번호가 있어야만 성립하는 구체적 통찰이면 = 좋은 사용.
    - 행동 지침형도 좋습니다: "7w8은 진도보다 복습이 먼저예요" / "애니어그램 9번 학습법 매일 읽고 시작해주세요"
  - **연결 근거가 약하면 아예 쓰지 마세요.** 학생의 행동과 유형 특성이 명확히 이어지지 않는데 억지로 갖다 붙이는 것이 가장 큰 문제입니다. 애매하면 생략하고 그 자리에 학생이 쓴 내용에 대한 구체적 조언을 넣으세요.
  - **다만 0회도 안 됩니다. 목표는 3회 안팎입니다.** 생활관리 섹션에는 해당 유형의 실천 지침을 반드시 1회 이상 포함하세요. 위 [생활관리 코칭 포인트]를 행동 지침 형태로 녹이면 됩니다. 예: "애니어그램 9번 학습법 매일 읽고 학습 시작해주세요!", "7w8은 진도보다 복습이 먼저예요". 과목 섹션에서는 근거가 확실할 때 1~2회 추가.
  - **★ 학생이 제출 내용에서 자기 유형을 먼저 언급했다면 적극적으로 이어받으세요.** 예를 들어 학생이 "7w6 유형의 고질적인 패턴 때문에 반복 시청하는 습관이 발목을 잡았다"라고 썼다면, 이미 스스로 유형과 행동을 연결한 상태입니다. 이때는 유형을 3~5회까지 써도 좋고, 학생이 쓴 그 연결을 인정하면서 구체적 실행 규칙으로 발전시켜주세요. 억지 연결이 문제이지 유형 자체가 문제가 아닙니다.
- **"VF 커리큘럼" 표현 완전 금지 (가장 자주 위반되는 규칙).** "이게 VF 커리큘럼의 핵심이거든요", "VF가 7월 내내 강조해온", "VF 커리큘럼이 강조해온", "VF OX" 외의 "VF"를 주어/목적어로 한 문장 전부 금지. 피드백 생성 전 VF를 포함한 문장이 없는지 반드시 확인. 대신 **"홍쌤이 강조하는"** 표현 사용. 예: "홍쌤이 강조하는 핵심 순서거든요", "합격생들이 공통으로 한 방식이에요".
- **학습 내용의 어려움을 "원래 어려워요"로 표현 금지.** 어려운 내용은 "원래 어렵다"가 아니라 "아직 익숙하지 않아서 어렵게 느끼는 것"으로 재프레이밍하세요. 예: "캠벨이 원래 어려워요" → "캠벨은 처음이고 익숙하지 않아서 어렵게 느끼는 거예요. 원래 어려운 게 아니에요". 이렇게 해야 학생이 자신의 역량을 제대로 평가할 수 있습니다.
- **질문 형식(Q&A) 가이드라인.** 피드백에 질문을 넣는 것은 OK지만, 목적이 명확해야 합니다. 질문의 목적: 학생이 자연스럽게 상황을 돌아보면서 스스로 답을 찾게 하는 것. 예시 OK: "이번 주 생물 복습할 때 OX 먼저 풀고 캠벨 재확인했나요?" (학생이 스스로 점검 가능). 예시 금지: 공개된 사실이나 커리큘럼 정보를 질문 형식으로 묻는 것 (그냥 말해주면 됨). 질문은 맥락에 자연스럽게 맞아야 하며, 어색하게 억지로 넣지 마세요.
- **학생 이름 절대 변경 금지 (치명적 오류).** 학생 이름은 반드시 아래 [학생 데이터]에 있는 이름을 철자 하나도 바꾸지 않고 그대로 사용하세요. "재현"을 "재원"으로, "지수"를 "지우"로 바꾸는 등 유사한 이름으로 임의 대체는 절대 금지입니다.
- **"합격생들이" 표현 최대 1회.** "합격생들이 공통적으로", "합격생들이 강조한" 형태는 전체에서 1회만. 매 과목마다 반복하지 마세요.
- AI스럽거나 격식체로 시작하지 마세요. 예시처럼 자연스러운 말투로 시작하세요
- "이렇게 정확히 가고 있습니다", "이게 정확한 방향입니다", "올바른 방향으로 가고 있습니다" 같은 딱딱하고 단정적인 표현 금지. 대신 "정말 잘하고 있어요!", "이렇게 하면 돼요~", "홍쌤이 봐도 딱 맞는 방향이에요 :)" 같은 따뜻하고 자연스러운 표현 사용
- 학생이 제출한 내용(잘한점, 보완할점, 학습내용)을 구체적으로 언급하면서 피드백하세요
- 칭찬은 구체적으로, 보완은 실행 가능한 방향으로
- 각 과목 데이터가 있는 경우만 작성하세요. 데이터 없는 과목은 생략
- 교재명·컨텐츠명 정확하게 사용 (캠벨, 꿀벌책, 박선우 써머리, 스미스, 약사랑유기화학, 1500제, 2000제, 기출올인원, APS 등)
- 마지막 문장은 따뜻하게 마무리 (":)", "화이팅!", "굿!" 등)
- **호칭 절대 규칙**: 학생을 부를 때 반드시 "이름+학생" 형식 사용. 예: "지현 학생", "재원 학생". "~님"(지현님, 재원님 등) 절대 금지. 성은 빼고 이름만+학생.`;
}

async function callClaude(prompt,apiKey){
  const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-4-5",max_tokens:6000,messages:[{role:"user",content:prompt}]})});
  const data=await res.json();const text=(data.content||[]).map(b=>b.text||"").join("");if(!text)throw new Error(data.error?.message||"API 오류");return text;
}

function buildGallery(){
  const months=['7','8','9','10','11','12','1'];
  const allNames=[...new Set(S.subs.map(s=>s.data.name).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko'));
  const items=S.subs
    .filter(s=>String(s.data.month)===String(S.galMonth)&&String(s.data.week)===String(S.galWeek))
    .filter(s=>!S.galStudent||s.data.name===S.galStudent)
    .sort((a,b)=>(a.data.name||'').localeCompare(b.data.name||'','ko'));
  const monthOpts=months.map(m=>`<option value="${m}" ${S.galMonth==m?'selected':''}>${m}월</option>`).join('');
  const weekOpts=[1,2,3,4,5].map(w=>`<option value="${w}" ${S.galWeek==w?'selected':''}>${w}주차</option>`).join('');
  const nameOpts='<option value="">전체 학생</option>'+allNames.map(n=>`<option value="${n}" ${S.galStudent===n?'selected':''}>${n}${S.studentInfo[n]?.trait?' ('+S.studentInfo[n].trait+')':''}</option>`).join('');
  const cards=items.length===0
    ?`<div class="gal-empty"><div style="font-size:40px;margin-bottom:10px">📭</div><div style="font-weight:700;margin-bottom:4px">${S.galMonth}월 ${S.galWeek}주차 제출 내역이 없어요</div><div style="font-size:13px;color:#86868b">다른 주차를 선택해보세요</div></div>`
    :items.map(s=>galCard(s)).join('');
  return`<div class="gal-bar">
    <select class="gal-sel" onchange="set({galMonth:this.value,galWeek:'1'})">${monthOpts}</select>
    <select class="gal-sel" onchange="set({galWeek:this.value})">${weekOpts}</select>
    <div class="gal-div"></div>
    <select class="gal-sel" style="min-width:110px" onchange="set({galStudent:this.value})">${nameOpts}</select>
    <span style="font-size:12px;color:#86868b;margin-left:2px">${items.length}명</span>
  </div>
  <div class="gal-grid">${cards}</div>`;
}

function galSetTab(key,tab){S.galCardTabs={...S.galCardTabs,[key]:tab};S.galCardExpanded={...S.galCardExpanded,[key]:true};render();}
function galToggleExpand(key){S.galCardExpanded={...S.galCardExpanded,[key]:!S.galCardExpanded[key]};render();}
async function toggleStamp(key){
  const sub=S.subs.find(s=>s.key===key);
  if(!sub)return;
  if(isLocked(sub.data.month,sub.data.week)){alert('🔒 '+sub.data.month+'월 '+sub.data.week+'주차는 잠금 처리되어 수정할 수 없어요.');return;}
  const newVal=!sub.data.stamp;
  await fsdb.collection("submissions").doc(key).update({stamp:newVal});
  S.subs=S.subs.map(s=>s.key===key?{...s,data:{...s.data,stamp:newVal}}:s);
  render();
}

async function submitForm(){
  const name=document.getElementById("name-select")?.value||S.name;
  if(!name){set({formError:"이름을 선택해주세요."});return}
  if(isLocked(S.month,S.week)){set({formError:"🔒 "+S.month+"월 "+S.week+"주차는 잠금 처리되어 제출할 수 없어요."});return}
  const pledge=document.getElementById("pledge-input")?.value||S.nw.다짐||"";
  document.querySelectorAll("textarea[data-subj]").forEach(el=>{const s=el.dataset.subj,f=el.dataset.field;if(s&&f)S.subjects={...S.subjects,[s]:{...S.subjects[s],[f]:el.value}}});
  document.querySelectorAll("[data-nw]").forEach(el=>{const k=el.dataset.nw;if(k)S.nw={...S.nw,[k]:el.value}});
  S.nw.다짐=pledge;
  if(!ALL_SUBS.some(s=>S.subjects[s]?.study||S.subjects[s]?.good||S.subjects[s]?.improve)){set({formError:"최소 1개 과목 이상 입력해주세요."});return}
  set({submitting:true,formError:""});
  try{
    await saveSubmission({name,month:S.month,week:S.week,subjects:S.subjects,nw:S.nw});
    set({step:"done",name,submitting:false});
    try{localStorage.removeItem('_vf_draft');}catch(e){}
  }catch(e){set({formError:"저장 실패: "+e.message,submitting:false});}
}

async function downloadExcel(){
  if(!S.subs.length){alert('다운로드할 데이터가 없습니다.');return;}
  // SheetJS 동적 로드
  if(!window.XLSX){
    await new Promise((res,rej)=>{
      const s=document.createElement('script');
      s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      s.onload=res;s.onerror=rej;document.head.appendChild(s);
    });
  }
  const XLSX=window.XLSX;
  const wb=XLSX.utils.book_new();

  // ── 탭1: 제출내용 + 최종승인피드백 ──
  const h1=['이름','월','주차','제출일시','애니어그램','주력학교',
    '생물_학습내용','생물_잘한점','생물_보완할점',
    '화학_학습내용','화학_잘한점','화학_보완할점',
    '유기_학습내용','유기_잘한점','유기_보완할점',
    '생활관리_잘한점','생활관리_보완할점',
    '다음주_생물단원','다음주_생물강의','다음주_생물문제',
    '다음주_화학단원','다음주_화학강의','다음주_화학문제',
    '다음주_유기단원','다음주_유기강의','다음주_유기문제',
    '다짐','최종승인피드백'];
  const r1=S.subs.map(item=>{
    const d=item.data,sub=d.subjects||{},nw=d.nw||{};
    const dt=d.submittedAt&&d.submittedAt.toDate?d.submittedAt.toDate().toLocaleString('ko-KR'):'';
    return[d.name||'',d.month||'',d.week||'',dt,d.trait||'',d.school||'',
      (sub['생물']||{}).study||'',(sub['생물']||{}).good||'',(sub['생물']||{}).improve||'',
      (sub['화학']||{}).study||'',(sub['화학']||{}).good||'',(sub['화학']||{}).improve||'',
      (sub['유기화학']||sub['유기']||{}).study||'',(sub['유기화학']||sub['유기']||{}).good||'',(sub['유기화학']||sub['유기']||{}).improve||'',
      (sub['생활관리']||{}).good||'',(sub['생활관리']||{}).improve||'',
      nw['생물_단원']||'',nw['생물_강의']||'',nw['생물_문제']||'',
      nw['화학_단원']||'',nw['화학_강의']||'',nw['화학_문제']||'',
      nw['유기_단원']||'',nw['유기_강의']||'',nw['유기_문제']||'',
      nw['다짐']||'',d.generatedFeedback||''];
  });
  const ws1=XLSX.utils.aoa_to_sheet([h1,...r1]);
  // 열 너비 설정
  ws1['!cols']=[{wch:8},{wch:4},{wch:4},{wch:16},{wch:8},{wch:16},
    ...Array(20).fill({wch:25}),{wch:12},{wch:60}];
  XLSX.utils.book_append_sheet(wb,ws1,'제출내용+최종피드백');

  // ── 탭2: 자동생성피드백 vs 최종피드백 비교 ──
  const h2=['이름','월','주차','제출일시','자동생성피드백(원본)','최종승인피드백','변경여부'];
  const r2=S.subs.map(item=>{
    const d=item.data;
    const dt=d.submittedAt&&d.submittedAt.toDate?d.submittedAt.toDate().toLocaleString('ko-KR'):'';
    const orig=d.originalFeedback||'';
    const final=d.generatedFeedback||'';
    const changed=orig&&final&&orig!==final?'수정됨':(orig&&final&&orig===final?'동일':(orig&&!final?'미승인':(final&&!orig?'원본없음':'-')));
    const ga=toDate(d.generatedAt), fa=toDate(d.feedbackAt);
    const gs=ga?ga.toLocaleString('ko-KR'):'', fs=fa?fa.toLocaleString('ko-KR'):'';
    const em=editMinutes(d), kr=keepRatio(d);
    return[d.name||'',d.month||'',d.week||'',dt,orig,final,changed,gs,fs,
           em===null?'':Math.round(em*10)/10, kr===null?'':Math.round(kr*100)+'%',
           orig?orig.length:'', final?final.length:''];
  });
  const ws2=XLSX.utils.aoa_to_sheet([[...h2,'생성시각','승인시각','소요(분)','원문유지율','원본글자수','최종글자수'],...r2]);
  ws2['!cols']=[{wch:8},{wch:4},{wch:4},{wch:16},{wch:80},{wch:80},{wch:8},{wch:16},{wch:16},{wch:8},{wch:9},{wch:9},{wch:9}];
  XLSX.utils.book_append_sheet(wb,ws2,'자동생성피드백');

  XLSX.writeFile(wb,'풀케어반_셀프피드백_'+new Date().toISOString().slice(0,10)+'.xlsx');
}

// ── 소요시간·수정률 측정 ──
function toDate(t){ if(!t)return null; if(t.toDate)return t.toDate(); if(t instanceof Date)return t; return null; }
// 생성 → 승인까지 걸린 분 (30분 초과는 중간에 자리를 비운 것으로 보고 제외)
function editMinutes(d){
  const a=toDate(d.generatedAt), b=toDate(d.feedbackAt);
  if(!a||!b||!d.feedbackApproved)return null;
  const m=(b-a)/60000;
  return (m<0||m>30)?null:m;
}
// 자동생성 원본 대비 얼마나 고쳤는지 (0~1, 낮을수록 많이 고침)
function keepRatio(d){
  const a=d.originalFeedback, b=d.generatedFeedback;
  if(!a||!b)return null;
  // 공백 제거 후 문자 단위 LCS 근사: 짧은 쪽 기준 공통 3-gram 비율
  const norm=s=>String(s).replace(/\s+/g,'');
  const A=norm(a),B=norm(b);
  if(!A.length||!B.length)return null;
  const g=s=>{const S=new Set();for(let i=0;i+3<=s.length;i++)S.add(s.slice(i,i+3));return S;};
  const ga=g(A),gb=g(B);
  let hit=0; ga.forEach(x=>{if(gb.has(x))hit++;});
  return hit/Math.max(ga.size,1);
}
function weekStats(month,week){
  const items=S.subs.filter(s=>String(s.data.month)===String(month)&&String(s.data.week)===String(week));
  const done=items.filter(s=>s.data.feedbackApproved);
  const mins=done.map(s=>editMinutes(s.data)).filter(v=>v!==null);
  const keeps=done.map(s=>keepRatio(s.data)).filter(v=>v!==null);
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  return {total:items.length,done:done.length,measured:mins.length,
          avgMin:avg(mins),over5:mins.filter(v=>v>5).length,
          avgKeep:avg(keeps)};
}
async function generateFeedback(){
  if(!S.sel)return;if(!S.apiKey.trim()){alert("API 키를 먼저 입력해주세요.");return}
  const info=S.studentInfo[S.sel.data.name]||{};
  const trait=info.trait||"",school=info.school||"";
  set({generating:true,generated:""});
  try{
    const result=await callClaude(buildPrompt({...S.sel.data,trait,school,prevRecord:S.prevData,prevRecord2:S.prevData2}),S.apiKey);
    // 최초 생성 시에만 originalFeedback + 생성시각 저장 (재생성해도 덮어쓰지 않음)
    if(!S.sel.data.originalFeedback){
      const ts=firebase.firestore.FieldValue.serverTimestamp();
      await fsdb.collection("submissions").doc(S.sel.key).update({originalFeedback:result,generatedAt:ts});
      const updatedData={...S.sel.data,originalFeedback:result,generatedAt:{toDate:()=>new Date()}};
      S.subs=S.subs.map(s=>s.key===S.sel.key?{...s,data:updatedData}:s);
      S.sel={...S.sel,data:updatedData};
    }
    set({generated:result,generating:false});
  }catch(e){set({generated:"오류: "+e.message,generating:false});}
}

    if(allowedEmails.some(e=>sameEmail(e,user.email))){set({});}
    else{auth.signOut();alert('접근 권한이 없습니다.\n선생님께 구글 이메일 등록을 요청해주세요.');}
  }).catch(e=>alert('로그인 실패: '+e.message));
}
function studentLogout(){
  auth.signOut().then(()=>set({mode:'student'}));
}
// Firebase 인증 타임아웃 (3초 안에 안 되면 로그인 화면 표시)
setTimeout(()=>{if(!S.authReady){S.authReady=true;render();}},3000);
let _appInited=false;
auth.onAuthStateChanged(async user=>{
  S.user=user;
  S.authReady=true;
  render();
  if(user){
    // 로그인한 사용자만 개인정보 로드. 프로필(상담내용)은 강사 전용.
    await loadEnneagram();
    if(sameEmail(user.email,TEACHER_EMAIL)){
      await loadProfiles();
      S.allowedEmails=await syncAllowedEmails();   // 명단 자동 동기화
    }else STUDENT_PROFILE={};
    render();
  }else{
    STUDENT_PROFILE={}; STUDENT_ENNEAGRAM={};
  }
  // 로그인한 뒤에만 Firestore 접근 (보안 규칙상 비로그인 읽기 차단)
  if(user&&!_appInited){_appInited=true;initApp();}
});

function copyFeedback(){navigator.clipboard?.writeText(S.generated).then(()=>{set({copied:true});setTimeout(()=>set({copied:false}),2000)})}

// ── 렌더 ──
function render(){
  // ── DOM→S 동기화: onSnapshot 재렌더 시 입력 중인 값 보존 ──
  const _fbEl=document.getElementById('fb-edit-area');
  if(_fbEl) S.generated=_fbEl.value;
  document.querySelectorAll('textarea[data-subj]').forEach(el=>{
    const _s=el.dataset.subj,_f=el.dataset.field;
    if(_s&&_f){if(!S.subjects[_s])S.subjects[_s]={};S.subjects[_s][_f]=el.value;}
  });
  const _pledgeEl=document.getElementById('pledge-input');
  if(_pledgeEl) S.nw={...S.nw,다짐:_pledgeEl.value};
  // 다음주계획 [data-nw] 동기화 (버그5 fix)
  document.querySelectorAll('[data-nw]').forEach(el=>{const k=el.dataset.nw;if(k)S.nw={...S.nw,[k]:el.value};});
  if(S.step==='form'&&S.user){
    try{localStorage.setItem('_vf_draft',JSON.stringify({name:S.name,month:S.month,week:S.week,subjects:S.subjects,nw:S.nw}));}catch(e){}
  }
  // 포커스 보호: 학생 폼에서 입력 중이면 DOM 재빌드 생략 (버그6 fix)
  const _active=document.activeElement;
  const _isTyping=_active&&(_active.tagName==='INPUT'||_active.tagName==='TEXTAREA')&&document.getElementById('app')?.contains(_active)&&S.mode==='student';
  if(_isTyping){return;}
  const isTeacher=S.user&&sameEmail(S.user.email,TEACHER_EMAIL);
  const nav=`<nav class="nav"><div class="nav-inner"><button class="nav-tab${S.mode==="student"?" active":""}" onclick="set({mode:'student'})">🙋 학생용</button><button class="nav-tab${S.mode==="instructor"&&isTeacher?" active":""}" onclick="${isTeacher?"set({mode:'instructor'})":'instructorLogin()'}">👨‍🏫 선생님용 ${isTeacher?"🔓":"🔒"}</button><button class="nav-tab${S.mode==='gallery'?' active':''}" onclick="set({mode:'gallery'})">📚 피드백 보기</button>${isTeacher?'<button onclick="instructorLogout()" style="margin-left:auto;padding:4px 10px;font-size:11px;font-weight:600;background:rgba(0,0,0,.07);color:#1d1d1f;border:none;border-radius:5px;cursor:pointer">로그아웃</button>':(S.user&&!isTeacher)?'<button onclick="studentLogout()" style="margin-left:auto;padding:4px 10px;font-size:11px;font-weight:600;background:rgba(0,0,0,.07);color:#1d1d1f;border:none;border-radius:5px;cursor:pointer">🎓 '+S.user.email.split('@')[0]+' 로그아웃</button>':''}<span class="nav-badge">Firebase 연결됨</span></div></nav>`;
  let content;
  if(S.mode==="gallery"&&(S.user||isTeacher)){content=buildGallery();}
  else if(S.mode==="student"){content=buildStudentForm();}
  else if(isTeacher){content=buildInstructor();}
  else{content=`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:16px;padding:40px 20px;text-align:center"><div style="font-size:48px">🔒</div><div style="font-size:18px;font-weight:700;color:#1d1d1f">홍쌤 피드백 확인</div><div style="font-size:13px;color:#86868b;margin-bottom:8px">선생님께 등록된 구글 계정으로 로그인하세요</div><button onclick="instructorLogin()" style="padding:12px 28px;font-size:14px;font-weight:600;background:#0071e3;color:#fff;border:none;border-radius:10px;cursor:pointer">Google 계정으로 로그인</button></div>`;}
  document.getElementById("app").innerHTML=nav+content;
}

// ── 초기화 (실시간 리스너) ──
async function initApp(){
  try{
    const rosterDoc=await fsdb.collection("config").doc("roster").get();
    S.roster=rosterDoc.exists?(rosterDoc.data().names||[]):[];
    S.studentInfo=rosterDoc.exists?(rosterDoc.data().studentInfo||{}):{};
    const locksDoc=await fsdb.collection("config").doc("locks").get();
    S.lockedWeeks=locksDoc.exists?(locksDoc.data().locked||[]):[];
    fsdb.collection("config").doc("locks").onSnapshot(snap=>{
      S.lockedWeeks=snap.exists?(snap.data().locked||[]):[];render();
    });
    fsdb.collection("submissions").orderBy("submittedAt","desc").onSnapshot(snap=>{
      S.subs=snap.docs.map(doc=>({key:doc.id,data:doc.data()}));
      render();
    });
  }catch(e){
    _appInited=false;   // 재시도 가능하도록 복구
    const perm=(e.code==='permission-denied'||/permission/i.test(e.message||''));
    const el=document.getElementById("app");
    if(el)el.innerHTML=`<div class="loading-wrap"><div style="font-size:32px">⚠️</div>
      <div style="font-weight:600">${perm?'접근 권한이 없습니다':'Firebase 연결 실패'}</div>
      <div style="font-size:12px;color:#86868b;max-width:320px;text-align:center;line-height:1.7">
        ${perm?'로그인이 필요하거나, 등록되지 않은 계정입니다.<br>강사에게 등록 여부를 확인해주세요.':esc(e.message||'')}
      </div>
      <div style="display:flex;gap:8px;margin-top:6px">
        <button class="btn-ghost btn-sm" onclick="location.reload()">새로고침</button>
        <button class="btn-ghost btn-sm" onclick="auth.signOut().then(()=>location.reload())">로그아웃</button>
      </div></div>`;
  }
}

function moreTips(subj,month,week){
  var tips=getRandTips(subj,month,week);
  var box=document.getElementById('tips-box-'+subj);
  if(!box)return;
  // 링크 엘리먼트 보존 (tips-box 하단에 위치)
  var linkEl=box.querySelector('a');
  var linkHtml=linkEl?'<div style="margin-top:8px">'+linkEl.outerHTML+'</div>':'';
  var html=tips.map(function(t){return'<div style="font-size:11px;color:#1a3a6c;line-height:1.8;padding-bottom:7px;border-bottom:1px solid rgba(0,113,227,.1)">'+hiliteEnn(t)+'</div>';}).join('');
  box.innerHTML=html+linkHtml;
  // 열린 상태로 전환
  box.style.display='flex';
  var arrow=document.getElementById('tips-arrow-'+subj);
  if(arrow)arrow.textContent='▼';
}
function toggleTips(subj){
  var box=document.getElementById('tips-box-'+subj);
  var arrow=document.getElementById('tips-arrow-'+subj);
  if(!box)return;
  var isOpen=box.style.display==='flex';
  box.style.display=isOpen?'none':'flex';
  if(arrow)arrow.textContent=isOpen?'▶':'▼';
}
function getRandTips(subj,month,week){
  var wkey=String(month)+'-'+String(week);
  var pool;
  if(subj==='생활관리'){
    var myType=STUDENT_ENNEAGRAM[S.name]||null;
    var myPrimary=myType?myType.charAt(0):null;
    var weekTips=((WINNER_POOL[wkey]||{})['생활관리'])||[];
    var allTips=WINNER_POOL_ALL['생활관리']||[];
    if(myPrimary){
      var filtered=weekTips.filter(function(t){
        var mm=t.match(/[—–]\s*([^\(]+)\s*\(/);
        var nick=mm?mm[1].trim():'';
        return (WINNER_ENNEAGRAM[nick]||'').charAt(0)===myPrimary;
      });
      if(filtered.length>=1){pool=filtered;}
      else{
        var allFiltered=allTips.filter(function(t){
          var mm=t.match(/[—–]\s*([^\(]+)\s*\(/);
          var nick=mm?mm[1].trim():'';
          return (WINNER_ENNEAGRAM[nick]||'').charAt(0)===myPrimary;
        });
        pool=allFiltered.length>=1?allFiltered:[];
      }
    }else{pool=weekTips;}
  }else{
    var wp=((WINNER_POOL[wkey]||{})[subj])||[];
    pool=wp.length?wp:(WINNER_POOL_ALL[subj]||[]);
  }
  var arr=pool.slice();
  for(var i=arr.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=arr[i];arr[i]=arr[j];arr[j]=tmp;}
  return arr.slice(0,3);
}
