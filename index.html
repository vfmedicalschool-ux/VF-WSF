    `"지난주부터 날 괴롭혔던 두통이 어느정도 잡혀서 공부에 집중할 수 있었다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생) [9w8]`,
    `"이번주 공부는 만족스러웠다. 주어진 하루의 공부에 최선을 다하려 노력했고 그것을 실천했던 것 같다. 시험은 점점 다가오는데 오히려 9월 10월보다 뭔가 마음이 좀 편안해진게 이상하긴하지만, 오히려 그러니 더 집중이 잘되는 것 같다. 저번주 선생님께서 남겨주신 말씀처럼 이때까지 이만큼은 해야하는데 이건 다하고 시험을 보게 되어야하는데 이런 생각을 내려놓은게 도움이 된 것 같다. 취침과 기상시간도 전에 비해 많이 안정화되었다." — 단퓨프 (26학년도 목포(약) 합격생) [1w2]`,
    `"약점 하나를 채우면 계속해서 새로운 내용과 약점들이 나오고 점수는 예상보다 낮고 절망스럽기도 했지만 그런 감정을 오히려 호승심으로 치환해서 멘탈을 관리하고있습니다." — 후회없이살자 (26학년도 강원(약) 합격생) [5w6]`,
    `"멘탈도 흔들리고 체력도 부족하지만 일단 끝날때까지 최선을 다해서 열심히 산 기억을 남기려고 노력했다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생) [9w1]`
    ]
  },
  "11-4":{
    생물:[
    `"이번주 주어진 문제들을 리뷰하고 진도도 나갔다. 주어진 시간에 집중해 공부를 하였다. 문제를 리뷰하다보니 계속 비슷한 부분을 다른 방식으로 묻는 것 같았고, 확실히 그냥 이론을 읽을 때보다 문제를 풀고 그 부분을 보니 더 각인되는 효과가 있었던 것 같다." — 단퓨프 (26학년도 목포(약) 합격생)`,
    `"전체적으로 전범위를 공부했다. 기출이나 적중문제를 풀면서 생각이 잘 안 나거나 약점인 것 같은 단원들을 계속 보며 채우려고 했다. 특히 생화학이 전공 수준도 양이 많아서 추가로 잘 안 외워지는 것들은 자주 보며 복습했다. 간단히 계속 틀리는 개념들도 정리해서 매일은 아니더라도 자주 보려고 노력했다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
    `"이번주에 2026 mdp까지 모두 풀었다. 이번주에 푸는 내내 mdp를 처음 풀 때보다는 훨씬 정답률이 좋고 속도도 빨라졌다는 느낌을 받았다. 다음주부터 기출 n제 복습을 좀 더 속도를 내서 한바퀴를 다시 돌릴 예정이다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"목표로 했던 기출N제 14회까지의 복습을 마쳤다. 복습을 하면서 문득 12월부터는 아직도 어색한 개념이나 암기가 잘 안된 부분을 매일 계속 보는게 나을 것 같다는 생각이 들어 기출N제+중앙대재배치 및 22~25, 경희대22~25, 7,8월OX, 타임어택 모의고사, 그리고 기존에 단권화해놨던 정리본을 모두 복습하면서 계속 볼 내용들만 다시 정리하여 재단권화한 후 12월부터는 매일 2시간씩 단권 복습 후 + 알파로 다른 것을 할 예정이다. 현재 기출N제, 중앙대 재배치 및 22~25, 경희 22~25의 단권화까지 완료된 상태이다." — Akdow (26학년도 단국(약) 합격생)`,
    `"비전파인더 생물 시험을 꾸준히 보고 오답하고 있는 점." — Hcsg (26학년도 원광(약) 합격생)`,
    `"1) 매일 PEET 10문제씩 풀이하고 추가적으로 중앙대 기출 15문제를 풀어 기본기를 다짐. 2) 피드백 받은 대로 캠벨은 굵은 글씨 위주 & 그림 복습, 꿀벌책은 이론 보충용으로 공부함. 항상 생물에 자신감이 없었는데 기본기를 채우면서 점점 자신감이 생김." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"이번 모의고사 때 OMR 검토와 옳은/옳지 않은 확인 시간을 가졌다. 다음주에도 검토 시간을 가져보겠음. 생물은 하루에 한 단원씩 복습을 진행하고 있다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"∙미뤄왔던 식물, 생태, 진화 파트를 복습했음. 하고 나니 불안했던 마음이 사라졌음. ∙ 매일 전범위 문제를 풀고 단원별로 말로 설명하며 내용을 꺼내보는 방법을 이용해서 복습을 진행함." — 레고링 (26학년도 계명(제약) 합격생)`,
    `"분류학 암기를 다시 한 번 진행했다. 식생분진은 PEET때보다 출제되는 비중이 낮긴 하지만, 난이도가 있게 출제되지 않으니 암기하면 풀 수 있다는 생각으로 공부를 이어나갔다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
    `"기출N적중 문제Base로 복습을 진행했고, 그 덕에 심화된 지식과 기본기를 동시에 잡은것 같다. 옛날에는 생물문제를 풀때 알면 맞추고 모르면 틀린다는 인식이 강했던지라, 당황스러운 문제가 나오면 그냥 틀리는 경우가 많았는데, 지금은 그런 문제를 만나도 출제의도를 먼저 파악해보고, 내가 알고있는게 뭔지 곰곰히 되집어본후 잘 조합해서 풀어낼려고 노력해서 옛날보다 정답률이 많이 올라온듯 하다. 특히 기출문제에서 정답률이 많이 올라온게 느껴진다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"MDEET 2회분(2008, 2009)을 풀고 관련 이론을 복습했다. 적중400제, 전범위 모의고사 등에서 틀린/어려웠던 문제들을 단권화 노트에 정리하며 다시 보고있다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"저번주와 마찬가지로 복습하면서 서머리에 정리한 내용 암기하고 있습니다. Md기출도 풀어보면서 정리하고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"이번 주는 문제를 중심으로 개념을 복습하는 데 집중했다. MD, 기출N적중, 모의고사 문제들에서 나온 개념들을 약점 노트에 보충해서 단권화 해주었다. 특히 광합성, 유전학, 인간 생식계 발생 등 이전에 정리하지 않았던 내용을 이번 주 문제 풀이를 통해 추가로 정리할 수 있었다. 또 생리학 파트를 점점 잊어버리는 것 같아 기출N적중 2,4회 생리학 문제를 복습하면서 관련 개념도 확장해서 공부해주었다. 그리고 그동안 약점노트를 작성하면서 빈출 포인트를 색깔로 표시해 두었는데 문제를 많이 풀수록 중요 포인트를 더욱 잘 파악할 수 있었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"적중N제 복습을 위주로 공부했고, 매일 1시간씩 복습을 하면서 까먹지 않도록 노력했다. 주말에는 1주일 동안 공부한 내용을 정리해서 누적 복습해줬다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"박선우선생님 OX 문제를 지금 다시 풀어보니 포인트 복습도 되고 좋았습니다. 또한 지난 시험들을 복습하며 놓치는 기본 내용은 없는지 보완했습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`
    ],
    화학:[
    `"STEP1,2 강의를 거의 끝냈다. 계획한 것보다 늦어졌긴했지만, 주어진 시간 안에 최선을 다하려 노렸했기에 칭찬한다. 배위화학 부분을 제대로 외우지 못했는데 이번기회에 제대로 외웠다. 강의를 듣고 똑선생님의 방식을 그대로 적용해 푸는 연습을 했다." — 단퓨프 (26학년도 목포(약) 합격생)`,
    `"학교별 기출이나 풀었던 문제들을 전범위 위주로 계속 실전 연습하며 감각 유지하는데 노력했다. 또 자잘하게 암기해야 할 것들이 생기면 정리해서 여러 번 보려고 했다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
    `"이번주에 22단원 문제를 모두 마무리했다. 다 푼 뒤에는 하루에 1시간씩 앞에서부터 복습했다. 기출올인원 점검 테스트가 있길래 한번 풀어봤는데 아슬아슬하게 우수 기준은 넘겼다. 생각하지 못한 구멍을 또 발견해서 긍정적으로 생각했다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"기출올인원에 있는 24년도 경성대 계명대 내용을 풀이 및 암기까지 마쳤다. 전공화학을 하면서 매일 1시간씩 2000제도 풀어 다음주 정도에 3회독이 마무리 될 예정이다. 다음주는 기출올인원 정리본 총복습을 2일정도 한 후 2025경성, 계명을 암기한 내용을 바탕으로 풀 예정이다. 이후에는 매일 2시간 했던거 복습+ 1시간 모의고사 풀이+ 1시간 오답의 시간을 가지려고 한다." — Akdow (26학년도 단국(약) 합격생)`,
    `"이번주에 채운 단원들은 시험에서 안 틀렸다! 화학열역학 척도가 나오는 단원들(열화학, 화학열역학, 상전이)이 뭔가 애매하고 찝찝한 기분이 들어서 파고들어서 해결하였다." — 시계탑기린친구 (26학년도 강원(수) 합격생)`,
    `"기존계획을 이어서 매주 200문제 문제풀이를 완료하였다." — Hcsg (26학년도 원광(약) 합격생)`,
    `"1)적중 2000제 코드1~3에 해당하는 문제들을 매일 30문제씩 풀이함. 2) 2025 주력학교 기출 3곳을 공부함. 3) 그동안의 오답이나 실수를 원노트에 정리하여 모의고사 보기 전에 복습함." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"가장 약점이었던 열화학 특히 이상기체 열역학 부분을 메꾸었다. 이번주 목표한 2000제와 기출올인원 문풀을 거의 완수하였다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"∙ 25년 기출 문제와 추가 문제를 풀고 해설강의를 통해 풀이 방법을 익혔음. 2000제를 매일 20문제씩 꾸준히 풀어줬음." — 레고링 (26학년도 계명(제약) 합격생)`,
    `"분석화학 다시 한 번 정리했고, 분광학도 기출올인원 복습을 통해 대부분의 내용 공부를 맞췄다. 전공화학까지는 더 이상 집착하지 않고, 내가 학습하지 않은 내용은 본고사에서 아무도 맞추지 못 할 것이다라고 생각하고 지엽적인 내용들을 덜어내고 있다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
    `"공부를 하지 않았던 분광학과 크로마토그래피를 공부했다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"주력학교 위주로 이제 총 10개 학교의 기출문제와 추가문제를 풀어보았다. (충남, 경희, 중앙, 연세, 고려, 동국의 2025, 2024 기출까지 완료) 상식 문제 등을 제외하고 기본기를 응용하는 문제들은 얼추 풀 수 있게 된 것 같은데, 여전히 풀이 속도가 많이 느린 듯 하다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"복습과 진도나가면서 말씀해주신대로 분석화학 문제들 쭉 풀고 반복해서 보면서 암기하고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"기출올인원 진도와 복습 비율을 5:5로 조정하니 다시 페이스를 찾아 갔다. 또한 매일 2000제 문제 선별해서 풀어 주며 기본 문제의 APS 떠올리는 것에 집중했다. 그리고 문제 풀면서 화학 열역학 단원을 약간 감으로 푸는 것 같다는 생각이 들어서 다시 1500제로 돌아가 개념 흐름 빠르게 복습해주고 2000제 문제 다시 풀면서 APS을 다시 체화하는 과정을 진행했다. 또 전기음성도, 양이온 정성분석, 지시약 pH 범위, 속도 공식 등등 단순 암기 사항은 자주 까먹어서 매일 화학 공부 시작 전에 간단히 손드로 적어가면서 습관적으로 봐주었다. 이번 모의고사에서는 처음으로 3 cycle을 적용해보았다. 계산이 조금 복잡하거나 막히는 나오면 일단 생각한 데까지 적어두고 그냥 넘어갔다. 두번째 사이클에서 다시 보니 안보이던 몇몇 문제가 풀렸고, 생물까지 푼 후에 세번째 사이클로 돌아와서 마지막까지 남았던 문제들의 풀이가 떠올랐다. 오늘 아침에 약간 잠이 덜깨 멍해서 평소 쉽게 풀던 문제도 APS가 빠르게 안 떠올라 순간 당황했었는데 이렇게 3 cycle로 쉬운 문제들로 머리를 깨워준 후에 복잡한 문제들을 푸니까 훨씬 잘 풀렸다. 다음 모의고사에서도 이런 경우에 멘탈 놓치지 않고 풀 수 있다는 자신감이 생겼다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"7월부터 본 타임어택 모의고사들을 매일 1회씩 다시 풀면서 모의고사 훈련을 했고, 전공화학 300문제 거의 다 풀었다. 홍쌤께서 조언해주신 대로 문제 위주로 개념을 보완하는 식으로 공부하니 분석화학 단원의 큰 틀을 금방 파악할 수 있었다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"난이도 높은 문제들을 풀어보면서 나의 약점을 되돌아볼 수 있었습니다. 또한 문제들을 풀며 기본이론에서 나올 수 있는 문제들에 대한 유형은 많이 파악할 수 있었습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`
    ],
    유기:[
    `"주어진 시간안에 최대한 진도를 나가기 위해 집중해서 공부했다. 시간이 없는 관계로 마인드맵은 방향족까지만 작성하고 알데히드 파트부터는 선생님께서 나눠주신 맵핑에다가 기억해야할 것을 메모하고 보았다. 확실히 내용이 한 눈에 들어와 정말 도움이 되었다. 알데히드와 케톤 파트는 계속 비슷한 메커니즘이 반복되는 느낌이었는데 하루가 지나면 금세 잊어버리곤 해서 계속 그리며 익숙하게 하도록 노력했다." — 단퓨프 (26학년도 목포(약) 합격생)`,
    `"이번 주는 그동안의 오답정리도 다시 보고 유기2 앞쪽 반응들은 백지에 그려가며 문제 풀 때 바로 생각날 수 있도록 복습했다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
    `"맵핑과 10월 테스트들을 복습하면서 이번주 볼 전범위를 대비했다. 조금씩은 유기화학에 감이 잡히고 있는 것 같다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"2일에 걸쳐 10월 유기 테스트 범위 1회차씩 암기 + 7월 테스트 문제 풀이+ 10월 테스트 문제 풀이를 하고있다. 유기는 앞으로 새로운 것을 하기보다는 해왔던 것을 계속 이런식으로 복습을 해서 체화하는데 집중할 것이다.항상 시작 15분정도는 전날 암기한 범위의 복습으로 시작한다.또 이번주와 다음주에 볼 전범위 테스트의 복기는 2회독정도 한 후 다시 한번 풀면서 정리하려고 한다." — Akdow (26학년도 단국(약) 합격생)`,
    `"1) 꾸준히 2시간~2시간 30분 공부함. 2) 구조화 암기법을 이용하여 전체적인 개념과 반응을 암기함. 바로 결과로 나와서 뿌듯했음." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"유기2부터 유기1까지 전범위 복습을 끝냈다. 잘 이해가 되지 않아 넘어갔던 부분들이 있었는데, 복습을 하며 놓쳤던 특정 개념이 들어오면서 비로소 이해되었다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"∙ 기본서의 남겨뒀던 유기2 부분까지 문제를 다 풀었음. ∙ 부족하다고 생각했던 유기2 파트를 복습을 통해 많이 익숙해졌다는 느낌을 받았음." — 레고링 (26학년도 계명(제약) 합격생)`,
    `"전체 범위 내용을 꾸준하게 학습하였다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
    `"알켄과 알카인 공부하면서 자신감이 많이 생겼다. 예전에는 시약에 따른 조건과 결과만 달달 외웠다면 이제는 손으로 직접 그릴수 있을만큼 많이 성장한것 같다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"아민까지 다시 한 번 전범위를 공부했다. 1회독 때는 테스트 일정에 쫓겨 유기2 후반부는 거의 이해하지 못한 채 넘어갔기 때문에 이제야 제대로 1회독을 마친 셈이다. 이제 시험 전까지 최대한 여러 번 볼 수 있도록 회독 속도를 높여야겠다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"매일 test복습, 스미스 예제 풀고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"기출문제 풀이를 하면서 반응 원리나 메커니즘을 외우지 않고 넘어갔던 부분들을 채워나갔다. 그리고 전날 약점 노트에 정리한 내용은 다음날 복습하면서 복습 - 문풀 - 강의 루틴으로 학습하니 더욱 효율이 올라갔다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"반응지를 외우고 VF 문제들을 계속 회독하면서 숙련도를 높이기 위해 노력했다. 전범위를 알고 회독하니 같은 문제라도 받아들이는 정보의 깊이가 점점 깊어지는 게 체감돼서 신기했다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"전반적인 복습을 통해서 유기화학의 감을 올렸고 동시에 익숙해 졌다고는 하지만 비교적 최근 공부를 시작했던 카복시산과 아민의 반응에 대해서는 복습을 더해주었습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`
    ],
    생활관리:[
    `"이번주도 저번주처럼 하루 10시간 이상 공부시간을 확보하고 주어진 시간을 최대로 활용했다. 항상 마스크를 착용하고 다니고 손도 자주 씻으며 건강관리에도 유의하려 신경썼다. 가족이 독감에 걸린 상태라 옮지 않게 더더욱 신경써야할 것 같다. 열심히 공부를 하다가도 불안감을 느낄 때는 약간의 보상을 주는 방식을 활용해봤다. 달달한 핫초코를 먹으며 기분전환을 하며 다시 공부를 한다던가 앞에 나가서 붕어빵을 사와 잠깐 먹는다던가 이렇게 소소하게 자신을 챙겨주며 다시 집중해 공부를 지속해봤다." — 단퓨프 (26학년도 목포(약) 합격생) [1w2]`,
    `"해야 할 것들이 많으니 루틴대로 하루하루를 집중하며 정말 열심히 보냈던 것 같다. 집중이 잠깐 안될 때면 스탠딩 책상에서 공부하는 식으로 변화를 주니 더 밀도 있게 공부할 수 있었다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생) [1w9]`,
    `"멘탈관리는 어느정도 성공한 것 같다. 불안에 삼켜지고 그러지는 않는다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생) [9w8]`,
    `"요즘 집중력이 많이 떨어져서 1시간반 공부 10분 휴식을 통해 집중력이 높은 상태에서만 공부하려고 한다." — Akdow (26학년도 단국(약) 합격생) [5w6]`,
    `"주 3회 고강도 운동과 기상시간을 철저히 지켰다." — 시계탑기린친구 (26학년도 강원(수) 합격생) [4w3]`,
    `"홍쌤이 조언해주신대로 이번주 목표인 200문제 문제풀이 및 오답을 무리 없이 완료했다. 일단 이렇게 하면 큰 무리 없이 다음 주까지 화학 2000제 문제풀이를 대부분 완료할 수 있다. 또한 큰 문제 없이 유기화학 전범위 1회독을 완료했다. 유기화학2 기말고사 대비와 함께 오답과 문제풀이만 더 해주면 큰 걱정은 없을 것 같다." — Hcsg (26학년도 원광(약) 합격생) [5w6]`,
    `"1) 최근에 20분~30분 정도 수면시간을 늘렸는데 컨디션이 매우 좋음. 수면 패턴이나 시간에 방해되는 요소 없이 충분히 숙면함. 2) 주말에는 30분 고강도 운동을 함. 3) 공부하기 싫다가도 내가 원래 공부하던 장소로 가면 자연스레 공부를 하게 됨. 루틴이 잘 잡혀서 공부하는 것이 어렵지 않았음." — 이번엔내차례 (26학년도 삼육(약) 합격생) [9w8]`,
    `"감기로 몸이 좋지 않아도 타협하지 않고 최대한 공부하려 노력했다. 바로 병원을 가서 약을 타왔기에 빨리 나을 수 있었다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생) [1w9]`,
    `"∙ 건강 관리를 잘 했고 매일 꾸준히 공부했음. 전반적으로 큰 무리 없이 루틴대로 생활을 함." — 레고링 (26학년도 계명(제약) 합격생) [9w1]`,
    `"지난주와 동일하게 루틴을 잘 이어나가고 있습니다!" — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생) [8w7]`,
    `"일찍자고 일찍 일어났다. 운동 2번 갔다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생) [5w6]`,
    `"마음은 심란해도 꾸준히 루틴 지키면서 생활하고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생) [6w5]`,
    `"이번주도 루틴을 지키며 규칙적인 생활을 유지하려고 노력했다. 열품타로 공부 시간 인증도 여전히 잘 진행하고 있고 덕분에 공부시간도 조금씩 늘려갔다. 계획대로 공부 분량을 못채우거나 모의고사에서 당황하거나 할 때 그 감정에 빠져 있기보다는 바로 개선 방향을 떠올리는 것으로 마인드 세팅을 바꾸면서 감정 조절면에서도 많이 성숙해진 것을 느꼈다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생) [4w3]`,
    `"루틴대로 일정하게 공부했고, 영양제 잘 챙겨먹으면서 컨디션 관리를 잘 했던 것 같다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생) [9w8]`,
    `"드디어 생활리듬을 어느정도 돌릴 수 있었습니다. 12시 전에 자고 새벽에 기상하는 패턴으로 바꾼지 몇일 되었습니다. 덕분에 건강도 다시 회복했습니다." — 후회없이살자 (26학년도 강원(약) 합격생) [5w6]`
    ]
  },
  "11-5":{
    생물:[
    `"전범위 위주로 문제 풀면서 이론을 채우려고 노력했다. 계속 복습하면서 부족한 부분을 우선적으로 채우려고 했다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
    `"기출 n제들을 처음부터 전체적으로 다시 풀고 복습하며 헷갈렸거나 틀린 부분은 페이지에 표시해뒀다. 다음주부터는 그 부분만 다시 보며 더 빠르게 복습할 수 있을 것 같다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"기출 n제 16회와 타임어택 5회 모의고사의 내용을 제외하고는 진행했던 단권화를 마쳤고 각 내용에 번호를 매겨서 이제부터는 매일 새로운것을 추가하면서 복습만 할 예정이다." — Akdow (26학년도 단국(약) 합격생)`,
    `"비전파인더 생물 시험을 꾸준히 보고 오답하고 있는 점." — Hcsg (26학년도 원광(약) 합격생)`,
    `"1) PEET 기출문제 풀이를 거의 마무리함. 남은 시간동안 MD 문제로 잘 마무리해줄 예정임. 2) 문제풀이하면서 문제의 정답이나 오답 근거를 한 줄로 정리하여 개념을 보충함." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"매일 한 단원씩 빠르게 복습을 함과 동시에 끝까지 안 외워지는 부분은 빨간색 펜으로 따로 필기 정리를 했다. 다시 책을 펼쳐볼 필요 없이 생물 공부 전 훑어보는 것만으로도 약점이 보완되는 것 같아 좋았다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"∙ 말로 설명하며 내용을 정리하는 방식을 계속 유지하며 복습했음. ∙ 점심 저녁 식사 시간을 이용해 생물 내용을 복기함. ∙ 매일 문제 풀이를 병행하며 외운 내용을 확인함." — 레고링 (26학년도 계명(제약) 합격생)`,
    `"분류학 암기를 다시 한 번 진행했다. 식생분진은 PEET때보다 출제되는 비중이 낮긴 하지만, 난이도가 있게 출제되지 않으니 암기하면 풀 수 있다는 생각으로 공부를 이어나갔다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
    `"문제BASE로 기본기를 쌓아 주었다. 여전히 틀리는건 많지만 시험장가기전까지 빈틈을 자꾸 매운다운 마인드로 공부중이다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"MDEET 2회분(2011, 2013)을 풀고 관련 이론을 복습했다. 적중400제, 전범위 모의고사 등에서 어려웠던 문제들을 단권화 노트에 정리하며 다시 보고있다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"지난주와 마찬가지로 복습, md기출 풀어보기 병행하고 있습니다. 문제 풀 때 정확하게 읽고 키워드에 표시해가면서 풀고있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"이번주는 식물, 진화, 상태 파트 복습을 하였다. 식물 파트는 그동안 문제를 통해서 많이 봐서 익숙했지만, 생태 파트는 오랜만에 다시 봐서 까먹은게 많다는게 느껴졌다. 그래서 캠벨을 키워드 중심으로 다시 읽으며 약점 노트에 단권화해주었다. 그리고 9월에 안풀었던 중앙대 기출도 풀며 출제 포인트로 나오는 부분을 중심으로 복습해주었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"적중N제를 15회차까지 모두 복기했고, 약점 단원인 오페론과 생화학 파트를 복습했다. 12월부터 전범위 무한 회독 할 수 있도록 7월 자료부터 정리한 단권화 노트를 완성했다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`
    ],
    화학:[
    `"매일 전범위 위주로 모의고사 연습하며 실전 감각을 유지하려고 노력했다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
    `"매일 아침 1시간은 22단원을 복습하고 그 뒤로는 기출 올인원에 해당되지 않아 풀지 않았던 학교들 문제들을 최대한 풀었다. 노트들은 계속 보충하고 있다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"25경성, 계명대 기출복원과 추가문제까지 마쳤고 매일26대비 모의고사를 1회씩 풀면서 연습하고 있다. 1시간을 목표로 풀었을 때는 준수한 성적이 계속 나오고 있고 다음주부터는 매일 정리본 2시간 복습과 2시간의 모의고사 풀이 및 복기를 할 예정이다." — Akdow (26학년도 단국(약) 합격생)`,
    `"기존계획을 이어서 매주 200문제 문제풀이를 계획대로 11월 말까지 밀리지 않고 진행하였다." — Hcsg (26학년도 원광(약) 합격생)`,
    `"1)적중 2000제 코드1~3에 해당하는 문제들을 매일 30문제씩 풀이함. 2) 2025 주력학교 기출을 공부함." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"계산실수를 잡기 위해 2000제 전 단원 계산문제들을 선별해 랜덤으로 풀었다. 효과가 있는지 알아보기 위해 몇 달 전 풀었던 VF 9월과 10월 모의고사를 다시 시간재고 풀어보았다. 시험 전까지 지금처럼 매일 계산 연습을 하는 것이 좋겠다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"∙ 오전에 전범위 모의고사를 시간을 재고 풀며 전범위 내용을 복습함. ∙ 2000제 문제를 매일 복습하며 기본기를 잡음." — 레고링 (26학년도 계명(제약) 합격생)`,
    `"25 계명&경성, 24 계명 일부를 공부하면서 전공화학에 대한 이해를 쌓았다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"주력학교 위주로 기출을 풀고 부족한 단원을 기출 올인원, 적중 2000제로 복습했다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"기출올인원 풀면서 실수도 실력이라는 생각으로 기본적인 문제들 다시 쭉 보면서 2000제 복습하고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"저번주와 마찬가지로 기출올인원 진도와 복습 비율을 5:5로 학습해주었다. 진도가 느리더라도 이렇게 기본기를 잡고 가니 기출 문제 풀 때도 훨씬 밀도 있게 공부할 수 있었다. 그리고 2000제의 취약 단원 문제를 전체적으로 빠르게 풀며 기본기를 놓치지 않도록 점검했다. 문제를 풀면서 APS 바로 떠오르지 않는 문제, 핵심 개념을 묻는 문제, 상식 문제, 단순 계산 문제를 선별해서 따로 정리해두었다. 박선우T 카페에서 ‘편입시험 고득점 방법/ 마무리 복습 방법’ 칼럼을 참고해 시험 직전에 반복할 핵심 문제들을 추려두는 방식을 적용해보고자 한 것이고, 이 작업이 이번 모의고사에서 좋은 결과로 이어졌다. 아침에 정신을 깨우려고 몸풀기용으로 선별해둔 단순 계산 문제를 10문제 정도 풀고 시험을 봤더니 계산 실수를 하지 않았다. 그리고 A4용지에 단순 암기 사항들을 모아서 정리해두고 이틀에 한번씩 백지에 적어 보는 것도 큰 도움이 되었다. 덕분에 이번 모의고사에서 양쪽성 수산화물 고르는 문제에서 고민 없이 바로 답을 체크할 수 있었다. 이렇게 하니까 성적이 오른 것을 경험하니 남은 한 달 동안 2000제를 복습하며 핵심 문제를 추려 시험 직전에 풀어가는 전략이 시험장에서 안정감을 줄 것이라는 확신이 생겼다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"약점 파트인 배위화합물을 기출올인원과 2000제를 다시 풀며 보완했다. 그리고 타임어택을 1일 1회 풀면서 전범위 모의고사 연습을 본격적으로 하고 시작했다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`
    ],
    유기:[
    `"아민 파트 위주로 공부하고, 유기1까지 전범위를 복습했다. 반응들은 자주 보면서 휘발되지 않도록 노력했다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
    `"내용 요약본을 전체적으로 보며 바로 떠오르지 않는 반응은 직접 표시해두고 회독했다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"전범위 복습을 마쳤고 vf파이널 테스트 2회분을 제외한 나머지 테스트들에 있는 문제들도 어느정도 체화에 성공했다. 복습을 온전히 마쳤으니 다음주는 final 2회차 분량을 다시 풀어보고 추가할 내용은 추가하며 계속 복습만 할 예정이다." — Akdow (26학년도 단국(약) 합격생)`,
    `"1) 꾸준히 2시간~2시간 30분 공부함. 2) 전체적으로 개념과 반응을 암기함. 3) 기본서 복습과 함께 기본서 예제도 다시 풀고 있음." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"지난 주 약간 감을 잃어버렸던 알코올/에터와 알켄 파트를 다시 VF 문제들을 풀어보며 감을 잡았다. 어느 정도 큰 틀이 완성된 듯하여 다음주도 이번주처럼 계속 VF로 복습하고 맵핑으로 전체 유기1,2 그림 잊지 않게 복습하고 이런 식으로 공부해야겠다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"∙ 7,8월의 유기화학 테스트 문제들을 전부 풀었음. 전범위 문제를 다 풀어주니 내용을 빠르게 복습할 수 있었음." — 레고링 (26학년도 계명(제약) 합격생)`,
    `"전체 범위 내용을 꾸준하게 학습하였다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
    `"VF 문제와 약사랑 유기화학 자료를 바탕으로 차근차근 공부했다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"매일 test복습, 스미스 예제 풀고 있고, 제공받은 요약 파일 보면서 암기하고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"이번주도 기출문제 풀이를 하면서 반응 원리나 메커니즘을 외우지 않고 넘어갔던 부분들을 채워나갔다. 전날 내용 복습 - 문풀 - 강의 - 약점 노트 정리 루틴을 유지하면서 학습해나갔다. 그 결과 이번 모의고사에서 문제 풀 때 정답에 확신을 가지고 다 맞출 수 있었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"11월 전범위 test 전까지 2회독을 마쳤고, VF 제공 써머리 자료를 참고해서 맵핑지를 다듬었다. 계속 반복하니 어느정도 응용력이 생긴 것 같고, 이번 모의고사에서도 유기화학을 다 맞을 수 있었다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`
    ],
    생활관리:[
    `"전반적으로 흔들리지 않고 꾸준히 루틴 지키며 공부했다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생) [1w9]`,
    `"전반적으로 기상 시간과 취침 시간을 꽤 잘 유지한 것 같다." — Akdow (26학년도 단국(약) 합격생) [5w6]`,
    `"홍쌤이 조언해주신대로 11월 말까지의 목표인 200문제 문제풀이 및 오답을 큰 무리 없이 마무리했다. 덕분에 화학 2000제 문제풀이는 302문제밖에 남지 않았다.또한 큰 문제 없이 유기화학 전범위 1회독을 완료했다. 유기화학2 기말고사 대비와 함께 오답과 문제풀이만 더 해주면 큰 걱정은 없을 것 같다." — Hcsg (26학년도 원광(약) 합격생) [5w6]`,
    `"1) 주말에 30분 인터벌 운동을 함. 2) 하루이틀 집중력이 떨어져도 루틴을 지켜나가면서 최소 공부 시간을 채우고 일주일 목표도 지킬 수 있었음." — 이번엔내차례 (26학년도 삼육(약) 합격생) [9w8]`,
    `"주중까지는 좋은 컨디션으로 푹 자고 충분히 공부하였다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생) [1w9]`,
    `"∙ 매일 루틴을 지키며 공부를 함. 컨디션에 큰 기복 없이 꾸준하게 생활을 하고 있음." — 레고링 (26학년도 계명(제약) 합격생) [9w1]`,
    `"지난주와 동일하게 루틴을 잘 이어나가고 있습니다!" — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생) [8w7]`,
    `"일찍자고 일찍 일어났다. 운동 2번 갔다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생) [5w6]`,
    `"계획한 일정대로 규칙적인 생활을 유지했다." — 초록콩 (26학년도 순천(약) 합격생) [9w1]`,
    `"긍정적인 생각하면서 루틴 잘 지키고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생) [6w5]`,
    `"7월에 애니어그램 학습법을 읽으며 공부 방식에 적용하기 시작했을 대는 완벽보다는 완성하자는 말이 머리로는 이해되었지만 잘 와닿지는 않았었다. 5개월 동안 애니어그램 학습법을 실천하려고 노력해보니 이제 완벽주의를 추구하던 나에서 완성을 목표로 하는 나로 바뀐게 느껴졌다. 이번주도 완벽하게 계획했던 모든 것을 하진 못했지만 매일 밤에 하루에 대한 피드백을 하면서 내일은 계획을 지키기 위해 무엇을 해야 할지 고민하며 일주일을 완성시키고자 하였다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생) [4w3]`,
    `"이번주도 별 탈 없이 루틴대로 공부했다. 감정기복이 많이 나아졌다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생) [9w8]`
    ]
  },
  "12-1":{
    생물:[
    `"기출 n제를 모두 복습했고, mdp는 하루에 2회차씩 풀었던 걸 복습하고 관련 내용에서 헷갈리는게 나오면 복습하는 식으로 공부했다. 써머리도 연필로 써둔 내용 중 확실히 기억하는 건 지우고, 여전히 헷갈리거나 중요한 건 볼펜으로 옮겨적는 등 정리작업에 들어갔다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"3권 인체생리학 파트 복습할 때, 끝까지 안외워지는 부분들만 발췌해 빨간펜으로 따로 정리했다. 매 단원 회독 전 정리한 부분을 모아 누적 복습을 했는데 약점이 되는 부분을 빠르게 복습할 수 있어 좋았다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"문장, 단어 정확히 읽고 표시하면서 복습하고 있고, md문제도 풀고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"이번주는 세포생물학, 생화학 복습을 하였다. VF OX, 중앙대 기출, 기출N적중 400제, 박선우 OX, MDP 등 그동안 풀었던 모든 문제를 복습하며 기본기도 재점검하고 필요한 내용은 약점 노트에 추가적으로 단권화해주었다. 그당시 틀렸던 문제를 다시 푸니 잘 풀리는 문제들이 많아서 실력이 올랐다는 것이 느껴졌다. 그래도 여전히 틀리는 문제도 있어서 아직까지도 헷갈리는 개념들은 따로 표시해두고 반복해주었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`
    ],
    화학:[
    `"기출 올인원에 있는 모든 문제를 다 풀었다. 모의고사를 풀거나 약점 노트에 정리해둔 부분들을 다시 풀면서 실수가 나는지 점검하고 약점노트에서 확실히 풀 수 있는건 지우고 여전히 헷갈리고 틀리는건 표시를 하면서 정리하고 있다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"계산을 잡기 위해 2000제 계산 문제들을 랜덤으로 푸는 연습을 했다. 연습용 모의고사와 11월 모의고사로 테스트를 해보니, 더 이상 계산으로 많이 틀리는 일은 없었다. 감을 잃지 않도록 쉬운 문제들을 조금씩 계속해서 풀어나가야겠다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"2000제 복습 매일 하면서 기출올인원 풀고 있고, 실수 노트에 작성한 내용 틈날때마다 숙지하고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"이번주도 기출올인원 진도와 복습 비율을 5:5로 학습해주었다. 어느정도 기본 문제는 이제 바로 APS가 떠올라서 자신감이 많이 올라왔다. 그리고 2000제 취약 단원 문제를 전체적으로 빠르게 풀며 기본기 엽습을 해주었다. 문제를 풀면서 APS 바로 떠오르지 않는 문제, 핵심 개념을 묻는 문제, 상식 문제, 단순 계산 문제를 선별해서 따로 정리해두었다. 그런데 생각보다 2000제 전체 문제를 복습하는 것이 오래 걸려서 코드 1~3까지만 복습하는 것으로 계획을 조정할 계획이다. 그리고 전공화학 공부도 시작했다. 시험 보러 다니기 시작하면 여유가 없을 것 같아 늦은 감이 있지만 지금부터라도 해야 겠다고 생각했다. 이번주에는 25년도 계명대 기출 강의를 듣고 정리해두었고, 다음주에는 모든 계명, 경성 기출을 마칠 수 있을 것 같다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`
    ],
    유기:[
    `"기본서에 단원별 문제들을 다시 풀면서 헷갈리는 부분이 나오면 개념으로 돌아가 복습한 뒤 유기 요약본에 표시하거나 기록해두는 식으로 공부하고 있다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"매주 토요일마다 맵핑으로 전단원 복습을 하고 있는데, 주기적으로 반복해서 보니 익숙하고 문제풀 때 반응속도도 더 빨라지는 듯하다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"저번주와 마찬가지로 매일 test복습, 스미스 문제 풀고 있고, 제공받은 요약 파일로 암기하고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"이번주도 기출문제 풀이를 하면서 반응 원리나 메커니즘을 외우지 않고 넘어갔던 부분들을 채워나갔다. 전날 내용 복습 - 문풀 - 강의 - 약점 노트 정리 루틴을 유지하면서 학습해나갔다. 반응 매핑 연습도 꾸준히 하면서 전체 반응에 대한 감을 잃지 않으려고 하였다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`
    ],
    생활관리:[
    `"항상 막바지에 불안이 극심해져 오히려 회피하는게 심해지는데 이걸로 인해 이번주 공부시간이 줄어드는게 보여 선생님께 조언을 구했다. 다음주는 스터디카페에 있는 시간을 더 늘려 잡생각이 없어지도록 노력할 예정이다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생) [9w8]`,
    `"아픈 와중에도 기력이 좀 돌아오면 공부를 조금씩 하려고 노력했다. 그동안 열심히 해온 게 있어서 그런지 이틀 정도 쉬었음에도 크게 불안하지 않았다. 그래도 남은 두 달 컨디션 관리에 주의하자" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생) [1w9]`,
    `"평정심을 가지고 루틴 잘 지키면서 보내고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생) [6w5]`,
    `"시험이 다가올수록 ‘시간이 더 있었다면 더 잘할 수 있었을 텐데’라는 생각이 들었다. 그래도 후회하는데 시간을 쏟기 보다는 이런 생각이 들 때마다 지금 무엇을 할 수 있는지 계획을 세웠다. 오히려 이렇게 임박한 상황에서 더 집중력을 발휘해서 벼락치기를 잘하는 편이라 최대로 집중해서 공부했다. 그리고 오전 시험을 대비해서 취침, 기상시간을 앞당겨서 생활 리듬을 조절했다. 첫날은 7시에 일어나는 것이 쉽지 않았지만, 일찍 일어나서 오전 공부 시간을 늘리고 하루의 시작을 잘했다는 생각이 드니까 오히려 그 뒤 공부도 잘되었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생) [4w3]`
    ]
  },
  "12-2":{
    생물:[
    `"캠벨을 읽고 써머리에 부족한 부분을 정리하고 가능하면 꿀벌책도 빠르게 읽으며 분자생물학 파트를 나갔다. 해당 파트 vf문제들도 풀고 써머리 o,x도 풀어 다각도에서 해당 내용을 보며 자연스레 중요한 부분을 익히게 되었다. 9월에 분자생물학을 공부할 땐 눈에 들어오지 않던 부분과 캠벨을 읽을 때 어렵다고 생각했던 부분이 이해가 되고 흐름을 캐치하며 내용이 조금은 압축되어진것처럼 느껴졌다" — 단퓨프 (26학년도 목포(약) 합격생)`,
    `"전범위 위주로 문제 풀면서 이론을 채우려고 노력했다. 풀었던 문제들을 최대한 복습하면서 부족한 부분을 우선적으로 채우려고 했다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
    `"써머리 전권 복습을 목표로 잡고 매일 반권씩 보며 캠벨 그림 부분도 회독하면서 복습을 이어갔다. 캠벨을 다시 읽으니 확실히 기본기를 다시 다지고 있다는 느낌이 들어 다음주도 이어갈 예정이다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"일주일동안 인체생리학을 MDP 그래프들, VF 문제들, 약물들과 함께 전부 복습했고 정리노트를 주기적으로 복습했다. MDP 유전문제들도 5문제씩 다시 풀어보았다. 다음주부터는 속도를 내어 빠르게 전체 복습을 할 수 있겠다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"∙ 문제 풀이와 개념 공부를 계속 병행해 주고 있음. 셀프 티칭을 하며 매일 말로 설명하는 방식으로 단원별 복습을 했고 전범위 문제를 풀고 헷갈리는 내용을 보충해줌." — 레고링 (26학년도 계명(제약) 합격생)`,
    `"MDP 풀던것들을 멈추고, 지금까지 문제 푼것들을 다시 풀면서 이론을 다시 보고 있다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"회독 속도가 올라서 이제 일주일에 1회독까지는 무난히 가능해졌다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"저번주와 같이 문제 복습하였고, 서머리 1회독 하면서 이론복습도 하고 있습니다. 회독 기간 단축해서 여러 번 회독하도록 하겠습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"12월부터 지금까지 했던 모든 문제들과 개념들을 복습하는 중이다. 새로운 문제에 대한 욕심을 내려놓고 공부했던 부분을 안 까먹는 방향으로 공부하니 생명이 마냥 어렵고 지엽적으로 다가오진 않는 것 같다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"일단 배운 내용부터 확실히 해두는 것이 효율적이란 것을 알기에 마음은 급하지만 이론 복습을 공고히했습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
    `"평소에 헷갈려하고 어려워하던 단원들의 개념들 위주로 여러 번 봤다. 어려운게 아니라 익숙하지 않은 것이었다고 생각한다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`
    ],
    화학:[
    `"화학 진도가 생각처럼 안 나가져 방황했었는데 다시 마음을 다잡고 그날 공부하는 내용에 집중했다. 상식 내용이 처음엔 방대하다고 느끼고, 모르는 부분이 많은 것 같아 고민이었는데 한 단원 끝나고 30분 정도 투자해 굿노트 스터디카드로 만들어 생각날 때 종종 보니 익숙해진 것 같다. 처음엔 바로 다시 2000제 1,2를 풀다가 빠르게 1500제를 보고 푸는게 좋을 것 같아 지금은 그렇게 진행하고 있다. 본고사를 생각하면 지금 실력으론 막막하지만, 그래도 현재 나가고 있는 부분에 대해서는 선생님의 풀이를 잘 따라가고 있다는 생각이 든다." — 단퓨프 (26학년도 목포(약) 합격생)`,
    `"전범위 위주로 모의고사 연습하며 실전 감각을 유지하려고 노력했다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
    `"약점 노트에 기록해둔 내용이나 문제들을 모두 다시 풀어보고, 올라온 연습 모의고사를 모두 풀었다. 그 모의고사들 중 하나가 매우 시간이 빠듯해서 엄청 당황하고, 성적이 매우 낮게 나왔는데, 반대로 그때 경험을 해서 오늘 테스트에서 말렸을 때도 일단 넘기고 마지막에 다시 돌아와서 다 풀어낼 수 있었다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"* 한 단원 코드 1~3을 풀고 다음날에 틀린문제는 다시 풀고, 어느정도 자신감이 생겼다 싶을 때 기출올인원의 새로운 문제로 잘 푸는지 확인해주었다. * 1500제 단원마무리 문제, 의편사에서 구한 전북대 기출복원문제를 활용하여 전범위에 대한 기본 계산 감을 유지해주었다. * 화학 공부시간도 4시간~4시간 30분 정도로 해주려고 노력하였다." — 시계탑기린친구 (26학년도 강원(수) 합격생)`,
    `"이번주부터는 해왔던 것들에 집중하기로 했다. 연습용 모고를 풀고 25학년도 문제들은 해당 학교 기출로 돌아가 유사 문제들을 추가로 풀었다. 2000제와 기출올인원도 꾸준히 다시 풀고 있다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"∙ 매일 아침에 모의고사를 풀어주었고 단원별로 기본적이지만 중요한 2000제 문제들을 매일 풀었음." — 레고링 (26학년도 계명(제약) 합격생)`,
    `"저번주에 전공화학을 공부하면서 무뎌진 기본기를 이번에 다시 채웠다. 다음주에는 전공화학과 기본기 두마리를 동시에 잡을 계획이다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"하루에 2000제 3~40문제 + 전범위 1개회차 페이스를 꾸준히 지키며 감을 놓치지 않기위해 애썼다. 기본문제는 거의 다 풀 수 있게 되었다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"2000제 복습 할 때 양론, 열화학, 기체 문제들 빠르게 풀기 연습하고 있습니다. 기출올인원도 시간 재면서 풀고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"박인규 선생님께 받은 모의고사를 하루에 하나씩 풀고, 2000제를 틈틈히 복습했다. 모의고사 훈련을 하니 문제 푸는 속도가 점점 붙는 것이 느껴졌고, 본고사에서도 잘 볼 수 있을 것 같다는 자신감을 얻고 있다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"연습용 모의고사와 2000제 복습으로 감을 유지했고 시험 이틀전부터 풀어볼 문제들을 선별중입니다. 또 스타일이 조금 다른 화학문제들도 조금씨 풀어보며 시험장에서 덜 긴장할 수 있도록 노력중입니다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
    `"문제를 최대한 많이 풀어보려고 노력했다. 그래도 어느정도는 할 수 있다는 자신감을 갖게 되었다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`
    ],
    유기:[
    `"카보닐 파트는 매커니즘을 많이 써보며 익숙하게 했다. 강의 영상을 보고, 해당 부분을 스미스로 공부하고, 이것을 반복한 것 같다. 카보닐 파트가 첨엔 어렵고 정리가 잘 안된다고 생각이 들어 다시 빠르게 한 번 보고 문제를 푸니 익숙해진 것 같다. 뒤에선 원리가 반복되고 있다고 느꼈다." — 단퓨프 (26학년도 목포(약) 합격생)`,
    `"반응 문제들을 계속 틀려서, 맵핑으로 매일 익숙해질 때까지 복습했다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
    `"저번주와 똑같은 방식으로 공부하고 있다. 기본서에 단원별 문제들을 다시 풀면서 헷갈리는 부분이 나오면 개념으로 돌아가 복습한 뒤 유기 요약본에 표시하거나 기록해둔다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"VF 문제들을 다시 풀며 놓쳤던 개념들을 다시 외우고 채워넣고를 반복하고 있다. 그리고 절대 잊어서는 안될 개념은 개념노트에 따로 정리해 시험 직전까지 볼 수 있도록 정리했다. 개념이 흔들리는 곳은 유튜브로 돌아가 일부 보충하기도 했다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"∙ 풀었던 문제를 다시 풀며 헷갈리는 내용을 정리하고 부족하다고 느끼는 부분은 기본서와 강의를 보며 채웠음. 전범위를 골고루 복습해줌." — 레고링 (26학년도 계명(제약) 합격생)`,
    `"카보닐 축합까지 복습을 완료했다. 진짜 많이 성장했다고 체감하는 요즘이다. 시약조건에 따른 결과만 단순 암기로 억지로 꾸역꾸역 문제를 풀던 예전과는 달리, 손으로 물흐르듯 메커니즘을 그리고 문제를 풀고 있다고 느낀다. 다음주에는 아민까지 끝내고 다시 복습을 진행하겠다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"VF 문제, 기본서 예제들 중 헷갈리는 문제들만 모아서 노트를 만들어 복습했다. 추가로 윤관식T 써머리 겸 기출풀이 인강이 30강 정도로 꽤나 컴팩트해보여서 저번주와 이번주에 절반 정도 들었는데, 기출로만 구성된 100문제 중 8~90문제 가량이 술술 풀려서 굉장히 놀랍고 뿌듯했다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"저번주와 마찬가지로 test복습 제공받은 요약 파일로 암기하고 있고, 유튜브 보면서 핵심 반응들 복습하고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"유기2까지 복습하면서 전범위에 대한 개념이 어느정도 공고히 잡힌 것 같다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"이번주 유기화학공부가 부진했습니다. 그러나 하루 30분이라도 이론을 반바퀴씩 돌려서 잊은 부분은 없습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
    `"크게 어렵게 나오지 않는다면, 큰 얼개 위주로 다회독해서 내용들을 당연하게 만드는게 유리할 것 같아서 계속해서 VF문제를 풀면서 약사랑유기화학 자료를 보고있다. 어려워하던 단원들도 하다보니 암기가 되는 것 같다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`
    ],
    생활관리:[
    `"시험은 다가오는데 내 실력은 부족하고, 시간은 없고 마음은 너무 힘들었지만, 그래도 매일매일 앉아 그날의 공부를 하려 노력했다. 서류를 준비하고, 접수를 하느라 공부시간이 줄었지만, 바로 다시 돌아와 집중하려 노력했다. 몸이 조금 좋지 않았지만, 초기에 약도 잘 챙겨먹고 따뜻한 물도 마셨더니 괜찮아진 것 같다. 건강관리에 유의하고 있다." — 단퓨프 (26학년도 목포(약) 합격생) [1w2]`,
    `"저번주보다는 나은 주를 보냈다. 다음주부터는 저녁에 가벼운 달리기을 다시 하며 기분을 더 다잡도록 노력해야겠다. 선생님께서 보내주신 문구를 캡쳐해서 아침에 공부하기 전에 보고 있다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생) [9w8]`,
    `"*오전에 너무 많이 졸아서 아예 놓아버릴 뻔도 했지만 그럴 때일수록 고강도 운동을 해주고, 애니어그램을 다시 읽으며 완벽보다는 완성하자는 마음을 가지려고 스스로에게 상기시켰다. 덕분에 주춤하긴했어도 놓지 않고 다시 공부량을 회복했다. * 저번주에 선생님이 피드백 주신 것을 플래너에 써두고 그날 할일을 정할 때 다시 봐주면서 불안감에 공부를 회피하지 않으려고 의식적으로 노력하였다." — 시계탑기린친구 (26학년도 강원(수) 합격생) [4w3]`,
    `"공부를 마친 이후에도 매일 조금씩 시간을 더 내어 자소서를 완성하고 있다. 자투리 시간을 이용해 자소서도 조금씩 다듬어두었다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생) [1w9]`,
    `"∙ 건강 관리를 잘 하며 루틴대로 생활했음. 심적으로도 예전보다 안정적으로 살고 있는 것 같다." — 레고링 (26학년도 계명(제약) 합격생) [9w1]`,
    `"일찍자고 일찍 일어났다. 운동 1번 갔다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생) [5w6]`,
    `"원서 접수, 자소서 등 공부 외의 일들에 시간을 많이 소모했지만 하루 10시간 이상의 순공시간은 간신히 지켜냈다." — 초록콩 (26학년도 순천(약) 합격생) [9w1]`,
    `"원서접수로 정신 없었지만, 하루하루 공부량 채우면서 잘 해온 것 같다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생) [9w8]`,
    `"하루 20분 운동을 짧지만 고강도로 했습니다. 신기하게도 지난달보다 벤치프레스가 10kg늘어서 120kg 달성했습니다. 데드리프트도 20kg 늘어 170kg을 달성했습니다." — 후회없이살자 (26학년도 강원(약) 합격생) [5w6]`,
    `"최대한 마음을 편하게 먹고 자신감 가지려고 노력하고 있다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생) [9w1]`
    ]
  },
  "7-1":{
    생물:[
    `"ox퀴즈 범위를 따라가면서 매일 아침 2시간씩 내용을 복기하고 누적 복습을 했다." — Akdow (26학년도 단국(약) 합격생)`,
    `"o, X 퀴즈 일정에 맞춰 기본기를 쌓기 위해 매일매일 새워둔 분량을 지키며 공부함" — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"강의를 들으며 1학기에 생물전공을 듣고 왔다 보니 이해가 잘 되고, 딱히 막히는게 없다고 생각이 듦. 복습 & 워크북 밀리지 않고 함" — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"강의 듣는 시간을 줄이고 자습 시간을 늘렸다는 점이 좋았다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"이준 선생님 강의를 듣고 복습하였으며 정해주신 진도대로 캠벨 책을 읽으며 기본적인 내용을 학습하였음." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"학습계획에 따라 핵심 기본기 OX 진도에 맞춰서 기본서 및 박선우 이론서 복습을 철저히 함." — 쿠리만쥰 (26학년도 5관왕 | 단국(약)·계명(제약)·삼육(약)·강원(약)·우석(약) 합격생)`,
    `"이전에 공부를 했을 때는 글을 읽는 과정에서 눈으로만 읽었던 것 같다. 이번에는 그동안의 습관을 바꿔서 질 좋은 공부를 하기 위해 노력하였고, 한 문장 한 문장 최선을 다해 인과관계를 생각하며 학습을 진행하였다. 이런 식으로 공부하니, 한 번 보더라도 이해가 훨씬 잘 되었고, 머리에 많이 남는 느낌을 받았다.  OX 진도에 맞춰 핵심 내용 위주로 공부하였다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
    `"기본서를 다시 읽다보니, 처음 공부할 때에는 삽입된 그림을 살피는 일에 너무 소홀했었다는 사실을 깨달을 수 있었다. 이번에는 삽입된 그림들을 꼼꼼히 살피면서 정독했더니 보다 깊은 이해에 도움이 되었던 것 같다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"기본서를 읽을 때 굵은 글씨 위주로 읽으려 했고, 박선우 교재 복습도 시작하였습니다. ox퀴즈 리뷰도 병행하였습니다. 기본서, 박선우 교재, ox퀴즈를 병행해서 학습하니 여러 번 반복 학습하는 효과가 있는 것 같아서 좋았습니다 ." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"강의 수강 전 캠벨을 읽으며 흐름을 파악함" — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"계획한 만큼 강의를 듣고, 월수금 OX 문제 풀기 전 기본서를 읽으면서 기본적인 내용에 충실하게 공부할 수 있었다." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"아직은 진도를 빼야 해서 강의시청 위주로 공부했지만 그때그때 잊기 전에 복습을 해서 그나마 많은 내용을 잊지 않고 기억하고 있다. 강의 내용이 “알던 내용 대부분 + 처음 듣는 내용 조금 + 대충 알았지만 다시 제대로 이해하는 부분”으로 이루어져 있어서 버겁진 않다." — 약대가쟝 (26학년도 단국(약) 합격생)`
    ],
    화학:[
    `"새로 들은 부분은 쉬운 문제를 여러 개 풀어서 익숙해지고 정확히 이해하는데 집중 했다." — Akdow (26학년도 단국(약) 합격생)`,
    `"박인규 선생님 강의에서 배운 문제를 접근하는 방식이나 식을 작성하는 방법이 매우 새로워서 열심히 배우려 함. 기본적 내용이어도 내가 알던 방식과는 달라서 성급히 넘기려는 마음이 들지 않았음." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"1500제 완강! 1회독 완료! 1회독때는 풀이의 전체적인 흐름을 봤다면, 2회독째에는 문제를 풀 때 계산에 집착하지 않고 문제의 큰 틀에 집중하며 풀이를 능동적으로 설계하는데에 집중하는 중. 잘 하고 있다는 느낌이 듦." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"기본 강의를 최대한 집중해서 빠르게 듣고 기본적인 문제 풀이를 병행하며 기본 개념을 익힐려고 노력함." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"핵심이론 복습을 병행하며 기본적이고 핵심적인 내용이 담겨있는 문제를 반복해서 풀다보니 까먹었던 내용들이 다시 기억이 났고 알고있던 지식들이 탄탄해짐. 이번 주는 매일 계획한 시간만큼 일반화학 공부를 했음" — 쿠리만쥰 (26학년도 5관왕 | 단국(약)·계명(제약)·삼육(약)·강원(약)·우석(약) 합격생)`,
    `"화학 문제 푸는 것을 좋아하고, 나름대로 자신감도 있었지만, 그럼에도 불구하고 강의를 빠르게 확인하여 나의 풀이가 올바른 풀이가 맞는지 확인하는 과정을 거쳤다. 이 과정을 통해 평형 파트에서 놓쳤던 부분 두 가지를 확인할 수 있었다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
    `"그간 코드번호를 가리지 않고 모든 문제를 푼 후 다음 단원으로 넘어갔는데, 사전상담 후 코드1,2번 문제만 풀고 넘어가는 방법으로 전략을 바꾸었더니, 진도가 처지지 않고 탄력있게 나아가는 듯한 느낌이 들어서 좋았다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"1500제 복습을 매일 하면서 박인규 선생님의 풀이법을 다시 한번 익히고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"1500제에 있는 일반화학 학습법에 따라 문제를 통해 개념을 이해하고, 단원이 끝날 때마다 기본서를 읽음, 빠르게 풀기보다는 정확하게 박인규 선생님의 풀이 방식대로 풀려고 강의에서 배운 사고 방식을 계속해서 생각함" — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"모든 문제를 A.P.S 문제 풀이법을 따라서 풀려고 노력했다. 자연스럽게 박인규 선생님의 풀이 방식과 비슷해졌다. 그리고 목차 암기법으로 화학 개념이 더 명확해진 것 같다." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"확실히 기본적인 내용은 다 아는거라 약간의 배속으로 빨리빨리 나갈 수 있어서 좋다. 하지만 대충대충 하지 않고 내 방식과 인규쌤의 방법의 차이를 정확히 캐치해서 내 것으로 만들어나가고 있다. 진도가 빨라서 7월안에는 수월하게 1500제를 끝낼 것 같다. 화요일에 시험이 있으니 내일은 화학에 더 치중해야겠다." — 약대가쟝 (26학년도 단국(약) 합격생)`
    ],
    유기:[
    `"매일 매일 조금씩이라도 공부하려고 노력함." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"앞단원은 이미 아는 내용들이라 할애를 많이 안했는데, 앞으론 유기 공부시간을 매일 가져야겠다고 생각됨." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"책을 늦게 구해서 기본서를 읽지는 않았지만 피트 때 사용했던 교재와 정리본을 이용해 진도를 맞춤." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"귀찮더라도 손으로 직접 매커니즘을 써보면서 공부하고 있음. 눈으로 보기만 하는것보다 더 학습 효과가 뛰어난 것 같음." — 쿠리만쥰 (26학년도 5관왕 | 단국(약)·계명(제약)·삼육(약)·강원(약)·우석(약) 합격생)`,
    `"기본서를 중심으로 매일매일 차근차근 예제를 풀다 보니 이해가 잘 되어서 좋았다. 유기화학을 공부하며 보람을 느낀 것은 처음이라 의미가 있었다. 아직 본격적인 반응은 시작하지 않아 여전히 가장 걱정되는 과목이지만, 차근차근 꾸준히 해나가면 정복할 수 있지 않을까 하는 기대감이 생겼다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"이번 주는 유기화학에 크게 신경을 쓰지 못했습니다. 권민 교재를 쭉 읽고 기본서를 읽으려 했는데 다음 주부터는 기본서와 병행해서 읽어야겠습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"잘한게 하나도 없다. 매일 조금씩이라도 유기화학 공부하기로 다짐했으면서 이번주 시험범위만 겨우 봤다. 생물과 일반화학, 그리고 토익(1~2일)에 너무 시간을 뺏긴 나머지 신경쓰지 못했다. 돌아오는 주에는 최소한 VF 다음 시험범위 복습과 내가 나가고 있는 진도의 한두 챕터는 끝내야겠다." — 약대가쟝 (26학년도 단국(약) 합격생)`
    ],
    생활관리:[
    `"12시반 취침 7시 반 기상은 매일 실천하고 있고 밥 먹는 시간에서 쓸데없는 시간 낭비를 하지 않고 있다." — Akdow (26학년도 단국(약) 합격생) [5w6]`,
    `"익숙한 환경에서 벗어나라는 선생님의 조언에 따라 좀 더 먼 동네의 관리형 독서실을 끊음. 매일 9번 애니어그램 공부법 글을 읽고 시작하려 노력함 평일 내내 7시 기상을 지킴" — 승민 (26학년도 단국(약)·연세(생화학) 합격생) [9w8]`,
    `"매일 칭찬일기 짧게 쓰는 중, 아침 매일 7시 기상," — 고냥이 (26학년도 경희(치)·경성(약) 합격생) [5w6]`,
    `"12시 30분 취침, 7시30분 기상을 잘 지켰다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생) [9w8]`,
    `"상담 내용을 최대한 지키려고 노력하였으며 공부양을 늘렸음." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생) [1w9]`,
    `"꾸준한 고강도 운동을 하니 공부할 때엔 집중력 있게 공부할 수 있는 체력도 길러졌다. 그리고 가끔 잡생각이 날 때에도 생각 리프레시를 통해 더 집중해서 공부할 수 있던 일주일이었다." — 쿠리만쥰 (26학년도 5관왕 | 단국(약)·계명(제약)·삼육(약)·강원(약)·우석(약) 합격생) [5w6]`,
    `"오전을 제외한 모든 시간에 계획대로 행동하기 위해서 꾸준히 노력하였다. 운동 시간에 노래를 듣기보다는 공부했던 내용들을 떠올려봤다. 이두 운동을 하면서 근육의 수축 운동을 중심으로 근방추와 건반사에 대해서 생각해 봤는데, 실제 근육의 움직임을 보면서 공부하니 더 도움이 된 거 같기도..?(ㅋㅋㅋ) 하다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생) [8w7]`,
    `"학습시간 10시간 채우기 실천하고 있습니다. 또한, 선생님께서 조언해주신 대로 중간중간 쉴 때 조용히 눈 감고 명상을 조금씩 하고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생) [6w5]`,
    `"매일 아침 애니어그램 공부법을 읽고 공부를 시작하며 감정에 매몰되지 않고 관찰하려 노력함 강의 제외 공부 시간 6시간을 채우려고 노력함" — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생) [4w3]`,
    `"애니어그램 학습법을 매일 공부 전에 읽는다. 내가 해야 되는 생각/ 하지 말아야 되는 생각을 읽으면서 공부를 시작하니 공부할 때 마음가짐이 잘 흐트러지지 않아 좋았다.  주 4회 고강도 운동을 실천하였다. 운동을 1회 더 늘려도 피로하다기 보다는 공부로 쌓인 스트레스가 풀린 느낌이었다." — 이번엔내차례 (26학년도 삼육(약) 합격생) [9w8]`
    ]
  },
  "7-2":{
    생물:[
    `"ox퀴즈 범위를 따라가면서 틀린 개념의 부분을 켐벨 책으로 다시 한 번 확인하면서 내용을 복기하고 퀴즈 풀이 전 누적 복습을 했다. 맞은 문제들도 정확하게 알아서 푼 문제를 제외하고 감으로 풀었던 문제들 역시 다시 한 번 책을 찾아보며 정리했다. 헷갈리는 용어들이 많이 나와 그러한 용어들만 정리해 둔 요약본을 하나 만들었다." — Akdow (26학년도 단국(약) 합격생)`,
    `"지금까지 본 O/X 퀴즈에서 틀렸거나 약간이라도 헷갈렸던 개념이나 문제들을 ox나 빈칸 채우기 식으로 퀴즈 노트를 따로 제작하여 자주 복습함. 계획해둔 분량을 지키면서 복습함." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"통합이론 강의를 들으며 복습과 워크북을 꾸준히 풀어주었다. 틈틈이 생물 기본서를 읽어주면서 기본기를 잡으려고 노력했다" — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"OX 문제 진도 범위에 따라 기본서+강의 내용 복습에 집중했다. 매일 셀프 피드백과 OX 문제로 내가 약한 파트를 파악하고 이를 더 보완할 수 있었던 보람찬 한 주였다." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"OX 진도에 맞게 캠벨 책을 읽으면서 복습을 한 것이 좋았다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"이준 선생님 강의를 계획대로 들었고 복습도 하였음. 캠벨 책을 저번주보다 더 꼼꼼하게 읽었고 OX 문제를 풀 때 헷갈리는게 줄어듬." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"-저번 주와 마찬가지로 핵심 기본기 OX 진도에 맞춰서 기본서 및 박선우 이론서 복습을 뒤처지지 않고 해냈다.  -이전에 OX 테스트를 볼 때 문제에서 묻는 지식은 알고 있지만 선지를 자의적으로 깊게 or 왜곡해서 해석해 틀리는 경우가 종종 있었다. 그런 실수를 반복하지 않기 위해 최대한 합리적이고 상식적인 답안을 고르도록 연습했더니 조금씩 오답 수가 줄었다." — 쿠리만쥰 (26학년도 5관왕 | 단국(약)·계명(제약)·삼육(약)·강원(약)·우석(약) 합격생)`,
    `"기본서를 읽을 때 대단원 → 중단원 → 소단원 순서로 전체 흐름을 잡은 뒤 세부 내용을 익히니 머릿속에 체계가 잡히는 느낌이었다. 그런데 문제가 잘 안풀려서 원인을 분석해보니 생물학적 기작의 결과만 암기하고 과정은 이해만 하고 넘어가는게 문제였다. 이것을 깨달은 이후로 단순 이해에 그치지 않고 개념 꼼꼼히 보고 외울건 외우고 나서 문제를 푸니 더 잘 풀렸다. 그리고 시각화하여 기억하면 더 잘 남는 것 같아 스스로 메커니즘을 그리며 외웠다. 또한 기본서 → 써머리 OX → VF OX 순으로 공부하니 흩어져있던 개념들이 체계가 잡히고 개념이 훨씬 명료해지는 느낌이 들었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"이번 주 OX 문제에서 원하는 성적을 받지 못 하였지만, 해당 내용들에 대해서 해설지와 기본서를 참고하여 복습을 진행했고, 관련된 내용들도 추가적으로 학습하였다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
    `"기본서의 큰 틀과 핵심 키워드를 중심으로 차근차근 공부했다. 기본서를 읽을 때의 집중력이 점점 좋아지는 것 같기도 하다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"라이프 책을 다시 읽기 시작했습니다. 캠벨, ox퀴즈 리뷰도 하면서 라이프 책을 읽으니 좀 더 수월하게 읽히는 느낌을 받았습니다.  ." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"- 운동끝나고 자기 전까지 남는 시간에 써머리를 읽으면서 그날 배운 부분을 복습했다.  - 금요일 시험범위가 내가 이번 달에 목표한 범위의 마지막 부분이길래 단원을 좀 건너뛰어서 그 부분부터 공부했더니 좀 어렵던 단원임에도 ox문제에서 3개밖에 안 틀렸다. 뒷부분을 미리 들어서 느낌상으로 잔여강의 수가 얼마 안남은 기분이라 좋다." — 약대가쟝 (26학년도 단국(약) 합격생)`
    ],
    화학:[
    `"문제를 보면 바로 쓰기부터 시작하지 않고 문제를 어떻게 풀지 계획을 세우고 시작했다. 2000제 4단원까지 코드1,2,3을 다시 한 번 풀어보면서 틀린 부분에 대한 개념을 다시 한 번 복기하고 정리했으며 내 방식대로 풀어서 맞췄다해도 해당 범위의 모든 문제를 박인규 선생님의 풀이 방식을 보면서 풀이 과정과 사고를 그대로 가져가기 위한 노력을 했다." — Akdow (26학년도 단국(약) 합격생)`,
    `"저번 주에 배운 단원들의 예제들을 모두 다시 풀어보며 복습함. 이번 주에 상대적으로 쉬운 원자 구조 관련 단원을 공부했는데 역시 다 알고 있다고 생각했던 단원도 보충할 부분들이 보여서 다시 한번 기본기의 중요성을 잊지 않으려 노력함" — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"나름 화학에 자신있다고 생각했으나, 화요일 테스트를 보면서 너무 많이 절었던 것 같다. 문제를 처음 봤을 때 어떻게 문제를 접근해야 할지 바로 안떠오른 문제가 꽤나 있었다.  이번 test를 계기로 화학공부 방향성을 잡는 중요한 계기가 되었다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"목표한 진도에 따라 강의 수강 및 복습을 완료했다. 쉬운 문제도 APS 풀이법을 의식하면서 풀이해서 정해진 길을 따라가면서 문제를 푸는 것이라는 말의 의미를 이해하게 되었다." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"이것저것 다 하려는 고집을 버리고 한 주 동안1500제 복습에만 온전히 집중했다는 점이 좋았다. 헷갈리는 개념은 강의를 다시 보고, 문제들을 처음부터 다시 풀어보면서 박인규 선생님의 풀이 법을  체화하려고 노력했다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"기본 강의를 집중해서 들었고 생각보다 더 빠르게 진도를 나가고 있음. 계획한대로 잘 진행하고 있음." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"-7/15에 진행된 모의고사에서 30문항 모두 맞았다. 처음 보는 문항도 있었지만, 박인규선생님의 풀이법이 이제는 조금은 체화돼서 큰 어려움 없이 풀 수 있었다. -코드번호 4,5,6,7번 진도를 나가는 중이고, 해당 번호 문제들은 문제를 혼자 풀어보고 강의를 듣고 있는데, 풀이가 길고 오래 걸려도 어렵다고 느껴지지는 않는다. 박인규 선생님의 어려운 문제는 쉬운 문제의 내용의 조합이라는 말씀이 체감이 됐다." — 쿠리만쥰 (26학년도 5관왕 | 단국(약)·계명(제약)·삼육(약)·강원(약)·우석(약) 합격생)`,
    `"1500제 진도를 나가면서 한 단원의 문제를 강의 직후, 다음 단원 학습 전에 반복해서 풀어 보며 박인규 선생님의 사고 방식을 손으로 익히려고 연습했다. APS가 잘 떠오르지 않은 문제들은 그 방법을 체화할 때까지 몇 번이고 반복해서 풀었다. 확실히 이렇게 하니 문제를 풀 때마다 자신감이 붙어 가는 느낌이다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"실력점검 모의고사에서 목표한 것처럼 좋은 성적을 받을 수 있었다. 문제를 풀면서 헷갈렸던 개념들을 다시 한 번 정리해줬다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
    `"APS 순서대로 한번에 정확히 풀기 위해 노력했다. 반응속도와 각종 평형 등 계산이 필요한 파트로 넘어오니 그 필요성이 더욱 체감되었고, 초반에 습관을 잘 들여놓은 것 같이 느껴져 뿌듯했다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"1500제 복습에 많은 시간을 썼습니다. 시간을 많이 쓴 만큼 빠르게 1 회독을 할 수 있을 것 같습니다. 복습할 때 손으로 직접 다 풀었고 특히 평형 문제(산염기, 용해)를 풀 때 3단계 방법에서 1단계(우세한 반응 파악하기)의 중요성을 크게 느꼈고 생각의 흐름을 보완하였습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"7월 일반화학 모의고사를 치기 위해서 화학에 좀 많이 치중했다. 시험은 화요일에 끝났지만 얼마 남지도 않았고 빨리 끝내고 2000제로 들어가고 싶은 마음에 진도를 확 빼버렸다. 빠르게 뺐다고 대충하지도 않고 필기 하나 놓치지 않고 단원마다 APS 방법을 정리해놨다. 덕분에 7월안에 1500제 이론 끝내고 생물에 집중할 수 있을거 같다. 확실히 저번주는 쉬운단원이라 문제도 없고 너무 쉽게 느낀것과 다르게 평형, 에너지 단원으로 들어가니 일반화학 느낌이 났다." — 약대가쟝 (26학년도 단국(약) 합격생)`
    ],
    유기:[
    `"매일 1시간반씩 스미스 6판으로 독학을 시작했다." — Akdow (26학년도 단국(약) 합격생)`,
    `"매일매일 정해둔 분량을 지키며 공부함. 저번 주를 보완하고자 좀 더 기본서의 설명들을 꼼꼼하게 읽으면서 예제를 풀고 공부함." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"매일 꾸준히 유기화학 공부를 했다. 처음 유기화학 공부를 시작할 때 두려움과는 달리, 아직 초반이라 그런걸 수도 있지만 유기가 나름 재밌어 지기 시작한 듯 하다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"계획대로 이론 공부하고 문제를 풀었음. 진도를 맞추기 위해 노력하였음." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"일주일 간 컨디션이 안 좋은 날이 많다보니, 자연스럽게 유기화학을 가장 공부를 안 하게 되었다.  앞으로는 컨디션 관리를 잘 하여서 매일 기본서 예제 위주로 유기화학을 제대로 공부해야 한다.  유기화학을 틀리는 순간 합격이 멀어진다는 것을 잊지 말자." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
    `"기본서를 중심으로 매일매일 차근차근 공부했다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"권민 교재와 병행하여 스미스 기본서 공부를 시작했습니다. 스미스는 예제 문제만 풀면서 공부하고 있고 권민 교재로 빠르게 기억을 되살리고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`
    ],
    생활관리:[
    `"저번 주에는 약한 강도의 운동만 했지만 이번에 처음으로 런닝을 했다. 30분이 최대였지만 런닝은 난생 처음 해보기 때문에 엄청난 일이다. 너무 힘들지만 개운하기도 해서 시간을 점차 늘려야겠다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생) [9w8]`,
    `"애니어그램을 읽고 공부를 시작했다. 칭찬 일기를 적을때도 성과위주가 아닌 잘했다고 생각되는 것에 쓰기 시작했다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생) [5w6]`,
    `"수면시간, 운동 횟수와 강도 모두 잘 지켜내면서 공부했다. 피곤해서였는지 아니면 공부로 지쳐서인지 매일 눕자마자 잠 들었다. 운동을 하면 할수록 스트레스 해소에 효과적인 것을 느낀다. 스트레스가 풀리니 공부에 더욱 집중이 잘 되어서 좋았다." — 이번엔내차례 (26학년도 삼육(약) 합격생) [9w8]`,
    `"월요일에 계절학기가 끝나 본가로 내려와서 화요일부터 본격적인 생활 관리를 할 수 있었는데, 생각보다 일찍 생활 패턴이 잡혔다. 그리고 밥 먹거나 이동하는 시간에 퀴즐렛을 푸는 게 점점 습관으로 잡혀가고 있다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생) [9w8]`,
    `"이번주에도 진도를 밀리지 않았고 명상을 하면서 생각을 정리하는 시간을 가졌음.  공부 내용과 할 일에 익숙해지는 느낌을 받아서 꾸준히 노력하고자 함." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생) [1w9]`,
    `"공부 시작 전 애니어그램 공부법을 읽은 것이 매우 도움이 되었다. 지난 주말 친구들을 만나고 나도 모르게 다른 사람들과 나를 비교하며 묘한 불안함에 휩싸였었다. 과거의 나였다면 이런 상황에서 공부를 회피하고 포기했겠지만 ‘원하는 것을 갖지 못한 사람’이라는 이미지를 강화하려는 4번의 특성이 나온 것을 인식하고 그 감정에 휘둘리지 않으려고 했다. 덕분에 마음을 다 잡고 완벽하게 계획을 수행하진 못했더라도 할 수 있는 만큼 최선을 다해 공부할 수 있었다. 이렇게 감정에 휘둘리지 않고 해야 할 것을 해낸 자신이 너무 뿌듯했다. 그리고 이번주는 고강도 운동 주 3회 채웠다! 운동도 감정을 다스리는데 큰 도움이 되었다. 힘들게 몸을 몰아붙이니 잡생각이 사라지면서 현재에 집중할 수 있었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생) [4w3]`,
    `"화~목요일에 몸이 많이 안 좋았지만, 최소한의 공부는 진행하였다. 작성해주신 애니어그램 8번 분석 자료를 매일 기상 직후 읽었다. 이를 통해 의식적으로 더 계획적으로 공부를 하려고 노력하였다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생) [8w7]`,
    `"비가 많이 와서 정말 힘들었지만 그래도 운동을 가기 위해 노력했다. 비록 2번 뿐이어서 목표치에는 못미쳤지만, 평소보다 훨씬 한적하고 빈 헬스장에서 운동하니 괜한  뿌듯함이 느껴졌다." — 초록콩 (26학년도 순천(약) 합격생) [9w1]`,
    `"화학 때문에 불안했는데 차라리 확 공부해서 불안감을 낮추는 것도 나쁘지 않다는 생각을 하였습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생) [6w5]`
    ]
  },
  "7-3":{
    생물:[
    `"ox퀴즈 범위를 따라가면서 인체 전 범위를 노용관 선생님 강의 base로 정리했던 요약본으로 복기를 한 번 하고 ox퀴즈에서 틀린 개념의 부분을 켐벨 책으로 추가했다. ox 퀴즈를 마무리하고 박선우 선생님의 퀴즐렛으로 그 부분에 해당하는 문제들을 다시 한 번 풀어보며 누적으로 계속 개념을 채우는 방식으로 공부를 진행했다." — Akdow (26학년도 단국(약) 합격생)`,
    `"항상 어렵고 매일 봐도 모르겠는 면역학을 처음으로 기본서를 읽었는데 기본서 기준 심화된 내용이 빠져있는것같지만 흐름을 이해하게 됨. 그동안 알고 있던 단순암기지식을 그 흐름에 끼워넣으면서 면역학 내용이 엄청 방대하지는 않구나. 할만하다. 발생학도 빨리 학습해서 생물에서 버리는 단원은 없도록 만들자" — 푸파 (26학년도 순천(약) 합격생)`,
    `"저번 피드백에 따라 다른 공부법들을 참고했다. 지금까지 단원을 제대로 본 적이 없다는 걸 깨닫고 기본서의 대단원, 중단원, 소단원을 읽으며 이 단원의 흐름과 각 단원에서 어떤 내용이 있었는지 대강 기억나도록 공부하고 그림이 나오는 내용은 좀 더 자세하게 공부했다. 기본서 두 권을 중심으로 공부하고 인강 교재는 약간 참고만 하는 식으로 공부했다. 이랬더니 O/X 퀴즈를 정말로 내 약점을 확인하는 용도로 사용할 수 있었고, 실제로 성적도 올라서 뿌듯했다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"박선우 통합이론 1권을 끝내서 뿌듯하다. 2권은 내용이 어려울 것 같지만 열심히 해서 극복해보자." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"강의 진도 나가는 것을 좀 미루고 기본서 읽기 + 퀴즐렛 OX로 기본적인 내용을 먼저 쌓는 것에 집중한 것. VF 문제 리뷰 꼼꼼하게 한 것." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"순환계와 호흡계 파트를 캠벨 책으로 먼저 읽다가 잘 안 읽혀서 노용관 선생님 강의를 발췌해서 들었다. 이로인해 진도는 살짝 밀렸지만, 헷갈리고 자신 없던 단원의 개념을 다시 한번 다질 수 있었다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"-이번 주에 OX퀴즈를 응시했던 생리학 단원들은 분자생물학 단원에 비해서는 조금 자신있는 편이라 공부할 때도 재미있었고, 재미가 있으니 공부도 더 잘 된 것 같다. 다른 단원들의 실력도 키워서 재미있게 공부할 수준이 되어야겠다." — 쿠리만쥰 (26학년도 5관왕 | 단국(약)·계명(제약)·삼육(약)·강원(약)·우석(약) 합격생)`,
    `"OX 진도에 맞춰 계획대로 학습을 진행했다. 특히 생리학 파트는 처음에는 단순 암기 위주라고 생각해 부담감이 컸다. 그러나 캠벨을 읽으며 공부하니 몸에서 일어나는 과정들이 흥미로운 이야기처럼 이해되었고, 내용이 자연스럽게 머릿속에 들어왔다. 그리고 써머리 OX를  같이 풀어보니 기본서 읽을 때 잘 이해되지 않던 내용도 이해할 수 있었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"진도는 진도대로 기본서 복습은 복습대로 나누어서 잘 해낸 것 같다. 특히 이번 주 OX 범위부터는 아직 인강 진도를 나가지 않은 단원들이 있어서 걱정했는데, 그만큼 기본서를 열심히 읽었더니 (물론 OX는 많이 틀렸지만) 개념 전반이 크게 어렵게 느껴지지는 않았던 것 같다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"우선 계획한 만큼은 아니지만 최선을 다해 읽고 있습니다. 그리고 박선우 교재와 함께 읽어보니 어떤 내용이 심화 내용이고 어떤 부분이 핵심 내용인지 구분이 가는 것 같습니다. 핵심 내용 위주로 확실하게 학습할 수 있을 것 같습니다. ." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"- 늦은 줄 알았지만 이번 주까지가 7월이라 생리학 전까지인 2권까지 목표에 맞게 끝낼 것 같다. 강의+복습까지 하면서 목표치를 따라가려니 지루하고 힘들었지만 이 악물고 참아가며 공부했다.  - 지난 피드백을 보고 늦은 진도에 연연하지 않으려고 노력하면서 생물을 좀더 가볍게 공부했다. 다행히 익숙한 내용이라 스무스하게 넘어간 덕이 크다." — 약대가쟝 (26학년도 단국(약) 합격생)`,
    `"MD 인체생리학 파트 풀기를 잘했다. 유전학 부분처럼 아예 복잡한 퍼즐이나 실험은 별로 없었고 과한 그래프 추론 문제는 걸러서 빠르게 풀었음. 모르는 건 바로바로 인강을 들어 박선우가 어떻게 해석하는지 찾아보았다. 진도도 빨라 예상보다 많이 나갔다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`
    ],
    화학:[
    `"원래 2000제 8단원까지의 문제 풀이를 목표로 했는데 1단원 더 진행해 9단원까지 마쳤다. 먼저 1,2,3코드에 해당하는 문제를 싹 풀고 맞춘 문제는 박인규 선생님이 추가해 주시는 개념과 풀이 방법을 습득하려고 노력했고 틀린 문제에서는 중요도가 낮다고 하신 개념과 문제는 나중에 다시 보기 위해 따로 빼서 정리해두고 중요도가 높았는데 틀린 문제는 1500제로 돌아가 다시 한 번 개념을 읽고 문제를 여러 번 풀어보며 체화하는데 집중했다." — Akdow (26학년도 단국(약) 합격생)`,
    `"저번주에도 느낀 부분이지만 정말 내가 상식이 부족한 상황에서 시험장을 들어갔구나를 더 크게 느낌. 시험장에서 이런걸 어디서 배워 라고 생각했던 문제들이 1500제 예제에 유사한 느낌의 문제가 많았음. 편입 시험을 어떻게 대비해야할지 스스로 알아가고 있는 것 같다." — 푸파 (26학년도 순천(약) 합격생)`,
    `"계획해둔 일정을 지키며 공부를 했다. 인강을 들으면서 이 단원의 흐름과 소단원을 의식적으로 기억하려 했고, 문제를 풀 때는 잠깐 멈추고 먼저 푼 뒤에 선생님과 똑같은 식으로 풀었는지 확인하며 들었다. 인강을 듣고 난 후 바로 배운 내용과 흐름을 다시 읽고 복습함." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"문제를 꾸준히 풀었고, 모든 문제 강의를 듣기보단 조금이라도 애매하다고 느꼈거나, 해설을 들을 필요가 있다고 느낀 문제는 해설을 들어 주려 했다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"- 오후 시간에 화학공부를 할 때 저번주에 쳐진다고 생각해서 이번주에는 복습 문제풀이 후 자리에서 일어나 10~20분 휴식 후 새로운 진도를 나갔더니, 집중이 훨씬 잘 되었다.  - 복습 문제풀이 전 후 체크리스트를 의식적으로 다시 하나하나 확인하며 좀 더 신경써야 할 체크리스트를 다이어리에 한줄 쓰며 의식적으로 화학공부에 반영하려고 노력하였다. 그리고 일반화학 단원별 엑셀을 만들어서 진도+ 복습 후 내가 지금 어려워하는 지점을 명확히 글로 적어보았더니 문제의 원인이 명확해져서 그 부분을 더 공부하면 되겠다 싶은 생각이 들었다! - 이번주는 진도에 급급해 누적복습을 원하는 만큼은 못했지만, 누적복습을 통해 전반적으로 일반화학에 대한 자신감이 붙고 있다. 효율적인 누적복습 방법을 찾으니 공부할 때 불안하지 않았다." — 시계탑기린친구 (26학년도 강원(수) 합격생)`,
    `"진도 나가는 것보다 복습에 더 집중했다. 진도가 계획했던 것보다 느리게 나가도 복습도 없이 넘어가는 것이 더 비효율적이라고 판단했다. 그리고 화학 체크리스트로 공부 방향을 재점검하는 시간을 가졌다. 내가 하는 공부에 확신을 가지니 공부할 때 정신적으로 흔들리지 않았다." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"이번주 역시 1500제에만 몰입하며 복습에 힘을 썼고, 1회독 때는 얻지 못했던 것들을 한 주 동안 많이 얻어갈 수 있었던 것 같다. 1500제에서 주요 내용과 AP를 정리한 노트를 따로 만들어서 누적 복습하는 중이며, 문제를 무작정 풀기 전에 어떠한 경로를 거쳐 풀 것인지 생각하는 연습을 하며 공부를 했다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"-오랜만에 푸는 단원도 문제의 단서를 파악하고 조합해 어렵지 않게 해결할 수 있었다. 기본적인 문제들을 반복해서 풀다보니 기본기가 쌓인 느낌이 들었다." — 쿠리만쥰 (26학년도 5관왕 | 단국(약)·계명(제약)·삼육(약)·강원(약)·우석(약) 합격생)`,
    `"이번주부터 물질 변화 파트에 들어갔다. 특히 어려워하는 부분이라 역시 부담이 컸다. 그래도 박인규 선생님의 강의를 들으며 생각보다 어려운 단원이 아니였음을 느껴 재미있었다. 문제를 함께 풀어주니 어려웠던 개념도 쉽게 이해가 되어 앞으로 남은 파트도 이렇게 공부하면 수월하게 해낼 수 있을 것이라는 자신감이 생겼다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"평형 단원에서 올바른 방법으로 한 번에 풀기위해 노력했다. 열역학 단원이 항상 어려운데.. 박인규 선생님 조언대로 이론에 치중하지 않고 문제를 풀며 이해하려고 노력했더니 처음 볼 때보다는 확실히 이해도가 높아진 것 같다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"1500제 회독을 끝냈습니다. 앞으로는 2000제에 집중하면서 계획처럼 필요할 때마다 찾아볼 생각입니다. 2000제 공부가 익숙해진 것 같습니다. 좀 더 속도를 내서 코드번호 1,2를 완강할 계획입니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"잊을 뻔 했던 산염기, 용해도 부분을 복습했다. 이번 주에 토익이 있어서 금요일 저녁 + 토요일 전체를 빼앗겨 생물에 더 치중했지만 화학도 잊지 않고 어느 정도는 챙겼다. 돌아오는 주에는 수월하게 화학 1500제를 끝낼거 같아 복습 좀 한 뒤 2000제로 넘어갈 테스트를 봐야겠다. 7월 동안 해야할 만큼을 늦지않고 다 끝낼거 같아 마음이 놓인다." — 약대가쟝 (26학년도 단국(약) 합격생)`,
    `"1) 이번주 진도 한번도 밀리지 않고 계획 한대로 잘 이행했음. 2) 편안한 단원들로 들어오니 한결 편안하게 인강을 듣게 되었고, 남은 시간을 생물 공부에 더 보완할 수 있어 좋았다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`
    ],
    유기:[
    `"매일 1시간반씩 빠짐없이 스미스 6판으로 독학을 했으며 예제 문제에 이어 뒤에 단원 마무리 문제까지 추가로 풀었다." — Akdow (26학년도 단국(약) 합격생)`,
    `"VF 제공 문제를 풀면서 실수 할 수 있는 포인트들을 잘 생각하면서 차분하게 문제풀이를 진행함. 2회차 제공문제 해설을 함께 공부하면서 까먹었던 내용, 풀이하면서 기억이 왜곡된 이상한 풀이법을 정확한 개념으로 바로잡음" — 푸파 (26학년도 순천(약) 합격생)`,
    `"이번 주 유기화학 범위가 좀 많다는 것을 확인하고 유기화학에 저번 주보다 많은 시간을 투자했다. 매일 정해둔 분량의 문제를 풀고 인강 계획도 지켰으며, 전날 배운 내용을 매일 복습하면서 공부 계획을 잘 지켰다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"매일 꾸준히 유기공부를 할려고 노력했고, 실제로 그렇게 했다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"매일 1시간 유기화학 공부를 그대로 실천하였고, VF 제공 문제 리뷰 마무리까지 완료했다." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"-기본서와 약사랑 유기화학 슬라이드와 강의를 복습하다 보니 잊었던 내용들을 다시 알 수 있었다. 이렇게 꾸준히 복습하면서 빈틈을 메꿔가야겠다." — 쿠리만쥰 (26학년도 5관왕 | 단국(약)·계명(제약)·삼육(약)·강원(약)·우석(약) 합격생)`,
    `"기본서와 예제를 중심으로 매일매일 차근차근 공부했다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"스미스 책 학습을 하면서 선생님께서 말씀해주신 유튜브를 참고하였습니다. 확실히 설명을 들으니 좀 더 효율적으로 공부할 수 있었습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"1) VF 문제를 풀며 몰라던 지점, 미흡했던 지점 보완하는 시간을 가졌다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`
    ],
    생활관리:[
    `"월-일 한번도 뺴놓지 않고 9시 30분 이전에 독서실에 착석함. 공부시간이 늘어났고 목표치를 모두 수행함. 화학 공부를 더 할 수 있지 않았을까라는 아쉬움은 남지만 목표설정을 어느정도해야 내가 성취" — 푸파 (26학년도 순천(약) 합격생) [7w8]`,
    `"잠을 일찍 잤다. 매일 아침 일찍 일어났고, 학원에 매일 늦지 않게 도착했다. 칭찬일기를 매일 적었다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생) [5w6]`,
    `"- 저번주 목표대로 점심시간에 유튜브를 보지 않고 멍때리거나, 암기할 것을 봐주었다.  - 이번주는 거의 항상 월-토 기상시간이 7:45로 늦게 일어나는 날 없이 거의 제때 집에서 나갔다.  - 애니어그램 학습법을1주차부터 계속 읽으며 공부하고 있고, 취침 전 명상과 아침 공부 전 감사일기, 적절한 운동과 산책을 통해 멘탈이 전보다 많이 좋아진 것이 느껴진다." — 시계탑기린친구 (26학년도 강원(수) 합격생) [4w3]`,
    `"수면 시간을 잘 지킨 것.  매일 애니어그램 유형 글 읽으면서 공부할 때 마음을 다 잡은 것.  매일 과목별 셀프 피드백과 생활 피드백을 한 것. 루틴대로 살다보니 습관처럼 공부하는 것이 익숙해졌다." — 이번엔내차례 (26학년도 삼육(약) 합격생) [9w8]`,
    `"주 4회 운동을 빠지지 않고 했으며, 체력이 좋아진 게 느껴진다. 또한, 공부 시작 전에 애니어그램 공부법을 읽어주었고, 핸드폰을 켜면 퀴즐렛부터 들어가는 것이 습관이 되었다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생) [9w8]`,
    `"더위를 정말 많이 타는 체질이라 이번 주의 무더위가 무서웠지만, 더위를 안 먹게끔 잘 관리를 해서 큰 문제 없이 한 주를 보낼 수 있었다." — 쿠리만쥰 (26학년도 5관왕 | 단국(약)·계명(제약)·삼육(약)·강원(약)·우석(약) 합격생) [5w6]`,
    `"3주차에 접어들며 각 과목에 대한 학습법과 루틴이 점차 자리를 잡아가고 있다. 하지만 머릿속으로는 잘 알면서도 행동으로 옮기지 못한 한 주였다. 지난주에 세웠던 ‘감정을 조절하며 규칙적으로 생활하자’는 결심이 뜻대로 지켜지지 않았다. 그러면서 하루는 스스로를 자책하며 안개 속에서 길을 잃은 듯 무기력함에 빠지기도 했다. 그래서 이날은 저녁에 공부를 일찍 마치고 자버렸다. 그런데 확실히 잠을 푹 자니까 다음날 다시 의욕이 생기고 공부에 집중 할 수 있었다. 날이 많이 더워지고 반복되는 일상에 지쳐 있었던 것 같다. 점점 페이스를 되찾고 있는 중이다. 다음주에는 체력 안배와 질 좋은 수면에 중점을 두고 계획을 세워야겠다. 무리 없이 지속할 수 있는 루틴을 찾아보자." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생) [4w3]`,
    `"풀케어를 시작한 이후로 생활 습관이 어느 정도 안정을 찾은 것 같습니다. 이 상태에서 조금씩 학습량을 늘릴 수 있도록 하겠습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생) [6w5]`,
    `"이번 주에는 컨디션이 좋지 않았고 일요일 토익도 있어서 공부에 집중하기 어려운 환경이었지만 매일매일 공부하였고 공부 시간도 어느정도 유지했음. 최선을 다했다는 점이 뿌듯함. 또한, 생활루틴을 지키면서 일주일을 보냈음." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생) [1w9]`
    ]
  },
  "7-4":{
    생물:[
    `"식생분진은 기본서 내용이 매우 방대해서 오히려 중요한 내용을 더 확실하게 파악하려 노력할 수 있었다. 생물에 시간을 너무 치중하지 않도록 시간을 정해서 공부하거나 중간에 유기화학을 풀면서 환기시키니까 집중도가 나아졌다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"1회독을 마친만큼 박선우 선생님의 퀴즐렛을 풀면서 누적 복습을 진행하고 있고 특히 퀴즐렛에서 사고를 요하는 문제들이 많았는데 스스로의 사고과정을 복기하면서 그림과 알고 있던 개념을 매칭시키는 작업을 했다." — Akdow (26학년도 단국(약) 합격생)`,
    `"진도가 남들에 비해 밀린다는 느낌이 들긴 하지만 묵묵히 내 할일을 하였다. 박선우 통합이론 세포분열, 유전학(~ing)을 듣고, 그 파트에 맞춰 캠벨 책을 읽어 주었다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"인체생리학 파트 MD 문제가 대체로 무난했어서 식물학까지 더 나갈 수 있었음. 8월내 남은 MD 파트와 PEET 문제들도 충분히 볼 수 있겠다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"기본서를 읽는 것을 우선시하면서도 계획한 진도만큼 강의를 수강했다. 선기본서 읽기후강의 듣기로 공부가 이루어지니 강의를 이해하는 데에도 도움이 되었다. 지금은 기본을 쌓는 시기인 것을 명확하게 생각하면서 공부하고 있는 것 같다." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"강의를 듣고 필기 잘 정리해뒀음. 계획한대로 워크북을 풀고 기본기ox시험을 쳤고 복습이 잘 된것 같다고 느낌. 작년에 소홀히했던 식생분진 파트를 강의+기본서로 이해하는 공부를 통해 정리되는 느낌을 받음" — 레고링 (26학년도 계명(제약) 합격생)`,
    `"식생분진 파트가 약해서 캠벨을 위주로 학습을 진행하였다. 생화학 파트가 약하다고 생각을 하여 기본서를 먼저 읽었고, 추가 내용 학습을 위해 노용관3.0 강의를 통해 보충하였다. 분자생물학 파트도 다음주 OX문제 범위여서 써머리 문제로 복습을 하고, 기본서를 통해 개념을 다시 확인하였다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
    `"아쉽게도 마지막 식생분진에서는 생물의 과학을 읽지 못했지만.. 그래도 7월 한 달 동안 두 권의 기본서를 거의 다 읽어냈다는 사실이 아주 뿌듯하다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"캠벨 1회독을 마쳤고 계획한 학습 목표를 지켰습니다. 다음주부터는 라이프 교재를 더 많이 학습할 수 있도록 하겠습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"7월 한달간 캠벨 1회독을 완료했다. 완벽히 숙지했다고 보기는 어렵지만, 8월 부터는 라이프도 함께 읽으며 이번 회독을 기반으로 심화 학습을 진행할 계획이다. 특히 이번 주에 공부한 것은 작년에 하지 않았던 식생분진 파트라 다 할 수 있을지 걱정이었는데 확실히 캠벨에 잘 설명 되어 있어서 비교적 수월하게 학습했다. 이에 더해 써머리 OX 풀고, VF OX까지 풀면서 복습을 하니 개념을 이해했는지 점검할 수 있었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"7월안에 목표한 생리학 전 파트까지 다 완강하고 뒷부분 복습만 남아있다. 가장 중요하고 출제도 많이되는 파트라 강의 수 기준 생리학+식생분진 보다 양도 많았는데 다 끝냈다는게 정말 홀가분하고 큰 산을 넘은거 같다. 아직 자세한 부분까지 암기가 안되고 휘발되는데 생리학 공부하면서도 꾸준히 복습 해야겠다." — 약대가쟝 (26학년도 단국(약) 합격생)`,
    `"ox 1회독이 끝난 이후에 자가 점검 테스트 50제를 다시 풀어봤다. 처음 풀 때와는 다르게 각 선지에 대한 근거를 생각할 수 있게 되었고, 기억이 안 나는 부분은 교재 어느 단원을 봐야할지 바로바로 떠오르는 것이 느껴졌다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"너무 깊이 보려고 하지 않았다. 특히 식생분진은 스스로 잘 안돼있는 부분임을 알고 있어서 모르는거 다 파려고 하면 시간이 너무 오래 걸릴게 분명했기 때문에 최대한 훑어보고, 목차를 통해서 무슨 내용이 있는지만 확인했다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`
    ],
    화학:[
    `"고난이도 문제가 출제되는 단원을 공부하게 되어서 긴장했지만 인강으로 들은 내용을 침착하게 적용하다 보니 생각보다 순조롭게 배울 수 있었다. 이 과정에서 즐거움을 느꼈다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"맞는 보기여도 그냥 넘어가지 않고 계속 반복해서 개념에 대한 멘트를 쓰면서 체화시켰고 내가 푼 방법과 박인규 선생님이 푼 방법 2가지를 비교하면서 시야를 넓힐 수 있었다. 매일 꾸준히 4시간에서 4시간 반 씩 투자한 결과 목표보다 더 많은 범위를 나갈 수 있었다." — Akdow (26학년도 단국(약) 합격생)`,
    `"몇몇 문제를 강의를 들어주면서 느낀점은 "맞은 문제더라도 강의를 들으라고 하는 이유가 있었구나"였다. 이번에 강의를 들으면서 평형이나 용액관련 문제풀이 아이디어 얻어가는게 많았다. 그것 외에는 강의를 들으면서 인규쌤과 내 풀이가 양론, 평형관련 문제에 있어 많이 비슷하다는 느낌이 들었다. 이런 점에 있어서 다행인것같기도 하다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"1) 4주동안 한번도 밀리지 않고 1500제를 끝냈다. 잘했음 2) 전기화학 파트가 어려웠던건 산화제, 산화력, 환원 정도 등 단어표현들이 낯설어 개념들간의 상호전환이 빠르게 안됐던 것임을 깨달았다. 한번에 잘 안 와닿으니 개념들끼리 전환하는데에 오래걸리고 비교도 오래 걸렸던 것이었다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"화학 체크리스트로 공부 방향을 점검하였다. 그리고 평형 단원 진도를 나가면서 APS가 더 중요해졌는데 박인규 선생님의 사고 과정을 따라가기 위해 문제의 단서와 구조를 의식적으로 파악하면서 문제를 풀었다." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"산염기 파트 공부하며 전략단원으로 만듦. 앞부분 복습도 꾸준히 해줌. 저번주에 계획한 양이 많아 버거움을 느껴 양을 줄였더니 적당한 것 같음." — 레고링 (26학년도 계명(제약) 합격생)`,
    `"문제를 풀며 개념을 확인할 때 풀이 과정에 논리적 비약이 있으면 체크를 해두고 강의를 통해 문제 풀이 순서를 점검하였다. 이 과정에서 자유에너지에 대한 개념을 확실하게 정립할 수 있었다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
    `"전기화학 단원이 어렵게 느껴져서 1500제강의를 다시 들었는데, 헷갈렸던 내용 뿐 아니라 이미 알고 있었던 내용도 더 잘 이해할 수 있게 된 것 같아 좋았다. 다른 단원들에서 2000제(1,2번)를 소화하기 어렵지는 않았는데.. 그래도 1500제를 한 번 더 듣고 넘어오는게 좋았으려나 싶기도 하다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"2000제 강의를 계획한 것 보다 빠르게 듣고 있습니다. 반응 속도, 평형 문제들을 푸는 속도가어느 정도 붙는 것 같습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"점점 뒷부분으로 갈수록 어려운 파트가 나왔지만 강의를 들을 때마다 ‘역시 박인규 선생님이다!!’ 하며 감탄을 한다. 덕분에 복잡한 내용도 훨씬 쉽게 이해할 수 있었다. 항상 문제 풀때마다 APS를 떠올리며 문제에 답을 맞추는 것이 아닌 문제 풀이 과정에 초점을 맞춰서 공부하니 개념이 체계적으로 연결되는 것을 느꼈다. 선생님의 사고 방식에 따라서 스스로 사고하고 풀이하는 연습을 통해 자신감이 더 생긴다. 아직 기본 개념을 공부하고 있지만 2000제로 넘어가서 더 어려운 문제를 접했을 때 APS로 풀릴 것을 생각하니 벌써 기대가 된다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"마찬가지로 7월안에 1500제를 모두 완강했다. 배위화합물 할때쯤엔 반응속도식, 용해도 부분이 조금씩 섞이거나 헷갈렸는데 계속 다시 봐야겠다. 8월 중순까지로 넉넉하게 목표를 잡고 있었는데 속도가 나서 정말 다행이다. 듣기 싫은 날에도 꾹 참고 시청했더니 어느덧 끝난거 같다. 내용 자체는 다 아는 내용이라 인규T 풀이방식대로 교정하는데만 노력을해서 빨라졌나 싶다." — 약대가쟝 (26학년도 단국(약) 합격생)`,
    `"계획했던대로 1500제 복습을 끝냈고, 7월 타임어택 모의고사를 다시 풀어봤다. 7월에 잘 안 풀렸던 문제들이 APS대로 잘 풀리는 것이 느껴졌고, 아직 시간은 걸리지만 내 풀이에 대한 확신이 생겨 문제풀이에 자신감이 붙었다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"박인규T 예제를 다시 풀다보니 스스로 얼마나 뒷부분을 날림으로 했는지 깨달아서 잘 모르는 부분은 다시 강의를 듣고있다. 한번 잘 못 하면 그 뒤로 얼마나 시간이 낭비되는지 깨달아서 최대한 많은 것을 흡수하려고 노력하고 있다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`
    ],
    유기:[
    `"이번 단원을 공부할 때는 예제를 골라서 풀지 않고 정말 하나도 빠짐없이 다 풀었다. 기본서에 있는 내용들도 예제 푸는대만 집중하지 않고 의식적으로 보려 노력했다. 이번에도 매일 정해진 양을 인강을 들으며 공부했다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"매일 꾸준히 1시간 씩 공부했고 구조에 대한 단원을 공부한만큼 여러 번 직접 그려보면서 공부했다." — Akdow (26학년도 단국(약) 합격생)`,
    `"매일 적어도 하루 한시간 유기 공부를 하였다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"기본서와 VF 등 여러 문제들을 접하고 나니, 오답을 하며 기존에 헤맸던 지점들도 앞으로 어떻게 풀어야 하는지 체계가 잡혔다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"매일 1시간씩 아침 공부로 유기화학을 시작하니 매일 유기화학 공부를 할 수 있었다." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"원래 실천하지 못했던 '매일 유기 공부하기'를 해냄. Ppt 공부와 기본서 복습을 꼼꼼히 하고 기본서 연습문제와 금요일 테스트를 통해 확인하는 과정을 거쳤음. 아는 내용이라고 대충하지 않고 중요개념을 체크하며 했음." — 레고링 (26학년도 계명(제약) 합격생)`,
    `"매일 꾸준히 90분 내외로 공부하기 위해 노력하였고, 기본서를 최대한 이해하려고 노력하였다. 기본서가 설명이 잘 되어 있어서 학습하기에 좋았고, 반응 파트를 들어갔으니 반응 노트를 정리했다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
    `"기본서와 예제를 중심으로 매일매일 차근차근 공부했다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"저번주와 마찬가지로 유튜브를 참고하며 계획한만큼 학습을 하였고, 말씀해주신대로 예제와 쉬운 문제들 위주로 공부하였습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"스미스 읽고 예제 풀기 -> VF 전범위 테스트 -> 놓쳤던 부분 스미스로 돌아가서 다시 보기 순으로 학습했다. 확실히 개념을 잘 정리할 수 있었다. 이번 문제에서 쐐기 구조식, 뉴먼 투영식, 피셔 투영식 간 변환이 빠르게 안되어 관련 내용을 추가로 찾아보고 정리했다. 또한 다음에 이런 문제가 나왔을 때 당황하지 않도록 전범위 문제에서 관련 문제를 선별해 반복해서 다시 그려보는 연습을 하였다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"저녁시간마다 꾸준히 기본서 회독을 했다. 그래도 잘 안외워지는 부분은 있었지만 원서를 읽으니 개념 정립이 더 잘된다." — 약대가쟝 (26학년도 단국(약) 합격생)`,
    `"혼자 급하게 진도를 나가다 보니, 풀케어 테스트도, 진도도 제대로 소화하지 못하고 있다는 생각이 들어, 입체화학부터 강의와 교재를 바탕으로 다시 공부했다. 또한, 이전까지 풀었던 문제들을 다시 풀어보면서 앞에 빠르게 들었던 부분들을 다시 복습했고, 테스트에서 오랜만에 괜찮은 점수를 받았다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"입체화학부분을 잘 알고 있다고 생각했는데, 거울상 이성질체랑 좌우반전된 분자의 차이를 구분하지 못하고 있었던 것을 알았다. 모르는걸 채워넣게 되었다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`
    ],
    생활관리:[
    `"처음으로 월~토요일 모두 같은 시간에 독서실에 출석했다. 영양제도 매일 먹고 저번주처럼 체크리스트를 기록하다 보니 루틴에 확실히 익숙해진 것 같다. 독서실 공부 자리를 바꿔보면서 집중도를 높이기 위해 노력했다. 평일 중 한번 기분이 너무 안 좋았는데 그냥 저녁 공부를 1시간 덜하고 땀 흘리면서 운동을 했더니 훨씬 나아져서 좋았다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생) [9w8]`,
    `"3일은 고강도 무산소 운동을 하고 하루는 유산소 운동을 해서 체력 관리 및 멘탈 관리에 집중을 했고 취침 시간은 조금씩 달라지더라도 기상시간은 일정하게 유지하면서 공부 시작 시간은 계속 유지하려고 노력했다." — Akdow (26학년도 단국(약) 합격생) [5w6]`,
    `"한달 내내 12시에 자고 6시 반~7시 사이에 일어나는 규칙적인 생활습관을 유지하였다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생) [1w9]`,
    `"이번 주에는 운동을 소홀히 하지 않았다. 잠도 규칙적으로 매우 잘 잤다. 공부 습관이 생기니 컨디션이 안 좋은 날이 있어도 공부를 계속 이어 나갈 수 있었다." — 이번엔내차례 (26학년도 삼육(약) 합격생) [9w8]`,
    `"진도에 집착하지 않기로 하니 조급함이 사라지고 해야할 일을 차근차근 해냈다. 이번주는 전보다 긍정적인 마인드로 공부에 임했고 그래서 그런지 더 잘되는 것 같았음. 공부시간도 저번보다 더 확보할 수 있었다." — 레고링 (26학년도 계명(제약) 합격생) [9w1]`,
    `"정해진 루틴을 제대로 지켰다. (12시 취침 7시 기상) 공부를 시작하고 오전 시간에는 전 날 학습한 내용을 복습하는 시간으로 마련했는데, 이 과정에서 목차들을 떠올려보며 연습을 하니 더 도움이 된 것 같다. 이에 앞으로 오전 시간에는 최대한 복습하는 시간으로 루틴화시키면 좋을 것 같다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생) [8w7]`,
    `"주말부터 몸이 안좋다가 화요일에 크게 앓아 눕는 바람에 하루를 날려버렸지만, 컨디션이 좋지 않은 와중에도 월수목금 매일 아침 헬스장에 가고 밥도 잘 챙겨먹는 등 체력을 끌어올리고자 노력했더니 몸도 곧바로 회복하고 시간도 많이 허비하지 않을 수 있었다. 이번 주부터 쇼츠를 끊기로 결심했는데 100% 단절한 것 까지는 아니지만 거의 안봤다." — 초록콩 (26학년도 순천(약) 합격생) [9w1]`,
    `"날이 더워서 그런지 조금씩 더 일찍 일어나고 있고 그에 따라 학습 시간도 늘어나고 있습니다. 앞으로도 유지하도록 하겠습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생) [6w5]`,
    `"저번주보다 한 가지라도 더 잘해보자는 마음으로 ‘자기 전 핸드폰 보지 않기’를 실천했다. 7일 중 4일을 성공해 나름 의미 있는 변화를 만들었다고 생각한다. 다음 주에는 7일 모두 실천하는 것을 목표로 삼을 예정이다. 자기 전에는 그날 공부한 내용을 머릿속으로 떠올리며 마인드 맵을 그리듯 정리한 뒤 잠들었는데, 이렇게 하니 ‘자면서도 공부하고 있다’는 생각이 들어 불안감이 한결 줄어드는 효과도 있었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생) [4w3]`,
    `"- 킥보드로 이동을 하니 지금처럼 더운 여름에는 크게 불편함을 못 느끼고 있다. 식사도 균형잡히게 하고 영양제도 잘 챙겨먹어 생활적으로는 문제가 없는듯 하다. - 요즘 기본서 위주로 공부하다 보니 24시간 중에도 시간이 부족해서 22시를 꽉 채우고 운동까지 하고온다. 9월쯤에는 운동을 줄이고 밤늦게까지 하는 스터디카페를 끊어 저녁공부는 거기서 해야겠다. - 현재 하고있는 "종합병원 병리과 봉사활동"에서 이제는 다 친해지고 일도 익숙해져서 재밌다. 특히 생물 관련 내용을 가끔 접하고 일부러 알려주시기도 한다. 전공서에 나온 '파라핀 박편'이라는 업무가 주 업무인데 그 부분을 특히 떠올리며 하는 중이다. 그 외에도 염색, 고정, 폐기할 조직관찰 등 여러가지로 배울게 많아 계속 병리과에서 일하고싶다." — 약대가쟝 (26학년도 단국(약) 합격생) [5w6]`,
    `"1주일 동안 지치지 않고 잘 버텼다. 그리고 이번주로 금주 6개월차다. 전역하고 술을 너무 많이 마셔서 몸이 많이 망가졌었는데, 입시를 시작하고 생활 습관이 잘 잡히면서 살도 빠지고 체력도 많이 좋아졌다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생) [9w8]`,
    `"헬스장까지 너무 멀어서 그냥 줄넘기 하나 사서 운동하는걸로 대체했다. 시간을 아낄 수 있게 된 것 같다!" — 진강강민 (26학년도 순천(약)·연세(생공) 합격생) [9w1]`
    ]
  },
  "8-1":{
    생물:[
    `"이번주는 새로운 교재에 적응하느라 바빠서 별로 잘한 점이 없는 것 같다. 매일 진도를 밀리지 않고 계속 공부하긴 했다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"생물강의를 들은 후 복습을 할때 집중 제대로 안하고 시간만 길어지는것 같아서 계속 능동적으로 생각하면서 복습할려고 노력하였다. 그결과 시간은 줄고 밀도있는 복습을 하게 되었다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"꿀벌책을 중심으로 캠벨책과 함께 OX 범위를 정독했음. 지난 주에는 못했던 퀴즐렛 OX 문제를 병행하니 기본서 읽을 때 집중력이 더 좋았던 것 같음. 추가적으로 중요한 그림은 직접 그려봄. 단순히 그림을 보는 것보다 그림에서 무엇이 중요한지 그리다보니 내용 이해와 암기에 도움이 되었음." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"반복 하면 할수록 생물 개념이 더 정교해지는 느낌이 듦. 그리고 VF ox 문제로 오개념은 없는지, 여전히 놓치고 있는 개념은 없는지 확인이 가능했음. 책 여러 번 복습도 좋지만 문제를 풀며 개념이 새롭게 정립되고 깊어지는 것을 경험하였다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"통합이론을 완강했음! 아는 것만 계속하지 않고 부족한 부분을 채워넣었다. 무작정 시간만 채우지 않고 이해하는 공부를 함." — 레고링 (26학년도 계명(제약) 합격생)`,
    `"8월에 기본기를 확실하게 다져주는 것이 중요하다고 생각하였다. 이에 약한 단원들을 선별하였고, 그 단원들을 중점적으로 학습하기 위해 8월 계획을 다시 한 번 세웠다. 전 범위 학습도 중요하기에 나머지 단원들은 하루에 2시간 정도씩만 투자하여서 OX문제를 통해 복습할 예정이다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
    `"7월의 기본기 문제를 복습하면서 공부했고 그간 미뤄두었던 써머리 OX도 테스트 진도에 맞게 다 풀었다. 시간 분배가 잘된 것 같다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"라이프 교재와 박선우 ox문제 위주로 보면서 기본적인 내용에 보충하는 느낌으로 공부하였습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"이번주부터 라이프 중심으로 공부했다. 캠벨보다 친절히 쓰여 있어서 읽기 수월했고 7월에 쌓은 기본기를 바탕으로 빠르게 읽을 수 있었다. 이전에 이해하기 어렵거나 암기가 잘 안 되던 부분도 무리 없이 학습할 수 있었다. 그러다 보니 계획보다 더 많은 양을 공부할 수 있었다. 공부 순서는 라이프 읽기 -> 캠벨 그림 위주 -> 써머리로 보충 -> 써머리 OX -> 7월 OX 복습 -> 8월 OX 풀이 및 복습으로 진행했다. 이렇게 하니 한 번을 공부해도 여러 번 보는 효과가 나서 좋았다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"심화 OX 진도를 나가면서 기본기 OX 복습을 해주었고, 기본적인 내용들이 어느정도 숙지가 잘 되고 있음을 느꼈다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"꿀벌책을 보기 시작했다. 켐벨보다 이해가 잘 가고 상호 보완적인것 같아서 도움이 많이 되는 것 같다. 박선우 교재에서도 필기를 열심히 해놨던 부분 위주로 최대한 효율적으로 보려고 노력했다" — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`
    ],
    화학:[
    `"이번주에 1500제를 마지막 단원까지 모두 들었고, 인강을 듣고 남는 시간을 이용하여 반응 파트를 복습했다. 7월에 푼 기본기 테스트를 다시 풀어보며 그때보다 풀 수 있는 문제가 훨씬 많아졌다고 느꼈다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"저번주에 피드백했던거 생각하면서 풀이를 깔끔하게 체계적으로 작성하였다. 그결과 실수가 많이 줄었다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"진도를 나가는 것보다 복습하는 것에 신경 썼음. 이번 주 공부하는 단원에서는 A.P.S가 더욱 중요한 것 같아 박인규 선생님의 사고과정을 그대로 따라하려고 노력함. 그리고 화학 체크리스트로 공부 방향을 점검하면서 내가 하고 있는 공부 방식에 확신이 들었음." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"1500제 한 단원 끝낼 때마다 김준 필수이론 개념과 예제들까지 한꺼번에 돌렸는데 완강하며 한달만에 내가 배웠던 개념교재를 전부 복습하였음. 필수이론을 몇 번이고 풀었는데도 계속 이해안되고 틀렸던 문제들이 1500제를 풀고 다시 푸니, 어떤 상황인지, 어떻게 AP를 세워 풀어야 하는지 바로 적용이 되었다. 정말 신기한 경험이었고 내 실력에 대한 근거있는 자신감이 생겼음." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"계획한만큼 진도를 나갔음. 부족한 부분은 1500제를 다시 풀면서 복습해줌." — 레고링 (26학년도 계명(제약) 합격생)`,
    `"지난주에 이론적인 내용을 복습하자고 계획하였고, 이에 따라 이론적인 내용 단원들을 잘 복습해줬다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
    `"2000제 코드 1,2번 1회독이 끝났다. 예상했던 것보다는 꽤나 늦어졌지만 그래도 뿌듯하다. 인강을 먼저 듣고 문제를 풀었을 때 아주 어렵게 느껴지는 부분은 많지 않아서 그래도 얼추 맞는 방향으로 공부하고 있는 것 같다는 생각이 들었다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"코드번호 1 2 수강을 거의 마쳤고 다음주부터 3으로 넘어갈 계획입니다. 코드 번호 1 2를 풀면서 기본기가 잘 쌓였다는 느낌을 받았습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"1500제 완강했다! 후반부로 갈수록 앞 단원의 중요성을 느끼며 관련 단원도 함께 복습 하며 진도를 나갔다. 예를 들어 18장 화학 열역학과 6장 열역학을 함께 보고, 20장 전기화학을 할 때 4장에서 산화-환원 반응 파트를 다시 봤다. 기본 개념을 다시 보고 심화 내용을 다루니 훨씬 수월했다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"목표했던 양보다 더 많은 진도를 나갔다. 1500제를 수강하면서 APS를 잘 정리해둔 덕분에 2000제 앞의 내용을 수월하게 수강할 수 있었다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"복습을 열심히 했다. 체크리스트를 매일 읽으면서 기본기가 얼마나 빨리 날라갈까 싶었는데 생각보다 빨리 사라져서 복습을 사이클을 갖고 마지막 마물리 문제라도 꾸준히 풀어야겠구나 느꼈다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`
    ],
    유기:[
    `"이번에도 예제를 빠짐없이 다 풀었다. 주말에는 지금까지 공부한 내용들 중 기본서에는 포함되지 않은 예외 사항이나 암기표를 모아서 적고 다시 복습했다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"지난번에 햇갈렸던 입체화학 부분을 복습해 주었다. 월요일날 유기화학공부를 못했기에 금요일날 평소보다 더 많이 해 주었다. 유기공부를 할때 귀찮지만 손으로 구조를 그리면서 공부할려고 노력했다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"매일 아침에 고정적으로 유기 공부를 하고 있음. 지난 주에 예제를 제때 풀지 못했는데, 이번 주엔 개념 공부를 하면서 바로 예제를 풀었음." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"반응에서 제일 중요하지만 제일 약한 파트가 친핵성 치환 반응인 만큼 평상시보다 유기화학에 더 많은 시간 투자를 했음." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"계획대로 '약사랑유기화학 강의 복습-스미스 기본서 읽기-예제 문제풀이-금요일테스트' 순으로 진행함. 이렇게 하니 기억에 더 잘 남는 게 느껴졌고, '매일 1시간 이상 유기화학 공부하기'가 습관화 되었다. 점점 공부할수록 자신감이 생김." — 레고링 (26학년도 계명(제약) 합격생)`,
    `"유기화학을 공부하다 보니 피트 때 했던 기억들이 새록새록 떠오르며 반응 단원을 복습할 때 스피드가 붙었다. 이에 지난주에 계획했던 단원보다 한 단원 더 진도를 나갈 수 있었다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
    `"이번 주 분량이 유독 많게 느껴져 지레 겁을 먹었는데, 계획한대로 나누어 차근차근 공부하니 크게 어렵지 않게 소화할 수 있었다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"이번주는 매일 최소 1시간 이상씩 유기화학 공부를 하였습니다. 권민 교재를 보면서 예전 감각이 어느정도 돌아오고 있는것 같습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"이번주는 매일 2시간씩 공부를 하였다. 친핵제 치환, 제거 반응을 공부하며 산염기 파트와 입체 화학 파트에 대한 복습이 필요하다고 느껴 누적 복습을 하였다. 유기화학은 진도를 나갈수록 앞 부분에 대한 학습 기반이 특히 중요하다고 생각한다. 이번주처럼 앞으로 누적 복습을 통해 앞부분을 잊지 않도록 꾸준히 학습할 계획이다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"유기 공부 시간을 아침으로 옮겨서 1주일 간 유기:생명:화학의 비율을 3:4:4로 맞추었다. 테스트 결과가 많이 아쉬웠는데, 치환 제거 반응에 대한 이해도가 부족했다기보다는 산-염기 기초가 부족했다는 생각이 들어 산염기를 복습했고, 다시 풀어보니 잘 풀렸다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"스미스 교재와 강의를 밀리지 않고 잘 공부한 것 같다. 문제 푸는 것도 한번에 몰아서 하면 너무 많은 것 같아서 조금씩 단원들을 섞어가면서 풀어나가고 있다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`
    ],
    생활관리:[
    `"월-금 모두 독서실 출석을 정시에 완료했고 매일 애니어그램 공부법을 읽었고, 주 3회 운동을 했다. 토요일 점심에 또 일정이 잡혔는데 이번에는 2주전 행동을 반복하지 않으려 일정이 끝나자 마자 바로 독서실로 갔다. 평일보다 상대적으로 공부시간이 부족하긴 했지만 2주전과는 다르게 행동했다는 점에서 잘했다고 생각한다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생) [9w8]`,
    `"수요일 너무 힘들어서 집에갈때 아 운동 가지말까 한참 고민했는데 지금 안가면 언제 가냐 싶어서 결국 갔다. 운동 시작한 저번주보다는 컨디션이 좋은 듯하다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생) [5w6]`,
    `"이제는 생활 루틴이 잡혀서 수면 시간도 충분하고, 운동도 열심히 함. 매일 아침 애니어그램 글을 읽으면서 마음을 다 잡을 수 있음. 이번 주에는 컨디션이 좋아서 집중력도 좋았음." — 이번엔내차례 (26학년도 삼육(약) 합격생) [9w8]`,
    `"8월이 되면서 여름에 공부를 하다보니 가끔 답답하고 짜증이 치솟을 때가 있는데, 그럴 때마다 도서관에서 나와 학교 구경, 사람 구경을 하며 마음을 다스렸다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생) [1w9]`,
    `"∙자기소개서 작성과 생물 통합이론을 끝냈고 앞으로의 문제풀이 계획을 세움 ∙긍정적인 마인드로 생활함 ∙수면시간을 조정해서 평소보다 맑은 정신으로 공부함" — 레고링 (26학년도 계명(제약) 합격생) [9w1]`,
    `"지난주와 비교하여 휴대폰을 보는 시간이 줄어들었다. 자기 전에 10분이나마 오늘 학습한 내용에서 중요했던 내용들을 떠올려보는 시간을 가지기 위해 노력하였다. 8월 생물 학습에 대하여 고민을 많이 하였는데, 잘 정리했고, 최선의 계획을 수립하였다. 이 계획을 잘 지켜나가보자. 루틴을 지키는 게 점점 재밌어진다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생) [8w7]`,
    `"체력, 집중력 등 전반적인 면에서 컨디션이 좋았다. 별다른 변수 없이 계획한 바를 잘 실천했다. 이렇게 무난한 한 주 한 주가 연말까지 꾸준히 이어졌으면 좋겠다." — 초록콩 (26학년도 순천(약) 합격생) [9w1]`,
    `"이번주는 저번주 피드백을 바탕으로 ‘생활 전체를 조율하며 학습 흐름을 완성해가는 주’를 목표로 삼았다. 먼저 과목별 학습 시간을 골고루 분배했다. 생물에 치우쳐 있던 학습 패턴을 바꿔서 생물:화학:유기를 4:4:2 비율로 조정하였다. 집중력이 가장 높은 아침에는 취약한 화학을 배치하고 유기, 생물 순으로 공부하며 효율이 높아졌다. 기상, 공부, 식사, 운동, 취침시간을 기록하며 루틴을 점검했다. 저번주 시도에 더해 전날보다 일찍 일어나기와 식사 시간 규칙적으로 지키기를 실천했다. 완벽하진 않았지만 하루를 완성해보고자 노력하였다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생) [4w3]`,
    `"주중에 조문을 다녀올 일이 있어서 하루를 비워야 했는데, 운동시간과 공부 시간을 잘 조율해서 목표치 공부량을 모두 끝낼 수 있었다. 조문 다녀오고는 공부가 잘 안 잡혔지만, 밖에서 런닝을 하면서 마음을 다잡고 빠르게 공부에 다시 집중할 수 있었다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생) [9w8]`,
    `"매일매일 애니어그램과 체크리스트를 읽고 실천하려고 노력했다. 어떻게 해야 시간을 가장 효율적으로쓸수 있을까 고민하고 실천했다. 공부 과목을 시간별로 나눴고, 매일 십분정도씩은 각 과목에서 배운 것 중 헷갈렸던 것을 복습하는데 썼다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생) [9w1]`
    ]
  },
  "8-2":{
    생물:[
    `"저번 주와는 다르게 교재를 읽기 전 꿀벌책의 굵은 글씨 위주로 읽으며 핵심 내용을 먼저 파악한 뒤 교재를 보면서 핵심과 지엽을 구분하려고 노력했다. 금요일부터는 교재에서 핵심적인 부분 위주로 빈 종이에 정리한 뒤 이걸 복습할 때나 정리할 때 자주 봐주니 암기 사항이나 전체적인 내용 구조가 훨씬 머리에 잘 정리되었다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"이번 주도 꿀벌책을 중심으로 OX 문제 범위에 해당하는 부분을 공부했다. 처음 기본서를 읽을 때보다 훨씬 빠르고 수월하게 읽히는 것이 확실히 느껴졌다. 목차, 굵은 글씨, 그림에 집중하며 공부하다 보니 지난주처럼 지나치게 세세한 부분까지 보지 않게 되었고, 공부의 목적과 방향을 인지하는 것이 얼마나 중요한지 다시금 깨달은 한 주였다." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"22학년도까지의 전개년 MD 기출을 다 풀었으며 인강을 통해 풀이 방식을 보충하였음." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"써머리 ox 풀고 통합이론을 복습하며 헷갈리던 내용을 다시 정리함. 월수금 테스트를 치는 진도에 맞춰 계획한 복습을 실천했음" — 레고링 (26학년도 계명(제약) 합격생)`,
    `"지난주에 계획한대로 약점 파트들을 잘 다져나가기 위해 노력하였다. 이번주는 광합성과 DNA테크놀로지 파트는 중점적으로 공부하였으며, 광합성 파트는 MDP문제도 풀며 개념이 어떻게 문제에 적용되는지도 확인할 수 있었다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
    `"통합이론 강의를 들으며 그에 맞춰 캠벨 기본서를 읽어 주었다. 진도가 안맞아 저번에 못풀었던 ox문제들도 이번에 다시 풀어주었다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"기본서(굵은글씨 위주)와 통합이론을 읽고 기본기OX, 써머리OX, 메디컬OX까지 다 풀면서 입체적으로 학습했다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"기본서와 박선우 교재를 읽으면서 명칭들이 익숙하지 않은 중요 단원들(수용체 신호전달, 내분비계, 면역 등)을 따로 1시간 정도 시간을 내서 암기하는 느낌으로 간단하게 보고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"VF OX진도에 맞춰 저번주와 마찬가지로 라이프 -> 캠벨 그림 -> 써머리 -> VF OX 순으로 진행하였다. 7월에 강의를 듣지 않았던 생리학 파트는 박선우 교재를 통해 보충해주었다. 발생, 생식 단원에서 이해 부족을 느껴 이 부분만 강의로 보충하였다. 7월 학습에서 부족한 부분을 찾아내고 이를 보완하는 공부를 하였다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"특별히 잘한 점은 없는 것 같다. 매일 4시간 분량을 채우면서 공부 중이고, 퀴즐렛 ox 매일 50문제씩 풀고 있다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"진도를 밀리지 않고, 너무 딥하게 보려고 하지 않고 중요한 내용 위주로 읽어서 시간을 아꼈다. 어차피 다회독 할거니까, 기말고사용 회독 하듯이 공부하려고 노력했다. 박선우 교재 외에 꿀벌책까지 읽을 시간은 벌 수 있었다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`
    ],
    화학:[
    `"이번 주부터 2000제를 풀기 시작했다. 테스트 보는게 두렵고 부담스러웠지만 회피하지 않고 복습이 끝나자마자 신청했다. 헷갈리는 암기 사항을 모아놓은 노트를 계속해서 보충하고 자주 봐주려 하고 있다. 화학공부법 체크리스트도 화학 공부가 끝날 때 마다 체크해서 보완하기 위해 따로 적어뒀다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"드디어 1500제를 완강했다. 원래 목표였던 8월 중순보다 조금 늦긴 했지만, 전체적인 학습 계획에 맞춰 꾸준히 공부해온 것 같다. 7월에 다시 1500제를 들으며 문제 풀이 기본기를 탄탄히 다질 수 있었고, 실력점검 모의고사에서는 취약했던 산염기 파트 문제를 모두 맞혀 뿌듯했다. 선생님 말씀대로 1500제가 가장 중요한 과정임을 7·8월 동안 직접 체감할 수 있었다." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"2000제를 빠짐없이 100문제씩 풀었으며, 각 단원별로 AP 구조를 생각하며 체계적으로 푸는 연습을 하였다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"2000제 문제를 매일 50문제 꾸준히 복습함. 문제를 보고 방법 떠올린 후에 풀이에 들어감" — 레고링 (26학년도 계명(제약) 합격생)`,
    `"화학 시험을 대비하기 위해 이론적인 부분을 정리해줬고, 박인규 선생님 카페에 있는 2000제 점검 모의고사도 풀었다. 이번주는 기본기 수준의 모의고사를 많이 풀면서 빈틈이 없는지 확인하는 한 주였다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
    `"이번 모의고사를 통해 올바른 방향성으로 공부하고 있다는 확신이 들었다. 저번과는 달리 억지로 빨리 풀려 하지 않았다는 점, 무턱대고 덤비지 않고 문제를 어떻게 풀어갈지 일차적인 방향성을 잡고 들어가니 오히려 막히지 않고 시간이 줄었다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"테스트에서 빠르게 풀 수 있는 문제들을 먼저 풀어주었다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"코드번호 1 2 를 완강하였고 코드번호 3번 풀이를 시작하였습니다. 8월 모의고사를 봤을때 전체적인 기본기가 많이 올라온 것을 느낄 수 있었습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"1500제 테스트를 통과하고 2000제로 넘어갔다. 강의에 앞서 1500제 목차 구조를 먼저 읽고 큰 흐름을 이해한 뒤 강의를 들었다. 2000제는 문제 유형이 다양하고 상식으로 푸는 문제도 많아, 확실히 정리하고자 단원별 암기 노트를 작성하기 시작했다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"계획대로 2000제 파트1,2를 완강했다. 8월 모의고사에서 비록 오답이 꽤 나오긴 했지만, 7월 모의고사에 비해 전범위에 대한 기본기가 어느정도 갖춰졌음을 느꼈고, 막연하게 느껴졌던 전기화학과 혼합 평형 문제에 자신감이 생겼다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"현재 상황을 잘 파악한 것이 이번주의 가장 큰 수확인 것 같다. 화학 타임어택 시험을 통해 나의 위치와 상황과 시험에서 점수가 잘 나오지 않는 이유를 알게 된 것 같다. 목표한 만큼은 아니지만 다음주면 충분히 1500제를 시간을 들여 완강할 수 있게 되었다. 매일체크리스트를 읽으면서 시간 제약 없이 박인규 선생님과 같은 생각을 하면서 풀려고 많이 노력했다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`
    ],
    유기:[
    `"모든 예제를 매일 일정한 범위에 맞춰서 다 풀었고, 이전 단원과 연관되는 것 같은 부분은 다시 돌아가서 복습해가며 공부했다. 예외사항이나 스미스에 없는 내용은 계속해서 따로 기록하고 있다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"매일 아침 꾸준히 유기 공부를 이어갔고, 약사랑 유기화학 강의를 수강하면서 스미스 유기화학만으로는 부족했던 개념적인 부분을 보완할 수 있었다." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"본격적인 반응 단원들에 들어가면서, 인강을 듣고 내가 작년에 정리해둔 개념과 통합해 복습했음. 중요한 핵심 위주로 빠르게 복습 후 바로 연습문제들을 풀었는데 실력 기르기에 좋은 전략인 듯하다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"저번주에 정한 루틴대로 내용을 공부하고 예제 풀이를 실천함. 매일 2시간 이상 유기 공부에 시간을 투자했음" — 레고링 (26학년도 계명(제약) 합격생)`,
    `"이번에 알코올과 에터를 들어가기 전에 Sn2, Sn1, E2, E1을 여러 번 익히고 들어가줬다. 덕분에 메커니즘을 이해하는데 있어 문제가 없었다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"기본서 예제를 중심으로 차근차근 학습했다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"다음주면 권민 교재 1회독을 마칠것 같습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"기존 루틴에서 약사랑 유기화학 강의를 추가해 보충하니 산재되어 있던 지식이 연결되며 체계가 잡혔다. 동시에 자연스럽게 암기가 되어 유기반응 파트에 점점 자신감이 붙어 갔다. 알코올,에터 파트는 앞단원 할로젠화 알킬에서 배웠던 반응을 그대로 활용하는 거라 앞단원 복습도 철저히 하였다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"아침 3시간 유기공부를 고정으로 해두었고, 이번주도 잘 지켰다. 매일 공부 시작 전에 약사랑 강의에서 발췌한 필수적인 pKa 값들과 친핵체 및 강염기의 종류를 외우고 시작했다. 유기에 자신감이 점점 붙고 있다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"유기화학 강의를 듣다가 앞단원과 연계가 굉장히 큰 단원임을 느껴서 복습을 하는데 시간을 계속 투자하고 있다. 하루 십분정도 각 단원에서 한두문제씩이라도 풀어보려고 하고 있다. 산염기 단원을 다시 보면서, 결국 손으로 그려보면서 뭐가 더 안정한지 파악하는 연습을 많이 해보는게 중요하겠다는 생각이 들었다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`
    ],
    생활관리:[
    `"처음으로 평일에 운동을 3회 했다. 금요일에는 너무 하기 싫었지만 결국 했다. 기상, 출석, 애니어그램 읽기 루틴을 유지하는 데 어려움이 없었고 처음으로 공부 중 쉬는 시간을 규칙적으로 가지며 공부했는데 집중력이 더 나아진 것 같아 좋았다. 그래도 집중력이 떨어지는 것 같은 날에는 아예 다른 장소로 옮겨서 공부했다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생) [9w8]`,
    `"수면 시간을 규칙적으로 지키고 운동도 꾸준히 해왔다. 식사 역시 여러 가지를 시도해 본 끝에 식곤증이 거의 오지 않도록 음식의 종류와 양을 조절해 정착했으며, 덕분에 식사 후 집중력이 떨어지는 일도 없어졌다." — 이번엔내차례 (26학년도 삼육(약) 합격생) [9w8]`,
    `"학교 도서관이 공사를 하며 며칠간 집에서 주로 공부를 하였으나 효율이 떨어진 것을 느껴 바로 독서실로 갔다. 조금이라도 환경이 지루하거나 불편하면 다른 곳으로 가서 다시 공부를 이어나가는 것이 역시 좋다고 느꼈다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생) [1w9]`,
    `"∙꾸준히 운동을 해서 스트레스를 해소했고 체력이 더 늘어난 것 같음 ∙6시간30분-7시간 정도로 수면시간을 지키니 집중력에 확실히 도움이 되었음." — 레고링 (26학년도 계명(제약) 합격생) [9w1]`,
    `"루틴을 지키는 게 상당히 익숙해졌다. 공부를 하는 목적을 항상 생각하면서 공부했다. 광복절에 가족 일정이 있었기 때문에 이를 위해 평일에 더 타이트하게 학습을 진행해줬다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생) [8w7]`,
    `"이번주는 유달리 소화해야할 분량이 많게 느껴져 점심시간, 저녁시간까지 최대한 활용하여 공부했더니 순 공부시간은 역대급으로 많이 확보할 수 있었다. 유튜브 쇼츠를 거의 안봤다." — 초록콩 (26학년도 순천(약) 합격생) [9w1]`,
    `"공부 중간중간 쉬는 시간을 넣고 한동안 안했던 명상을 다시 하였습니다. 확실히 저번주보다 멍때리는 시간이 줄어든 것 같습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생) [6w5]`,
    `"시간표를 고정해 하루 세 끼를 제시간에 챙겨 먹고 운동도 실천했다. 밤에는 바로 잠들려고 노력한 덕분에 수면의 질이 좋아졌고, 공부 집중력도 높아졌다. 점심 식사 이후 집중력이 떨어지는 시간에는 카페로 이동해 4시간 정도 공부했다. ‘불특정 다수의 감시 효과’를 활용하니 졸음도 줄고 잡생각 없이 몰입할 수 있었다. 또한 기계적으로 학습하기 위해 하루 공부 계획을 더 세분화했다. 공부를 작은 단위로 쪼개니 성취감이 쌓여 하루의 지루함을 이겨낼 원동력이 되었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생) [4w3]`,
    `"지치지 않고 꾸준하게 공부했고, 밤에 핸드폰 이용 시간을 줄였다. 9월부터는 공부시간을 늘릴 계획이라 한 주간 2번 30분 일찍 독서실에 들어가 공부를 시작했다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생) [9w8]`,
    `"매일 아침 정해진 시간에 일어나려고 갖은 노력을 다 했다. 집 밖에 나가야 알람이 꺼지게 하려고 아파트 밖의 표지판을 찍어야 알람이 꺼지게 했더니 효과적이었다. 잠도 최대한 7시간 자려고 노력하다보니 이번주는 공부시간이 많이 늘었다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생) [9w1]`
    ]
  },
  "8-3":{
    생물:[
    `"이번에도 꿀벌책을 먼저 읽은 후 교재 내용을 빈 종이에 정리해가면서 공부하고 종이는 o/x 오답을 정리할 때도 활용했다. 주말에는 이 종이랑 캠벨을 병행하면서 복습했고 분자생물학 o/x와 이번 퀴즈 범위의 7월달 o/x를 같이 복습했다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"이번 주 OX 범위를 7월 OX퀴즈를 추가로 정리해서 요약본을 만들었고 암기 상태를 점검했으며 7월 OX를 다시 풀어봤을 때 근거까지 정확하게 대면서 풀 수 있을 정도로 암기 상태가 되어 있다는 것을 확인할 수 있었다." — Akdow (26학년도 단국(약) 합격생)`,
    `"꿀벌책을 중심으로 OX 문제 범위에 해당하는 부분을 공부했다. 그림을 함께 그리면서 정리하니 핵심 내용을 더 잘 이해할 수 있었다." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"1) VF를 풀면서 책 구석구석 차마 못 외운 부분들 (특히 생태, 분류 부분)을 발견할 수 있었다. 중요도가 상대적으로 떨어져 제대로 외우지 않은 부분들이 출제되어 약점을 보완함 2) 23학년도 MD 문제를 풀어 보았는데, 그동안 단원별로만 풀다가 전 단원에 걸친 문제들을 풀어보니 실력 점검에 좋았다. 단순 암기형 문제들도 좋았고 실험 문제들도 건드릴 수 있는 난이도라면 쫄지 않고 일단 건드려보았다. 의외로 작년 필기시험을 보러다닐 때 보았던 문제들이 그대로 나와있었기에, 꼭 26학년도까지 다 풀어보고 정리해야함을 느꼈다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"이번 주도 박선우 통합이론 + OX + 써머리 + VF 메디컬 심화 OX + 캠벨 & 라이프 학습 패턴대로 별 탈 없이 공부했다. 특히 요새는 하루 박선우 통합이론 -> 다음날 써머리 OX -> 다다음날 VF 메디컬 심화 OX + 기본서 학습 과 같이 같은 단원의 내용을 3일 정도에 걸쳐 여러 번 봐주면서 학습하고 있는데 효과가 정말 좋은 것 같다. 한 번에 내용을 암기하고 머릿속에 넣으려고 애를 쓰는 것 보다 자연스럽게 여러번 봐주니 머릿속에 훨씬 잘들어왔다. 시간이 지날수록 나와 잘 맞는 학습법들이 정립되가는 것 같다." — 쿠리만쥰 (26학년도 5관왕 | 단국(약)·계명(제약)·삼육(약)·강원(약)·우석(약) 합격생)`,
    `"∙ 써머리 ox를 풀며 월수금 시험 전 각 단원의 내용을 정리하는 시간을 가짐 ∙ 선생님께서 말씀하신대로 기본서 그림을 손으로 그리며 공부함" — 레고링 (26학년도 계명(제약) 합격생)`,
    `"8월달에 약점파트를 정리하기 위해 계획한대로 잘 진행 중이다. 이번 주에는 인체생리학 단원 중에 특히 약한 파트인 면역학을 다시 한 번 복습해줬고, MDP문제들도 풀면서 다시 한 번 개념을 확인하는 시간을 가졌다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
    `"2권이 끝남. 전공과목 수강을 하지 않은 분자생물학이다보니 생각보다 걱정이 많았는데 무사히 잘 넘긴것같아서 다행이라 생각이 듦. 물론 강의듣고 캠벨책까지 읽어 주었음." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"기본서를 굵은 글씨 위주로 빠르게 훑어보았다. 진도에 맞게 기본기 OX 복습을 꾸준히 했다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"라이프 교재를 계획한 만큼 읽으면서 박선우 교재(써머리 ox퀴즈 포함)도 함께 공부하였습니다. 다음주면 라이프 교재를 1회독 할 수 있을 것 같습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"내용이 많았음에도 VF OX진도에 맞춰 잘 따라 갔다. 라이프를 읽을 때 문장 형태로 읽다보니 지루하게 느껴져서 써머리와 병행해서 추가할 내용 있으면 적어가면서 공부했다. 이렇게 하니 집중력을 유지하면서 공부할 수 있었다. 7월에 못들었던 면역계 강의를 들었고, 순환계, 배설계도 추가로 들으며 보충해주었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"진도는 욕심내지 않고 딱 적당히 나갔지만 다음주엔 식생분진까지 강의가 다 끝날것 같다. 이번주 VF OX 문제도 생각보다 적게 틀려서 단기기억 때문인가 싶었지만 이게 내 실력이 되도록 더 노력해야겠다고 느꼈다." — 약대가쟝 (26학년도 단국(약) 합격생)`,
    `"홍쌤께서 가이드 해주신대로 타이핑을 치면서 암기와 정리를 해봤더니 시간 절약도 되고 암기도 잘 되었다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"저번 피드백 때 너무 꼼꼼하게 하려는 경향이 있다고 하셔서 최대한 효율적이게 보려고 노력했다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`
    ],
    화학:[
    `"2000제를 풀면서 옆에는 1500제 교재를 같이 둔 채로 다 푼 뒤 헷갈렸던 개념이나 문제는 해당 단원을 복습하거나 따로 노트에 보충하는 식으로 공부했다. 계산문제는 인강에서 선생님과 같은 방식으로 풀었는지 최대한 확인하려 노력했다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"2000제 1회독을 마무리했으며 1단원부터 각 문제별로 적어놨던 암기사항들을 정리하면서 다시 한번 개념의 암기 사항을 확인하고 복기하는 시간을 가졌다. 다음주 부터는 빠르게 체크해놨던 문제들 위주로 2회독을 시작할 예정이다. 암기노트 작성 후 최종 점검으로 7,8월에 봤던 타임어택 모의고사를 30분안에 다 맞추는 것을 목표로 시행했고 성공했다." — Akdow (26학년도 단국(약) 합격생)`,
    `"1500제 복습을 마쳤다. 취약한 부분을 정면으로 마주하면서 헷갈리던 내용도 상당 부분 해결된 것 같다. 쉬운 문제를 여러 번 반복하며 박인규 선생님의 사고 과정을 그대로 따라가려고 노력하니 자신감이 생겼다. 내일 2000제 테스트에 대해 선생님께 연락드려야겠다." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"1) 1500제를 다시 풀며, 8월 모의고사 틀린 부분이 내가 소홀히 했던 개념 부분이었음을 다시한번 깨달았다. 가령, 산염기 적정 문제에서 화학종 농도와 pH는 곧잘 구해도, 당량점이 pH 7보다 큰지 작은지, 그래서 지시약은 무엇을 써야하는지처럼 다소 덜 중요해보이지만 굉장히 기본적인 개념들을 놓친 것이었다. 모의고사와 1500제 복습을 통해 내가 놓친 부분이 어디인지, 덜 숙련된 부분이 어디인지를 파악할 수 있어서 정말 다행이었다. 2) 약점인 열화학 단원을 2000제와 인강을 통해 다시 잘 다지게 되었다. 이해도 안되고 문제도 잘 안풀렸는데 이제 이해가 되고 어떻게 푸는지 감이 생겼다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"기출올인원을 풀다 보니 생각보다 사고를 많이 요하거나, 문제풀이가 은근 복잡해서 머리를 쓰게되는 경우가 많았다. 그래서 기본기가 조금 약해질 수 있겠다는 생각이 들었다. 그래서 하루에 4시간 화학공부를 한다고 하면 2시간은 기출 올인원으로 기출문제 공부를, 나머지 2시간정도는 해당 단원의 적중 2000제를 공부해봤다. 괜찮은 것 같아서 일단은 다음주도 이렇게 학습해 봐야겠다." — 쿠리만쥰 (26학년도 5관왕 | 단국(약)·계명(제약)·삼육(약)·강원(약)·우석(약) 합격생)`,
    `"문제를 풀 때 확실하게 아는 느낌이 아니라 불안했는데 1500제 예제를 복습하고 난 후 회복되었음. 다음주도 2000제와 1500제 병행하기" — 레고링 (26학년도 계명(제약) 합격생)`,
    `"9월초까지는 생물을 중점적으로 학습을 하려고 계획을 했고, 화학은 상대적으로 개념이 약한 파트인 고체파트 지엽적인 내용들을 정리해줬다. 또한 문제풀이 감각이 떨어지면 안 되기 때문에, 3일 간격으로 경희대 기출문제를 풀어줬고, 2000제에서 계산 단원 문제들을 하루에 10문제씩 복습하였다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
    `"중간중간 지엽적인 문제들을 제외하면 안정적으로 문제풀이가 되는것 같습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"저번주와 마찬가지로 단원별 암기 노트를 작성하였다. 강의를 듣고 문제별로 1500제 목차와 매칭시켜 정리하였다. 이 과정에서 자연스럽게 이론 복습이 이루어졌다. 후반부로 갈수록 앞내용이 흐릿했던 것을 방지하고자 누적 복습도 시작했다. 오늘 학습 한 것을 모레 다시 복습하는 식으로 하니 장기기억화 되는 것 같다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"인규샘이 말한 화학에 있어서 50%는 먹고 들어간다는 양론, 열화학 파트까지 강의시청을 했다. 100문제 넘게 안쉬고 풀어도 오답이 별로 안나와서 약간 자만할뻔 했지만 실제 시험을 겪어봐서 그런지 더 열심히 해야겠다고 느꼈다. 하지만 문제풀이 후 강의시청을 하려니 강의 진도가 잘 안나간다..." — 약대가쟝 (26학년도 단국(약) 합격생)`,
    `"계획한 것보다 더 진도를 나갔다. 코드1, 2 문제들을 복습하면서 박인규 선생님 풀이법이 어느정도 내재화된 것이 느껴졌다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"5,6장 문제를 풀고 나서 답은 맞추는데 체계적이고 기계적으로 푸는 느낌이 들지 않아서 진도를 멈추고 사고 과정을 점검해주었다. 6장, 19장의 경우 1500의모든 예제를 다시 풀어보며 풀이과정의 체계를 다시 상기시켜주었다. 문제를 풀 때 aps 흐름을 점검하며 풀기 위해 풀이 중 넘버링을 하여 AP대로 풀기 위한 장치를 마련하였다." — 시계탑기린친구 (26학년도 강원(수) 합격생)`,
    `"1500제를 드디어 끝냈다. 두번째 보는건데도 뒷부분은 거의 처음보는 느낌이어서 더 열심히 복습하며 2000제 나가서 APS를 잘 적용해야겠다고 생각했다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`
    ],
    유기:[
    `"모든 예제를 다 풀었고, 이전 단원과 연관되는 것 같은 부분들은 계속 복습하며 문제를 풀었다. 유기화학은 문제를 푸는 게 재밌어서 매일 공부하는 데에는 문제가 없었다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
    `"이번주는 내용을 정리하고 2일정도 체화를 한 후 문제를 풀었다. 맞춘 개수는 크게 차이가 없더라도 풀고 나서 이게 맞나라는 생각이 들었던 여태까지와 다르게 풀었을 때 확실히 이 반응이 일어날거라는 생각을 가지고 풀어서 만족스러운 공부였던 거 같고 처음보는 반응들이 나왔어서 추가로 정리하면 될 거 같다." — Akdow (26학년도 단국(약) 합격생)`,
    `"알켄과 알카인 부분은 여러 차례 보았지만, 기본서 학습과 예제 풀이, 그리고 약사랑 유기화학 강의를 통해 다시 개념을 다졌다. 잘 알고 있다고 생각했던 단원이었지만, VF 단원별 문제 풀이를 통해 여전히 탄소 양이온 자리 옮김 반응의 적용을 제대로 하지 못한다는 것을 알게 되었다." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
    `"알켄, 알카인까지 기본서 연습문제까지 잘 풀었음" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
    `"약사랑 유기화학 + 스미스 기본서 예제 및 단원별 추가문제 + VF 유기화학 단원별 문제 학습 습관이 이제 잘 잡힌 것 같다. 이번 주 부터 매일 두시간 씩 유기화학 공부에 시간을 투자하니 날마다 유기화학 내용과 문제풀이에 익숙해지는 듯 하다. 일주일동안 약사랑 유기화학에 새로 올라오는 단원의 강의 공부 + 전단원 누적복습 을 개별적으로 진행중인데" — 쿠리만쥰 (26학년도 5관왕 | 단국(약)·계명(제약)·삼육(약)·강원(약)·우석(약) 합격생)`,
    `"∙강의-기본서-예제-금요일 테스트순서로 진행함. ∙무작정 외우기보다는 매커니즘을 그리며 이해하는 공부를 했음. 확실히 기억에 오래남는 것을 느낌." — 레고링 (26학년도 계명(제약) 합격생)`,
    `"매일 꾸준히 유기화학 공부를 했다. 특히 유기1에 해당하는 내용들의 물리적 성질을 전체적으로 정리하였다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
    `"저번주에 정리 못한 알코올과 에터를 포함하여 알켄과 알카인까지 정리를 해 주었음. 그 결과 확실히 덜 햇갈리고 내용들이 유기적으로 연결되기 시작함. 정리를 하면서, 뒷단원에서 공부한 내용을 가져와 앞에 같이 정리를 해 주었음." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
    `"기본서 예제를 중심으로 차근차근 학습했다. 약사랑 인강으로 지난 내용을 빠르게 복습했다." — 초록콩 (26학년도 순천(약) 합격생)`,
    `"저번주 피드백처럼 책상에 앉으면 유기부터 1시간씩 공부하였습니다. 권민 교재 1회독을 마쳤고 기본서도 계획한 만큼 공부하였습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
    `"저번주와 마찬가지로 스미스와 약사랑 유기화학 강의를 병행해서 공부하였다. 누적 복습을 통해 앞서 배운 단원과 이번 주 학습 내용을 연결하여 이해도가 올라갔다. 또한 VF 문제 풀이 과정에서 부족함을 느낀 산화,환원 반응을 스미스 12장과 강의로 보충해주었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
    `"저번주에도 느낀 전공서마다의 차이를 어떻게 극복할까 생각하다가 작년에 김홍영 인강으로 공부했던 교재가 있어서 전공서에서 못 봤던 부분만 발췌해서 따로 공부했다. 거기에 유튜브 강의까지 보니 이번 시험에서도 가오존분해나 린들러촉매, KMnO4 등 전공서를 커버할 수 있었다." — 약대가쟝 (26학년도 단국(약) 합격생)`,
    `"매일 유기 공부 시간을 지켰고, 앞의 내용들을 까먹지 않게 틈틈히 복습해주었다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
    `"계속 앞단원에서 부족한게 보여서 교재도 다시 읽고, 못풀고 지나온 문제도 다시 풀어나가고 있다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`
    ],
    생활관리:[
    `"이번 주는 불가피하게 몸 컨디션이 나빴는데 7월과는 다르게 평일 내내 루틴을 유지했다. 주말에 운동을 하면서 이제는 강도를 더 늘려도 되겠다는 생각이 들 정도로 처음 런닝을 했을 때보다 체력이 좋아진 게 느껴졌다. 저번 주보다 눕자마자 잠드는 날이 늘어났다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생) [9w8]`,
    `"저번주에 수정한 사항들은 잘 반영해서 공부를 규칙적으로 진행했고 운동도 꾸준하게 했다." — Akdow (26학년도 단국(약) 합격생) [5w6]`,
    `"공부시간, 수면시간, 운동 횟수와 강도, 시간 모두 잘 지키고 있다. 매일 애니어그램 글을 읽으면서 하루 공부를 시작한다." — 이번엔내차례 (26학년도 삼육(약) 합격생) [9w8]`,
    `"운동을 다시 나가며 정신도 맑아지고 허리 통증도 많이 줄었다. 시간 아까워하지 말고 이번주처럼 꾸준히 운동가자." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생) [1w9]`,
    `"저번 주 보다는 그래도 걱정과 고민이 줄어들긴 했다. 내가 지금 할 수 있는것에 집중하면서 하루하루를 잘 살아나가려고 노력했고, 앞으로도 그렇게 계속해야겠다." — 쿠리만쥰 (26학년도 5관왕 | 단국(약)·계명(제약)·삼육(약)·강원(약)·우석(약) 합격생) [5w6]`,
    `"∙평일 루틴을 깨지 않고 일찍 도서관에 감 ∙건강 관리를 잘 해서 좋은 컨디션으로 한 주를 생활 함" — 레고링 (26학년도 계명(제약) 합격생) [9w1]`,
    `"루틴을 잘 지켜나가고 있고, 아침에는 눈을 뜨자마자 세면을 하며 하루 일과를 시작하는 루틴을 추가하였다. 이렇게 하루를 시작하다보니, 아침에 침대에 누워있는 시간을 줄일 수 있었다. 저녁에 12시 전후로 취침하기 위해 11시 30분부터는 최대한 휴대폰을 안 보기 위해 노력하였다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생) [8w7]`,
    `"이번주에도 운동을 3회 감. 공부중에 조는 빈도가 많이 줄음." — 고냥이 (26학년도 경희(치)·경성(약) 합격생) [5w6]`,
    `"계획한 운동량과 공부시간을 잘 지켰다." — 초록콩 (26학년도 순천(약) 합격생) [9w1]`,
    `"저번주와 마찬가지로 큰 이슈는 없었지만 저녁 먹고 난 후에 졸리는 경우가 있습니다. 그때마다 복도로 나가서 스트레칭하면서 잘 이겨내고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생) [6w5]`,
    `"이번 주에는 감정에 휘둘리고 완벽주의적 성향 때문에 공부가 계획대로 이루어지지 않자 힘들었다. 포기하고 싶은 마음과 자책감으로 상황을 피하고 싶었다. 그래도 회피하지 않고 직면하며 선생님께 도움을 청했다. 이를 통해 혼자 감정에 매몰되지 않고 외부 시각을 빌려 상황을 객관적으로 바라볼 수 있었다. 앞으로의 학습을 유지할 수 있는 큰 힘이 되었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생) [4w3]`,
    `"날짜가 거의 8월이 끝나가고 9월이 다가오니 슬슬 불안감이 밀려와서 오랜만에 애니어그램 유형별 학습법을 읽곤 한다. 잡념이나 쓸데없는 걱정을 덜 해야 하지만 아예 안할수는 없는것 같다. 그럴수록 운동할때도 더 힘들게 해서 잡념을 떨친다. 토익도 이번주에 봤지만 시험 전날에 시험 1회 정도 보고 오답한게 다라서 시간을 많이 쓰지도 않았는데 본 시험에서 독해를 다 맞아서 아직 실력이 안죽었나 싶었다." — 약대가쟝 (26학년도 단국(약) 합격생) [5w6]`,
    `"입시 스트레스가 유난히 큰 한 주였어서 소화불량도 겪고 많이 힘들었지만, 반수할 때 쓴 플래너를 보면서 마음을 다 잡고 평소에 안 듣던 노래도 들으면서 어떻게든 공부를 해나갔다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생) [9w8]`,
    `"늦게 일어난 날에도 일어나서 포기하지 않고 그날의 시간을 잘 쓴 것! 매일 감사일기를 쓴 것." — 시계탑기린친구 (26학년도 강원(수) 합격생) [4w3]`,
    `"일주일에 세번 땀날정도로 운동도 다녀오고, 일찍 일어나는것도 대체로 잘 했다!" — 진강강민 (26학년도 순천(약)·연세(생공) 합격생) [9w1]`
    ]
  },
  "8-4":{
    생물:[
