  `"기본서를 읽을 때 대단원 → 중단원 → 소단원 순서로 전체 흐름을 잡은 뒤 세부 내용을 익히니 머릿속에 체계가 잡히는 느낌이었다. 그런데 문제가 잘 안풀려서 원인을 분석해보니 생물학적 기작의 결과만 암기하고 과정은 이해만 하고 넘어가는게 문제였다. 이것을 깨달은 이후로 단순 이해에 그치지 않고 개념 꼼꼼히 보고 외울건 외우고 나서 문제를 푸니 더 잘 풀렸다. 그리고 시각화하여 기억하면 더 잘 남는 것 같아 스스로 메커니즘을 그리며 외웠다. 또한 기본서 → 써머리 OX → VF OX 순으로 공부하니 흩어져있던 개념들이 체계가 잡히고 개념이 훨씬 명료해지는 느낌이 들었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"이번 주 OX 문제에서 원하는 성적을 받지 못 하였지만, 해당 내용들에 대해서 해설지와 기본서를 참고하여 복습을 진행했고, 관련된 내용들도 추가적으로 학습하였다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
  `"기본서의 큰 틀과 핵심 키워드를 중심으로 차근차근 공부했다. 기본서를 읽을 때의 집중력이 점점 좋아지는 것 같기도 하다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"라이프 책을 다시 읽기 시작했습니다. 캠벨, ox퀴즈 리뷰도 하면서 라이프 책을 읽으니 좀 더 수월하게 읽히는 느낌을 받았습니다.  ." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"- 운동끝나고 자기 전까지 남는 시간에 써머리를 읽으면서 그날 배운 부분을 복습했다.  - 금요일 시험범위가 내가 이번 달에 목표한 범위의 마지막 부분이길래 단원을 좀 건너뛰어서 그 부분부터 공부했더니 좀 어렵던 단원임에도 ox문제에서 3개밖에 안 틀렸다. 뒷부분을 미리 들어서 느낌상으로 잔여강의 수가 얼마 안남은 기분이라 좋다." — 약대가쟝 (26학년도 단국(약) 합격생)`,
  `"ox퀴즈 범위를 따라가면서 인체 전 범위를 노용관 선생님 강의 base로 정리했던 요약본으로 복기를 한 번 하고 ox퀴즈에서 틀린 개념의 부분을 켐벨 책으로 추가했다. ox 퀴즈를 마무리하고 박선우 선생님의 퀴즐렛으로 그 부분에 해당하는 문제들을 다시 한 번 풀어보며 누적으로 계속 개념을 채우는 방식으로 공부를 진행했다." — Akdow (26학년도 단국(약) 합격생)`,
  `"항상 어렵고 매일 봐도 모르겠는 면역학을 처음으로 기본서를 읽었는데 기본서 기준 심화된 내용이 빠져있는것같지만 흐름을 이해하게 됨. 그동안 알고 있던 단순암기지식을 그 흐름에 끼워넣으면서 면역학 내용이 엄청 방대하지는 않구나. 할만하다. 발생학도 빨리 학습해서 생물에서 버리는 단원은 없도록 만들자" — 푸파 (26학년도 순천(약) 합격생)`,
  `"저번 피드백에 따라 다른 공부법들을 참고했다. 지금까지 단원을 제대로 본 적이 없다는 걸 깨닫고 기본서의 대단원, 중단원, 소단원을 읽으며 이 단원의 흐름과 각 단원에서 어떤 내용이 있었는지 대강 기억나도록 공부하고 그림이 나오는 내용은 좀 더 자세하게 공부했다. 기본서 두 권을 중심으로 공부하고 인강 교재는 약간 참고만 하는 식으로 공부했다. 이랬더니 O/X 퀴즈를 정말로 내 약점을 확인하는 용도로 사용할 수 있었고, 실제로 성적도 올라서 뿌듯했다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"박선우 통합이론 1권을 끝내서 뿌듯하다. 2권은 내용이 어려울 것 같지만 열심히 해서 극복해보자." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"강의 진도 나가는 것을 좀 미루고 기본서 읽기 + 퀴즐렛 OX로 기본적인 내용을 먼저 쌓는 것에 집중한 것. VF 문제 리뷰 꼼꼼하게 한 것." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"순환계와 호흡계 파트를 캠벨 책으로 먼저 읽다가 잘 안 읽혀서 노용관 선생님 강의를 발췌해서 들었다. 이로인해 진도는 살짝 밀렸지만, 헷갈리고 자신 없던 단원의 개념을 다시 한번 다질 수 있었다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"-이번 주에 OX퀴즈를 응시했던 생리학 단원들은 분자생물학 단원에 비해서는 조금 자신있는 편이라 공부할 때도 재미있었고, 재미가 있으니 공부도 더 잘 된 것 같다. 다른 단원들의 실력도 키워서 재미있게 공부할 수준이 되어야겠다." — 쿠리만쥰 (26학년도 5관왕 | 단국(약)·계명(제약)·삼육(약)·강원(약)·우석(약) 합격생)`,
  `"OX 진도에 맞춰 계획대로 학습을 진행했다. 특히 생리학 파트는 처음에는 단순 암기 위주라고 생각해 부담감이 컸다. 그러나 캠벨을 읽으며 공부하니 몸에서 일어나는 과정들이 흥미로운 이야기처럼 이해되었고, 내용이 자연스럽게 머릿속에 들어왔다. 그리고 써머리 OX를  같이 풀어보니 기본서 읽을 때 잘 이해되지 않던 내용도 이해할 수 있었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"진도는 진도대로 기본서 복습은 복습대로 나누어서 잘 해낸 것 같다. 특히 이번 주 OX 범위부터는 아직 인강 진도를 나가지 않은 단원들이 있어서 걱정했는데, 그만큼 기본서를 열심히 읽었더니 (물론 OX는 많이 틀렸지만) 개념 전반이 크게 어렵게 느껴지지는 않았던 것 같다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"우선 계획한 만큼은 아니지만 최선을 다해 읽고 있습니다. 그리고 박선우 교재와 함께 읽어보니 어떤 내용이 심화 내용이고 어떤 부분이 핵심 내용인지 구분이 가는 것 같습니다. 핵심 내용 위주로 확실하게 학습할 수 있을 것 같습니다. ." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"- 늦은 줄 알았지만 이번 주까지가 7월이라 생리학 전까지인 2권까지 목표에 맞게 끝낼 것 같다. 강의+복습까지 하면서 목표치를 따라가려니 지루하고 힘들었지만 이 악물고 참아가며 공부했다.  - 지난 피드백을 보고 늦은 진도에 연연하지 않으려고 노력하면서 생물을 좀더 가볍게 공부했다. 다행히 익숙한 내용이라 스무스하게 넘어간 덕이 크다." — 약대가쟝 (26학년도 단국(약) 합격생)`,
  `"MD 인체생리학 파트 풀기를 잘했다. 유전학 부분처럼 아예 복잡한 퍼즐이나 실험은 별로 없었고 과한 그래프 추론 문제는 걸러서 빠르게 풀었음. 모르는 건 바로바로 인강을 들어 박선우가 어떻게 해석하는지 찾아보았다. 진도도 빨라 예상보다 많이 나갔다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"식생분진은 기본서 내용이 매우 방대해서 오히려 중요한 내용을 더 확실하게 파악하려 노력할 수 있었다. 생물에 시간을 너무 치중하지 않도록 시간을 정해서 공부하거나 중간에 유기화학을 풀면서 환기시키니까 집중도가 나아졌다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"1회독을 마친만큼 박선우 선생님의 퀴즐렛을 풀면서 누적 복습을 진행하고 있고 특히 퀴즐렛에서 사고를 요하는 문제들이 많았는데 스스로의 사고과정을 복기하면서 그림과 알고 있던 개념을 매칭시키는 작업을 했다." — Akdow (26학년도 단국(약) 합격생)`,
  `"진도가 남들에 비해 밀린다는 느낌이 들긴 하지만 묵묵히 내 할일을 하였다. 박선우 통합이론 세포분열, 유전학(~ing)을 듣고, 그 파트에 맞춰 캠벨 책을 읽어 주었다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"인체생리학 파트 MD 문제가 대체로 무난했어서 식물학까지 더 나갈 수 있었음. 8월내 남은 MD 파트와 PEET 문제들도 충분히 볼 수 있겠다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"기본서를 읽는 것을 우선시하면서도 계획한 진도만큼 강의를 수강했다. 선기본서 읽기후강의 듣기로 공부가 이루어지니 강의를 이해하는 데에도 도움이 되었다. 지금은 기본을 쌓는 시기인 것을 명확하게 생각하면서 공부하고 있는 것 같다." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"강의를 듣고 필기 잘 정리해뒀음. 계획한대로 워크북을 풀고 기본기ox시험을 쳤고 복습이 잘 된것 같다고 느낌. 작년에 소홀히했던 식생분진 파트를 강의+기본서로 이해하는 공부를 통해 정리되는 느낌을 받음" — 레고링 (26학년도 계명(제약) 합격생)`,
  `"식생분진 파트가 약해서 캠벨을 위주로 학습을 진행하였다. 생화학 파트가 약하다고 생각을 하여 기본서를 먼저 읽었고, 추가 내용 학습을 위해 노용관3.0 강의를 통해 보충하였다. 분자생물학 파트도 다음주 OX문제 범위여서 써머리 문제로 복습을 하고, 기본서를 통해 개념을 다시 확인하였다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
  `"아쉽게도 마지막 식생분진에서는 생물의 과학을 읽지 못했지만.. 그래도 7월 한 달 동안 두 권의 기본서를 거의 다 읽어냈다는 사실이 아주 뿌듯하다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"캠벨 1회독을 마쳤고 계획한 학습 목표를 지켰습니다. 다음주부터는 라이프 교재를 더 많이 학습할 수 있도록 하겠습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"7월 한달간 캠벨 1회독을 완료했다. 완벽히 숙지했다고 보기는 어렵지만, 8월 부터는 라이프도 함께 읽으며 이번 회독을 기반으로 심화 학습을 진행할 계획이다. 특히 이번 주에 공부한 것은 작년에 하지 않았던 식생분진 파트라 다 할 수 있을지 걱정이었는데 확실히 캠벨에 잘 설명 되어 있어서 비교적 수월하게 학습했다. 이에 더해 써머리 OX 풀고, VF OX까지 풀면서 복습을 하니 개념을 이해했는지 점검할 수 있었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"7월안에 목표한 생리학 전 파트까지 다 완강하고 뒷부분 복습만 남아있다. 가장 중요하고 출제도 많이되는 파트라 강의 수 기준 생리학+식생분진 보다 양도 많았는데 다 끝냈다는게 정말 홀가분하고 큰 산을 넘은거 같다. 아직 자세한 부분까지 암기가 안되고 휘발되는데 생리학 공부하면서도 꾸준히 복습 해야겠다." — 약대가쟝 (26학년도 단국(약) 합격생)`,
  `"ox 1회독이 끝난 이후에 자가 점검 테스트 50제를 다시 풀어봤다. 처음 풀 때와는 다르게 각 선지에 대한 근거를 생각할 수 있게 되었고, 기억이 안 나는 부분은 교재 어느 단원을 봐야할지 바로바로 떠오르는 것이 느껴졌다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"너무 깊이 보려고 하지 않았다. 특히 식생분진은 스스로 잘 안돼있는 부분임을 알고 있어서 모르는거 다 파려고 하면 시간이 너무 오래 걸릴게 분명했기 때문에 최대한 훑어보고, 목차를 통해서 무슨 내용이 있는지만 확인했다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`,
  `"이번주는 새로운 교재에 적응하느라 바빠서 별로 잘한 점이 없는 것 같다. 매일 진도를 밀리지 않고 계속 공부하긴 했다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"생물강의를 들은 후 복습을 할때 집중 제대로 안하고 시간만 길어지는것 같아서 계속 능동적으로 생각하면서 복습할려고 노력하였다. 그결과 시간은 줄고 밀도있는 복습을 하게 되었다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"꿀벌책을 중심으로 캠벨책과 함께 OX 범위를 정독했음. 지난 주에는 못했던 퀴즐렛 OX 문제를 병행하니 기본서 읽을 때 집중력이 더 좋았던 것 같음. 추가적으로 중요한 그림은 직접 그려봄. 단순히 그림을 보는 것보다 그림에서 무엇이 중요한지 그리다보니 내용 이해와 암기에 도움이 되었음." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"반복 하면 할수록 생물 개념이 더 정교해지는 느낌이 듦. 그리고 VF ox 문제로 오개념은 없는지, 여전히 놓치고 있는 개념은 없는지 확인이 가능했음. 책 여러 번 복습도 좋지만 문제를 풀며 개념이 새롭게 정립되고 깊어지는 것을 경험하였다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"통합이론을 완강했음! 아는 것만 계속하지 않고 부족한 부분을 채워넣었다. 무작정 시간만 채우지 않고 이해하는 공부를 함." — 레고링 (26학년도 계명(제약) 합격생)`,
  `"8월에 기본기를 확실하게 다져주는 것이 중요하다고 생각하였다. 이에 약한 단원들을 선별하였고, 그 단원들을 중점적으로 학습하기 위해 8월 계획을 다시 한 번 세웠다. 전 범위 학습도 중요하기에 나머지 단원들은 하루에 2시간 정도씩만 투자하여서 OX문제를 통해 복습할 예정이다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
  `"7월의 기본기 문제를 복습하면서 공부했고 그간 미뤄두었던 써머리 OX도 테스트 진도에 맞게 다 풀었다. 시간 분배가 잘된 것 같다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"라이프 교재와 박선우 ox문제 위주로 보면서 기본적인 내용에 보충하는 느낌으로 공부하였습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"이번주부터 라이프 중심으로 공부했다. 캠벨보다 친절히 쓰여 있어서 읽기 수월했고 7월에 쌓은 기본기를 바탕으로 빠르게 읽을 수 있었다. 이전에 이해하기 어렵거나 암기가 잘 안 되던 부분도 무리 없이 학습할 수 있었다. 그러다 보니 계획보다 더 많은 양을 공부할 수 있었다. 공부 순서는 라이프 읽기 -> 캠벨 그림 위주 -> 써머리로 보충 -> 써머리 OX -> 7월 OX 복습 -> 8월 OX 풀이 및 복습으로 진행했다. 이렇게 하니 한 번을 공부해도 여러 번 보는 효과가 나서 좋았다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"심화 OX 진도를 나가면서 기본기 OX 복습을 해주었고, 기본적인 내용들이 어느정도 숙지가 잘 되고 있음을 느꼈다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"꿀벌책을 보기 시작했다. 켐벨보다 이해가 잘 가고 상호 보완적인것 같아서 도움이 많이 되는 것 같다. 박선우 교재에서도 필기를 열심히 해놨던 부분 위주로 최대한 효율적으로 보려고 노력했다" — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`,
  `"저번 주와는 다르게 교재를 읽기 전 꿀벌책의 굵은 글씨 위주로 읽으며 핵심 내용을 먼저 파악한 뒤 교재를 보면서 핵심과 지엽을 구분하려고 노력했다. 금요일부터는 교재에서 핵심적인 부분 위주로 빈 종이에 정리한 뒤 이걸 복습할 때나 정리할 때 자주 봐주니 암기 사항이나 전체적인 내용 구조가 훨씬 머리에 잘 정리되었다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"이번 주도 꿀벌책을 중심으로 OX 문제 범위에 해당하는 부분을 공부했다. 처음 기본서를 읽을 때보다 훨씬 빠르고 수월하게 읽히는 것이 확실히 느껴졌다. 목차, 굵은 글씨, 그림에 집중하며 공부하다 보니 지난주처럼 지나치게 세세한 부분까지 보지 않게 되었고, 공부의 목적과 방향을 인지하는 것이 얼마나 중요한지 다시금 깨달은 한 주였다." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"22학년도까지의 전개년 MD 기출을 다 풀었으며 인강을 통해 풀이 방식을 보충하였음." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"써머리 ox 풀고 통합이론을 복습하며 헷갈리던 내용을 다시 정리함. 월수금 테스트를 치는 진도에 맞춰 계획한 복습을 실천했음" — 레고링 (26학년도 계명(제약) 합격생)`,
  `"지난주에 계획한대로 약점 파트들을 잘 다져나가기 위해 노력하였다. 이번주는 광합성과 DNA테크놀로지 파트는 중점적으로 공부하였으며, 광합성 파트는 MDP문제도 풀며 개념이 어떻게 문제에 적용되는지도 확인할 수 있었다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
  `"통합이론 강의를 들으며 그에 맞춰 캠벨 기본서를 읽어 주었다. 진도가 안맞아 저번에 못풀었던 ox문제들도 이번에 다시 풀어주었다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"기본서(굵은글씨 위주)와 통합이론을 읽고 기본기OX, 써머리OX, 메디컬OX까지 다 풀면서 입체적으로 학습했다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"기본서와 박선우 교재를 읽으면서 명칭들이 익숙하지 않은 중요 단원들(수용체 신호전달, 내분비계, 면역 등)을 따로 1시간 정도 시간을 내서 암기하는 느낌으로 간단하게 보고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"VF OX진도에 맞춰 저번주와 마찬가지로 라이프 -> 캠벨 그림 -> 써머리 -> VF OX 순으로 진행하였다. 7월에 강의를 듣지 않았던 생리학 파트는 박선우 교재를 통해 보충해주었다. 발생, 생식 단원에서 이해 부족을 느껴 이 부분만 강의로 보충하였다. 7월 학습에서 부족한 부분을 찾아내고 이를 보완하는 공부를 하였다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"특별히 잘한 점은 없는 것 같다. 매일 4시간 분량을 채우면서 공부 중이고, 퀴즐렛 ox 매일 50문제씩 풀고 있다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"진도를 밀리지 않고, 너무 딥하게 보려고 하지 않고 중요한 내용 위주로 읽어서 시간을 아꼈다. 어차피 다회독 할거니까, 기말고사용 회독 하듯이 공부하려고 노력했다. 박선우 교재 외에 꿀벌책까지 읽을 시간은 벌 수 있었다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`,
  `"이번에도 꿀벌책을 먼저 읽은 후 교재 내용을 빈 종이에 정리해가면서 공부하고 종이는 o/x 오답을 정리할 때도 활용했다. 주말에는 이 종이랑 캠벨을 병행하면서 복습했고 분자생물학 o/x와 이번 퀴즈 범위의 7월달 o/x를 같이 복습했다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"이번 주 OX 범위를 7월 OX퀴즈를 추가로 정리해서 요약본을 만들었고 암기 상태를 점검했으며 7월 OX를 다시 풀어봤을 때 근거까지 정확하게 대면서 풀 수 있을 정도로 암기 상태가 되어 있다는 것을 확인할 수 있었다." — Akdow (26학년도 단국(약) 합격생)`,
  `"꿀벌책을 중심으로 OX 문제 범위에 해당하는 부분을 공부했다. 그림을 함께 그리면서 정리하니 핵심 내용을 더 잘 이해할 수 있었다." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"1) VF를 풀면서 책 구석구석 차마 못 외운 부분들 (특히 생태, 분류 부분)을 발견할 수 있었다. 중요도가 상대적으로 떨어져 제대로 외우지 않은 부분들이 출제되어 약점을 보완함 2) 23학년도 MD 문제를 풀어 보았는데, 그동안 단원별로만 풀다가 전 단원에 걸친 문제들을 풀어보니 실력 점검에 좋았다. 단순 암기형 문제들도 좋았고 실험 문제들도 건드릴 수 있는 난이도라면 쫄지 않고 일단 건드려보았다. 의외로 작년 필기시험을 보러다닐 때 보았던 문제들이 그대로 나와있었기에, 꼭 26학년도까지 다 풀어보고 정리해야함을 느꼈다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"이번 주도 박선우 통합이론 + OX + 써머리 + VF 메디컬 심화 OX + 캠벨 & 라이프 학습 패턴대로 별 탈 없이 공부했다. 특히 요새는 하루 박선우 통합이론 -> 다음날 써머리 OX -> 다다음날 VF 메디컬 심화 OX + 기본서 학습 과 같이 같은 단원의 내용을 3일 정도에 걸쳐 여러 번 봐주면서 학습하고 있는데 효과가 정말 좋은 것 같다. 한 번에 내용을 암기하고 머릿속에 넣으려고 애를 쓰는 것 보다 자연스럽게 여러번 봐주니 머릿속에 훨씬 잘들어왔다. 시간이 지날수록 나와 잘 맞는 학습법들이 정립되가는 것 같다." — 쿠리만쥰 (26학년도 5관왕 | 단국(약)·계명(제약)·삼육(약)·강원(약)·우석(약) 합격생)`,
  `"∙ 써머리 ox를 풀며 월수금 시험 전 각 단원의 내용을 정리하는 시간을 가짐 ∙ 선생님께서 말씀하신대로 기본서 그림을 손으로 그리며 공부함" — 레고링 (26학년도 계명(제약) 합격생)`,
  `"8월달에 약점파트를 정리하기 위해 계획한대로 잘 진행 중이다. 이번 주에는 인체생리학 단원 중에 특히 약한 파트인 면역학을 다시 한 번 복습해줬고, MDP문제들도 풀면서 다시 한 번 개념을 확인하는 시간을 가졌다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
  `"2권이 끝남. 전공과목 수강을 하지 않은 분자생물학이다보니 생각보다 걱정이 많았는데 무사히 잘 넘긴것같아서 다행이라 생각이 듦. 물론 강의듣고 캠벨책까지 읽어 주었음." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"기본서를 굵은 글씨 위주로 빠르게 훑어보았다. 진도에 맞게 기본기 OX 복습을 꾸준히 했다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"라이프 교재를 계획한 만큼 읽으면서 박선우 교재(써머리 ox퀴즈 포함)도 함께 공부하였습니다. 다음주면 라이프 교재를 1회독 할 수 있을 것 같습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"내용이 많았음에도 VF OX진도에 맞춰 잘 따라 갔다. 라이프를 읽을 때 문장 형태로 읽다보니 지루하게 느껴져서 써머리와 병행해서 추가할 내용 있으면 적어가면서 공부했다. 이렇게 하니 집중력을 유지하면서 공부할 수 있었다. 7월에 못들었던 면역계 강의를 들었고, 순환계, 배설계도 추가로 들으며 보충해주었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"진도는 욕심내지 않고 딱 적당히 나갔지만 다음주엔 식생분진까지 강의가 다 끝날것 같다. 이번주 VF OX 문제도 생각보다 적게 틀려서 단기기억 때문인가 싶었지만 이게 내 실력이 되도록 더 노력해야겠다고 느꼈다." — 약대가쟝 (26학년도 단국(약) 합격생)`,
  `"홍쌤께서 가이드 해주신대로 타이핑을 치면서 암기와 정리를 해봤더니 시간 절약도 되고 암기도 잘 되었다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"저번 피드백 때 너무 꼼꼼하게 하려는 경향이 있다고 하셔서 최대한 효율적이게 보려고 노력했다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`,
  `"빈 종이에 내용을 정리하면서 암기와 정리를 보완하고 있다. o/x 초반 단원에서는 감을 못잡고 공부를 한 느낌이라 기초가 부족하단 느낌이 들어 주말부터 다시 처음 단원부터 복습을 시작했다. 초반에는 통합이론 교재에 적응하는 것이 정말 버거웠는데 결국 1달동안 1회독을 했다는 게 뿌듯했다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"끝까지 볼 암기 노트를 완성시켰고 다음주부터 매일 조금씩 보면서 암기하고 처음 보는 개념이 나올 때마다 추가할 예정이다. 암기한 내용이지만 뭔가 명확하게 생각이 안 나는 개념이 나올때마다 다시 암기노트를 보면서 익숙화시켰다." — Akdow (26학년도 단국(약) 합격생)`,
  `"1) MD 23학년도까지만 계획했으나, 생각보다 잘 풀리고 진도가 잘 나가 25학년도까지 풀었다. 이제 9월인 만큼, PEET 문제들도 건드려보고, VF 문제들, 사설문제들도 들여다보면서 개념을 계속 다지면 되겠다. 2) 이번주 전화통화 스터디는 생화학+광합성 지옥주였다. 2주동안 빠르게 2번 돌리고 있는데, 덕분에 VF 12회차나 MD 생화학 문제들을 수월하게 풀 수 있었다. 빠르게 돌려보며 생화학 파트 부담이 줄고있다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"∙ 써머리 OX를 다 풀었고 해설 강의를 완강함. ∙ 테스트 진도에 맞게 개념 복습을 병행했음" — 레고링 (26학년도 계명(제약) 합격생)`,
  `"8월달부터 계획한 약점 단원들을 하나씩 정리해나가고있다. 복습을 할 때 아웃풋을 하는 것이 중요하다고 생각해서 단원별 주요 주제를 써두고 해당 주제에 해당하는 내용을 타이핑해가면서 복습해줬다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
  `"꿀벌책 1회독을 완료했음. 식생분진 OX 문제를 풀 때 만족스럽게 마무리하지 못한 단원들이 있었지만, 이번에는 목차와 굵은 글씨, 그림을 중심으로 학습해야 한다는 점을 다시 상기하며 공부했음. 기본서 학습 후 퀴즐렛을 활용하여 기본 내용과 심화 내용을 구분할 수 있었고, 심화 내용에 대한 추가 학습도 진행할 수 있었음." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"목표치를 채우지 못해서 아쉽지만 라이프 1회독을 거의 마무리하였습니다. 저번주와 마찬가지로 박선우 교재와 캠벨 학습을 하였습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"이번 주에는 완벽히 정리하려는 부담을 내려놓고 라이프 교재의 굵은 글씨 개념을 중심으로 학습하였다. 전날 공부했던 내용 빠르게 훑기 -> 라이프 & 써머리 병행 학습 -> 박선우 교재 -> 써머리 OX 순으로 누적 복습도 함께 진행하였다. 하루 4~5시간동안 시간 제한을 두고 집중해서 공부하니 오히려 효율성이 높아졌다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"타이핑으로 공부를 전환한 후로 암기가 잘 되고 있다. 한 주 동안 7월 ox 문제들을 복습해서 보았고, 아직 상세한 개념들이 머리에 선명하게 암기가 된 것은 아니지만, 전범위 문제를 풀 수 있을 정도로 기본기가 쌓인 것 같다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"전범위 시험을 위해서 여태까지 모아놨던 오답 파일을 최대한 효율적으로 공부했다. 식생분진을 최대한 가볍게, 두꺼운 글씨 위주로 훑어봤다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`,
  `"앞 단원 파트와 생리학 파트, 중앙대 기출을 풀며 전범위 복습을 진행했다. 전범위 기출문제를 풀면서 특히 약한 단원 위주로 기본서를 다시 봤던 것 같다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
  `"계획했던 양보다 더 많이 정리하고 복습했다. 퀴즐렛 테스트를 매일 풀기 시작했다. 중앙대 기출 중 틀렸거나 헷갈렸던 선지는 밑에 한 줄 정도 요약을 하거나 그림을 그려서 정리하면서 공부했다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"박선우 써머리를 꼼꼼히 복습하며 외우는 것을 기반으로 하여 화요일 금요일 제공되는 VF제공 문제풀이를 진행 후 모르는문제는 캠벨과 박선우 통합이론을 참고한 것. 직전에 켐벨과 써머리로 꼼꼼히 암기했던 부분이 문제화되는 것을 보고 이론 기반 문풀 공부법이 맞다는 생각이 듬." — Hcsg (26학년도 원광(약) 합격생)`,
  `"드디어 이론 강의를 완강했음. 강의 복습과 함께 OX 문제를 풀면서 강의를 통해 배운 내용을 더 효율적으로 공부할 수 있었음. 모의고사가 예정되어 있어서 MD 개념 문제를 풀면서 목표했던 취약 단원 공부도 완료했음." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"올해 MD까지 다 풀었고(해설은 못 구했지만.) PEET도 11학년도 기출부터 건들 수 있었다. 그리고 스터디와 주중 전화복습 스터디도 잊어버린 단원들 복습에 큰 도움이 되고 있다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"∙ 저번주에 강의 완강 후 통합이론과 기본서를 통해 복습하는 시간을 가짐. 목차도 함께 암기하며 미뤘던 내용들을 공부함. 몰랐던 것을 공부해서 알게 되니 성취감이 쌓이고 자신감이 생기는 것이 느껴짐" — 레고링 (26학년도 계명(제약) 합격생)`,
  `"전 범위 문제를 풀면서 약점을 알아갈 수 있었다. 반대되는 개념에 대해서는 항상 민감하게 반응해야겠다고 생각하였다. 오늘 모의고사를 응시하면서도 아는 문제들을 너무 많이 틀려서 바로 다시 한 번 풀어봤는데, 반대되는 개념에서(ex) 산화,환원 / 활성형,불황성형) 항상 실수가 발생하였다. 앞으로는 문제를 풀 때 이 부분에 대해서 정확히 읽고 판단해야겠다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
  `"동물생리학 공부하면서 암기량이 많다고 느꼈다. 암기량이 많은 부분(특히 신경계와 내분비)은 반복적으로 봐 주었다. 그래도 나중에 시간지나면 까먹을듯 싶어 통합이론 서머리를 활용해 볼까 생각이 든다. 남은 시간에는 캠벨책을 읽어 주었다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"분류, 진화 단원 양이 너무 많아서 다 끝내지 못할 뻔 했으나, 생물에 비교적 많은 시간을 투자한 끝에 결국 기본서를 다 읽었다. 마침내 식생분진 포함 첫 1회독이 끝나서 뿌듯하다. 진화 단원에서 하디 바인베르크 평형 문제가 너무 어려워 그 부분만 인강을 찾아 들었더니 이해가 잘 되었다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"라이프 1회독을 마쳤고 문제 풀이 위주로 공부하였습니다. 7월 ox 퀴즈를 복습할때 말씀해주신대로 해당부분 기본서와 통합이론을 다시 읽으면서 하고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"중앙대 문제를 바탕으로 해당 부분 캠벨에서 찾아 복습해 주었다. 특히 헷갈렸던 단원은 7,8월 OX문제도 다시 풀어보며 부족한 부분을 채워나갔다. 추가로 필기어플의 카드 학습을 활용하여 단순 암기인데 안외워지는 것들을 정리해서 반복해서 봐주었다. 영단어 외우듯이 문제-답을 반복해서 봐주니 머릿속에 잘 들어왔다. 그리고 풀었던 문제는 온전히 기억할 수 있도록 매일 생물 학습 전에 그 전에 봤던 문제들을 빠르게 복습하는 시간을 가졌다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"식생분진까지 모두 완강을 끝냈다. 비교적 최근에 들은 4권 내용은 기억이 잘 나는 편이라 다행이다." — 약대가쟝 (26학년도 단국(약) 합격생)`,
  `"한 주 동안 VF OX 문제, 중앙대 재배치, 캠벨 순으로 복습을 해줬다. 7월 ox 문제도 누적으로 복습하면서 전범위에 대한 감을 잃지 않도록 노력했다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"배치고사와 중앙대 기출을 풀면서 느낀 건 내가 알고 있다고 생각했지만 제대로 알고 있지 않은 개념들이 많다는 것이었다. 그래서 기출 기반으로 기본서를 볼 때 용어들을 쓱 넘어가는게 아니라 그게 뭔 개념인지 느끼면서 가려고 노력했다. 전에는 그냥 생물은 너무 양이 많고 외울 것이 많다고만 느꼈는데 캠벨의 그림을 보고 어떤 일이 일어나고 있는지 상상해보았다. 예를 들어 세포에 관한 내용이 나오면 진짜 세포의 모양을 떠올리고 거기서 이런 일이 일어나는구나 이렇게 생각하면서 기본서를 읽으니 더 잘 와닿고 암기도 오래가는 것 같았다." — 단퓨프 (26학년도 목포(약) 합격생)`,
  `"박선우 summary OX를풀며 부족한 지식을 파악하며 이론을 공부하니 더 효율적이었던 것 같다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
  `"가장 못하는 부분들 위주로 보려고 노력했다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`,
  `"한 학교의 기출을 회차별로 연이어 풀다 보니 중대교수님들이 중요하게 생각하는 단원, 포인트, 유형들이 조금씩 보이고 그에 해당하는 이론을 학습하다보니 자연스럽게 맞추는 갯수도 늘어 기분이 좋다. 앞으로는 다른 학교의 기출도 풀것이기에 학교별로 공통점, 차이점을 비교하면서 공통적으로 나오는 이론에 대해서는 더 확고히 이론학습을 해나야겠다." — 푸파 (26학년도 순천(약) 합격생)`,
  `"중앙대 기출에서 헷갈리거나 틀린 문제는 밑에 한줄 요약을 하고 이번주부터 캠벨에서 해당 내용을 아예 새로운 색깔로 표시해두면서 복습했다. 평일동안 매일 퀴즐렛을 풀고 헷갈리거나 틀렸던 문제는 표시해서 주말에 복습했다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"이번 주도 세포생물학 파트와 생리학 파트, 중앙대 기출을 풀며 전범위 복습을 진행했다. 약했던 생리학 발생, 면역 단원부터 전범위를 골고루 공부할 수 있었다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
  `"박선우 써머리 1권 내용을 암송하며 마무리한 것" — Hcsg (26학년도 원광(약) 합격생)`,
  `"1) 목표한 단원 이론 복습을 완료함. 2) 이론 복습을 하면서 7,8월 VF OX 문제와 퀴즐렛을 다시 풀고 오답 원인을 분석함. 단순 실수보다는 세부사항 개념 부족인 경우가 많았음. 이번에 또 틀린 문제들은 따로 정리함." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"VF 과제도 충실히 풀고 피드백 했으며, 피트도 무난한 속도로 풀었다. 다음주가 9월 셋째주인 만큼 지금 하고있는 VF와 PEET 이외에 N제를 조금 더 얹어 문제풀이 시간을 가져보고자 한다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"이번 주도 무탈하게 VF에서 제공하는 문제들을 base로 해서 이론을 꾸준히 복습했다. 중앙대 해당 문제들 이론을 복습하는 것 피트 기출은 이미 한번 다 풀었었어서 MD 기출을 예전 년도부터 지식형 위주로 푸는 중이다. 여러 질 좋은 문제들을 많이 풀어보며 이론을 견고하게 쌓아가야겠다. 그리고 한 번 전범위 이론을 빠르게 훑는게 필요할 것 같아 토요일부터 박선우 써머리를 읽기 시작했다. 다시 전범위 학습을 하니 부족한 부분도 발견할 수 있었고, 여러 번 공부했던 내용들은 장기기억으로 잘 끌고간 게 느껴져서 다음주 평일까지 한번 4권까지 다 훑어야겠다. +VF 핵심 기본기 OX도 해설지를 통해 전 회차를 한번 다시 공부했다. 가끔씩 이렇게 기본기 OX 내용도 다시 보면서 장기기억 잃지 않게끔 해야겠다." — 쿠리만쥰 (26학년도 5관왕 | 단국(약)·계명(제약)·삼육(약)·강원(약)·우석(약) 합격생)`,
  `"∙ 통합이론을 단원별로 복습하며 내용을 익힘. 문제풀이도 병행하며 루틴대로 진행함" — 레고링 (26학년도 계명(제약) 합격생)`,
  `"약점단원들 위주로 복습을 끝냈다. 약점단원들에 대해 MDP문제들을 잘 마무리하였다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
  `"이번주 진도를 밀리지 않고 나갔다. 다음주까지 진도를 빡세게 나가서 동물생리학까지 들어야 겠다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"중앙대 기출, VF OX, 전국 모의고사 등 지금까지 풀었던 문제들을 단원별로 분류하여 오답노트 기반의 단권화를 시작했다. 틀린 문제에 대한 해설과 기본서 등을 참고하여 써머리에 첨가하다보니 자연스럽게 반복 학습이 되어 좋았다. 긴가민가했던 지식을 바로잡고 구멍을 채워나가는 과정이 재미있었다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"저번주와 마찬가지로 박선우 OX, 8월 OX퀴즈 복습하면서 해당 부분 기본서, 박선우 교재 읽는 방식으로 공부하고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"지난 일요일에 있던 오픈 모의고사를 분석해보니 유전학, 분자생물학, 식생분진 파트가 부족함을 알게 되었다. 그래서 이번주에 7,8월 VF OX를 다시 한번 풀어주며 개념 보충을 하였다. 또한 문제별로 질문과 답을 기본서에 돌아가서 표시해주며 교수님들의 출제 포인트를 파악하려고 하였다. 4회 정도 풀어보니 어느 부분에서 자주 출제하는지 약간은 보이기 시작했다. 이 개념들 위주로 보충해나가면 될 것 같다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"인강진도를 끝마치고 복습에 들어갔는데, 머릿속에 지도를 만들고자해서 박선우 써머리의 카테고리 지도에 기억하기 위한 키워드나 연결고리를 필기하며 암기했다. 무작정 회독하고 암기하는 것보다 지도를 이용하니 확실히 머리속에 더 잘남는거 같다." — 약대가쟝 (26학년도 단국(약) 합격생)`,
  `"VF Ox 전범위 복습을 해줬다. 이 과정에서 중앙대 재배치 성적이 올라서 자신감이 붙었다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"이제는 조금 공부방식이 루틴화 되었다. 캠벨로 먼저 찾고 형광펜 치고 머릿속에 어떤 목차 부분인지, 어느 부분인지 잘 모르겠거나 아니면 설명이 필요할 때 노용관 선생님의 2.0교재를 참고하였다. 캠벨 베이스 책이여서 흐름이 비슷해 좋았다. 그런데도 이해 안가는게 있으면 꿀벌책을 참고하려 한다. 그렇게 공부한 후에 o,x를 공부하면 내가 그냥 넘어갔던 내용이나 중요한지 몰랐던 내용도 알게 되어 개념이 확장되는 느낌이 받았다. 매번 기출을 풀 때마다 나오는 파트가 반복된다고 느끼는데 느리지만 조금씩 해상도를 높이고 있는 것 같았다. 또한 공부는 하지만 내용이 정리가 안되는 것 같아 고민이었는데 VF답안지에 내가 공부한 내용이나 ox에서 다뤘던 내용들을 타이핑으로 정리해 놓으니 빠르게 공부한 내용을 훑어볼 수 있어서 좋았다." — 단퓨프 (26학년도 목포(약) 합격생)`,
  `"조급한 마음이 들어 건너뛰고 싶었지만 참고 복습을 한점" — 후회없이살자 (26학년도 강원(약) 합격생)`,
  `"계속 모의고사를 보면서 이런식으로 시험이 나오는구나~ 하는 것을 많이 알아가고 있다. 발생학, 면역, 생식이 어렵고 복잡하다고 생각했는데 학교마다 다르겠지만 이정도 난도로 나오기도 하는구나 라는걸 많이 느끼며 놓친 부분들을 챙기려고 많이 노력하고 있다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`,
  `"기출에서 틀렸던 부분이나 헷갈렸던 부분은 계속 표시하고 적어두며 복습하고 있다. 암기가 잘 안되는 내용(생식계, 식물 호르몬)은 타이핑하면서 정리하고 수시로 보려고 했다. 퀴즐렛은 계속해서 매일 풀려고 했다. 이번주부터 7월 ox도 복습하기 시작했다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"학업과 생물을 병행하는 방법을 찾아낸 것. 비어있는 주말에 집중적으로 이번주 풀케어반 모의고사 60문제(모든 문제)의 해설을 일일이 뜯어보며 자세한 부분은 켐벨을 찾으며 공부한 것." — Hcsg (26학년도 원광(약) 합격생)`,
  `"중앙대 기출을 풀며 문제 범위 위주로 기본서를 그림 위주로 복습하며 전범위를 복습할 수 있었다. 예상치 못한 부분에서 틀려서 몰랐던 오개념도 발견하여 채울 수 있었고, 추가 복습했던 파트는 성취도가 좋았다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
  `"1) 내용 구조화 + 가리면서 설명하는 방법을 통해 이론을 복습함. 2) VF 기출 문제와 MD 문제를 통해 부족한 단원을 파악하고 다시 복습함. 3) 자투리 시간을 활용하여 틈틈히 퀴즐렛으로 VF 기본기 OX 문제를 복습함." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"1) VF 및 피드백까지 잘 마무리함. 2) 심플을 풀며 시험 운용에 대한 감을 슬슬익히기 시작하고 있다. 시간 재고 타임어택으로 푸는데 생물은 그래도 화학에 비하면 괜찮을 듯하다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"∙ 단원별로 통합이론을 읽고 워크북 ox로 확인하는 과정을 빠르게 진행함. 부족한 부분을 발견하고 채우는 과정을 반복했음" — 레고링 (26학년도 계명(제약) 합격생)`,
  `"다시 세포생물학부터 문제를 풀고 있다. 분자생물학 파트가 약하다고 생각을 해서 분자생물학 내용은 다시 한 번 학습을 하였다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
  `"면역학 파트가 생각보다 오래 걸려서 진도가 늘어졌지만 그래도 다음주 초에동물 생리학이 끝날듯 싶다. 아마 10월 초면 진도는 다 나갈듯 하다. 이제 진도에 여유가 생겼으니 강의듣는거에 급급하지 말고 앞에거 복습을 시작해줘야 겠다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"핵심 개념과 오답 위주로 단권화 노트를 만들고 있다. 그냥 공부하는 것보다는 시간이 오래걸리지만 나중에 분명 도움이 될 것 같다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"박선우 교재 회독을 마쳤고 퀴즈, 박선우 서머리 OX 복습하면서 계속 반복학습하고 있습니다. 선생님 조언 덕분에 식생분진에 대한 부담감도 줄어들었습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"VF 중앙대 모의고사에 추가적으로 경희대 21~25학년도 기출 문제를 풀었다. 문제에 나온 개념을 써머리에 표시하고 써머리에 없는 내용은 기본서에서 찾아 보충해서 정리해주었다. 문제 풀이가 쌓여갈수록 빈출 포인트가 더 잘 보여서 모든 개념을 완벽히 하지 못했다는 불안감을 완전히 내려놓을 수 있었다. 문제를 풀면서 개념을 공부해 나간다는 것이 어떤 방식의 공부인지 이제 알 것 같다. 문제를 통해 개념을 확실히 익히고, 문제를 풀면서 개념을 아웃풋해내는 방식을 터득해 가는 과정이라고 생각한다. 경희대 문제를 풀다보니 기본서 내용만으로는 해결되지 않는 문제들이 있었다. 앞으로 MDP 문제들을 풀어주며 보충해 나가야겠다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"재배치 모의고사에 나온 개념들을 단권화해둔 노트와 교재를 활용해서 복습했고, 7,8월 ox와 중대 기출에서 영어 용어를 모아둔 단어장을 만들어서 틈틈히 보고 있다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"1주차, 2주차는 모두 생물에 불안한 마음이 컸었다. 뭔가 공부를 하고 내용이 휘발이 되는 것을 불안해하는 것 같았다. 그래서 내가 덜 불안해하는 방법이 뭐가 있을까 생각을 했다. 여태까지는 패드로 공부를 하고 알게된 내용을 타이핑으로 정리했었다. 그런데 나는 아이패드로 내용을 복습하는 것보다 종이에 원하는 내용을 바로바로 넘겨보며 볼 수 있는 것을 선호한다는 점을 떠올렸다. 대학 공부때도 항상 pdf를 프린트해서 공부했었다. 그래서 이번주부터는 기출을 단면 프린트해서 문제에 대한 해설을 적고, VF해설, 캠벨, 노용관썜책, 꿀벌책을 보며 공부하고 이해한 내용을 옆에 빈 페이지에 정리하였다. 또한 o,x문제도 모두 프린트해 같이 필요한 부분은 필기하며 공부하였다. 그리고 공부 시작 전이나 자기 전에 그것을 보았더니 조금 자신감이 붙었다. 아직 모르는 부분이 더 많겠지만 할 수 있겠다는 생각이 들었다. 원래는 회차 순서대로 빠르게 나가려노력했지만 이도저도 안되고 있다는 생각이 들어 일단 전체 부분 중에 헷갈렸던 부분이나 몰랐던 내용을 답지로 빠르게 확인하고(이땐 캠벨을 찾진 않았습니다), 5회차를 중심으로 1번부터 해당 내용을 차분히 이해하였다(이때부터 캠벨, 노용관쌤책, 꿀벌을 공부했습니다). 그리고 ox를 풀고, 1~4회차 해당 파트 문제를 다시 복습하고 넘어갔다. 그래서 이번주는 세포생물학과 면역계부분의 내용을 깊게 공부하였고, 다음주는 분자생물학부분을 깊게 보려고 한다. 그리고 또 잘한 점은 문제를 풀면서 헷갈리는 부분이나 몰랐던 개념 또는 알았지만 내가 까먹은 내용을 바로 표시한 것이었다." — 단퓨프 (26학년도 목포(약) 합격생)`,
  `"전체 단원들의 내용을 빨리 빨리 돌아보려다 보니 오히려 빈틈이 많아진 것 같다는 생각이 들었습니다. 그러다 보니 애매하게 알고있는 내용들이 생겼고 답은 맞추더라도 정확하게 알고 맞추지 못했습니다. 시험을 계속 치다보니 중요한 기출 포인트나 나의 약점이라 생각하는 챕터들이 생겼고 그래서 그것들부터 하나씩 꼼꼼하게 공부하며 채워가는 중입니다. 이번 미니시험에서 적어도 공부한 단원에서는 애매하게 맞추지 않고 정확하게 알고 맞출 수 있어서 자신감이 조금 생겼습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
  `"깨진독에 물붓는것처럼 계속해서 까먹고 채워넣기를 반복하고 있다. 특히 너무 생소한 식물과 면역 내용은 계속해서 까먹는 중이다. 금요일 모의고사에서도 식물과 면역 내용만을 틀리는 것을 보고 내 약점단원임을 더 잘 알게 되었다. 더 열심히 해서 약점을 보완하고 더 큰 독으로 만들어야겠다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`,
  `"7월 o/x들을 마저 모두 복습하면서 기본기에서 놓친 부분이 있는 지 점검했다. 중앙대 기출을 풀 때 확실히 전에 틀렸던 부분은 틀리지 않는 모습이 보여서 다행이라는 생각이 들었다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"시험 환경에서 잘 적용할 수 있게 문제 풀며 의식적으로 아는 개념을 정확히 떠올리려고 노력했다. 또한, 중앙대 문제를 풀며 그림 위주로 기본서 전범위를 복습할 수 있었다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
  `"한 주 동안 자투리 시간을 이용하며 헷갈리는 부분 암기를 많이했고 OX문제를 풀면서 개념 확인도 계속했다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"1) VF OX 문제와 MD 문제 풀이를 통해 부족한 이론 단원을 파악하고 이를 공부함. 2) 기출 문제에서 틀렸거나 헷갈린 선지를 OX문제로 바꾸어 퀴즐렛 플래시 카드로 복습함. 자투리 시간을 활용하는 좋은 방법인 것 같음." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"∙ 헷갈리던 생리학 파트 내용들을 많이 정리하고 암기함. ∙ 9월 동안 통합이론 1회독 함. ∙ 복습 진도에 맞춰 단원별 피트기출 풀며 계획했던 문제풀이를 실천했다." — 레고링 (26학년도 계명(제약) 합격생)`,
  `"세포호흡 단원까지 mdp문제를 풀었고, 관련된 내용 정리를 하였다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
  `"복습을 하면서 앞에 내용과 연계해서 공부하려 노력했다. 공부하면서 앞내용과 연결되는 부분들은 앞으로 되돌아가 복습해줄려고 노력했고, 단원들이 통합적으로 이해되는 느낌을 받았다. 물론 이렇게하면 시간이 좀 오래 걸리지만 궁극적으로는 이게 맞는것같다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"중앙대 오답노트를 밀리지 않고 잘 마쳤다. 추가로 단권화 노트를 만들면서 자주 헷갈리는 개념들을 약점 노트에 따로 모아두고 있다. 기본서, 이동윤T, 박선우T 등 지금까지 공부한 여러 출처의 지식들이 이제야 비로소 머릿속에서 정돈되고 있는 것 같다. 9월에 시작한 생물 단권화 및 복습은 아직까지 밀리지 않고 계획대로 되고 있어서 (적절한 일정인지는 모르겠으나..) 11월 초에는 1차적인 정리가 끝날 것 같다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"저번주와 마찬가지로 지금까지 풀었던 퀴즈, 기출 복습하면서 박선우 서머리 OX도 함께 공부하였습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"MD 문제를 가장 예전 기출부터 풀려고 한 회차를 풀고 개념 정리를 하였다. 그런데 VF 중앙대 모의고사를 풀다가 매번 헷갈리는 단원에서 틀리는 것 같아 약한 단원을 먼저 풀기로 방식을 바꾸었다. 취약 단원에 대한 문제를 모아서 한꺼번에 풀어주면 그 단원에 대한 이해도가 한층 상승할거라고 생각했다. 이번주는 진화, 분류 파트를 MD 문제로 보충하였다. 사실 분자생물학까지 하려고 했지만 시간 문제상 하지 못했고 다음주에 보충할 에정이다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"2권복습은 다 끝났고 1권에서 자신있는 부분만 남았다. 3,4권도 남긴 했지만 분자생물학처럼 실험, 에세이 방법들 외우는게 적어 흐름위주로 여유있게 공부하려고 한다. 확실히 2권이 가장 헷갈렸는데 복습하고 나니 완벽하게는 아니지만 기억이 새록새록 난다. 이제 그 개념을 문제에 접목시켜 풀이법을 익혀야겠다. 그리고 만들어놓은 지도필기를 틈날때마다 읽어야겠다." — 약대가쟝 (26학년도 단국(약) 합격생)`,
  `"모의고사에서 맞은 문제까지 복기를 꼼꼼하게 했고, MDEET 지식형 문제를 목포량보다 많이 풀었다. Quizlet과 OX에서 봤었던 개념들이 꽤 보여서 이전에 공부했던 내용들과 연결하며 공부할 수 있었다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"약점단원을 공부하고 단권화로 채워나갈 때 처음에는 중요하거나 어려운 포인트를 빈칸으로기입하고 두번째 볼 때채워가면서 익히는 방법으로 더 기억에 오래 남는 암기를 할 수 있었습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
  `"시간이 날때마다 틈틈이 퀴즐렛 이용해서 복습했음" — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`
  ],
  화학:[
  `"화학을 공부하는데 조금 속도를 내며 하는 법을 적용해보고 있다. 전에는 이론을 보고 멈추고 화면 내용을 필기했는데 사실 중요한 것은 이론을 직접 문제에 적용하는 것임을 되새기며 선생님의 문제 풀이까지 보고 선생님의 필기를 교재에 적고, 따라서 문제를 푸니 시간이 단축되었다. 또한 복습할 때도 이론보다는 문제를 풀며 이론을 떠올리니 복습시간이 단축되었다. 항상 ap를 생각하고, 체계적으로 푸는 것을 적용하며 문제를 풀고 있다." — 단퓨프 (26학년도 목포(약) 합격생)`,
  `"드디어 18장 배위화합물 공부를 마쳤다. 쌩으로 외우는 단원이라고 생각해서 정말 하기 싫었는데, 이번 회독에서 생각보다 외울 게 별로 없다는 것을 느꼈다." — 시계탑기린친구 (26학년도 강원(수) 합격생)`,
  `"이번 주에는 2000제에서 지금까지 푼 문제를 모두 복습하는 시간을 가졌다. 헷갈렸던 부분들은 더 집중적으로 풀고 복습하면서 내가 어느 부분에서 실수를 자주 하는지도 파악하려고 노력했다. 기출 올인원도 풀기 시작했다. 문제를 확실히 파악하면서 어떻게 풀지 의식적으로 생각하며 풀려고 노력해야겠다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"밀리지 않고 7일 연속 적중 2000제 문제풀이 및 오답까지 진행한 것. 이대로면 앞으로 50일동안 하루 30문제씩 풀면 2000제는 완전히 끝난다." — Hcsg (26학년도 원광(약) 합격생)`,
  `"기출올인원과 적중, 1500제 복습을 병행하며 단원별 문제풀이를 했고, 만들었던 암기, 실수 노트를 같이 회독하며 복습했다. 또, 전범위 연습 모의고사를 따로 풀며 연습도 적용했다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
  `"1) 화학 공부 시작할 때 코드 1,2 문제를 랜덤으로 25문제 ~30문제씩 복습함." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"이번주는 기출올인원 산/염기 관련 파트 정복주여서 관련 단원들을 전부 풀었다. 실전 문제 모음집이다 보니 확실히 복잡하고 어려워 시간이 오래 걸렸다. 하지만 힘들어도 포기하지 않고 다 풀어내서 뿌듯하다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"기출 문제를 풀며 처음 보는 문제를 풀고 풀이 방법을 익혔음" — 레고링 (26학년도 계명(제약) 합격생)`,
  `"화학 연습용 모의고사를 풀면서 시간이 부족하다는것이 어떤 느낌인줄 알았다. 그래서 왜 전략단원을 만들어 놓으라 했는지 알것같다. 전략단원을 어느정도 미리 만들어 놓긴 했는데, 부족하다는 느낌이 들어 전략단원을 좀더 늘려나가는 공부를 해야겠다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"연습용 모의고사를 풀며 시험장에서의 일반화학 풀이 전략을 세워보았다. APS를 떠올린 후 한 번에 정확히 풀고자 노력했다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"이번주는 2000제 복습에 중점을 두었습니다. 중간중간 까먹었던 부분을 보완할 수 있었습니다. 또한 모의고사를 풀어보면서 시험 감각을 끌어올리는 연습을 하였습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"저번주에 맘대로 문제를 푼 것을 반성하며 올바른 학습법 체크리스트를 통해 점검해주었다. 쉬운 문제를 소홀히 하고, 문제를 보자마자 무작정 뛰어들려고 한게 가장 큰 문제점이었다. 그래서 코드3 진도 나가면서 코드 1,2 문제 전체를 풀어주며 나의 말로 AP을 풀어서 써서 체계적으로 풀려고 하였다. 어려운 문제들은 쉬운 문제들의 조합이라는 것이 눈에 보이며 쉬운 문제들을 더 숙달할 수 있게 반복해서 풀어 주었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"박인규 선생님께서 11월까진 2000제 복습 비중을 더 크게 잡는 것이 좋다고 조언해주셔서 2000제 전문항 복습 -> 올인원 수강 루틴으로 공부했다. 2000제에서 지엽적이라 생각했던 개념들이 올인원의 추가 문제들로 다뤄져서 더 수월하게 암기할 수 있었다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"최대한 목표한 만큼 푸는 것을 위해 노력했습니다. 또한 정답을 맞췄어도 좀 더 효율적인 방법을 강의를 보며 고안하고. 느리게 푼 문제는 왜 느렸는지 고민해서 더 빠르게 푸는 방법을 연구했습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
  `"다음주까지 2000제 3번으로 시작하는 문제를 제대로 푸는 것을 목표로 했는데 어찌저찌 해낼 수 있을 것 같다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`,
  `"1. 코드 3번을 들어가면서부터는 10분씩 끊어가면서 최대한 빠르고 기계적으로 풀어보는 연습을 하기 시작했다. 코드 1,2 때는 해설강의를 많이 들으면서 올바른 풀이방향을 확립하기 위해 노력했다면, 코드 3을 풀 때는 많은 문제를 풀어보며 배운 풀이방법을 체화시키기 위해서 노력하고 있다. 2. 10분씩 풀면서 사고과정이 느리다고 생각하는 부분은 간단하게 기록해두면서 의식하려고 하였다." — 시계탑기린친구 (26학년도 강원(수) 합격생)`,
  `"선생님이 짚어주신 대학들 위주로 문제들을 골라서 풀었고, 연습 테스트를 병행하며 실수 노트를 만들기 시작했다. 여전히 부족하지만 연습 때 푼 2개의 테스트보다 오늘 푼 테스트에서 가장 높은 점수를 받았기 때문에 더 모의고사를 연습하며 연구할 필요성을 느꼈다.(경희대와 중앙대, 연세대 기출도 지금 다 푸는게 좋을까요?)" — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"매일 1시간의 복습을 통해 기출올인원 정리본을 다 복습할 수 있었고 목표로 했던 분량까지의 풀이를 마쳤다.처음보는 개념이 아니고 알고 있는 내용으로 풀 수 있는 문제는 이제 시간이 조금 걸리더라도 모두 풀어낼 수 있을 것 같다는 자신감이 생겼고 모의고사에서도 시간 부족함 없이 잘 풀 수 있었어서 만족스러운 화학 공부였다." — Akdow (26학년도 단국(약) 합격생)`,
  `"밀리지 않고 6일 연속 190문제의 적중 2000제 문제풀이 및 오답까지 진행한 것. 정확히 1360문제가 남은 상황에서 이대로면 앞으로 8주간 1주일 중 5일동안 하루 35문제씩 풀면 2000제는 완전히 끝난다." — Hcsg (26학년도 원광(약) 합격생)`,
  `"단원별로 기출올인원을 풀며 경희 기출(생물 풀며 같이 풀었다)도 추가해서 전범위 연습을 조금 늘렸다. 그래서 이번 주는 휴식으로 인해 평소보다 공부시간이 적었지만 감 잃지 않게 전범위 문제를 풀 수 있었다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
  `"1) 매일 화학 공부를 시작할 때 적중 2000제 코드 1,2를 랜덤으로 20문제~30문제씩 복습하면서 기본기를 다짐. 2) 적중 2000제 후반부를 수강하면서 배운 실전 문제풀이 팁을 이번 모의고사에서 적용하려고 노력함. (상식적인 접근으로 말도 안 되는 선지 지우기, AP 후 선지 간격을 보면서 본격적인 계산에 들어가도 되는지 등)" — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"1) 추석동안 산/염기부터 전기화학까지 다 풀었다. 일부러 제일 힘든 부분을 골라 풀었는데 실전 문제들인지라 양도 많고 난이도도 눈물나게 어려웠다. 그래도 지난주처럼 무조건 끝낸다는 각오로 마무리했고, 산/염기~침전평형 파트는 2000제도 다시 보았다. 2) 하루 3문제씩 기체 문제들을 풀었는데 부담도 안되고 좋았다. 기체 끝나면 이런 방식으로 전기화학 단원 복습을 조금씩 해보자" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"이번 주 일반화학 공부의 전반적인 목표는 문제를 최대한 빠르고 정확하게 푸는 연습을 하는 것이었다. 이틀에 한 번 꼴로 여러 재배치 모의고사들을 집중력이 조금 떨어진 늦은 저녁 시간대 혹은 집중력이 많이 남아있을 점심쯤에 모두 풀어보면서 다양한 컨디션에서도 일관되고 빠르고 정확하게 푸는 연습을 했다. 그 결과 오늘 봤던 일반화학 모의고사에서도 시간이 그렇게 부족하진 않았던 것 같다. @@질문: 이번주 부로 적중 2000제 4회독이 끝났습니다 선생님. 이번 회독을 하면서 느낀 점인데, 기출 올인원으로 어려운 문제도 푸는 동시에, 전범위로 빠르게 기본적인 문제들을 풀어주면서 기본기 감을 잃지 않는 것이 꽤 효과적인 것 같다고 느꼈습니다. 남은 10월에도 하루에 2시간 기출올인원(난이도 있는 문제) & 나머지 2시간 적중2000제(전범위를 단원 순서대로) 로 학습하는 방식을 유지해도 괜찮을까요?" — 쿠리만쥰 (26학년도 5관왕 | 단국(약)·계명(제약)·삼육(약)·강원(약)·우석(약) 합격생)`,
  `"기출 문제를 풀고 해설 강의를 듣는 루틴을 진행함. 2000제 복습도 진행했음." — 레고링 (26학년도 계명(제약) 합격생)`,
  `"틀린 문제 위주로 강의를 수강하여서 시간을 많이 절약하였다. 기본적인 문제들을 복습하기 위해 2000제 문제를 선별 중에 있다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
  `"이번 모의고사를 치면서 계획한대로 풀어봤다. 먼저 생각한 전략단원부터 풀어주고, 그 뒤에 애매한 단원들을 풀어주는 식으로 풀어서 나름 성공적이었다고 생각한다. 다만 틀리면 안되는 문제에서 틀리는게 좀 있어서 아쉬웠다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"연습용 모의고사를 풀며 시험장에서의 일반화학 풀이 전략을 세워보았다. APS를 떠올린 후 한 번에 정확히 풀고자 노력했다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"기출올인원 경희대, 단국대를 풀었습니다. 전범위 푸는 것에 익숙해지려고 노력하고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"쉬운 문제는 바로 풀이 과정이 떠오르도록 기본 문제 푸는 시간을 많이 가졌다. 한단원씩 코드1~3 거의 100문제 정도 한번에 집중 공략하니 풀이의 원리가 보이고 점점 자신감이 쌓여 간다. 타임어택 모의고사를 대비해 연습 모의고사를 풀며 실전에 해야할 행동을 정하려고 하였다. 총 2회를 풀었는데 처음에는 15개 맞았는데 두번째 회차에서는 21개를 맞았다. 이 두 회차의 차이는 ‘보자마자 풀이 과정 안떠오르면 일단 넘어가자, 중간에 막히면 붙잡지 말고 넘어가자’ 라는 행동강령이다. 자신 있는 쉬운 문제들은 빠르게 풀어서 맞추고 조금이라도 헷갈리는 문제들은 어차피 못맞춘다는 마인드로 풀었다. 이렇게 하니 뒷부분에 있는 쉬운 문제도 풀어서 촉박한 시간 안에 전보다 많은 문제를 풀 수 있었다. 이번 타임어택 모의고사에도 이 행동을 그대로 해서 21개를 맞출 수 있었다. 그리고 시험 보기전에 실수 노트를 읽으면서 자주 헷갈리는 부분을 점검하고 시험을 보았다. 이걸 보고 1문제는 더 맞을 수 있던 것 같다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"2000제로 복습하고 기출올인원으로 진도를 나가면서 암기하지 못했던 개념들을 외웠다. 모의고사에서 비전략단원과 복잡한 문제를 과감하게 버리는 연습을 했고, 시간 내에 푼 문제는 실수 없이 모두 맞췄다. 많이 틀리긴 했지만, 고질적인 실수들이 어느정도 잡혔다는 것이 성과였던 것 같다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"제게 강점이 있는 문제들을 더 빠르게 풀 수 있는 방법을 고안해서 완전한 필살기 문제로 만들도록 공부했습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
  `"상담 후 아직 부족할 수 밖에 없다는걸 인정하고 더 열심히 빠르게 할걸 해야겠다고 생각했다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`,
  `"* 10분씩 시간 재고 빠르게 풀고 표시해둔 문제만 빠르게 해설강의를 들으며 보충하였다." — 시계탑기린친구 (26학년도 강원(수) 합격생)`,
  `"기출 올인원을 풀기 전 2000제 기본 문제를 랜덤으로 20개 먼저 풀기 시작했다. 저번주 테스트에서 많이 틀린 단원은 시간을 재고 풀어보거나 그런 식으로 계속 보완해보려 했다. 오늘 원포인트 강의를 듣고 적용해서 연습 테스트를 풀어보고 앱을 깔아서 정리해보기 시작했다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"경성대와 계명대를 제외하고 지원 가능 대학까지의 풀이를 마쳤다. 매일 1시간씩 계속 정리본을 보고 있으며 다음주는 2일정도의 정리본 총 복습 후 수요일정도부터 경성대 계명대 내용을 시작할 예정이다." — Akdow (26학년도 단국(약) 합격생)`,
  `"암기, 실수 노트 보는 시간을 따로 정해서 보고, 문제를 풀 때 해당되는 것들은 바로바로 적용하려고 노력했다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
  `"1) 매일 30분씩 적중 2000제 코드 1,2 랜덤복습을 계속 진행 중임." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"기출올인원 기체 파트를 완결내었고, 이미 풀었던 ch.14~17 부분을 화학 공부 시작 2시간동안 반드시 복습하는 데에 사용하였다. 1회차 풀때에는 엄청 틀리고 갈피도 못 잡았는데, 틀린 문제들을 다시 풀어보니 어느정도 감도 생기고 AP가 세워진다. 일부러 양 많고 어려운 단원을 먼저 풀어냈더니 확실히 가면 갈수록 수월해지고 속도가 붙는다. 2주만에 제일 어려운 단원을 모두 풀고 복습까지 해내는 나를 셀프칭찬해주자" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"∙ 기출 문제를 풀고 강의 수강 후 부족한 파트는 2000제를 더 풀어주며 보충하는 공부를 함." — 레고링 (26학년도 계명(제약) 합격생)`,
  `"기출올인원을 교재 기준으로 풀고 있었는데, 전범위 내용을 푸는 것이 중요하다고 생각해서 충남, 단국, 동국 25학년도 복기문제 + 변형문제를 모두 풀었다. 이 과정에서 명명법을 총정리하였고, 시간이 날 때마다 명명법을 암기해줬다. 시간관리를 연습하기 위해 MD문제에서 일반화학 20문제를 40분으로 설정하고, 22~26학년도 문제를 풀었다. MD문제 특성상 계산이 많은 문제들도 있었는데, 이러한 문제들을 시험장에서 만났을 때를 대비하여서 시간 관리 연습을 하였다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
  `"화학에서 약점이라고 생각들던 전기화학이랑 이상기체, 그리고 미뤄놨던 1단원까지 모두 공부를 했다. 예전에는 모의고사에서 전기화학만 보면 쫄곤 했는데 이제는 자신감이 생겼다. 미뤄놨던 지엽정리도 시작했다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"분광학, 점군을 마지막으로 2000제 코드1,2,3까지 한 바퀴를 마쳤다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"중앙대, 원광대 기출을 풀었습니다. 지금까지는 2사이클 루틴으로 풀었고 원광대 기출은 민동준 선생님의 팁에 있던 3바퀴 시스템을 적용해보았습니다. 지금은 적어도 마지막 문제를 보지도 못하고 시간을 다 쓰는 경우는 없어졌습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"2000제 코드1~3까지 모두 수강하였고, 저번주와 마찬가지로 복습해주었다. 전에 대충 강의만 듣고 넘어갔던 이상기체 열화학을 다시 1500제와 2000제 강의를 듣고 보완해주었다. 그 당시에는 이해가 어려웠던 부분이었지만, 지금은 전범위를 어느 정도 이해한 상태라 훨씬 명확하게 받아들일 수 있었다. 2000제를 수강하면서 단원별로 헷갈리는 개념과 자주 실수하는 부분을 굿노트에 모아서 정리했었다. 그런데 잘 안들여다 보게 되고, 체계적으로 정리가 안되어 고민이었는데 실전 대비 노하우 특강을 통해 해결책을 찾았다. 딱 내가 하고 싶었던 정리 방법을 알려주셔서 바로 따라 만들었다. 다음 주부터 기출 올인원을 들으면서 약점 노트를 차곡차고 채워나가고 자투리 시간을 활용해서 반복 복슬할 계획이다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"10월 안에 2000제를 끝내겠다는 다짐을 하고 매일 꾸준히 강의를 들어 계획보다 많이 들었다. 산염기와 침전평형, 전기화학을 들으며 감탄을 금치 못했다. 이런 유연한 방식으로 문제를 접근했어야 했는데 이제서야 접한게 후회스럽다. 이제 배위화합물 ~ 분광학만 남아서 기출올인원도 최대한 많이 해야겠다." — 약대가쟝 (26학년도 단국(약) 합격생)`,
  `"2000제와 기출올인원을 병행하면서 틀리거나 헷갈린 문제는 그 이유를 문제 위에 분석하여 적어두었다. 1회독을 할 때는 문제를 잘못 읽거나 조건을 놓쳐서 틀리는 코드가 많았는데, 다회독을 하면서 현저히 줄어든 것이 보인다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"이번주는 저번주보다 속도감있게 진행했다. 혜지언니의 조언대로 진행한게 큰 도움이 되었다. 완강까지 몇 강이 안 남았다. 시간이 많이 지체된 것은 아쉽지만 그래도 열심히 노력한 걸 알기에 칭찬한다." — 단퓨프 (26학년도 목포(약) 합격생)`,
  `"문제를 풀면서 실수하게 되는 부분들을 다시 틀리지 않도록 실수 유형과 그 원인에 따라 정리해서 실수 노트를 만들었습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
  `"화학 2000제를 마지막 한 강 을 남기고 거의 끝을 냈다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`,
  `"1500제를 끝냈다. 처음에 공부 방식을 헤맸던게 아쉬움이 남지만, 그래도 칭찬한다. 이번주는 속도감있게 진도를 나갔다. 전기화학과 배위화학을 어려운 단원이라 생각했었는데 이번에 공부할 때는 잘 따라간 것 같아 좋다." — 단퓨프 (26학년도 목포(약) 합격생)`,
  `"* 일요일에 본 모의고사 5문제 정도 오답할 게 남았지만 이정도면 계획을 대부분 달성하여 만족스럽다. * 원노트를 이용하여 약점노트를 만들기 시작하였다. 기존에 헷갈리던 내용을 써둔 노트가 있어 원노트의 경우에는 이미지, 문제 위주로 헷갈리는 개념을 메모해둘 생각이다." — 시계탑기린친구 (26학년도 강원(수) 합격생)`,
  `"전기화학 단원이 약점이라 생각해서 이번주 테스트 전에 16단원보다 먼저 풀었다. 이번주 내내 약점노트를 원노트에 계속 정리했다. 올인원의 문제당 시간을 재며 풀었고, 틀리거나 시간이 오래 걸린 문제는 해설강의를 듣고 더 쉬운 풀이 방법을 간단한 퀴즈 형식으로 쓰고 옆에 답이나 해설을 붙여두어 이동시간에도 간편하게 볼 수 있게 만들었다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"원래 이번주에 게획했던 경성대, 계명대를 나중에 하기로하고 기출올인원을 앞에서부터 모두 풀고 마지막에 경성대, 계명대를 보는것으로 계획을 수정했다. 충분히 시간이 남을 것 같아서 이런 결정을 했고 4시간 중 2시간 30분은 기출올인원 앞에서부터 정리하면서 풀기, 1시간은 2000제 앞에서부터 풀기, 30분은 전날 정리했던 것 복습으로 시간을 분배해서 학습중이다. 기출올이원을 앞에서부터 풀때 기존에 지원 대학 모의고사를 풀면서 풀려져있는 문제들은 문제를 보고 어떻게 풀어야 되겠다라는 방향성을 생각해보고 밑에 적어둔 풀이와 일치하면 그 이후의 계산과정을 훑듯이 보면서 넘어가고 있다." — Akdow (26학년도 단국(약) 합격생)`,
  `"처음 접하거나 하나도 모르겠는 문제는 없는 점. 실전 화학 모의고사에서 시간만 충분하다면(시간 단축만 잘 된다면) 지금 맞는 16~17개에서 기본적으로 5~6문제는 더 맞출수 있겠다는 자신감이 든 것." — Hcsg (26학년도 원광(약) 합격생)`,
  `"그동안 실수 노트와 약점 노트를 섞어서 작성해왔던 것 같아서, 특강을 듣고 실수와 약점을 분리해서 정리했다. 그러면서 자연스럽게 문제를 풀고 실수인지, 몰랐다면 어떤 부분이 아직 부족한지 더 의식하며 일반화학 공부를 진행할 수 있었다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
  `"1) 적중 2000제 완강함. 2) 피드백을 받고 랜덤 복습 범위를 코드 3로 넓힘. 3) 모의고사를 통해 3 사이클 연습 + 약점 노트를 작성함. 이후 각 학교별 전략 노트도 작성하면 좋을 것 같음." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"지난주 계획 세울 때 기출올인원을 일주일동안 다 풀 수 있을까 싶었지만, 반드시 끝낸다는 각오로 포기하지 않고 다 풀어냈다. 그리고 멘토님 코칭이 정말 도움되었다. 항상 전단원 시험을 볼 때마다 단원별 세부 내용들을 까먹어 불안했는데, 지금이라도 내가 틀린 문제, 스킬들, 자잘한 암기사항 등을 적어 틈나는 대로 전단원 복습하니, 무엇을 기억하고 주의해야 할지 체화되기 시작한다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"∙ 기출 문제를 풀고 부족하다고 생각하는 부분은 2000제 복습을 해주었음. 약점 노트 만들기를 시작해 매일 정리해주고 있음." — 레고링 (26학년도 계명(제약) 합격생)`,
  `"기출올인원 문제들을 통해 기본기가 흔들리지 않게 꾸준하게 복습하였다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
  `"기출문제를 풀면서 전범위를 골고루 풀어주다 보니 감을 잃지 않고 실력이 많이 오른듯한 느낌이 든다. 오늘 모의고사를 풀면서는 계획한 대로 시험이 시작했을때 나중에 풀 문제를 먼저 골라놓고 나머지 문제들을 20분안에 풀려고 해봤다. 근데 생각처럼 안된것 같긴 하다.." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"타임어택 모의고사에서 계획한 전략들을 실행해봤는데, 처음으로 모든 문제를 한 번씩 풀어볼만한 시간을 확보할 수 있었다. '배위화합물' 단원을 첫번째 전략 단원으로 설정했다. 비록 이번 모의고사에서는 해당 단원 문제가 아주 적어 의미가 없었지만 전략 단원의 수를 빠르게 늘릴 필요성을 느낄 수 있었다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"매일 한 회차씩 시간 재면서 기출 풀고 있고 전략을 적용시키려고 노력하고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"약점노트를 적극적으로 활용하며 문제 풀이 효율을 높였다. 기출올인원 커리를 시작해 중앙대25, 24학년도와 경희대25학년도 기출을 풀었다. 틀린 문제와 풀이 시간이 오래 걸렸던 문제는 약점노트에 문제와 해설과 함께 오답 포인트를 한 줄로 정리해두었다. 또한 2000제 숙련도가 아직 부족한 것 같아 화학 평형 관련 단원 먼저 헷갈렸던 문제를 선별해 약점 노트에 정리하는 것도 병행했다. 원노트의 접근성이 좋아서 이동 시간이나 짧은 휴식 시간에 틈틈이 복습할 수 있었다. 약점 노트를 잘 활용한 덕분인지 이번 모의고사에서 저번보다 2문제 더 맞춰서 선생님께서 가이드해주신 정답수보다 하나 더 맞을 수 있었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"원포인트 강의를 듣고 그동안 문제 위에 적어뒀던 실수코드들을 모아서 한 장으로 정리했다. 매일 이 노트를 읽고 화학공부를 시작하니 자잘한 실수들이 잡힌 게 느껴졌다. 또 이번 모의고사에서 시간이 많이 부족했는데, 3싸이클을 돌리면서 쉬운 문제부터 풀어나가니 맞출 수 있는 문제들은 다 맞췄던 것 같다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"각 챕터별로 가장 기본이되고 중요하다고 생각하는 문제와 시험 직전 풀어볼 활성화 문제들을 선별하고 정리했고 시험 전날 풀어보았습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
  `"2000제를 끝내고 충남대 강의를 들었다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`,
  `"2000제를 시작했는데 이번주 화학 공부는 마음에 들었다. 1500제에서 아쉬웠던 속도 부분을 보완했다. 그래서 코드1,2 파트를 속도감 있게 나가봤다. 문제를 풀며 헷갈렸던 부분이나 어려웠던 것은 별표를 치고 다음날 다시 한 번 풀며 공부를 시작했다. 아직 기본적인 문제들이지만, 그래도 다시 내용을 돌리니 푸는데 더 수월해지고, 해당 내용의 강의를 보기 전이나 보고 난 후에 다시 1500제의 목차를 보고 내용을 훓으니 뭔가 엄청 내용이 많게 느껴졌던 것이 압축되어 정리된다는 느낌을 받았다. 다시 한 번 회독의 중요성을 깨달은 순간이었다. 그리고 모의고사를 풀 때, 연습한대로 풀기, 3사이클로 풀기를 적용해봤는데 세사이클이 아닌 두사이클이 되었지만, 저번 시험들보다 더 나아진 모습을 볼 수 있었다. 시험 전에 적용할 점들을 생각하고 매주마다 시도해보자." — 단퓨프 (26학년도 목포(약) 합격생)`,
  `"* 이번주 모의고사 시작 전 목표를 세우고 시험 후에 피드백하였다. 얻어가는 것이 많은 유익한 모의고사였다. * 아직 한참 멀었지만 그래도 나름 화학 점수가 계속 오르고 있어서 뿌듯하다. * 전기화학이랑 열화학에서 안 외워지는 공식이 있어서 매일매일 화학 공부하기 전 15~20분 정도 공식을 직관적으로 외웠는지 암기하기 위해 손으로 써보는 것을 반복하여 암기하였다. 다음주에도 몇가지 안외워지는 공식을 골라내어 매일매일 조금씩 반복해야겠다." — 시계탑기린친구 (26학년도 강원(수) 합격생)`,
  `"이번주에 기출 올인원을 22단원과 경성, 계명을 제외하고 모두 풀었다. 약점노트를 계속 채우면서 이동시간에 계속 보는걸 습관들이려고 노력했다. 다음주부터는 2000제 코드 4,5와 경성과 계명을 풀면서 복습해야겠다.(22단원의 약대 전공학도 지금부터 공부하는게 좋을까요?)" — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"기존에 목표로 했던 13단원보다 더 나아가서 14단원까지 앞부분부터 채워나갔다. 매일 2시간 반 기출올인원 풀이, 1시간 2000제 풀이, 30분 기출올인원 정리본 복습을 통해 잊어버리지 않게 학습하고 있다." — Akdow (26학년도 단국(약) 합격생)`,
  `"일단 하루 평균 40문제씩 하는 것을 어느 정도는 완료한 점" — Hcsg (26학년도 원광(약) 합격생)`,
  `"전범위 문풀을 매일 진행했다. 덕분에 실전 연습을 충분히 할 수 있었고, 모의고사에서도 연습대로 풀 수 있었다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
  `"1) 피드백 받고 매일 하루 마무리할 때 점군과 분광학 부분을 15분동안 문제로 복습함. 이 또한 부담감이 덜해져서 계획을 잘 지킬 수 있었음. 2) 매일 50~60문제정도 코드 1~3까지의 문제를 랜덤으로 복습함. 3) 3사이클을 적용하여 문제를 풂. 계산이 좀 필요한 문제를 체크하고 2사이클~3사이클에서 풀이가 막힌 문제를 잘 풀어냄." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"기출올인원을 끝냈다. 그리고 지엽적인 19~21단원 개념까지 잘 정리해 외우려 노력하였다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"∙ 다시 기본기를 끌어올리기 위해 2000제를 풀며 부족한 부분을 찾아내어 정리함. ∙ 기출을 풀며 새로운 문제를 계속 접하면서 처음 보는 문제에 대한 두려움이 적어졌음." — 레고링 (26학년도 계명(제약) 합격생)`,
  `"모의고사를 대비하여서 정리해둔 지엽적인 내용들을 꾸준히 봤다. 기본기가 중요하기 때문에 기본적인 문제들도 꾸준하게 풀었다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
  `"모의고사를 풀기전에 전략을 세웠다. "페이지를 넘기며 나중에 풀 문제를 선별하고, 그렇게 유기화학페이지에 도달하면 유기먼저 끝낸 후, 나머지 문제를 20분안에 풀기." 괜찮게 된거같고, 생화유다 풀고나니 25분정도 남긴 했다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"중앙(2024), 경희(2024) 기출을 풀고 어려웠던 문제들은 약점 노트에 정리했다. 산염기 단원이 조금 헷갈려 2000제도 추가로 풀었지만 많이 풀지는 못했다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"지난주와 마찬가지로 시간재며 전략 적용해보고 있습니다. 기본적으로는 2사이클이 좀 더 맞는것 같고 시간이 남으면 3사이클로 풀고 있습니다. 열역학, 기체는 웬만하면 마지막에 푸는것이 효율이 좋은 것 같습니다. 또한 풀이법도 강의 내용대로 풀었는지 비교하고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"2000제에서 잘 풀리지 않았던 문제를 선별해 약점 노트에 정리해주었다. 이를 통해 취약한 부분의 문제들을 모아서 보니 헷갈리는 부분을 확실히 커버할 수 있었다. 조금 복잡한 추론 문제에 대해 두려움이 있었는데 이렇게 기본 문제들을 탄탄하게 해주니 추론 문제도 풀 수 있는 사고력이 생긴 것 같다. 25학년도 동국대 문제를 풀었을 때 다소 쉬운 난이도이긴 했지만, 앞부분에서 1문제 틀리고 뒷부분 추론은 다 맞아서 어느정도 실력이 성장하고 있음을 느꼈다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"시험보기 전날 강의를 듣기보단 전단원 1500제+2000제 필기내용위주로 복습을 했다. 헷갈린문제, 틀린문제 옆에 써놓은 개념정리를 보고 다시 감각이 살아나서 오늘 본 시험에서 30문항 중 1개 틀렸다. 본 시험 전에도 이런 시간을 보내면 좋을거 같다." — 약대가쟝 (26학년도 단국(약) 합격생)`,
  `"열화학 단원이 가장 어려웠는데, 기출올인원과 2000제를 연달아 풀면서 극복이 된 것 같다. 목표치 공부량을 채우지 못한 것은 아쉽지만, 약점단원에 대한 보강을 확실히 해낸 것 같다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"항상 시간이 오래 걸리는 유형의 문제들을 종류별로 많이 풀어보며 시간을 단축시켰고 그 와중에서도 시험칠 때 풀 순서를 정해뒀고 시험에서 적용해봤습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
  `"기출과 더불어 매일 하루 한시간반씩 2000제 전범위를 단원당 10~15문제씩 풀고있다. 한 단원씩 공부하면 계속 지난 단원을 까먹는것 같아서 실행해봤는데 꽤 기억에 잘 남는 것 같다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`,
  `"전범위 문풀을 주로 하면서 노트를 의식적으로 보는 시간을 가지고, 실수나 약점 노트에서 봤던 것들을 전범위 문풀 시 매번 적용하려고 연습했다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
  `"강의를 1.3배속 정도로 들으니 그냥 흘러가는 느낌이 줄어들고 집중해서 강의를 들을 수 있었다. 상전이와 총괄성 파트는 1500제에서 어려워했던 파트였는데 기본 문제를 계속 풀다보니 두려워했던 마음이 사라졌다. 모의고사를 보면 아직 응용 문제는 풀지 못하지만, 2000제 진도를 나간 기본 문제들은 맞출 수 있었다. 전에 모의고사를 보면 눈앞이 깜깜했는데 그래도 이제는 풀어볼 문제를 구분하고 도전해 풀 수 있다는 점이 발전한 부분 같다." — 단퓨프 (26학년도 목포(약) 합격생)`,
  `"항상 고민이었던 열화학 파트를 약점 보완해주었다. 공식 암기도 꾸준히 해주었다." — 시계탑기린친구 (26학년도 강원(수) 합격생)`,
  `"기출 올인원의 계명, 경성 문제들도 모두 풀면서 처음부터 18단원까지 다시 복습했다. 틀렸거나 푸는 데 오래 걸린 문제들, 중요하다고 표시된 문제들도 다시 풀면서 전체적으로 한바퀴를 복습했다. 동시에 해당 단원 약점노트도 복습했다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"목표로 했던 기출올인원 분광학까지의 문제풀이를 마쳤다. 다음주부터는 경성대, 계명대 전공화학 부분을 학습할 예정이며 2000제는 11월달안에 1회독을 한번 더 한다는 느낌으로 하루에 1시간씩 풀어볼 예정이다." — Akdow (26학년도 단국(약) 합격생)`,
  `"홍쌤의 조언대로 평일 월,화,수 하루 30여 문제씩 풀고 오답까지 했고[실험 때문에 정신없는 목요일과 금요일 제외] 나머지 110문제를 어제와 오늘 사이에 나눠서 다 풀었다. 평일에 조금씩 나눠서 하고 주말에 몰아서 하는 것이 확실히 평일 시간을 절약하여 압박을 덜 받아서 훨씬 나은 것 같다." — Hcsg (26학년도 원광(약) 합격생)`,
  `"1) 적중 2000제 복습: 코드1~3 중심으로 매일 40~70문제를 풀이했다. 점점 기계적인 풀이를 하는 느낌이 든다. 2) 기출올인원 학습: 2025 주력학교 기출을 공부했다. 기출로 전범위를 보고 싶어서 추가적으로 단원별 10문제씩 더 풀이했다. 10문제는 좀 많은 것 같아 주력 학교 3 + 단원별 5문제로 계획을 수정해야겠다." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"모의고사 연습과 2000제 문제를 균형있게 학습한 한 주였다. 25학년도 기출올인원 문제들을 풀 시간과 능력이 안되어 '많이 못 풀어도 괜찮을까' 약간의 걱정이 있었는데, 시험을 보니 전년도까지의 문제들만이라도 충분히 풀 실력이 되면 최근 기출문제도 무리없이 풀어낼 수 있음을 깨달았다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"∙ 기출을 풀고 강의를 들으며 부족한 부분을 채웠음. 2000제를 단원별로 다시 풀며 약점을 발견하면 강의를 통해 빠르게 보완했음." — 레고링 (26학년도 계명(제약) 합격생)`,
  `"기본기 문제를 아침에 일어나자마자 풀어줬고, 이제 기계적으로 문제가 풀린다. 또한 지엽적인 내용들도 꾸준하게 보고 있다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
  `"이번주는 화학공부를 적당히 했다. 확실히 꾸준히 문제를 풀면서 감을 잃지 않는것이 중요하다고 느꼇다. 이상기체 열역학 문제를 많이 풀어주면서 문제풀이가 자연스럽게 된것도 괜찮은것같다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"연세(2024), 고려(2024), 중앙(2025) 기출을 풀고 어려웠던 문제들은 약점 노트에 정리했다. 전기화학이 조금 어려워서 2000제와 1500제 문제로 보충했다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"화학 공부 시작할때 2000제 빠르게 훓어보는 식으로 복습하고 있습니다. 그리고 회차별로 시간 재면서 풀면서 전략 연습하고 있습니다. 단원별로 정리된 올인원 책으로 부족하다고 느끼는 단원 쭉 풀면서 보완하고 있습니다. 이번주는 유효숫자, 기체, 반응속도 단원 풀었습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"그동안 약점 노트에 정리한 문제들을 전체를 풀어주며 기본기도 놓지지 않으려 복습해주었다. 처음엔 헷갈리거나 틀렸던 문제들이 이번에는 훨씬 수월하게 풀리면서 실력이 실력이 많이 성장하고 있음을 느꼈다. 이번주의 성장 포인트는 전에 혼동했던 개념들을 이제는 더이상 헷갈리지 않게 되었다는 것이다. 전보다 화학 문제를 풀 때 자신감이 많이 생겼다. 모의고사 대비를 위해 타임어택 연습으로 한 달 전 풀었던 연습 모의고사를 다시 풀어본 결과, 당시에는 30문제 중 12문제를 맞았지만 이번에는 28문제를 맞추었다. 역대 모의고사 푼 것 중에 가장 높은 점수였다. 내가 공부하고 있는 방식이 잘 하고 있다는 것을 검증받은 것 같아 너무 좋았다. 그리고 이번 전과목 모의고사에서도 화학에서 2문제만 틀려 저번주보다 3문제 더 맞았다. 앞으로도 이 흐름이 이어질 수 있도록 루틴 무너지지 않게 유지해야 겠다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"모르거나 잘 안 풀리는 문제를 바로바로 넘기는 게 어느정도 몸에 익어서 시간내로 모든 문제를 다 볼 수 있었다. 2000제 회독을 계속 하다보니 AP가 몸에 잘 벤 것 같다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"화학에서도 마찬가지로 지엽적인 상식이 부족했던 것 같아서 원광대 기출 문제를 풀고 추가로 기본 감 유지를 위해서 중앙대 화학 시험 2회차를 풀었습니다 또한 2000제에서 어려웠거나 틀렸던 문제를 다시 풀어봤습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
  `"기출 문제풀이와 2000제를 열심히 했다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`,
  `"전범위 문풀을 주로 하고 자주 틀리는 단원별 문제 풀이까지 감을 잃지 않도록 꾸준히 문제를 풀었다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
  `"이전에 풀었던 모의고사를 이용해서 다른 단원 감을 유지하였고, 기체파트랑 상전이 파트를 집중적으로 파면서 어디가 꼬여서 문제를 못 풀고 있는지 생각하면서 공부하였다." — 시계탑기린친구 (26학년도 강원(수) 합격생)`,
  `"이번주부터 22단원 전공화학을 공부하기 시작했다. 처음 듣는 내용이 많아서 먼저 강의를 들으며 필기하고 다음날 문제를 풀어보며 내용을 복습했다. 문제 푸는 감이 떨어질까봐 2000제 코드 4,5도 병행해서 풀었다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"목표로 했던 기출올인원 정리본 복습을 마쳤으나 생각보다 시간이 더 소요되어 24 경성대 계명대는 많이 하지 못했다. 이는 다음주에 끝낼 예정이며 매일 30분씩은 전날 새로운 개념을 암기하고 복습하며 진도를 나가고 있다. 또, 매일 1시간씩의 2000제 풀이로 앞의 내용을 잊어버리지 않게 하고 있으며 이는 다음주에 회독이 끝날 예정이다." — Akdow (26학년도 단국(약) 합격생)`,
  `"홍쌤의 조언대로 평일 월,화 하루 30여 문제씩 풀고 오답까지 했고[유기화학2 퀴즈와 실험 때문에 정신없었던 수~금요일 제외] 나머지 140문제를 어제와 오늘 사이에 나눠서 다 풀었다. 평일에 조금씩 나눠서 하고 주말에 몰아서 하는 것이 확실히 평일 시간을 절약하여 압박을 덜 받아서 훨씬 나은 것 같다. 덕분에 오늘 모의고사 풀 때도 화학부분만큼은 큰 부담없이 도전하며 풀 수 있었다." — Hcsg (26학년도 원광(약) 합격생)`,
  `"1)적중 2000제 코드1~3에 해당하는 문제를 매일 30문제씩 랜덤으로 풀이함. 2) 2025 주력학교 기출 3곳을 공부함. 이론이 부족한 곳은 써머리 + 핵심 1500제로 다시 돌아가 복습함." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"감이 떨어졌던 주기적 성질과 반응속도 부분을 보충하였다. 모의고사 연습도 주기적으로 해주었다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"∙ 기출과 2000제 문제 풀이를 병행함. 부족하다고 생각되는 단원의 2000제 문제를 다시 풀며 보완해줌." — 레고링 (26학년도 계명(제약) 합격생)`,
  `"분석화학 공부를 제대로 해보는 것이 처음이라 학습에 어려움을 겪었지만, 일단 암기를 먼저 하고 학습을 진행하다보니 나름 잘 정리를 하였다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
  `"매일 2~3시간씩은 꾸준히 공부했지만 양이 많고 내용도 어려워서 복습 진도가 밀렸다. 결국 카보닐 알파 치환~ 부터는 제대로 보지 못한 채 주간 테스트를 치렀다. 이번주에 끝까지 복습을 마치고 다시 전범위를 빠르게 회독할 수 있도록 연습해야겠다. 이번 주 전범위 모의고사에서 유기1 파트는 다 맞추자는 결심으로 유기부터 풀었는데 거의 다 틀렸다. 조금 아쉽지만 테스트에 나온 내용만큼은 확실히 복습해서 다시 틀리지 않도록 노력해야겠다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"2000제 복습하면서 올인원 진도 나가고 있습니다. 그리고 실수 노트 작성하면서 실수 줄이려 노력하고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"지난주 모의고사에서 틀렸던 기체 파트를 2000제를 활용해 다시 복습했고, 상식 관련 문제들도 따로 모아 정리했다. 공식 암기가 주가 되는 이상기체 열역학 단원을 계속 미루고 있었지만, 이번 주에 2000제 문제를 모두 풀며 전체적으로 점검했다. 시간이 부족했지만 기출올인원 단원별 문제에서 기본 문제도 함께 풀어주며 개념을 다졌다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"기본기 문제들은 이제 잘 맞춘다. 확실히 2000제를 꼼꼼히 푸니까 어떤걸 묻는지 눈에 보이고 인규샘방식으로 APS가 자동으로 짜진다. 단, 현재 공부방식은 기출올인원 진도보다 2000제 복습 중이라 진도가 잘 안나가긴 한다." — 약대가쟝 (26학년도 단국(약) 합격생)`,
  `"기출올인원 교재가 어느정도 마무리가 되어서 다음주부터 전공 공부를 시작하게 되었다. 단원별로 진도를 나가면서 7월부터 본 타임어택 시험지를 계속 풀어보면서 전범위 감을 유지했다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"화학 진도목표를 달성한게 정말 오랜만인 것 같다. 많이 느리지만, 그래도 한 주간 하루에 4시간이라는 주어진 시간동안 정말 열심히 공부했다. 아직 STEP 1,2여서 기본기 문제를 풀고 있지만, 기본기가 제일 중요하다는 마음으로 집중해서 강의를 듣고 열심히 문제를 풀었다. 확실히 1500제에서 문제를 풀고, 다시 반복하기도 하고, 기본 스타일의 문제가 계속 나오니 점점 자동화되는 것이 어떤 느낌인지 조금 느낄 수 있었다." — 단퓨프 (26학년도 목포(약) 합격생)`,
  `"기본적인 계산의 감을 유지하기 위해서 매일 2000제 50문제씩을 풀고 지난 모의고사를 다시 풀어보며 문제 분석과 풀이 속도를 한 층 끌어올렸습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
  `"기출도 중요하지만, 2000제를 더 완벽하게 보자마자 풀수있게끔 익숙하고 능숙하게 연습하는게 더 중요한 것 같아서 매일 무조건 한시간 반씩 전 범위 문제를 5~10개씩 풀어서 코드1~3 3회독을 하고있다. 어떻게 푸는거구나 하는 생각이 머리속에 문제를 보고 바로 드는 것들이 조금 생겨나는 것 같다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`,
  `"STEP1,2 강의를 거의 끝냈다. 계획한 것보다 늦어졌긴했지만, 주어진 시간 안에 최선을 다하려 노렸했기에 칭찬한다. 배위화학 부분을 제대로 외우지 못했는데 이번기회에 제대로 외웠다. 강의를 듣고 똑선생님의 방식을 그대로 적용해 푸는 연습을 했다." — 단퓨프 (26학년도 목포(약) 합격생)`,
  `"학교별 기출이나 풀었던 문제들을 전범위 위주로 계속 실전 연습하며 감각 유지하는데 노력했다. 또 자잘하게 암기해야 할 것들이 생기면 정리해서 여러 번 보려고 했다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
  `"이번주에 22단원 문제를 모두 마무리했다. 다 푼 뒤에는 하루에 1시간씩 앞에서부터 복습했다. 기출올인원 점검 테스트가 있길래 한번 풀어봤는데 아슬아슬하게 우수 기준은 넘겼다. 생각하지 못한 구멍을 또 발견해서 긍정적으로 생각했다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"기출올인원에 있는 24년도 경성대 계명대 내용을 풀이 및 암기까지 마쳤다. 전공화학을 하면서 매일 1시간씩 2000제도 풀어 다음주 정도에 3회독이 마무리 될 예정이다. 다음주는 기출올인원 정리본 총복습을 2일정도 한 후 2025경성, 계명을 암기한 내용을 바탕으로 풀 예정이다. 이후에는 매일 2시간 했던거 복습+ 1시간 모의고사 풀이+ 1시간 오답의 시간을 가지려고 한다." — Akdow (26학년도 단국(약) 합격생)`,
  `"이번주에 채운 단원들은 시험에서 안 틀렸다! 화학열역학 척도가 나오는 단원들(열화학, 화학열역학, 상전이)이 뭔가 애매하고 찝찝한 기분이 들어서 파고들어서 해결하였다." — 시계탑기린친구 (26학년도 강원(수) 합격생)`,
  `"기존계획을 이어서 매주 200문제 문제풀이를 완료하였다." — Hcsg (26학년도 원광(약) 합격생)`,
  `"1)적중 2000제 코드1~3에 해당하는 문제들을 매일 30문제씩 풀이함. 2) 2025 주력학교 기출 3곳을 공부함. 3) 그동안의 오답이나 실수를 원노트에 정리하여 모의고사 보기 전에 복습함." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"가장 약점이었던 열화학 특히 이상기체 열역학 부분을 메꾸었다. 이번주 목표한 2000제와 기출올인원 문풀을 거의 완수하였다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"∙ 25년 기출 문제와 추가 문제를 풀고 해설강의를 통해 풀이 방법을 익혔음. 2000제를 매일 20문제씩 꾸준히 풀어줬음." — 레고링 (26학년도 계명(제약) 합격생)`,
  `"분석화학 다시 한 번 정리했고, 분광학도 기출올인원 복습을 통해 대부분의 내용 공부를 맞췄다. 전공화학까지는 더 이상 집착하지 않고, 내가 학습하지 않은 내용은 본고사에서 아무도 맞추지 못 할 것이다라고 생각하고 지엽적인 내용들을 덜어내고 있다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
  `"공부를 하지 않았던 분광학과 크로마토그래피를 공부했다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"주력학교 위주로 이제 총 10개 학교의 기출문제와 추가문제를 풀어보았다. (충남, 경희, 중앙, 연세, 고려, 동국의 2025, 2024 기출까지 완료) 상식 문제 등을 제외하고 기본기를 응용하는 문제들은 얼추 풀 수 있게 된 것 같은데, 여전히 풀이 속도가 많이 느린 듯 하다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"복습과 진도나가면서 말씀해주신대로 분석화학 문제들 쭉 풀고 반복해서 보면서 암기하고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"기출올인원 진도와 복습 비율을 5:5로 조정하니 다시 페이스를 찾아 갔다. 또한 매일 2000제 문제 선별해서 풀어 주며 기본 문제의 APS 떠올리는 것에 집중했다. 그리고 문제 풀면서 화학 열역학 단원을 약간 감으로 푸는 것 같다는 생각이 들어서 다시 1500제로 돌아가 개념 흐름 빠르게 복습해주고 2000제 문제 다시 풀면서 APS을 다시 체화하는 과정을 진행했다. 또 전기음성도, 양이온 정성분석, 지시약 pH 범위, 속도 공식 등등 단순 암기 사항은 자주 까먹어서 매일 화학 공부 시작 전에 간단히 손드로 적어가면서 습관적으로 봐주었다. 이번 모의고사에서는 처음으로 3 cycle을 적용해보았다. 계산이 조금 복잡하거나 막히는 나오면 일단 생각한 데까지 적어두고 그냥 넘어갔다. 두번째 사이클에서 다시 보니 안보이던 몇몇 문제가 풀렸고, 생물까지 푼 후에 세번째 사이클로 돌아와서 마지막까지 남았던 문제들의 풀이가 떠올랐다. 오늘 아침에 약간 잠이 덜깨 멍해서 평소 쉽게 풀던 문제도 APS가 빠르게 안 떠올라 순간 당황했었는데 이렇게 3 cycle로 쉬운 문제들로 머리를 깨워준 후에 복잡한 문제들을 푸니까 훨씬 잘 풀렸다. 다음 모의고사에서도 이런 경우에 멘탈 놓치지 않고 풀 수 있다는 자신감이 생겼다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"7월부터 본 타임어택 모의고사들을 매일 1회씩 다시 풀면서 모의고사 훈련을 했고, 전공화학 300문제 거의 다 풀었다. 홍쌤께서 조언해주신 대로 문제 위주로 개념을 보완하는 식으로 공부하니 분석화학 단원의 큰 틀을 금방 파악할 수 있었다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"난이도 높은 문제들을 풀어보면서 나의 약점을 되돌아볼 수 있었습니다. 또한 문제들을 풀며 기본이론에서 나올 수 있는 문제들에 대한 유형은 많이 파악할 수 있었습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
  `"매일 전범위 위주로 모의고사 연습하며 실전 감각을 유지하려고 노력했다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
  `"매일 아침 1시간은 22단원을 복습하고 그 뒤로는 기출 올인원에 해당되지 않아 풀지 않았던 학교들 문제들을 최대한 풀었다. 노트들은 계속 보충하고 있다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"25경성, 계명대 기출복원과 추가문제까지 마쳤고 매일26대비 모의고사를 1회씩 풀면서 연습하고 있다. 1시간을 목표로 풀었을 때는 준수한 성적이 계속 나오고 있고 다음주부터는 매일 정리본 2시간 복습과 2시간의 모의고사 풀이 및 복기를 할 예정이다." — Akdow (26학년도 단국(약) 합격생)`,
  `"기존계획을 이어서 매주 200문제 문제풀이를 계획대로 11월 말까지 밀리지 않고 진행하였다." — Hcsg (26학년도 원광(약) 합격생)`,
  `"1)적중 2000제 코드1~3에 해당하는 문제들을 매일 30문제씩 풀이함. 2) 2025 주력학교 기출을 공부함." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"계산실수를 잡기 위해 2000제 전 단원 계산문제들을 선별해 랜덤으로 풀었다. 효과가 있는지 알아보기 위해 몇 달 전 풀었던 VF 9월과 10월 모의고사를 다시 시간재고 풀어보았다. 시험 전까지 지금처럼 매일 계산 연습을 하는 것이 좋겠다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"∙ 오전에 전범위 모의고사를 시간을 재고 풀며 전범위 내용을 복습함. ∙ 2000제 문제를 매일 복습하며 기본기를 잡음." — 레고링 (26학년도 계명(제약) 합격생)`,
  `"25 계명&경성, 24 계명 일부를 공부하면서 전공화학에 대한 이해를 쌓았다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"주력학교 위주로 기출을 풀고 부족한 단원을 기출 올인원, 적중 2000제로 복습했다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"기출올인원 풀면서 실수도 실력이라는 생각으로 기본적인 문제들 다시 쭉 보면서 2000제 복습하고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"저번주와 마찬가지로 기출올인원 진도와 복습 비율을 5:5로 학습해주었다. 진도가 느리더라도 이렇게 기본기를 잡고 가니 기출 문제 풀 때도 훨씬 밀도 있게 공부할 수 있었다. 그리고 2000제의 취약 단원 문제를 전체적으로 빠르게 풀며 기본기를 놓치지 않도록 점검했다. 문제를 풀면서 APS 바로 떠오르지 않는 문제, 핵심 개념을 묻는 문제, 상식 문제, 단순 계산 문제를 선별해서 따로 정리해두었다. 박선우T 카페에서 ‘편입시험 고득점 방법/ 마무리 복습 방법’ 칼럼을 참고해 시험 직전에 반복할 핵심 문제들을 추려두는 방식을 적용해보고자 한 것이고, 이 작업이 이번 모의고사에서 좋은 결과로 이어졌다. 아침에 정신을 깨우려고 몸풀기용으로 선별해둔 단순 계산 문제를 10문제 정도 풀고 시험을 봤더니 계산 실수를 하지 않았다. 그리고 A4용지에 단순 암기 사항들을 모아서 정리해두고 이틀에 한번씩 백지에 적어 보는 것도 큰 도움이 되었다. 덕분에 이번 모의고사에서 양쪽성 수산화물 고르는 문제에서 고민 없이 바로 답을 체크할 수 있었다. 이렇게 하니까 성적이 오른 것을 경험하니 남은 한 달 동안 2000제를 복습하며 핵심 문제를 추려 시험 직전에 풀어가는 전략이 시험장에서 안정감을 줄 것이라는 확신이 생겼다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"약점 파트인 배위화합물을 기출올인원과 2000제를 다시 풀며 보완했다. 그리고 타임어택을 1일 1회 풀면서 전범위 모의고사 연습을 본격적으로 하고 시작했다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"기출 올인원에 있는 모든 문제를 다 풀었다. 모의고사를 풀거나 약점 노트에 정리해둔 부분들을 다시 풀면서 실수가 나는지 점검하고 약점노트에서 확실히 풀 수 있는건 지우고 여전히 헷갈리고 틀리는건 표시를 하면서 정리하고 있다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"계산을 잡기 위해 2000제 계산 문제들을 랜덤으로 푸는 연습을 했다. 연습용 모의고사와 11월 모의고사로 테스트를 해보니, 더 이상 계산으로 많이 틀리는 일은 없었다. 감을 잃지 않도록 쉬운 문제들을 조금씩 계속해서 풀어나가야겠다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"2000제 복습 매일 하면서 기출올인원 풀고 있고, 실수 노트에 작성한 내용 틈날때마다 숙지하고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"이번주도 기출올인원 진도와 복습 비율을 5:5로 학습해주었다. 어느정도 기본 문제는 이제 바로 APS가 떠올라서 자신감이 많이 올라왔다. 그리고 2000제 취약 단원 문제를 전체적으로 빠르게 풀며 기본기 엽습을 해주었다. 문제를 풀면서 APS 바로 떠오르지 않는 문제, 핵심 개념을 묻는 문제, 상식 문제, 단순 계산 문제를 선별해서 따로 정리해두었다. 그런데 생각보다 2000제 전체 문제를 복습하는 것이 오래 걸려서 코드 1~3까지만 복습하는 것으로 계획을 조정할 계획이다. 그리고 전공화학 공부도 시작했다. 시험 보러 다니기 시작하면 여유가 없을 것 같아 늦은 감이 있지만 지금부터라도 해야 겠다고 생각했다. 이번주에는 25년도 계명대 기출 강의를 듣고 정리해두었고, 다음주에는 모든 계명, 경성 기출을 마칠 수 있을 것 같다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"화학 진도가 생각처럼 안 나가져 방황했었는데 다시 마음을 다잡고 그날 공부하는 내용에 집중했다. 상식 내용이 처음엔 방대하다고 느끼고, 모르는 부분이 많은 것 같아 고민이었는데 한 단원 끝나고 30분 정도 투자해 굿노트 스터디카드로 만들어 생각날 때 종종 보니 익숙해진 것 같다. 처음엔 바로 다시 2000제 1,2를 풀다가 빠르게 1500제를 보고 푸는게 좋을 것 같아 지금은 그렇게 진행하고 있다. 본고사를 생각하면 지금 실력으론 막막하지만, 그래도 현재 나가고 있는 부분에 대해서는 선생님의 풀이를 잘 따라가고 있다는 생각이 든다." — 단퓨프 (26학년도 목포(약) 합격생)`,
  `"전범위 위주로 모의고사 연습하며 실전 감각을 유지하려고 노력했다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
  `"약점 노트에 기록해둔 내용이나 문제들을 모두 다시 풀어보고, 올라온 연습 모의고사를 모두 풀었다. 그 모의고사들 중 하나가 매우 시간이 빠듯해서 엄청 당황하고, 성적이 매우 낮게 나왔는데, 반대로 그때 경험을 해서 오늘 테스트에서 말렸을 때도 일단 넘기고 마지막에 다시 돌아와서 다 풀어낼 수 있었다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"* 한 단원 코드 1~3을 풀고 다음날에 틀린문제는 다시 풀고, 어느정도 자신감이 생겼다 싶을 때 기출올인원의 새로운 문제로 잘 푸는지 확인해주었다. * 1500제 단원마무리 문제, 의편사에서 구한 전북대 기출복원문제를 활용하여 전범위에 대한 기본 계산 감을 유지해주었다. * 화학 공부시간도 4시간~4시간 30분 정도로 해주려고 노력하였다." — 시계탑기린친구 (26학년도 강원(수) 합격생)`,
  `"이번주부터는 해왔던 것들에 집중하기로 했다. 연습용 모고를 풀고 25학년도 문제들은 해당 학교 기출로 돌아가 유사 문제들을 추가로 풀었다. 2000제와 기출올인원도 꾸준히 다시 풀고 있다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"∙ 매일 아침에 모의고사를 풀어주었고 단원별로 기본적이지만 중요한 2000제 문제들을 매일 풀었음." — 레고링 (26학년도 계명(제약) 합격생)`,
  `"저번주에 전공화학을 공부하면서 무뎌진 기본기를 이번에 다시 채웠다. 다음주에는 전공화학과 기본기 두마리를 동시에 잡을 계획이다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"하루에 2000제 3~40문제 + 전범위 1개회차 페이스를 꾸준히 지키며 감을 놓치지 않기위해 애썼다. 기본문제는 거의 다 풀 수 있게 되었다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"2000제 복습 할 때 양론, 열화학, 기체 문제들 빠르게 풀기 연습하고 있습니다. 기출올인원도 시간 재면서 풀고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"박인규 선생님께 받은 모의고사를 하루에 하나씩 풀고, 2000제를 틈틈히 복습했다. 모의고사 훈련을 하니 문제 푸는 속도가 점점 붙는 것이 느껴졌고, 본고사에서도 잘 볼 수 있을 것 같다는 자신감을 얻고 있다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"연습용 모의고사와 2000제 복습으로 감을 유지했고 시험 이틀전부터 풀어볼 문제들을 선별중입니다. 또 스타일이 조금 다른 화학문제들도 조금씨 풀어보며 시험장에서 덜 긴장할 수 있도록 노력중입니다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
  `"문제를 최대한 많이 풀어보려고 노력했다. 그래도 어느정도는 할 수 있다는 자신감을 갖게 되었다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`,
  `"새로 들은 부분은 쉬운 문제를 여러 개 풀어서 익숙해지고 정확히 이해하는데 집중 했다." — Akdow (26학년도 단국(약) 합격생)`,
  `"박인규 선생님 강의에서 배운 문제를 접근하는 방식이나 식을 작성하는 방법이 매우 새로워서 열심히 배우려 함. 기본적 내용이어도 내가 알던 방식과는 달라서 성급히 넘기려는 마음이 들지 않았음." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"1500제 완강! 1회독 완료! 1회독때는 풀이의 전체적인 흐름을 봤다면, 2회독째에는 문제를 풀 때 계산에 집착하지 않고 문제의 큰 틀에 집중하며 풀이를 능동적으로 설계하는데에 집중하는 중. 잘 하고 있다는 느낌이 듦." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"기본 강의를 최대한 집중해서 빠르게 듣고 기본적인 문제 풀이를 병행하며 기본 개념을 익힐려고 노력함." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"핵심이론 복습을 병행하며 기본적이고 핵심적인 내용이 담겨있는 문제를 반복해서 풀다보니 까먹었던 내용들이 다시 기억이 났고 알고있던 지식들이 탄탄해짐. 이번 주는 매일 계획한 시간만큼 일반화학 공부를 했음" — 쿠리만쥰 (26학년도 5관왕 | 단국(약)·계명(제약)·삼육(약)·강원(약)·우석(약) 합격생)`,
  `"화학 문제 푸는 것을 좋아하고, 나름대로 자신감도 있었지만, 그럼에도 불구하고 강의를 빠르게 확인하여 나의 풀이가 올바른 풀이가 맞는지 확인하는 과정을 거쳤다. 이 과정을 통해 평형 파트에서 놓쳤던 부분 두 가지를 확인할 수 있었다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
  `"그간 코드번호를 가리지 않고 모든 문제를 푼 후 다음 단원으로 넘어갔는데, 사전상담 후 코드1,2번 문제만 풀고 넘어가는 방법으로 전략을 바꾸었더니, 진도가 처지지 않고 탄력있게 나아가는 듯한 느낌이 들어서 좋았다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"1500제 복습을 매일 하면서 박인규 선생님의 풀이법을 다시 한번 익히고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"1500제에 있는 일반화학 학습법에 따라 문제를 통해 개념을 이해하고, 단원이 끝날 때마다 기본서를 읽음, 빠르게 풀기보다는 정확하게 박인규 선생님의 풀이 방식대로 풀려고 강의에서 배운 사고 방식을 계속해서 생각함" — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"모든 문제를 A.P.S 문제 풀이법을 따라서 풀려고 노력했다. 자연스럽게 박인규 선생님의 풀이 방식과 비슷해졌다. 그리고 목차 암기법으로 화학 개념이 더 명확해진 것 같다." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"확실히 기본적인 내용은 다 아는거라 약간의 배속으로 빨리빨리 나갈 수 있어서 좋다. 하지만 대충대충 하지 않고 내 방식과 인규쌤의 방법의 차이를 정확히 캐치해서 내 것으로 만들어나가고 있다. 진도가 빨라서 7월안에는 수월하게 1500제를 끝낼 것 같다. 화요일에 시험이 있으니 내일은 화학에 더 치중해야겠다." — 약대가쟝 (26학년도 단국(약) 합격생)`,
  `"문제를 보면 바로 쓰기부터 시작하지 않고 문제를 어떻게 풀지 계획을 세우고 시작했다. 2000제 4단원까지 코드1,2,3을 다시 한 번 풀어보면서 틀린 부분에 대한 개념을 다시 한 번 복기하고 정리했으며 내 방식대로 풀어서 맞췄다해도 해당 범위의 모든 문제를 박인규 선생님의 풀이 방식을 보면서 풀이 과정과 사고를 그대로 가져가기 위한 노력을 했다." — Akdow (26학년도 단국(약) 합격생)`,
  `"저번 주에 배운 단원들의 예제들을 모두 다시 풀어보며 복습함. 이번 주에 상대적으로 쉬운 원자 구조 관련 단원을 공부했는데 역시 다 알고 있다고 생각했던 단원도 보충할 부분들이 보여서 다시 한번 기본기의 중요성을 잊지 않으려 노력함" — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"나름 화학에 자신있다고 생각했으나, 화요일 테스트를 보면서 너무 많이 절었던 것 같다. 문제를 처음 봤을 때 어떻게 문제를 접근해야 할지 바로 안떠오른 문제가 꽤나 있었다.  이번 test를 계기로 화학공부 방향성을 잡는 중요한 계기가 되었다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"목표한 진도에 따라 강의 수강 및 복습을 완료했다. 쉬운 문제도 APS 풀이법을 의식하면서 풀이해서 정해진 길을 따라가면서 문제를 푸는 것이라는 말의 의미를 이해하게 되었다." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"이것저것 다 하려는 고집을 버리고 한 주 동안1500제 복습에만 온전히 집중했다는 점이 좋았다. 헷갈리는 개념은 강의를 다시 보고, 문제들을 처음부터 다시 풀어보면서 박인규 선생님의 풀이 법을  체화하려고 노력했다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"기본 강의를 집중해서 들었고 생각보다 더 빠르게 진도를 나가고 있음. 계획한대로 잘 진행하고 있음." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"-7/15에 진행된 모의고사에서 30문항 모두 맞았다. 처음 보는 문항도 있었지만, 박인규선생님의 풀이법이 이제는 조금은 체화돼서 큰 어려움 없이 풀 수 있었다. -코드번호 4,5,6,7번 진도를 나가는 중이고, 해당 번호 문제들은 문제를 혼자 풀어보고 강의를 듣고 있는데, 풀이가 길고 오래 걸려도 어렵다고 느껴지지는 않는다. 박인규 선생님의 어려운 문제는 쉬운 문제의 내용의 조합이라는 말씀이 체감이 됐다." — 쿠리만쥰 (26학년도 5관왕 | 단국(약)·계명(제약)·삼육(약)·강원(약)·우석(약) 합격생)`,
  `"1500제 진도를 나가면서 한 단원의 문제를 강의 직후, 다음 단원 학습 전에 반복해서 풀어 보며 박인규 선생님의 사고 방식을 손으로 익히려고 연습했다. APS가 잘 떠오르지 않은 문제들은 그 방법을 체화할 때까지 몇 번이고 반복해서 풀었다. 확실히 이렇게 하니 문제를 풀 때마다 자신감이 붙어 가는 느낌이다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"실력점검 모의고사에서 목표한 것처럼 좋은 성적을 받을 수 있었다. 문제를 풀면서 헷갈렸던 개념들을 다시 한 번 정리해줬다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
  `"APS 순서대로 한번에 정확히 풀기 위해 노력했다. 반응속도와 각종 평형 등 계산이 필요한 파트로 넘어오니 그 필요성이 더욱 체감되었고, 초반에 습관을 잘 들여놓은 것 같이 느껴져 뿌듯했다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"1500제 복습에 많은 시간을 썼습니다. 시간을 많이 쓴 만큼 빠르게 1 회독을 할 수 있을 것 같습니다. 복습할 때 손으로 직접 다 풀었고 특히 평형 문제(산염기, 용해)를 풀 때 3단계 방법에서 1단계(우세한 반응 파악하기)의 중요성을 크게 느꼈고 생각의 흐름을 보완하였습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"7월 일반화학 모의고사를 치기 위해서 화학에 좀 많이 치중했다. 시험은 화요일에 끝났지만 얼마 남지도 않았고 빨리 끝내고 2000제로 들어가고 싶은 마음에 진도를 확 빼버렸다. 빠르게 뺐다고 대충하지도 않고 필기 하나 놓치지 않고 단원마다 APS 방법을 정리해놨다. 덕분에 7월안에 1500제 이론 끝내고 생물에 집중할 수 있을거 같다. 확실히 저번주는 쉬운단원이라 문제도 없고 너무 쉽게 느낀것과 다르게 평형, 에너지 단원으로 들어가니 일반화학 느낌이 났다." — 약대가쟝 (26학년도 단국(약) 합격생)`,
  `"원래 2000제 8단원까지의 문제 풀이를 목표로 했는데 1단원 더 진행해 9단원까지 마쳤다. 먼저 1,2,3코드에 해당하는 문제를 싹 풀고 맞춘 문제는 박인규 선생님이 추가해 주시는 개념과 풀이 방법을 습득하려고 노력했고 틀린 문제에서는 중요도가 낮다고 하신 개념과 문제는 나중에 다시 보기 위해 따로 빼서 정리해두고 중요도가 높았는데 틀린 문제는 1500제로 돌아가 다시 한 번 개념을 읽고 문제를 여러 번 풀어보며 체화하는데 집중했다." — Akdow (26학년도 단국(약) 합격생)`,
  `"저번주에도 느낀 부분이지만 정말 내가 상식이 부족한 상황에서 시험장을 들어갔구나를 더 크게 느낌. 시험장에서 이런걸 어디서 배워 라고 생각했던 문제들이 1500제 예제에 유사한 느낌의 문제가 많았음. 편입 시험을 어떻게 대비해야할지 스스로 알아가고 있는 것 같다." — 푸파 (26학년도 순천(약) 합격생)`,
  `"계획해둔 일정을 지키며 공부를 했다. 인강을 들으면서 이 단원의 흐름과 소단원을 의식적으로 기억하려 했고, 문제를 풀 때는 잠깐 멈추고 먼저 푼 뒤에 선생님과 똑같은 식으로 풀었는지 확인하며 들었다. 인강을 듣고 난 후 바로 배운 내용과 흐름을 다시 읽고 복습함." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"문제를 꾸준히 풀었고, 모든 문제 강의를 듣기보단 조금이라도 애매하다고 느꼈거나, 해설을 들을 필요가 있다고 느낀 문제는 해설을 들어 주려 했다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"- 오후 시간에 화학공부를 할 때 저번주에 쳐진다고 생각해서 이번주에는 복습 문제풀이 후 자리에서 일어나 10~20분 휴식 후 새로운 진도를 나갔더니, 집중이 훨씬 잘 되었다.  - 복습 문제풀이 전 후 체크리스트를 의식적으로 다시 하나하나 확인하며 좀 더 신경써야 할 체크리스트를 다이어리에 한줄 쓰며 의식적으로 화학공부에 반영하려고 노력하였다. 그리고 일반화학 단원별 엑셀을 만들어서 진도+ 복습 후 내가 지금 어려워하는 지점을 명확히 글로 적어보았더니 문제의 원인이 명확해져서 그 부분을 더 공부하면 되겠다 싶은 생각이 들었다! - 이번주는 진도에 급급해 누적복습을 원하는 만큼은 못했지만, 누적복습을 통해 전반적으로 일반화학에 대한 자신감이 붙고 있다. 효율적인 누적복습 방법을 찾으니 공부할 때 불안하지 않았다." — 시계탑기린친구 (26학년도 강원(수) 합격생)`,
  `"진도 나가는 것보다 복습에 더 집중했다. 진도가 계획했던 것보다 느리게 나가도 복습도 없이 넘어가는 것이 더 비효율적이라고 판단했다. 그리고 화학 체크리스트로 공부 방향을 재점검하는 시간을 가졌다. 내가 하는 공부에 확신을 가지니 공부할 때 정신적으로 흔들리지 않았다." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"이번주 역시 1500제에만 몰입하며 복습에 힘을 썼고, 1회독 때는 얻지 못했던 것들을 한 주 동안 많이 얻어갈 수 있었던 것 같다. 1500제에서 주요 내용과 AP를 정리한 노트를 따로 만들어서 누적 복습하는 중이며, 문제를 무작정 풀기 전에 어떠한 경로를 거쳐 풀 것인지 생각하는 연습을 하며 공부를 했다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"-오랜만에 푸는 단원도 문제의 단서를 파악하고 조합해 어렵지 않게 해결할 수 있었다. 기본적인 문제들을 반복해서 풀다보니 기본기가 쌓인 느낌이 들었다." — 쿠리만쥰 (26학년도 5관왕 | 단국(약)·계명(제약)·삼육(약)·강원(약)·우석(약) 합격생)`,
  `"이번주부터 물질 변화 파트에 들어갔다. 특히 어려워하는 부분이라 역시 부담이 컸다. 그래도 박인규 선생님의 강의를 들으며 생각보다 어려운 단원이 아니였음을 느껴 재미있었다. 문제를 함께 풀어주니 어려웠던 개념도 쉽게 이해가 되어 앞으로 남은 파트도 이렇게 공부하면 수월하게 해낼 수 있을 것이라는 자신감이 생겼다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"평형 단원에서 올바른 방법으로 한 번에 풀기위해 노력했다. 열역학 단원이 항상 어려운데.. 박인규 선생님 조언대로 이론에 치중하지 않고 문제를 풀며 이해하려고 노력했더니 처음 볼 때보다는 확실히 이해도가 높아진 것 같다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"1500제 회독을 끝냈습니다. 앞으로는 2000제에 집중하면서 계획처럼 필요할 때마다 찾아볼 생각입니다. 2000제 공부가 익숙해진 것 같습니다. 좀 더 속도를 내서 코드번호 1,2를 완강할 계획입니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"잊을 뻔 했던 산염기, 용해도 부분을 복습했다. 이번 주에 토익이 있어서 금요일 저녁 + 토요일 전체를 빼앗겨 생물에 더 치중했지만 화학도 잊지 않고 어느 정도는 챙겼다. 돌아오는 주에는 수월하게 화학 1500제를 끝낼거 같아 복습 좀 한 뒤 2000제로 넘어갈 테스트를 봐야겠다. 7월 동안 해야할 만큼을 늦지않고 다 끝낼거 같아 마음이 놓인다." — 약대가쟝 (26학년도 단국(약) 합격생)`,
  `"1) 이번주 진도 한번도 밀리지 않고 계획 한대로 잘 이행했음. 2) 편안한 단원들로 들어오니 한결 편안하게 인강을 듣게 되었고, 남은 시간을 생물 공부에 더 보완할 수 있어 좋았다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"고난이도 문제가 출제되는 단원을 공부하게 되어서 긴장했지만 인강으로 들은 내용을 침착하게 적용하다 보니 생각보다 순조롭게 배울 수 있었다. 이 과정에서 즐거움을 느꼈다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"맞는 보기여도 그냥 넘어가지 않고 계속 반복해서 개념에 대한 멘트를 쓰면서 체화시켰고 내가 푼 방법과 박인규 선생님이 푼 방법 2가지를 비교하면서 시야를 넓힐 수 있었다. 매일 꾸준히 4시간에서 4시간 반 씩 투자한 결과 목표보다 더 많은 범위를 나갈 수 있었다." — Akdow (26학년도 단국(약) 합격생)`,
  `"몇몇 문제를 강의를 들어주면서 느낀점은 "맞은 문제더라도 강의를 들으라고 하는 이유가 있었구나"였다. 이번에 강의를 들으면서 평형이나 용액관련 문제풀이 아이디어 얻어가는게 많았다. 그것 외에는 강의를 들으면서 인규쌤과 내 풀이가 양론, 평형관련 문제에 있어 많이 비슷하다는 느낌이 들었다. 이런 점에 있어서 다행인것같기도 하다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"1) 4주동안 한번도 밀리지 않고 1500제를 끝냈다. 잘했음 2) 전기화학 파트가 어려웠던건 산화제, 산화력, 환원 정도 등 단어표현들이 낯설어 개념들간의 상호전환이 빠르게 안됐던 것임을 깨달았다. 한번에 잘 안 와닿으니 개념들끼리 전환하는데에 오래걸리고 비교도 오래 걸렸던 것이었다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"화학 체크리스트로 공부 방향을 점검하였다. 그리고 평형 단원 진도를 나가면서 APS가 더 중요해졌는데 박인규 선생님의 사고 과정을 따라가기 위해 문제의 단서와 구조를 의식적으로 파악하면서 문제를 풀었다." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"산염기 파트 공부하며 전략단원으로 만듦. 앞부분 복습도 꾸준히 해줌. 저번주에 계획한 양이 많아 버거움을 느껴 양을 줄였더니 적당한 것 같음." — 레고링 (26학년도 계명(제약) 합격생)`,
  `"문제를 풀며 개념을 확인할 때 풀이 과정에 논리적 비약이 있으면 체크를 해두고 강의를 통해 문제 풀이 순서를 점검하였다. 이 과정에서 자유에너지에 대한 개념을 확실하게 정립할 수 있었다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
  `"전기화학 단원이 어렵게 느껴져서 1500제강의를 다시 들었는데, 헷갈렸던 내용 뿐 아니라 이미 알고 있었던 내용도 더 잘 이해할 수 있게 된 것 같아 좋았다. 다른 단원들에서 2000제(1,2번)를 소화하기 어렵지는 않았는데.. 그래도 1500제를 한 번 더 듣고 넘어오는게 좋았으려나 싶기도 하다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"2000제 강의를 계획한 것 보다 빠르게 듣고 있습니다. 반응 속도, 평형 문제들을 푸는 속도가어느 정도 붙는 것 같습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"점점 뒷부분으로 갈수록 어려운 파트가 나왔지만 강의를 들을 때마다 ‘역시 박인규 선생님이다!!’ 하며 감탄을 한다. 덕분에 복잡한 내용도 훨씬 쉽게 이해할 수 있었다. 항상 문제 풀때마다 APS를 떠올리며 문제에 답을 맞추는 것이 아닌 문제 풀이 과정에 초점을 맞춰서 공부하니 개념이 체계적으로 연결되는 것을 느꼈다. 선생님의 사고 방식에 따라서 스스로 사고하고 풀이하는 연습을 통해 자신감이 더 생긴다. 아직 기본 개념을 공부하고 있지만 2000제로 넘어가서 더 어려운 문제를 접했을 때 APS로 풀릴 것을 생각하니 벌써 기대가 된다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"마찬가지로 7월안에 1500제를 모두 완강했다. 배위화합물 할때쯤엔 반응속도식, 용해도 부분이 조금씩 섞이거나 헷갈렸는데 계속 다시 봐야겠다. 8월 중순까지로 넉넉하게 목표를 잡고 있었는데 속도가 나서 정말 다행이다. 듣기 싫은 날에도 꾹 참고 시청했더니 어느덧 끝난거 같다. 내용 자체는 다 아는 내용이라 인규T 풀이방식대로 교정하는데만 노력을해서 빨라졌나 싶다." — 약대가쟝 (26학년도 단국(약) 합격생)`,
  `"계획했던대로 1500제 복습을 끝냈고, 7월 타임어택 모의고사를 다시 풀어봤다. 7월에 잘 안 풀렸던 문제들이 APS대로 잘 풀리는 것이 느껴졌고, 아직 시간은 걸리지만 내 풀이에 대한 확신이 생겨 문제풀이에 자신감이 붙었다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"박인규T 예제를 다시 풀다보니 스스로 얼마나 뒷부분을 날림으로 했는지 깨달아서 잘 모르는 부분은 다시 강의를 듣고있다. 한번 잘 못 하면 그 뒤로 얼마나 시간이 낭비되는지 깨달아서 최대한 많은 것을 흡수하려고 노력하고 있다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`,
  `"이번주에 1500제를 마지막 단원까지 모두 들었고, 인강을 듣고 남는 시간을 이용하여 반응 파트를 복습했다. 7월에 푼 기본기 테스트를 다시 풀어보며 그때보다 풀 수 있는 문제가 훨씬 많아졌다고 느꼈다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"저번주에 피드백했던거 생각하면서 풀이를 깔끔하게 체계적으로 작성하였다. 그결과 실수가 많이 줄었다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"진도를 나가는 것보다 복습하는 것에 신경 썼음. 이번 주 공부하는 단원에서는 A.P.S가 더욱 중요한 것 같아 박인규 선생님의 사고과정을 그대로 따라하려고 노력함. 그리고 화학 체크리스트로 공부 방향을 점검하면서 내가 하고 있는 공부 방식에 확신이 들었음." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"1500제 한 단원 끝낼 때마다 김준 필수이론 개념과 예제들까지 한꺼번에 돌렸는데 완강하며 한달만에 내가 배웠던 개념교재를 전부 복습하였음. 필수이론을 몇 번이고 풀었는데도 계속 이해안되고 틀렸던 문제들이 1500제를 풀고 다시 푸니, 어떤 상황인지, 어떻게 AP를 세워 풀어야 하는지 바로 적용이 되었다. 정말 신기한 경험이었고 내 실력에 대한 근거있는 자신감이 생겼음." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"계획한만큼 진도를 나갔음. 부족한 부분은 1500제를 다시 풀면서 복습해줌." — 레고링 (26학년도 계명(제약) 합격생)`,
  `"지난주에 이론적인 내용을 복습하자고 계획하였고, 이에 따라 이론적인 내용 단원들을 잘 복습해줬다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
  `"2000제 코드 1,2번 1회독이 끝났다. 예상했던 것보다는 꽤나 늦어졌지만 그래도 뿌듯하다. 인강을 먼저 듣고 문제를 풀었을 때 아주 어렵게 느껴지는 부분은 많지 않아서 그래도 얼추 맞는 방향으로 공부하고 있는 것 같다는 생각이 들었다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"코드번호 1 2 수강을 거의 마쳤고 다음주부터 3으로 넘어갈 계획입니다. 코드 번호 1 2를 풀면서 기본기가 잘 쌓였다는 느낌을 받았습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"1500제 완강했다! 후반부로 갈수록 앞 단원의 중요성을 느끼며 관련 단원도 함께 복습 하며 진도를 나갔다. 예를 들어 18장 화학 열역학과 6장 열역학을 함께 보고, 20장 전기화학을 할 때 4장에서 산화-환원 반응 파트를 다시 봤다. 기본 개념을 다시 보고 심화 내용을 다루니 훨씬 수월했다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"목표했던 양보다 더 많은 진도를 나갔다. 1500제를 수강하면서 APS를 잘 정리해둔 덕분에 2000제 앞의 내용을 수월하게 수강할 수 있었다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"복습을 열심히 했다. 체크리스트를 매일 읽으면서 기본기가 얼마나 빨리 날라갈까 싶었는데 생각보다 빨리 사라져서 복습을 사이클을 갖고 마지막 마물리 문제라도 꾸준히 풀어야겠구나 느꼈다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`,
  `"이번 주부터 2000제를 풀기 시작했다. 테스트 보는게 두렵고 부담스러웠지만 회피하지 않고 복습이 끝나자마자 신청했다. 헷갈리는 암기 사항을 모아놓은 노트를 계속해서 보충하고 자주 봐주려 하고 있다. 화학공부법 체크리스트도 화학 공부가 끝날 때 마다 체크해서 보완하기 위해 따로 적어뒀다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"드디어 1500제를 완강했다. 원래 목표였던 8월 중순보다 조금 늦긴 했지만, 전체적인 학습 계획에 맞춰 꾸준히 공부해온 것 같다. 7월에 다시 1500제를 들으며 문제 풀이 기본기를 탄탄히 다질 수 있었고, 실력점검 모의고사에서는 취약했던 산염기 파트 문제를 모두 맞혀 뿌듯했다. 선생님 말씀대로 1500제가 가장 중요한 과정임을 7·8월 동안 직접 체감할 수 있었다." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"2000제를 빠짐없이 100문제씩 풀었으며, 각 단원별로 AP 구조를 생각하며 체계적으로 푸는 연습을 하였다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"2000제 문제를 매일 50문제 꾸준히 복습함. 문제를 보고 방법 떠올린 후에 풀이에 들어감" — 레고링 (26학년도 계명(제약) 합격생)`,
  `"화학 시험을 대비하기 위해 이론적인 부분을 정리해줬고, 박인규 선생님 카페에 있는 2000제 점검 모의고사도 풀었다. 이번주는 기본기 수준의 모의고사를 많이 풀면서 빈틈이 없는지 확인하는 한 주였다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
  `"이번 모의고사를 통해 올바른 방향성으로 공부하고 있다는 확신이 들었다. 저번과는 달리 억지로 빨리 풀려 하지 않았다는 점, 무턱대고 덤비지 않고 문제를 어떻게 풀어갈지 일차적인 방향성을 잡고 들어가니 오히려 막히지 않고 시간이 줄었다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"테스트에서 빠르게 풀 수 있는 문제들을 먼저 풀어주었다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"코드번호 1 2 를 완강하였고 코드번호 3번 풀이를 시작하였습니다. 8월 모의고사를 봤을때 전체적인 기본기가 많이 올라온 것을 느낄 수 있었습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"1500제 테스트를 통과하고 2000제로 넘어갔다. 강의에 앞서 1500제 목차 구조를 먼저 읽고 큰 흐름을 이해한 뒤 강의를 들었다. 2000제는 문제 유형이 다양하고 상식으로 푸는 문제도 많아, 확실히 정리하고자 단원별 암기 노트를 작성하기 시작했다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"계획대로 2000제 파트1,2를 완강했다. 8월 모의고사에서 비록 오답이 꽤 나오긴 했지만, 7월 모의고사에 비해 전범위에 대한 기본기가 어느정도 갖춰졌음을 느꼈고, 막연하게 느껴졌던 전기화학과 혼합 평형 문제에 자신감이 생겼다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"현재 상황을 잘 파악한 것이 이번주의 가장 큰 수확인 것 같다. 화학 타임어택 시험을 통해 나의 위치와 상황과 시험에서 점수가 잘 나오지 않는 이유를 알게 된 것 같다. 목표한 만큼은 아니지만 다음주면 충분히 1500제를 시간을 들여 완강할 수 있게 되었다. 매일체크리스트를 읽으면서 시간 제약 없이 박인규 선생님과 같은 생각을 하면서 풀려고 많이 노력했다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`,
  `"2000제를 풀면서 옆에는 1500제 교재를 같이 둔 채로 다 푼 뒤 헷갈렸던 개념이나 문제는 해당 단원을 복습하거나 따로 노트에 보충하는 식으로 공부했다. 계산문제는 인강에서 선생님과 같은 방식으로 풀었는지 최대한 확인하려 노력했다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"2000제 1회독을 마무리했으며 1단원부터 각 문제별로 적어놨던 암기사항들을 정리하면서 다시 한번 개념의 암기 사항을 확인하고 복기하는 시간을 가졌다. 다음주 부터는 빠르게 체크해놨던 문제들 위주로 2회독을 시작할 예정이다. 암기노트 작성 후 최종 점검으로 7,8월에 봤던 타임어택 모의고사를 30분안에 다 맞추는 것을 목표로 시행했고 성공했다." — Akdow (26학년도 단국(약) 합격생)`,
  `"1500제 복습을 마쳤다. 취약한 부분을 정면으로 마주하면서 헷갈리던 내용도 상당 부분 해결된 것 같다. 쉬운 문제를 여러 번 반복하며 박인규 선생님의 사고 과정을 그대로 따라가려고 노력하니 자신감이 생겼다. 내일 2000제 테스트에 대해 선생님께 연락드려야겠다." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"1) 1500제를 다시 풀며, 8월 모의고사 틀린 부분이 내가 소홀히 했던 개념 부분이었음을 다시한번 깨달았다. 가령, 산염기 적정 문제에서 화학종 농도와 pH는 곧잘 구해도, 당량점이 pH 7보다 큰지 작은지, 그래서 지시약은 무엇을 써야하는지처럼 다소 덜 중요해보이지만 굉장히 기본적인 개념들을 놓친 것이었다. 모의고사와 1500제 복습을 통해 내가 놓친 부분이 어디인지, 덜 숙련된 부분이 어디인지를 파악할 수 있어서 정말 다행이었다. 2) 약점인 열화학 단원을 2000제와 인강을 통해 다시 잘 다지게 되었다. 이해도 안되고 문제도 잘 안풀렸는데 이제 이해가 되고 어떻게 푸는지 감이 생겼다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"기출올인원을 풀다 보니 생각보다 사고를 많이 요하거나, 문제풀이가 은근 복잡해서 머리를 쓰게되는 경우가 많았다. 그래서 기본기가 조금 약해질 수 있겠다는 생각이 들었다. 그래서 하루에 4시간 화학공부를 한다고 하면 2시간은 기출 올인원으로 기출문제 공부를, 나머지 2시간정도는 해당 단원의 적중 2000제를 공부해봤다. 괜찮은 것 같아서 일단은 다음주도 이렇게 학습해 봐야겠다." — 쿠리만쥰 (26학년도 5관왕 | 단국(약)·계명(제약)·삼육(약)·강원(약)·우석(약) 합격생)`,
  `"문제를 풀 때 확실하게 아는 느낌이 아니라 불안했는데 1500제 예제를 복습하고 난 후 회복되었음. 다음주도 2000제와 1500제 병행하기" — 레고링 (26학년도 계명(제약) 합격생)`,
  `"9월초까지는 생물을 중점적으로 학습을 하려고 계획을 했고, 화학은 상대적으로 개념이 약한 파트인 고체파트 지엽적인 내용들을 정리해줬다. 또한 문제풀이 감각이 떨어지면 안 되기 때문에, 3일 간격으로 경희대 기출문제를 풀어줬고, 2000제에서 계산 단원 문제들을 하루에 10문제씩 복습하였다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
  `"중간중간 지엽적인 문제들을 제외하면 안정적으로 문제풀이가 되는것 같습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"저번주와 마찬가지로 단원별 암기 노트를 작성하였다. 강의를 듣고 문제별로 1500제 목차와 매칭시켜 정리하였다. 이 과정에서 자연스럽게 이론 복습이 이루어졌다. 후반부로 갈수록 앞내용이 흐릿했던 것을 방지하고자 누적 복습도 시작했다. 오늘 학습 한 것을 모레 다시 복습하는 식으로 하니 장기기억화 되는 것 같다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"인규샘이 말한 화학에 있어서 50%는 먹고 들어간다는 양론, 열화학 파트까지 강의시청을 했다. 100문제 넘게 안쉬고 풀어도 오답이 별로 안나와서 약간 자만할뻔 했지만 실제 시험을 겪어봐서 그런지 더 열심히 해야겠다고 느꼈다. 하지만 문제풀이 후 강의시청을 하려니 강의 진도가 잘 안나간다..." — 약대가쟝 (26학년도 단국(약) 합격생)`,
  `"계획한 것보다 더 진도를 나갔다. 코드1, 2 문제들을 복습하면서 박인규 선생님 풀이법이 어느정도 내재화된 것이 느껴졌다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"5,6장 문제를 풀고 나서 답은 맞추는데 체계적이고 기계적으로 푸는 느낌이 들지 않아서 진도를 멈추고 사고 과정을 점검해주었다. 6장, 19장의 경우 1500의모든 예제를 다시 풀어보며 풀이과정의 체계를 다시 상기시켜주었다. 문제를 풀 때 aps 흐름을 점검하며 풀기 위해 풀이 중 넘버링을 하여 AP대로 풀기 위한 장치를 마련하였다." — 시계탑기린친구 (26학년도 강원(수) 합격생)`,
  `"1500제를 드디어 끝냈다. 두번째 보는건데도 뒷부분은 거의 처음보는 느낌이어서 더 열심히 복습하며 2000제 나가서 APS를 잘 적용해야겠다고 생각했다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`,
  `"2000제 코드 1,2가 거의 마무리 되었는데 헷갈리거나 반드시 기억해야 할 것들을 정리한 노트를 꾸준히 정리하고 아침에 문제를 풀기 전 전날 배웠던 걸 복습하는 루틴을 만들었다. 원래 문제 틀리는 것에 크게 일희일비하는 성격이었는데 점점 약점을 파악할 수 있게 되었다 식으로 긍정적으로 바라보게 되는 것 같다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"기출올인원을 9월 2주차에 시작하기 전 2000제 2회독을 시작했고 원래 계획했던 11단원을 넘어 12단원까지 마쳤다. 2회독을 하는 도중 기존에 틀렸거나 다시 볼 필요가 있다고 느껴져 체크를 해놨던 문제들을 대부분 별다른 위화감 없이 쉽게 풀어냈으며 추가로 암기해줘야 될 사항들을 정리한 부분들도 암기가 잘 된 것을 확인할 수 있었다." — Akdow (26학년도 단국(약) 합격생)`,
  `"1) 1500제 복습 시험을 보았는데 지체없이 빠르게 풀어나갔다. 한달이라는 시간동안 최선을 다해 풀었는데 테스트를 보고 나니, 그래도 기초가 쌓였음을 느꼈다. 이제 선생님 말씀대로 남은 9월 이후부터는 2000제, 기출, 그외 여러 다양한 문제들을 풀어나가며 실력을 쌓자. 2) 2000제는 반응속도를 시작으로 본격적인 문제풀이에 들어갔다. 1500제 없이 문제만 풀었을 때에 비하면 틀리는 문제 수가 감소한 편이다. 문제들이 1500제 개념들과 연계되며 어떻게 풀어야 하는지 체계가 세워지니 자신감이 좀 붙는다" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"2000제를 풀며 부족함을 느낀 열화학 단원을 1500제 예제를 풀며 보충함" — 레고링 (26학년도 계명(제약) 합격생)`,
  `"9월초까지는 생물을 중점적으로 학습을 하려고 계획을 했고, 화학은 상대적으로 개념이 약한 파트인 고체파트 지엽적인 내용들을 정리해줬다. 또한 문제풀이 감각이 떨어지면 안 되기 때문에, 3일 간격으로 경희대 기출문제를 풀어줬고, 2000제에서 계산 단원 문제들을 하루에 10문제씩 복습하였다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
  `"1500제 랜덤 테스트를 잘 마무리하고 바로 적중 2000제로 넘어갔음. 핵심이론 1500제 리뷰도 함께 하면서 모의고사 대비를 위해 각 단원별로 목차순에 따라 간단한 개념 체크 리스트를 만들었음. 틈날 때마다 잊은 개념이나 공식이 없는지 확인했음. 기본 단계를 확실하게 다진 후 적중 2000제로 넘어오니 문제 푸는 것이 재미있고 수월해졌음." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"어지간하면 박인규 선생님 풀이대로 풀게되는 것 같다. 아예 노베이스에서부터 박인규T 강의로 시작한 덕인지 나만의 이상한 방법으로 풀게 되는 일은 적은 것 같아 다행이다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"저번주 피드백대로 코드 번호 1,2 도 복습을 하면서 진도를 나갔습니다. 산염기 단원은 자신이 없던 단원 중 하나였는데 몇몇 특이한 문제를 제외하고는 일관성 있게 풀 수 있게 된것 같습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"저번주에 이어 단원별 암기 노트를 작성하며 이론 복습을 병행했다.특히 문제 풀이 과정에서 AP를 한 줄로 간략히 정리한 뒤 문제를 푸는 방식을 적용하니 사고 과정을 더 잘 체화할 수 있었다. 틀린 문제는 체크 해두고 다음날 본격 학습 전에 빠르게 풀어주면서 누적 복습도 진행하였다. 그리고 암기노트도 함께 보면서 단순 암기 사항은 잊어 버리지 않도록 반복 학습해 주었다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"코드1,2 문제들을 복습하면서 틀린 문제들에 어떤 실수를 했는지 유형화하여 분석해보았고, 자주 놓치는 부분이 뭔지 명확하게 파악할 수 있었다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"인규쌤의 풀이랑 똑같이 풀기 위해 강의 보기전에 AP만 먼저 세워보고 한문제씩 강의를 보고 있는데 아직까지는 틀리는 문제 없이 다 맞고 있다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`,
  `"1500제와 2000제 복습을 병행하여 기본적인 문제들 위주로 3단원 다시 풀어보고 약간 지엽적인 문제들도 병행했다. 코드 1,2의 기본적인 문제들은 자신감이 생겼고, 위 문제들 풀이 방식을 기본 베이스로 기출올인원의 조금 난이도 있는 문제들도 APS 적용해서 나아가 봐야겠다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
  `"이번 주부터 코드 3을 풀기 시작했다. 문제를 풀기 전 코드 1,2 때 문제들과 노트를 복습하고 실수를 줄이기 위해 의식적으로 생각하면서 풀고 있다. 계획했던 양보다 더 많이 풀었다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"박인규 선생님의 사고방식을 흡수하기 위하여 일단 매 강의를 시청하기 전 해당 범위의 문제풀이를 진행하고 문제가 틀렸건 맞았건 상관없이 처음부터 끝까지 2배속으로 유튜브 강의를 시청하고 오답 진행을 하고 있는 점" — Hcsg (26학년도 원광(약) 합격생)`,
  `"공부시간이 부족해서 진도에 대한 걱정은 있었으나, 지금은 정확한 풀이 연습이 필요한 시기라는 것을 되새기고 APS를 지켜가면서 풀이함. 이번 주에도 일반화학 체크리스트를 통해 방향성을 확인하면서 내가 하는 공부에 확신이 들었음." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"1) 산염기 문제를 풀어도 왜 찝찝하고 몇 문제씩 틀릴까 고민이 많았는데 2000제를 다시 풀며 산염기 세기 비교와 수용액 산성도 비교라는 큰 주제를 통째로 놓쳤음을 찾아냈다. 인강으로 관련 부분을 차근차근 다시 들으며 메꾸었다. 2) 2000제를 다시 풀어보면서, 쉬운 문제들도 개념이 새롭게 구조화되고 이해가 깊어지는 느낌을 받는다. 아무 생각 없이 들었던 인강이었는데, 1500제 기본기에 유기 내용들까지 하나로 이어져 한층 더 깊은 개념 이해가 이뤄진 듯하다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"2000제 코드 1,2번 문제들을 단원별로 다시 풀며 자신없던 파트를 보완함. 헷갈리는 부분을 1500제 복습을 하며 보충해서 불안감을 해소함" — 레고링 (26학년도 계명(제약) 합격생)`,
  `"꾸준하게 계산문제 풀이 루틴을 이어나갔다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
  `"오랜만에 문제를 풀었다. 문제를 풀면서 감이 많이 죽었다는 생각이 들었고, 물론 문제 좀 풀면 바로 돌아오겠지만, 꾸준히 문제푸는게 중요하다는 생각이 들었다. 유기화학이 어느정도 진도가 끝나면 유기화학이랑 일반화학 공부량을 맞춰 나갈 생각이다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"간만에 평형, 반응속도 단원으로 돌아왔는데 비록 기억이 가물가물해서 곤란했지만.. 무작정 손부터 대기보다는 APS를 떠올리며 한 번에 풀고자 노력했다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"말씀해주신대로 헷갈렸던 상식 문제들을 노트에 따로 간단하게 적어놓고 화학 공부 시작 전에 가볍게 읽었습니다. 저번주와 마찬가지로 코드번호 1 2 복습하면서 진도는 꾸준히 나가고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"저번 주에 이어 단원별 암기 노트를 작성하며 이론 복습을 병행했다. 2주 정도 이렇게 하니 이 방법이 나한테 잘 맞는 것 같다. 매일 화학 공부하기 전에 그동안에 정리한 암기노트를 빠르게 복습하고 공부해 주었더니 앞의 내용도 공부하면서 지금 나가고 있는 진도도 함께 공부해주어 앞 내용을 잊어버린다는 불안감이 덜했다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"11강 반응속도 문풀 중인데 단원 들어가기 전 1500제로 대충 개념을 훑고 가니 더 잘 풀려서 좋다." — 약대가쟝 (26학년도 단국(약) 합격생)`,
  `"코드1,2 강의를 먼저 수강하고 복습을 하니, 일관된 방법으로 문제를 풀 수 있었다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"화학에 대한 약간의 두려움이 있었다. 그럼에도 두려워하지 않고 박인규 선생님께서 말씀하시는대로만 잘 따라가보자 계속 다짐했다. 문제를 풀 때 먼저 무작정 글씨를 쓰는 것이 아니라 먼저 단서를 찾고 연결하고 그 다음에 들어가는 것을 반복했다. 아직은 쉬운 내용들이지만 그래도 선생님이 말씀하신대로 같은 사고로 반복해서 풀다보니 조금 자신감이 생겼다. 선생님께서 강조하신 다른 부분은 바로 목차를 기억하고 내용을 떠올릴 수 있어야한다는 점이었다. 그래서 매 강의가 끝나고 혼자 복습이 끝나면 15분정도 할애해서 앱으로 그 날 수업 내용의 목차를 정리한 마인드맵을 만들었는데 효과가 괜찮은 것 같다. 먼저 그 날 배운 내용이기에 복습도 되면서 화학은 이론 부분이 많지 않기에 시간도 적게 걸리고 가장 좋은 건 그 다음 날 수업하기 전에 빠르게 훑어보고 들어가면 그 전에 배운 내용들이 빠르게 떠올라 좋았던 것 같다." — 단퓨프 (26학년도 목포(약) 합격생)`,
  `"목표한 양만큼은 못했지만, 이번주 나의 최대치를 해낸 것 같아서 만족스럽다. 개념형 문제(ex. 르샤틀리에 원리, 활성화 E, 촉매)를 풀면서 직관적으로 바로바로 자신있게 답을 고르지 못한 선지를 표시해두고 해당 개념을 직관적으로 이해하기 위해 시간을 썼다. 이전에는 단순 암기를 해서 자신있게 개념을 꺼내지 못했던 게 많았는데 이번에 문제풀이 후 생각하는 과정을 통해 직관적으로 반응할 수 있는 개념이 많아진 것 같다!" — 시계탑기린친구 (26학년도 강원(수) 합격생)`,
  `"원래는 본능적으로 생각없이 문제풀이에 돌입했는데 풀기전 방향과 풀이를 생각하고 푸는 연습중이다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
  `"계속 풀이가 같은지 점검하며 문제풀이하려고 노력했다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`,
  `"평일에는 매일 한 단원씩 풀고 노트는 계속 보충하면서 다음날 아침에 복습했다. 맞은 문제들도 인강에서 모두 확인하면서 맞게 풀었는지 점검했다. 이번 테스트에서는 8월 테스트때보다 훨씬 덜 긴장하고 푼 것 같다. 정답률이나 푸는 시간이 7월보다 훨씬 나아진게 보여서 기뻤다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"기출올인원의 전기화학, 용액 단원을 풀며 그 단원에서 특히 약한 상황들도 공부할 수 있었다. 문제 풀 때 의식적으로 상황 APS생각하면서 풀이하려고 노력했던 것도 적응된 것 같다. 또한, 모의고사 보기 전 열역학 실수노트를 읽어보고 시험 봤는데 덕분인지 해당 단원 문제를 실수 없이 연습대로 풀 수 있었다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
  `"박인규 선생님의 사고방식을 흡수하기 위하여 일단 매 강의를 시청하기 전 해당 범위의 문제풀이를 진행하고 문제가 틀렸건 맞았건 상관없이 처음부터 끝까지 2배속으로 유튜브 강의를 시청하고 오답 진행을 하고 있는 점" — Hcsg (26학년도 원광(약) 합격생)`,
  `"1) 계획을 잘 지킴. 2) 강의를 들으면서 박인규 선생님의 사고과정을 따라가려고 노력함. 항상 일관된 풀이와 사고과정을 배우는 것이기에 더 빠르게 복습할 수 있었음. 2) 이번 모의고사처럼 긴장되는 상황에서도 APS로 먼저 문제의 구조 및 단서를 확인하고 풀었음." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"1) 밀리지 않고 18강 배위화학까지 다 풀었다. 암기를 소홀히 했던 이성질체 부분과 입체구조 부분과 오비탈 플롯을 바짝 신경써서 외웠다. 2) 퀴즐렛을 통해 2000제 잘 못풀었던 15~18단원 문제들만 캡처 선별해 다시 풀어보았다. 못 푼 문제들만 선별해 다시 풀어보는 시간을 가지니 약점을 메꿀 수 있었다. 매주마다 아리까리한 문제, 시간 오래걸린 문제, 틀린 문제만 모아 퀴즐렛으로 꼭 주별 복습을 해야겠다." — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"이번 주에는 문제가 쉽든 어렵든 문제를 풀 때 정답의 근거를 확실히 찾고 선지 옆에 표시를 해서 정답의 확신을 갖고 풀어나가는 연습을 했다. 일요일에 진행된 타임어택 모의고사를 풀 때에도 분명 잘 풀었는데 괜히 실수한 부분은 없었을까 틀리진 않았을까 다시 보게되는 습관이 다시 나와서 생각보다 시험보는데 오래 걸렸긴 했다. 그래도 부족한 부분을 인지하고 있으니 연습해서 보완해나가면 되겠다는 생각이라 걱정이 없다." — 쿠리만쥰 (26학년도 5관왕 | 단국(약)·계명(제약)·삼육(약)·강원(약)·우석(약) 합격생)`,
  `"2000제 문제를 단원별+전체범위를 병행하여 매일 학습함. 단원별로 공부하니 불안한 것이 많이 해소되어 기본기가 다시 쌓이는 느낌이 들었음." — 레고링 (26학년도 계명(제약) 합격생)`,
  `"매일 계산문제를 꾸준히 풀었고, 지엽적인 내용들도 조금씩 정리해나가고 있다." — 약대진학 (26학년도 5관왕 | 중앙(약)·조선(약)·단국(약)·경성(약)·우석(약) 합격생)`,
  `"화학평형 단원이 잘 기억나지 않아 1500제와 병행해서 차근차근 학습했다." — 초록콩 (26학년도 순천(약) 합격생)`,
  `"코드 번호 3 완강하였고 나머지 코드 번호를 듣고 있습니다. 코드 번호 1 2 도 복습하면서 기본 풀이법을 계속 숙지하고 있습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"저번주와 마찬가지로 강의 수강과 단원별 암기 노트 만들기를 하였다. 이 방법이 확실히 나에게 잘 맞는 것 같다. 물질 변화 파트로 들어가니 조금 어려워져 1500제 먼저 복습해주고 2000제를 공부해주었다. 기본 개념 복습하고 문제를 푸니 더 잘 풀려서 좋았다. 모의고사에 대비해서 2000제 진도와 병행해서 1500제 개념 복습을 해주었다. 그리고 문제 풀면서 차분하게 문제 조건 놓치지 않고 실수하지 않도록 평소에 연습하였다. 그 덕분에 그동안은 알던 문제라도 다시 보면 틀리는 경우가 많았는데 이번 모의고사에서는 AP를 계속 떠올리면서 차분하게 푸니 2000제에서 본 문제들을 다 맞췄다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"일요일에 있는 시험을 대비해서 한 단원에 국한된 인강보다는 1500제 개념 전범위를 회독하고 2000제에서 약하다 싶은 단원의 문제들을 풀어봤다. 그렇게 했더니 오늘 시험에서 2개정도 틀렸고 시간도 엄청 남았다. 하지만 틀린 2개는 mol수를 압력으로 실수로 안바꿔서 틀린거고 99.9%를 0.001로 잘못 바꿔서 틀린거라 개념적인 구멍은 없는것 같다. 다 맞을 수도 있었어서 진짜 아쉽지만 그냥 삼키고 생각하지 말아야겠다." — 약대가쟝 (26학년도 단국(약) 합격생)`,
  `"코드4 수강 전에 코드1, 2에서 오답이었거나 고난이도였던 문제 80제를 뽑아서 다시 풀어봤다. 이 때문에 진도가 하루 밀리긴 했지만, 코드1, 2 전범위 문제를 빠르게 한 번 더 복습할 수 있어서 꼭 필요했던 것 같다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"박인규 선생님의 말씀처럼 문제를 풀며 이론을 익히는데 집중하였다. 나는 원래 너무 꼼꼼한 경향이 있어 이론에 집중하고 힘빠지고 그랬었는데 이제는 화학뿐만 아니라 유기 생물도 문제를 풀어보는게 개념을 정리하는데 정말 도움이 된다는 것을 느꼈다. 그날 이론은 그날 마인드 맵으로 정리하고 하루 공부 시작 전에 목차를 훑고 들어가면 빠르게 복습 가능해서 좋다 계속 aps를 실천하려고 노력했다. 무작정 펜을 가져가는게 아니라 이 단서들을 어떻게 조합할지 생각하고 문제를 풀었다. 사실 지금은 그 생각을 하는데 조금 시간이 걸리긴 한다. 그래도 풀다보면 점점 익숙해져서 그 시간이 줄어드는 것 같다." — 단퓨프 (26학년도 목포(약) 합격생)`,
  `"애니어그램 학습법처럼 화학공부 시작 전에 화학 공부 체크리스트를 읽고 오늘 화학공부에서 집중할 항목을 다이어리에 적고 화학공부를 시작했다. / 반복 횟수가 늘어남에 따라 이전에 신경 쓰지 못한 점(ex. 근사 기준, 답의 형태...)에 대해서도 생각해볼 여유가 생겼고, 이전엔 어렵게 느껴졌던 내용들도 이해할 수 있게 된 것 같다./ 전체 내용 구조를 중요시하며 헷갈리는 개념이 생기면 그에 해당하는 1500제 예제를 풀어보려 하였다./ 등수는 낮지만 이번 모의고사 결과가 매우 만족스럽다! 그동안 내가 올바른 방향으로 열심히 공부한 것 같아서 뿌듯했다. 마킹실수(1)랑 계산 실수 한 거(1) 빼면 사실상 내가 2000제 공부한 부분까지는 다 맞았어서 뿌듯했다!" — 시계탑기린친구 (26학년도 강원(수) 합격생)`,
  `"풀이방향을 생각하고 푸는 것이 조금씩 익숙해져 가는 듯 함 큰 도움이 됨." — 후회없이살자 (26학년도 강원(약) 합격생)`,
  `"문제를 꽤 많이 풀다보니 조금씩 자신이 붙기 시작했다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`,
  `"매일 한 단원씩 풀고 노트는 계속 보충하면서 다음날 아침에 복습했다. 맞은 문제들도 인강에서 모두 확인하면서 맞게 풀었는지 점검했다. 코드2때보다 전기화학에 대한 이해도가 좀 높아진게 느껴져 정확도나 속도가 개선되었다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
  `"기출올인원을 풀며, 2000제 일부와 1500제 목차 복습도 진행했다. 단원별로 부족했던 부분도 문제를 풀며 조금씩 보완했다. APS 생각하며 문제 푸는 습관은 유지하되 상식 파트 등의 정리가 필요한 것 같아서 암기 노트도 만들었다." — 라떼아아 (26학년도 4관왕 | 단국(약)·경상(약)·제주(약)·순천(약) 합격생)`,
  `"1) 내가 생각하는 최소한의 공부량과 공부 시간을 채움. 2) 화학 공부 체크리스트로 공부 방향성을 다시 점검함. 3) 핵심 써머리 부분에 강의 중 언급하시는 상식, 부가적인 내용을 정리하면서 공부함. 또한 복습할 때도 APS를 항상 지키면서 문제를 풂." — 이번엔내차례 (26학년도 삼육(약) 합격생)`,
  `"1) 점군, 분광학까지 2000제 마침 2) 기출올인원 단원별 연습도 중요하지만 모의고사 연습도 중요한 것같아 22, 23학년도 경희대 기출올인원을 시작했다. 3) 인규쌤 말대로 모의고사 연습하되, 단원별 문제 복습도 소홀히 하지 않아야 한다. 그래서 2000제 16,17단원 틀린, 주요문제 다시 복습함!" — 광어회우럭 (26학년도 7관왕 | 경상(약)·계명(제약)·전남(약)·전북(약)·제주(약)·강원(약)·우석(약) 합격생)`,
  `"2000제를 단원별로 풀고 연습 모의고사도 병행하며 단원별, 전범위 모두 학습함. 2000제 문제들은 편안하게 풀리는 느낌이 들었음. 다음주부터는 기출올인원을 시작하자." — 레고링 (26학년도 계명(제약) 합격생)`,
  `"화학강의를 들으며 계산 근사하는 법을 많이 배운것같다. 근사를 시원시원하게 하는게 나와 많이 차이났던것 같다." — 고냥이 (26학년도 경희(치)·경성(약) 합격생)`,
  `"저번주와 마찬가지로 코드번호 1 2 3복습하면서 나머지 코드번호 진도나갔습니다. 다음주에 완강하고 기출올인원으로 넘어갈 수 있도록 하겠습니다." — 으으은 (26학년도 조선(치)·우석(약) 합격생)`,
  `"저번 주와 마찬가지로 1500제 복습하고 2000제 강의 수강을 한 후 암기 노트를 만들었다. 원리를 이해하고 AP를 떠올리며 문제를 푸니 화학 열역학, 전기화학, 배위화합물 파트가 더 이상 어렵지 않고, 오히려 앞부분보다 쉽게 느껴졌다. 아직 코드 1, 2 문제를 풀고 있어서 비교적 쉬울 수 있지만, 이 기본기를 바탕으로 코드3 넘어가는 문제들도 나중에 어렵지 않게 풀 수 있을 거라 생각한다." — 별혜 (26학년도 6관왕 | 원광(약)·대가(약)·제주(약)·경성(약)·강원(약)·우석(약) 합격생)`,
  `"2000제 강의를 들으면서 전공 심화 내용과 지엽적인 내용을 구분해서 정리해두었고, 코드3 복습을 병행하면서 외워야 할 것들을 외우면서 진도를 나가고 있다." — Lamine (26학년도 3관왕 | 계명(제약)·목포(약)·연세(생화학) 합격생)`,
  `"이번주에 가장 잘한 점은 하루 30분 복습을 매일 실천했다는 점이다. 저번주 모의고사를 보면서 정말 익숙해져서 기계적으로 나올 수 있도록 연습해야하는구나를 느꼈다. 확실히 그냥 공부하면서 문제를 풀 때랑 느껴지는 압박감이 달랐던 것 같다. 그래서 1500제 문제들을 3장부터 하루 30분씩 복습했다. 복습을 하니 확실히 전보다 불안감이 덜해졌다. 그리고 복습을 할 때도 계속 aps를 생각하며 체계적으로 풀려 노력했다. 아직은 빨리 풀지는 못하지만 그래도 이것이 반복되면 문제를 보고 바로 단서를 파악하고 박인규 선생님말씀처럼 기본기 조합으로 응용 문제를 풀 수 있을 것이다. 다음으로 잘한 점은 원래는 마인드맵으로 복습을 진행했는데 생각보다 가시성이 안좋고 한눈에 잘 안들어오는 것 같아 6장부터 학습을 하고 해당 이론과 문제 풀며 주의할 내용을 a4에 정리를 하였다. 직접 쓴 글씨로 보고 내가 이해한 내용에 맞춰 쓴 정리본이라 더 머리에 잘 들어왔다." — 단퓨프 (26학년도 목포(약) 합격생)`,
  `"적당한 계획량을 저번주에 잘 세워 불필요한 스트레스 없이 편안하게 공부할 수 있었다." — 시계탑기린친구 (26학년도 강원(수) 합격생)`,
  `"화학의 기본 내용을 다 알고 있다고 생각했지만 편입 화학에서는 아직 모르는 내용이 있다는것을 알게됐습니다. 그래서 애매하거나 모르고 있던 개념들이 생긴 파트부터 1500제로 다시 공부하며 기본 상식과 개념을 채웠습니다. 어렵게 풀던 문제도 더 쉽게 푸는 방법이 있었고 모르고 있던 내용도 새롭게 배울 수 있었습니다." — 후회없이살자 (26학년도 강원(약) 합격생)`,
  `"목표한 강의를 다 들을 수 있었다. 1,2번 문제를 열심히 풀면서 평형도 어느정도 자신이 생기는 것 같다." — 진강강민 (26학년도 순천(약)·연세(생공) 합격생)`,
  `"점군과 분광학까지 모두 풀면서 2000제 코드3을 모두 풀었다. 처음 배우는 것들이라 걱정했지만 생각보다 괜찮았다. 지엽적 내용이나 헷갈리는 내용을 모은 노트도 계속 채워나가고 있으며 모의고사를 보기 전에는 항상 그 노트를 볼 만큼 많이 채워졌다." — 승민 (26학년도 단국(약)·연세(생화학) 합격생)`,
