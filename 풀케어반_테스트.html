// ── Firestore 헬퍼 ──
async function saveSubmission(data){
  const key=`${data.name}_${data.month}-${data.week}`;
  await fsdb.collection("submissions").doc(key).set({...data,submittedAt:firebase.firestore.FieldValue.serverTimestamp()});
}
async function saveFeedback(key,fb){
  await fsdb.collection("submissions").doc(key).update({generatedFeedback:fb,feedbackAt:firebase.firestore.FieldValue.serverTimestamp()});
}
async function loadPrev(name,month,week){
  const pw=Number(week)-1,pm=pw<1?Number(month)-1:Number(month),pW=pw<1?4:pw;
  if(pm<7)return null;
  // 메모리 캐시 우선
  const cached=S.subs.find(s=>s.data.name===name&&String(s.data.month)===String(pm)&&String(s.data.week)===String(pW));
  if(cached)return cached.data;
  const doc=await fsdb.collection("submissions").doc(`${name}_${pm}-${pW}`).get();
  return doc.exists?doc.data():null;
}
function hasPrev(name,month,week){
  const pw=Number(week)-1,pm=pw<1?Number(month)-1:Number(month),pW=pw<1?4:pw;
  if(pm<7)return false;
  return S.subs.some(s=>s.data.name===name&&String(s.data.month)===String(pm)&&String(s.data.week)===String(pW));
}

  await fsdb.collection("config").doc("roster").set({names});

  await fsdb.collection("submissions").doc(key).delete();

## 홍성찬 선생님 피드백 스타일 가이드

### 말투·톤
- 따뜻하고 직접적. 잘한 것은 확실히 칭찬하고, 보완할 것은 구체적으로 방향 제시
- "굿!", "굿굿!", "정말 잘했어요!", "아주 훌륭합니다!", "홍쌤이 봤을 때도 정말 잘하고 있어요 :)", ":)", "^^", "^^ㅎㅎ" 같은 표현 자연스럽게 사용
- "넘 걱정말고", "전혀 문제없습니다", "충분합니다" — 불필요한 걱정은 풀어주기
- "~해주시기 바랍니다", "~해주세요", "~하면 됩니다" 혼용. 딱딱하지 않게
- 애니어그램 유형이 있으면 자연스럽게 연결: "9번 유형의 강점인 꾸준함이 잘 나오고 있어요", "7번답게 유연하게 학습법을 바꿔보면서"
- "화이팅!" 또는 ":)" 로 과목별 마무리. 전체 마지막엔 따뜻하게 마무리

### 핵심 철학 (자연스럽게 녹여 쓸 것)
- 진도보다 숙련도: "진도보다 중요한 건 쌓이는 공부, 숙련도를 높이는 학습입니다"
- 생물은 이론 우선: "생물은 문제만 풀면 절대 좋은 점수 얻기 어렵습니다. 기본서(캠벨+꿀벌책)를 여러 번 보면서 이론을 다져야 합니다"
- 공부한 건 틀리지 않기: "쉬운 문제에서 미스 나지 않도록, 공부한 건 반드시 맞힌다는 마음으로"
- 강의는 보조수단: "강의보다 기본서를 직접 읽는 게 훨씬 빠릅니다"
- 생활관리 = 운송수단: "생활관리는 목표에 도달하게 해주는 운송수단과 같습니다. 아무리 좋은 학습법도 생활관리가 안 되면 무용지물입니다"
- 합격 가능성 열어두기: "VF 하위권이어도 올바른 방향으로 꾸준히 하면 합격 충분합니다"

### 구조
과목별로 작성: "생물 :", "화학 :", "유기 :", "생활관리 :" (해당 과목 데이터 있는 것만)
각 과목: 잘한 점 인정 → 이번 달 학습 방향 기준으로 진단 → 구체적 보완 가이드 → 격려
생활관리: 운동/수면/멘탈/애니어그램 학습법 실천 여부 중심으로

### 실제 피드백 예시 (말투 참고용)

[예시 1 — 박찬빈 학생, 8월]
생물 : 홍쌤이 봐도 이번주에 생물은 정말 훌륭하게 잘 학습한 것 같네요!! 스스로 약점을 찾아 보완하고 기본서도 읽고 박선우 OX도 더 풀고 정말 잘했어요. 이렇게 스스로 뿌듯한 공부가 쌓여가면 합격은 충분합니다 :) 굿!
화학 : 화학은 기본 실력도 괜찮은 편이니 지금처럼 약한 단원 위주로 학습하고 그 외 시간에 부족한 생물/유기를 더 채우는 학습도 좋습니다. 체크리스트 항상 확인하면서 올바른 방향으로 공부하고 있는지 스스로 점검해주세요.
유기 : 쉬운 문제를 언제 풀어도 실수나 미스 없이 빠르고 정확히 풀 수 있도록 예제를 여러 번 풀기 + 이론 적용됨을 느끼면서 풀기를 해주시기 바랍니다.
생활관리 : 생활관리가 거의 완벽했다고 보여집니다! 운동도 적절히 조절하고 정말 훌륭해요. 굿!!

[예시 2 — 권서영 학생, 8월]
생물 : 이번 VF 문제 범위가 조금 많긴 했습니다 ^^ㅎㅎ 그래도 캠벨과 꿀벌책을 같이 읽었다는 건 정말 잘했고 열심히 공부한 것 같아요. 7월에 생물 전범위를 다 보는 게 절대 쉬운 일이 아닙니다. 이렇게 해내면 8, 9월에 다시 전범위 볼 때 훨씬 수월해질 거예요 :)
화학 : APS 지금처럼 꾸준히 연습하시고, 박인규 선생님 올바른 학습법 체크리스트도 주기적으로 확인하면서 방향성 잃지 않도록 노력해주세요.
유기 : 유기화학은 최소 1시간은 매일 해야 합니다. 학습시간은 생물:화학:유기 = 4:4:3 시간으로 잡아보시면 좋겠어요.
생활관리 : 불안감이나 잡념이 많을수록 고강도 운동으로 현실감각을 느껴주세요. 걷기보다는 런닝으로 땀이 나도록 뛰는 게 더 효과적입니다. 애니어그램 9번 학습법 매일 읽고 학습 시작해주세요!

[예시 3 — 강민재 학생, 8월]
생물 : 기본서 2권을 정말 효율적으로, 홍쌤이 원했던 방향대로 학습효과가 잘 나오고 있는 것 같습니다. 맥락 속에서 이해를 하면 자연스럽게 외워지는 것들이 생기는데 이렇게 해야 생물이 암기라는 부담이 덜어지거든요. 정말 좋습니다!! 뒤로 갈수록 심화 공부를 하게 되다 보니 기본기를 잊어버리는 경우가 생길 수 있으니 그 부분만 염두에 두고 학습해주세요.
화학 : 진도보다 중요한 건 숙련도를 높이는 학습입니다. 방향성이 정확하다면 진도는 조금 밀려도 전혀 문제없어요. 박인규 선생님 올바른 학습법 체크리스트를 주기적으로 확인하면서 올바른 방향으로 노력해주세요.
유기 : 유기화학은 꼭 손으로 써보면서 공부해야 머리에 남습니다. 눈으로만 풀기보다는 항상 손으로 메커니즘을 그려보면서 학습해주세요.

// ── Claude API ──
async function callClaude(prompt,apiKey){
  const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-4-5",max_tokens:1800,messages:[{role:"user",content:prompt}]})});
  const data=await res.json();const text=(data.content||[]).map(b=>b.text||"").join("");if(!text)throw new Error(data.error?.message||"API 오류");return text;
}

async function submitForm(){
  const name=document.getElementById("name-select")?.value||S.name;
  if(!name){set({formError:"이름을 선택해주세요."});return}
  const school=document.getElementById("school-input")?.value||S.school;
  const pledge=document.getElementById("pledge-input")?.value||S.nw.다짐||"";
  document.querySelectorAll("textarea[data-subj]").forEach(el=>{const s=el.dataset.subj,f=el.dataset.field;if(s&&f)S.subjects={...S.subjects,[s]:{...S.subjects[s],[f]:el.value}}});
  document.querySelectorAll("[data-nw]").forEach(el=>{const k=el.dataset.nw;if(k)S.nw={...S.nw,[k]:el.value}});
  S.nw.다짐=pledge;
  if(!ALL_SUBS.some(s=>S.subjects[s]?.study||S.subjects[s]?.good||S.subjects[s]?.improve)){set({formError:"최소 1개 과목 이상 입력해주세요."});return}
  set({submitting:true,formError:""});
  try{
    await saveSubmission({name,month:S.month,week:S.week,trait:S.trait,school,subjects:S.subjects,nw:S.nw});
    set({step:"done",name,school,submitting:false});
  }catch(e){set({formError:"저장 실패: "+e.message,submitting:false});}
}

  const notSubmitted=S.roster.filter(n=>!submittedNames.has(n));
  const submitted=S.roster.filter(n=>submittedNames.has(n));
  const absentCard=S.roster.length>0?`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:13px"><div class="card-head" style="margin-bottom:0">📊 제출 현황</div><div style="display:flex;gap:6px;align-items:center"><select style="width:auto;padding:5px 9px;font-size:12px;border-radius:7px" onchange="set({checkMonth:this.value})">${["7","8","9","10","11","12"].map(m=>`<option value="${m}"${m===S.checkMonth?" selected":""}>${m}월</option>`).join("")}</select><select style="width:auto;padding:5px 9px;font-size:12px;border-radius:7px" onchange="set({checkWeek:this.value})">${["1","2","3","4"].map(w=>`<option value="${w}"${w===S.checkWeek?" selected":""}>${w}주</option>`).join("")}</select></div></div><div style="display:flex;gap:8px;margin-bottom:${notSubmitted.length>0?12:0}px"><div style="flex:1;background:#e8f9ed;border-radius:10px;padding:11px;text-align:center"><div style="font-size:22px;font-weight:700;color:#1a7a3a">${submitted.length}</div><div style="font-size:11px;color:#2e8b57;margin-top:2px">제출 완료</div></div><div style="flex:1;background:${notSubmitted.length>0?"#fff5f5":"#f5f5f7"};border-radius:10px;padding:11px;text-align:center"><div style="font-size:22px;font-weight:700;color:${notSubmitted.length>0?"#c0392b":"#aeaeb2"}">${notSubmitted.length}</div><div style="font-size:11px;color:${notSubmitted.length>0?"#c0392b":"#aeaeb2"};margin-top:2px">미제출</div></div><div style="flex:1;background:#f0f0f2;border-radius:10px;padding:11px;text-align:center"><div style="font-size:22px;font-weight:700;color:#3a3a3c">${S.roster.length}</div><div style="font-size:11px;color:#6e6e73;margin-top:2px">전체</div></div></div>${notSubmitted.length>0?`<div style="background:#fff5f5;border-radius:10px;padding:11px 14px"><div style="font-size:11px;font-weight:600;color:#c0392b;margin-bottom:8px">⚠️ 미제출자 (${notSubmitted.length}명)</div><div style="display:flex;flex-wrap:wrap;gap:5px">${notSubmitted.map(n=>`<span style="background:#fde8e8;color:#c0392b;border-radius:20px;padding:3px 11px;font-size:12px;font-weight:500">${esc(n)}</span>`).join("")}</div></div>`:`<div style="background:#e8f9ed;border-radius:10px;padding:10px 14px;text-align:center;font-size:12px;color:#1a7a3a;font-weight:600">🎉 ${S.checkMonth}월 ${S.checkWeek}주차 전원 제출 완료!</div>`}</div>`:"";

  const tabBar=`<div class="card" style="padding:0 6px"><div style="display:flex;border-bottom:1px solid #f0f0f2"><button class="nav-tab${S.tab==="list"?" active":""}" onclick="set({tab:'list'})">📋 제출 목록 (${S.subs.length}건)</button>${S.sel?`<button class="nav-tab${S.tab==="detail"?" active":""}" onclick="set({tab:'detail'})">💬 ${esc(S.sel.data.name)} ${S.sel.data.month}월 ${S.sel.data.week}주차</button>`:""}</div></div>`;

  let listHTML="";
  if(S.tab==="list"){
    if(!S.subs.length)listHTML=`<div class="card" style="text-align:center;padding:44px 20px;color:#aeaeb2;font-size:13px">아직 제출된 데이터가 없어요<br><span style="font-size:11px;margin-top:4px;display:block">학생용 탭에서 제출하면 여기에 자동으로 나타나요</span></div>`;
    else listHTML=`<div>${S.subs.map((item,i)=>{const d=item.data,hasFb=!!d.generatedFeedback,hp=hasPrev(d.name,d.month,d.week);return`<div class="list-item${hasFb?" has-fb":""}" onclick="selectSub(${i})"><div style="flex:1"><div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-wrap:wrap"><strong style="font-size:14px">${esc(d.name)}</strong><span class="tag tag-gray">${d.month}월 ${d.week}주차</span>${d.trait?`<span class="tag tag-blue">${esc(d.trait)}</span>`:""}${hp?`<span class="tag tag-orange">📎 저번주 연결</span>`:""}${hasFb?`<span class="tag tag-green">✅ 피드백완료</span>`:""}</div>${d.school?`<div style="font-size:11px;color:#86868b;margin-bottom:3px">🏫 ${esc(d.school)}</div>`:""}<div style="font-size:11px;color:#aeaeb2">${d.submittedAt?.toDate?d.submittedAt.toDate().toLocaleString("ko-KR"):""}</div></div><button onclick="event.stopPropagation();delSub('${esc(item.key)}')" style="background:none;border:none;color:#d1d1d6;font-size:18px;padding:0 4px;cursor:pointer">🗑</button></div>`}).join("")}</div>`;
  }

  let detailHTML="";
  if(S.tab==="detail"&&S.sel){
    const d=S.sel.data,prev=S.prevData;
    const prevSection=prev?`<div class="prev-box"><div style="font-size:12px;font-weight:600;color:#a05f00;margin-bottom:10px">📎 저번주(${prev.month}월 ${prev.week}주차) 보완할점 → 이번주 개선 여부</div>${ALL_SUBS.map(s=>{const p=prev.subjects?.[s]?.improve,c=d.subjects?.[s];if(!p)return"";return`<div class="prev-row"><div style="font-size:11px;font-weight:600;color:#3a3a3c;margin-bottom:3px">${s}</div><div style="font-size:11px;color:#c0392b">저번주: ${esc(p)}</div>${c?.good?`<div style="font-size:11px;color:#1a7a3a;margin-top:2px">✅ 이번주 잘한점: ${esc(c.good)}</div>`:""}${c?.improve?`<div style="font-size:11px;color:#a05f00;margin-top:2px">🔧 이번주 보완점: ${esc(c.improve)}</div>`:""}</div>`}).join("")}</div>`:"";
    const subDetail=ALL_SUBS.map(s=>{const sd=d.subjects?.[s];if(!sd)return"";return`<div class="detail-sub ${SUB_CLASS[s]}"><div style="font-size:12px;font-weight:600;margin-bottom:4px">${SUB_ICON[s]} ${s}</div>${sd.study?`<div style="font-size:11px;color:#6e6e73;margin-bottom:2px">📖 ${esc(sd.study)}</div>`:""}${sd.good?`<div style="font-size:11px;color:#1a7a3a;margin-bottom:2px">✅ ${esc(sd.good)}</div>`:""}${sd.improve?`<div style="font-size:11px;color:#c0392b">🔧 ${esc(sd.improve)}</div>`:""}</div>`}).join("");
    detailHTML=`<div>${prevSection}<div class="card"><div class="card-head">${esc(d.name)} — ${d.month}월 ${d.week}주차 제출 내용</div>${subDetail}${d.nw?.다짐?`<div style="background:#f0f4ff;border-radius:9px;padding:9px 12px;font-size:12px;color:#0059b3;margin-top:6px">✨ 다짐: ${esc(d.nw.다짐)}</div>`:""}</div>
    <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:13px"><div class="card-head" style="margin-bottom:0">💬 자동 생성 피드백</div><div style="display:flex;gap:6px"><button class="btn-ghost btn-sm" onclick="previewPrompt()">프롬프트 보기</button><button class="btn-blue${S.generating?" disabled":""}" onclick="generateFeedback()" ${S.generating?"disabled":""}>${S.generating?"생성 중...":S.generated?"🔄 재생성":"🤖 피드백 생성"}</button></div></div>
    ${S.showPrompt?`<div class="prompt-box"><div style="display:flex;justify-content:space-between;margin-bottom:7px"><strong style="font-size:12px">Claude에게 전달되는 프롬프트</strong><button onclick="set({showPrompt:false})" style="background:none;border:none;color:#aeaeb2;cursor:pointer;font-size:18px;line-height:1">×</button></div>${esc(S.promptText)}</div>`:""}
    ${S.generating?`<div style="text-align:center;padding:44px 20px;color:#86868b;font-size:13px">🤖 강사님 스타일로 피드백 생성 중...</div>`:""}
    ${!S.generating&&S.generated?`<div class="fb-box">${esc(S.generated)}</div><div style="display:flex;gap:8px"><button onclick="copyFeedback()" style="flex:1;background:${S.copied?"#34c759":"#0071e3"};color:#fff;border:none;padding:12px;border-radius:10px;font-size:13px;font-weight:600">${S.copied?"✅ 복사됨!":"📋 피드백 복사"}</button><button class="btn-ghost" onclick="set({tab:'list'})">목록으로</button></div><div style="margin-top:9px;background:#e8f0fb;border-radius:8px;padding:8px 11px;font-size:11px;color:#0059b3">💡 복사 후 VF 플랫폼에 붙여넣기 하시면 됩니다.</div>`:""}
    ${!S.generating&&!S.generated?`<div style="text-align:center;padding:32px 20px;color:#aeaeb2;font-size:13px">피드백 생성 버튼을 누르면 자동으로 만들어져요<br><span style="font-size:11px">(API 키 필요)</span></div>`:""}
    </div><button class="btn-ghost" onclick="set({tab:'list'})" style="width:100%;padding:11px;margin-bottom:24px">← 목록으로 돌아가기</button></div>`;
  }

  return`<div class="wrap">
  <div class="card" style="background:linear-gradient(135deg,#1a3a5c,#2a5a8a);color:#fff;border:none;display:flex;justify-content:space-between;align-items:center">
    <div><div style="font-size:15px;font-weight:700">풀케어반 선생님 대시보드</div><div style="font-size:11px;color:rgba(255,255,255,.55);margin-top:4px">학생 제출 목록 확인 · 피드백 자동 생성</div></div>
    <div style="display:flex;align-items:center;gap:12px">
      <img src="cropped-circle.png" style="height:38px;opacity:.85;flex-shrink:0">
      <button onclick="" style="background:rgba(255,255,255,.12);color:#fff;border:none;padding:8px 15px;border-radius:9px;font-size:12px">🔴 실시간 연결</button>
    </div>
  </div>
  ${apiSection}${rosterSection}${absentCard}${tabBar}${listHTML}${detailHTML}
  </div>`;
}

// ── 액션 ──
function saveApiKey(){const v=document.getElementById("api-input")?.value||"";localStorage.setItem("_apikey",v);set({apiKey:v,showKey:false})}

async function addStudent(){
  const n=(document.getElementById("roster-add-input")?.value||T.rosterInput||"").trim();
  if(!n||S.roster.includes(n))return;
  const r=[...S.roster,n];
  await saveRoster(r);
  set({roster:r});
  setTimeout(()=>{const el=document.getElementById("roster-add-input");if(el){el.value="";T.rosterInput="";}},0);
}
async function removeStudent(name){
  const r=S.roster.filter(n=>n!==name);
  await saveRoster(r);
  set({roster:r});
}

async function selectSub(i){
  const item=S.subs[i];if(!item)return;
  const prev=await loadPrev(item.data.name,item.data.month,item.data.week);
  set({sel:item,tab:"detail",prevData:prev,generated:item.data.generatedFeedback||"",showPrompt:false});
}
async function delSub(key){
  if(!confirm("이 데이터를 삭제할까요?"))return;
  await delSubmission(key);
  set({sel:S.sel?.key===key?null:S.sel,tab:S.sel?.key===key?"list":S.tab});
}
function previewPrompt(){
  if(!S.sel)return;
  set({showPrompt:!S.showPrompt,promptText:buildPrompt({...S.sel.data,prevRecord:S.prevData})});
}
async function generateFeedback(){
  if(!S.sel)return;if(!S.apiKey.trim()){alert("API 키를 먼저 입력해주세요.");return}
  set({generating:true,generated:""});
  try{
    const result=await callClaude(buildPrompt({...S.sel.data,prevRecord:S.prevData}),S.apiKey);
    await saveFeedback(S.sel.key,result);
    set({generated:result,generating:false});
  }catch(e){set({generated:"오류: "+e.message,generating:false});}
}
function copyFeedback(){navigator.clipboard?.writeText(S.generated).then(()=>{set({copied:true});setTimeout(()=>set({copied:false}),2000)})}

// ── 렌더 ──
function render(){
  const nav=`<nav class="nav"><div class="nav-inner"><button class="nav-tab${S.mode==="student"?" active":""}" onclick="set({mode:'student'})">🙋 학생용</button><button class="nav-tab${S.mode==="instructor"?" active":""}" onclick="set({mode:'instructor'})">👨‍🏫 선생님용</button><span class="nav-badge">Firebase 연결됨</span></div></nav>`;
  document.getElementById("app").innerHTML=nav+(S.mode==="student"?buildStudentForm():buildInstructor());
}

// ── 초기화 (실시간 리스너) ──
async function initApp(){
  try{
    // 명단 로드
    const rosterDoc=await fsdb.collection("config").doc("roster").get();
    S.roster=rosterDoc.exists?(rosterDoc.data().names||[]):[];

    // 제출 데이터 실시간 구독 (학생 제출 시 선생님 화면 자동 갱신)
    fsdb.collection("submissions").orderBy("submittedAt","desc").onSnapshot(snap=>{
      S.subs=snap.docs.map(doc=>({key:doc.id,data:doc.data()}));
      render();
    });
  }catch(e){
    document.getElementById("app").innerHTML=`<div class="loading-wrap"><div style="font-size:32px">⚠️</div><div>Firebase 연결 실패: ${e.message}</div></div>`;
  }
}

initApp();
</script>
</body>
</html>
