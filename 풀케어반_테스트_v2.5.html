<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',-apple-system,sans-serif;background:#f5f5f7;color:#1d1d1f;min-height:100vh;font-size:14px}
input,select,textarea,button{font-family:inherit;font-size:13px}
input,select,textarea{width:100%;border:1px solid rgba(0,0,0,.14);border-radius:9px;padding:8px 11px;background:#fff;color:#1d1d1f;outline:none;transition:border-color .15s}

textarea{resize:vertical;line-height:1.6;min-height:54px}
button{cursor:pointer;border:none;border-radius:9px;font-weight:500;transition:all .15s}
.nav{background:rgba(255,255,255,.85);backdrop-filter:blur(20px);border-bottom:1px solid rgba(0,0,0,.1);position:sticky;top:0;z-index:100}
.nav-inner{max-width:720px;margin:0 auto;display:flex;align-items:center;padding:0 16px}
.nav-tab{padding:14px 20px;background:none;border:none;border-bottom:2px solid transparent;color:#86868b;font-size:13px;font-weight:500;cursor:pointer;margin-bottom:-1px}
.nav-tab.active{color:#1d1d1f;border-bottom-color:#1d1d1f;font-weight:700}
.nav-badge{margin-left:auto;font-size:11px;color:#aeaeb2;padding:0 8px}
.wrap{max-width:720px;margin:0 auto;padding:16px}

.lbl{display:block;font-size:11px;color:#86868b;margin-bottom:5px;font-weight:500}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
.subj{background:#f5f5f7;border-radius:11px;padding:13px 15px;margin-bottom:10px}
.subj-title{font-size:13px;font-weight:600;color:#1d1d1f;margin-bottom:11px}
.btn-primary{background:#1d1d1f;color:#fff;padding:13px 24px;font-size:14px;font-weight:600;width:100%;border-radius:12px;margin-bottom:20px}

.btn-blue:hover{background:#0077ed}
.btn-blue:disabled{background:#aeaeb2;cursor:not-allowed}

.btn-ghost:hover{background:#f5f5f7}
.btn-sm{padding:6px 12px;font-size:11px;border-radius:7px}
.tag{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:500}
.tag-gray{background:#f0f0f2;color:#6e6e73}
.tag-blue{background:#e8f0fb;color:#0059b3}
.tag-orange{background:#fff5e0;color:#c45400}
.tag-green{background:#e8f9ed;color:#1a7a3a}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px}
.dot-on{background:#34c759}.dot-off{background:#ff3b30}
.err{background:#fff5f5;border:1px solid #fecaca;border-radius:9px;padding:9px 13px;font-size:12px;color:#c0392b;margin-bottom:10px}
.list-item{border:1px solid rgba(0,0,0,.09);border-radius:12px;padding:13px 16px;margin-bottom:8px;background:#fff;display:flex;justify-content:space-between;align-items:flex-start;cursor:pointer;transition:box-shadow .12s}

.list-item.has-fb{border-color:rgba(52,199,89,.3);background:#f9fff9}
.prev-box{background:#fffdf7;border:1px solid rgba(200,150,0,.25);border-radius:13px;padding:15px 17px;margin-bottom:12px}
.prev-row{padding:8px 0;border-bottom:1px solid rgba(200,150,0,.15)}
.prev-row:last-child{border-bottom:none}
.fb-box{background:#fafafa;border:1px solid rgba(0,0,0,.08);border-radius:13px;padding:16px;font-size:13px;line-height:1.9;white-space:pre-wrap;margin-bottom:12px;color:#1d1d1f}

.nw-table th,.nw-table td{padding:5px 6px;text-align:center}
.nw-table thead tr{background:#f0f0f2}
.nw-table thead th{font-weight:600;color:#3a3a3c;font-size:11px}
.nw-table tbody tr{border-top:1px solid #f0f0f2}
.nw-table .row-lbl{text-align:left;font-size:11px;color:#6e6e73;font-weight:500;white-space:nowrap}

.apikey-box{border:1px solid #d0e2f9;border-radius:13px;padding:14px 17px;background:#f0f6ff;margin-bottom:12px}
.detail-sub{border-left:3px solid #e0e0e0;padding-left:12px;margin-bottom:12px}

.loading-wrap{display:flex;align-items:center;justify-content:center;height:60vh;flex-direction:column;gap:14px;color:#86868b;font-size:14px}
.spinner{width:36px;height:36px;border:3px solid #e0e0e0;border-top-color:#0071e3;border-radius:50%;animation:spin .8s linear infinite}

</style>
</head>

      `"박선우 써머리 OX가 MDP 선지를 변형한 거라 진짜 중요해요. 이걸 인지하고 풀었더니 나중에 기출 풀 때 익숙한 게 많이 나왔어요." — 강민재 (26학년도 대/약대 합격생)`
    ],
    화학:[
      `"APS가 자동으로 나오기 시작한 게 8월 중순이었어요. 그 전까진 느려도 AP 한 줄 쓰고 풀기 습관 꼭 지켰어요. 2000제 진입했을 때 기본기 차이가 확 느껴졌어요." — 박찬빈 (26학년도 대/약대 합격생)`,
      `"1500제 완강하고 2000제 코드1·2 중심으로 들어갔어요. 코드4·5는 파악 정도만 하고 1·2·3 반복에 집중했어요. 이 선택이 맞았어요." — 권서영 (26학년도 대/약대 합격생)`,
      `"타임어택 모의고사 1회 풀고 나서 내 실력 객관화됐어요. 점수보다 어떤 유형에서 막히는지 파악하는 게 목적이에요." — 강민재 (26학년도 대/약대 합격생)`
    ],
    유기:[
      `"8월에도 매일 1시간은 무조건 유기. 포기하고 싶었지만 막판에 갑자기 열렸어요. 이 시기에 손 메커니즘 그리기 습관 안 잡으면 나중에 더 힘들어요." — 박찬빈 (26학년도 대/약대 합격생)`,
      `"1회독 진행 중에 이해 안 되는 단원은 약사랑 강의 한 번 보고 바로 예제 손으로 풀었어요. 강의만 보지 말고 반드시 손으로 그리는 게 세트예요." — 권서영 (26학년도 대/약대 합격생)`,
      `"매일 유기 1시간 확보 못 하는 날엔 30분이라도 했어요. 하루 끊기면 감각이 확 떨어져요. 꾸준함이 유기에서 제일 중요한 것 같아요." — 강민재 (26학년도 대/약대 합격생)`
    ],
    생활관리:[
      `"8월 더워서 체력 관리가 진짜 중요했어요. 저녁 런닝 주 3회 지켰는데 집중력이 확실히 달라졌어요. 운동 빠지면 다음날 공부 효율이 눈에 띄게 떨어졌어요." — 박찬빈 (26학년도 대/약대 합격생)`,
      `"불안감이나 잡념이 많을수록 고강도 운동으로 현실감각을 찾았어요. 걷기보다는 런닝으로 땀 나도록 뛰는 게 훨씬 효과적이에요." — 권서영 (26학년도 대/약대 합격생)`,
      `"애니어그램 학습법 카드 매일 아침 읽고 시작했어요. 처음엔 별거 아닌 것 같았는데 내 패턴을 인식하는 게 생각보다 많이 도움됐어요." — 강민재 (26학년도 대/약대 합격생)`
    ]
  },
  "9":{
    생물:[
      `"전국 오픈 모의 점수 보고 멘탈 흔들렸는데 홍쌤이 VF 수준이 높다고 하셔서 믿었어요. 실제 시험엔 훨씬 잘 나왔어요. 점수 비교 말고 복기에만 집중하세요." — 박찬빈 (26학년도 대/약대 합격생)`,
      `"MDP 기출 풀 때 퀴즐렛 1200제 같이 쓰니까 이론 재확인이 훨씬 빨랐어요. MDP 선지를 OX로 다시 보는 거라 시너지가 확실해요." — 권서영 (26학년도 대/약대 합격생)`,
      `"중앙대·경희대 기출 재배치 모의고사 주 3회가 처음엔 부담됐는데 이게 실전 감각을 키워줬어요. 틀린 문제 캠벨 확인하는 루틴 꼭 지켰어요." — 강민재 (26학년도 대/약대 합격생)`
    ],
    화학:[
      `"실수노트 9월부터 쓰기 시작했는데 시험장에서 진짜 큰 도움됐어요. 틀린 패턴이 보여요. 늦게 시작할수록 손해예요." — 박찬빈 (26학년도 대/약대 합격생)`,
      `"타임어택 2회차는 실전처럼 응시하고 오답까지 복기했어요. 점수보다 어떤 유형에서 시간 잡아먹는지 분석하는 게 목적이에요." — 권서영 (26학년도 대/약대 합격생)`,
      `"개인별 연습 모의고사 6회 다 실전처럼 풀었어요. 중간에 쉬고 싶어도 꾸준히 응시한 게 10월 타임어택 성적에 바로 나왔어요." — 강민재 (26학년도 대/약대 합격생)`
    ],
    유기:[
      `"9월 안에 1회독 꼭 끝내야 해요. 저도 간신히 끝냈는데 그게 없었으면 10월이 너무 힘들었을 것 같아요." — 박찬빈 (26학년도 대/약대 합격생)`,
      `"반응 메커니즘은 무조건 손으로 그려야 기억에 남아요. 눈으로 '아 이렇구나' 하는 건 시험장에서 100% 안 나와요." — 권서영 (26학년도 대/약대 합격생)`,
      `"9월엔 유기 이해가 아직 안 된다고 느꼈는데 계속 했어요. 11월 초에 갑자기 구조가 눈에 들어왔어요. 믿고 계속 하세요." — 강민재 (26학년도 대/약대 합격생)`
    ],
    생활관리:[
      `"9월부터 슬럼프 오는 사람 많아요. 고강도 운동으로 버텼어요. 몸이 힘들면 딴생각 할 겨를이 없어요." — 박찬빈 (26학년도 대/약대 합격생)`,
      `"전국 모의 점수로 불안해지는 시기인데 운동이 멘탈을 잡아줬어요. 런닝하고 나면 불안이 줄고 집중력이 올라오는 게 느껴졌어요." — 권서영 (26학년도 대/약대 합격생)`,
      `"9월엔 공부량 욕심내다 수면 줄이는 사람이 많아요. 저는 7시간 수면을 절대 타협 안 했어요. 결국 그게 마지막까지 버티는 힘이었어요." — 강민재 (26학년도 대/약대 합격생)`
    ]
  },
  "10":{
    생물:[
      `"기출N적중400제 풀 때 기본서로 내용 확인하는 시간 꼭 넣었어요. 그 시간이 아깝지 않았어요. 박선우 써머리 단권화 이 시기에 시작하면 딱 맞아요." — 박찬빈 (26학년도 대/약대 합격생)`,
      `"기출 풀고 나서 오답만 기본서 확인하는 게 핵심이에요. 다 읽으려 하면 시간이 너무 많이 걸려요. 틀린 것만 집중 확인하는 방식이 맞아요." — 권서영 (26학년도 대/약대 합격생)`,
      `"써머리 오답노트 단권화를 10월부터 시작했어요. 시험 전날 그것만 봤는데 정말 큰 도움됐어요. 이 시기에 시작 안 하면 나중에 바빠서 못 해요." — 강민재 (26학년도 대/약대 합격생)`
    ],
    화학:[
      `"전략단원 10월에 확정했어요. 정답률 85% 이상 단원 먼저 푸는 연습 반복했어요. 타임어택 8회가 많아 보이지만 이 시기에 실전 감각이 잡혀요." — 박찬빈 (26학년도 대/약대 합격생)`,
      `"3사이클 전략 이 시기부터 연습했어요. 처음엔 어색했는데 모의고사 3번 쓰니까 자동으로 됐어요. 시험장에서 처음 쓰면 무조건 실수해요." — 권서영 (26학년도 대/약대 합격생)`,
      `"민동준T 노하우 특강 듣고 실수노트·약점노트·전략노트 세 개 만들었어요. 밥 먹으면서 약점노트 확인하는 게 습관이 됐어요." — 강민재 (26학년도 대/약대 합격생)`
    ],
    유기:[
      `"작용기+시약 암기 체화 안 됐으면 지금 집중하세요. 이게 안 되면 실전에서 막혀요. VF 제공 단원별 실전 문제 기한 맞춰 다 풀었어요." — 박찬빈 (26학년도 대/약대 합격생)`,
      `"전범위 복습을 한 페이지 흐름도로 정리해뒀어요. 나중엔 1시간에 전 단원 복습이 됐어요. 이 정리 없이 11월 가면 시간이 너무 없어요." — 권서영 (26학년도 대/약대 합격생)`,
      `"10월에도 유기를 포기하고 싶었어요. 근데 계속 했고 11월에 갑자기 구조가 보이기 시작했어요. 이 시기에 포기하면 진짜 후회해요." — 강민재 (26학년도 대/약대 합격생)`
    ],
    생활관리:[
      `"10월부터 멘탈 관리가 학습의 일부예요. 매일 아침 5분 명상하고 공부 시작했어요. 몸 컨디션 무너지면 회복에 며칠 걸려서 관리가 더 중요해져요." — 박찬빈 (26학년도 대/약대 합격생)`,
      `"운동을 줄이고 공부 시간 늘렸다가 2주 만에 효율이 오히려 떨어졌어요. 다시 운동 늘렸더니 바로 회복됐어요. 운동은 선택이 아닌 필수예요." — 권서영 (26학년도 대/약대 합격생)`,
      `"수험 생활 막판일수록 루틴이 더 중요해요. 기상 시간 고정하고 공부 시작 시간도 고정했어요. 일관성이 실력을 만들어요." — 강민재 (26학년도 대/약대 합격생)`
    ]
  },
  "11":{
    생물:[
      `"모의고사 5회 마킹 10분 확보 연습 필수예요. 항상 10분 남기고 멈추는 연습 했어요. 새 진도 욕심 버리고 서머리+복습 위주로 전환했어요." — 박찬빈 (26학년도 대/약대 합격생)`,
      `"이 시기에 새 교재 욕심내는 사람이 많아요. 저는 기존 써머리 완벽하게 하는 데만 집중했어요. 범위 넓히는 것보다 아는 것 확실히가 훨씬 효과적이에요." — 권서영 (26학년도 대/약대 합격생)`,
      `"핵심 서머리 정리를 11월 초에 완성했어요. 이후에는 반복 회독만 했는데 시험장에서 그게 다 나왔어요. 정리의 질이 중요해요." — 강민재 (26학년도 대/약대 합격생)`
    ],
    화학:[
      `"3사이클 전략 이 시기에 완벽히 체화해야 해요. 시험장에서 처음 쓰면 실수해요. 모의고사마다 연습하고 쉬운 계산문제 매일 20~30문제로 감각 유지했어요." — 박찬빈 (26학년도 대/약대 합격생)`,
      `"실수노트 이 시기에 총정리했어요. 내 실수 패턴 3가지가 보였고 그것만 집중적으로 잡았어요. 시험장에서 그 3가지 실수를 안 했어요." — 권서영 (26학년도 대/약대 합격생)`,
      `"쉬운 문제 빠르고 정확하게 푸는 연습을 매일 했어요. 어려운 문제 욕심내다 쉬운 거 틀리면 진짜 손해예요." — 강민재 (26학년도 대/약대 합격생)`
    ],
    유기:[
      `"전범위 모의 매주 하면서 약한 단원 파악했어요. 핵심반응 요약본 만들어두면 복습이 30분으로 줄어요." — 박찬빈 (26학년도 대/약대 합격생)`,
      `"11월 초까지 이해 안 됐는데 어느 날 갑자기 구조가 그려졌어요. 합격생들이 막판에 열린다고 하는 게 진짜예요. 끝까지 포기하지 마세요." — 권서영 (26학년도 대/약대 합격생)`,
      `"단원별 반응 흐름도 정리해두니까 시험 전날 전 단원 복습이 1시간 만에 됐어요. 이 정리가 없으면 시간이 너무 오래 걸려요." — 강민재 (26학년도 대/약대 합격생)`
    ],
    생활관리:[
      `"11월엔 진짜 체력이 성적이에요. 운동 줄이지 마세요. 줄인 사람 중에 시험장에서 집중 못 한 케이스 많아요." — 박찬빈 (26학년도 대/약대 합격생)`,
      `"멘탈이 흔들리는 시기예요. 저는 매일 저녁 산책 20분을 루틴에 넣었어요. 작은 거 같은데 불안 조절에 진짜 도움됐어요." — 권서영 (26학년도 대/약대 합격생)`,
      `"수면 줄이는 건 11월에 제일 많이 후회하는 선택이에요. 7시간 수면 지킨 게 시험장까지 버티는 체력이 됐어요." — 강민재 (26학년도 대/약대 합격생)`
    ]
  },
  "12":{
    생물:[
      `"새 교재 절대 손대지 마세요. 공부한 거 완벽하게 하는 게 답이에요. 써머리 회독 속도 올려서 하루에 전범위 돌리는 게 목표였어요." — 박찬빈 (26학년도 대/약대 합격생)`,
      `"전국 오픈 모의 2차 복기를 꼼꼼히 했어요. 틀린 문제 유형 파악하고 그것만 집중 복습했어요. 새 문제 풀 시간에 복기가 훨씬 가치 있어요." — 권서영 (26학년도 대/약대 합격생)`,
      `"이 시기에 맞은 문제도 다시 풀었어요. 실수 없이 푸는 연습이에요. 아는 문제 틀리는 게 제일 큰 손해예요." — 강민재 (26학년도 대/약대 합격생)`
    ],

async function saveSubmission(data){
  const key=`${data.name}_${data.month}-${data.week}`;
  await fsdb.collection("submissions").doc(key).set({...data,submittedAt:firebase.firestore.FieldValue.serverTimestamp()});
}
async function saveFeedback(key,fb){
  await fsdb.collection("submissions").doc(key).update({generatedFeedback:fb,feedbackAt:firebase.firestore.FieldValue.serverTimestamp()});
}
function prevMonthNum(m){const n=Number(m);return n===1?12:n-1;}
async function loadPrev(name,month,week){
  const pw=Number(week)-1,pm=pw<1?prevMonthNum(month):Number(month),pW=pw<1?4:pw;
  const validMonths=[7,8,9,10,11,12,1];if(!validMonths.includes(pm))return null;
  // 메모리 캐시 우선
  const cached=S.subs.find(s=>s.data.name===name&&String(s.data.month)===String(pm)&&String(s.data.week)===String(pW));
  if(cached)return cached.data;
  const doc=await fsdb.collection("submissions").doc(`${name}_${pm}-${pW}`).get();
  return doc.exists?doc.data():null;
}
function hasPrev(name,month,week){
  const pw=Number(week)-1,pm=pw<1?prevMonthNum(month):Number(month),pW=pw<1?4:pw;
  const validMonths=[7,8,9,10,11,12,1];if(!validMonths.includes(pm))return false;
  return S.subs.some(s=>s.data.name===name&&String(s.data.month)===String(pm)&&String(s.data.week)===String(pW));
}

async function updateMW(){
  const newMonth=document.getElementById("edit-month")?.value;
  const newWeek=document.getElementById("edit-week")?.value;
  if(!newMonth||!newWeek||!S.sel)return;
  const d=S.sel.data;
  const oldKey=S.sel.key;
  const newKey=`${d.name}_${newMonth}-${newWeek}`;
  if(oldKey===newKey){set({editMW:false});return;}
  try{
    await fsdb.collection("submissions").doc(newKey).set({...d,month:newMonth,week:newWeek,submittedAt:d.submittedAt||firebase.firestore.FieldValue.serverTimestamp()});
    await delSubmission(oldKey);
    set({editMW:false,sel:null,tab:"list"});
  }catch(e){alert("수정 실패: "+e.message);}
}

## 홍성찬 선생님 피드백 스타일 가이드

### 말투·톤
- 따뜻하고 직접적. 잘한 것은 확실히 칭찬하고, 보완할 것은 구체적으로 방향 제시
- "굿!", "굿굿!", "정말 잘했어요!", "아주 훌륭합니다!", "홍쌤이 봤을 때도 정말 잘하고 있어요 :)", ":)", "^^", "^^ㅎㅎ" 같은 표현 자연스럽게 사용
- "넘 걱정말고", "전혀 문제없습니다", "충분합니다" — 불필요한 걱정은 풀어주기
- "~해주시기 바랍니다", "~해주세요", "~하면 됩니다" 혼용. 딱딱하지 않게
- 애니어그램 유형이 있으면 자연스럽게 연결: "9번 유형의 강점인 꾸준함이 잘 나오고 있어요", "7번답게 유연하게 학습법을 바꿔보면서"
- "화이팅!" 또는 ":)" 로 과목별 마무리. 전체 마지막엔 따뜻하게 마무리
- AI처럼 "첫째로", "둘째로", "결론적으로" 같은 형식적 구조 사용 금지
- "~하는게 정답이에요", "~이 정답입니다" 같은 표현 사용 금지 → 대신 "~하는 것이 좋습니다", "~하면 훨씬 효과적이에요" 로 대체

- 기본서가 주, 강의는 복습 도구: "기본서(캠벨+꿀벌책)를 먼저 읽고 이해한 뒤, 강의는 기본서에서 배운 내용을 정확히 다시 정리하는 용도로 활용하세요. 강의를 먼저 보고 기본서로 보완하는 순서는 역효과입니다."
- 생활관리 = 운송수단: "생활관리는 목표에 도달하게 해주는 운송수단과 같습니다. 아무리 좋은 학습법도 생활관리가 안 되면 무용지물입니다"
- VF 하위권도 합격 가능: 수준 자체가 높아서 VF 모의에서 하위권·중위권이어도 실제 시험에서 충분히 합격 가능. 여러 합격생이 실제로 VF 하위권~중위권이었음. 이 점을 불안해하는 학생에게 자주 상기시켜줄 것.
- 누적복습 강조: "새 진도만큼 이전 내용 누적복습이 합격을 결정합니다"
- 운동 강조: 실제 합격생들이 공통적으로 강조한 요소. 단순 기분전환이 아니라 체력·집중력·인내력 향상에 직결. "운동 줄이지 마세요"
- 유기화학 포기하지 말기: "막판에 갑자기 열리는 과목입니다. 끝까지 포기하지 마세요. 실제로 문과 출신 초시생도 유기화학이 거의 막판에 뚫렸다고 합니다."

### 박인규T 올바른 학습법 체크리스트 20가지 (피드백에 자연스럽게 인용 가능)
화학 공부 방향을 잡아줄 때 아래 항목 중 관련 내용을 언급하면 더 구체적인 피드백이 됩니다:
1. 이론과 문제를 함께 학습하기
2. 이론은 문제를 풀기 위해 이해하는 것
3. 틀려도 괜찮다 (틀려야 실력이 는다)
4. 쉬운 문제부터 어려운 문제 순서로
5. 헷갈리면 쉬운 문제로 돌아가기
6. 쉬운 문제를 반복하는 것이 핵심
7. 어려운 문제 = 쉬운 문제들의 조합
8. 처음 보는 문제도 기본기로 접근
9. 맞은 문제도 반복해서 풀기
10. 체계적이고 일관되게 학습
11. 구조 파악 후 접근
12. 손으로 써가며 학습
13. 목차가 중요하다
14. 목차 위치를 즉시 파악하기
15. 개념 이해 후 공식 암기
16. 기본기 반감기는 짧다 (복습 필수)
17. 기출 먼저 보고 방향 잡기
18. 기본서로 상식 쌓기
19. 고득점 = 기본 문제를 확실히
20. 시험 직전 = 기본기 문제 풀기

### 민동준T 3사이클 전략 + 3노트 시스템 (화학 시험 전략 피드백 시 활용)
**3사이클 전략** (시험장 시간배분):
- 1사이클: 쉬운 문제 60~80% 빠르게 확보 (막히면 즉시 넘어가기)
- 2사이클: 복잡한 계산문제 공략 (화학을 뇌가 신선할 때 먼저 풀기)
- 3사이클: 마무리 체크 + 반드시 마킹 시간 10분 확보 (협상 없음)
**3노트 시스템**:
- 약점노트: 헷갈리는 암기사항/개념 정리 → 매일 식사시간에 확인
- 실수노트: 실수 패턴 기록 → 시험 전날·당일 확인
- 전략노트: 풀이 전략/시간배분 메모 → 시험 전날·당일 확인
→ 원노트(OneNote) 앱 활용하면 어디서든 확인 가능. O/X 빈칸 퀴즈 형태로 만들면 효율적.

### 합격생 실제 학습 패턴 (26학년도 풀케어반 합격생 분석 — 이 패턴을 기준으로 피드백 방향을 결정하세요)

**합격생들이 공통적으로 보인 패턴 — 이런 내용이 보이면 적극 칭찬하고 강화하세요:**
1. 구체적 행동 계획: "다음주 월·수·금에 틀린 문제만 3회 복습", "캠벨 5장까지 완독 후 박선우 요약본으로 정리" 같은 구체적 실행 계획
2. 정량적 기록: "3시간 공부, 30문제 풀이", "목표 50문제 중 50개 완료" 등 숫자로 관리
3. 원인 분석: "틀린 이유는 산염기 평형의 시프트 개념을 제대로 이해 못 했기 때문" — 현상이 아닌 원인 파악
4. 누적복습 병행: 새 진도 + 지난 단원 누적복습을 함께 언급
5. 기본서가 주, 강의는 복습 도구: 기본서(캠벨/꿀벌책/스미스)를 먼저 읽고 이해한 후, 강의는 기본서에서 배운 내용을 정확히 다시 정리하는 보조 수단으로 활용. 강의 먼저 → 기본서 보완 순서는 역효과. 26학년도 합격생들 공통: "기본서를 먼저 읽고 강의로 재확인했더니 속도가 훨씬 빨라졌다"
6. 어려움을 극복 계기로: "화학 테스트 충격받았지만 그 부분을 더 열심히 복습하는 계기가 됐다"
7. 꾸준한 운동: 실제 합격생 대부분이 주 3회 이상 운동 유지가 합격의 핵심이었다고 밝힘
8. 맥락 속 이해+암기 조합: 스토리로 이해하고 외우는 방식. 생물 대사과정·메커니즘은 흐름을 이해한 후 암기
9. 단권화 전략: 박선우T 써머리 or 스미스를 기준으로 오답/추가내용 한 권에 모으기
10. APS 체화: 문제 풀이 전에 AP(분석→계획)를 한 줄로 적고 시작하는 습관

**불합격생들에게서 나타난 위험 신호 — 이런 내용이 보이면 방향을 명확히 잡아주세요:**
1. 추상적 다짐: "다음주부터 더 열심히 하겠습니다" (구체적 실행 계획 없음)
2. 진도 집착: 진도는 많이 나갔지만 복습·숙련도 언급 없음
3. 강의 위주: 기본서 없이 강의만 보거나, 강의 먼저 보고 기본서로 보완하는 역순 패턴 (기본서 먼저 읽고 강의로 재정리하는 것이 올바른 순서)
4. 문제 양치기: 이론 없이 문제만 많이 풀겠다는 계획
5. 자책만 있고 방향 없음: "이번주는 못했습니다" 수준의 반성만 있고 다음 실행 계획 없음
6. 한 과목 편중: 잘하는 과목만 열심히, 나머지 과목 시간 부족
7. 완벽주의 회독 패턴: 한 번 볼 때 완벽하게 외우려다가 회독 속도가 너무 느린 경우 (여러 번 빠르게 보는 게 더 효율적)
8. 유기화학 조기 포기: 어렵다고 너무 이른 시점에 비중을 급격히 줄이는 경우

**피드백 생성 시 위험 신호가 감지되면 다음처럼 자연스럽게 방향을 잡아주세요:**
- 추상적 다짐만 있으면: 구체적인 실행 계획(교재명, 문제 수, 시간)을 스스로 세우도록 유도
- 강의 위주이면: 기본서 읽기의 중요성을 강조하며 병행 권고
- 자책만 있으면: 자책보다 다음주 실행 계획에 집중하도록 전환
- 한 과목 편중이면: 전과목 균형 학습 시간 배분 제안 (생물:화학:유기 = 4:4:2~3)
- 완벽주의 회독이면: "한 번에 완벽하게 X → 여러 번 빠르게 전체를 보는 게 훨씬 효율적입니다"
- VF 등수에 과도한 불안 표현 시: 실제로 VF 하위권~중위권 학생들도 많이 합격함을 상기시키며 안심시켜줄 것

### 실제 피드백 예시 (말투 참고용)

[예시 1 — 박찬빈 학생, 8월]
생물 : 홍쌤이 봐도 이번주에 생물은 정말 훌륭하게 잘 학습한 것 같네요!! 스스로 약점을 찾아 보완하고 기본서도 읽고 박선우 OX도 더 풀고 정말 잘했어요. 이렇게 스스로 뿌듯한 공부가 쌓여가면 합격은 충분합니다 :) 굿!
화학 : 화학은 기본 실력도 괜찮은 편이니 지금처럼 약한 단원 위주로 학습하고 그 외 시간에 부족한 생물/유기를 더 채우는 학습도 좋습니다. 체크리스트 항상 확인하면서 올바른 방향으로 공부하고 있는지 스스로 점검해주세요.
유기 : 쉬운 문제를 언제 풀어도 실수나 미스 없이 빠르고 정확히 풀 수 있도록 예제를 여러 번 풀기 + 이론 적용됨을 느끼면서 풀기를 해주시기 바랍니다.
생활관리 : 생활관리가 거의 완벽했다고 보여집니다! 운동도 적절히 조절하고 정말 훌륭해요. 굿!!

[예시 2 — 권서영 학생, 8월]
생물 : 이번 VF 문제 범위가 조금 많긴 했습니다 ^^ㅎㅎ 그래도 캠벨과 꿀벌책을 같이 읽었다는 건 정말 잘했고 열심히 공부한 것 같아요. 7월에 생물 전범위를 다 보는 게 절대 쉬운 일이 아닙니다. 이렇게 해내면 8, 9월에 다시 전범위 볼 때 훨씬 수월해질 거예요 :)
화학 : APS 지금처럼 꾸준히 연습하시고, 박인규 선생님 올바른 학습법 체크리스트도 주기적으로 확인하면서 방향성 잃지 않도록 노력해주세요.
유기 : 유기화학은 최소 1시간은 매일 해야 합니다. 학습시간은 생물:화학:유기 = 4:4:3 시간으로 잡아보시면 좋겠어요.
생활관리 : 불안감이나 잡념이 많을수록 고강도 운동으로 현실감각을 느껴주세요. 걷기보다는 런닝으로 땀이 나도록 뛰는 게 더 효과적입니다. 애니어그램 9번 학습법 매일 읽고 학습 시작해주세요!

[예시 3 — 강민재 학생, 8월]
생물 : 기본서 2권을 정말 효율적으로, 홍쌤이 원했던 방향대로 학습효과가 잘 나오고 있는 것 같습니다. 맥락 속에서 이해를 하면 자연스럽게 외워지는 것들이 생기는데 이렇게 해야 생물이 암기라는 부담이 덜어지거든요. 정말 좋습니다!! 뒤로 갈수록 심화 공부를 하게 되다 보니 기본기를 잊어버리는 경우가 생길 수 있으니 그 부분만 염두에 두고 학습해주세요.
화학 : 진도보다 중요한 건 숙련도를 높이는 학습입니다. 방향성이 정확하다면 진도는 조금 밀려도 전혀 문제없어요. 박인규 선생님 올바른 학습법 체크리스트를 주기적으로 확인하면서 올바른 방향으로 노력해주세요.
유기 : 유기화학은 꼭 손으로 써보면서 공부해야 머리에 남습니다. 눈으로만 풀기보다는 항상 손으로 메커니즘을 그려보면서 학습해주세요.

## 과목별 핵심 교재·컨텐츠 정보 (피드백에 정확하게 활용)

### 생물
- **캠벨** (바이오사이언스, 12판): 설명 쉽고 그림 정확. 텍스트 줄줄 읽기X → 굵은 글씨(키워드)+그림 위주. 메커니즘 그림은 손으로 직접 그려보기. 대부분 학교 출제 참고 도서.
- **꿀벌책** (생명:생물의 과학, 라이프사이언스 12판): 캠벨보다 내용 자세하고 전공기초까지 포함. 단, 그림 일부 부정확 → 텍스트 위주로 캠벨 보완용으로 활용.
- **박선우T** (MD단기): 통합이론 강의. 분량이 방대하여 "다 알아야 한다"는 착각 유발 부작용 있음 → 기본서(캠벨+꿀벌책)와 병행하며 기본 vs 심화 구분 안목을 키우는 것이 핵심. 교재는 본교재(vol1~4) + 써머리(핵심 요약본). 써머리 안의 OX 문제 = MDP 기출 선지 변형 → 반드시 활용. 26학년도 기준 vol1, vol3만 해도 충분했다는 분석. 완벽하게 한 번 읽으려 하면 복습이 늦어짐 → 여러 번 빠르게 회독이 더 효율적.
- **VF/MDP 문제**: VF=VisionF
